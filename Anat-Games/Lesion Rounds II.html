<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Lesion Rounds II</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --ground:#E9EEF2; --sheet:#FBFCFD; --sunk:#F1F5F8; --rule:#C8D3DA; --ink:#13212B; --muted:#5B6B76;
  --pen:#C8352B; --pen-soft:#F7E1DE;
  --p1:#D9730D; --p1-ink:#9A4F05; --p1-soft:#FBEBDA;
  --p2:#2F6FB5; --p2-ink:#1F5590; --p2-soft:#DFEAF6;
  --good:#1D8352; --good-soft:#DDF1E6; --bad:#C8352B; --bad-soft:#F7E1DE;
  --hy-bg:#FFF4C2; --hy-line:#D4A300; --hy-ink:#4A3A00;
  --hatch:#DCE4EA;
  --display:"Archivo Narrow","Arial Narrow",sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F171C; --sheet:#172229; --sunk:#131D23; --rule:#2A3A43; --ink:#E3ECF0; --muted:#8FA3AD;
    --pen:#F0675B; --pen-soft:#3A1E1C;
    --p1:#F29A3F; --p1-ink:#F6B06A; --p1-soft:#33230F;
    --p2:#6AA8EC; --p2-ink:#8DBDF2; --p2-soft:#162A40;
    --good:#4CC38A; --good-soft:#15301F; --bad:#F0675B; --bad-soft:#3A1E1C;
    --hy-bg:#342D0E; --hy-line:#C9A227; --hy-ink:#F4E3A1;
    --hatch:#1F2B32;
  }
}
:root[data-theme="dark"]{
    --ground:#0F171C; --sheet:#172229; --sunk:#131D23; --rule:#2A3A43; --ink:#E3ECF0; --muted:#8FA3AD;
    --pen:#F0675B; --pen-soft:#3A1E1C;
    --p1:#F29A3F; --p1-ink:#F6B06A; --p1-soft:#33230F;
    --p2:#6AA8EC; --p2-ink:#8DBDF2; --p2-soft:#162A40;
    --good:#4CC38A; --good-soft:#15301F; --bad:#F0675B; --bad-soft:#3A1E1C;
    --hy-bg:#342D0E; --hy-line:#C9A227; --hy-ink:#F4E3A1;
    --hatch:#1F2B32;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:16px/1.5 var(--body);padding-inline:16px;padding-block:16px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1.5px solid var(--ink);padding-bottom:8px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.02em}
.brand b{color:var(--pen)}
.hint{margin:0;font-size:13.5px;color:var(--muted)}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--muted);background:var(--sheet)}
.btn{background:var(--ink);color:var(--ground);border:0;border-radius:3px;padding:9px 15px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn.pen{background:var(--pen);color:#fff}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* setup */
.setup{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}
.hero{display:flex;flex-direction:column;gap:14px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(44px,6.6vw,80px);line-height:.9;margin:0;text-transform:uppercase;text-wrap:balance}
.hero h1 span{color:var(--pen);text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
.hero p{margin:0;max-width:56ch;color:var(--muted)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{border:1px solid var(--rule);background:var(--sheet);border-radius:3px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.type b{font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.02em}
.type span{font-size:13.5px;color:var(--muted)}
.type em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--pen)}
.form{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:18px;display:flex;flex-direction:column;gap:16px}
.fl{display:flex;flex-direction:column;gap:6px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names input{width:100%;background:var(--sunk);border:1px solid var(--rule);border-radius:3px;padding:8px 10px;border-left:5px solid var(--p1)}
.names input#p2name{border-left-color:var(--p2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{background:var(--sunk);border:1px solid var(--rule);border-radius:3px;padding:6px 10px;font-size:14px;display:flex;align-items:center;gap:6px}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chipbtn em{font-style:normal;font-family:var(--mono);font-size:10.5px;opacity:.7}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.seg button{flex:1;min-width:64px;background:var(--sunk);border:0;border-right:1px solid var(--rule);padding:8px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:600}
.go{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.04em;background:var(--pen);color:#fff;border:0;border-radius:3px;padding:10px}
.go:disabled{opacity:.4;cursor:not-allowed}

/* board */
.board{display:grid;grid-template-columns:1fr auto 1fr;border:1.5px solid var(--ink);border-radius:3px;background:var(--sheet)}
.pl{display:flex;align-items:center;gap:12px;padding:8px 14px;position:relative}
.pl.p2{flex-direction:row-reverse;text-align:right}
.pl .nm{font-weight:700}
.pl .meta{font-family:var(--mono);font-size:11px;color:var(--muted)}
.pl .sc{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;margin-left:auto}
.pl.p2 .sc{margin-left:0;margin-right:auto}
.pl.p1 .sc{color:var(--p1-ink)} .pl.p2 .sc{color:var(--p2-ink)}
.pl.on.p1{background:var(--p1-soft);box-shadow:inset 0 -4px 0 var(--p1)}
.pl.on.p2{background:var(--p2-soft);box-shadow:inset 0 -4px 0 var(--p2)}
.pl.lock{opacity:.45}
.pl .key{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);border-radius:3px;padding:1px 6px;color:var(--muted)}
.mid{border-inline:1.5px solid var(--ink);padding:6px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:110px}
.mid .n{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.timer{height:5px;background:var(--hatch);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--ink);transform-origin:left;transition:transform .25s linear}
.timer.warn i{background:var(--pen)}

/* round */
.round{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;box-shadow:0 1px 0 var(--rule)}
.sheet-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1.5px solid var(--ink)}
.sheet-head h2{margin:0;font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:112px 1fr;border-bottom:1px solid var(--rule);min-height:46px}
.row:last-child{border-bottom:0}
.row .sys{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 10px 10px 14px;border-right:1px solid var(--rule)}
.row .fx{padding:10px 14px;font-size:16px}
.row.hidden .fx{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px);color:var(--muted);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center}
.row.new .fx{animation:ink .5s ease-out}
@keyframes ink{from{background:var(--pen-soft)}to{background:transparent}}
.row.hist .fx{font-style:italic}
.row .pts{font-family:var(--mono);font-size:10px;color:var(--pen);margin-left:8px;font-style:normal}
.stem{margin:0;padding:14px;font-size:17px;line-height:1.55}
.stem strong{color:var(--pen)}
.ddx{display:flex;flex-direction:column;gap:10px}
.ddx h3{margin:0;font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1.5px solid var(--ink);padding-bottom:4px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;text-align:left;background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:8px 12px;font-size:15.5px}
.opt .lt{font-family:var(--display);font-weight:700;font-size:17px;width:26px;height:26px;border:1.5px solid var(--rule);border-radius:50%;display:grid;place-items:center}
.opt:not(:disabled):hover{border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.wait{opacity:.7}
.opt.out{opacity:.35;text-decoration:line-through}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.right .lt{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .lt{background:var(--bad);border-color:var(--bad);color:#fff}
.buzz{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.buzz button{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;border:0;border-radius:3px;padding:12px 8px;line-height:1.05}
.buzz button small{display:block;font-family:var(--mono);font-size:10.5px;font-weight:400;opacity:.85}
.buzz .b1{background:var(--p1);color:#1d1000} .buzz .b2{background:var(--p2);color:#fff}
.buzz button:disabled{opacity:.3;cursor:not-allowed}
.status{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:3px;border:1px solid var(--rule)}
.chip.p1{background:var(--p1);border-color:var(--p1);color:#1d1000}
.chip.p2{background:var(--p2);border-color:var(--p2);color:#fff}
.chip.pen{border-color:var(--pen);color:var(--pen)}

/* lesion card */
.card{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--good);border-radius:3px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card.miss{border-left-color:var(--bad)}
.card h4{margin:0;font-family:var(--display);font-size:22px;line-height:1.1}
.card .verdict{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.card.miss .verdict{color:var(--bad)} .card:not(.miss) .verdict{color:var(--good)}
.fxlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.fxlist li{display:grid;grid-template-columns:94px 1fr;gap:8px}
.fxlist li span:first-child{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--muted);padding-top:3px}
.fxlist li.hit{font-weight:600}
.fxlist li.hit span:first-child{color:var(--pen)}
.fxlist li.hit span:first-child::before{content:'● '}
.fxlist li small{display:block;color:var(--muted);font-weight:400}
.spared{font-size:13.5px;color:var(--muted)}
.spared b{color:var(--ink)}
.lin{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:13.5px}
.lin b{font-family:var(--mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:3px;border:1px solid var(--rule);color:var(--muted)}
.lin-br b{border-color:var(--p2);color:var(--p2-ink);background:var(--p2-soft)}
.lin-cn b{border-color:var(--ink);color:var(--ground);background:var(--ink)}
.lin-gg b{border-color:var(--p1);color:var(--p1-ink);background:var(--p1-soft)}
.lin-no b{border-style:dashed}
.hy{background:var(--hy-bg);border:1.5px solid var(--hy-line);color:var(--hy-ink);border-radius:3px;padding:9px 12px;font-size:14.5px}
.hy b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}

/* end + atlas */
.end{display:flex;flex-direction:column;gap:18px}
.end h2{font-family:var(--display);font-size:clamp(40px,6vw,68px);line-height:.92;margin:0;text-transform:uppercase;text-wrap:balance}
.end h2 .w1{color:var(--p1-ink)} .end h2 .w2{color:var(--p2-ink)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pcard{background:var(--sheet);border:1px solid var(--rule);border-top:5px solid var(--p1);border-radius:3px;padding:14px;display:flex;flex-direction:column;gap:8px}
.pcard.c2{border-top-color:var(--p2)}
.big{font-family:var(--display);font-weight:700;font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
td,th{padding:4px 6px;border-bottom:1px solid var(--rule);text-align:left}
th{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:400}
td.n,th.n{text-align:right}
.review{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:360px;overflow:auto}
.review li{font-size:14px;border-left:3px solid var(--pen);padding-left:9px}
.review li span{display:block;font-size:13px;color:var(--muted)}
.atlas{display:flex;flex-direction:column;gap:16px}
.atlas-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.atlas-top input{flex:1;min-width:200px;background:var(--sheet);border:1px solid var(--rule);border-radius:3px;padding:8px 10px}
.atlas h3{margin:6px 0 0;font-family:var(--display);font-size:24px;text-transform:uppercase;border-bottom:1.5px solid var(--ink)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.agrid .card{border-left-color:var(--rule)}
.foot{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:8px;text-transform:uppercase}
@media (max-width:860px){
  .setup,.round,.cards{grid-template-columns:1fr}
  .types,.names{grid-template-columns:1fr}
  .pl{padding:6px 8px;gap:6px}.pl .sc{font-size:30px}.pl .meta,.pl .key{display:none}
  .mid{min-width:70px;padding:6px}
  .row{grid-template-columns:84px 1fr}
  .agrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ---------- Lesion atlas data ----------
   SIG: id -> [exam system, finding, why it happens]
   MINOR: true findings that are never used as the "expected" answer (conditional / subtle)
   NODES: lesions. own = its own findings, inc = lesions it contains, spared = classic "NOT seen" findings
*/
/* ---------- Lesion atlas II: cranial nerves and their branches ---------- */
const SIG = {
 /* V1 / V2 */
 zf_skin:["Sensory","Numbness of the skin over the cheek prominence","The zygomaticofacial n. (V2) exits the zygomaticofacial foramen."],
 zt_skin:["Sensory","Numbness of the skin over the anterior temple","The zygomaticotemporal n. (V2) exits into the temporal fossa."],
 zyg_tear:["Autonomic","Reduced tearing on that side","The zygomatic n. hands pterygopalatine ganglion fibers to the lacrimal n."],
 psa_teeth:["Sensory","Numbness of the upper molars and the maxillary sinus lining","Posterior superior alveolar nn. enter the back of the maxilla."],
 asa_teeth:["Sensory","Numbness of the upper incisors and canine","The anterior superior alveolar n. branches from the infraorbital n. in its canal."],
 asa_nose:["Sensory","Numbness of the front of the nasal floor and septum","The anterior superior alveolar n. gives a nasal branch."],
 lp_palate:["Sensory","Numbness of the SOFT palate","The lesser palatine n. (V2) exits the lesser palatine foramina."],
 v2_naso:["Sensory","Numbness of the roof of the nasopharynx and auditory tube opening","The pharyngeal branch of V2 passes through the palatovaginal canal."],
 io_lid:["Sensory","Numbness of the lower eyelid and side of the nose","Palpebral and nasal branches of the infraorbital n. (V2)."],
 /* V3 */
 mass_weak:["Motor","Weak jaw clenching; the masseter does not bulge when biting down","The masseteric n. (V3) crosses the mandibular notch to masseter."],
 temp_weak:["Motor","Weak jaw closing with hollowing of the temple over time","Deep temporal nn. (V3) supply temporalis, which wastes when denervated."],
 temp_retract:["Motor","Cannot pull the jaw backward (retraction)","The posterior fibers of temporalis retract the mandible."],
 lp_dev:["Motor","Jaw deviates TOWARD the weak side when opening the mouth","The intact lateral pterygoid pulls its condyle forward, swinging the jaw to the weak side."],
 lp_protrude:["Motor","Cannot protrude the jaw or move it to the opposite side","Lateral pterygoid protrudes the mandible and produces side-to-side grinding."],
 mp_close:["Motor","Weak jaw elevation (closing), with grinding affected","The nerve to medial pterygoid (V3) supplies this jaw elevator."],
 tvp_tube:["Motor","Poor opening of the auditory tube — ear fullness, fluid behind the drum","Tensor veli palatini (nerve to medial pterygoid, V3) opens the tube when swallowing."],
 tt_loud:["Motor","Louder-than-normal perception of low sounds (tensor tympani weakness)","Tensor tympani (V3) damps the tympanic membrane."],
 myl_floor:["Motor","Weak elevation of the floor of the mouth and hyoid during swallowing","Nerve to mylohyoid (V3) supplies mylohyoid and the anterior belly of digastric."],
 ling_touch:["Sensory","Loss of touch, pain, and temperature on the anterior 2/3 of the tongue and floor of the mouth","General sensation there is carried by the lingual n. (V3)."],
 ling_taste_ok:["Special sense","Taste on the anterior 2/3 is PRESERVED","A lesion proximal to the chorda tympani junction spares taste fibers, which join the lingual n. lower down."],
 /* VII */
 gp_tear:["Autonomic","Dry eye — no reflex tearing on that side","Greater petrosal n. (CN VII) → pterygopalatine ganglion → lacrimal gland."],
 gp_nose:["Autonomic","Dry nasal and palatal mucosa","Pterygopalatine ganglion fibers supply nasal and palatine glands."],
 stap_hyper:["Special sense","Hyperacusis — ordinary sounds are uncomfortably loud","The nerve to stapedius (CN VII) damps ossicle movement."],
 pa_occip:["Motor","Cannot wrinkle the scalp backward or move the auricle","The posterior auricular n. (CN VII) supplies the occipital belly and auricular muscles."],
 vii_digas2:["Motor","Weak elevation of the hyoid during swallowing (posterior digastric and stylohyoid)","Branches of CN VII just outside the stylomastoid foramen."],
 ct_taste2:["Special sense","Loss of taste from the anterior 2/3 of the tongue","Chorda tympani (CN VII) carries these taste fibers."],
 ct_saliva:["Autonomic","Dry mouth from reduced submandibular and sublingual saliva","Chorda tympani preganglionics synapse in the submandibular ganglion."],
 face_all:["Motor","Weakness of every facial expression muscle on that side, forehead included","A lower motor neuron CN VII lesion spares nothing."],
 face_pes:["Motor","Weakness confined to the facial muscles, with normal taste, tears, and hearing","Inside the parotid, CN VII carries only its five motor branches."],
 rh_vesicle:["History","Painful vesicles in the ear canal or on the auricle","Varicella-zoster reactivating in the geniculate ganglion (Ramsay Hunt syndrome)."],
 rh_vertigo:["Special sense","Vertigo and hearing loss alongside facial palsy","Ramsay Hunt often spreads to the nearby CN VIII."],
 ni_only:["Special sense","Taste and tear loss WITHOUT facial muscle weakness","The nervus intermedius carries CN VII's sensory and parasympathetic fibers only."],
 /* IX / X */
 tymp_ear:["Sensory","Loss of sensation of the middle ear and inner surface of the eardrum","The tympanic n. (CN IX) forms the tympanic plexus."],
 lpn_parotid:["Autonomic","Dry mouth from reduced parotid secretion","Lesser petrosal n. (CN IX) → otic ganglion → auriculotemporal n. → parotid."],
 hering_baro:["Reflex","Loss of the baroreceptor reflex — blood pressure swings, fainting when the neck is pressed","The carotid sinus n. of Hering (CN IX) carries carotid sinus and body afferents."],
 ix_phar_sens:["Sensory","Numbness of the oropharynx — no gag when that side is touched","Pharyngeal branches of CN IX are the sensory limb of the gag reflex."],
 ix_tonsil:["Sensory","Numbness of the tonsillar bed (referred ear pain after tonsillectomy)","Tonsillar branches of CN IX also share fibers with the ear."],
 ix_taste2:["Special sense","Loss of taste AND touch on the posterior 1/3 of the tongue","The lingual branch of CN IX carries both."],
 x_phar_motor:["Motor","Palate droops and the uvula deviates AWAY from the lesion; nasal regurgitation","The pharyngeal branch of CN X supplies the palate and constrictors."],
 x_ear_cough:["Reflex","Coughing when the ear canal is touched or cleaned","The auricular branch of CN X (Arnold nerve) supplies part of the canal."],

 x_cardiacb:["br","Branch of CN X (vagus nerve)"],

};
const LIN_LBL = {cn:"Cranial nerve",br:"Cranial nerve branch",gg:"CN ganglion",no:"Not a cranial nerve",site:"Site"};

<script>
(function(){
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LET=['A','B','C','D','E'];
const BY=Object.fromEntries(NODES.map(n=>[n.id,n]));
const SIDE_GRP={"sd2_jaw": "v3", "sd2_uvula": "ixx", "sd2_gag": "ixx", "sd2_taste_ant": "vii", "sd2_taste_post": "ixx", "sd2_tongue": "oth", "sd2_abduct": "eye", "sd2_iii_sup": "eye", "sd2_iii_inf": "eye", "sd2_tear": "vii", "sd2_hyperacusis": "vii", "sd2_hoarse": "ixx", "sd2_corneal": "v12", "sd2_masseter": "v3", "sd2_baro": "ixx"};
const TYPES={
  case:{label:'Case',desc:'Findings appear one at a time. Buzz in early for more points.',pts:'100 → 30'},
  predict:{label:'Predict',desc:'Given the lesion, pick the finding you expect.',pts:'60 · steal 30'},
  spared:{label:'Spared',desc:'Given the lesion, pick the finding you would NOT see.',pts:'60 · steal 30'},
  side:{label:'Which side?',desc:'Deviation and reflex patterns. Buzz, then name the side and nerve.',pts:'50'}
};
const CASE_PTS=[100,80,60,45,30];

/* ---- sign math ---- */
const memo={};
function signs(id){
  if(memo[id])return memo[id];
  const n=BY[id]; const s=new Set(n.own||[]);
  (n.inc||[]).forEach(c=>signs(c).forEach(x=>s.add(x)));
  return memo[id]=s;
}
function keySigns(id){const n=BY[id];const mo=new Set(n.minorOwn||[]);return [...signs(id)].filter(x=>!MINOR.has(x)&&!mo.has(x));}
function subset(a,b){for(const x of a)if(!b.has(x))return false;return true;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickDistractorNodes(T,clues,k){
  const ok=NODES.filter(n=>n.id!==T.id&&!clues.every(c=>signs(n.id).has(c)));
  const same=shuffle(ok.filter(n=>n.grp===T.grp)), other=shuffle(ok.filter(n=>n.grp!==T.grp));
  // prefer confusable: nodes that share at least one sign with target
  const share=n=>[...signs(n.id)].some(x=>signs(T.id).has(x));
  const pri=[...same.filter(share),...same.filter(n=>!share(n)),...shuffle(other.filter(share)),...other.filter(n=>!share(n))];
  const seen=new Set([T.name]);const out=[];
  for(const n of pri){if(out.length>=k)break;if(seen.has(n.name))continue;seen.add(n.name);out.push(n);}
  return out;
}
function pickDistractorSigns(T,k,exclude){
  const mine=signs(T.id); const ex=new Set(exclude||[]);
  const bad=s=>mine.has(s)||MINOR.has(s)||ex.has(s);
  const spared=shuffle((T.spared||[]).filter(s=>!bad(s)));
  const sameGrp=shuffle([...new Set(NODES.filter(n=>n.grp===T.grp&&n.id!==T.id).flatMap(n=>keySigns(n.id)))].filter(s=>!bad(s)));
  const any=shuffle(Object.keys(SIG).filter(s=>!bad(s)));
  const out=[];for(const s of [...spared,...sameGrp,...any]){if(out.length>=k)break;if(!out.includes(s))out.push(s);}
  return out;
}

/* ---- question builders ---- */
function buildCase(T){
  const key=keySigns(T.id); if(!key.length)return null;
  const mineAll=signs(T.id); let clues=null;
  for(let t=0;t<40;t++){
    const c=shuffle([...key]).slice(0,Math.min(4,key.length));
    const narrower=NODES.some(n=>n.id!==T.id&&subset(c,signs(n.id))&&signs(n.id).size<mineAll.size&&subset(signs(n.id),mineAll));
    clues=c; if(!narrower)break;
  }
  const d=pickDistractorNodes(T,clues,4); if(d.length<4)return null;
  const opts=shuffle([T,...d]);
  return {type:'case',node:T.id,clues,hist:T.cause,opts:opts.map(n=>n.name),ans:opts.indexOf(T),
    stem:'Which single lesion best explains ALL of these findings?'};
}
function lesionPhrase(T){return T.kind==='site'?`A lesion at the <strong>${esc(T.name)}</strong>`:`A lesion of the <strong>${esc(T.name)}</strong>`;}
function buildPredict(T){
  const key=keySigns(T.id); if(!key.length)return null;
  const right=key[Math.floor(Math.random()*key.length)];
  const d=pickDistractorSigns(T,4); if(d.length<4)return null;
  const opts=shuffle([right,...d]);
  return {type:'predict',node:T.id,hit:[right],opts:opts.map(s=>SIG[s][1]),sigs:opts,ans:opts.indexOf(right),
    stem:`${lesionPhrase(T)}. Which finding would you expect?`};
}
function buildSpared(T){
  const key=keySigns(T.id); if(key.length<3)return null;
  const yes=shuffle([...key]).slice(0,Math.min(4,key.length));
  const no=pickDistractorSigns(T,1)[0]; if(!no)return null;
  const opts=shuffle([...yes,no]);
  return {type:'spared',node:T.id,hit:yes,opts:opts.map(s=>SIG[s][1]),sigs:opts,ans:opts.indexOf(no),notSig:no,
    stem:`${lesionPhrase(T)}. Which finding would you <strong>NOT</strong> expect?`};
}
function cap(s){return s[0].toUpperCase()+s.slice(1);}
function buildSide(t){
  const s=t.fixed||(Math.random()<.5?'left':'right');
  const [ni,side]=t.ans(s);
  const opts=[];t.nerve.forEach(n=>['left','right'].forEach(sd=>opts.push(`${cap(sd)} ${n.charAt(0).toLowerCase()+n.slice(1)}`)));
  const ans=ni*2+(side==='left'?0:1);
  return {type:'side',tpl:t.id,stem:t.f(s),opts,ans,why:t.why,answerName:opts[ans]};
}

/* ---- state ---- */
let S,tick=null;
function fresh(){return{phase:'setup',names:['Player 1','Player 2'],types:{case:true,predict:true,spared:true,side:true},
  groups:Object.fromEntries(Object.keys(GROUPS).map(k=>[k,true])),rounds:20,timer:true,atlasQ:''};}

function makeDeck(){
  const types=Object.keys(TYPES).filter(k=>S.types[k]);
  const nodes=shuffle(NODES.filter(n=>S.groups[n.grp]));
  const sides=shuffle(SIDE.filter(t=>S.groups[SIDE_GRP[t.id]]));
  if(!nodes.length&&!sides.length)return [];
  const pools={case:[],predict:[],spared:[]};
  const deck=[];let si=0;
  const seq=[];while(seq.length<S.rounds*4){seq.push(...shuffle([...types]));}
  for(const ty of seq){
    if(deck.length>=S.rounds)break;
    if(ty==='side'){ if(!sides.length)continue; deck.push(buildSide(sides[si++%sides.length])); continue; }
    if(!nodes.length)continue;
    let q=null,tries=0;
    while(!q&&tries++<=nodes.length){
      if(!pools[ty].length)pools[ty]=shuffle([...nodes]);
      const T=pools[ty].pop();
      q=ty==='case'?buildCase(T):ty==='predict'?buildPredict(T):buildSpared(T);
    }
    if(q)deck.push(q);
  }
  return deck;
}
function begin(){
  const deck=makeDeck(); if(!deck.length)return;
  Object.assign(S,{phase:'play',deck,idx:0,turn:0,
    players:[0,1].map(()=>({score:0,right:0,tries:0,steals:0,byType:{},missed:[]}))});
  startRound();
}
function Q(){return S.deck[S.idx];}
function startRound(){
  const q=Q();
  S.r={sub:(q.type==='case'||q.type==='side')?'buzz':'answer',active:(q.type==='predict'||q.type==='spared')?S.turn:null,
       locked:[false,false],out:[],wp:[],c:1,who:null,gain:0,ok:null,msg:''};
  if(q.type==='predict'||q.type==='spared')S.turn=1-S.turn;
  setClock(q.type==='case'?8:q.type==='side'?20:45);
  render();startTimer();
}
function setClock(sec){S.r.total=S.timer?sec:0;S.r.deadline=S.timer?Date.now()+sec*1000:0;}
function totalClues(q){return q.type==='case'?q.clues.length+1:0;}

function startTimer(){stopTimer();if(!S.timer)return;tick=setInterval(()=>{if(!S.r||S.r.sub==='reveal'){stopTimer();return;}paintTimer();if(Date.now()>=S.r.deadline)onTimeout();},200);}
function stopTimer(){if(tick){clearInterval(tick);tick=null;}}
function paintTimer(){
  const t=document.querySelector('.timer');if(!t||!S.timer||!S.r||!S.r.total)return;
  const left=Math.max(0,S.r.deadline-Date.now());
  t.firstElementChild.style.transform=`scaleX(${left/(S.r.total*1000)})`;
  t.classList.toggle('warn',left<5000);
  const e=document.getElementById('secs');if(e)e.textContent=Math.ceil(left/1000)+'s';
}
function onTimeout(){
  const q=Q(),r=S.r;
  if(q.type==='case'&&r.sub==='buzz'){ if(r.c<totalClues(q)){nextClue();return;} return reveal(null,'Nobody named the lesion.'); }
  if(r.sub==='buzz')return reveal(null,'Time — nobody buzzed.');
  answer(-1);
}
function nextClue(){
  const q=Q(),r=S.r; if(q.type!=='case'||r.sub!=='buzz')return;
  if(r.c<totalClues(q)){r.c++;r.fresh=r.c;setClock(r.c===totalClues(q)?12:8);render();startTimer();}
  else reveal(null,'Nobody named the lesion.');
}
function buzz(k){
  const r=S.r;if(!r||r.sub!=='buzz'||r.locked[k])return;
  r.sub='answer';r.active=k;r.fresh=0;setClock(Q().type==='case'?20:15);render();startTimer();
}
function stat(p,type,ok){const b=p.byType[type]||(p.byType[type]={right:0,tries:0});b.tries++;if(ok)b.right++;p.tries++;if(ok)p.right++;}
function missKey(q){return q.type==='side'?'side:'+q.tpl:q.node;}
function addMiss(p,q){const k=missKey(q);if(!p.missed.includes(k))p.missed.push(k);}
function answer(i){
  const q=Q(),r=S.r;if(!r||(r.sub!=='answer'&&r.sub!=='steal'))return;
  if(i>=0&&r.out.includes(i))return;
  const k=r.active,p=S.players[k],ok=i===q.ans;
  if(i>=0&&!ok){r.wp.push(i);r.out.push(i);}
  if(q.type==='case'||q.type==='side'){
    stat(p,q.type,ok);
    if(ok){const g=q.type==='case'?CASE_PTS[Math.min(r.c,5)-1]:50;p.score+=g;r.who=k;r.gain=g;
      return reveal(true,`${S.names[k]} +${g}${q.type==='case'?` · after ${r.c} of ${totalClues(q)} clues`:''}`);}
    const pen=q.type==='case'?20:10;p.score=Math.max(0,p.score-pen);addMiss(p,q);r.locked[k]=true;
    r.msg=`${S.names[k]} ${i<0?'ran out of time':`guessed ${LET[i]}`} · −${pen}`;
    if(r.locked[0]&&r.locked[1])return reveal(false,r.msg+' · both players locked out');
    r.sub='buzz';r.active=null;
    if(q.type==='case'&&r.c<totalClues(q)){r.c++;r.fresh=r.c;}
    setClock(q.type==='case'?(r.c===totalClues(q)?12:8):15);render();startTimer();return;
  }
  // predict / spared
  if(r.sub==='answer'){
    stat(p,q.type,ok);
    if(ok){const fast=S.timer&&(r.deadline-Date.now())>r.total*500;const g=60+(fast?15:0);p.score+=g;r.who=k;r.gain=g;
      return reveal(true,`${S.names[k]} +${g}${fast?' (incl. +15 speed)':''}`);}
    addMiss(p,q);r.sub='steal';r.active=1-k;r.msg=`${S.names[k]} ${i<0?'ran out of time':`picked ${LET[i]}`}`;
    setClock(20);render();startTimer();return;
  }
  if(ok){p.score+=30;p.steals++;r.who=k;r.gain=30;return reveal(true,`${S.names[k]} steals +30`);}
  return reveal(false,r.msg+' · steal missed');
}
function reveal(ok,msg){stopTimer();const r=S.r;r.sub='reveal';r.ok=ok;r.msg=msg;if(Q().type==='case')r.c=totalClues(Q());render();}
function next(){S.idx++;if(S.idx>=S.deck.length){S.phase='end';}else{startRound();return;}render();}

/* ---- render: setup ---- */
function renderSetup(){
  stopTimer();
  const nCount=g=>NODES.filter(n=>n.grp===g).length;
  const any=Object.values(S.types).some(Boolean)&&Object.values(S.groups).some(Boolean);
  app.innerHTML=`<section class="setup">
    <div class="hero">
      <div class="mono">Head, Neck &amp; Special Senses · two-player · cranial nerve branches</div>
      <h1>Which <span>branch</span>?</h1>
      <p>${NODES.length} lesions, all cranial nerves and their branches — trigeminal branches, the facial nerve from geniculate to parotid, the petrosal nerves, glossopharyngeal and vagal branches, the two divisions of CN III, and the regions they share. Plus ${SIDE.length} left-versus-right patterns.</p>
      <div class="types">${Object.entries(TYPES).map(([k,t])=>`<div class="type"><b>${t.label}</b><span>${t.desc}</span><em>${t.pts}</em></div>`).join('')}</div>
      <p class="hint">Buzz: <kbd>Q</kbd> player 1 · <kbd>P</kbd> player 2. Answer: <kbd>1</kbd>–<kbd>5</kbd>. Next clue: <kbd>Space</kbd>. Continue: <kbd>Enter</kbd>. A wrong buzz costs points and locks you out of that round.</p>
      <div class="actions"><button class="btn ghost" id="atlasBtn">Open the lesion atlas</button></div>
    </div>
    <div class="form">
      <div class="fl"><span class="mono">Players</span>
        <div class="names"><input id="p1name" aria-label="Player 1 name" maxlength="18" value="${esc(S.names[0])}"><input id="p2name" aria-label="Player 2 name" maxlength="18" value="${esc(S.names[1])}"></div></div>
      <div class="fl"><span class="mono">Round types</span>
        <div class="chips" id="types">${Object.entries(TYPES).map(([k,t])=>`<button class="chipbtn" data-t="${k}" aria-pressed="${!!S.types[k]}">${t.label}</button>`).join('')}</div></div>
      <div class="fl"><span class="mono">Regions</span>
        <div class="chips" id="groups">${Object.entries(GROUPS).map(([k,g])=>`<button class="chipbtn" data-g="${k}" aria-pressed="${!!S.groups[k]}">${esc(g)}<em>${nCount(k)}</em></button>`).join('')}</div></div>
      <div class="fl"><span class="mono">Rounds</span>
        <div class="seg" id="rounds">${[10,20,30,50].map(v=>`<button data-v="${v}" aria-pressed="${S.rounds===v}">${v}</button>`).join('')}</div></div>
      <div class="fl"><span class="mono">Clock</span>
        <div class="seg" id="timer"><button data-v="1" aria-pressed="${S.timer}">On · clues every 8 s</button><button data-v="0" aria-pressed="${!S.timer}">Off · reveal clues by hand</button></div></div>
      <button class="go" id="start" ${any?'':'disabled'}>${any?`Start rounds · ${S.rounds}`:'Pick at least one type and region'}</button>
    </div></section>`;
  const save=()=>{S.names=[document.getElementById('p1name').value.trim()||'Player 1',document.getElementById('p2name').value.trim()||'Player 2'];};
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{save();S.types[b.dataset.t]=!S.types[b.dataset.t];render();});
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{save();S.groups[b.dataset.g]=!S.groups[b.dataset.g];render();});
  app.querySelectorAll('#rounds button').forEach(b=>b.onclick=()=>{save();S.rounds=+b.dataset.v;render();});
  app.querySelectorAll('#timer button').forEach(b=>b.onclick=()=>{save();S.timer=b.dataset.v==='1';render();});
  document.getElementById('atlasBtn').onclick=()=>{save();S.phase='atlas';render();};
  document.getElementById('start').onclick=()=>{save();begin();};
}

/* ---- render: lesion card ---- */
function lesionCard(id,hit,title,miss,extraNot){
  const T=BY[id];const all=[...signs(id)];const hs=new Set(hit||[]);
  const sp=[...new Set([...(T.spared||[]),...(extraNot?[extraNot]:[])])].filter(s=>!signs(id).has(s));
  return `<div class="card ${miss?'miss':''}">
    ${title?`<div class="verdict">${title}</div>`:''}
    <h4>${esc(T.name)}</h4>
    ${LINEAGE[id]?`<div class="lin lin-${LINEAGE[id][0]}"><b>${LIN_LBL[LINEAGE[id][0]]}</b><span>${esc(LINEAGE[id][1])}</span></div>`:''}
    <div class="hint">${esc(T.cause)}</div>
    <div class="mono">Expected findings</div>
    <ul class="fxlist">${all.map(s=>`<li class="${hs.has(s)?'hit':''}"><span>${esc(SIG[s][0])}</span><span>${esc(SIG[s][1])}${MINOR.has(s)||(T.minorOwn||[]).includes(s)?' <em class="mono">(sometimes)</em>':''}<small>${esc(SIG[s][2])}</small></span></li>`).join('')}</ul>
    ${sp.length?`<div class="spared"><b>Not expected:</b> ${sp.map(s=>esc(SIG[s][1])).join(' · ')}</div>`:''}
    <div class="hy"><b>High-yield pearl</b>${esc(T.pearl)}</div>
  </div>`;
}

/* ---- render: play ---- */
function boardHTML(){
  const P=S.players,r=S.r,q=Q();
  const buzzType=q.type==='case'||q.type==='side';
  const pl=k=>`<div class="pl p${k+1} ${r.active===k&&r.sub!=='reveal'?'on':''} ${r.locked[k]&&r.sub!=='reveal'?'lock':''}">
    <div><div class="nm">${esc(S.names[k])}</div><div class="meta">${P[k].right}/${P[k].tries} correct · ${P[k].steals} steals</div></div>
    ${buzzType?`<span class="key">${k?'P':'Q'}</span>`:''}
    <div class="sc">${P[k].score}</div></div>`;
  return `<div class="board">${pl(0)}<div class="mid"><span class="mono">Round</span><span class="n">${S.idx+1}<span class="mono"> / ${S.deck.length}</span></span><span class="mono" id="secs"></span></div>${pl(1)}</div>
  ${S.timer&&r.sub!=='reveal'?'<div class="timer"><i></i></div>':''}`;
}
function renderPlay(){
  const q=Q(),r=S.r,rev=r.sub==='reveal';
  const T=q.node?BY[q.node]:null;
  let chips='';
  if(r.sub==='buzz')chips=`<span class="chip">Buzz to answer</span>${r.msg?`<span class="chip pen">${esc(r.msg)}</span>`:''}`;
  else if(r.sub==='answer')chips=`<span class="chip p${r.active+1}">${esc(S.names[r.active])} answering</span>`;
  else if(r.sub==='steal')chips=`<span class="chip p${r.active+1}">${esc(S.names[r.active])} · steal for 30</span><span class="chip pen">${esc(r.msg)}</span>`;
  else chips=`<span class="chip ${r.ok?'':'pen'}">${esc(r.msg)}</span>`;

  let left='';
  if(q.type==='case'){
    const n=totalClues(q);
    const rows=[...q.clues.map(s=>({sys:SIG[s][0],fx:SIG[s][1]})),{sys:'History',fx:q.hist,hist:true}];
    left=`<div class="sheet"><div class="sheet-head"><h2>Patient ${String(S.idx+1).padStart(2,'0')} · Exam findings</h2><span class="mono">${r.c} of ${n} revealed</span></div>
      <div class="rows">${rows.map((x,i)=>i<r.c?`<div class="row ${x.hist?'hist':''} ${r.fresh===i+1?'new':''}"><div class="sys">${esc(x.sys)}</div><div class="fx">${esc(x.fx)}${!rev&&i===r.c-1?`<em class="pts">buzz now: ${CASE_PTS[Math.min(r.c,5)-1]}</em>`:''}</div></div>`
        :`<div class="row hidden"><div class="sys">${i===n-1?'History':'—'}</div><div class="fx">Not yet examined</div></div>`).join('')}</div>
      <p class="stem">${q.stem}</p></div>`;
  }else{
    const title=q.type==='side'?'Which side?':q.type==='spared'?'What is spared?':'Predict the finding';
    left=`<div class="sheet"><div class="sheet-head"><h2>${title}</h2><span class="mono">${esc(TYPES[q.type].label)} round</span></div>
      <p class="stem">${q.type==='side'?esc(q.stem)+' <br><br>Which nerve is lesioned, and on which side?':q.stem}</p></div>`;
  }
  const canAnswer=r.sub==='answer'||r.sub==='steal';
  const cls=i=>{if(rev){if(i===q.ans)return'right';if(r.wp.includes(i))return'wrong';return'';}if(r.out.includes(i))return'out';return canAnswer?'':'wait';};
  let under='';
  if(r.sub==='buzz'){
    under=`<div class="buzz"><button class="b1" id="bz0" ${r.locked[0]?'disabled':''}>${esc(S.names[0])}<small>${r.locked[0]?'locked out':'buzz · Q'}</small></button><button class="b2" id="bz1" ${r.locked[1]?'disabled':''}>${esc(S.names[1])}<small>${r.locked[1]?'locked out':'buzz · P'}</small></button></div>
    <div class="actions">${q.type==='case'?`<button class="btn ghost" id="clue">${r.c<totalClues(q)?'Reveal next clue':'Nobody knows — reveal'}</button><kbd>Space</kbd>`:`<button class="btn ghost" id="giveup">Nobody knows — reveal</button>`}</div>`;
  }else if(canAnswer){
    under=`<p class="hint">Pick with a click or <kbd>1</kbd>–<kbd>${q.opts.length}</kbd>.</p>`;
  }else{
    let card='';
    if(q.type==='side')card=`<div class="card ${r.ok?'':'miss'}"><div class="verdict">${r.ok?'Correct':'Answer'}</div><h4>${esc(q.answerName)}</h4><div>${esc(q.why)}</div></div>`;
    else card=lesionCard(q.node,q.type==='spared'?q.hit:(q.type==='case'?q.clues:q.hit),r.ok?'Correct':'Answer: '+LET[q.ans],!r.ok,q.notSig);
    under=`${card}<div class="actions"><button class="btn" id="next">${S.idx+1>=S.deck.length?'Final scores':'Next patient'}</button><kbd>Enter</kbd><button class="btn ghost" id="quit">End game</button></div>`;
  }
  app.innerHTML=`<section style="display:flex;flex-direction:column;gap:12px">${boardHTML()}
    <div class="round">${left}
      <div class="ddx"><h3><span>${q.type==='case'?'Differential':'Options'}</span><span class="status">${chips}</span></h3>
        <div class="opts">${q.opts.map((o,i)=>`<button class="opt ${cls(i)}" data-i="${i}" ${!canAnswer||r.out.includes(i)?'disabled':''}><span class="lt">${LET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
        ${under}
      </div></div></section>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  [0,1].forEach(k=>{const b=document.getElementById('bz'+k);if(b)b.onclick=()=>buzz(k);});
  const c=document.getElementById('clue');if(c)c.onclick=nextClue;
  const g=document.getElementById('giveup');if(g)g.onclick=()=>reveal(null,'Revealed — nobody scores.');
  const n=document.getElementById('next');if(n){n.onclick=next;n.focus({preventScroll:true});}
  const qt=document.getElementById('quit');if(qt)qt.onclick=()=>{S.phase='end';render();};
  paintTimer();
}

/* ---- render: end ---- */
function renderEnd(){
  stopTimer();
  const P=S.players,[a,b]=[P[0].score,P[1].score];
  const head=a===b?`Tied at ${a}`:`<span class="w${a>b?1:2}">${esc(S.names[a>b?0:1])}</span> wins rounds`;
  const card=k=>{const p=P[k];
    const rows=Object.keys(TYPES).filter(t=>p.byType[t]).map(t=>`<tr><td>${TYPES[t].label}</td><td class="n">${p.byType[t].right} / ${p.byType[t].tries}</td></tr>`).join('');
    const rev=p.missed.map(m=>{if(m.startsWith('side:')){const t=SIDE.find(x=>x.id===m.slice(5));return `<li>Which side: ${esc(t.nerve[0])}<span>${esc(t.why)}</span></li>`;}
      const T=BY[m];return `<li>${esc(T.name)}<span>${esc(T.pearl)}</span></li>`;}).join('');
    return `<div class="pcard ${k?'c2':''}"><div class="mono">${esc(S.names[k])}</div><div class="big">${p.score}</div>
      <div class="hint">${p.right} correct of ${p.tries} tries · ${p.steals} steals</div>
      ${rows?`<div style="overflow-x:auto"><table><thead><tr><th>Round type</th><th class="n">Correct</th></tr></thead><tbody>${rows}</tbody></table></div>`:''}
      <div class="mono">Review list (${p.missed.length})</div>
      ${rev?`<ul class="review">${rev}</ul>`:'<p class="hint">Nothing missed.</p>'}</div>`;};
  app.innerHTML=`<section class="end"><div><div class="mono">Rounds complete · ${Math.min(S.idx+1,S.deck.length)} of ${S.deck.length} played</div><h2>${head}</h2></div>
    <div class="cards">${card(0)}${card(1)}</div>
    <div class="actions"><button class="btn pen" id="again">New rounds · same settings</button><button class="btn ghost" id="setup">Change settings</button><button class="btn ghost" id="atlas">Open the lesion atlas</button></div></section>`;
  document.getElementById('again').onclick=begin;
  document.getElementById('setup').onclick=()=>{S.phase='setup';render();};
  document.getElementById('atlas').onclick=()=>{S.phase='atlas';render();};
}

/* ---- render: atlas ---- */
function renderAtlas(){
  stopTimer();
  const q=(S.atlasQ||'').toLowerCase();
  const match=n=>!q||n.name.toLowerCase().includes(q)||(LINEAGE[n.id]||['',''])[1].toLowerCase().includes(q)||[...signs(n.id)].some(s=>SIG[s][1].toLowerCase().includes(q))||n.cause.toLowerCase().includes(q);
  const body=Object.entries(GROUPS).map(([g,label])=>{const ns=NODES.filter(n=>n.grp===g&&match(n));if(!ns.length)return '';
    return `<h3>${esc(label)}</h3><div class="agrid">${ns.map(n=>lesionCard(n.id)).join('')}</div>`;}).join('');
  const sideBody=SIDE.filter(t=>!q||t.why.toLowerCase().includes(q)||t.nerve.join(' ').toLowerCase().includes(q)).map(t=>`<div class="card"><h4>${esc(t.nerve[0])}</h4><div>${esc(t.f(t.fixed||'left'))}</div><div class="hy"><b>Rule</b>${esc(t.why)}</div></div>`).join('');
  app.innerHTML=`<section class="atlas">
    <div class="atlas-top"><button class="btn" id="back">Back</button><input id="atlasq" placeholder="Search a nerve, finding, or cause — e.g. hoarse, ptosis, parotid" value="${esc(S.atlasQ||'')}" aria-label="Search the atlas"></div>
    <p class="hint">Every lesion the game can ask about. Each card shows whether the nerve is a cranial nerve, a branch of one (and which), a cranial nerve ganglion, or not a cranial nerve at all. Findings marked (sometimes) are true but not used as the expected answer.</p>
    ${body||'<p class="hint">No lesions match that search.</p>'}
    ${sideBody?`<h3>Which-side rules</h3><div class="agrid">${sideBody}</div>`:''}
  </section>`;
  document.getElementById('back').onclick=()=>{S.phase=S.deck&&S.idx<S.deck.length&&S.players?'setup':'setup';render();};
  const inp=document.getElementById('atlasq');
  inp.oninput=()=>{S.atlasQ=inp.value;const pos=inp.selectionStart;render();const n=document.getElementById('atlasq');n.focus();n.setSelectionRange(pos,pos);};
}

function render(){({setup:renderSetup,play:renderPlay,end:renderEnd,atlas:renderAtlas})[S.phase]();}

document.addEventListener('keydown',e=>{
  if(!S||S.phase!=='play'||e.target.tagName==='INPUT'||e.metaKey||e.ctrlKey||e.altKey)return;
  const r=S.r,k=e.key.toLowerCase();
  if(r.sub==='reveal'){if(k==='enter'&&document.activeElement.id!=='quit'){e.preventDefault();next();}return;}
  if(r.sub==='buzz'){
    if(k==='q'){buzz(0);return;} if(k==='p'){buzz(1);return;}
    if(k===' '&&Q().type==='case'){e.preventDefault();nextClue();}
    return;
  }
  const i='12345'.indexOf(k);if(i>=0&&i<Q().opts.length){e.preventDefault();answer(i);}
});

function boot(data){
  S=(data&&data.S)||fresh();
  if(!S.types||!S.groups){const n=S.names;S=fresh();if(n)S.names=n;}
  if(S.phase==='play'&&(!S.deck||!S.r)){S.phase='setup';}
  if(S.phase==='play'&&S.r.sub!=='reveal'&&S.timer)S.r.deadline=Date.now()+(S.r.total||10)*1000;
  render();if(S.phase==='play')startTimer();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
})();
</script>
</body></html>
