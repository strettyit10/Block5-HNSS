 {key:'nasal_oral',name:'The Sinus Leviathan',title:'Drains into every meatus at once',hue:'#5B8DEF',eyes:3,horns:1,shape:'wide'},
 {key:'orbit',name:'The Six-Muscle Cyclops',title:'LR6 · SO4 · the rest are III',hue:'#B06CF0',eyes:1,horns:2,shape:'round'},
 {key:'cranial',name:'The Foramen Keeper',title:'Guards every hole in the skull base',hue:'#C9C2A8',eyes:4,horns:3,shape:'tall'},
 {key:'cn',name:'The Cranial Nerve Hydra',title:'Twelve heads. Olfactory to hypoglossal.',hue:'#FF4F8B',eyes:2,horns:0,shape:'hydra',final:true}
];
const BY_KEY=Object.fromEntries(BOSSES.map(b=>[b.key,b]));
const TOPIC_COUNT={};Q.forEach(q=>TOPIC_COUNT[q.set]=(TOPIC_COUNT[q.set]||0)+1);

function beastSVG(b,small){
  const c=b.hue, W=200,H=170;
  let g='';
  if(b.shape==='hydra'){
    // 12 heads on necks fanning from one body
    for(let i=0;i<12;i++){
      const a=(-150+i*(120/11))*Math.PI/180, r=i%2?78:92;
      const x=100+Math.cos(a)*r, y=128+Math.sin(a)*r;
      g+=`<path d="M100 130 Q${(100+x)/2+(i%2?8:-8)} ${(130+y)/2} ${x.toFixed(1)} ${y.toFixed(1)}" stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round" opacity=".9"/>`;
      g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9" fill="${c}"/><circle cx="${(x+2.5).toFixed(1)}" cy="${(y-2).toFixed(1)}" r="2.6" fill="#17142B"/>`;
    }
    g+=`<ellipse cx="100" cy="142" rx="54" ry="26" fill="${c}"/><ellipse cx="100" cy="146" rx="36" ry="12" fill="#17142B" opacity=".35"/>`;
    g+=`<text x="100" y="150" text-anchor="middle" font-family="Silkscreen,monospace" font-size="11" fill="#17142B">I–XII</text>`;
  }else{
    const rx=b.shape==='wide'?78:b.shape==='tall'?52:64, ry=b.shape==='tall'?70:b.shape==='wide'?52:60, cy=98;
    for(let i=0;i<b.horns;i++){
      const t=b.horns===1?0.5:i/(b.horns-1), hx=100-rx*0.8+t*rx*1.6, top=cy-ry-26+Math.abs(t-.5)*18;
      g+=`<polygon points="${hx-9},${cy-ry+14} ${hx+9},${cy-ry+14} ${hx+(t-.5)*14},${top}" fill="${c}" opacity=".85"/>`;
    }
    g+=`<ellipse cx="100" cy="${cy}" rx="${rx}" ry="${ry}" fill="${c}"/>`;
    g+=`<ellipse cx="100" cy="${cy+ry*0.45}" rx="${rx*0.62}" ry="${ry*0.3}" fill="#17142B" opacity=".18"/>`;
    const n=b.eyes, span=Math.min(rx*1.1,26*n);
    for(let i=0;i<n;i++){
      const ex=n===1?100:100-span/2+i*(span/(n-1)), er=n===1?22:n>2?9:13, ey=cy-ry*0.18;
      g+=`<circle cx="${ex}" cy="${ey}" r="${er}" fill="#F4F0FF"/><circle class="pupil" cx="${ex}" cy="${ey+1}" r="${er*0.45}" fill="#17142B"/>`;
    }
    // mouth with teeth
    const mw=rx*0.9, my=cy+ry*0.32;
    g+=`<path d="M${100-mw/2} ${my} Q100 ${my+22} ${100+mw/2} ${my} Z" fill="#17142B"/>`;
    for(let i=0;i<5;i++){const tx=100-mw/2+8+i*((mw-16)/4);g+=`<polygon points="${tx-4},${my+2} ${tx+4},${my+2} ${tx},${my+10}" fill="#F4F0FF"/>`;}
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(b.name)}">${g}</svg>`;
}

/* ---- state ---- */
let S, tick=null;
function fresh(){return{phase:'setup',names:['Player 1','Player 2'],mode:'campaign',pick:'cn',timer:60,diff:'normal'};}
/* Every question in the boss's deck pool is asked. Boss HP = share of the max base damage. */
const DIFF={normal:{ratio:.6,finalRatio:.65,dmg:20,rage:30,hit:15},hard:{ratio:.75,finalRatio:.8,dmg:20,rage:40,hit:22}};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function begin(){
  const order=S.mode==='campaign'?BOSSES.map(b=>b.key):[S.pick];
  Object.assign(S,{phase:'intro',order,stage:0,
    players:[0,1].map(()=>({hp:100,dmg:0,right:0,seen:0,assists:0,potion:1,missed:[]})),
    seenIds:[],turn:0,teamStreak:0,soloStreak:0,log:'',tries:0});
  render();
}
function poolSize(key){return TOPIC_COUNT[key]||0;}
function bossMax(b){const d=DIFF[S.diff];return Math.max(40,Math.round(poolSize(b.key)*d.dmg*(b.final?d.finalRatio:d.ratio)/5)*5);}
function startBoss(retry){
  const b=BY_KEY[S.order[S.stage]], d=DIFF[S.diff];
  const n=poolSize(b.key);
  const max=bossMax(b);
  S.boss={key:b.key,hp:max,max,pool:shuffle(Q.filter(q=>q.set===b.key).map(q=>q.id)),n,asked:0};
  S.players.forEach(p=>{p.hint=1; if(retry)p.hp=Math.max(p.hp,60); else if(p.hp<=0)p.hp=30;});
  if(retry)S.tries++;
  S.teamStreak=0;S.soloStreak=0;
  S.phase='fight'; S.log=retry?`${b.name} rises again — same ${n} questions, reshuffled.`:`${b.name} appears — ${n} questions stand between you.`;
  S.turn=alive(S.turn)?S.turn:1-S.turn;
  newRound();
}
function alive(k){return S.players[k].hp>0}
function spoils(){return S.boss.hp<=0}
function newRound(){
  const q=S.boss.pool.pop(); S.boss.asked++;
  if(!S.seenIds.includes(q))S.seenIds.push(q);
  S.r={qid:q,sub:spoils()?'spoils':'answer',active:S.turn,origin:S.turn,out:[],wp:[],picked:null,hinted:false,
       deadline:S.timer?Date.now()+limit()*1000:0,total:limit()};
  render();startTimer();
}
function enraged(){return !spoils()&&S.boss.hp<=S.boss.max/2}
function limit(){return S.timer?(enraged()?Math.max(20,Math.round(S.timer*0.75)):S.timer):0}

function startTimer(){stopTimer(); if(!S.timer)return; tick=setInterval(()=>{if(!S.r||S.r.sub==='reveal'){stopTimer();return;} paintTimer(); if(Date.now()>=S.r.deadline) answer(-1);},250);}
function stopTimer(){if(tick){clearInterval(tick);tick=null;}}
function paintTimer(){
  const t=document.querySelector('.timer'); if(!t||!S.timer||!S.r)return;
  const left=Math.max(0,S.r.deadline-Date.now());
  t.firstElementChild.style.transform=`scaleX(${left/(S.r.total*1000)})`;
  t.classList.toggle('warn',left<10000);
  const s=document.getElementById('secs'); if(s)s.textContent=Math.ceil(left/1000)+'s';
}

function answer(i){
  const r=S.r; if(!r||!['answer','assist','spoils'].includes(r.sub))return;
  if(i>=0&&r.out.includes(i))return;
  const q=byId[r.qid], p=S.players[r.active], d=DIFF[S.diff], b=BY_KEY[S.boss.key];
  const ok=i===q.ans; r.picked=i; if(i>=0&&!ok)r.wp.push(i);
  if(r.sub==='spoils'){
    p.seen++;
    if(ok){ p.right++; S.players.forEach(x=>{if(x.hp>0)x.hp=Math.min(100,x.hp+10);}); S.log=`${S.names[r.active]} claims spoils · team +10 HP`; }
    else { if(!p.missed.includes(q.id))p.missed.push(q.id); S.log=`${S.names[r.active]} misses — no spoils this time`; }
    return reveal(ok,0,null);
  }
  if(r.sub==='answer'){
    p.seen++;
    if(ok){
      let dmg=d.dmg; const fast=S.timer&&(r.deadline-Date.now())>r.total*500;
      if(fast)dmg+=10; S.teamStreak++; if(S.teamStreak>=3)dmg+=5; if(r.hinted)dmg=Math.round(dmg/2);
      p.right++; p.dmg+=dmg; hurtBoss(dmg);
      S.log=`${S.names[r.active]} hits for ${dmg}${fast?' · swift strike':''}${S.teamStreak>=3?` · combo ×${S.teamStreak}`:''}${r.hinted?' · halved by hint':''}${spoils()?` · ${b.name} falls!`:''}`;
      soloRevive(r.active);
      return reveal(true,dmg,'boss');
    }
    S.teamStreak=0; if(!p.missed.includes(q.id))p.missed.push(q.id);
    const hit=enraged()?d.rage:d.hit; hurtPlayer(r.active,hit);
    if(i>=0)r.out.push(i);
    const mate=1-r.active;
    S.log=`${i<0?'Time is up. ':''}${b.name} strikes ${S.names[r.active]} for ${hit}`;
    if(alive(mate)){ r.sub='assist'; r.active=mate; r.first=i;
      r.total=S.timer?Math.max(15,Math.round(limit()/3)):0; r.deadline=S.timer?Date.now()+r.total*1000:0;
      render(); anim('atk'); startTimer(); return; }
    return reveal(false,0,'player');
  }else{
    if(ok){ const dmg=10; p.dmg+=dmg; p.assists++; hurtBoss(dmg); S.log=`${S.names[r.active]} assists for ${dmg}${spoils()?` · ${b.name} falls!`:''}`; return reveal(true,dmg,'boss'); }
    if(i>=0)r.out.push(i);
    S.log+=` · assist missed`;
    return reveal(false,0,null);
  }
}
function soloRevive(k){
  const mate=1-k;
  if(alive(mate)){S.soloStreak=0;return;}
  S.soloStreak=(S.soloStreak||0)+1;
  if(S.soloStreak>=3){S.players[mate].hp=30;S.soloStreak=0;S.log+=` · ${S.names[mate]} is revived at 30 HP`;}
}
function hurtBoss(n){S.boss.hp=Math.max(0,S.boss.hp-n);}
function hurtPlayer(k,n){S.players[k].hp=Math.max(0,S.players[k].hp-n);}
function reveal(ok,dmg,target){
  stopTimer(); S.r.sub='reveal'; S.r.ok=ok; S.r.dealt=target==='boss'; render();
  if(target==='boss'){anim(S.boss.hp<=0?'dead':'hit'); pop('-'+dmg,'.beast','var(--p1)');}
  else if(target==='player'){anim('atk');}
}
function anim(cls){const e=document.querySelector('.beast'); if(!e)return; e.classList.remove('hit','atk'); void e.offsetWidth; e.classList.add(cls);}
function pop(txt,sel,color){const host=document.querySelector(sel); if(!host)return; const s=document.createElement('span'); s.className='dmg'; s.textContent=txt; s.style.color=color; host.style.position='relative'; s.style.left='50%'; s.style.top='20%'; host.appendChild(s); setTimeout(()=>s.remove(),1000);}

function cont(){
  const done=!S.boss.pool.length;
  if(!alive(0)&&!alive(1)){S.phase='fallen';S.fallReason='ko';render();return;}
  if(done){
    if(spoils()){ S.stage++; S.players.forEach(p=>{if(p.hp>0)p.hp=Math.min(100,p.hp+40);});
      if(S.stage>=S.order.length){S.phase='end';S.won=true;} else S.phase='intro';
    } else { S.phase='fallen'; S.fallReason='survived'; }
    render(); return;
  }
  let nt=1-S.r.origin; if(!alive(nt))nt=1-nt; S.turn=nt; newRound();
}
function renderFallen(){
  stopTimer();
  const b=BY_KEY[S.boss.key];
  app.innerHTML=`<section class="interlude">${beastSVG(b)}<div>
    ${S.order.length>1?pathHTML():''}
    <div class="pix">${S.fallReason==='ko'?'Party knocked out':'Out of questions'}</div>
    <h2>${esc(b.name)} still stands</h2>
    <p>${S.fallReason==='ko'?'Both players are down.':`All ${S.boss.n} questions were asked and the boss kept ${S.boss.hp} HP.`} Retry this boss with the same questions reshuffled — both players return with at least 60 HP. Your misses stay on the review list.</p>
    <div class="actions"><button class="btn" id="retry">Retry this boss</button><kbd>Enter</kbd><button class="btn ghost" id="giveup">End the run</button></div>
  </div></section>`;
  const r=document.getElementById('retry'); r.onclick=()=>startBoss(true); r.focus({preventScroll:true});
  document.getElementById('giveup').onclick=()=>{S.phase='end';S.won=false;render();};
}
function usePotion(k){
  const p=S.players[k]; if(!p.potion||S.r.sub==='reveal')return;
  const target=[0,1].filter(i=>S.players[i].hp>0).sort((a,b)=>S.players[a].hp-S.players[b].hp)[0];
  if(target==null)return;
  // revive KO'd teammate first if possible
  const mate=1-k; const tgt=!alive(mate)?mate:target;
  S.players[tgt].hp=Math.min(100,(S.players[tgt].hp||0)+35); p.potion=0;
  S.log=`${S.names[k]} uses a potion on ${S.names[tgt]} (+35)`; render();
}
function useHint(k){
  const r=S.r, p=S.players[k], q=byId[r.qid];
  if(!p.hint||r.sub!=='answer'||r.active!==k||r.hinted)return;
  const wrongs=shuffle(q.opts.map((_,i)=>i).filter(i=>i!==q.ans&&!r.out.includes(i))).slice(0,2);
  r.out.push(...wrongs); r.hinted=true; p.hint=0;
  S.log=`${S.names[k]} uses a hint — two wrong answers vanish (damage halved)`; render();
}

/* ---- render ---- */
function renderSetup(){
  stopTimer();
  app.innerHTML=`<section class="setup">
    <div class="hero">
      <div class="pix">Head, Neck &amp; Special Senses · two-player co-op · Deck ${DECK} of 5</div>
      <h1>Seven bosses. <em>Twelve heads.</em> One team.</h1>
      <p>Deck ${DECK} holds ${Q.length} of the 361 board-style HNSS questions, split evenly by topic across five decks. Every question in this deck is asked once during a full campaign. Each boss guards one region; the Cranial Nerve Hydra waits at the end.</p>
      <div class="roster">${BOSSES.map(b=>`<div class="foe">${beastSVG(b)}<div><b>${esc(b.name)}</b><span>${TOPIC_COUNT[b.key]||0} questions</span></div></div>`).join('')}</div>
      <ul class="rules">
        <li><b>Clear it</b><span>Each boss asks every question in its pool. Drop its HP to 0 before the questions run out. Questions left after it falls are spoils: each correct answer heals the team 10.</span></li>
        <li><b>Strike</b><span>Correct answer: 20 damage. +10 if answered in the first half of the timer. +5 once the team has 3 correct in a row.</span></li>
        <li><b>Take hits</b><span>A miss or timeout lets the boss hit you for 15 (22 on hard). Below half health it enrages: harder hits, shorter timer.</span></li>
        <li><b>Assist</b><span>After a miss, your teammate gets one shot (with the wrong pick crossed out) for 10 damage.</span></li>
        <li><b>Items</b><span>Hint: once per boss, removes two wrong answers, halves damage. Potion: once per run, +35 health or revives a knocked-out teammate.</span></li>
        <li><b>Solo</b><span>If your teammate is knocked out, 3 correct in a row brings them back at 30. Beating a boss restores 40 to everyone still standing. Lose a fight and you can retry that boss.</span></li>
      </ul>
    </div>
    <div class="form">
      <div class="fl"><span class="pix">Party</span>
        <div class="names"><input id="p1name" aria-label="Player 1 name" maxlength="16" value="${esc(S.names[0])}"><input id="p2name" aria-label="Player 2 name" maxlength="16" value="${esc(S.names[1])}"></div></div>
      <div class="fl"><span class="pix">Run</span>
        <div class="seg" id="mode"><button data-v="campaign" aria-pressed="${S.mode==='campaign'}">Full campaign · 7 bosses</button><button data-v="single" aria-pressed="${S.mode==='single'}">Single boss</button></div>
        ${S.mode==='single'?`<div class="picker">${BOSSES.map(b=>`<button data-k="${b.key}" aria-pressed="${S.pick===b.key}"><span>${esc(b.name)}</span><em>${TOPIC_COUNT[b.key]||0}</em></button>`).join('')}</div>`:`<p class="hint">Order: ${BOSSES.map(b=>esc(b.name.replace('The ',''))).join(' → ')}</p>`}
      </div>
      <div class="fl"><span class="pix">Difficulty</span>
        <div class="seg" id="diff"><button data-v="normal" aria-pressed="${S.diff==='normal'}">Normal</button><button data-v="hard" aria-pressed="${S.diff==='hard'}">Hard</button></div>
        <p class="hint">${S.diff==='normal'?'Boss health ≈ 60% of its questions × 20 (Hydra 65%). Hits 15, enraged 30.':'Boss health ≈ 75% of its questions × 20 (Hydra 80%). Hits 22, enraged 40.'}</p></div>
      <div class="fl"><span class="pix">Timer per question</span>
        <div class="seg" id="timer">${[[0,'Off'],[45,'45 s'],[60,'60 s'],[90,'90 s']].map(([v,l])=>`<button data-v="${v}" aria-pressed="${S.timer===v}">${l}</button>`).join('')}</div>
        ${S.timer?'':'<p class="hint">With the timer off, there are no swift-strike bonuses.</p>'}</div>
      <button class="go" id="start">Enter the arena</button>
    </div></section>`;
  const save=()=>{S.names=[document.getElementById('p1name').value.trim()||'Player 1',document.getElementById('p2name').value.trim()||'Player 2'];};
  app.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{save();S.mode=b.dataset.v;render();});
  app.querySelectorAll('.picker button').forEach(b=>b.onclick=()=>{save();S.pick=b.dataset.k;render();});
  app.querySelectorAll('#diff button').forEach(b=>b.onclick=()=>{save();S.diff=b.dataset.v;render();});
  app.querySelectorAll('#timer button').forEach(b=>b.onclick=()=>{save();S.timer=+b.dataset.v;render();});
  document.getElementById('start').onclick=()=>{save();begin();};
}

function pathHTML(){return `<div class="path">${S.order.map((k,i)=>`<span class="${i<S.stage?'done':i===S.stage?'now':''}">${esc(BY_KEY[k].name.replace('The ',''))}</span>`).join('')}</div>`;}

function renderIntro(){
  stopTimer();
  const b=BY_KEY[S.order[S.stage]];
  const P=S.players;
  app.innerHTML=`<section class="interlude">
    ${beastSVG(b)}
    <div>
      ${S.order.length>1?pathHTML():''}
      <div class="pix">${S.order.length>1?`Boss ${S.stage+1} of ${S.order.length}`:'Single boss'}${b.final?' · final':''}</div>
      <h2>${esc(b.name)}</h2>
      <p>${esc(b.title)}. All <b>${TOPIC_COUNT[b.key]} ${esc(SETS[b.key])}</b> questions in this deck will be asked. Boss health: ${bossMax(b)}.</p>
      <p>${esc(S.names[0])}: ${P[0].hp>0?P[0].hp+' HP':'knocked out, returns at 30'} · ${esc(S.names[1])}: ${P[1].hp>0?P[1].hp+' HP':'knocked out, returns at 30'}</p>
      <div class="actions"><button class="btn" id="fight">Fight</button><kbd>Enter</kbd><button class="btn ghost" id="flee">Leave the run</button></div>
    </div></section>`;
  const f=document.getElementById('fight'); f.onclick=()=>startBoss(); f.focus({preventScroll:true});
  document.getElementById('flee').onclick=()=>{S.phase='end';S.won=false;S.fled=true;render();};
}

function heroHTML(k){
  const p=S.players[k], r=S.r, on=r&&r.sub!=='reveal'&&r.active===k;
  const canHint=p.hint&&r&&r.sub==='answer'&&r.active===k&&!r.hinted;
  const canPot=p.potion&&r&&r.sub!=='reveal'&&(alive(k))&&(S.players[1-k].hp<100||p.hp<100);
  return `<div class="hero-card p${k+1} ${on?'on':''} ${p.hp<=0?'ko':''}">
    ${p.hp<=0?'<span class="ko-tag">KO</span>':''}
    <div class="role">${k?'Player 2':'Player 1'}${on?(r.sub==='assist'?' · assisting':' · your turn'):''}</div>
    <div class="nm">${esc(S.names[k])}</div>
    <div class="bar hp ${p.hp<35?'low':''}"><i style="transform:scaleX(${p.hp/100})"></i></div>
    <div class="hpnum"><span>HP</span><span>${p.hp} / 100</span></div>
    <div class="stats"><span>Damage <b>${p.dmg}</b></span><span>Correct <b>${p.right}/${p.seen}</b></span><span>Assists <b>${p.assists}</b></span></div>
    <div class="abil">
      <button data-hint="${k}" ${canHint?'':'disabled'}>Hint<small>${p.hint?'1 left this boss':'used'}</small></button>
      <button data-pot="${k}" ${canPot?'':'disabled'}>Potion +35<small>${p.potion?'1 left this run':'used'}</small></button>
    </div></div>`;
}

function renderFight(){
  const r=S.r, q=byId[r.qid], b=BY_KEY[S.boss.key], rev=r.sub==='reveal';
  let chip='';
  if(r.sub==='answer') chip=`<span class="chip p${r.active+1}">${esc(S.names[r.active])} attacks</span>`;
  else if(r.sub==='spoils') chip=`<span class="chip p${r.active+1}">${esc(S.names[r.active])} · spoils: +10 team HP</span>`;
  else if(r.sub==='assist') chip=`<span class="chip p${r.active+1}">${esc(S.names[r.active])} · assist for 10</span><span class="chip dash">${r.first>=0?`${LET[r.first]} was wrong`:'time ran out'}</span>`;
  const cls=i=>{ if(rev){ if(i===q.ans)return 'right'; if(r.wp.includes(i))return 'wrong'; if(r.out.includes(i))return 'out'; return '';} return r.out.includes(i)?'out':''; };
  const bossDown=S.boss.hp<=0, partyDown=!alive(0)&&!alive(1);
  const left=S.boss.pool.length;
  let contLabel='Next question';
  if(partyDown) contLabel='Continue';
  else if(!left) contLabel=bossDown?(S.stage+1>=S.order.length?'Claim victory':'Onward'):'Continue';
  const block=rev?`
    <div class="verdict ${r.ok?'good':'bad'}">
      <h3>${r.ok?(bossDown&&!S.r.dealt?'Correct':'Hit'):'Answer: '+LET[q.ans]}</h3>
      <p><b>${LET[q.ans]}. ${esc(q.opts[q.ans])}</b> — ${esc(q.why)}</p>
      <ul class="why">${q.wrong.map((w,i)=>w?`<li><b>${LET[i]}</b>${esc(w)}</li>`:'').join('')}</ul>
    </div>
    <div class="hy"><b>High-yield pearl</b>${esc(q.pearl)}</div>
    <div class="actions"><button class="btn" id="cont">${contLabel}</button><kbd>Enter</kbd><button class="btn ghost" id="quit">Leave the run</button></div>`
    :`<div class="actions"><span class="hint">Tap an answer or press <kbd>1</kbd>–<kbd>${q.opts.length}</kbd>. Items: <kbd>H</kbd> hint, <kbd>P</kbd> potion.</span></div>`;
  app.innerHTML=`<section style="display:flex;flex-direction:column;gap:12px">
    ${S.order.length>1?pathHTML():''}
    <div class="arena">
      ${heroHTML(0)}
      <div class="boss-card">
        <div class="pix">${esc(SETS[b.key])}${enraged()&&!bossDown?' · <span class="rage">enraged</span>':''}</div>
        <div class="bn">${esc(b.name)}</div>
        <div class="beast ${bossDown?(rev&&r.dealt?'dead':'gone'):''}">${beastSVG(b)}</div>
        <div class="bar boss"><i style="transform:scaleX(${S.boss.hp/S.boss.max})"></i></div>
        <div class="hpnum"><span>Boss HP</span><span>${S.boss.hp} / ${S.boss.max}</span></div>
        <div class="pix">${bossDown?(left?`Defeated · spoils round · ${left} left`:'Defeated'):`Question ${S.boss.asked} of ${S.boss.n} · ${left} left`}</div>
        <div class="log">${esc(S.log)}</div>
      </div>
      ${heroHTML(1)}
    </div>
    ${S.timer&&!rev?`<div class="timer"><i></i></div>`:''}
    <div class="qpanel">
      <div class="qhead">${chip}${S.timer&&!rev?`<span class="pix" id="secs"></span>`:''}</div>
      <p class="stem">${esc(q.stem)}</p>
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt ${cls(i)}" data-i="${i}" ${rev||r.out.includes(i)?'disabled':''}><span class="lt"><span>${LET[i]}</span></span><span>${esc(o)}</span></button>`).join('')}</div>
      ${block}
    </div></section>`;
  app.querySelectorAll('.opt').forEach(e=>e.onclick=()=>answer(+e.dataset.i));
  app.querySelectorAll('[data-hint]').forEach(e=>e.onclick=()=>useHint(+e.dataset.hint));
  app.querySelectorAll('[data-pot]').forEach(e=>e.onclick=()=>usePotion(+e.dataset.pot));
  const c=document.getElementById('cont'); if(c){c.onclick=cont;c.focus({preventScroll:true});}
  const qt=document.getElementById('quit'); if(qt)qt.onclick=()=>{S.phase='end';S.won=false;S.fled=true;render();};
  paintTimer();
}

function renderEnd(){
  stopTimer();
  const P=S.players, beaten=S.stage;
  const head=S.won?'The arena is cleared':S.fled?'Retreat':'The party has fallen';
  const card=k=>{const p=P[k];return `<div class="card p${k+1}">
    <div class="pix">${esc(S.names[k])}</div>
    <div class="big">${p.dmg}</div><div class="pix">damage dealt</div>
    <div class="stats"><span>Correct <b>${p.right}/${p.seen}</b></span><span>Accuracy <b>${p.seen?Math.round(100*p.right/p.seen):0}%</b></span><span>Assists <b>${p.assists}</b></span></div>
    <div class="pix">Review list (${p.missed.length})</div>
    ${p.missed.length?`<ul class="missed">${p.missed.map(id=>{const q=byId[id];return `<li><span>${esc(SETS[q.set])}</span><b>${esc(q.opts[q.ans])}</b> — ${esc(q.pearl)}</li>`}).join('')}</ul>`:'<p class="hint">No misses.</p>'}
  </div>`};
  const mvp=P[0].dmg===P[1].dmg?'':` MVP: ${esc(S.names[P[0].dmg>P[1].dmg?0:1])}.`;
  app.innerHTML=`<section class="end">
    <div>${S.order.length>1?pathHTML():''}<div class="pix">${beaten} of ${S.order.length} boss${S.order.length>1?'es':''} defeated · ${S.seenIds.length} of ${Q.length} deck questions answered${S.tries?` · ${S.tries} retr${S.tries>1?'ies':'y'}`:''}</div>
    <h2 class="${S.won?'win':'lose'}">${head}</h2><p class="hint">${S.won?'Every guardian is down.':'Study the review list and try again.'}${mvp}</p></div>
    <div class="cards">${card(0)}${card(1)}</div>
    <div class="actions"><button class="btn" id="again">Run it back</button><button class="btn ghost" id="setup">Change settings</button></div>
  </section>`;
  document.getElementById('again').onclick=begin;
  document.getElementById('setup').onclick=()=>{S.phase='setup';render();};
}

function render(){({setup:renderSetup,intro:renderIntro,fight:renderFight,fallen:renderFallen,end:renderEnd})[S.phase]();}

document.addEventListener('keydown',e=>{
  if(!S||e.target.tagName==='INPUT'||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(S.phase==='intro'&&k==='enter'&&document.activeElement.id!=='flee'){e.preventDefault();startBoss();return;}
  if(S.phase==='fallen'&&k==='enter'&&document.activeElement.id!=='giveup'){e.preventDefault();startBoss(true);return;}
  if(S.phase!=='fight'||!S.r)return;
  if(S.r.sub==='reveal'){ if(k==='enter'&&document.activeElement.id!=='quit'){e.preventDefault();cont();} return; }
  if(k==='h'){useHint(S.r.active);return;}
  if(k==='p'){usePotion(S.r.active);return;}
  const i='12345'.indexOf(k); if(i>=0&&i<byId[S.r.qid].opts.length){e.preventDefault();answer(i);}
});

function boot(data){
  S=(data&&data.S)||fresh();
  if((S.phase==='fight'&&S.r&&!byId[S.r.qid])||(S.phase!=='setup'&&!S.seenIds)||(S.boss&&!S.boss.pool)){const n=S.names;S=fresh();if(n)S.names=n;}
  if(S.phase==='fight'&&S.r&&S.r.sub!=='reveal'&&S.timer){S.r.deadline=Date.now()+S.r.total*1000;}
  render(); if(S.phase==='fight')startTimer();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
</body></html>
