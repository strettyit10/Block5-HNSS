<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Cranial Nerve Hydra 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=Silkscreen&display=swap">
<style>
/* Deliberately single-theme: a night-arena world. Every color is painted explicitly. */
:root{
  --ground:#17142B; --ground2:#120F22; --panel:#221D3F; --sunk:#1B1734; --line:#3A3366;
  --ink:#EEEAFB; --muted:#A39CC8;
  --p1:#FFB341; --p2:#3DD6C6; --boss:#FF4F8B; --heal:#6BD88E; --bad:#FF6B5B;
  --hy-bg:#3A3212; --hy-line:#D9AE2B; --hy-ink:#F7E6A6;
  --display:"Chakra Petch","Arial Narrow",sans-serif;
  --pix:"Silkscreen","Courier New",monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font:15px/1.55 var(--body);padding-inline:16px;padding-block:16px 40px;
  background-image:radial-gradient(ellipse 80% 50% at 50% 0%, #2A2352 0%, transparent 70%);background-attachment:fixed}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.pix{font-family:var(--pix);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.brand b{color:var(--boss)}

/* ---------- setup ---------- */
.setup{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:start}
.hero{display:flex;flex-direction:column;gap:14px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,6.4vw,74px);line-height:.92;margin:0;text-transform:uppercase;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--boss)}
.hero p{margin:0;color:var(--muted);max-width:54ch}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.foe{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:8px;display:flex;gap:8px;align-items:center}
.foe svg{width:44px;height:44px;flex:none}
.foe b{display:block;font-family:var(--display);font-size:13.5px;line-height:1.15}
.foe span{font-family:var(--pix);font-size:9.5px;color:var(--muted);text-transform:uppercase}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:6px;max-width:58ch}
.rules li{display:grid;grid-template-columns:92px 1fr;gap:10px;border-top:1px dashed var(--line);padding-top:6px;font-size:14px}
.rules b{font-family:var(--pix);font-size:11px;color:var(--p1);font-weight:400;padding-top:3px}
.form{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:16px}
.fl{display:flex;flex-direction:column;gap:6px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names input{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:9px 10px;border-left:5px solid var(--p1)}
.names input#p2name{border-left-color:var(--p2)}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;min-width:72px;background:var(--sunk);border:0;border-right:1px solid var(--line);padding:9px 8px;font-size:14px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:600}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.picker button{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:7px 9px;text-align:left;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.picker button[aria-pressed="true"]{border-color:var(--boss);box-shadow:inset 3px 0 0 var(--boss)}
.picker em{font-style:normal;font-family:var(--pix);font-size:10px;color:var(--muted)}
.go{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase;background:var(--boss);color:#1a0610;border:0;border-radius:4px;padding:11px 16px}

/* ---------- arena ---------- */
.arena{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:12px;align-items:stretch}
.hero-card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;transition:box-shadow .2s,opacity .3s}
.hero-card.p1{--c:var(--p1)} .hero-card.p2{--c:var(--p2)}
.hero-card.on{box-shadow:0 0 0 2px var(--c),0 0 24px -4px var(--c)}
.hero-card.ko{opacity:.45}
.hero-card .nm{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1;color:var(--c)}
.hero-card .role{font-family:var(--pix);font-size:10px;color:var(--muted);text-transform:uppercase}
.bar{height:14px;background:var(--ground2);border:1px solid var(--line);border-radius:3px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.bar.hp i{background:var(--heal)} .bar.hp.low i{background:var(--bad)}
.bar.boss{height:18px} .bar.boss i{background:linear-gradient(90deg,#B8265A,var(--boss))}
.hpnum{font-family:var(--pix);font-size:11px;display:flex;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.abil{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.abil button{flex:1;min-width:90px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:6px 6px;font-size:12.5px;line-height:1.2}
.abil button small{display:block;font-family:var(--pix);font-size:9px;color:var(--muted)}
.abil button:disabled{opacity:.35;cursor:not-allowed}
.abil button:not(:disabled):hover{border-color:var(--c)}
.ko-tag{position:absolute;top:10px;right:10px;font-family:var(--pix);font-size:12px;color:var(--bad)}
.boss-card{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center}
.boss-card .bn{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;line-height:1;letter-spacing:.03em}
.boss-card .bt{font-size:12.5px;color:var(--muted)}
.beast{height:150px;display:grid;place-items:center}
.beast svg{display:block;height:150px;width:auto;max-width:100%;overflow:visible}
.beast.hit svg{animation:hit .45s}
.beast.atk svg{animation:atk .5s}
.beast.dead svg{animation:dead .9s forwards}
.beast.gone svg{transform:translateY(20px) scale(.6);opacity:.1;filter:grayscale(1)}
@keyframes hit{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px);filter:brightness(2.2)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
@keyframes atk{0%,100%{transform:scale(1)}40%{transform:scale(1.14) translateY(8px)}}
@keyframes dead{to{transform:translateY(20px) scale(.6);opacity:.1;filter:grayscale(1)}}
.rage{font-family:var(--pix);font-size:10.5px;color:var(--boss)}
.dmg{position:absolute;font-family:var(--display);font-weight:700;font-size:30px;pointer-events:none;animation:float 1s forwards;text-shadow:0 2px 0 #000}
@keyframes float{from{transform:translateY(0);opacity:1}to{transform:translateY(-44px);opacity:0}}
.timer{height:6px;background:var(--ground2);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--muted);transform-origin:left;transition:transform .25s linear}
.timer.warn i{background:var(--bad)}
.log{font-family:var(--pix);font-size:11px;color:var(--muted);min-height:16px;text-transform:uppercase;letter-spacing:.04em}
.log b{color:var(--ink);font-weight:400}

.qpanel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--pix);font-size:10.5px;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid var(--line)}
.chip.p1{background:var(--p1);color:#231500;border-color:var(--p1)}
.chip.p2{background:var(--p2);color:#032421;border-color:var(--p2)}
.chip.dash{border-style:dashed}
.stem{margin:0;font-size:16px;line-height:1.62;max-width:76ch}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:8px 12px}
.opt .lt{font-family:var(--display);font-weight:700;font-size:17px;width:28px;height:28px;border:1.5px solid var(--line);border-radius:3px;display:grid;place-items:center;transform:rotate(45deg)}
.opt .lt span{transform:rotate(-45deg)}
.opt:not(:disabled):hover{border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.out{opacity:.3;text-decoration:line-through}
.opt.right{border-color:var(--heal);background:#193326}
.opt.right .lt{background:var(--heal);border-color:var(--heal);color:#07210F}
.opt.wrong{border-color:var(--bad);background:#3A1A22}
.opt.wrong .lt{background:var(--bad);border-color:var(--bad);color:#2a0606}
.verdict{border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--sunk)}
.verdict h3{margin:0;font-family:var(--display);font-size:22px;text-transform:uppercase}
.verdict.good h3{color:var(--heal)} .verdict.bad h3{color:var(--bad)}
.verdict p{margin:0;max-width:76ch}
.why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--muted)}
.why b{color:var(--ink);font-family:var(--pix);font-weight:400;margin-right:6px}
.hy{background:var(--hy-bg);border:1.5px solid var(--hy-line);color:var(--hy-ink);border-radius:4px;padding:9px 12px;font-size:14px}
.hy b{display:block;font-family:var(--pix);font-size:10px;font-weight:400;letter-spacing:.1em;text-transform:uppercase}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--ground);border:0;border-radius:4px;padding:10px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
kbd{font-family:var(--pix);font-size:10px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--muted)}

/* ---------- interlude / end ---------- */
.interlude{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px;display:grid;grid-template-columns:180px 1fr;gap:22px;align-items:center}
.interlude svg{width:100%;height:auto}
.interlude h2,.end h2{font-family:var(--display);font-weight:700;font-size:clamp(32px,5vw,54px);line-height:.95;margin:0 0 8px;text-transform:uppercase;text-wrap:balance}
.interlude p{margin:0 0 12px;color:var(--muted);max-width:60ch}
.path{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.path span{font-family:var(--pix);font-size:10px;padding:3px 7px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
.path span.done{color:var(--heal);border-color:var(--heal)}
.path span.now{color:var(--boss);border-color:var(--boss)}
.end{display:flex;flex-direction:column;gap:18px}
.end h2.win{color:var(--heal)} .end h2.lose{color:var(--bad)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.p1{--c:var(--p1)} .card.p2{--c:var(--p2)}
.big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;color:var(--c)}
.missed{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.missed li{font-size:13.5px;border-left:3px solid var(--line);padding-left:9px}
.missed li span{display:block;font-family:var(--pix);font-size:9.5px;color:var(--muted);text-transform:uppercase}
.foot{font-family:var(--pix);font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;text-transform:uppercase}
@media (max-width:860px){
  .setup,.cards,.interlude{grid-template-columns:1fr}
  .interlude svg{max-width:160px}
  .arena{grid-template-columns:1fr 1fr}
  .boss-card{grid-column:1 / -1;order:-1}
  .beast{height:110px}.beast svg{height:110px}
  .names,.picker{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const DECK=1;
const SETS={"neck": "The Neck", "face": "Face, Scalp & ITF", "cranial": "Skull, Meninges & Foramina", "orbit": "Orbit & Eye Reflexes", "nasal_oral": "Nose, Pharynx, Palate & Oral Cavity", "larynx": "Larynx", "cn": "Cranial Nerve Lesions"};
const Q=[{"id": "G-297", "stem": "A 20-year-old man with a recent open fracture of the right temporal bone develops fever and a tender temporal swelling. Examination suggests neuritis of the nerve in the distal part of the facial canal. Which function is likely spared?", "opts": ["Taste from the anterior two thirds of the tongue", "Movements of the right side of the face", "Secretions from the submandibular gland", "Secretions from the sublingual gland", "Secretions from the lacrimal gland"], "ans": 4, "why": "The greater petrosal nerve (lacrimal secretomotor) leaves CN VII at the geniculate ganglion, proximal to the distal facial canal. A distal lesion therefore spares tearing but affects the chorda tympani (taste, submandibular/sublingual secretion) and facial motor fibers.", "wrong": ["Chorda tympani leaves in the distal canal, so taste is affected.", "The motor fibers run through the entire canal and are affected.", "Submandibular secretion rides with the chorda tympani and is affected.", "Sublingual secretion rides with the chorda tympani and is affected.", ""], "pearl": "Level of CN VII lesion: geniculate (lacrimation) -> stapedius (hyperacusis) -> chorda tympani (taste/saliva) -> stylomastoid (face only).", "set": "cn"}, {"id": "BH-8", "stem": "A 44-year-old man with 'crocodile tears syndrome' has spontaneous lacrimation during eating due to misdirection of regenerating autonomic nerve fibers. Which of the following nerves was injured?", "opts": ["Facial nerve proximal to the geniculate ganglion", "Auriculotemporal nerve", "Chorda tympani in the infratemporal fossa", "Facial nerve at the stylomastoid foramen", "Lacrimal nerve"], "ans": 0, "why": "After injury proximal to the geniculate ganglion, regrowing salivary parasympathetic fibers are misrouted into the greater petrosal pathway to the lacrimal gland, so eating triggers tearing.", "wrong": ["", "Auriculotemporal injury causes Frey syndrome (gustatory sweating).", "Chorda tympani distal injury would not reroute fibers to the lacrimal gland.", "At the stylomastoid foramen the nerve has already lost its parasympathetic fibers.", "Lacrimal nerve injury reduces tearing; it doesn't create gustatory lacrimation."], "pearl": "Crocodile tears = aberrant CN VII regeneration proximal to geniculate; Frey = auriculotemporal.", "set": "cn"}, {"id": "G-262", "stem": "In a cough-reflex test, a 62-year-old woman inhales particles that stick to mucus mainly in the trachea. Blocking afferent neurons in which cranial nerve would most likely suppress her cough?", "opts": ["Glossopharyngeal", "Hypoglossal", "External laryngeal", "Trigeminal", "Vagus"], "ans": 4, "why": "The vagus nerve carries sensation from the tracheal and laryngeal mucosa and also drives the motor response, so it forms both limbs of the cough reflex.", "wrong": ["CN IX is the afferent limb of the gag reflex, not tracheal cough.", "CN XII is motor to the tongue.", "The external laryngeal is purely motor to cricothyroid.", "CN V is sensory to the face and nasal cavity (sneeze), not the trachea.", ""], "pearl": "Cough reflex: CN X afferent and efferent. Gag: IX afferent, X efferent.", "set": "cn"}, {"id": "G-118", "stem": "A 63-year-old man had a prostate tumor removed 2 years ago and now has headaches and other neurologic problems. Imaging shows the cancer has spread to the posterior cranial fossa through the vertebral venous plexus. His right shoulder droops, he is weak at turning his head to the left, and his tongue points to the right when he sticks it out. There are no other significant findings. Which nerves are most likely affected?", "opts": ["Right vagus, right accessory, and right hypoglossal nerves", "Left accessory, right glossopharyngeal, right vagus, and left hypoglossal nerves", "Left hypoglossal, right trigeminal, and left glossopharyngeal nerves", "Right accessory and right hypoglossal nerves", "Left facial, left accessory, right accessory, and vagus nerves"], "ans": 3, "why": "The drooping right shoulder (trapezius) and weak head turn to the left (right SCM) point to the right CN XI. Tongue deviation to the right points to the right CN XII.", "wrong": ["There are no vagal signs (voice, uvula) to suggest CN X involvement.", "Left XI and left XII lesions would cause left-sided signs.", "None of these nerves explains the shoulder droop.", "", "A left XI lesion does not fit, and the tongue signs are not explained."], "pearl": "Right SCM turns the head to the LEFT; CN XI lesion = shoulder droop + weak turn to the opposite side.", "set": "cn"}, {"id": "G-29", "stem": "A 36-year-old woman has severe head injuries after a car crash. On neurologic examination her uvula deviates to the right. Which nerve is most likely affected?", "opts": ["Left vagus", "Right vagus", "Right hypoglossal", "Left glossopharyngeal", "Right glossopharyngeal"], "ans": 0, "why": "With a unilateral vagus lesion, the intact contralateral levator veli palatini and musculus uvulae pull the uvula toward the healthy side, so rightward deviation means a left CN X lesion.", "wrong": ["", "A right vagal lesion would deviate the uvula to the left.", "CN XII moves the tongue, not the uvula.", "CN IX is sensory to the pharynx; it does not move the palate.", "CN IX is sensory to the pharynx; it does not move the palate."], "pearl": "Uvula deviates AWAY from the lesioned vagus; tongue deviates TOWARD the lesioned hypoglossal.", "set": "cn"}, {"id": "G-196", "stem": "A 62-year-old man complains of spontaneous lacrimation during eating (crocodile tears). Which of the following nerve lesions caused this condition?", "opts": ["Facial nerve proximal to the geniculate ganglion", "Greater petrosal nerve", "Lesser petrosal nerve", "Lacrimal nerve", "Chorda tympani"], "ans": 0, "why": "After a CN VII lesion proximal to the geniculate ganglion, regenerating salivary secretomotor fibers are misdirected into the greater petrosal nerve, so stimuli for salivation trigger tearing via the pterygopalatine ganglion.", "wrong": ["", "A lesion here would abolish lacrimation rather than cause gustatory tearing.", "Carries CN IX fibers to the parotid; misrouting causes Frey syndrome (sweating).", "Carries postganglionic fibers only; a lesion causes dry eye, not aberrant tearing.", "Arises distal to the geniculate ganglion; lesion affects taste and submandibular secretion."], "pearl": "Crocodile tears = aberrant regeneration of CN VII proximal to the geniculate ganglion.", "set": "cn"}, {"id": "G-36", "stem": "A 34-year-old man complains of hyperacusis (sensitivity to loud sounds). Injury to which cranial nerve is most likely responsible?", "opts": ["Hypoglossal", "Facial", "Accessory", "Vagus", "Glossopharyngeal"], "ans": 1, "why": "The facial nerve's nerve to stapedius damps stapes movement; losing it makes ordinary sounds painfully loud.", "wrong": ["Supplies tongue muscles only.", "", "Supplies SCM and trapezius.", "Has no motor role in the middle ear.", "Sensory to the middle ear and motor only to stylopharyngeus."], "pearl": "Hyperacusis in a facial palsy localizes the lesion proximal to the nerve to stapedius (in the facial canal or above).", "set": "cn"}, {"id": "G-275", "stem": "A 27-year-old woman has unilateral facial paralysis. MRI shows a small tumor at the internal acoustic meatus. Which cranial nerve is most likely compressed?", "opts": ["V", "VI", "VII", "IX", "X"], "ans": 2, "why": "The internal acoustic meatus transmits CN VII and CN VIII; of these, only CN VII moves the facial muscles.", "wrong": ["CN V exits via SOF, rotundum, and ovale.", "CN VI enters the cavernous sinus and SOF.", "", "CN IX exits via the jugular foramen.", "CN X exits via the jugular foramen."], "pearl": "Facial palsy + hearing loss = internal acoustic meatus / CP angle lesion.", "set": "cn"}, {"id": "LC-13", "stem": "A 67-year-old man presents with shingles on his left forehead, upper eyelid, and bridge of the nose. Shingles (herpes zoster) is caused by varicella zoster virus, which lies latent in sensory ganglia after chickenpox and can reactivate along one nerve's dermatome when the patient is immunocompromised. Which sensory ganglion is most likely affected in this patient?", "opts": ["Otic ganglion", "Trigeminal ganglion", "Superior cervical ganglion", "Ciliary ganglion", "Submandibular ganglion"], "ans": 1, "why": "The rash follows the V1 dermatome, so the virus is reactivating in the trigeminal (semilunar) ganglion. That sensory ganglion holds the pseudounipolar cell bodies of CN V.", "wrong": ["Otic ganglion is parasympathetic (to parotid), not a sensory ganglion.", "", "Superior cervical ganglion is sympathetic, not sensory.", "Ciliary ganglion is parasympathetic (CN III pathway).", "Submandibular ganglion is parasympathetic (CN VII pathway)."], "pearl": "Herpes zoster ophthalmicus = V1 dermatome; watch for nose-tip lesions (Hutchinson sign).", "set": "cn"}, {"id": "G-199", "stem": "A 40-year-old woman sustains a temporal bone fracture causing a facial nerve lesion proximal to the origin of the chorda tympani in the posterior wall of the tympanic cavity. Which function would most likely remain intact?", "opts": ["Control of muscles in lower half of face", "Control of secretions by submandibular gland", "Taste sensation from anterior two thirds of tongue", "Tear production by the lacrimal gland", "Voluntary closure of the eyelid"], "ans": 3, "why": "The greater petrosal nerve (lacrimal secretomotor) leaves CN VII at the geniculate ganglion, proximal to this lesion, so tearing is spared; everything distal (facial muscles, chorda tympani functions) is lost.", "wrong": ["Motor branches exit the stylomastoid foramen distal to the lesion and are lost.", "Chorda tympani fibers are distal to the lesion and are lost.", "Chorda tympani taste fibers are distal to the lesion and are lost.", "", "Orbicularis oculi is supplied by motor branches distal to the lesion."], "pearl": "Localize CN VII lesions by branch order: greater petrosal -> stapedius -> chorda tympani -> motor branches.", "set": "cn"}, {"id": "G-246", "stem": "An 87-year-old woman has a vestibular schwannoma removed from the internal acoustic meatus. Afterwards the right corner of her mouth droops, she cannot close her right eye, and food collects in her right oral vestibule. Which cranial nerve was injured?", "opts": ["IX", "X", "VII", "V2", "V3"], "ans": 2, "why": "CN VII travels with CN VIII through the internal acoustic meatus and supplies the muscles of facial expression, including orbicularis oculi (eye closure) and buccinator (keeps food out of the vestibule).", "wrong": ["CN IX supplies stylopharyngeus and posterior tongue sensation.", "CN X supplies palate, pharynx, and larynx.", "", "V2 is purely sensory to the midface.", "V3 moves the jaw; it does not close the eye or move the mouth corner."], "pearl": "Food pocketing in the cheek = buccinator weakness = CN VII (buccal branch).", "set": "cn"}, {"id": "LH-42", "stem": "A 43-year-old man has loss of facial expression across the entire right side; the right corner of his mouth droops, but he can clench his jaw and chew. He also has right-sided hearing loss and difficulty balancing on one foot. His right corneal (blink) reflex is absent, but cutaneous sensation of the whole face is normal. Imaging is ordered for a suspected tumor. What is the most likely location of the tumor?", "opts": ["Internal acoustic meatus", "Foramen ovale", "Foramen rotundum", "Geniculum of the facial canal", "Stylomastoid foramen"], "ans": 0, "why": "Combined CN VII (facial paralysis, lost efferent blink) and CN VIII (hearing and balance) deficits with intact CN V point to the internal acoustic meatus, where both nerves travel together, as with a vestibular schwannoma.", "wrong": ["", "Transmits CN V3; chewing and facial sensation are intact", "Transmits CN V2; facial sensation is intact", "Beyond this point CN VIII is no longer with CN VII, so hearing/balance would be spared", "Lesion here spares hearing and balance"], "pearl": "CN VII + CN VIII deficits together = internal acoustic meatus / cerebellopontine angle.", "set": "cn"}, {"id": "G-94", "stem": "A 45-year-old man has ear pain, hearing loss in one ear, nosebleeds and nasal obstruction, and is diagnosed with a nasopharyngeal carcinoma. There is fluid in his middle ear. Enlargement of which structure would most likely block drainage of the auditory tube?", "opts": ["Lingual tonsil", "Palatine tonsil", "Pharyngeal tonsil", "Superior constrictor muscle", "Uvula"], "ans": 2, "why": "The pharyngeal tonsil (adenoid) sits in the nasopharynx beside the auditory tube opening and pharyngeal recess, so when it enlarges it can block the tube.", "wrong": ["Lies on the posterior tongue in the oropharynx, far from the tube.", "Lies in the tonsillar fossa of the oropharynx, below the tube opening.", "", "Lies behind the pharyngeal mucosa and does not cover the tube opening.", "Rises to seal the nasopharynx when swallowing but does not block the tube."], "pearl": "Enlarged adenoids -> auditory tube blockage -> middle ear effusion.", "set": "nasal_oral"}, {"id": "G-281", "stem": "An 11-year-old girl undergoes tonsillectomy, and the surgeon damages the nerve lying in the tonsillar fossa deep to the palatine tonsil. Which deficit is most likely?", "opts": ["Loss of sensation on the posterior one third of the tongue", "Loss of taste on the anterior two thirds of the tongue", "Paralysis of the constrictor muscles of the pharynx", "Paralysis of the muscles of the soft palate", "Paralysis of the muscles of the tongue"], "ans": 0, "why": "The nerve in the tonsillar bed is CN IX, whose lingual branch carries general sensation and taste from the posterior third of the tongue.", "wrong": ["", "Anterior taste is carried by the chorda tympani (CN VII).", "Pharyngeal constrictors are supplied by CN X.", "Soft palate muscles are CN X (except tensor veli palatini, V3).", "Tongue muscles are CN XII (palatoglossus: CN X)."], "pearl": "CN IX: posterior 1/3 tongue (sensation + taste), stylopharyngeus, gag afferent, parotid secretomotor.", "set": "nasal_oral"}, {"id": "LC-20", "stem": "A 37-year-old man has decreased emotional tearing on the right and intermittent headaches. MRI shows a facial nerve schwannoma within the right pterygoid (vidian) canal. Which nerve fibers are most likely injured by this tumor?", "opts": ["Taste fibers to the anterior two thirds of the tongue", "Parasympathetic innervation to the submandibular and sublingual glands", "Presynaptic sympathetic fibers", "Presynaptic parasympathetic fibers", "Postsynaptic parasympathetic fibers"], "ans": 3, "why": "The vidian nerve combines preganglionic parasympathetic fibers (greater petrosal, CN VII) and postganglionic sympathetic fibers (deep petrosal). The parasympathetics synapse only later in the pterygopalatine ganglion, so in the canal they are still presynaptic.", "wrong": ["Carried by chorda tympani, which does not pass through the pterygoid canal.", "Carried by chorda tympani, not the pterygoid canal.", "Head sympathetics have already synapsed in the SCG, so they are postsynaptic.", "", "Parasympathetics synapse after the canal, in the pterygopalatine ganglion."], "pearl": "Vidian nerve = greater petrosal (preganglionic parasymp) + deep petrosal (postganglionic symp).", "set": "nasal_oral"}, {"id": "LC-7", "stem": "A 45-year-old man has dysarthria and fasciculations of his tongue muscles. When he protrudes his tongue, it deviates to the right. What nerve is most likely damaged?", "opts": ["Left hypoglossal nerve", "Right hypoglossal nerve", "Left glossopharyngeal nerve", "Left vagus nerve", "Right vagus nerve"], "ans": 1, "why": "CN XII supplies all tongue muscles except palatoglossus. With a right lesion, the intact left genioglossus pushes the tongue toward the weak right side.", "wrong": ["A left CN XII lesion would deviate the tongue to the left.", "", "CN IX supplies no tongue muscle, so it can't cause deviation.", "Left CN X lesion causes uvula deviation to the right, not tongue deviation.", "CN X supplies only palatoglossus in the tongue; no protrusion deficit."], "pearl": "Tongue \"licks the wound\": deviates TOWARD the damaged CN XII.", "set": "nasal_oral"}, {"id": "G-55", "stem": "An 11-year-old boy has swollen palatine tonsils. The palatine tonsils lie between the anterior and posterior tonsillar pillars. Which muscles form these pillars?", "opts": ["Levator veli palatini and tensor veli palatini", "Palatoglossus and palatopharyngeus", "Styloglossus and stylopharyngeus", "Palatopharyngeus and salpingopharyngeus", "Superior and middle pharyngeal constrictors"], "ans": 1, "why": "The anterior pillar (palatoglossal arch) contains palatoglossus and the posterior pillar (palatopharyngeal arch) contains palatopharyngeus.", "wrong": ["These elevate and tense the soft palate; they do not form the pillars.", "", "Styloglossus is in the tongue; stylopharyngeus runs deep in the pharyngeal wall.", "Salpingopharyngeus forms the salpingopharyngeal fold near the auditory tube.", "Superior constrictor forms the tonsillar bed floor, not the pillars."], "pearl": "Tonsillar fossa: anterior = palatoglossus, posterior = palatopharyngeus, floor = superior constrictor (CN IX runs on it).", "set": "nasal_oral"}, {"id": "G-89", "stem": "A 5-year-old girl with an upper respiratory infection hears poorly and has a painful right ear, with golden-brown fluid behind the tympanic membrane. What is the most likely direct route for infection to spread from the upper airway to the middle ear?", "opts": ["Pharyngotympanic tube", "Choanae", "Nostrils", "Facial canal", "Internal acoustic meatus"], "ans": 0, "why": "The pharyngotympanic (auditory) tube runs directly from the nasopharynx to the middle ear, so throat infections can travel along it.", "wrong": ["", "The choanae connect the nasal cavity to the nasopharynx, not to the ear.", "The nostrils open the nose to the outside only.", "The facial canal carries CN VII through the temporal bone.", "The internal acoustic meatus carries CN VII and VIII, not infection from the pharynx."], "pearl": "The auditory tube opens in the nasopharynx at the torus tubarius; it is the path for otitis media.", "set": "nasal_oral"}, {"id": "G-271", "stem": "A 12-year-old boy has symptoms of sinusitis. Tapping just above the middle of his eyebrows causes pain. Which area is being examined?", "opts": ["Maxillary sinus", "Temporal bone", "Frontal sinus", "Sphenoid sinus", "Ethmoid sinus"], "ans": 2, "why": "The frontal sinuses sit in the frontal bone just above the orbital margins, so tapping above the eyebrows tests them.", "wrong": ["The maxillary sinus is tapped over the cheek.", "The temporal bone is lateral, not above the eyebrows.", "", "The sphenoid sinus is deep and cannot be percussed.", "Ethmoid cells lie between the orbits beside the nasal bridge."], "pearl": "Frontal sinus drains to the middle meatus via the frontonasal duct/semilunar hiatus.", "set": "nasal_oral"}, {"id": "G-296", "stem": "A 20-year-old motorcyclist has a minimally displaced fracture of the floor of the middle cranial fossa involving the pterygoid canal. Which fiber types are most likely affected?", "opts": ["Presynaptic parasympathetic", "Postsynaptic sympathetic; presynaptic parasympathetic", "Postsynaptic sympathetic; postsynaptic parasympathetic", "Special sensory; postsynaptic parasympathetic", "General sensory; postsynaptic parasympathetic"], "ans": 1, "why": "The nerve of the pterygoid canal forms from the greater petrosal nerve (preganglionic parasympathetic from CN VII) and the deep petrosal nerve (postganglionic sympathetic from the internal carotid plexus).", "wrong": ["Omits the postganglionic sympathetic fibers of the deep petrosal nerve.", "", "The parasympathetic fibers have not yet synapsed in the pterygopalatine ganglion.", "Taste and postganglionic fibers are not in the Vidian nerve.", "General sensory and postganglionic parasympathetic fibers travel with V2 branches, not the canal."], "pearl": "Vidian nerve = greater petrosal (pre-parasympathetic) + deep petrosal (post-sympathetic) -> pterygopalatine ganglion.", "set": "nasal_oral"}, {"id": "BC-12", "stem": "After a penetrating injury in the submandibular triangle, the tongue of a 45-year-old patient deviates to the left on protrusion. Which of the following nerves is injured?", "opts": ["Right lingual nerve", "Left lingual nerve", "Right hypoglossal nerve", "Left hypoglossal nerve", "Left glossopharyngeal nerve"], "ans": 3, "why": "A hypoglossal lesion weakens the ipsilateral genioglossus, so the intact side pushes the tongue toward the injured side. Leftward deviation means the left CN XII is damaged.", "wrong": ["Lingual nerve is sensory; no tongue motor function.", "Lingual nerve is sensory; no tongue motor function.", "Right CN XII lesion would deviate the tongue to the right.", "", "CN IX does not supply tongue muscles."], "pearl": "Tongue 'licks the lesion' - deviates toward the injured CN XII.", "set": "nasal_oral"}, {"id": "G-98", "stem": "A 4-year-old boy with ankyloglossia is seen by a speech therapist and referred to a pediatric surgeon. Which operation is most appropriate for this condition?", "opts": ["Removal of pterygomandibular raphe", "Resection of the pterygoid hamulus bilaterally", "Cutting the lingual frenulum", "Repair of the palate", "Removal of the central segment of the hyoid bone"], "ans": 2, "why": "In ankyloglossia (tongue-tie), the lingual frenulum is abnormally short or reaches the tip of the tongue, which limits movement. Cutting it (frenotomy) is the treatment.", "wrong": ["The raphe anchors the buccinator and superior constrictor; it has nothing to do with tongue-tie.", "The hamulus is the pulley for the tensor veli palatini; it does not tether the tongue.", "", "Palate repair treats cleft palate, not tongue-tie.", "Removing part of the hyoid is used for thyroglossal duct cysts (Sistrunk), not tongue-tie."], "pearl": "Ankyloglossia = short lingual frenulum -> frenotomy.", "set": "nasal_oral"}, {"id": "G-254", "stem": "A 55-year-old man with a history of cocaine use has severe epistaxis from Kiesselbach's area. Anastomoses between which arteries are involved?", "opts": ["Descending palatine and ascending pharyngeal", "Posterior superior alveolar and accessory meningeal", "Lateral branches of posterior ethmoidal and middle meningeal", "Branches of sphenopalatine, superior labial, and anterior ethmoidal", "Descending palatine and tonsillar branches of the ascending pharyngeal"], "ans": 3, "why": "Kiesselbach's plexus on the anterior septum is formed by the sphenopalatine, superior labial (facial), anterior ethmoidal, and greater palatine arteries. It is the most common site of epistaxis.", "wrong": ["These vessels lie in the palate and pharynx, not the anterior septum.", "The PSA runs in the maxilla; the accessory meningeal serves the ITF/cranium.", "The middle meningeal artery is intracranial and does not reach the septum.", "", "These supply the palate and tonsil, not the anterior septum."], "pearl": "Kiesselbach (anterior septum) = most epistaxis; posterior bleeds = sphenopalatine a.", "set": "nasal_oral"}, {"id": "BH-14", "stem": "After a tonsillectomy, a 57-year-old man with a long history of chewing tobacco cannot detect taste on the posterior one-third of his tongue. Which nerve was most likely injured?", "opts": ["Internal laryngeal nerve", "Lingual nerve", "Glossopharyngeal nerve", "Greater palatine nerve", "Chorda tympani"], "ans": 2, "why": "The lingual branch of CN IX, which runs in the tonsillar bed, carries both taste and general sensation from the posterior third of the tongue.", "wrong": ["Internal laryngeal nerve supplies the epiglottic region.", "Lingual nerve provides general sensation to the anterior 2/3.", "", "Greater palatine nerve supplies the hard palate.", "Chorda tympani carries taste from the anterior 2/3."], "pearl": "CN IX lies in the tonsillar bed - at risk in tonsillectomy.", "set": "nasal_oral"}, {"id": "G-280", "stem": "A 25-year-old man has an occipital bone fracture extending upward from the foramen magnum. Which structure passes through the foramen magnum?", "opts": ["Cranial nerve I", "Cranial nerve IX", "Cranial nerve X", "Cranial nerve XI", "Cranial nerve XII"], "ans": 3, "why": "The spinal roots of CN XI ascend through the foramen magnum (along with the medulla, vertebral arteries, and spinal arteries) before exiting via the jugular foramen.", "wrong": ["CN I passes through the cribriform plate.", "CN IX exits through the jugular foramen.", "CN X exits through the jugular foramen.", "", "CN XII exits through the hypoglossal canal."], "pearl": "Foramen magnum: medulla, vertebral aa., spinal aa., spinal roots of CN XI.", "set": "cranial"}, {"id": "BH-12", "stem": "A 25-year-old man hits his head on a concrete bridge wall in a car accident. CT shows rupture of the middle meningeal artery with the meninges intact. Blood leaking from this artery enters which of the following spaces?", "opts": ["Subarachnoid space", "Subdural space", "Epidural space", "Subpial space", "Cranial dural sinuses"], "ans": 2, "why": "The middle meningeal artery runs between the skull and the periosteal dura, so its rupture strips the dura from bone to form an epidural hematoma.", "wrong": ["Subarachnoid bleeding comes from cerebral vessels/aneurysms.", "Subdural hematoma comes from torn bridging veins.", "", "Subpial bleeding comes from small pial/brain vessels.", "Dural sinuses carry venous blood, not arterial leakage."], "pearl": "Pterion fracture -> middle meningeal a. -> epidural hematoma (lucid interval, biconvex).", "set": "cranial"}, {"id": "BC-4", "stem": "A 23-year-old woman sustains a fracture through the jugular foramen in a car accident. Which of the following nerves is/are most likely damaged?", "opts": ["Cranial nerve V2", "Cranial nerve VI", "Cranial nerves VII and VIII", "Cranial nerves IX, X, and XI", "Cranial nerve XII"], "ans": 3, "why": "CN IX, X, and XI leave the skull through the jugular foramen together with the internal jugular vein.", "wrong": ["V2 exits via foramen rotundum.", "CN VI enters the orbit via the superior orbital fissure.", "CN VII and VIII use the internal acoustic meatus.", "", "CN XII exits via the hypoglossal canal."], "pearl": "Jugular foramen = CN IX, X, XI + IJV (jugular foramen syndrome).", "set": "cranial"}, {"id": "G-81", "stem": "A 16-year-old boy with severe facial acne has fever, confusion and drowsiness. Imaging shows cavernous sinus thrombosis. Which route most likely carried the infection into the cavernous sinus?", "opts": ["Carotid artery", "Mastoid emissary vein", "Middle meningeal artery", "Ophthalmic vein", "Parietal emissary vein"], "ans": 3, "why": "Veins around the nose drain through the angular vein into the superior ophthalmic vein, which empties straight into the cavernous sinus. These veins have no valves, so infection can travel backward into the sinus.", "wrong": ["The ICA passes through the sinus but is not a route for infection from the face.", "The mastoid emissary vein links scalp veins with the sigmoid sinus, not the face with the cavernous sinus.", "The middle meningeal artery lies between dura and bone and does not drain the face.", "", "The parietal emissary vein connects scalp veins to the superior sagittal sinus."], "pearl": "Danger triangle of face -> angular v. -> superior ophthalmic v. -> cavernous sinus (valveless veins).", "set": "cranial"}, {"id": "G-270", "stem": "A 10-year-old child has severe ear pain, headache, and fever for 5 days. The tympanic membrane is red and bulging with purulent effusion, and there is tenderness over the mastoid process. If the mastoid air cells are now infected, which venous channel is most at risk of thrombosis due to its proximity to the infected bone?", "opts": ["Cavernous sinus", "Pterygoid venous plexus", "Sigmoid sinus", "Straight sinus", "Superior petrosal sinus"], "ans": 2, "why": "The sigmoid sinus grooves the inner surface of the mastoid part of the temporal bone and receives mastoid emissary veins, so mastoiditis can spread directly to it and cause thrombosis.", "wrong": ["The cavernous sinus is beside the sella, not the mastoid.", "The pterygoid plexus is in the infratemporal fossa.", "", "The straight sinus lies at the falx-tentorium junction in the midline.", "The superior petrosal sinus runs along the petrous ridge, not the mastoid."], "pearl": "Mastoiditis -> sigmoid sinus thrombosis (sigmoid sinus lies directly behind mastoid air cells).", "set": "cranial"}, {"id": "LC-14", "stem": "A 13-year-old girl has loss of sensation in her right lower eyelid, the skin below her right eye, and her upper lip and teeth. What is the most likely location of the nerve lesion?", "opts": ["Foramen rotundum", "Foramen spinosum", "Superior orbital fissure", "Foramen ovale", "Optic canal"], "ans": 0, "why": "All deficits fall in the V2 (maxillary) territory. V2 leaves the middle cranial fossa through the foramen rotundum in the greater wing of the sphenoid.", "wrong": ["", "Transmits middle meningeal artery and meningeal branch of V3.", "Transmits CN III, IV, V1, VI, and superior ophthalmic vein.", "Transmits V3, which supplies lower lip and chin.", "Transmits CN II and the ophthalmic artery."], "pearl": "V1 = superior orbital fissure, V2 = rotundum, V3 = ovale (\"Standing Room Only\").", "set": "cranial"}, {"id": "G-159", "stem": "A 34-year-old man sustains multiple lacerations of the scalp over the frontal bone after a motorcycle crash without a helmet. Which of the following veins could most likely provide a pathway for spread of infection from the scalp veins to the underlying dural venous sinuses?", "opts": ["Supratrochlear vein", "Diploic veins", "Anterior cerebral veins", "Superior sagittal sinus", "Supraorbital vein"], "ans": 1, "why": "Diploic veins run within the spongy bone between the skull tables and, together with emissary veins, link the scalp veins to the dural venous sinuses. This valveless route lets scalp infection reach the cranial cavity.", "wrong": ["Superficial scalp vein draining to the face; no direct sinus connection.", "", "An intracranial vein; it does not communicate with scalp veins.", "This is the destination sinus, not the connecting channel from the scalp.", "Superficial forehead vein; drains to the face/ophthalmic veins, not directly to the sinuses."], "pearl": "Scalp infection reaches dural sinuses via emissary + diploic veins (loose areolar 'danger zone').", "set": "cranial"}, {"id": "LH-11", "stem": "A 7-year-old boy was kicked in the right side of his head. He had no loss of consciousness but complains of severe headache and vomiting. CT reveals a biconvex (lens-shaped) hyperdense extra-axial collection of blood. What blood vessel is the most likely source of the bleed?", "opts": ["Superficial temporal artery", "Middle meningeal artery", "Superior cerebral veins", "Cerebral arterial circle (of Willis)", "Middle cerebral artery (MCA)"], "ans": 1, "why": "A blow to the side of the head at the pterion can tear the middle meningeal artery, producing an epidural hematoma that appears biconvex because it is limited by the sutures where dura is attached.", "wrong": ["Lies outside the skull in the scalp; causes a scalp hematoma, not intracranial bleeding", "", "Bridging-vein tears cause a crescent-shaped subdural hematoma", "Aneurysm rupture causes subarachnoid hemorrhage, not a biconvex collection", "Bleeding is intracerebral or subarachnoid, not extradural"], "pearl": "Epidural = middle meningeal a. at pterion, biconvex, lucid interval.", "set": "cranial"}, {"id": "G-42", "stem": "A 35-year-old woman has cavernous sinus thrombosis resulting from a facial infection. What is the most direct route for spread of infection from the face to the cavernous sinus?", "opts": ["Pterygoid venous plexus", "Superior ophthalmic vein", "Frontal venous plexus", "Basilar venous plexus", "Parietal emissary vein"], "ans": 1, "why": "The facial vein in the danger triangle communicates with the superior ophthalmic vein, which drains straight into the cavernous sinus.", "wrong": ["Reaches the sinus only indirectly via the inferior ophthalmic vein/emissary veins.", "", "Does not connect directly to the cavernous sinus.", "Links the inferior petrosal sinuses to the vertebral venous plexus.", "Connects scalp veins to the superior sagittal sinus, not cavernous."], "pearl": "Danger triangle → facial v. → superior ophthalmic v. (valveless) → cavernous sinus.", "set": "cranial"}, {"id": "LH-26", "stem": "A 36-year-old man flies over the handlebars of his motorcycle without a helmet and strikes his head. He is alert but has a clear nasal discharge that tests positive for glucose. The patient most likely has a fracture of which of the following bones?", "opts": ["Ethmoid", "Vomer", "Sphenoid", "Maxilla", "Frontal"], "ans": 0, "why": "Glucose-positive clear rhinorrhea is CSF. The cribriform plate of the ethmoid separates the anterior cranial fossa from the nasal cavity, so its fracture lets CSF leak from the nose.", "wrong": ["", "Forms the posteroinferior nasal septum; does not border the cranial cavity", "A sphenoid fracture would drain CSF via the sphenoid sinus but is less typical than cribriform injury", "Does not border the cranial cavity", "Frontal sinus injury can leak CSF, but the classic site of CSF rhinorrhea is the cribriform plate"], "pearl": "CSF rhinorrhea (+ anosmia) = cribriform plate of ethmoid fracture.", "set": "cranial"}, {"id": "G-293", "stem": "A 30-year-old unrestrained driver has facial deformity with step-off defects over the nasal root and glabella and clear fluid draining from his nose. CT shows a fracture of the middle region of the anterior cranial fossa. What will he most likely complain of once conscious?", "opts": ["Blurred vision", "Diplopia", "Anosmia", "Blindness", "Dry left eye"], "ans": 2, "why": "The midline anterior cranial fossa contains the cribriform plate. Its fracture tears olfactory fibers (anosmia) and dura (CSF rhinorrhea).", "wrong": ["Blurred vision relates to CN III/lens or globe injury, not the cribriform plate.", "Diplopia implies orbital or extraocular nerve injury.", "", "Blindness implies optic canal injury, which is posterior-lateral.", "Dry eye implies injury to the lacrimal pathway (greater petrosal/pterygopalatine)."], "pearl": "CSF rhinorrhea + anosmia = cribriform plate fracture.", "set": "cranial"}, {"id": "G-78", "stem": "A 47-year-old woman has signs of cavernous sinus thrombosis, and imaging shows a pituitary tumor invading the cavernous sinus. The physician suspects the tumor has damaged her right abducens nerve. In which direction would the physician most likely ask her to move her right eye to confirm the abducens injury, assuming she cannot do it?", "opts": ["Inward", "Outward", "Downward", "Down and out", "Down and in"], "ans": 1, "why": "CN VI supplies only the lateral rectus, the muscle that abducts (turns the eye outward). Failure to look outward is the direct test for abducens injury.", "wrong": ["Adduction is done by the medial rectus (CN III).", "", "Downward gaze uses inferior rectus (CN III) and superior oblique (CN IV).", "Down and out needs inferior rectus plus lateral rectus; not a pure CN VI test.", "Down and in is the superior oblique (CN IV) test."], "pearl": "CN VI = lateral rectus = abduction; it is the most vulnerable nerve in the cavernous sinus (runs free beside the ICA).", "set": "orbit"}, {"id": "G-23", "stem": "A 31-year-old woman has a large hematoma inferior to the right jugular foramen after a car collision. She has right miosis, ptosis, and anhidrosis of the face. Which ganglion is most likely affected?", "opts": ["Submandibular", "Trigeminal (semilunar or Gasserian)", "Superior cervical", "Geniculate", "Ciliary"], "ans": 2, "why": "The superior cervical ganglion, top of the sympathetic chain just below the skull base, supplies the head; its injury produces Horner syndrome (ptosis, miosis, anhidrosis).", "wrong": ["Parasympathetic ganglion for submandibular/sublingual glands.", "Contains only sensory cell bodies of CN V.", "", "Sensory ganglion of CN VII (taste); no sympathetic role.", "Parasympathetic ganglion; lesion causes a dilated pupil, not miosis or facial anhidrosis."], "pearl": "Horner = ptosis (superior tarsal m.) + miosis + anhidrosis; SCG sits at C1–C2 just below the jugular foramen.", "set": "orbit"}, {"id": "G-164", "stem": "A 22-year-old man is injured in a street fight and suffers a forehead fracture, resulting in black, swollen eyes. Because he is in severe pain, an anesthetic solution is injected into his orbit toward the orbital apex. Which of the following nerves is most likely to be anesthetized?", "opts": ["Ophthalmic", "Infraorbital", "Anterior ethmoidal", "Frontal", "Optic"], "ans": 0, "why": "A needle passed through the upper eyelid near the orbital margin and directed toward the orbital apex bathes the branches of the ophthalmic division (V1), including the nasociliary, frontal, and lacrimal nerves, anesthetizing the orbit.", "wrong": ["", "V2 branch in the orbital floor canal; not the target of an orbital apex block.", "Only one small branch of the nasociliary; the block affects the whole V1 division.", "Only one V1 branch; the apex injection reaches the entire ophthalmic division.", "Special sensory nerve for vision, not the target for pain relief."], "pearl": "Retrobulbar/orbital apex block anesthetizes V1 branches (and nearby motor nerves).", "set": "orbit"}, {"id": "G-244", "stem": "A 22-year-old baseball player is hit in the eye. He moves the eye normally and sees distant objects, but cannot focus on near objects. Injury to which nerve structures most likely explains this?", "opts": ["Trochlear nerve and abducens nerve", "Oculomotor nerve and abducens nerve", "Superior cervical ganglion and long ciliary nerves", "Short ciliary nerves and ciliary ganglion", "Infratrochlear nerve and ciliary ganglion"], "ans": 3, "why": "Accommodation needs parasympathetic input to the ciliary muscle and sphincter pupillae via the ciliary ganglion and short ciliary nerves. Since eye movements are normal, the lesion is in this parasympathetic pathway rather than the motor nerves.", "wrong": ["IV and VI injury would impair eye movement, which is normal here.", "Eye movements are intact, so CN III/VI trunks are not the issue.", "Sympathetic fibers dilate the pupil; they do not mediate accommodation.", "", "Infratrochlear is a sensory V1 branch with no role in accommodation."], "pearl": "Near focus = ciliary muscle contraction via CN III -> ciliary ganglion -> short ciliary nerves.", "set": "orbit"}, {"id": "G-39", "stem": "A 48-year-old man has a constricted right pupil; his left pupil and vision in both eyes are normal. These findings are most likely due to a lesion of which right-sided structure?", "opts": ["Oculomotor nerve", "Superior cervical ganglion", "Nervus intermedius", "Edinger-Westphal nucleus", "Trigeminal (semilunar, Gasserian) ganglion"], "ans": 1, "why": "A constricted pupil means loss of sympathetic dilator input; the superior cervical ganglion supplies postganglionic sympathetics to the dilator pupillae via the internal carotid plexus.", "wrong": ["Lesion abolishes constriction, producing a dilated pupil.", "", "Parasympathetic to lacrimal/salivary glands; no pupillary role.", "Lesion removes constriction, causing mydriasis.", "Purely sensory; no effect on pupil size."], "pearl": "Miosis = sympathetic loss (Horner/SCG); mydriasis = parasympathetic loss (CN III/Edinger-Westphal/ciliary ganglion).", "set": "orbit"}, {"id": "BH-52", "stem": "A 60-year-old man cannot open his eye because of a rare neuromuscular disease. Which muscle is most likely paralyzed?", "opts": ["Orbicularis oculi", "Orbicularis oris", "Frontalis", "Levator palpebrae superioris", "Superior rectus"], "ans": 3, "why": "The levator palpebrae superioris (CN III, with a sympathetic superior tarsal part) elevates the upper eyelid to open the eye.", "wrong": ["Orbicularis oculi closes the eye.", "Orbicularis oris closes the lips.", "Frontalis elevates the eyebrows.", "", "Superior rectus elevates the eyeball, not the lid."], "pearl": "Ptosis: levator palpebrae (CN III) or superior tarsal muscle (sympathetic); myasthenia classically.", "set": "orbit"}, {"id": "LH-74", "stem": "In a bar fight, the orbit of a 25-year-old man is pierced by a broken pool cue that extends back to the superior orbital fissure. Which of the following nerves is most likely damaged?", "opts": ["Optic nerve", "Facial nerve", "Mandibular division of trigeminal", "Maxillary division of trigeminal", "Ophthalmic division of trigeminal"], "ans": 4, "why": "The branches of CN V1 (lacrimal, frontal, nasociliary) enter the orbit through the superior orbital fissure, along with CN III, IV, VI, and the superior ophthalmic vein.", "wrong": ["Enters the orbit through the optic canal", "Does not enter the orbit", "Exits the skull through the foramen ovale", "Exits through the foramen rotundum", ""], "pearl": "Superior orbital fissure: CN III, IV, V1, VI + superior ophthalmic v.", "set": "orbit"}, {"id": "G-162", "stem": "A 16-year-old female volleyball player is hit in the eye with a ball. Radiographs reveal a blow-out fracture of the inferior wall of the orbit. The pupil of her eye cannot be turned upward. Which of the following muscle(s) is (are) most likely injured?", "opts": ["Inferior rectus and inferior oblique", "Medial and inferior recti", "Inferior oblique", "Medial rectus, inferior rectus, and inferior oblique", "Inferior rectus"], "ans": 0, "why": "The fractured orbital floor can trap the inferior rectus and inferior oblique, which then anchor the globe and prevent upward gaze. The muscles and their nerves are not necessarily damaged.", "wrong": ["", "Medial rectus lies on the medial wall, not the floor.", "Only part of the floor-related tethering; the inferior rectus is the main entrapped muscle.", "Medial rectus is not involved in a floor fracture.", "Commonly entrapped, but the keyed answer includes the inferior oblique, which also lies near the floor."], "pearl": "Orbital floor fracture: entrapped inferior rectus -> impaired upgaze + diplopia; check infraorbital n.", "set": "orbit"}, {"id": "G-75", "stem": "A 56-year-old woman complains of diplopia when walking down stairs. A lesion of which nerve is most likely responsible?", "opts": ["Optic", "Oculomotor", "Abducens", "Trochlear", "Frontal"], "ans": 3, "why": "CN IV supplies superior oblique, the main depressor of the adducted eye used when looking down at stairs; its paralysis causes vertical diplopia on downgaze.", "wrong": ["Lesion reduces vision rather than causing diplopia on downgaze.", "Causes 'down and out' eye with ptosis, not isolated downgaze diplopia.", "Causes horizontal diplopia with failed abduction.", "", "Sensory branch of V1 to the forehead."], "pearl": "Trouble reading or going down stairs + head tilt away from lesion = CN IV (superior oblique) palsy.", "set": "orbit"}, {"id": "G-104", "stem": "The dilator pupillae, the smooth muscle of the superior tarsal muscle and the smooth muscle of the ciliary body blood vessels all receive efferent nerve fibers. Which structure contains the cell bodies of these fibers?", "opts": ["Pterygopalatine ganglion", "Intermediolateral nucleus (lateral horn) C1 to C4", "Geniculate ganglion", "Nucleus solitarius", "Superior cervical ganglion"], "ans": 4, "why": "All of these targets receive sympathetic supply. The postganglionic cell bodies for the head are in the superior cervical ganglion, and their fibers travel with the internal carotid and ophthalmic arteries.", "wrong": ["A parasympathetic ganglion (CN VII) for the lacrimal and nasal glands.", "The lateral horn exists only from T1 to L2, and it holds preganglionic neurons.", "A sensory ganglion of CN VII (taste); it has no efferent cell bodies.", "A sensory nucleus for taste and visceral input.", ""], "pearl": "Postganglionic sympathetics to the eye come from the superior cervical ganglion (preganglionic cells at T1).", "set": "orbit"}, {"id": "G-189", "stem": "A 22-year-old man has a sinus infection involving the posterior ethmoidal cells and complains of progressive loss of vision. Which of the following structures is most likely affected?", "opts": ["Ophthalmic artery", "Nasociliary nerve", "Anterior ethmoidal nerve", "Trochlear nerve", "Abducens nerve"], "ans": 0, "why": "The ophthalmic artery gives rise to the central retinal artery, an end artery. Spread of posterior ethmoidal infection near the orbital apex compromising this blood supply leads to loss of vision.", "wrong": ["", "Sensory to the eye (corneal reflex afferent); no role in vision.", "Sensory to the anterior ethmoid cells and nose; no role in vision.", "Motor to superior oblique; affects movement, not vision.", "Motor to lateral rectus; affects abduction, not vision."], "pearl": "Ophthalmic a. -> central retinal a. (end artery): compromise = vision loss.", "set": "orbit"}, {"id": "G-163", "stem": "A 36-year-old man presents with a painful rash on the dorsum of his nose. Examination reveals a herpetic lesion affecting the dorsum of the nose and the eyeball. Which of the following nerves is most likely responsible for transmission of the virus to the eye?", "opts": ["Nasociliary", "Supratrochlear", "Infraorbital", "Posterior ethmoidal", "Anterior ethmoidal"], "ans": 0, "why": "Vesicles on the tip/dorsum of the nose (Hutchinson sign) indicate V1 zoster in the nasociliary distribution. The nasociliary nerve also supplies the globe (long ciliary nerves), so nasal involvement predicts eye involvement.", "wrong": ["", "Frontal nerve branch supplying the forehead skin; no sensory branches to the globe.", "V2 branch supplying cheek and upper lip, not the eyeball.", "Nasociliary branch to sphenoid/posterior ethmoid cells; does not reach the nasal dorsum skin.", "Supplies the nasal tip via external nasal branch but not the eyeball itself."], "pearl": "Hutchinson sign: nasal tip zoster = nasociliary (V1) -> high risk of ocular involvement.", "set": "orbit"}, {"id": "G-121", "stem": "A 17-year-old girl with severe acne has a painful, inflamed lesion on the side of her nose. She is warned not to squeeze it, because infection between the eye and upper lip or beside the nose can spread to the cavernous sinus. Which route of spread is most typical?", "opts": ["Nasal venous tributary to angular vein, to superior ophthalmic vein, then to cavernous sinus", "Retromandibular vein to supraorbital vein, then to inferior ophthalmic vein, then to cavernous sinus", "Dorsal nasal vein to superior petrosal vein, then inferior ophthalmic vein to cavernous sinus", "Facial vein to maxillary vein, then middle meningeal vein to cavernous sinus", "Transverse facial vein to superficial temporal vein to emissary vein to cavernous sinus"], "ans": 0, "why": "Veins at the side of the nose drain into the angular vein, which joins the superior ophthalmic vein, which empties into the cavernous sinus. These veins have no valves, so infection can flow backward.", "wrong": ["", "The retromandibular vein does not drain into the supraorbital vein.", "The superior petrosal sinus drains out of the cavernous sinus, not from nasal veins.", "This is not the usual path from the nose; the maxillary vein joins the pterygoid plexus.", "The superficial temporal and emissary routes do not drain the nose area."], "pearl": "Danger triangle: angular v. -> superior ophthalmic v. -> cavernous sinus.", "set": "face"}, {"id": "G-168", "stem": "A 2-month-old male infant falls from his stroller. Examination shows signs of facial nerve injury. What is the most common place for facial nerve injury in an infant?", "opts": ["At the stylomastoid foramen", "Posterior to the parotid gland", "Anterior to the parotid gland", "Proximal to the stylomastoid foramen", "Within the parotid, involving the zygomatic and buccal branches"], "ans": 0, "why": "In infants the mastoid process is undeveloped, so the facial nerve emerging from the stylomastoid foramen lies unprotected just under the skin and is vulnerable to trauma or forceps.", "wrong": ["", "The nerve enters the parotid posteriorly but is most exposed right at its exit.", "Branches here are more protected by the gland and not the typical site.", "The intratemporal nerve (facial canal) is protected by bone unless there is a fracture.", "Isolated branch injury is not the most common infant site."], "pearl": "Infant: no mastoid process -> CN VII exposed at the stylomastoid foramen.", "set": "face"}, {"id": "G-28", "stem": "A 55-year-old factory worker has severe scalp lacerations that were sutured. Three days later the wound is inflamed, swollen, and painful. Between which tissue layers is the infection most likely located?", "opts": ["The periosteum and bone", "The aponeurosis and the periosteum", "The dense connective tissue and the aponeurosis", "The dense connective tissue and the skin", "The dermis and the epidermis"], "ans": 1, "why": "The layer between the epicranial aponeurosis and the pericranium is the loose connective tissue 'danger zone'; infection spreads easily there and can reach the cranial cavity via emissary veins.", "wrong": ["Periosteum is firmly bound to bone, leaving no plane for spread.", "", "These layers are tightly fused; no loose space for spread.", "Skin and dense connective tissue are firmly united.", "The epidermis and dermis rarely separate; skin is a strong barrier."], "pearl": "SCALP: Skin, Connective tissue (dense), Aponeurosis, Loose areolar tissue (danger zone, emissary veins), Pericranium.", "set": "face"}, {"id": "LH-1", "stem": "A 59-year-old man with a herpes zoster infection within the mandibular division of the trigeminal nerve (CN V3) complains of weakness when opening his mouth. Evaluation reveals difficulty protruding the mandible, and when protrusion is accomplished the mandible deviates to the left side. What muscle is most likely weakened?", "opts": ["Anterior belly of digastric", "Lateral pterygoid", "Masseter", "Medial pterygoid", "Temporalis"], "ans": 1, "why": "The lateral pterygoid pulls the condyle forward onto the articular eminence, producing protrusion and helping open the mouth. With the left muscle weak, the intact right lateral pterygoid pushes the jaw toward the weak (left) side on protrusion.", "wrong": ["Suprahyoid muscle that elevates the hyoid; no role in jaw deviation on protrusion", "", "Elevates (closes) the mandible; not the main protruder", "Mainly elevates the mandible; only assists protrusion", "Elevates and retracts the mandible; does not protrude it"], "pearl": "Jaw deviates TOWARD the side of a weak lateral pterygoid (CN V3 lesion).", "set": "face"}, {"id": "G-114", "stem": "A 55-year-old man slips and falls. He has a hematoma in the 'danger zone' of the scalp that spreads into his eyelids. Which layer is the 'danger zone'?", "opts": ["Loose, areolar layer", "Skin", "Galea aponeurotica", "Pericranium", "Subcutaneous layer"], "ans": 0, "why": "Blood and infection spread easily through the loose areolar layer, which also has emissary veins that connect to the dural sinuses. The frontalis has no bony attachment, so blood can track forward into the eyelids.", "wrong": ["", "The outer layer of the scalp; it does not allow spread.", "A tough aponeurosis; it is not a space.", "Firmly attached at the sutures, which limits the spread of blood.", "Dense connective tissue with many blood vessels; it limits spread and makes wounds gape."], "pearl": "SCALP: the Loose areolar layer is the danger zone (emissary veins lead into the dural sinuses).", "set": "face"}, {"id": "G-233", "stem": "A 20-year-old construction worker has an occipital scalp laceration that is closed. Three days later he has a tender, red, infected wound that has spread anteriorly across the scalp. Between which layers of the scalp has the infection spread?", "opts": ["The periosteum and bone", "The aponeurosis and the periosteum", "The dense connective tissue and the aponeurosis", "The dense connective tissue and the skin", "The dermis and the epidermis"], "ans": 1, "why": "The loose areolar tissue (layer 4) lies between the epicranial aponeurosis and the pericranium; it lets pus and blood spread freely across the scalp. It is the 'danger layer' because emissary veins crossing it can carry infection intracranially.", "wrong": ["Pericranium is tightly bound to bone, especially at sutures; spread here is limited.", "", "Dense connective tissue is fused to the aponeurosis; no potential space.", "Skin and dense connective tissue are tightly bound as a unit.", "Epidermis and dermis are not a separable space for spreading infection."], "pearl": "SCALP: layer 4 (Loose areolar tissue) = danger layer; emissary veins link it to dural sinuses.", "set": "face"}, {"id": "G-295", "stem": "A 30-year-old unrestrained driver has a displaced transverse fracture of the right mandibular ramus just above the angle. Which function will most likely be affected?", "opts": ["Elevation of the jaw", "Lateral deviation of the jaw to the left side", "Salivation; sensation and taste from the anterior tongue", "Sensation from skin over anterior cheek and tongue", "Salivation; sensation from posterior temporal skin and tragus of the ear"], "ans": 2, "why": "The lingual nerve, carrying chorda tympani fibers, runs between the medial pterygoid and the ramus. A ramus fracture can injure it, reducing submandibular/sublingual salivation plus general sensation and taste from the anterior tongue.", "wrong": ["Elevation uses masseter, temporalis, and medial pterygoid, which are not denervated here.", "Lateral deviation depends on the pterygoids, which remain innervated.", "", "Anterior cheek skin is not supplied by the lingual nerve.", "That pattern is auriculotemporal (parotid, temple, tragus), which lies higher and posterior."], "pearl": "Lingual n. + chorda tympani: anterior 2/3 tongue sensation and taste; submandibular/sublingual secretion.", "set": "face"}, {"id": "G-261", "stem": "A 40-year-old singer who grinds her teeth has left jaw pain, left earache, and headache. Opening her mouth wide is painful and clicks, the jaw deviates slightly left on elevation, the area around the left condyle is tender, and there is spasm-like tightness only along the left mandibular ramus. Spasm of which muscle is most likely?", "opts": ["Buccinator", "Masseter", "Mylohyoid", "Posterior belly of the digastric", "Lateral pterygoid"], "ans": 1, "why": "The masseter runs from the zygomatic arch to the lateral ramus and is a strong jaw elevator. Bruxism can make it hypertrophied and spastic, which limits depression of the mandible and produces tightness along the ramus.", "wrong": ["Buccinator is a facial muscle of the cheek, not a jaw elevator.", "", "Mylohyoid lies in the floor of the mouth, not along the ramus.", "The digastric depresses the mandible and lies below it.", "The lateral pterygoid is deep in the ITF and cannot be felt along the ramus."], "pearl": "Tightness palpable over the ramus = masseter; bruxism -> masseter hypertrophy.", "set": "face"}, {"id": "G-72", "stem": "A 12-year-old girl has chronic middle ear infections that have damaged the tympanic plexus, destroying the preganglionic parasympathetic fibers that pass through it. Which condition will be detectable on examination?", "opts": ["Diminished mucus in the nasal cavity", "Diminished mucus on the soft palate", "Diminished saliva production by the parotid gland", "Diminished saliva production by the submandibular and sublingual glands", "Diminished tear production by the lacrimal gland"], "ans": 2, "why": "CN IX preganglionic fibers traverse the tympanic plexus and leave as the lesser petrosal nerve to the otic ganglion, which drives parotid secretion.", "wrong": ["Nasal glands are supplied via the greater petrosal/pterygopalatine ganglion.", "Palatal glands are supplied via the greater petrosal/pterygopalatine ganglion.", "", "These glands are supplied via chorda tympani/submandibular ganglion.", "Lacrimal gland is supplied via the greater petrosal/pterygopalatine ganglion."], "pearl": "Tympanic plexus (CN IX, Jacobson's nerve) → lesser petrosal → otic ganglion → parotid.", "set": "face"}, {"id": "LC-2", "stem": "A 59-year-old man is unable to close his right eye. Examination also shows an asymmetric smile and an inability to wrinkle the right side of his forehead. What cranial nerve is affected?", "opts": ["Trigeminal nerve", "Facial nerve", "Glossopharyngeal nerve", "Vagus nerve", "Hypoglossal nerve"], "ans": 1, "why": "The facial nerve supplies all muscles of facial expression, including orbicularis oculi (eye closure) and frontalis (forehead wrinkling). A lesion of its trunk gives ipsilateral paralysis of the whole hemiface, as in Bell palsy.", "wrong": ["CN V3 supplies muscles of mastication, not muscles of facial expression.", "", "CN IX motor supply is only stylopharyngeus.", "CN X lesions cause dysphagia/dysphonia, not facial paralysis.", "CN XII supplies tongue muscles only."], "pearl": "Whole-hemiface paralysis incl. forehead = lower motor neuron CN VII lesion (Bell palsy).", "set": "face"}, {"id": "G-115", "stem": "A 45-year-old woman with hypertension and arrhythmias has a severe headache. To lower her blood pressure, massage is applied at a point deep to the anterior border of the sternocleidomastoid at the level of the upper border of the thyroid cartilage. Which structure is being targeted?", "opts": ["Carotid sinus", "Carotid body", "Thyroid gland", "Parathyroid gland", "Inferior cervical ganglion"], "ans": 0, "why": "The carotid sinus, a widening at the carotid bifurcation (C4), is a baroreceptor. Pressing on it reflexively slows the heart and lowers blood pressure through CN IX and CN X.", "wrong": ["", "A chemoreceptor that senses O2 and CO2, not pressure.", "Plays no part in acute pressure reflexes.", "Controls calcium, not blood pressure reflexes.", "Part of the stellate ganglion, low in the neck; it is not a baroreceptor."], "pearl": "Carotid sinus = baroreceptor (CN IX); carotid body = chemoreceptor. Both are at the bifurcation, level of the upper border of the thyroid cartilage.", "set": "neck"}, {"id": "G-61", "stem": "A 6-year-old boy with a history of complicated delivery has a persistent head tilt, with the right ear near the right shoulder and the face turned upward and to the left. Which muscle was most likely damaged during birth?", "opts": ["Anterior scalene", "Omohyoid", "Sternocleidomastoid", "Trapezius", "Platysma"], "ans": 2, "why": "Congenital torticollis results from birth injury/fibrosis of the sternocleidomastoid; a shortened right SCM tilts the head to the right and rotates the face to the left.", "wrong": ["Elevates the first rib; does not produce torticollis.", "Depresses the hyoid.", "", "Elevates and retracts the scapula; does not rotate the face contralaterally like this.", "Thin superficial muscle; tenses neck skin."], "pearl": "One SCM: tilt head to same side, turn face to opposite side (congenital muscular torticollis).", "set": "neck"}, {"id": "LH-50", "stem": "While removing cervical lymph nodes during a radical neck dissection, a surgeon mistakenly cuts the ansa cervicalis. Which of the following deficits may occur?", "opts": ["Decreased blood flow to the larynx", "Lymphedema in the carotid triangle of the neck", "Reduced sensation in the skin over the posterior triangle of the neck", "Paralysis of several infrahyoid (strap) muscles", "Paralysis of the intrinsic laryngeal muscles"], "ans": 3, "why": "The ansa cervicalis (C1-C3 loop) supplies motor fibers to the omohyoid, sternohyoid, and sternothyroid; cutting it paralyzes these strap muscles.", "wrong": ["Ansa is a nerve; larynx is supplied by the superior and inferior laryngeal arteries", "A nerve lesion does not cause lymphedema", "Skin here is supplied by cutaneous branches of the cervical plexus, not the ansa", "", "Intrinsic laryngeal muscles are supplied by CN X (recurrent and external laryngeal nerves)"], "pearl": "Ansa cervicalis = motor to infrahyoids except thyrohyoid (C1 via CN XII).", "set": "neck"}, {"id": "BH-5", "stem": "A 17-year-old boy injures his phrenic nerve in a knife wound to the neck. The damaged nerve has which of the following relationships in the neck?", "opts": ["Anterior to the subclavian vein", "Posterior to the subclavian artery", "Deep to the brachial plexus", "Medial to the common carotid artery", "Superficial to the anterior scalene muscle"], "ans": 4, "why": "The phrenic nerve (C3-C5) descends on the anterior surface of the anterior scalene, then enters the thorax between the subclavian vein (in front) and artery (behind).", "wrong": ["It passes posterior to the subclavian vein.", "It passes anterior to the subclavian artery.", "The brachial plexus lies deep (posterior) to the anterior scalene.", "It lies lateral to the common carotid artery.", ""], "pearl": "Phrenic n. rides on the anterior scalene; brachial plexus and subclavian a. pass behind it.", "set": "neck"}, {"id": "BH-41", "stem": "An angiogram of a 45-year-old man shows occlusion of the costocervical trunk. This would markedly decrease blood flow in which artery?", "opts": ["Superior thoracic artery", "Transverse cervical artery", "Ascending cervical artery", "Deep cervical artery", "Inferior thyroid artery"], "ans": 3, "why": "The costocervical trunk divides into the deep cervical and superior intercostal arteries.", "wrong": ["Superior thoracic artery is a branch of the axillary artery.", "Transverse cervical artery arises from the thyrocervical trunk.", "Ascending cervical artery arises from the inferior thyroid artery.", "", "Inferior thyroid artery arises from the thyrocervical trunk."], "pearl": "Subclavian branches: vertebral, internal thoracic, thyrocervical, costocervical (deep cervical + superior intercostal), dorsal scapular.", "set": "neck"}, {"id": "G-171", "stem": "A 55-year-old woman presents with swelling in her neck. Ultrasound reveals a thyroid gland tumor. Three days after thyroidectomy, air bubbles are seen on CT of her brain. Which of the following is the most likely cause of the air bubbles?", "opts": ["Injury to inferior thyroid artery", "Injury to inferior and superior thyroid arteries", "Injury to superior thyroid artery and vein", "Injury to superior and middle thyroid veins", "Injury to superior, middle, and inferior thyroid veins"], "ans": 3, "why": "The superior and middle thyroid veins drain into the internal jugular vein. If torn, negative venous pressure can suck in air that then travels up the IJV into the skull (air embolism).", "wrong": ["Arterial injury causes bleeding, not venous air entry.", "Arteries have positive pressure and do not aspirate air.", "The superior thyroid artery would not admit air; only one vein involved.", "", "Inferior thyroid veins drain to the brachiocephalic veins, not the IJV route to the brain."], "pearl": "Superior + middle thyroid veins -> IJV; inferior thyroid veins -> brachiocephalic veins.", "set": "neck"}, {"id": "BH-33", "stem": "A 59-year-old man complains of numbness of the skin over the anterior cervical triangle. Which nerve has been damaged?", "opts": ["Phrenic nerve", "Great auricular nerve", "Transverse cervical nerve", "Supraclavicular nerve", "Lesser occipital nerve"], "ans": 2, "why": "The transverse cervical nerve (C2-C3) curves around the posterior border of the SCM at Erb's point and supplies the skin of the anterior neck.", "wrong": ["Phrenic nerve has no cutaneous distribution.", "Great auricular nerve supplies skin over the parotid and behind the ear.", "", "Supraclavicular nerves supply skin over the clavicle and shoulder.", "Lesser occipital nerve supplies scalp behind the ear."], "pearl": "Cervical plexus cutaneous nn. emerge at Erb's point; transverse cervical = anterior neck skin.", "set": "neck"}, {"id": "BC-5", "stem": "A 17-year-old boy sustains a penetrating injury to the neck that damages the cervical sympathetic chain. Which of the following findings is most likely?", "opts": ["Internal strabismus", "Trouble going down stairs", "Constricted pupil", "Inability to close the eye", "Deviation of the tongue toward the side of the lesion"], "ans": 2, "why": "Cervical sympathetic fibers supply the dilator pupillae; interrupting them leaves the sphincter unopposed, producing miosis as part of Horner syndrome.", "wrong": ["Internal strabismus reflects an abducens (CN VI) lesion.", "Difficulty descending stairs reflects a trochlear (CN IV) lesion.", "", "Inability to close the eye reflects a facial nerve lesion.", "Tongue deviation toward the lesion reflects a hypoglossal lesion."], "pearl": "Cervical sympathetic injury = Horner: ptosis, miosis, anhidrosis.", "set": "neck"}, {"id": "G-201", "stem": "A 72-year-old man with a malignant tumor of the cecum has enlarged cervical lymph nodes. Which lymph node of the neck is most frequently associated with malignant tumors of the gastrointestinal tract?", "opts": ["Left inferior deep cervical", "Left supraclavicular", "Right inferior deep cervical", "Right supraclavicular", "Jugulodigastric"], "ans": 1, "why": "The thoracic duct drains the body below the diaphragm (including the GI tract) and ends near the left venous angle; metastases traveling in it enlarge the left supraclavicular (Virchow) node.", "wrong": ["Drains head and neck lymph; not the classic GI sentinel node.", "", "Right side drains to the right lymphatic duct, not the thoracic duct.", "Right supraclavicular nodes drain the right thorax, not the abdomen.", "Drains tonsils and pharynx."], "pearl": "Virchow node (left supraclavicular) = abdominal malignancy via thoracic duct.", "set": "neck"}, {"id": "G-283", "stem": "A 34-year-old woman with a swollen, protruding tongue and massive pharyngeal edema cannot be ventilated or orally intubated, and a cricothyrotomy is planned. Where should th
