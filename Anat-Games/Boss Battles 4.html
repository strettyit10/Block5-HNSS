<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Boss Battles 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=Silkscreen&display=swap">
<style>
/* Deliberately single-theme: a night-arena world. Every color is painted explicitly. */
:root{
  --ground:#17142B; --ground2:#120F22; --panel:#221D3F; --sunk:#1B1734; --line:#3A3366;
  --ink:#EEEAFB; --muted:#A39CC8;
  --p1:#FFB341; --p2:#3DD6C6; --boss:#FF4F8B; --heal:#6BD88E; --bad:#FF6B5B;
  --hy-bg:#3A3212; --hy-line:#D9AE2B; --hy-ink:#F7E6A6;
  --display:"Chakra Petch","Arial Narrow",sans-serif;
  --pix:"Silkscreen","Courier New",monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font:15px/1.55 var(--body);padding-inline:16px;padding-block:16px 40px;
  background-image:radial-gradient(ellipse 80% 50% at 50% 0%, #2A2352 0%, transparent 70%);background-attachment:fixed}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.pix{font-family:var(--pix);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.brand b{color:var(--boss)}

/* ---------- setup ---------- */
.setup{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:start}
.hero{display:flex;flex-direction:column;gap:14px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,6.4vw,74px);line-height:.92;margin:0;text-transform:uppercase;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--boss)}
.hero p{margin:0;color:var(--muted);max-width:54ch}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.foe{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:8px;display:flex;gap:8px;align-items:center}
.foe svg{width:44px;height:44px;flex:none}
.foe b{display:block;font-family:var(--display);font-size:13.5px;line-height:1.15}
.foe span{font-family:var(--pix);font-size:9.5px;color:var(--muted);text-transform:uppercase}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:6px;max-width:58ch}
.rules li{display:grid;grid-template-columns:92px 1fr;gap:10px;border-top:1px dashed var(--line);padding-top:6px;font-size:14px}
.rules b{font-family:var(--pix);font-size:11px;color:var(--p1);font-weight:400;padding-top:3px}
.form{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:16px}
.fl{display:flex;flex-direction:column;gap:6px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names input{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:9px 10px;border-left:5px solid var(--p1)}
.names input#p2name{border-left-color:var(--p2)}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;min-width:72px;background:var(--sunk);border:0;border-right:1px solid var(--line);padding:9px 8px;font-size:14px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:600}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.picker button{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:7px 9px;text-align:left;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.picker button[aria-pressed="true"]{border-color:var(--boss);box-shadow:inset 3px 0 0 var(--boss)}
.picker em{font-style:normal;font-family:var(--pix);font-size:10px;color:var(--muted)}
.go{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase;background:var(--boss);color:#1a0610;border:0;border-radius:4px;padding:11px 16px}

/* ---------- arena ---------- */
.arena{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:12px;align-items:stretch}
.hero-card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;transition:box-shadow .2s,opacity .3s}
.hero-card.p1{--c:var(--p1)} .hero-card.p2{--c:var(--p2)}
.hero-card.on{box-shadow:0 0 0 2px var(--c),0 0 24px -4px var(--c)}
.hero-card.ko{opacity:.45}
.hero-card .nm{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1;color:var(--c)}
.hero-card .role{font-family:var(--pix);font-size:10px;color:var(--muted);text-transform:uppercase}
.bar{height:14px;background:var(--ground2);border:1px solid var(--line);border-radius:3px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.bar.hp i{background:var(--heal)} .bar.hp.low i{background:var(--bad)}
.bar.boss{height:18px} .bar.boss i{background:linear-gradient(90deg,#B8265A,var(--boss))}
.hpnum{font-family:var(--pix);font-size:11px;display:flex;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.abil{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.abil button{flex:1;min-width:90px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:6px 6px;font-size:12.5px;line-height:1.2}
.abil button small{display:block;font-family:var(--pix);font-size:9px;color:var(--muted)}
.abil button:disabled{opacity:.35;cursor:not-allowed}
.abil button:not(:disabled):hover{border-color:var(--c)}
.ko-tag{position:absolute;top:10px;right:10px;font-family:var(--pix);font-size:12px;color:var(--bad)}
.boss-card{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center}
.boss-card .bn{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;line-height:1;letter-spacing:.03em}
.boss-card .bt{font-size:12.5px;color:var(--muted)}
.beast{height:150px;display:grid;place-items:center}
.beast svg{display:block;height:150px;width:auto;max-width:100%;overflow:visible}
.beast.hit svg{animation:hit .45s}
.beast.atk svg{animation:atk .5s}
.beast.dead svg{animation:dead .9s forwards}
.beast.gone svg{transform:translateY(20px) scale(.6);opacity:.1;filter:grayscale(1)}
@keyframes hit{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px);filter:brightness(2.2)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
@keyframes atk{0%,100%{transform:scale(1)}40%{transform:scale(1.14) translateY(8px)}}
@keyframes dead{to{transform:translateY(20px) scale(.6);opacity:.1;filter:grayscale(1)}}
.rage{font-family:var(--pix);font-size:10.5px;color:var(--boss)}
.dmg{position:absolute;font-family:var(--display);font-weight:700;font-size:30px;pointer-events:none;animation:float 1s forwards;text-shadow:0 2px 0 #000}
@keyframes float{from{transform:translateY(0);opacity:1}to{transform:translateY(-44px);opacity:0}}
.timer{height:6px;background:var(--ground2);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--muted);transform-origin:left;transition:transform .25s linear}
.timer.warn i{background:var(--bad)}
.log{font-family:var(--pix);font-size:11px;color:var(--muted);min-height:16px;text-transform:uppercase;letter-spacing:.04em}
.log b{color:var(--ink);font-weight:400}

.qpanel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--pix);font-size:10.5px;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid var(--line)}
.chip.p1{background:var(--p1);color:#231500;border-color:var(--p1)}
.chip.p2{background:var(--p2);color:#032421;border-color:var(--p2)}
.chip.dash{border-style:dashed}
.stem{margin:0;font-size:16px;line-height:1.62;max-width:76ch}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:8px 12px}
.opt .lt{font-family:var(--display);font-weight:700;font-size:17px;width:28px;height:28px;border:1.5px solid var(--line);border-radius:3px;display:grid;place-items:center;transform:rotate(45deg)}
.opt .lt span{transform:rotate(-45deg)}
.opt:not(:disabled):hover{border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.out{opacity:.3;text-decoration:line-through}
.opt.right{border-color:var(--heal);background:#193326}
.opt.right .lt{background:var(--heal);border-color:var(--heal);color:#07210F}
.opt.wrong{border-color:var(--bad);background:#3A1A22}
.opt.wrong .lt{background:var(--bad);border-color:var(--bad);color:#2a0606}
.verdict{border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--sunk)}
.verdict h3{margin:0;font-family:var(--display);font-size:22px;text-transform:uppercase}
.verdict.good h3{color:var(--heal)} .verdict.bad h3{color:var(--bad)}
.verdict p{margin:0;max-width:76ch}
.why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--muted)}
.why b{color:var(--ink);font-family:var(--pix);font-weight:400;margin-right:6px}
.hy{background:var(--hy-bg);border:1.5px solid var(--hy-line);color:var(--hy-ink);border-radius:4px;padding:9px 12px;font-size:14px}
.hy b{display:block;font-family:var(--pix);font-size:10px;font-weight:400;letter-spacing:.1em;text-transform:uppercase}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--ground);border:0;border-radius:4px;padding:10px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
kbd{font-family:var(--pix);font-size:10px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--muted)}

/* ---------- interlude / end ---------- */
.interlude{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px;display:grid;grid-template-columns:180px 1fr;gap:22px;align-items:center}
.interlude svg{width:100%;height:auto}
.interlude h2,.end h2{font-family:var(--display);font-weight:700;font-size:clamp(32px,5vw,54px);line-height:.95;margin:0 0 8px;text-transform:uppercase;text-wrap:balance}
.interlude p{margin:0 0 12px;color:var(--muted);max-width:60ch}
.path{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.path span{font-family:var(--pix);font-size:10px;padding:3px 7px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
.path span.done{color:var(--heal);border-color:var(--heal)}
.path span.now{color:var(--boss);border-color:var(--boss)}
.end{display:flex;flex-direction:column;gap:18px}
.end h2.win{color:var(--heal)} .end h2.lose{color:var(--bad)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.p1{--c:var(--p1)} .card.p2{--c:var(--p2)}
.big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;color:var(--c)}
.missed{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.missed li{font-size:13.5px;border-left:3px solid var(--line);padding-left:9px}
.missed li span{display:block;font-family:var(--pix);font-size:9.5px;color:var(--muted);text-transform:uppercase}
.foot{font-family:var(--pix);font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;text-transform:uppercase}
@media (max-width:860px){
  .setup,.cards,.interlude{grid-template-columns:1fr}
  .interlude svg{max-width:160px}
  .arena{grid-template-columns:1fr 1fr}
  .boss-card{grid-column:1 / -1;order:-1}
  .beast{height:110px}.beast svg{height:110px}
  .names,.picker{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- return to hub (added Sep 22, 2026) ---------- */
.tohub{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  font-family:var(--mono,var(--pix,ui-monospace,Menlo,monospace));font-size:11px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;line-height:1;
  transition:color .12s,border-color .12s,background .12s}
.tohub:hover{color:var(--ink);border-color:var(--muted);background:var(--sunk)}
.tohub:focus-visible{outline:2px solid var(--p2,var(--p1,currentColor));outline-offset:2px}
.tohub svg{width:13px;height:13px;flex:none;transition:transform .12s}
.tohub:hover svg{transform:translateX(-2px)}
@media print{.tohub{display:none}}
</style>

<script>
const DECK=4;
const SETS={"neck": "The Neck", "face": "Face, Scalp & ITF", "cranial": "Skull, Meninges & Foramina", "orbit": "Orbit & Eye Reflexes", "nasal_oral": "Nose, Pharynx, Palate & Oral Cavity", "larynx": "Larynx", "cn": "Cranial Nerve Lesions"};
const Q=[{"id": "LH-67", "stem": "A 40-year-old woman has headaches, nausea, vomiting, and multiple lower cranial nerve deficits. CT shows a tumor centered at the right jugular foramen that has destroyed the jugular foramen and hypoglossal canal and damaged the cranial nerves passing through them. Which of the following functions will remain intact?", "opts": ["Control of the true vocal fold", "Taste in the anterior two thirds of the tongue", "Symmetric protrusion of the tongue", "Sensation in the tympanic cavity", "Elevation of the shoulder"], "ans": 1, "why": "The jugular foramen transmits CN IX, X, and XI, and the hypoglossal canal transmits CN XII. Taste from the anterior two thirds of the tongue travels with the chorda tympani (CN VII), which uses the internal acoustic meatus, so it is spared.", "wrong": ["Intrinsic laryngeal muscles are supplied by CN X (jugular foramen)", "", "CN XII in the hypoglossal canal is damaged, so the tongue deviates", "Tympanic cavity sensation is via CN IX (jugular foramen)", "Trapezius is supplied by CN XI (jugular foramen)"], "pearl": "Jugular foramen: CN IX, X, XI (+ IJV); hypoglossal canal: CN XII.", "set": "cn"}, {"id": "G-183", "stem": "A 58-year-old man has progressive unilateral hearing loss and tinnitus for 4 months. MRI reveals a tumor at the cerebellopontine angle. Which of the following nerves is most likely affected?", "opts": ["Vagus", "Hypoglossal", "Vestibulocochlear", "Glossopharyngeal", "Trigeminal"], "ans": 2, "why": "A cerebellopontine angle tumor (usually a vestibular schwannoma) first affects CN VIII, producing hearing loss and tinnitus, and then the adjacent facial nerve.", "wrong": ["Lower cranial nerve at the jugular foramen; would cause dysphagia/hoarseness.", "Would cause tongue deviation, not hearing symptoms.", "", "Would affect gag and posterior tongue sensation.", "Can be affected by large tumors (facial numbness), but not first with hearing loss."], "pearl": "CPA tumor: CN VIII first (hearing loss, tinnitus), then VII, then V.", "set": "cn"}, {"id": "LC-19", "stem": "To distinguish idiopathic unilateral facial paralysis (Bell palsy) from herpes zoster infection of CN VII, the physician looks for small herpetic vesicles. Where are these lesions located in herpes zoster infection involving the facial nerve?", "opts": ["Mental region of the mandible", "Temporal and parietal region of the scalp", "Upper lip and cheek of the face", "Auricle of the external ear", "Bridge and tip of the external nose"], "ans": 3, "why": "CN VII's only cutaneous territory is a small part of the auricle/external ear. Reactivation in the geniculate ganglion (Ramsay Hunt syndrome) puts vesicles there along with facial paralysis.", "wrong": ["Supplied by the mental nerve (V3).", "Supplied by the auriculotemporal nerve (V3).", "Supplied by the infraorbital nerve (V2).", "", "Supplied by infratrochlear and external nasal nerves (V1)."], "pearl": "Ramsay Hunt: facial palsy + ear vesicles (geniculate ganglion), ± hearing loss/vertigo.", "set": "cn"}, {"id": "G-99", "stem": "An 8-year-old boy has a radical mastoid operation for a middle ear infection that spread to the mastoid air cells. Afterward his mouth is pulled up toward the left, he cannot close his right eye, and saliva pools in his right cheek and dribbles from the corner of his mouth. Which structure was most likely damaged?", "opts": ["Mandibular nerve", "Parotid duct", "Vagus nerve", "Facial nerve", "Glossopharyngeal nerve"], "ans": 3, "why": "The facial nerve runs through the temporal bone next to the mastoid and exits at the stylomastoid foramen. Injury there paralyzes the facial muscles on that side, so the eye stays open, the cheek (buccinator) is slack and the mouth is pulled to the healthy side.", "wrong": ["V3 moves the jaw (chewing muscles), not the facial muscles.", "Injury would affect saliva flow, not the facial muscles.", "The vagus does not supply the facial muscles.", "", "CN IX does not supply the facial muscles."], "pearl": "Mastoid surgery puts CN VII at risk (stylomastoid foramen); a lower motor neuron lesion paralyzes the whole side of the face.", "set": "cn"}, {"id": "G-240", "stem": "A 72-year-old woman has herpes zoster oticus. She says she must hold the phone away from her ear because sounds seem too loud. Which cranial nerve's involvement causes this hyperacusis?", "opts": ["Hypoglossal", "Facial", "Spinal accessory", "Vagus", "Glossopharyngeal"], "ans": 1, "why": "Reactivated varicella in the geniculate ganglion (Ramsay Hunt) affects CN VII, including the nerve to stapedius. Without stapedius damping of the stapes, sounds are perceived as abnormally loud.", "wrong": ["CN XII is motor to the tongue only.", "", "CN XI supplies SCM and trapezius.", "CN X supplies pharynx/larynx; no middle-ear muscle.", "CN IX supplies stylopharyngeus and tympanic plexus sensation, not stapedius."], "pearl": "Hyperacusis = CN VII lesion proximal to the nerve to stapedius (Bell palsy, Ramsay Hunt).", "set": "cn"}, {"id": "G-262", "stem": "In a cough-reflex test, a 62-year-old woman inhales particles that stick to mucus mainly in the trachea. Blocking afferent neurons in which cranial nerve would most likely suppress her cough?", "opts": ["Glossopharyngeal", "Hypoglossal", "External laryngeal", "Trigeminal", "Vagus"], "ans": 4, "why": "The vagus nerve carries sensation from the tracheal and laryngeal mucosa and also drives the motor response, so it forms both limbs of the cough reflex.", "wrong": ["CN IX is the afferent limb of the gag reflex, not tracheal cough.", "CN XII is motor to the tongue.", "The external laryngeal is purely motor to cricothyroid.", "CN V is sensory to the face and nasal cavity (sneeze), not the trachea.", ""], "pearl": "Cough reflex: CN X afferent and efferent. Gag: IX afferent, X efferent.", "set": "cn"}, {"id": "LC-13", "stem": "A 67-year-old man presents with shingles on his left forehead, upper eyelid, and bridge of the nose. Shingles (herpes zoster) is caused by varicella zoster virus, which lies latent in sensory ganglia after chickenpox and can reactivate along one nerve's dermatome when the patient is immunocompromised. Which sensory ganglion is most likely affected in this patient?", "opts": ["Otic ganglion", "Trigeminal ganglion", "Superior cervical ganglion", "Ciliary ganglion", "Submandibular ganglion"], "ans": 1, "why": "The rash follows the V1 dermatome, so the virus is reactivating in the trigeminal (semilunar) ganglion. That sensory ganglion holds the pseudounipolar cell bodies of CN V.", "wrong": ["Otic ganglion is parasympathetic (to parotid), not a sensory ganglion.", "", "Superior cervical ganglion is sympathetic, not sensory.", "Ciliary ganglion is parasympathetic (CN III pathway).", "Submandibular ganglion is parasympathetic (CN VII pathway)."], "pearl": "Herpes zoster ophthalmicus = V1 dermatome; watch for nose-tip lesions (Hutchinson sign).", "set": "cn"}, {"id": "G-37", "stem": "A 34-year-old swimmer has otitis externa. He coughs during inspection of the external auditory meatus with a speculum. The cough results from irritation of which nerve that supplies part of the external auditory meatus?", "opts": ["Vestibulocochlear", "Vagus", "Trigeminal", "Facial", "Accessory"], "ans": 1, "why": "The auricular branch of the vagus (Arnold's nerve) supplies part of the external canal; stimulating it can trigger a vagal cough reflex, as if the larynx were irritated.", "wrong": ["Serves only the inner ear (hearing and balance).", "", "V3 (auriculotemporal) does supply the canal but does not trigger a cough.", "Gives only a small sensory twig to the ear; not linked to cough.", "Purely motor to SCM and trapezius."], "pearl": "Arnold's nerve (auricular branch of CN X): ear canal stimulation → cough (ear-cough reflex).", "set": "cn"}, {"id": "G-241", "stem": "A 70-year-old man has cerumen removed from his external auditory meatus. During the procedure he begins to cough. Stimulation of an area innervated by which nerve causes the cough?", "opts": ["Vestibulocochlear", "Vagus", "Trigeminal", "Facial", "Accessory"], "ans": 1, "why": "The auricular branch of the vagus (Arnold nerve) supplies part of the external acoustic meatus. Because CN X is also the afferent limb of the cough reflex, stimulating the canal can trigger coughing.", "wrong": ["CN VIII carries hearing and balance, not canal skin sensation.", "", "Auriculotemporal (V3) supplies the canal but does not trigger cough.", "CN VII contributes small canal sensation but plays no role in the cough reflex.", "CN XI is purely motor to SCM and trapezius."], "pearl": "Arnold nerve (auricular br. of X): ear canal stimulation -> cough or vasovagal syncope.", "set": "cn"}, {"id": "LH-6", "stem": "A 65-year-old man has a persistent nosebleed. His physician uses a cotton swab to apply pressure at the source, the inferior and posterior aspects of the lateral nasal wall. Which artery is the most likely source of the bleeding?", "opts": ["Greater palatine", "Infraorbital", "Facial", "Anterior ethmoidal", "Sphenopalatine"], "ans": 4, "why": "The sphenopalatine artery, a terminal branch of the maxillary artery, enters the nasal cavity through the sphenopalatine foramen and supplies the posterior lateral wall and septum; it is the usual source of posterior epistaxis.", "wrong": ["Supplies the hard palate; only a small branch reaches the anterior septum via the incisive canal", "Supplies the lower eyelid, cheek and upper lip, not the nasal cavity", "Supplies the external nose and anterior septum via septal branches, not the posterior lateral wall", "Supplies the anterosuperior nasal cavity, not the posteroinferior wall", ""], "pearl": "Posterior epistaxis = sphenopalatine a.; anterior = Kiesselbach plexus.", "set": "nasal_oral"}, {"id": "BH-43", "stem": "A 7-year-old girl has difficulty breathing through her nose and is diagnosed with adenoids. Which tonsil is enlarged?", "opts": ["Palatine tonsil", "Pharyngeal tonsil", "Tubal tonsil", "Lingual tonsil", "Eustachian tonsil"], "ans": 1, "why": "Adenoids are an enlarged pharyngeal tonsil in the nasopharynx roof, blocking airflow from the choanae.", "wrong": ["Palatine (faucial) tonsil lies in the oropharynx tonsillar fossa.", "", "Tubal tonsil surrounds the auditory tube opening.", "Lingual tonsil lies on the posterior tongue.", "Eustachian tonsil is another name for the tubal tonsil."], "pearl": "Adenoids = pharyngeal tonsil -> mouth breathing, may block auditory tube (otitis media).", "set": "nasal_oral"}, {"id": "G-86", "stem": "A 17-year-old girl has a tonsillectomy for tonsillitis and afterward complains of ear pain. Which nerve was most likely injured or irritated during the operation?", "opts": ["Auriculotemporal", "Lesser petrosal", "Vagus", "Glossopharyngeal", "Chorda tympani"], "ans": 3, "why": "CN IX carries sensation from the tonsillar bed and pharynx and also from the middle ear (tympanic branch). Irritating it in the tonsillar bed causes pain that is felt in the ear (referred pain).", "wrong": ["Supplies the auricle, external meatus and temple; it is not in the tonsillar bed.", "Carries parasympathetic fibers to the otic ganglion; it has no role in sensation.", "The vagus supplies the external meatus but does not lie in the tonsillar bed.", "", "Carries taste from the anterior 2/3 of the tongue; it is not in the tonsillar field."], "pearl": "Post-tonsillectomy ear pain = CN IX (it lies in the tonsillar bed and also supplies the middle ear).", "set": "nasal_oral"}, {"id": "G-31", "stem": "A 55-year-old man has left-sided upper jaw tooth pain, but a dental examination is normal. Tapping on his left maxilla elicits sharp pain on the left side of his face, including his left maxillary teeth. He has no allergies. What is the most likely diagnosis?", "opts": ["Sphenoid sinusitis", "Anterior ethmoidal sinusitis", "Posterior ethmoidal sinusitis", "Maxillary sinusitis", "Frontal sinusitis"], "ans": 3, "why": "The maxillary sinus lies in the body of the maxilla directly above the upper molar roots, so its inflammation causes maxillary tenderness and referred upper-tooth pain (both via V2 superior alveolar nerves).", "wrong": ["Lies deep in the sphenoid body; causes deep/retro-orbital headache.", "Lies between orbit and nasal cavity; causes medial orbital pain.", "Lies posteriorly between orbits; would not cause maxillary tenderness.", "", "Lies in the frontal bone above the orbit; causes forehead pain."], "pearl": "Maxillary sinusitis mimics upper toothache because superior alveolar nerves (V2) run in the sinus walls.", "set": "nasal_oral"}, {"id": "G-96", "stem": "A 25-year-old medical student eats burnt toast in a hurry and scratches the roof of his mouth, leaving a stinging feeling on his hard palate. Which nerve carries this sensation from the hard palate?", "opts": ["Posterior superior alveolar nerve", "Inferior alveolar nerve", "Lingual nerve", "Greater palatine nerve", "Lesser palatine nerve"], "ans": 3, "why": "The greater palatine nerve (V2, through the pterygopalatine fossa) exits the greater palatine foramen and supplies most of the hard palate mucosa.", "wrong": ["Supplies the upper molars and nearby gums, not the palate.", "Supplies the lower teeth and chin (V3).", "Supplies the anterior 2/3 of the tongue and floor of the mouth.", "", "Supplies the soft palate, not the hard palate."], "pearl": "Hard palate = greater palatine n. (plus nasopalatine anteriorly); soft palate = lesser palatine n.", "set": "nasal_oral"}, {"id": "G-91", "stem": "A 54-year-old man needs surgery near the cavernous sinus, and the surgeon plans an approach to the sella turcica through the nasal cavity. Through which route would the surgeon most likely reach the cranial cavity?", "opts": ["Cribriform plate", "Cavernous sinus", "Frontal sinus", "Maxillary sinus", "Sphenoidal sinus"], "ans": 4, "why": "The sphenoid sinus lies directly below the sella turcica and pituitary, so the transsphenoidal approach is the most direct way in through the nose.", "wrong": ["Too far forward; entering here damages the olfactory nerves and causes CSF leak.", "The cavernous sinus is inside the skull beside the sella; it is not an entry route.", "The frontal sinus does not open toward the sella.", "The maxillary sinus does not open into the cranial cavity.", ""], "pearl": "Pituitary surgery is transsphenoidal: nose -> sphenoid sinus -> sella turcica.", "set": "nasal_oral"}, {"id": "LC-20", "stem": "A 37-year-old man has decreased emotional tearing on the right and intermittent headaches. MRI shows a facial nerve schwannoma within the right pterygoid (vidian) canal. Which nerve fibers are most likely injured by this tumor?", "opts": ["Taste fibers to the anterior two thirds of the tongue", "Parasympathetic innervation to the submandibular and sublingual glands", "Presynaptic sympathetic fibers", "Presynaptic parasympathetic fibers", "Postsynaptic parasympathetic fibers"], "ans": 3, "why": "The vidian nerve combines preganglionic parasympathetic fibers (greater petrosal, CN VII) and postganglionic sympathetic fibers (deep petrosal). The parasympathetics synapse only later in the pterygopalatine ganglion, so in the canal they are still presynaptic.", "wrong": ["Carried by chorda tympani, which does not pass through the pterygoid canal.", "Carried by chorda tympani, not the pterygoid canal.", "Head sympathetics have already synapsed in the SCG, so they are postsynaptic.", "", "Parasympathetics synapse after the canal, in the pterygopalatine ganglion."], "pearl": "Vidian nerve = greater petrosal (preganglionic parasymp) + deep petrosal (postganglionic symp).", "set": "nasal_oral"}, {"id": "BH-38", "stem": "During a fight, a 17-year-old boy is punched and his nasal septum is broken. Which structures would be damaged?", "opts": ["Septal cartilage and nasal bone", "Inferior concha and vomer", "Vomer and perpendicular plate of the ethmoid", "Septal cartilage and middle concha", "Cribriform plate and frontal bone"], "ans": 2, "why": "The nasal septum is built from the perpendicular plate of the ethmoid, the vomer, and the septal cartilage.", "wrong": ["Nasal bones form the bridge/roof, not the septum.", "Inferior concha is part of the lateral wall.", "", "Middle concha is part of the lateral wall.", "Cribriform plate and frontal bone form the roof."], "pearl": "Septum = perpendicular plate of ethmoid + vomer + septal cartilage.", "set": "nasal_oral"}, {"id": "G-188", "stem": "A 35-year-old man with a tumor of the right submandibular gland undergoes removal of the gland and its duct. Which of the following nerves is most prone to injury in this procedure?", "opts": ["Buccal", "Lingual", "Inferior alveolar", "Nerve to mylohyoid", "Glossopharyngeal"], "ans": 1, "why": "The lingual nerve lies just under the floor-of-mouth mucosa and loops around the submandibular duct (lateral, then under, then medial), with the submandibular ganglion hanging from it, so it is at risk during gland/duct excision.", "wrong": ["Supplies cheek mucosa/skin, away from the gland and duct.", "", "Enters the mandibular foramen to supply lower teeth; not in the surgical field.", "Runs on the superficial surface of mylohyoid but is less closely related to the duct.", "Lies deep in the pharynx region, not near the submandibular duct."], "pearl": "Lingual nerve 'double-crosses' the submandibular duct -> at risk in gland/duct surgery.", "set": "nasal_oral"}, {"id": "LH-72", "stem": "During an initial oral examination, a dental hygienist inspects the vestibule of the mouth. Which of the following structures is encountered in this area?", "opts": ["Lingual frenulum", "Opening of the parotid duct", "Opening of the submandibular duct", "Uvula", "Palatine tonsil"], "ans": 1, "why": "The oral vestibule is the space between the lips/cheeks and the teeth/gums. The parotid duct opens into it on a small papilla opposite the upper second molar.", "wrong": ["Lies in the oral cavity proper, under the tongue", "", "Opens on the floor of the oral cavity proper beside the frenulum", "Hangs from the soft palate at the back of the oral cavity", "Lies in the oropharynx between the palatine arches"], "pearl": "Vestibule = between cheeks and teeth; parotid duct opens here opposite upper 2nd molar.", "set": "nasal_oral"}, {"id": "LH-5", "stem": "A 27-year-old man has a painful, swollen floor of the mouth. Imaging shows an 8-mm stone (sialolith) in the right submandibular duct. If the duct is partially obstructed, where would the physician observe salivation in the oral cavity after applying pressure to the right submandibular gland?", "opts": ["Second maxillary molar tooth", "Oral vestibule", "Palatine mucosa", "Sublingual fold", "Lingual frenulum"], "ans": 4, "why": "The submandibular duct opens on the sublingual papilla (caruncle) on each side of the base of the lingual frenulum, so expressed saliva appears there.", "wrong": ["Site of the parotid duct opening, not the submandibular duct", "Receives parotid saliva, not submandibular saliva", "Contains minor palatine glands only", "Where multiple small sublingual gland ducts open, not the submandibular duct", ""], "pearl": "Submandibular (Wharton) duct opens at the sublingual caruncle beside the lingual frenulum.", "set": "nasal_oral"}, {"id": "BH-17", "stem": "A 37-year-old patient has an infection of the dural venous sinus closest to the pituitary gland with secondary thrombus formation. Which is the most likely site?", "opts": ["Straight sinus", "Cavernous sinus", "Superior petrosal sinus", "Sigmoid sinus", "Confluence of sinuses"], "ans": 1, "why": "The cavernous sinuses flank the sella turcica and pituitary; cavernous sinus thrombophlebitis can cause ophthalmoplegia, exophthalmos, and papilledema.", "wrong": ["Straight sinus lies at the falx-tentorium junction, far posterior.", "", "Superior petrosal sinus lies along the petrous ridge.", "Sigmoid sinus lies in the posterior cranial fossa.", "Confluence lies at the internal occipital protuberance."], "pearl": "Cavernous sinus = lateral to pituitary; danger-triangle infections spread here.", "set": "cranial"}, {"id": "BH-13", "stem": "A 67-year-old woman complains of visual loss. MRI shows an enlarged pituitary gland in the sella turcica. The sella lies immediately posterior and superior to which of the following structures?", "opts": ["Frontal sinus", "Maxillary sinus", "Ethmoid air cells", "Mastoid air cells", "Sphenoid sinus"], "ans": 4, "why": "The hypophyseal fossa sits on the body of the sphenoid, directly above and behind the sphenoid sinus - the basis for transsphenoidal pituitary surgery.", "wrong": ["Frontal sinus is in the frontal bone, far anterior.", "Maxillary sinus lies lateral to the nasal cavity, below the orbit.", "Ethmoid cells lie between the orbit and nasal cavity.", "Mastoid air cells are in the temporal bone.", ""], "pearl": "Sella turcica sits on top of the sphenoid sinus - transsphenoidal approach.", "set": "cranial"}, {"id": "G-276", "stem": "A patient has a brain tumor near the crista galli and cribriform plate of the ethmoid bone. Which symptom is most likely?", "opts": ["Paralysis of facial muscles", "Loss of vision", "Difficulty swallowing", "Loss of smell", "Loss of hearing"], "ans": 3, "why": "Olfactory nerve fibers pass through the cribriform plate to the olfactory bulbs beside the crista galli, so a mass there causes anosmia.", "wrong": ["CN VII is in the posterior fossa and temporal bone.", "The optic nerve and chiasm lie further back, near the sella.", "Swallowing is IX and X in the posterior fossa.", "", "Hearing is CN VIII at the internal acoustic meatus."], "pearl": "Cribriform plate lesion/fracture -> anosmia +/- CSF rhinorrhea.", "set": "cranial"}, {"id": "G-245", "stem": "Herpetic lesions of the forehead need prompt treatment because infection can reach the cavernous sinus. Which venous structure is the most likely route of spread to the cavernous sinus?", "opts": ["Pterygoid venous plexus", "Ophthalmic vein", "Superior petrosal sinus", "Basilar venous plexus", "Parietal emissary vein"], "ans": 1, "why": "Forehead veins (supratrochlear and supraorbital) form the angular vein, which connects to the superior ophthalmic vein; this valveless vein drains directly into the cavernous sinus.", "wrong": ["The pterygoid plexus links the deep face to the sinus but does not drain the forehead.", "", "The superior petrosal sinus drains the cavernous sinus toward the transverse sinus.", "The basilar plexus lies over the clivus, joining the inferior petrosal sinuses.", "Parietal emissary veins connect scalp veins to the superior sagittal sinus."], "pearl": "Danger triangle: facial/angular v. -> superior ophthalmic v. -> cavernous sinus thrombosis.", "set": "cranial"}, {"id": "G-107", "stem": "A 57-year-old man falls from a tree, and CT shows a fracture of the cribriform plate. Which finding is most likely on examination?", "opts": ["Entrapment of the eyeball", "Anosmia", "Hyperacusis", "Tinnitus", "Deafness"], "ans": 1, "why": "Olfactory nerve fibers pass through the foramina of the cribriform plate, so a fracture there can tear them and cause loss of smell.", "wrong": ["Muscle entrapment comes from orbital wall fractures, not the cribriform plate.", "", "Caused by stapedius paralysis (CN VII).", "Caused by inner ear or CN VIII problems.", "Caused by middle ear, inner ear or CN VIII problems."], "pearl": "Cribriform plate fracture: anosmia + CSF rhinorrhea.", "set": "cranial"}, {"id": "LH-62", "stem": "During a fight, one construction worker strikes the other with a hammer at the pterion of the skull. Which of the following bones may be fractured?", "opts": ["Zygomatic process of the temporal bone", "Greater wing of the sphenoid bone", "Mastoid process of the temporal bone", "Lateral pterygoid plate of the sphenoid bone", "Coronoid process of the mandible"], "ans": 1, "why": "The pterion is the H-shaped junction of the frontal, parietal, squamous temporal, and greater wing of the sphenoid bones. It is thin, and the anterior branch of the middle meningeal artery runs deep to it.", "wrong": ["Forms the zygomatic arch, inferior to the pterion", "", "Lies behind the ear, far from the pterion", "Lies deep in the infratemporal fossa", "Part of the mandible, below the zygomatic arch"], "pearl": "Pterion = frontal + parietal + temporal + greater wing of sphenoid; overlies the middle meningeal a.", "set": "cranial"}, {"id": "BH-15", "stem": "A 14-year-old boy hits his head on the road after falling from his skateboard. Radiographs show damage to the sella turcica. Which bone is fractured?", "opts": ["Frontal bone", "Ethmoid bone", "Temporal bone", "Basioccipital bone", "Sphenoid bone"], "ans": 4, "why": "The sella turcica is part of the body of the sphenoid bone, sitting above the sphenoid sinus.", "wrong": ["Frontal bone forms the forehead and anterior fossa floor.", "Ethmoid forms the cribriform plate, not the sella.", "Temporal bone forms the lateral skull and petrous ridge.", "Basioccipital (clivus) lies posterior-inferior to the sella.", ""], "pearl": "Sella turcica = sphenoid body.", "set": "cranial"}, {"id": "G-278", "stem": "A 21-year-old man cuts his scalp deeply while shaving his head; the wound becomes infected and then subsides. Three weeks later he has severe headache and nausea and is found to have an infection of the superior sagittal sinus. Which veins most likely carried the infection?", "opts": ["Intercavernous", "Inferior sagittal", "Diploic", "Basilar", "Emissary"], "ans": 4, "why": "Emissary veins pass through foramina in the calvaria and link scalp veins in the loose connective tissue layer with the dural venous sinuses, allowing scalp infections to reach the superior sagittal sinus.", "wrong": ["Intercavernous sinuses connect the two cavernous sinuses.", "The inferior sagittal sinus is in the free edge of the falx, not connected to scalp.", "Diploic veins drain the marrow space of the skull bones.", "The basilar plexus lies over the clivus.", ""], "pearl": "Scalp -> emissary veins -> dural sinuses (valveless route for infection).", "set": "cranial"}, {"id": "G-277", "stem": "A 20-year-old man has a fracture of the sella turcica after a motorcycle crash. Which bone was most likely damaged?", "opts": ["Sphenoid", "Temporal", "Occipital", "Ethmoid", "Frontal"], "ans": 0, "why": "The sella turcica (hypophyseal fossa) is a saddle-shaped depression on the upper surface of the body of the sphenoid bone.", "wrong": ["", "The temporal bone forms the lateral middle fossa and petrous ridge.", "The occipital bone forms the posterior fossa and foramen magnum.", "The ethmoid is in the anterior fossa (cribriform plate).", "The frontal bone forms most of the anterior fossa floor."], "pearl": "Sella turcica = sphenoid body; houses the pituitary, flanked by cavernous sinuses.", "set": "cranial"}, {"id": "LH-74", "stem": "In a bar fight, the orbit of a 25-year-old man is pierced by a broken pool cue that extends back to the superior orbital fissure. Which of the following nerves is most likely damaged?", "opts": ["Optic nerve", "Facial nerve", "Mandibular division of trigeminal", "Maxillary division of trigeminal", "Ophthalmic division of trigeminal"], "ans": 4, "why": "The branches of CN V1 (lacrimal, frontal, nasociliary) enter the orbit through the superior orbital fissure, along with CN III, IV, VI, and the superior ophthalmic vein.", "wrong": ["Enters the orbit through the optic canal", "Does not enter the orbit", "Exits the skull through the foramen ovale", "Exits through the foramen rotundum", ""], "pearl": "Superior orbital fissure: CN III, IV, V1, VI + superior ophthalmic v.", "set": "orbit"}, {"id": "G-162", "stem": "A 16-year-old female volleyball player is hit in the eye with a ball. Radiographs reveal a blow-out fracture of the inferior wall of the orbit. The pupil of her eye cannot be turned upward. Which of the following muscle(s) is (are) most likely injured?", "opts": ["Inferior rectus and inferior oblique", "Medial and inferior recti", "Inferior oblique", "Medial rectus, inferior rectus, and inferior oblique", "Inferior rectus"], "ans": 0, "why": "The fractured orbital floor can trap the inferior rectus and inferior oblique, which then anchor the globe and prevent upward gaze. The muscles and their nerves are not necessarily damaged.", "wrong": ["", "Medial rectus lies on the medial wall, not the floor.", "Only part of the floor-related tethering; the inferior rectus is the main entrapped muscle.", "Medial rectus is not involved in a floor fracture.", "Commonly entrapped, but the keyed answer includes the inferior oblique, which also lies near the floor."], "pearl": "Orbital floor fracture: entrapped inferior rectus -> impaired upgaze + diplopia; check infraorbital n.", "set": "orbit"}, {"id": "G-104", "stem": "The dilator pupillae, the smooth muscle of the superior tarsal muscle and the smooth muscle of the ciliary body blood vessels all receive efferent nerve fibers. Which structure contains the cell bodies of these fibers?", "opts": ["Pterygopalatine ganglion", "Intermediolateral nucleus (lateral horn) C1 to C4", "Geniculate ganglion", "Nucleus solitarius", "Superior cervical ganglion"], "ans": 4, "why": "All of these targets receive sympathetic supply. The postganglionic cell bodies for the head are in the superior cervical ganglion, and their fibers travel with the internal carotid and ophthalmic arteries.", "wrong": ["A parasympathetic ganglion (CN VII) for the lacrimal and nasal glands.", "The lateral horn exists only from T1 to L2, and it holds preganglionic neurons.", "A sensory ganglion of CN VII (taste); it has no efferent cell bodies.", "A sensory nucleus for taste and visceral input.", ""], "pearl": "Postganglionic sympathetics to the eye come from the superior cervical ganglion (preganglionic cells at T1).", "set": "orbit"}, {"id": "LC-18", "stem": "A 27-year-old woman has asymmetric pupils: her right pupil is abnormally dilated and responds slowly to light. Visual acuity is normal, and there are no other signs or symptoms. Which structure is most likely affected?", "opts": ["Superior cervical ganglion", "Optic nerve", "Oculomotor nerve", "Trochlear nerve", "Abducent nerve"], "ans": 2, "why": "Parasympathetic fibers ride on the outside of CN III, so compression affects them first. Loss of sphincter pupillae gives a dilated, sluggish pupil, an early sign of CN III compression (e.g., uncal herniation).", "wrong": ["SCG damage gives miosis (Horner), not a dilated pupil.", "Optic nerve damage would impair vision in that eye.", "", "CN IV palsy causes vertical diplopia, not pupil changes.", "CN VI palsy causes impaired abduction, not pupil changes."], "pearl": "Isolated blown/sluggish pupil = early CN III compression (parasympathetics are superficial).", "set": "orbit"}, {"id": "BH-35", "stem": "A 61-year-old woman has ocular lymphoma invading her optic canal. Which structure is most likely damaged?", "opts": ["Ophthalmic vein", "Ophthalmic nerve", "Oculomotor nerve", "Trochlear nerve", "Ophthalmic artery"], "ans": 4, "why": "The optic canal transmits only the optic nerve and the ophthalmic artery.", "wrong": ["Ophthalmic vein passes through the superior orbital fissure.", "V1 passes through the superior orbital fissure.", "CN III passes through the superior orbital fissure.", "CN IV passes through the superior orbital fissure.", ""], "pearl": "Optic canal = CN II + ophthalmic artery; everything else to the orbit uses the SOF.", "set": "orbit"}, {"id": "BH-21", "stem": "A 41-year-old woman overdoses on medications that stimulate autonomic nerves. Which of the following results from stimulation of the parasympathetic fibers to the eyeball?", "opts": ["Enhanced vision for distant objects", "Dilation of the pupil", "Contraction of capillaries in the iris", "Contraction of the ciliary muscle", "Flattening of the lens"], "ans": 3, "why": "Parasympathetic fibers (CN III -> ciliary ganglion -> short ciliary nerves) contract the ciliary muscle and sphincter pupillae, rounding the lens for near vision and constricting the pupil.", "wrong": ["Distant vision (lens flattening) occurs when the ciliary muscle relaxes.", "Pupil dilation is sympathetic (dilator pupillae).", "Iris vasoconstriction is sympathetic.", "", "Lens flattening follows ciliary relaxation, not parasympathetic stimulation."], "pearl": "Parasympathetic eye: miosis + ciliary contraction = near vision (accommodation).", "set": "orbit"}, {"id": "LH-8", "stem": "A 75-year-old man reports progressively more trouble opening his left eye because his upper eyelid tends to droop. Which of the following muscles is most likely weakened?", "opts": ["Orbicularis oculi", "Frontalis", "Levator palpebrae superioris", "Superior rectus", "Orbital muscle"], "ans": 2, "why": "The levator palpebrae superioris (CN III) is the main elevator of the upper eyelid; its weakness or aponeurotic dehiscence in the elderly causes ptosis.", "wrong": ["Closes the eyelids (CN VII); weakness causes inability to close, not ptosis", "Raises the eyebrows and wrinkles the forehead; does not lift the lid itself", "", "Elevates the eyeball, not the eyelid", "Smooth muscle bridging the inferior orbital fissure; not an eyelid elevator"], "pearl": "Ptosis: large = LPS/CN III; mild = superior tarsal (Müller) muscle/sympathetic loss.", "set": "orbit"}, {"id": "G-181", "stem": "A 34-year-old woman presents with a painful eye. Examination reveals a lump in the lower eyelid consisting of debris, and a chalazion is diagnosed. Which of the following structures is most likely blocked?", "opts": ["Lacrimal ducts", "Tarsal glands", "Sclera", "Pupil", "Nasolacrimal duct"], "ans": 1, "why": "A chalazion is a cyst from obstruction of a tarsal (meibomian) gland embedded in the tarsal plate of the eyelid.", "wrong": ["Lacrimal gland swelling presents in the upper lateral lid, not as a chalazion.", "", "Part of the globe wall; not a glandular structure that can be blocked.", "An opening in the iris, not related to eyelid glands.", "Drains the lacrimal sac to the inferior meatus; unrelated to a lid lump."], "pearl": "Chalazion = blocked tarsal (meibomian) gland; stye (hordeolum) = infected gland of eyelash follicle.", "set": "orbit"}, {"id": "G-77", "stem": "A 44-year-old woman being treated for Raynaud's disease receives a sympathetic blocking drug in high doses. Which adverse effect is most likely?", "opts": ["Exophthalmos and dilated pupil", "Enophthalmos and dry eye", "Dry eye and inability to accommodate for reading", "Wide open eyelids and loss of depth perception", "Ptosis and miosis"], "ans": 4, "why": "Blocking sympathetics paralyzes the superior tarsal (Müller) muscle, giving partial ptosis, and leaves the parasympathetic sphincter pupillae unopposed, giving miosis.", "wrong": ["Pupil dilation needs sympathetic dilator pupillae, which is blocked.", "Lacrimation is parasympathetic and would be preserved.", "Lacrimation and accommodation are both parasympathetic and unaffected.", "Eyelid elevation would be reduced, and depth perception is a visual pathway function.", ""], "pearl": "Sympathetic loss = Horner features: partial ptosis (Müller) + miosis ± anhidrosis; complete ptosis = CN III (levator).", "set": "orbit"}, {"id": "BH-29", "stem": "The pupil of a 43-year-old patient remains small even when room lighting is dim. Which of the following is injured?", "opts": ["Trochlear nerve", "Superior cervical ganglion", "Oculomotor nerve", "Ophthalmic nerve", "Abducens nerve"], "ans": 1, "why": "Failure to dilate in dim light indicates loss of the postganglionic sympathetic fibers from the superior cervical ganglion that supply the dilator pupillae.", "wrong": ["CN IV is purely motor to superior oblique.", "", "CN III injury causes a dilated, not small, pupil.", "V1 carries sensory fibers; it only conveys sympathetics passively.", "CN VI is purely motor to lateral rectus."], "pearl": "Persistent miosis = sympathetic (superior cervical ganglion) lesion - Horner.", "set": "orbit"}, {"id": "LH-49", "stem": "A 32-year-old woman has LASIK surgery. To treat dry eyes, her ophthalmologist inserts a small silicone plug to block drainage of tears from her left eye. Obstruction of what structure prevents tears from entering the lacrimal drainage apparatus?", "opts": ["Lacrimal punctum", "Lacrimal canaliculus", "Lacrimal sac", "Nasolacrimal duct", "Inferior nasal meatus"], "ans": 0, "why": "Tears enter the drainage system through the lacrimal puncta on the lacrimal papillae at the medial lid margins. A punctal plug blocks this entry point so tears stay on the eye.", "wrong": ["", "Lies downstream of the punctum; tears have already entered", "Downstream collecting chamber in the lacrimal fossa", "Carries tears from the sac to the nose; far downstream", "Final outlet of the nasolacrimal duct in the nasal cavity"], "pearl": "Tear drainage: punctum -> canaliculus -> lacrimal sac -> nasolacrimal duct -> inferior meatus.", "set": "orbit"}, {"id": "BH-37", "stem": "During surgery for a malignant parotid tumor in a 69-year-old woman, the main trunk of the facial nerve is lacerated. Which muscle is paralyzed?", "opts": ["Masseter muscle", "Stylopharyngeus muscle", "Anterior belly of the digastric muscle", "Buccinator muscle", "Tensor tympani"], "ans": 3, "why": "The buccinator is a muscle of facial expression supplied by the buccal branches of CN VII.", "wrong": ["Masseter is supplied by V3.", "Stylopharyngeus is supplied by CN IX.", "Anterior belly of digastric is supplied by V3 (nerve to mylohyoid).", "", "Tensor tympani is supplied by V3."], "pearl": "Buccinator: CN VII motor; buccal nerve of V3 is only sensory to the cheek.", "set": "face"}, {"id": "LH-34", "stem": "A 78-year-old man has signs of reduced blood flow to the right side of his face. The physician wants to palpate the facial artery pulse on both sides. Where can the facial artery pulse be readily palpated?", "opts": ["Lateral side of the body of the hyoid bone", "Inferior edge of the zygomatic arch", "Apex of the zygomatic bone", "Lateral surface of the nasal bone", "Inferior margin of the body of the mandible"], "ans": 4, "why": "The facial artery hooks around the inferior border of the mandible just anterior to the masseter, where it is superficial and can be compressed against bone to feel a pulse.", "wrong": ["The lingual artery, not the facial, lies near the hyoid", "The transverse facial artery runs near here, not the facial artery", "The facial artery does not pass over the zygomatic bone", "Only the terminal angular/lateral nasal branches are here; not a pulse site", ""], "pearl": "Facial a. pulse: inferior border of mandible, anterior edge of masseter.", "set": "face"}, {"id": "G-17", "stem": "A 50-year-old woman complains of pain over her chin and lower lip. A few days later, small vesicles appear over the same area and erupt. She is diagnosed with herpes zoster (shingles). Which nerve most likely contains the virus?", "opts": ["Auriculotemporal", "Buccal", "Lesser petrosal", "Mental", "Infraorbital"], "ans": 3, "why": "Skin of the chin and lower lip is supplied by the mental nerve, the terminal cutaneous branch of the inferior alveolar nerve (V3).", "wrong": ["Supplies temple, TMJ, parotid region and ear skin, not the chin.", "Supplies cheek skin and inner buccal mucosa.", "Carries preganglionic parasympathetics to the otic ganglion; not a cutaneous sensory nerve.", "", "Branch of V2 supplying the upper lip, lower eyelid and side of nose."], "pearl": "Chin + lower lip = mental nerve (V3, via inferior alveolar n. exiting the mental foramen).", "set": "face"}, {"id": "LH-48", "stem": "During surgery, the anesthesiologist at the head of the table periodically checks the patient's pulse by palpating the artery located just anterior to the tragus of the ear. Which artery is being used?", "opts": ["Maxillary", "Posterior auricular", "Superficial temporal", "Facial", "Internal carotid"], "ans": 2, "why": "The superficial temporal artery, a terminal branch of the external carotid, ascends anterior to the tragus over the zygomatic root, where its pulse is easily felt.", "wrong": ["Runs deep to the mandibular neck in the infratemporal fossa; not palpable", "Runs behind the ear", "", "Palpated at the inferior border of the mandible", "Runs deep in the neck and skull base; not palpable anterior to the ear"], "pearl": "Pulse in front of the tragus = superficial temporal a.", "set": "face"}, {"id": "G-295", "stem": "A 30-year-old unrestrained driver has a displaced transverse fracture of the right mandibular ramus just above the angle. Which function will most likely be affected?", "opts": ["Elevation of the jaw", "Lateral deviation of the jaw to the left side", "Salivation; sensation and taste from the anterior tongue", "Sensation from skin over anterior cheek and tongue", "Salivation; sensation from posterior temporal skin and tragus of the ear"], "ans": 2, "why": "The lingual nerve, carrying chorda tympani fibers, runs between the medial pterygoid and the ramus. A ramus fracture can injure it, reducing submandibular/sublingual salivation plus general sensation and taste from the anterior tongue.", "wrong": ["Elevation uses masseter, temporalis, and medial pterygoid, which are not denervated here.", "Lateral deviation depends on the pterygoids, which remain innervated.", "", "Anterior cheek skin is not supplied by the lingual nerve.", "That pattern is auriculotemporal (parotid, temple, tragus), which lies higher and posterior."], "pearl": "Lingual n. + chorda tympani: anterior 2/3 tongue sensation and taste; submandibular/sublingual secretion.", "set": "face"}, {"id": "G-261", "stem": "A 40-year-old singer who grinds her teeth has left jaw pain, left earache, and headache. Opening her mouth wide is painful and clicks, the jaw deviates slightly left on elevation, the area around the left condyle is tender, and there is spasm-like tightness only along the left mandibular ramus. Spasm of which muscle is most likely?", "opts": ["Buccinator", "Masseter", "Mylohyoid", "Posterior belly of the digastric", "Lateral pterygoid"], "ans": 1, "why": "The masseter runs from the zygomatic arch to the lateral ramus and is a strong jaw elevator. Bruxism can make it hypertrophied and spastic, which limits depression of the mandible and produces tightness along the ramus.", "wrong": ["Buccinator is a facial muscle of the cheek, not a jaw elevator.", "", "Mylohyoid lies in the floor of the mouth, not along the ramus.", "The digastric depresses the mandible and lies below it.", "The lateral pterygoid is deep in the ITF and cannot be felt along the ramus."], "pearl": "Tightness palpable over the ramus = masseter; bruxism -> masseter hypertrophy.", "set": "face"}, {"id": "LH-20", "stem": "A student learns she has a perfect score on the anatomy portion of her board examination and smiles. What muscle elevates her labial commissures bilaterally to produce the smile?", "opts": ["Zygomaticus major", "Zygomaticus minor", "Levator labii superioris", "Buccinator", "Orbicularis oris"], "ans": 0, "why": "The zygomaticus major runs from the zygomatic bone to the angle of the mouth and pulls the labial commissures up and laterally, producing a smile (CN VII).", "wrong": ["", "Elevates the upper lip rather than the corners of the mouth", "Elevates and everts the upper lip", "Compresses the cheek against the teeth", "Closes and protrudes the lips (sphincter)"], "pearl": "Smile = zygomaticus major (CN VII zygomatic/buccal branches).", "set": "face"}, {"id": "BH-51", "stem": "A 64-year-old woman cannot open her mouth or jaw because of tetanus from a penetrating rusty-nail wound. Which muscle's function is most likely lost?", "opts": ["Masseter muscle", "Medial pterygoid muscle", "Lateral pterygoid muscle", "Buccinator muscle", "Temporalis muscle"], "ans": 2, "why": "The lateral pterygoid is the principal muscle of mastication that opens the jaw by protruding and depressing the mandible.", "wrong": ["Masseter elevates (closes) the jaw.", "Medial pterygoid elevates (closes) the jaw.", "", "Buccinator is a facial muscle of the cheek.", "Temporalis elevates and retracts the jaw."], "pearl": "Lateral pterygoid opens the jaw; masseter, temporalis, medial pterygoid close it.", "set": "face"}, {"id": "LH-64", "stem": "A bony overgrowth narrows the pterygomaxillary fissure, compressing the third (pterygopalatine) part of the maxillary artery. Blood flow will be reduced in which of the following arteries?", "opts": ["Superficial temporal", "Sphenopalatine", "Inferior alveolar", "Middle meningeal", "Ophthalmic"], "ans": 1, "why": "The third part of the maxillary artery passes through the pterygomaxillary fissure into the pterygopalatine fossa and gives off the sphenopalatine, descending palatine, posterior superior alveolar, and infraorbital arteries.", "wrong": ["Terminal branch of the external carotid, separate from the maxillary artery", "", "Branch of the first (mandibular) part of the maxillary artery", "Branch of the first (mandibular) part of the maxillary artery", "Branch of the internal carotid artery"], "pearl": "Maxillary a.: 1st part (middle meningeal, inferior alveolar); 2nd (muscular); 3rd (sphenopalatine, infraorbital, PSA, descending palatine).", "set": "face"}, {"id": "G-57", "stem": "A 32-year-old woman asks about the soft, thin ridge she can feel running forward across her masseter muscle toward her upper lip. What structure is she most likely feeling?", "opts": ["Facial artery", "Maxillary artery", "Parotid duct", "Marginal mandibular branch of the facial nerve", "Facial vein"], "ans": 2, "why": "The parotid (Stensen's) duct crosses the masseter horizontally, then pierces buccinator to open opposite the upper second molar; it is palpable over a clenched masseter.", "wrong": ["Pulse is felt at the anterior border of masseter on the mandible, not across it.", "Lies deep in the infratemporal fossa; not palpable.", "", "Runs along the lower border of the mandible; too fine to palpate.", "Runs obliquely anterior to the facial artery, not across masseter."], "pearl": "Parotid duct: across masseter, pierces buccinator, opens at upper 2nd molar.", "set": "face"}, {"id": "G-228", "stem": "After thyroidectomy, a 29-year-old woman develops a neck hematoma. Examination shows partial ptosis and pupillary constriction on the side of the hematoma. The hematoma is most likely compressing which ganglion?", "opts": ["Submandibular", "Trigeminal", "Superior cervical", "Geniculate", "Ciliary"], "ans": 2, "why": "The superior cervical ganglion, posterior to the carotid sheath, supplies sympathetics to the head, including the dilator pupillae and superior tarsal muscle; compression gives Horner syndrome (partial ptosis, miosis).", "wrong": ["Parasympathetic ganglion for the submandibular and sublingual glands.", "Sensory ganglion for the face; no pupil or lid effect.", "", "Sensory (taste) ganglion of CN VII.", "Parasympathetic; its loss would dilate, not constrict, the pupil."], "pearl": "Horner: partial ptosis (superior tarsal), miosis, anhidrosis -> sympathetic chain/superior cervical ganglion.", "set": "neck"}, {"id": "LH-19", "stem": "A newborn girl is unable to turn her head to the right, even with assistance. Her neck rotation and lateral bending are limited, and her head is tilted toward the right with the chin elevated and turned toward the left. What muscle is most likely responsible?", "opts": ["Platysma", "Trapezius", "Sternocleidomastoid", "Masseter", "Digastric"], "ans": 2, "why": "Congenital torticollis results from a shortened or fibrosed sternocleidomastoid. The right SCM tilts the head toward the right shoulder and turns the chin to the left, so a tight right SCM produces this posture and blocks turning to the right.", "wrong": ["Thin cutaneous muscle (CN VII) that only tenses neck skin", "Elevates/retracts the scapula and extends the neck; does not produce this tilt-rotation posture", "", "Muscle of mastication; does not move the neck", "Suprahyoid muscle that moves the hyoid/mandible, not the head"], "pearl": "Torticollis: head tilts toward the tight SCM, chin rotates to the opposite side.", "set": "neck"}, {"id": "G-158", "stem": "A 55-year-old man presents with pain when chewing over the previous 3 months. Physical examination reveals odynophagia and hoarseness. Radiographic examination reveals a tumor in the tracheoesophageal groove. Which of the following nerves is most likely affected by the tumor?", "opts": ["Recurrent laryngeal", "Internal laryngeal", "Vagus", "External laryngeal", "Phrenic"], "ans": 0, "why": "After looping around the subclavian artery (right) or aortic arch (left), the recurrent laryngeal nerve ascends in the tracheoesophageal groove. Compression there paralyzes most intrinsic laryngeal muscles, producing hoarseness.", "wrong": ["", "Sensory above the vocal folds; enters via the thyrohyoid membrane, not the tracheoesophageal groove.", "Lies in the carotid sheath; a lesion would cause many deficits beyond hoarseness.", "Motor to cricothyroid only; runs with the superior thyroid artery, not in the groove.", "Descends on anterior scalene; injury affects the diaphragm, not the voice."], "pearl": "Tracheoesophageal groove = recurrent laryngeal nerve -> hoarseness.", "set": "neck"}, {"id": "G-22", "stem": "A 17-year-old girl has had painful discoloration of her hand for the past year. MRI reveals thoracic outlet syndrome. Which symptom would most likely result from this syndrome?", "opts": ["Problems with respiration because of pressure on the phrenic nerve", "Reduced blood flow to the thoracic wall", "Reduced venous return from the head and neck", "Numbness in the upper limb", "Distention of the internal jugular vein"], "ans": 3, "why": "Thoracic outlet syndrome (e.g., from a cervical rib or scalene bands) compresses the lower brachial plexus trunks, producing upper-limb numbness/paresthesia.", "wrong": ["The phrenic nerve descends on anterior scalene and is not compressed at the outlet.", "Rich anastomoses keep the chest wall well perfused.", "Head and neck venous drainage via the IJV is not compressed here.", "", "The IJV lies medially in the carotid sheath and is not obstructed."], "pearl": "Cervical rib/scalene compression of the lower trunk (C8–T1) and subclavian vessels = thoracic outlet syndrome → ulnar-side paresthesia.", "set": "neck"}, {"id": "G-191", "stem": "An 11-year-old boy has recurrent palatine tonsillitis. Which of the following lymph nodes is most likely to first become visibly enlarged?", "opts": ["Submandibular", "Parotid", "Jugulodigastric", "Submental", "Preauricular"], "ans": 2, "why": "The jugulodigastric (tonsillar) node of the superior deep cervical chain, located where the posterior digastric crosses the IJV, receives lymph from the palatine tonsil and enlarges in tonsillitis.", "wrong": ["Drains lateral face, lips, and anterior tongue.", "Drains the scalp, eyelids, and external ear region.", "", "Drains the tongue tip, chin, and central lower lip.", "Drains the lateral eyelids and anterior ear region."], "pearl": "Tonsil -> jugulodigastric node (below angle of mandible).", "set": "neck"}, {"id": "G-60", "stem": "A 20-year-old man has a stab wound in the superior neck that has not affected major structures, but he has lost sensation over the skin at the angle of the jaw. Which nerve is most likely injured?", "opts": ["Supraclavicular", "Transverse cervical", "Great auricular", "Greater occipital", "Lesser occipital"], "ans": 2, "why": "The great auricular nerve (C2–C3) ascends over SCM to supply skin over the angle of the mandible, parotid region and lower auricle.", "wrong": ["C3–C4; supplies skin over the clavicle and shoulder.", "Supplies skin of the anterior neck.", "", "Dorsal ramus of C2; supplies the posterior scalp.", "C2; supplies scalp behind the ear."], "pearl": "Skin over angle of jaw = great auricular (C2–3), not trigeminal.", "set": "neck"}, {"id": "G-65", "stem": "A 55-year-old woman with severe hypertension and 90% occlusion of both common carotid arteries undergoes carotid endarterectomy. Postoperatively, her tongue deviates to the right when protruded. Which nerve was most likely injured?", "opts": ["Right glossopharyngeal", "Right hypoglossal", "Left hypoglossal", "Left lingual", "Left vagus"], "ans": 1, "why": "CN XII crosses the carotid bifurcation and is at risk in endarterectomy; with a right lesion the unopposed left genioglossus pushes the tongue toward the right.", "wrong": ["Lesion causes loss of posterior-tongue taste and gag, not deviation.", "", "Would deviate the tongue to the left.", "Sensory/taste nerve; no motor role in protrusion.", "Lesion affects palate and larynx, not tongue protrusion."], "pearl": "Tongue points TOWARD the side of the CN XII lesion ('lick your wounds'); CN XII crosses ICA/ECA near the bifurcation.", "set": "neck"}, {"id": "LH-52", "stem": "A paralyzed right true vocal fold is most likely associated with which of the following situations?", "opts": ["Repair of a patent ductus arteriosus", "Repair of an aortic aneurysm", "A gunshot wound below the second rib", "Surgical removal of the thyroid gland", "Obstruction of the thoracic duct"], "ans": 3, "why": "The right recurrent laryngeal nerve loops under the right subclavian artery and ascends in the tracheoesophageal groove next to the thyroid, where it is vulnerable during thyroidectomy.", "wrong": ["Endangers the LEFT recurrent laryngeal nerve, which hooks under the aortic arch", "Endangers the LEFT recurrent laryngeal nerve at the aortic arch", "The right recurrent nerve loops at the subclavian artery, above this level", "", "Lymphatic obstruction does not affect the laryngeal nerves"], "pearl": "Right RLN: loops under R subclavian; left RLN: under aortic arch. Thyroidectomy risks both.", "set": "larynx"}, {"id": "BH-48", "stem": "A 12-year-old boy is choking on food. After a failed attempt to dislodge it, the school nurse performs a needle cricothyrotomy. The needle enters which region?", "opts": ["Rima glottidis", "Laryngeal vestibule", "Laryngeal ventricle", "Infraglottic cavity", "Piriform recess"], "ans": 3, "why": "The cricothyroid membrane lies below the vocal folds, so a needle through it enters the infraglottic cavity, which extends from the rima glottidis to the lower cricoid border.", "wrong": ["Rima glottidis is the gap between the vocal folds, above this level.", "Vestibule lies above the vestibular folds.", "Ventricle lies between the vestibular and vocal folds.", "", "Piriform recess is part of the laryngopharynx, outside the larynx."], "pearl": "Cricothyrotomy -> infraglottic cavity (below the vocal cords).", "set": "larynx"}, {"id": "G-30", "stem": "A 22-year-old man in the emergency department is intubated. The endotracheal tube passes through the opening between the vocal folds. What is this opening called?", "opts": ["Piriform recess", "Vestibule", "Ventricle", "Vallecula", "Rima glottidis"], "ans": 4, "why": "The rima glottidis is the gap between the two vocal folds (and arytenoid cartilages), the narrowest part of the laryngeal airway.", "wrong": ["Mucosal recess of the laryngopharynx lateral to the laryngeal inlet.", "Space from the laryngeal inlet down to the vestibular folds.", "Recess between vestibular (false) and vocal (true) folds.", "Recess between tongue base and epiglottis.", ""], "pearl": "Rima glottidis = between true cords; rima vestibuli = between false cords.", "set": "larynx"}, {"id": "BH-19", "stem": "A 71-year-old woman repeatedly chokes while eating due to swallowing difficulty. Which pair of muscles is most instrumental in preventing food from entering the larynx and trachea during swallowing?", "opts": ["Sternohyoid and sternothyroid muscles", "Oblique arytenoid and aryepiglottic muscles", "Inferior pharyngeal constrictor and thyrohyoid muscles", "Levator veli palatini and tensor veli palatini muscles", "Musculus uvulae and geniohyoid muscles"], "ans": 1, "why": "The oblique arytenoid and aryepiglottic muscles draw the arytenoids together and tighten the aryepiglottic folds, acting as a sphincter of the laryngeal inlet during swallowing.", "wrong": ["Infrahyoid strap muscles depress the larynx and hyoid.", "", "Cricopharyngeus prevents air entering the esophagus; thyrohyoid only elevates larynx.", "Palatal muscles seal the nasopharynx, not the larynx.", "These elevate the uvula and hyoid; they don't close the inlet."], "pearl": "Laryngeal inlet sphincter = oblique arytenoids + aryepiglottic muscles.", "set": "larynx"}, {"id": "G-284", "stem": "A patient is intubated without anesthesia, and the tube strikes the epiglottis, causing him to grimace. Which cranial nerve carries pain from this part of the larynx?", "opts": ["Vagus", "Glossopharyngeal", "Vestibulocochlear", "Hypoglossal", "Facial"], "ans": 0, "why": "The laryngeal inlet and epiglottis receive sensory supply from the internal laryngeal nerve, a branch of the vagus via the superior laryngeal nerve.", "wrong": ["", "CN IX supplies the oropharynx and posterior tongue, not the laryngeal epiglottis.", "CN VIII carries hearing and balance.", "CN XII is motor to the tongue.", "CN VII does not supply the epiglottis."], "pearl": "Larynx sensation: above folds = internal laryngeal (X); below folds = recurrent laryngeal (X).", "set": "larynx"}, {"id": "G-234", "stem": "A 73-year-old patient has neck pain, hoarseness, and weight loss for 6 months. Laryngoscopy shows a large tumor on one of the true vocal folds, and the specialist cannot pass the scope through the opening between the folds. What is this opening called?", "opts": ["Piriform recess", "Vestibule", "Ventricle", "Vallecula", "Rima glottidis"], "ans": 4, "why": "The rima glottidis is the aperture between the two true vocal folds (and arytenoids). Its width is adjusted by intrinsic laryngeal muscles and it is the narrowest part of the adult laryngeal airway.", "wrong": ["Piriform recess is a pharyngeal gutter lateral to the aryepiglottic fold, outside the larynx.", "Laryngeal vestibule lies above the vestibular (false) folds, not between true folds.", "Laryngeal ventricle is the recess between the false and true folds.", "Vallecula is the depression between the tongue base and epiglottis.", ""], "pearl": "Rima glottidis = space between true vocal folds; rima vestibuli = between false folds.", "set": "larynx"}];

];
