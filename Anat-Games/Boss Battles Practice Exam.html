sympathetics in.", "V2 lends the zygomatic nerve as part of the route but does not originate the secretomotor fibers.", "CN III parasympathetics go to sphincter pupillae and the ciliary muscle, not to the lacrimal gland.", "CN VI supplies only the lateral rectus and carries no parasympathetic fibers.", ""], "pearl": "Tears = CN VII. The lacrimal nerve (V1) is the taxi, not the driver.", "set": "orbit"}, {"id": "ORB-14", "stem": "An ethmoid sinus infection causes deep aching pain between the eyes. General sensation from the ethmoidal sinuses is carried by which nerve?", "opts": ["Frontal nerve", "Nasociliary nerve", "Infraorbital nerve", "Zygomatic nerve", "Lacrimal nerve"], "ans": 1, "why": "Nasociliary (V1) gives off the anterior and posterior ethmoidal nerves, which leave the orbit through the ethmoidal foramina to supply the ethmoid sinuses.", "wrong": ["The frontal nerve (V1) supplies forehead and scalp skin through its supraorbital and supratrochlear branches.", "", "The infraorbital nerve (V2) supplies the cheek, upper lip, and lower lid, and is associated with the maxillary sinus region.", "The zygomatic nerve (V2) supplies skin over the cheekbone and temple.", "The lacrimal nerve (V1) is sensory to the lacrimal gland."], "pearl": "Ethmoid sinus sensation = nasociliary (V1) ethmoidal nerves through the ethmoidal foramina.", "set": "orbit"}, {"id": "ORB-15", "stem": "A surgeon removes the roof of the orbit and looks straight down into it. Which structure is encountered most superficially?", "opts": ["Superior rectus", "Superior oblique", "Optic nerve", "Levator palpebrae superioris", "Inferior oblique"], "ans": 3, "why": "From a superior approach levator palpebrae superioris lies most superficially, with superior rectus directly beneath it and superior oblique lying medially.", "wrong": ["The superior rectus lies immediately deep to levator palpebrae superioris.", "The superior oblique lies medially in the orbit, deeper than levator palpebrae.", "The optic nerve lies deep within the muscle cone toward the orbital apex.", "", "The inferior oblique lies near the floor of the orbit, farthest from a superior approach."], "pearl": "Superior view top to bottom: frontal nerve -> levator palpebrae -> superior rectus; superior oblique sits medial.", "set": "orbit"}, {"id": "ORB-16", "stem": "Which combination correctly describes the actions of the superior oblique muscle?", "opts": ["Depression, abduction, and intorsion", "Elevation, abduction, and extorsion", "Depression, adduction, and extorsion", "Elevation, adduction, and intorsion", "Pure adduction"], "ans": 0, "why": "The superior oblique depresses, abducts, and intorts the eye, which is why it is clinically tested by looking down with the eye adducted.", "wrong": ["", "Elevation, abduction, and extorsion are the actions of the inferior oblique (CN III).", "No single muscle does this; the inferior rectus depresses the eye and is best tested in abduction.", "No single muscle does this; the superior rectus elevates the eye and is best tested in abduction.", "Pure adduction is the action of the medial rectus (CN III)."], "pearl": "Both obliques ABduct. SO = down + intort; IO = up + extort.", "set": "orbit"}, {"id": "PHX-1", "stem": "A 44-year-old woman has a breathy, hoarse voice on the first day after a total thyroidectomy. Laryngoscopy shows the right vocal fold lying immobile, although she can still raise her pitch somewhat and supraglottic sensation is intact. Which nerve was most likely injured?", "opts": ["Recurrent laryngeal nerve", "External laryngeal nerve", "Internal laryngeal nerve", "Pharyngeal branch of the vagus", "Glossopharyngeal nerve"], "ans": 0, "why": "The recurrent laryngeal nerve supplies all intrinsic laryngeal muscles except cricothyroid, so injury leaves the fold immobile and the voice hoarse; it is at risk where it runs with the inferior thyroid artery.", "wrong": ["", "The external laryngeal nerve supplies only cricothyroid and runs with the superior thyroid artery; its injury causes loss of high pitch and vocal fatigue, not fold paralysis.", "The internal laryngeal nerve is purely sensory to mucosa above the vocal folds and carries laryngeal cough afferents, so injury causes aspiration risk rather than hoarseness.", "The pharyngeal branch of the vagus is motor to the pharyngeal constrictors and the palate, so injury causes dysphagia and uvular deviation.", "CN IX is motor only to stylopharyngeus and sensory to the oropharynx and posterior one third of the tongue; it does not move the vocal folds."], "pearl": "Hoarse after thyroid surgery = Recurrent laryngeal, the nerve that Rides with the Inferior thyroid artery.", "set": "pharynx"}, {"id": "PHX-2", "stem": "A professional soprano notes that after a thyroid lobectomy her speaking voice sounds normal, but she can no longer reach her high notes and her voice tires quickly by mid-rehearsal. Injury to which nerve best explains this?", "opts": ["Recurrent laryngeal nerve", "Internal laryngeal nerve", "External laryngeal nerve", "Auricular branch of the vagus", "Pharyngeal branch of the vagus"], "ans": 2, "why": "The external laryngeal nerve supplies cricothyroid, which tenses the vocal folds and controls high pitch and vocal range; it travels with the superior thyroid artery and is at risk during its ligation.", "wrong": ["Recurrent laryngeal injury paralyzes the intrinsic muscles and produces a frankly hoarse or breathy voice, not isolated pitch loss.", "The internal laryngeal nerve is sensory to mucosa above the folds, so its loss causes an absent cough reflex and aspiration.", "", "The auricular branch (Arnold nerve) supplies skin of the external ear and external acoustic meatus and has no laryngeal motor role.", "The pharyngeal branch drives the constrictors and palatal muscles, so its injury causes dysphagia and nasal regurgitation."], "pearl": "External laryngeal = Cricothyroid = high pitch, and it sings alongside the Superior Thyroid artery.", "set": "pharynx"}, {"id": "PHX-3", "stem": "During a thyroidectomy the surgeon deliberately ligates the superior thyroid artery flush against the upper pole of the gland in order to spare the nerve travelling with it. Denervation of which muscle is being avoided?", "opts": ["Posterior cricoarytenoid", "Lateral cricoarytenoid", "Thyroarytenoid", "Transverse arytenoid", "Cricothyroid"], "ans": 4, "why": "The external laryngeal nerve accompanies the superior thyroid artery and supplies cricothyroid, the only intrinsic laryngeal muscle not supplied by the recurrent laryngeal nerve.", "wrong": ["Posterior cricoarytenoid is the only abductor of the vocal folds and is supplied by the recurrent laryngeal nerve.", "Lateral cricoarytenoid adducts the folds and is a recurrent laryngeal muscle.", "Thyroarytenoid shortens and relaxes the folds and is supplied by the recurrent laryngeal nerve.", "The transverse arytenoid adducts the folds and, like the other intrinsics, is recurrent laryngeal.", ""], "pearl": "Cricothyroid: the only intrinsic muscle on the OUTER surface of the larynx, and the only one NOT recurrent laryngeal.", "set": "pharynx"}, {"id": "PHX-4", "stem": "Before an awake fiberoptic intubation an anesthesiologist blocks a nerve bilaterally as it pierces the thyrohyoid membrane with the superior laryngeal artery. The patient then tolerates the scope in the supraglottis without coughing. Which nerve was blocked?", "opts": ["Recurrent laryngeal nerve", "Internal laryngeal nerve", "External laryngeal nerve", "Glossopharyngeal nerve", "Auricular branch of the vagus"], "ans": 1, "why": "The internal laryngeal nerve carries general sensation from laryngeal mucosa above the vocal folds and is the afferent limb of the cough reflex from the larynx.", "wrong": ["The recurrent laryngeal nerve carries sensation from below the vocal folds and motor supply to the intrinsic muscles, so blocking it would risk fold paralysis.", "", "The external laryngeal nerve is a pure motor branch to cricothyroid and carries no mucosal sensation.", "CN IX supplies the oropharynx, soft palate and tonsils, so blocking it blunts gagging rather than supraglottic cough.", "The auricular branch of the vagus supplies external ear skin and is unrelated to airway anesthesia."], "pearl": "Internal laryngeal = sensation ABOVE the cords, entering with the superior LARYNGEAL artery through the thyrohyoid membrane.", "set": "pharynx"}, {"id": "PHX-5", "stem": "A 61-year-old man with a skull base tumor is asked to say 'ahh.' His uvula deviates to the left, and he has a weak gag with nasal regurgitation of liquids. Which nerve is injured?", "opts": ["Left glossopharyngeal nerve", "Left pharyngeal branch of the vagus", "Right glossopharyngeal nerve", "Right pharyngeal branch of the vagus", "Right hypoglossal nerve"], "ans": 3, "why": "With a unilateral vagal pharyngeal branch lesion the intact side pulls the uvula away from the lesion, so leftward deviation localizes to the right pharyngeal branch of the vagus.", "wrong": ["CN IX is motor only to stylopharyngeus and moves no palatal muscle; it supplies the afferent limb of the gag reflex.", "A left-sided vagal lesion would let the intact right side pull the uvula to the RIGHT.", "Again, CN IX supplies no palatal muscle, so it cannot cause uvular deviation.", "", "CN XII moves the tongue, and its lesion deviates the TONGUE toward the injured side."], "pearl": "Uvula points AWAY from a vagus lesion; the tongue points TOWARD a CN XII lesion.", "set": "pharynx"}, {"id": "PHX-6", "stem": "All muscles of the soft palate are supplied by the vagus nerve through its pharyngeal branch, with a single exception. Which muscle is the exception, and what supplies it?", "opts": ["Tensor veli palatini, by V3", "Levator veli palatini, by V3", "Palatopharyngeus, by CN IX", "Musculus uvulae, by CN XII", "Palatoglossus, by CN XII"], "ans": 0, "why": "Tensor veli palatini is the one palatal muscle supplied by the mandibular division of the trigeminal nerve (V3); every other palatal muscle is vagal.", "wrong": ["", "Levator veli palatini elevates the palate and IS vagal by way of the pharyngeal branch.", "Palatopharyngeus is a vagal muscle; the only muscle supplied by CN IX is stylopharyngeus.", "Musculus uvulae is vagal, and CN XII supplies tongue muscles only.", "Palatoglossus is the tongue-muscle exception and is vagal, not CN XII."], "pearl": "Tensor veli palatini is the odd one out: V3 supplies the 'tensors' (tensor tympani, tensor veli palatini).", "set": "pharynx"}, {"id": "PHX-7", "stem": "During swallowing, one muscle elevates the pharynx and larynx and is the only pharyngeal muscle not supplied by the vagus nerve. Which muscle is it?", "opts": ["Superior constrictor", "Middle constrictor", "Stylopharyngeus", "Inferior constrictor", "Palatopharyngeus"], "ans": 2, "why": "Stylopharyngeus is the single muscle supplied by the glossopharyngeal nerve (CN IX), and it elevates the pharynx and larynx during swallowing.", "wrong": ["The superior constrictor is a vagal constrictor that narrows the pharynx to propel the bolus.", "The middle constrictor is vagal and overlaps the other constrictors to squeeze the bolus downward.", "", "The inferior constrictor is vagal and is the most caudal of the three overlapping constrictors.", "Palatopharyngeus does elevate the pharynx, but it is supplied by the vagus rather than CN IX."], "pearl": "CN IX has exactly ONE muscle: StyloPharyngeus, the 'nine' elevator of the pharynx and larynx.", "set": "pharynx"}, {"id": "PHX-8", "stem": "Every muscle of the tongue is supplied by the hypoglossal nerve except one. Which muscle is that exception?", "opts": ["Styloglossus", "Hyoglossus", "Genioglossus", "Superior longitudinal muscle", "Palatoglossus"], "ans": 4, "why": "Palatoglossus is supplied by the vagus nerve through its pharyngeal branch, making it the sole tongue muscle that is not CN XII.", "wrong": ["Styloglossus retracts and elevates the tongue and is CN XII.", "Hyoglossus depresses the tongue and is CN XII.", "Genioglossus protrudes the tongue and is CN XII; its weakness deviates the tongue toward the lesion.", "The intrinsic longitudinal muscles change tongue shape and are CN XII.", ""], "pearl": "PalatoGLOSSUS acts like a tongue muscle but votes with the PALATE, so it is CN X.", "set": "pharynx"}, {"id": "PHX-9", "stem": "A neurologist touches the posterior wall of the oropharynx with a tongue depressor and the palate and pharynx contract briskly. Which nerve carries the afferent limb of this reflex?", "opts": ["Vagus nerve", "Glossopharyngeal nerve", "Mandibular division of the trigeminal nerve", "Hypoglossal nerve", "Facial nerve"], "ans": 1, "why": "The gag reflex has a CN IX afferent limb, which carries general sensation from the oropharynx, soft palate and tonsils, and a CN X efferent limb to the palatal and pharyngeal muscles.", "wrong": ["The vagus is the EFFERENT limb of the gag reflex, contracting the constrictors and palate.", "", "V3 gives general sensation to the anterior tongue and supplies tensor veli palatini, but not oropharyngeal sensation.", "CN XII is purely motor to the tongue and carries no sensory fibers.", "CN VII carries taste from the anterior two thirds of the tongue, not oropharyngeal touch."], "pearl": "Gag reflex: IX in, X out.", "set": "pharynx"}, {"id": "PHX-10", "stem": "A patient sustains bilateral recurrent laryngeal nerve injury during a difficult thyroidectomy, becomes stridorous in the recovery room, and needs urgent airway management. Paralysis of which muscle explains the obstruction?", "opts": ["Cricothyroid", "Lateral cricoarytenoid", "Thyroarytenoid", "Posterior cricoarytenoid", "Superior constrictor"], "ans": 3, "why": "Posterior cricoarytenoid is the only abductor of the vocal folds, so bilateral recurrent laryngeal injury leaves the folds nearly apposed and the airway critically narrowed.", "wrong": ["Cricothyroid tenses the folds for high pitch and is spared here because it is supplied by the external laryngeal nerve.", "Lateral cricoarytenoid ADducts the folds, so losing it would widen rather than narrow the glottis.", "Thyroarytenoid shortens and relaxes the folds and has no role in keeping the airway open.", "", "The superior constrictor propels the bolus through the pharynx and does not affect glottic patency."], "pearl": "Posterior Cricoarytenoid = Please Come Apart: the only ABductor of the cords.", "set": "pharynx"}, {"id": "PHX-11", "stem": "A schwannoma at the jugular foramen compresses the nerves passing through that opening. Which set of cranial nerves is most likely affected?", "opts": ["CN IX, X and XI", "CN VII, VIII and IX", "CN X, XI and XII", "CN V, VII and IX", "CN VIII, IX and X"], "ans": 0, "why": "The glossopharyngeal, vagus and accessory nerves all leave the skull through the jugular foramen, and CN IX and CN X then descend within the carotid sheath.", "wrong": ["", "CN VII and CN VIII pass through the internal acoustic meatus, not the jugular foramen.", "CN XII exits through its own hypoglossal canal, so it is not a jugular foramen nerve.", "The trigeminal divisions leave through the superior orbital fissure, foramen rotundum and foramen ovale.", "CN VIII exits by the internal acoustic meatus and is not a jugular foramen nerve."], "pearl": "Jugular foramen: 9, 10, 11 out together, then 9 and 10 ride down in the carotid sheath.", "set": "pharynx"}, {"id": "PHX-12", "stem": "A lesion interrupts the parasympathetic secretomotor fibers destined for the parotid gland, leaving that side of the mouth dry. Which pathway was interrupted?", "opts": ["Greater petrosal nerve to the pterygopalatine ganglion", "Chorda tympani to the submandibular ganglion", "Lesser petrosal nerve to the otic ganglion", "Pharyngeal branch of the vagus to the otic ganglion", "Internal laryngeal nerve to the submandibular ganglion"], "ans": 2, "why": "CN IX parasympathetics travel in the lesser petrosal nerve, synapse in the otic ganglion, and postganglionic fibers then reach the parotid gland.", "wrong": ["The greater petrosal nerve is a CN VII branch synapsing in the pterygopalatine ganglion for lacrimal and nasal glands.", "Chorda tympani is CN VII and synapses in the submandibular ganglion for the submandibular and sublingual glands.", "", "The pharyngeal branch of the vagus is motor to the constrictors and palate and carries no parotid secretomotor fibers.", "The internal laryngeal nerve is sensory to the supraglottic mucosa and has no salivary function."], "pearl": "Parotid is IX: Lesser petrosal -> Otic ganglion -> parotid. Little nerve, Otic stop, big gland.", "set": "pharynx"}, {"id": "PHX-13", "stem": "Firm pressure over the carotid bifurcation in an elderly man causes abrupt bradycardia and near-syncope. Which nerve carries the afferent signal from the stretched baroreceptors?", "opts": ["Recurrent laryngeal nerve", "Internal laryngeal nerve", "Auricular branch of the vagus", "Pharyngeal branch of the vagus", "Glossopharyngeal nerve"], "ans": 4, "why": "Carotid sinus baroreceptors, like carotid body chemoreceptors, send visceral afferents through the nerve of Hering, a branch of CN IX.", "wrong": ["The recurrent laryngeal nerve carries mucosal sensation from below the vocal folds plus motor supply to the intrinsic laryngeal muscles.", "The internal laryngeal nerve carries supraglottic sensation and the laryngeal cough afferents.", "The auricular branch (Arnold nerve) supplies skin of the external ear and external acoustic meatus, where stimulation can trigger a vagal cough.", "The pharyngeal branch of the vagus is a motor branch to the palate and pharyngeal constrictors.", ""], "pearl": "Carotid SINUS and BODY -> nerve of Hering -> CN IX.", "set": "pharynx"}, {"id": "PHX-14", "stem": "A patient tastes sweet normally on the tip of the tongue but reports no taste at all from the posterior tongue surface. Tongue movements and strength are normal. Which nerve is damaged?", "opts": ["Facial nerve", "Glossopharyngeal nerve", "Hypoglossal nerve", "External laryngeal nerve", "Mandibular division of the trigeminal nerve"], "ans": 1, "why": "CN IX carries both general sensation and special sensory taste from the posterior one third of the tongue.", "wrong": ["CN VII, through chorda tympani, carries taste from the anterior two thirds of the tongue, which is intact here.", "", "CN XII is purely motor to the tongue muscles and carries no taste fibers.", "The external laryngeal nerve is motor to cricothyroid only and carries no taste.", "V3 carries general sensation, not taste, from the anterior tongue."], "pearl": "Posterior one third of the tongue: CN IX does BOTH touch and taste - one nerve, two jobs.", "set": "pharynx"}, {"id": "PHX-15", "stem": "A 58-year-old smoker inhales a small food particle that lodges in the trachea just below the vocal folds and coughs violently. Which nerve carries the afferent limb of this cough?", "opts": ["Internal laryngeal nerve", "External laryngeal nerve", "Glossopharyngeal nerve", "Recurrent laryngeal nerve", "Auricular branch of the vagus"], "ans": 3, "why": "The recurrent laryngeal nerve provides general sensation to mucosa below the vocal folds, including the trachea, so it is the cough afferent from that territory.", "wrong": ["The internal laryngeal nerve carries cough afferents from ABOVE the vocal folds, not below them.", "The external laryngeal nerve is a pure motor branch to cricothyroid.", "CN IX serves the oropharynx and tonsils and mediates gagging rather than tracheal cough.", "", "The auricular branch supplies external ear skin, and although canal stimulation can trigger a reflex cough it carries no tracheal sensation."], "pearl": "Treat the cords as a waterline: above = Internal laryngeal, below (including trachea) = Recurrent laryngeal.", "set": "pharynx"}, {"id": "PHX-16", "stem": "While an ear canal is being irrigated, a patient suddenly coughs and feels faint. Stimulation of which nerve best explains this?", "opts": ["Auricular branch of the vagus", "Internal laryngeal nerve", "Glossopharyngeal nerve", "Recurrent laryngeal nerve", "External laryngeal nerve"], "ans": 0, "why": "The auricular branch of the vagus (Arnold nerve) supplies skin of the external ear and external acoustic meatus, so stimulating the canal can produce a vagally mediated cough.", "wrong": ["", "The internal laryngeal nerve senses mucosa above the vocal folds, not ear canal skin.", "CN IX supplies the oropharynx, tonsils, posterior tongue and carotid sinus, but not external ear canal skin.", "The recurrent laryngeal nerve senses the subglottis and trachea.", "The external laryngeal nerve is purely motor to cricothyroid."], "pearl": "Arnold's ear-cough: the vagus sneaks a skin branch into the external acoustic meatus.", "set": "pharynx"}, {"id": "PHX-17", "stem": "A surgeon operating near the upper larynx wants to identify the nerve that travels with the superior laryngeal artery. Which nerve completes that neurovascular pair?", "opts": ["Recurrent laryngeal nerve", "External laryngeal nerve", "Internal laryngeal nerve", "Pharyngeal branch of the vagus", "Glossopharyngeal nerve"], "ans": 2, "why": "The internal laryngeal nerve travels with the superior laryngeal artery, while the external laryngeal nerve pairs with the superior thyroid artery and the recurrent laryngeal nerve with the inferior thyroid artery.", "wrong": ["The recurrent laryngeal nerve pairs with the INFERIOR thyroid artery near the lower pole of the thyroid gland.", "The external laryngeal nerve pairs with the superior THYROID artery, not the superior laryngeal artery.", "", "The pharyngeal branch runs to the pharyngeal plexus and is not a named partner of this artery.", "CN IX runs to stylopharyngeus and the oropharynx and does not accompany this artery."], "pearl": "Match the names: Internal laryngeal + superior LARYNGEAL artery; External laryngeal + superior THYROID; Recurrent + INFERIOR thyroid.", "set": "pharynx"}, {"id": "PHX-18", "stem": "A 67-year-old smoker reports 6 weeks of progressive hoarseness. Laryngoscopy shows an immobile left vocal fold, and imaging reveals a left mediastinal mass. Which nerve is compressed?", "opts": ["Left external laryngeal nerve", "Left recurrent laryngeal nerve", "Left internal laryngeal nerve", "Left pharyngeal branch of the vagus", "Left glossopharyngeal nerve"], "ans": 1, "why": "A mediastinal or apical lung mass compressing the recurrent laryngeal nerve paralyzes the intrinsic laryngeal muscles on that side and produces progressive hoarseness with an immobile fold.", "wrong": ["External laryngeal injury spares fold mobility and instead causes loss of high pitch and vocal fatigue.", "", "Internal laryngeal injury causes loss of supraglottic sensation and cough with normal fold movement.", "A pharyngeal branch lesion causes dysphagia and uvular deviation away from the lesion, not fold paralysis.", "CN IX injury blunts the gag afferent and posterior tongue sensation and taste, not phonation."], "pearl": "Progressive hoarseness plus a chest mass = recurrent laryngeal; loss of high notes alone = external laryngeal.", "set": "pharynx"}, {"id": "NCK-1", "stem": "During a left supraclavicular dissection for a traumatic laceration, a surgeon must control the first branch arising from the subclavian artery before it disappears into bone. Which vessel is this?", "opts": ["Vertebral artery", "Internal carotid artery", "Superior thyroid artery", "Costocervical trunk", "Occipital artery"], "ans": 0, "why": "The vertebral artery is the first branch of the subclavian artery, arising before the internal thoracic artery and the thyrocervical and costocervical trunks.", "wrong": ["", "The internal carotid arises from the common carotid bifurcation, not the subclavian, and gives no branches in the neck.", "The superior thyroid artery is the first branch of the external carotid artery and runs with the external laryngeal nerve.", "The costocervical trunk is a subclavian branch but is the last of the VIT C group, arising well distal to the vertebral artery.", "The occipital artery is a posterior branch of the external carotid artery supplying the posterior scalp."], "pearl": "VIT C in order: Vertebral first, then Internal thoracic, Thyrocervical, Costocervical.", "set": "neck"}, {"id": "NCK-2", "stem": "A 46-year-old man has a cervical spine fracture with displacement of the transverse processes of C4 and C5. A vessel running within the transverse foramina at that level is at risk. Where does this vessel terminate its cervical course?", "opts": ["Carotid canal", "Foramen magnum", "Jugular foramen", "Hypoglossal canal", "Stylomastoid foramen"], "ans": 1, "why": "The vertebral artery ascends through the foramina transversaria of C6 up to C1 and then enters the cranial cavity through the foramen magnum.", "wrong": ["The carotid canal transmits the internal carotid artery, not the vertebral artery.", "", "The jugular foramen transmits the internal jugular vein and CN IX, X and XI, including the spinal accessory nerve.", "The hypoglossal canal transmits CN XII, which is purely motor to the tongue.", "The stylomastoid foramen transmits the facial nerve as it exits the skull."], "pearl": "Vertebral artery: transverse foramina C6 -> C1, then foramen magnum. Internal carotid takes the carotid canal instead.", "set": "neck"}, {"id": "NCK-3", "stem": "A patient undergoing a supraclavicular block has anesthetic injected near a short trunk off the subclavian artery that divides into three vessels supplying the thyroid, the posterior scapular region and the superficial neck. Which artery is a branch of this trunk?", "opts": ["Superior thyroid artery", "Internal thoracic artery", "Suprascapular artery", "Posterior auricular artery", "Maxillary artery"], "ans": 2, "why": "The thyrocervical trunk of the subclavian artery gives the inferior thyroid, transverse cervical and suprascapular arteries.", "wrong": ["The superior thyroid artery comes off the external carotid artery, not the thyrocervical trunk.", "The internal thoracic artery is its own separate subclavian branch descending into the thorax.", "", "The posterior auricular artery is an external carotid branch supplying the scalp behind the ear.", "The maxillary artery is a terminal branch of the external carotid supplying deep face structures."], "pearl": "Thyrocervical trunk = inferior thyroid + transverse cervical + suprascapular.", "set": "neck"}, {"id": "NCK-4", "stem": "A resident placing a subclavian central line is reminded that the anterior scalene muscle separates the vein she is cannulating from the artery and brachial plexus. Which statement correctly describes this relationship?", "opts": ["The subclavian vein lies posterior to anterior scalene", "The brachial plexus lies anterior to anterior scalene", "The subclavian artery lies anterior to anterior scalene", "The subclavian vein lies anterior to anterior scalene", "The vertebral artery pierces anterior scalene"], "ans": 3, "why": "The anterior scalene is the key landmark of the root of the neck: the subclavian vein passes anterior to it while the subclavian artery and brachial plexus pass posterior to it.", "wrong": ["The vein is anterior, not posterior; the artery and plexus are the posterior structures.", "The brachial plexus travels posterior to anterior scalene, in the interscalene groove with the artery.", "The subclavian artery is posterior to anterior scalene, which is why the vein is the safer target for cannulation.", "", "The vertebral artery ascends through the cervical transverse foramina and does not pierce the anterior scalene."], "pearl": "Vein in front, Artery and plexus behind: anterior scalene is the divider (VAP front to back).", "set": "neck"}, {"id": "NCK-5", "stem": "After a thyroidectomy in which the superior thyroid artery was ligated close to the gland, a professional soprano finds she cannot reach her high notes, although her speaking voice is normal. Which nerve was injured?", "opts": ["Recurrent laryngeal nerve", "Hypoglossal nerve", "Spinal accessory nerve", "Glossopharyngeal nerve", "External laryngeal nerve"], "ans": 4, "why": "The external laryngeal nerve travels with the superior thyroid artery and supplies cricothyroid; injury causes loss of high pitch with an otherwise normal voice.", "wrong": ["Recurrent laryngeal injury produces frank hoarseness and a breathy voice, not isolated loss of high pitch; it runs with the inferior thyroid artery.", "The hypoglossal nerve is motor to the tongue and causes tongue deviation, not voice change.", "The spinal accessory nerve supplies sternocleidomastoid and trapezius and has no laryngeal function.", "The glossopharyngeal nerve carries parotid secretomotor fibers and posterior tongue sensation.", ""], "pearl": "Superior thyroid artery + external laryngeal nerve -> lost high pitch. Inferior thyroid artery + recurrent laryngeal -> hoarseness.", "set": "neck"}, {"id": "NCK-6", "stem": "A 52-year-old woman is hoarse after thyroid surgery. The nerve responsible runs alongside an artery that arises from a trunk off the subclavian artery. Which artery accompanied the injured nerve?", "opts": ["Inferior thyroid artery", "Superior thyroid artery", "Lingual artery", "Facial artery", "Internal carotid artery"], "ans": 0, "why": "The inferior thyroid artery, from the thyrocervical trunk of the subclavian, travels with the recurrent laryngeal nerve, so hoarseness follows injury near this vessel.", "wrong": ["", "The superior thyroid artery is an external carotid branch and accompanies the external laryngeal nerve, whose injury causes loss of high pitch.", "The lingual artery is an external carotid branch supplying the tongue and runs near the hypoglossal nerve, not the recurrent laryngeal.", "The facial artery is an external carotid branch to the face and does not accompany a laryngeal nerve.", "The internal carotid artery gives no branches in the neck and has no relation to the laryngeal nerves."], "pearl": "InFerior artery with the recurrent nerve (hoarse); superior artery with the external nerve (high pitch).", "set": "neck"}, {"id": "NCK-7", "stem": "A carotid angiogram shows a vessel running from the level of C4 to the skull base with no branches along its entire cervical course. Through which opening does this vessel enter the skull?", "opts": ["Foramen magnum", "Carotid canal", "Foramen spinosum", "Jugular foramen", "Foramen transversarium of C1"], "ans": 1, "why": "The internal carotid artery gives no branches in the neck and enters the skull through the carotid canal of the temporal bone.", "wrong": ["The foramen magnum admits the vertebral arteries and the spinal cord, not the internal carotid.", "", "The foramen spinosum transmits the middle meningeal artery, a branch of the maxillary artery.", "The jugular foramen transmits the internal jugular vein and CN IX, X and XI.", "The foramen transversarium of C1 is part of the vertebral artery route, not the carotid route."], "pearl": "No branches in the neck = internal carotid. It earns its own canal.", "set": "neck"}, {"id": "NCK-8", "stem": "A 68-year-old man has syncope when his tight collar presses on a dilated area at the origin of one of the great vessels of the neck. At approximately which vertebral level does this baroreceptor-containing dilation lie?", "opts": ["C2", "C3", "C4", "C6", "T1"], "ans": 2, "why": "The common carotid bifurcates at about the C4 level, where the carotid sinus and carotid body sit at the origin of the internal carotid.", "wrong": ["C2 is above the bifurcation, near the level where the great auricular and other cervical plexus branches distribute.", "C3 is above the usual bifurcation level; the cervical plexus cutaneous branches derive from C1-C4.", "", "C6 is the level where the vertebral artery enters the transverse foramen, not where the carotid divides.", "T1 is at the root of the neck, near the subclavian artery and brachial plexus, far below the bifurcation."], "pearl": "Carotid bifurcation at C4: sinus (baroreceptor) plus body (chemoreceptor).", "set": "neck"}, {"id": "NCK-9", "stem": "A penetrating wound just above the hyoid bone causes brisk bleeding from an external carotid branch that passes deep to the hyoglossus to supply the tongue. Which branch is it?", "opts": ["Superior thyroid artery", "Ascending pharyngeal artery", "Occipital artery", "Lingual artery", "Superficial temporal artery"], "ans": 3, "why": "The lingual artery is the third external carotid branch and is the main blood supply to the tongue.", "wrong": ["The superior thyroid artery is the first external carotid branch and supplies the thyroid gland and larynx.", "The ascending pharyngeal artery is the second, smallest external carotid branch supplying the pharyngeal wall.", "The occipital artery supplies the posterior scalp.", "", "The superficial temporal artery is a terminal external carotid branch supplying the lateral scalp."], "pearl": "SALFOPMS: Superior thyroid, Ascending pharyngeal, Lingual, Facial, Occipital, Post auricular, Maxillary, Superficial temporal.", "set": "neck"}, {"id": "NCK-10", "stem": "A skull base tumor compresses a nerve that later crosses the posterior triangle to reach the trapezius. Through which opening does that nerve leave the skull?", "opts": ["Hypoglossal canal", "Carotid canal", "Foramen magnum", "Stylomastoid foramen", "Jugular foramen"], "ans": 4, "why": "The spinal accessory nerve (CN XI) exits the skull through the jugular foramen before crossing the posterior triangle to supply sternocleidomastoid and trapezius.", "wrong": ["The hypoglossal canal transmits CN XII, which supplies tongue muscles rather than trapezius.", "The carotid canal transmits the internal carotid artery, not a cranial nerve to the neck muscles.", "The foramen magnum transmits the spinal cord and the vertebral arteries.", "The stylomastoid foramen transmits CN VII, which supplies the posterior belly of digastric and stylohyoid.", ""], "pearl": "Jugular foramen: IX, X, XI plus the internal jugular vein. XI then rides through the posterior triangle.", "set": "neck"}, {"id": "NCK-11", "stem": "Three weeks after excisional biopsy of a lymph node in the posterior triangle of the neck, a 30-year-old woman cannot shrug the shoulder on that side and the shoulder droops with scapular winging. Which deficit would you also expect?", "opts": ["Weak head turning to the opposite side", "Hoarse voice", "Loss of sensation over the angle of the jaw", "Deviation of the protruded tongue", "Dry mouth on that side"], "ans": 0, "why": "CN XI supplies both trapezius and sternocleidomastoid, so injury in the posterior triangle also weakens turning the head to the contralateral side.", "wrong": ["", "Hoarseness reflects recurrent laryngeal nerve injury; CN XI has no laryngeal motor role.", "Sensation over the angle of the jaw is great auricular (C2-C3), a purely sensory cervical plexus branch.", "Tongue deviation on protrusion indicates hypoglossal nerve injury, not accessory nerve injury.", "Reduced salivation would involve CN VII (submandibular and sublingual) or CN IX (parotid)."], "pearl": "XI runs superficially across the posterior triangle: SCM + trapezius. Shrug weak, and head turns poorly AWAY from the injured side.", "set": "neck"}, {"id": "NCK-12", "stem": "A surgeon opens the carotid sheath in the neck. Which structure is NOT enclosed within the sheath but lies just posterior to it?", "opts": ["Internal jugular vein", "Cervical sympathetic trunk", "Vagus nerve", "Common carotid artery", "Deep cervical lymph nodes"], "ans": 1, "why": "The carotid sheath contains the common/internal carotid artery, internal jugular vein, CN X and deep cervical nodes; the cervical sympathetic trunk lies outside, posterior to it.", "wrong": ["The internal jugular vein is a sheath content and is the vein the ansa cervicalis loops over.", "", "The vagus nerve travels inside the carotid sheath between the artery and vein.", "The common carotid artery is the principal content of the sheath, bifurcating at about C4.", "Deep cervical lymph nodes lie along the internal jugular vein inside the sheath."], "pearl": "Sheath = artery + IJV + vagus + nodes. Sympathetic trunk is the outsider, sitting behind it.", "set": "neck"}, {"id": "NCK-13", "stem": "A 24-year-old man has a firm mass at the posterior border of the sternocleidomastoid at the nerve point of the neck, with numbness over the angle of the jaw and the skin overlying the parotid gland. Which nerve is compressed?", "opts": ["Transverse cervical nerve", "Supraclavicular nerve", "Great auricular nerve", "Mandibular division of trigeminal", "Spinal accessory nerve"], "ans": 2, "why": "The great auricular nerve (C2-C3) emerges at the nerve point of the neck and supplies skin over the parotid and the angle of the mandible.", "wrong": ["The transverse cervical nerve supplies skin of the anterior neck, not the angle of the jaw.", "The supraclavicular nerves supply skin over the clavicle and the shoulder.", "", "V3 supplies the lower face but spares the skin over the angle of the mandible, which is cervical plexus territory.", "The spinal accessory nerve is motor only, to sternocleidomastoid and trapezius."], "pearl": "Angle of the jaw is great auricular (C2-C3), not trigeminal. All four cutaneous branches surface at the punctum nervosum.", "set": "neck"}, {"id": "NCK-14", "stem": "A 60-year-old man has a wasted, fasciculating left side of the tongue, and on protrusion the tongue tip points to the left. A lesion of which structure best explains this?", "opts": ["Left vagus nerve in the carotid sheath", "Right hypoglossal nerve in the hypoglossal canal", "Left spinal accessory nerve in the posterior triangle", "Left hypoglossal nerve in the hypoglossal canal", "Left glossopharyngeal nerve at the jugular foramen"], "ans": 3, "why": "CN XII injury causes ipsilateral tongue atrophy and fasciculation, and the protruded tongue deviates toward the lesioned side because the intact contralateral genioglossus pushes it across.", "wrong": ["Vagal injury causes hoarseness and palate droop but spares tongue muscle bulk except palatoglossus.", "A right-sided hypoglossal lesion would waste the right tongue and deviate it to the right.", "The spinal accessory nerve supplies sternocleidomastoid and trapezius, producing shoulder droop rather than tongue signs.", "", "CN IX carries posterior tongue sensation and taste plus parotid secretion, not tongue motor supply."], "pearl": "The tongue licks its wound: it points TOWARD the side of the CN XII lesion.", "set": "neck"}, {"id": "NCK-15", "stem": "A patient has weakness of every muscle of the tongue except one extrinsic muscle, which still elevates the back of the tongue and closes the oropharyngeal isthmus normally. Which muscle is spared, and by which nerve is it supplied?", "opts": ["Genioglossus, CN XII", "Hyoglossus, CN XII", "Styloglossus, CN XII", "Geniohyoid, C1", "Palatoglossus, CN X"], "ans": 4, "why": "CN XII supplies all intrinsic tongue muscles plus genioglossus, hyoglossus and styloglossus; palatoglossus is the exception, supplied by CN X.", "wrong": ["Genioglossus protrudes the tongue and is supplied by CN XII, so it would be weak.", "Hyoglossus depresses the tongue and is a CN XII muscle.", "Styloglossus retracts the tongue and elevates its sides, and is supplied by CN XII.", "Geniohyoid is a suprahyoid muscle supplied by C1 running with CN XII; it elevates the hyoid rather than the back of the tongue.", ""], "pearl": "All glossus muscles are CN XII except palatoGLOSSUS (CN X) - the palate belongs to the vagus.", "set": "neck"}, {"id": "NCK-16", "stem": "A patient is asked to pull the tongue backward into the mouth after it has been protruded. Which muscle primarily performs this retraction?", "opts": ["Styloglossus", "Genioglossus", "Hyoglossus", "Palatoglossus", "Mylohyoid"], "ans": 0, "why": "Styloglossus retracts the tongue and elevates its sides; it is supplied by CN XII.", "wrong": ["", "Genioglossus protrudes the tongue, the action tested when the patient sticks the tongue out.", "Hyoglossus depresses the tongue.", "Palatoglossus elevates the back of the tongue and closes the oropharyngeal isthmus, and is a CN X muscle.", "Mylohyoid forms the floor of the mouth and elevates the hyoid; it is supplied by the nerve to mylohyoid from V3."], "pearl": "Genio = out, Hyo = down, Stylo = back, Palato = up at the back.", "set": "neck"}, {"id": "NCK-17", "stem": "A mandibular nerve block anesthetizing the inferior alveolar nerve also weakens two muscles in the floor of the mouth. Which pair is affected?", "opts": ["Posterior belly of digastric and stylohyoid", "Mylohyoid and anterior belly of digastric", "Geniohyoid and thyrohyoid", "Stylopharyngeus and styloglossus", "Sternohyoid and omohyoid"], "ans": 1, "why": "The nerve to mylohyoid, a branch of the inferior alveolar nerve (V3), supplies mylohyoid and the anterior belly of digastric.", "wrong": ["The posterior belly of digastric and stylohyoid are supplied by CN VII, unaffected by a V3 block.", "", "Geniohyoid is supplied by C1 with CN XII, and thyrohyoid by C1 travelling with CN XII as well.", "Stylopharyngeus is the sole CN IX motor muscle, and styloglossus is CN XII.", "Sternohyoid and omohyoid are infrahyoid muscles supplied by the ansa cervicalis (C1-C3)."], "pearl": "Nerve to mylohyoid (V3) takes mylohyoid + ANTERIOR digastric; CN VII takes POSTERIOR digastric + stylohyoid.", "set": "neck"}, {"id": "NCK-18", "stem": "During a neck dissection a nerve loop lying over the internal jugular vein is transected. Which infrahyoid muscle retains its innervation?", "opts": ["Omohyoid", "Sternohyoid", "Thyrohyoid", "Sternothyroid", "Mylohyoid"], "ans": 2, "why": "The ansa cervicalis (C1-C3) supplies omohyoid, sternohyoid and sternothyroid; thyrohyoid is the exception, supplied by C1 travelling with the hypoglossal nerve.", "wrong": ["Omohyoid is an ansa cervicalis muscle and would be denervated.", "Sternohyoid is supplied by the ansa cervicalis.", "", "Sternothyroid is supplied by the ansa cervicalis.", "Mylohyoid is a suprahyoid muscle supplied by V3, so it is not an infrahyoid option at all."], "pearl": "Ansa cervicalis (motor only, loops over the IJV) does the straps; THYROhyoid hitches a ride on CN XII with C1.", "set": "neck"}, {"id": "SKL-1", "stem": "A 26-year-old man is struck in the face during a fight. CT shows a fracture through the thin perforated plate of bone forming the roof of the nasal cavity, clear fluid drips from his nose, and he can no longer smell coffee. Which nerve was injured as it passed through that opening?", "opts": ["Olfactory nerve (CN I)", "Optic nerve (CN II)", "Ophthalmic nerve (V1)", "Maxillary nerve (V2)", "Facial nerve (CN VII)"], "ans": 0, "why": "The olfactory nerve filaments pass through the foramina of the cribriform plate; a cribriform fracture shears them, producing anosmia and CSF rhinorrhea.", "wrong": ["", "CN II runs in the optic canal alongside the ophthalmic artery, not through the cribriform plate.", "V1 branches reach the orbit through the superior orbital fissure.", "V2 leaves the middle cranial fossa through the foramen rotundum.", "CN VII enters the internal acoustic meatus and exits the skull at the stylomastoid foramen."], "pearl": "Cribriform = a sieve for smell: CN I is the only nerve through those tiny holes.", "set": "skull"}, {"id": "SKL-2", "stem": "During a middle cranial fossa approach, a surgeon identifies a small foramen just posterolateral to the foramen ovale. Which structure passes through it?", "opts": ["Mandibular nerve (V3)", "Internal carotid artery", "Internal jugular vein", "Middle meningeal artery", "Superior ophthalmic vein"], "ans": 3, "why": "The foramen spinosum sits just posterolateral to the foramen ovale and transmits the middle meningeal artery; it carries no cranial nerve.", "wrong": ["V3 exits the middle cranial fossa through the foramen ovale, not the spinosum.", "The internal carotid artery enters the skull through the carotid canal.", "The internal jugular vein leaves through the jugular foramen together with CN IX, X and XI.", "", "The superior ophthalmic vein passes through the superior orbital fissure with CN III, IV, V1 and VI."], "pearl": "Spinosum carries no nerve, just the middle meningeal artery - S for the Skull's meningeal blood Supply.", "set": "skull"}, {"id": "SKL-3", "stem": "A 58-year-old woman has a mass in the lateral wall of the cavernous sinus extending anteriorly. She has a fixed dilated pupil, complete ptosis, no eye movement in any direction, and a numb forehead with an absent corneal reflex; sensation over her cheek and jaw is normal. The contents of which opening are involved?", "opts": ["Optic canal", "Superior orbital fissure", "Inferior orbital fissure", "Foramen rotundum", "Foramen ovale"], "ans": 1, "why": "CN III, IV, V1 and VI all enter the orbit through the superior orbital fissure, so a lesion there gives total ophthalmoplegia plus forehead numbness with intact V2 and V3.", "wrong": ["The optic canal transmits CN II and the ophthalmic artery, so a lesion there causes vision loss, not ophthalmoplegia.", "", "The inferior orbital fissure transmits the zygomatic and infraorbital nerves (V2) and the inferior ophthalmic vein.", "The foramen rotundum transmits only V2, which would numb the cheek and upper teeth.", "The foramen ovale transmits V3, giving jaw numbness and weak chewing."], "pearl": "Superior orbital fissure = eye-movement highway: 3, 4, 6 plus V1 plus the superior ophthalmic vein.", "set": "skull"}, {"id": "SKL-4", "stem": "A 44-year-old man has episodic lancinating pain and numbness over his cheek, upper lip and upper teeth. Forehead and jaw sensation and chewing strength are normal. Compression at which opening best explains this?", "opts": ["Superior orbital fissure", "Foramen ovale", "Foramen rotundum", "Infraorbital foramen", "Cribriform plate"], "ans": 2, "why": "The maxillary nerve (V2) leaves the middle cranial fossa through the foramen rotundum, so a lesion there affects cheek, upper lip and upper teeth while sparing V1 and V3.", "wrong": ["The superior orbital fissure carries CN III, IV, V1 and VI, so a lesion would cause ophthalmoplegia and forehead numbness.", "The foramen ovale carries V3, producing chin and jaw numbness plus weakness of chewing.", "", "The infraorbital foramen transmits only the cutaneous infraorbital nerve, so the upper teeth would be spared.", "The cribriform plate transmits CN I, which affects smell only."], "pearl": "Rotundum = Round = the seconD division: V2 exits here. Ovale = V3.", "set": "skull"}, {"id": "SKL-5", "stem": "A 61-year-old man has a skull base tumor eroding the right hypoglossal canal. Taste and general sensation on the tongue are normal. Which finding is expected?", "opts": ["Loss of taste on the anterior two-thirds of the tongue", "Loss of general sensation over the anterior tongue", "Isolated weakness of the palatoglossus muscle", "Deviation of the protruded tongue away from the lesion", "Right-sided tongue atrophy with the protruded tip pointing to the right"], "ans": 4, "why": "The hypoglossal canal transmits only CN XII, so the deficit is purely motor: ipsilateral atrophy and fasciculation with the protruded tip pointing toward the lesioned side.", "wrong": ["Taste on the anterior two-thirds is carried by CN VII (chorda tympani), which enters via the internal acoustic meatus.", "General sensation on the anterior tongue is V3, which travels through the foramen ovale.", "Palatoglossus is the one 'glossus' supplied by CN X, so it is spared in a CN XII lesion.", "The tongue deviates toward, not away from, the weak side because the intact genioglossus pushes it across.", ""], "pearl": "Lick your wounds: the tongue points TOWARD the side of a CN XII lesion. Styloglossus, hyoglossus, genioglossus = XII.", "set": "skull"}, {"id": "SKL-6", "stem": "A patient with a skull base tumor has hoarseness, an absent gag reflex, trouble swallowing, weakness turning the head to the opposite side, and distended neck veins on the affected side. Which opening is involved?", "opts": ["Jugular foramen", "Hypoglossal canal", "Internal acoustic meatus", "Foramen magnum", "Stylomastoid foramen"], "ans": 0, "why": "CN IX, X and XI exit through the jugular foramen along with the internal jugular vein, so a mass there produces this combined nerve plus venous picture.", "wrong": ["", "The hypoglossal canal transmits CN XII alone, giving purely motor tongue findings.", "The internal acoustic meatus transmits CN VII and VIII, causing facial weakness and hearing or balance loss.", "The foramen magnum transmits the medulla and spinal cord, the vertebral arteries and the spinal roots of CN XI.", "The stylomastoid foramen is simply where CN VII leaves the skull to reach the face."], "pearl": "Jugular foramen = 9, 10, 11 plus the internal jugular vein - count 9-10-11 out the jugular door.", "set": "skull"}, {"id": "SKL-7", "stem": "A 40-year-old woman has progressive unilateral hearing loss and imbalance, and later develops weakness of all muscles of facial expression on the same side. A schwannoma is expanding within which opening?", "opts": ["Jugular foramen", "Internal acoustic meatus", "Stylomastoid foramen", "Carotid canal", "Foramen spinosum"], "ans": 1, "why": "CN VII and CN VIII travel together in the internal acoustic meatus, so a mass there causes hearing and vestibular loss followed by facial nerve involvement.", "wrong": ["The jugular foramen transmits CN IX, X and XI with the internal jugular vein.", "", "The stylomastoid foramen is the exit of CN VII, so a lesion there causes facial weakness with entirely normal hearing.", "The carotid canal transmits the internal carotid artery and no cranial nerve.", "The foramen spinosum transmits the middle meningeal artery and no cranial nerve."], "pearl": "IAM = VII + VIII riding together; VII then leaves the skull at the stylomastoid foramen.", "set": "skull"}, {"id": "SKL-8", "stem": "The pterion is the H-shaped junction of four bones on the lateral skull. Which set is correct?", "opts": ["Frontal, parietal, occipital, temporal", "Frontal, nasal, maxilla, zygomatic", "Frontal, parietal, temporal, greater wing of the sphenoid", "Parietal, occipital, temporal, sphenoid", "Frontal, ethmoid, sphenoid, temporal"], "ans": 2, "why": "The pterion is where the parietal, frontal, temporal and greater wing of the sphenoid meet; it is the thinnest part of the skull.", "wrong": ["The occipital bone lies far posteriorly and contributes nothing to the pterion.", "These are facial bones and none of them reaches the lateral vault at the pterion.", "", "This set wrongly swaps the occipital bone in and leaves the frontal bone out.", "The ethmoid sits deep in the midline floor (cribriform plate), not on the lateral skull surface."], "pearl": "Pterion bones spell a PiN: Parietal, Frontal, Sphenoid, Temporal - thinnest skull with an artery underneath.", "set": "skull"}, {"id": "SKL-9", "stem": "A 19-year-old is struck in the temple by a baseball, is briefly dazed, converses normally for an hour, then becomes progressively obtunded. CT shows a biconvex hyperdense collection that does not cross suture lines. Which vessel was torn?", "opts": ["A bridging cerebral vein", "A berry aneurysm at the circle of Willis", "The internal carotid artery in the carotid canal", "The anterior branch of the middle meningeal artery", "The vertebral artery at the foramen magnum"], "ans": 3, "why": "A blow at the thin pterion tears the anterior branch of the middle meningeal artery, producing an epidural hematoma with a lucid interval and a lens-shaped collection limited by sutures.", "wrong": ["A torn bridging cerebral vein causes a subdural hematoma, which is crescent-shaped and does cross suture lines.", "A ruptured berry aneurysm causes subarachnoid hemorrhage with a thunderclap headache, not a biconvex collection.", "The internal carotid artery runs in the carotid canal at the skull base, not beneath the pterion.", "", "The vertebral arteries pass through the foramen magnum, far from the temple."], "pearl": "Pterion punch -> middle meningeal artery -> lucid interval -> lens-shaped bleed stopped by sutures.", "set": "skull"}, {"id": "SKL-10", "stem": "A toddler with chronic tearing undergoes probing of the nasolacrimal duct. Where does the probe emerge inside the nasal cavity?", "opts": ["Sphenoethmoidal recess", "Superior meatus", "Semilunar hiatus of the middle meatus", "Onto the ethmoid bulla", "Inferior meatus"], "ans": 4, "why": "The nasolacrimal duct is the sole structure opening into the inferior meatus, beneath the inferior concha.", "wrong": ["The sphenoethmoidal recess receives only the sphenoid sinus.", "The superior meatus receives the posterior ethmoidal cells.", "The semilunar hiatus receives the frontal sinus, anterior ethmoidal cells and maxillary sinus.", "The ethmoid bulla is the drainage site of the middle ethmoidal cells.", ""], "pearl": "Tears fall to the floor: nasolacrimal duct -> inferior meatus, the lowest opening.", "set": "skull"}, {"id": "SKL-11", "stem": "Endoscopic surgery is planned on the structures draining into the middle meatus. Which sinus does NOT drain there?", "opts": ["Anterior ethmoidal cells", "Middle ethmoidal cells", "Sphenoid sinus", "Frontal sinus", "Maxillary sinus"], "ans": 2, "why": "The sphenoid sinus drains into the sphenoethmoidal recess, above and behind the superior concha, bypassing the middle meatus entirely.", "wrong": ["The anterior ethmoidal cells also drain into the semilunar hiatus.", "The middle ethmoidal cells drain onto the ethmoid bulla, which lies within the middle meatus.", "", "The frontal sinus drains through the semilunar hiatus into the middle meatus.", "The maxillary ostium opens into the semilunar hiatus of the middle meatus."], "pearl": "Middle meatus is the busiest drain: Frontal, Anterior + Middle ethmoid, Maxillary. Sphenoid goes its own way.", "set": "skull"}, {"id": "SKL-12", "stem": "Purulent discharge is seen tracking from a narrow space above and behind the superior nasal concha. Which sinus is most likely infected?", "opts": ["Frontal sinus", "Maxillary sinus", "Anterior ethmoidal cells", "Posterior ethmoidal cells", "Sphenoid sinus"], "ans": 4, "why": "That narrow space is the sphenoethmoidal recess, which receives the ostium of the sphenoid sinus.", "wrong": ["The frontal sinus drains into the middle meatus via the semilunar hiatus.", "The maxillary sinus drains into the semilunar hiatus of the middle meatus.", "The anterior ethmoidal cells drain into the semilunar hiatus.", "The posterior ethmoidal cells open one level lower, into the superior meatus.", ""], "pearl": "Sphenoid is the loner: highest and most posterior drain - the sphenoethmoidal recess.", "set": "skull"}, {"id": "SKL-13", "stem": "Which structure opens into the superior meatus of the lateral nasal wall?", "opts": ["Posterior ethmoidal cells", "Maxillary sinus", "Frontal sinus", "Nasolacrimal duct", "Sphenoid sinus"], "ans": 0, "why": "The posterior ethmoidal cells are the only structures draining into the superior meatus.", "wrong": ["", "The maxillary sinus opens into the semilunar hiatus of the middle meatus.", "The frontal sinus drains into the middle meatus through the semilunar hiatus.", "The nasolacrimal duct opens into the inferior meatus.", "The sphenoid sinus opens into the sphenoethmoidal recess, not the superior meatus."], "pearl": "Three meatuses, three tenants: inferior = tears, middle = frontal/maxillary/anterior ethmoid, superior = posterior ethmoid.", "set": "skull"}, {"id": "SKL-14", "stem": "A rounded bulge formed by an ethmoidal air cell sits in the middle meatus just above the semilunar hiatus. Which cells drain onto this bulge?", "opts": ["Anterior ethmoidal cells", "Posterior ethmoidal cells", "Sphenoid sinus", "Middle ethmoidal cells", "Frontal sinus"], "ans": 3, "why": "That bulge is the ethmoid bulla, and the middle ethmoidal cells open onto its surface within the middle meatus.", "wrong": ["The anterior ethmoidal cells drain into the semilunar hiatus, the groove below the bulla.", "The posterior ethmoidal cells drain into the superior meatus.", "The sphenoid sinus drains into the sphenoethmoidal recess.", "", "The frontal sinus drains into the semilunar hiatus, not onto the bulla."], "pearl": "Bulla = the bubble of the MIDDLE ethmoid cells; the hiatus below it takes frontal, anterior ethmoid and maxillary.", "set": "skull"}, {"id": "SKL-15", "stem": "A 3-year-old develops ear pain and a bulging tympanic membrane several days after a head cold. Infection spread through an opening in the nasopharynx that communicates with which space?", "opts": ["Inferior meatus", "Middle ear cavity", "Maxillary sinus", "Sphenoid sinus", "Posterior ethmoidal cells"], "ans": 1, "why": "The pharyngotympanic (Eustachian) tube opens in the nasopharynx and connects it to the middle ear, which is why upper respiratory infections cause otitis media.", "wrong": ["The inferior meatus receives only the nasolacrimal duct.", "", "The maxillary sinus opens into the semilunar hiatus of the middle meatus, not the nasopharynx.", "The sphenoid sinus drains into the sphenoethmoidal recess of the nasal cavity.", "The posterior ethmoidal cells drain into the superior meatus."], "pearl": "Eustachian tube links nasopharynx to MIDDLE EAR, never a sinus; tensor veli palatini (V3) pops it open when you swallow.", "set": "skull"}, {"id": "SKL-16", "stem": "A 35-year-old has left cheek pressure that worsens when she bends forward, plus aching in her upper left molars although those teeth look normal. Which anatomic feature best explains both findings?", "opts": ["The maxillary sinus is innervated by the supraorbital branch of V1", "The maxillary sinus communicates with the nasopharynx through the pharyngotympanic tube", "The maxillary sinus drains into the sphenoethmoidal recess", "The maxillary ostium lies high on the medial wall while the sinus floor sits against the upper molar roots", "The maxillary sinus drains directly into the inferior meatus below the inferior concha"], "ans": 3, "why": "Its ostium sits high on the medial wall so the sinus drains poorly when upright, and its thin floor overlies the upper molar roots, so sinusitis mimics toothache and dental infection can seed the sinus.", "wrong": ["Maxillary sinus sensation is V2 (infraorbital and superior alveolar nerves); the supraorbital nerve of V1 supplies the frontal sinus and forehead.", "The pharyngotympanic tube connects the nasopharynx with the middle ear, never with a paranasal sinus.", "The sphenoethmoidal recess is the drainage site of the sphenoid sinus.", "", "The inferior meatus receives the nasolacrimal duct; the maxillary sinus opens into the semilunar hiatus of the middle meatus."], "pearl": "Maxillary sinus: drain at the top, molars at the bottom - poor upright drainage and toothache sinusitis.", "set": "skull"}, {"id": "SKL-17", "stem": "After a fracture through the mandibular ramus, a patient has numbness of the lower lip and chin on that side. Cheek sensation and chewing strength are normal. Which nerve was injured?", "opts": ["Inferior alveolar nerve at the mandibular foramen", "Supraorbital nerve at the supraorbital foramen", "Zygomatic nerve in the inferior orbital fissure", "Maxillary nerve in the foramen rotundum", "Infraorbital nerve at the infraorbital foramen"], "ans": 0, "why": "The inferior alveolar nerve enters the mandibular foramen on the inner surface of the ramus and emerges as the mental nerve at the mental foramen, supplying the lower lip and chin; motor branches to the masticatory muscles leave V3 more proximally.", "wrong": ["", "The supraorbital nerve (V1) exits the supraorbital foramen to supply the forehead and scalp.", "The zygomatic nerve traverses the inferior orbital fissure together with the infraorbital nerve and inferior ophthalmic vein.", "A foramen rotundum lesion would numb the whole cheek and upper teeth, not the chin.", "The infraorbital nerve (V2) exits the infraorbital foramen and supplies the cheek, side of the nose and upper lip."], "pearl": "Vertical line down the face: supraorbital (V1) -> infraorbital (V2) -> mental (V3). Inferior alveolar goes IN the mandibular foramen, OUT the mental.", "set": "skull"}, {"id": "SKL-18", "stem": "A patient with fibrous dysplasia narrowing a bony canal in the sphenoid develops progressive monocular vision loss with completely normal eye movements. Which pair of structures traverses the affected canal?", "opts": ["CN VII and CN VIII", "The zygomatic nerve and the inferior ophthalmic vein", "CN III and the superior ophthalmic vein", "CN V1 and CN VI", "CN II and the ophthalmic artery"], "ans": 4, "why": "The optic canal transmits CN II with the ophthalmic artery, so narrowing it causes isolated vision loss without any ocular motor deficit.", "wrong": ["CN VII and VIII travel in the internal acoustic meatus, nowhere near the orbit.", "The zygomatic nerve and inferior ophthalmic vein pass through the inferior orbital fissure.", "CN III and the superior ophthalmic vein pass through the superior orbital fissure.", "V1 and CN VI also pass through the superior orbital fissure, so a lesion would impair eye movement.", ""], "pearl": "Optic canal = CN II + ophthalmic artery only; the eye MOVEMENT nerves use the superior orbital fissure.", "set": "skull"}, {"id": "SKL-19", "stem": "A 55-year-old has numbness of the chin and lower lip, reduced general sensation on the anterior tongue, and wasting of the masseter on the same side. A tumor is invading which opening?", "opts": ["Foramen magnum", "Stylomastoid foramen", "Foramen ovale", "Jugular foramen", "Foramen rotundum"], "ans": 2, "why": "V3 leaves the skull through the foramen ovale carrying both sensation to the chin, lower lip and anterior tongue and motor supply to the muscles of mastication.", "wrong": ["The foramen magnum transmits the medulla and spinal cord, the vertebral arteries and the spinal roots of CN XI.", "The stylomastoid foramen transmits CN VII, causing facial expression weakness without any numbness.", "", "The jugular foramen transmits CN IX, X and XI with the internal jugular vein.", "The foramen rotundum transmits V2, giving cheek and upper lip numbness with normal chewing."], "pearl": "Ovale = V3 = the only trigeminal division with motor fibers, so chewing weakness plus a numb chin localizes here.", "set": "skull"}];
const SETS={"v3": "Trigeminal Nerve & Mastication", "vii": "Facial Nerve & Parotid", "auto": "Autonomics & the Four Ganglia", "orbit": "Orbit & Eye Movement", "pharynx": "Pharynx, Larynx, IX & X", "neck": "Neck Vessels, XI, XII & Tongue", "skull": "Skull Base, Pterion & Sinus Drainage"};
