<title>Boss Battles Practice Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=Silkscreen&display=swap">
<style>
/* Deliberately single-theme: a night-arena world. Every color is painted explicitly. */
:root{
  --ground:#17142B; --ground2:#120F22; --panel:#221D3F; --sunk:#1B1734; --line:#3A3366;
  --ink:#EEEAFB; --muted:#A39CC8;
  --p1:#FFB341; --p2:#3DD6C6; --boss:#FF4F8B; --heal:#6BD88E; --bad:#FF6B5B;
  --hy-bg:#3A3212; --hy-line:#D9AE2B; --hy-ink:#F7E6A6;
  --display:"Chakra Petch","Arial Narrow",sans-serif;
  --pix:"Silkscreen","Courier New",monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font:15px/1.55 var(--body);padding-inline:16px;padding-block:16px 40px;
  background-image:radial-gradient(ellipse 80% 50% at 50% 0%, #2A2352 0%, transparent 70%);background-attachment:fixed}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.pix{font-family:var(--pix);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.brand b{color:var(--boss)}

/* ---------- setup ---------- */
.setup{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:start}
.hero{display:flex;flex-direction:column;gap:14px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,6.4vw,74px);line-height:.92;margin:0;text-transform:uppercase;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--boss)}
.hero p{margin:0;color:var(--muted);max-width:54ch}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.foe{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:8px;display:flex;gap:8px;align-items:center}
.foe svg{width:44px;height:44px;flex:none}
.foe b{display:block;font-family:var(--display);font-size:13.5px;line-height:1.15}
.foe span{font-family:var(--pix);font-size:9.5px;color:var(--muted);text-transform:uppercase}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:6px;max-width:58ch}
.rules li{display:grid;grid-template-columns:92px 1fr;gap:10px;border-top:1px dashed var(--line);padding-top:6px;font-size:14px}
.rules b{font-family:var(--pix);font-size:11px;color:var(--p1);font-weight:400;padding-top:3px}
.form{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:16px}
.fl{display:flex;flex-direction:column;gap:6px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names input{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:9px 10px;border-left:5px solid var(--p1)}
.names input#p2name{border-left-color:var(--p2)}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;min-width:72px;background:var(--sunk);border:0;border-right:1px solid var(--line);padding:9px 8px;font-size:14px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:600}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.picker button{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:7px 9px;text-align:left;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.picker button[aria-pressed="true"]{border-color:var(--boss);box-shadow:inset 3px 0 0 var(--boss)}
.picker em{font-style:normal;font-family:var(--pix);font-size:10px;color:var(--muted)}
.go{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase;background:var(--boss);color:#1a0610;border:0;border-radius:4px;padding:11px 16px}

/* ---------- arena ---------- */
.arena{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:12px;align-items:stretch}
.hero-card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;transition:box-shadow .2s,opacity .3s}
.hero-card.p1{--c:var(--p1)} .hero-card.p2{--c:var(--p2)}
.hero-card.on{box-shadow:0 0 0 2px var(--c),0 0 24px -4px var(--c)}
.hero-card.ko{opacity:.45}
.hero-card .nm{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1;color:var(--c)}
.hero-card .role{font-family:var(--pix);font-size:10px;color:var(--muted);text-transform:uppercase}
.bar{height:14px;background:var(--ground2);border:1px solid var(--line);border-radius:3px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.bar.hp i{background:var(--heal)} .bar.hp.low i{background:var(--bad)}
.bar.boss{height:18px} .bar.boss i{background:linear-gradient(90deg,#B8265A,var(--boss))}
.hpnum{font-family:var(--pix);font-size:11px;display:flex;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.abil{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.abil button{flex:1;min-width:90px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:6px 6px;font-size:12.5px;line-height:1.2}
.abil button small{display:block;font-family:var(--pix);font-size:9px;color:var(--muted)}
.abil button:disabled{opacity:.35;cursor:not-allowed}
.abil button:not(:disabled):hover{border-color:var(--c)}
.ko-tag{position:absolute;top:10px;right:10px;font-family:var(--pix);font-size:12px;color:var(--bad)}
.boss-card{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center}
.boss-card .bn{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;line-height:1;letter-spacing:.03em}
.boss-card .bt{font-size:12.5px;color:var(--muted)}
.beast{height:150px;display:grid;place-items:center}
.beast svg{display:block;height:150px;width:auto;max-width:100%;overflow:visible}
.beast.hit svg{animation:hit .45s}
.beast.atk svg{animation:atk .5s}
.beast.dead svg{animation:dead .9s forwards}
@keyframes hit{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px);filter:brightness(2.2)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
@keyframes atk{0%,100%{transform:scale(1)}40%{transform:scale(1.14) translateY(8px)}}
@keyframes dead{to{transform:translateY(20px) scale(.6);opacity:.1;filter:grayscale(1)}}
.rage{font-family:var(--pix);font-size:10.5px;color:var(--boss)}
.dmg{position:absolute;font-family:var(--display);font-weight:700;font-size:30px;pointer-events:none;animation:float 1s forwards;text-shadow:0 2px 0 #000}
@keyframes float{from{transform:translateY(0);opacity:1}to{transform:translateY(-44px);opacity:0}}
.timer{height:6px;background:var(--ground2);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--muted);transform-origin:left;transition:transform .25s linear}
.timer.warn i{background:var(--bad)}
.log{font-family:var(--pix);font-size:11px;color:var(--muted);min-height:16px;text-transform:uppercase;letter-spacing:.04em}
.log b{color:var(--ink);font-weight:400}

.qpanel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--pix);font-size:10.5px;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid var(--line)}
.chip.p1{background:var(--p1);color:#231500;border-color:var(--p1)}
.chip.p2{background:var(--p2);color:#032421;border-color:var(--p2)}
.chip.dash{border-style:dashed}
.stem{margin:0;font-size:16px;line-height:1.62;max-width:76ch}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:8px 12px}
.opt .lt{font-family:var(--display);font-weight:700;font-size:17px;width:28px;height:28px;border:1.5px solid var(--line);border-radius:3px;display:grid;place-items:center;transform:rotate(45deg)}
.opt .lt span{transform:rotate(-45deg)}
.opt:not(:disabled):hover{border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.out{opacity:.3;text-decoration:line-through}
.opt.right{border-color:var(--heal);background:#193326}
.opt.right .lt{background:var(--heal);border-color:var(--heal);color:#07210F}
.opt.wrong{border-color:var(--bad);background:#3A1A22}
.opt.wrong .lt{background:var(--bad);border-color:var(--bad);color:#2a0606}
.verdict{border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--sunk)}
.verdict h3{margin:0;font-family:var(--display);font-size:22px;text-transform:uppercase}
.verdict.good h3{color:var(--heal)} .verdict.bad h3{color:var(--bad)}
.verdict p{margin:0;max-width:76ch}
.why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--muted)}
.why b{color:var(--ink);font-family:var(--pix);font-weight:400;margin-right:6px}
.hy{background:var(--hy-bg);border:1.5px solid var(--hy-line);color:var(--hy-ink);border-radius:4px;padding:9px 12px;font-size:14px}
.hy b{display:block;font-family:var(--pix);font-size:10px;font-weight:400;letter-spacing:.1em;text-transform:uppercase}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--ground);border:0;border-radius:4px;padding:10px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
kbd{font-family:var(--pix);font-size:10px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--muted)}

/* ---------- interlude / end ---------- */
.interlude{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px;display:grid;grid-template-columns:180px 1fr;gap:22px;align-items:center}
.interlude svg{width:100%;height:auto}
.interlude h2,.end h2{font-family:var(--display);font-weight:700;font-size:clamp(32px,5vw,54px);line-height:.95;margin:0 0 8px;text-transform:uppercase;text-wrap:balance}
.interlude p{margin:0 0 12px;color:var(--muted);max-width:60ch}
.path{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.path span{font-family:var(--pix);font-size:10px;padding:3px 7px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
.path span.done{color:var(--heal);border-color:var(--heal)}
.path span.now{color:var(--boss);border-color:var(--boss)}
.end{display:flex;flex-direction:column;gap:18px}
.end h2.win{color:var(--heal)} .end h2.lose{color:var(--bad)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.p1{--c:var(--p1)} .card.p2{--c:var(--p2)}
.big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;color:var(--c)}
.missed{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.missed li{font-size:13.5px;border-left:3px solid var(--line);padding-left:9px}
.missed li span{display:block;font-family:var(--pix);font-size:9.5px;color:var(--muted);text-transform:uppercase}
.foot{font-family:var(--pix);font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;text-transform:uppercase}
@media (max-width:860px){
  .setup,.cards,.interlude{grid-template-columns:1fr}
  .interlude svg{max-width:160px}
  .arena{grid-template-columns:1fr 1fr}
  .boss-card{grid-column:1 / -1;order:-1}
  .beast{height:110px}.beast svg{height:110px}
  .names,.picker{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const Q=[{"id": "V3-1", "stem": "A 24-year-old man is struck in the jaw and sustains a mandibular fracture at the level of the mandibular foramen on the right. He reports numbness of the skin of the right chin and lower lip and of the lower teeth on that side. Injury to which nerve best explains these findings?", "opts": ["Buccal nerve", "Great auricular nerve", "Infraorbital nerve", "Inferior alveolar nerve", "Nerve to mylohyoid"], "ans": 3, "why": "The inferior alveolar nerve enters the mandibular foramen, supplies the lower teeth, and emerges from the mental foramen as the mental nerve to the skin of the chin and lower lip.", "wrong": ["The buccal nerve of V3 is sensory to the skin and mucosa of the cheek, not to the chin, lower lip, or teeth.", "The great auricular nerve (C2-C3) supplies skin over the angle of the mandible and the parotid region.", "The infraorbital nerve is a V2 branch supplying the mid-face and upper lip through the infraorbital foramen.", "", "The nerve to mylohyoid is a motor branch of V3 to mylohyoid and the anterior belly of digastric."], "pearl": "Mandibular foramen in, mental foramen out: inferior alveolar -> lower teeth -> mental n. -> chin and lower lip.", "set": "v3"}, {"id": "V3-2", "stem": "Which opening transmits the division of the trigeminal nerve that carries motor fibers to the muscles of mastication?", "opts": ["Foramen ovale", "Foramen rotundum", "Superior orbital fissure", "Foramen spinosum", "Inferior orbital fissure"], "ans": 0, "why": "V3, the mandibular division, exits the skull through foramen ovale and is the only trigeminal division carrying motor fibers.", "wrong": ["", "Foramen rotundum transmits V2, which is general sensory only.", "The superior orbital fissure transmits V1, which is general sensory only.", "Foramen spinosum transmits the middle meningeal artery, not a division of the trigeminal nerve.", "The inferior orbital fissure transmits V2 branches (zygomatic and infraorbital) toward the orbit and face."], "pearl": "Standing Room Only: V1 = Superior orbital fissure, V2 = Rotundum, V3 = Ovale - and only V3 has motor.", "set": "v3"}, {"id": "V3-3", "stem": "A woman undergoing resection of a temporal scalp lesion has a nerve sacrificed that runs with the superficial temporal vessels. Afterward she has numb skin over the temple and auricle plus decreased parotid secretion on that side. Which nerve was cut?", "opts": ["Lingual nerve", "Auriculotemporal nerve", "Buccal nerve", "Lacrimal nerve", "Mental nerve"], "ans": 1, "why": "The auriculotemporal nerve (V3) is sensory to skin of the temple and auricle and carries postganglionic parasympathetic fibers from the otic ganglion to the parotid gland.", "wrong": ["The lingual nerve of V3 carries general sensation from the anterior two-thirds of the tongue.", "", "The buccal nerve of V3 is purely sensory to cheek skin and oral mucosa.", "The lacrimal nerve is a V1 branch, sensory to the lacrimal gland and the conduit for postganglionic parasympathetics entering that gland.", "The mental nerve is the terminal cutaneous branch of the inferior alveolar nerve, supplying the chin and lower lip."], "pearl": "Auriculotemporal = temple and auricle sensation PLUS otic ganglion parasympathetics to the parotid.", "set": "v3"}, {"id": "V3-4", "stem": "A patient bites the floor of her mouth and afterward has lost touch and temperature sensation over the anterior two-thirds of the tongue on the left, with normal sensation posteriorly. Which nerve is injured?", "opts": ["Glossopharyngeal nerve", "Hypoglossal nerve", "Buccal nerve", "Inferior alveolar nerve", "Lingual nerve"], "ans": 4, "why": "The lingual nerve, a branch of V3, carries general sensation from the anterior two-thirds of the tongue.", "wrong": ["CN IX carries general sensation from the posterior one-third of the tongue, which is intact here.", "CN XII is motor to the tongue muscles (all except palatoglossus, which is CN X) and carries no general sensation.", "The buccal nerve of V3 supplies cheek skin and oral mucosa, not the tongue.", "The inferior alveolar nerve supplies the lower teeth and, as the mental nerve, the chin and lower lip.", ""], "pearl": "Tongue general sensation: anterior 2/3 = lingual n. (V3), posterior 1/3 = CN IX.", "set": "v3"}, {"id": "V3-5", "stem": "After a penetrating cheek injury, a patient cannot compress the cheek against the teeth and food pools in the buccal vestibule, yet sensation of the cheek skin and oral mucosa is completely normal. Which nerve is injured?", "opts": ["Buccal nerve of V3", "Auriculotemporal nerve", "Buccal branch of the facial nerve", "Infraorbital nerve of V2", "Nerve to medial pterygoid"], "ans": 2, "why": "Buccinator is a muscle of facial expression, so its motor supply is the buccal branch of the facial nerve; sensation is spared because the V3 buccal nerve is intact.", "wrong": ["The buccal nerve of V3 is sensory only, to cheek skin and oral mucosa - it would cause numbness, not weakness.", "The auriculotemporal nerve supplies skin of the temple and auricle and parasympathetics to the parotid.", "", "The infraorbital nerve is a V2 sensory branch to the mid-face and upper lip.", "The nerve to medial pterygoid is a V3 motor branch to a muscle of mastication, not to buccinator."], "pearl": "Buccal BRANCH of VII = motor to buccinator; buccal NERVE of V3 = sensory cheek. Same name, opposite job.", "set": "v3"}, {"id": "V3-6", "stem": "The nerve to mylohyoid, a motor branch of the mandibular division of the trigeminal nerve, also supplies which of the following muscles?", "opts": ["Posterior belly of digastric", "Anterior belly of digastric", "Stylohyoid", "Geniohyoid", "Buccinator"], "ans": 1, "why": "The nerve to mylohyoid supplies both mylohyoid and the anterior belly of digastric, making them V3 muscles.", "wrong": ["The posterior belly of digastric is supplied by the facial nerve.", "", "Stylohyoid is supplied by the facial nerve, alongside the posterior belly of digastric.", "Geniohyoid is supplied by C1 fibers that travel with the hypoglossal nerve.", "Buccinator is a muscle of facial expression supplied by the facial nerve."], "pearl": "Nerve to mylohyoid = mylohyoid + ANTERIOR belly of digastric (V3). The posterior belly belongs to VII.", "set": "v3"}, {"id": "V3-7", "stem": "In addition to the four muscles of mastication, the mandibular division of the trigeminal nerve provides motor innervation to which of the following muscles?", "opts": ["Stapedius", "Stylopharyngeus", "Levator veli palatini", "Tensor veli palatini", "Posterior belly of digastric"], "ans": 3, "why": "V3 motor targets include the two tensors - tensor tympani and tensor veli palatini - in addition to the muscles of mastication, mylohyoid, and the anterior belly of digastric.", "wrong": ["Stapedius is supplied by the facial nerve.", "Stylopharyngeus is the only muscle supplied by the glossopharyngeal nerve.", "Levator veli palatini is supplied by the vagus via the pharyngeal plexus.", "", "The posterior belly of digastric is supplied by the facial nerve; only the anterior belly is V3."], "pearl": "V3 motor list: temporalis, masseter, medial and lateral pterygoid + tensor tympani, tensor veli palatini + mylohyoid, anterior digastric.", "set": "v3"}, {"id": "V3-8", "stem": "Which opening transmits the division of the trigeminal nerve that supplies general sensation to the forehead and upper eyelid?", "opts": ["Superior orbital fissure", "Inferior orbital fissure", "Foramen rotundum", "Foramen ovale", "Foramen spinosum"], "ans": 0, "why": "V1 (ophthalmic division) leaves the cranial cavity through the superior orbital fissure and reaches the forehead and upper eyelid via the frontal nerve and its supraorbital and supratrochlear branches.", "wrong": ["", "The inferior orbital fissure transmits V2 branches (zygomatic and infraorbital) into the orbit.", "Foramen rotundum transmits V2, which supplies the mid-face and upper lip.", "Foramen ovale transmits V3, the only division with motor fibers.", "Foramen spinosum transmits the middle meningeal artery, not a trigeminal division."], "pearl": "V1 = superior orbital fissure -> frontal nerve -> supraorbital and supratrochlear nerves for the forehead.", "set": "v3"}, {"id": "V3-9", "stem": "A dentist injects local anesthetic at a bony opening on the anterior maxilla. The patient then has numb skin of the cheek below the eye, the side of the nose, and the upper lip. Which nerve was blocked?", "opts": ["Supraorbital nerve", "Mental nerve", "Infraorbital nerve", "Zygomaticotemporal nerve", "Buccal nerve"], "ans": 2, "why": "The infraorbital nerve, the continuation of V2, exits the infraorbital foramen to supply the lower eyelid, side of the nose, and upper lip.", "wrong": ["The supraorbital nerve is a V1 branch exiting the supraorbital foramen to supply the forehead and upper eyelid.", "The mental nerve is a V3 branch exiting the mental foramen to supply the chin and lower lip.", "", "The zygomaticotemporal nerve is a V2 branch supplying skin over the temple region.", "The buccal nerve is a V3 branch supplying cheek skin and oral mucosa, not the upper lip."], "pearl": "Three sensory foramina stack vertically: supraorbital (V1) -> infraorbital (V2) -> mental (V3).", "set": "v3"}, {"id": "V3-10", "stem": "A patient reports numbness of the skin overlying the angle of the mandible and the parotid gland, while sensation of the lower lip, chin, and cheek is normal. Which nerve is most likely affected?", "opts": ["Mandibular division of the trigeminal nerve", "Auriculotemporal nerve", "Mental nerve", "Buccal nerve", "Great auricular nerve"], "ans": 4, "why": "Skin over the angle of the jaw and parotid is supplied by the great auricular nerve (C2-C3) from the cervical plexus, a gap in the trigeminal facial map.", "wrong": ["V3 supplies the lower face, lower lip, and chin, but not the skin over the angle of the jaw.", "The auriculotemporal nerve (V3) supplies skin of the temple and part of the auricle.", "The mental nerve supplies the chin and lower lip, which are intact in this patient.", "The buccal nerve (V3) supplies cheek skin and oral mucosa, also intact here.", ""], "pearl": "The trigeminal face map has a hole: skin over the angle of the jaw and parotid = great auricular n. (C2-C3).", "set": "v3"}, {"id": "V3-11", "stem": "Which muscle of mastication both elevates and retracts the mandible?", "opts": ["Masseter", "Temporalis", "Medial pterygoid", "Lateral pterygoid", "Buccinator"], "ans": 1, "why": "Temporalis elevates the mandible, and its posterior fibers retract it - it is the only muscle of mastication that retracts.", "wrong": ["Masseter elevates the mandible and contributes some protrusion, but does not retract it.", "", "Medial pterygoid elevates, protrudes, and produces side-to-side grinding movements.", "Lateral pterygoid protrudes the mandible, moves it side to side, and initiates depression.", "Buccinator is a muscle of facial expression supplied by the facial nerve; it compresses the cheek and is not a muscle of mastication."], "pearl": "Only temporalis RETRACTS the mandible. Elevate + retract = temporalis.", "set": "v3"}, {"id": "V3-12", "stem": "A patient with weakness of a single muscle of mastication has trouble initiating jaw opening and cannot protrude the mandible normally. Which muscle is weak?", "opts": ["Temporalis", "Masseter", "Medial pterygoid", "Lateral pterygoid", "Mylohyoid"], "ans": 3, "why": "The lateral pterygoid protrudes the mandible, moves it side to side, and initiates depression (gravity completes most of the opening).", "wrong": ["Temporalis elevates and retracts the mandible; it is an antagonist of opening.", "Masseter elevates the mandible with some protrusion, and does not initiate opening.", "Medial pterygoid elevates, protrudes, and grinds side to side, but does not initiate opening.", "", "Mylohyoid, supplied by the V3 nerve to mylohyoid, elevates the floor of the mouth rather than initiating jaw depression."], "pearl": "Lateral pterygoid = the protruder and the initiator of opening; gravity does most of the actual jaw drop.", "set": "v3"}, {"id": "V3-13", "stem": "Which structure passes through the foramen spinosum?", "opts": ["Middle meningeal artery", "Mandibular division of the trigeminal nerve", "Maxillary division of the trigeminal nerve", "Auriculotemporal nerve", "Lesser palatine nerve"], "ans": 0, "why": "Foramen spinosum transmits the middle meningeal artery; no division of the trigeminal nerve uses it.", "wrong": ["", "V3 exits through foramen ovale, which lies just anteromedial to foramen spinosum.", "V2 exits through foramen rotundum.", "The auriculotemporal nerve is a branch of V3 that arises after V3 has already passed through foramen ovale.", "The lesser palatine nerve is a V2 branch reaching the soft palate through the lesser palatine foramen."], "pearl": "Spinosum = middle meningeal artery. Ovale (V3) is the neighboring hole - do not swap them.", "set": "v3"}, {"id": "V3-14", "stem": "A patient has a well-demarcated loss of sensation limited to the skin of the tip of the nose. The nerve responsible is a branch of which of the following?", "opts": ["Infraorbital nerve", "Zygomaticofacial nerve", "Nasociliary nerve", "Nasopalatine nerve", "Buccal nerve"], "ans": 2, "why": "Skin of the nose tip is supplied by the external nasal nerve, a branch of the nasociliary nerve of V1.", "wrong": ["The infraorbital nerve (V2) supplies the lower eyelid, side of the nose, and upper lip, but not the tip.", "The zygomaticofacial nerve is a V2 branch to skin over the cheekbone.", "", "The nasopalatine nerve is a V2 branch to nasal septal mucosa and the anterior hard palate, not to skin.", "The buccal nerve is a V3 sensory branch to cheek skin and oral mucosa."], "pearl": "Nose TIP is V1: nasociliary -> external nasal nerve. The side of the nose is V2 (infraorbital).", "set": "v3"}, {"id": "V3-15", "stem": "A patient has lost general sensation from the posterior one-third of the tongue and no longer gags when that area is touched; sensation over the anterior tongue is preserved. Which nerve is injured?", "opts": ["Lingual nerve", "Hypoglossal nerve", "Vagus nerve", "Inferior alveolar nerve", "Glossopharyngeal nerve"], "ans": 4, "why": "General sensation from the posterior one-third of the tongue is carried by CN IX, which is also the sensory limb of the gag reflex.", "wrong": ["The lingual nerve (V3) carries general sensation from the anterior two-thirds of the tongue, which is spared here.", "CN XII is motor to the tongue muscles and carries no general sensation.", "CN X supplies palatoglossus and the pharynx and larynx and is the motor limb of the gag reflex, not the sensory supply of the posterior tongue.", "The inferior alveolar nerve (V3) supplies the lower teeth and, via the mental nerve, the chin and lower lip.", ""], "pearl": "Tongue general sensation splits at the sulcus terminalis: anterior 2/3 = lingual (V3), posterior 1/3 = CN IX.", "set": "v3"}, {"id": "V3-16", "stem": "Postganglionic parasympathetic fibers from the pterygopalatine ganglion reach the lacrimal gland by traveling with which sequence of nerves?", "opts": ["Auriculotemporal nerve, then parotid branches", "Zygomatic nerve of V2, then lacrimal nerve of V1", "Nasopalatine nerve, then greater palatine nerve", "Infraorbital nerve, then superior alveolar nerves", "Frontal nerve, then supraorbital nerve"], "ans": 1, "why": "Pterygopalatine postganglionic fibers hitchhike on the zygomatic nerve of V2 and are handed to the lacrimal nerve of V1, which delivers them into the lacrimal gland.", "wrong": ["That pathway carries otic ganglion fibers to the parotid gland, not pterygopalatine fibers to the lacrimal gland.", "", "The nasopalatine and greater palatine nerves carry pterygopalatine fibers to nasal and palatal mucosa, not to the lacrimal gland.", "The infraorbital and superior alveolar nerves are V2 sensory branches to the mid-face skin and upper teeth.", "The frontal nerve gives off the supraorbital nerve for forehead sensation and is not a secretomotor route."], "pearl": "Tear relay: pterygopalatine ganglion -> zygomatic n. (V2) -> lacrimal n. (V1) -> lacrimal gland.", "set": "v3"}, {"id": "V3-17", "stem": "Sensation from the ethmoid sinuses is carried by the ethmoidal nerves, which arise from which of the following?", "opts": ["Greater palatine nerve", "Infraorbital nerve", "Lingual nerve", "Nasociliary nerve", "Auriculotemporal nerve"], "ans": 3, "why": "The nasociliary nerve, a branch of V1, gives off the ethmoidal nerves that supply the ethmoid sinuses.", "wrong": ["The greater palatine nerve is a V2 branch supplying the hard palate mucosa.", "The infraorbital nerve is a V2 branch supplying mid-face skin and, through superior alveolar branches, the upper teeth.", "The lingual nerve is a V3 branch carrying general sensation from the anterior two-thirds of the tongue.", "", "The auriculotemporal nerve is a V3 branch supplying temple and auricle skin plus parotid parasympathetics."], "pearl": "Nasociliary (V1) -> ethmoidal nerves -> ethmoid sinuses, and -> external nasal nerve -> nose tip.", "set": "v3"}, {"id": "VII-1", "stem": "A 58-year-old man undergoes resection of a mass lying within the substance of the right parotid gland. Postoperatively he cannot close the right eye, and the cornea dries out.", "opts": ["Medial rectus", "Levator palpebrae superioris", "Superior tarsal muscle", "Orbicularis oculi", "Temporalis"], "ans": 3, "why": "The facial nerve passes through the parotid gland, so a parotid mass or parotid surgery injures CN VII and paralyzes the muscles of facial expression; orbicularis oculi is the muscle that closes the eye.", "wrong": ["Medial rectus adducts the eye and is supplied by CN III.", "Levator palpebrae superioris opens/elevates the upper eyelid and is supplied by CN III.", "The superior tarsal muscle assists lid elevation and is driven by sympathetic fibers.", "", "Temporalis elevates the mandible and is supplied by V3."], "pearl": "VII closes the eye, III opens it -> parotid surgery leaves the lid unable to shut.", "set": "vii"}, {"id": "VII-2", "stem": "The facial nerve runs through the parotid gland but does not provide its secretomotor supply. Which nerve carries the preganglionic parasympathetic fibers destined for the parotid gland?", "opts": ["Chorda tympani", "Greater petrosal nerve", "Lesser petrosal nerve", "Auriculotemporal nerve", "Lingual nerve"], "ans": 2, "why": "Parotid secretion is CN IX: the lesser petrosal nerve carries preganglionics to the otic ganglion, and postganglionics hitchhike on the auriculotemporal nerve (V3).", "wrong": ["Chorda tympani is a CN VII branch carrying taste from the anterior 2/3 of the tongue plus preganglionics to the submandibular ganglion.", "The greater petrosal nerve is CN VII parasympathetic to the pterygopalatine ganglion for the lacrimal and nasal/palatal glands.", "", "The auriculotemporal nerve (V3) carries the POSTganglionic fibers away from the otic ganglion, not the preganglionic ones.", "The lingual nerve (V3) carries postganglionic fibers from the submandibular ganglion to the submandibular and sublingual glands."], "pearl": "Parotid = IX: lesser petrosal -> otic ganglion -> auriculotemporal. VII only drives through.", "set": "vii"}, {"id": "VII-3", "stem": "After traversing the facial canal, the facial nerve leaves the skull and enters the parotid gland. Through which opening does it exit?", "opts": ["Foramen ovale", "Stylomastoid foramen", "Jugular foramen", "Internal acoustic meatus", "Hypoglossal canal"], "ans": 1, "why": "CN VII enters the internal acoustic meatus, runs in the facial canal, and exits the stylomastoid foramen before entering the parotid gland and dividing into its five branches.", "wrong": ["The foramen ovale transmits V3.", "", "The jugular foramen transmits CN IX, X, and XI.", "The internal acoustic meatus is where CN VII ENTERS the temporal bone, not where it exits.", "The hypoglossal canal transmits CN XII."], "pearl": "IAM -> facial canal -> stylomastoid foramen -> parotid -> five branches.", "set": "vii"}, {"id": "VII-4", "stem": "A woman has weakness of all right facial muscles, loss of taste on the anterior right tongue, and marked intolerance to loud sounds. The sound intolerance is due to denervation of which muscle?", "opts": ["Tensor tympani", "Stylohyoid", "Posterior belly of digastric", "Tensor veli palatini", "Stapedius"], "ans": 4, "why": "Stapedius is supplied by CN VII; losing it removes damping of the ossicles and produces hyperacusis, which localizes the lesion proximal to the stylomastoid foramen.", "wrong": ["Tensor tympani also dampens sound but is supplied by V3.", "Stylohyoid is indeed a CN VII muscle, but it elevates the hyoid and has no auditory role.", "The posterior belly of digastric is a CN VII muscle that moves the hyoid and mandible, not the ossicles.", "Tensor veli palatini is the one palatal muscle supplied by V3 and tenses the soft palate.", ""], "pearl": "Hyperacusis = stapedius (VII). Tensor tympani is the V3 sound damper.", "set": "vii"}, {"id": "VII-5", "stem": "A patient with a proximal facial nerve lesion at the geniculate region has reduced tear production on that side. Interruption of which pathway explains the dry eye?", "opts": ["Greater petrosal nerve to the pterygopalatine ganglion", "Chorda tympani to the submandibular ganglion", "Lesser petrosal nerve to the otic ganglion", "Auriculotemporal nerve to the parotid gland", "Lingual nerve to the sublingual gland"], "ans": 0, "why": "CN VII parasympathetics for the lacrimal gland leave at the geniculate region as the greater petrosal nerve and synapse in the pterygopalatine ganglion, which also serves the nasal and palatal glands.", "wrong": ["", "Chorda tympani to the submandibular ganglion supplies the submandibular and sublingual glands, so its loss causes dry mouth, not dry eye.", "The lesser petrosal nerve to the otic ganglion is a CN IX pathway serving the parotid gland.", "The auriculotemporal nerve (V3) carries postganglionic parotid fibers from the otic ganglion.", "The lingual nerve (V3) carries postganglionic submandibular ganglion fibers to the submandibular and sublingual glands."], "pearl": "Greater petrosal = tears (and nose/palate); chorda tympani = spit and taste.", "set": "vii"}, {"id": "VII-6", "stem": "Postganglionic parasympathetic fibers leaving the submandibular ganglion travel with the lingual nerve. Which glands do they supply?", "opts": ["Parotid gland only", "Lacrimal gland only", "Parotid and submandibular glands", "Submandibular and sublingual glands", "Nasal and palatal glands"], "ans": 3, "why": "Chorda tympani (CN VII) preganglionics synapse in the submandibular ganglion, and the postganglionics run with the lingual nerve of V3 to the submandibular AND sublingual glands.", "wrong": ["Parotid secretion is CN IX via the lesser petrosal nerve and the otic ganglion.", "The lacrimal gland is supplied via the greater petrosal nerve and the pterygopalatine ganglion.", "The parotid is not in this pathway at all; it is served by the otic ganglion.", "", "Nasal and palatal glands are served by the pterygopalatine ganglion via the greater petrosal nerve."], "pearl": "Chorda tympani -> submandibular ganglion -> submandibular + sublingual, riding the lingual nerve.", "set": "vii"}, {"id": "VII-7", "stem": "A man notices loss of taste over the anterior two-thirds of his tongue after a middle ear operation, but light touch on the same area is normal. Which nerve was injured?", "opts": ["Lingual nerve of V3", "Chorda tympani", "Greater petrosal nerve", "Lesser petrosal nerve", "Glossopharyngeal nerve"], "ans": 1, "why": "Taste from the anterior two-thirds of the tongue is special sensory in the chorda tympani, a branch of CN VII that crosses the middle ear.", "wrong": ["The lingual nerve of V3 carries general sensation (touch) from the anterior tongue, which is intact here.", "", "The greater petrosal nerve carries CN VII parasympathetics to the pterygopalatine ganglion for the lacrimal and nasal/palatal glands.", "The lesser petrosal nerve carries CN IX parasympathetics to the otic ganglion for the parotid gland.", "The glossopharyngeal nerve handles the posterior tongue and supplies stylopharyngeus."], "pearl": "Chorda tympani = taste on the front 2/3; lingual (V3) = touch on the same 2/3.", "set": "vii"}, {"id": "VII-8", "stem": "A 40-year-old has complete unilateral paralysis of the muscles of facial expression caused by a lesion of the facial nerve at the stylomastoid foramen. Which function is preserved?", "opts": ["Closing the eye", "Elevating the corner of the mouth", "Tensing the skin of the neck", "Wrinkling the forehead", "Taste on the anterior two-thirds of the tongue"], "ans": 4, "why": "A lesion at the stylomastoid foramen or within the parotid is distal to the chorda tympani, greater petrosal nerve, and nerve to stapedius, so the deficit is motor only and taste is spared.", "wrong": ["Eye closure uses orbicularis oculi, a muscle of facial expression, so it is lost.", "Elevating the mouth corner uses facial muscles supplied by branches distal to the foramen, so it is lost.", "Platysma is supplied by the cervical branch distal to the foramen, so it is lost.", "Occipitofrontalis is supplied by the temporal branch distal to the foramen, so it is lost.", ""], "pearl": "Distal lesion = motor only. Add taste, dry mouth, dry eye, or hyperacusis and the lesion is proximal.", "set": "vii"}, {"id": "VII-9", "stem": "A patient cannot hold air in the cheeks and food pockets between the cheek and teeth, yet sensation over the cheek skin and oral mucosa is normal.", "opts": ["Buccal branch of the facial nerve", "Buccal nerve of V3", "Lingual nerve of V3", "Marginal mandibular branch of the facial nerve", "Auriculotemporal nerve"], "ans": 0, "why": "Buccinator, which keeps the cheek against the teeth, is motor from the buccal branch of CN VII; intact cheek sensation shows V3 is untouched.", "wrong": ["", "The buccal nerve of V3 is general sensory to cheek skin and oral mucosa, and that sensation is intact in this patient.", "The lingual nerve of V3 carries general sensation from the anterior tongue.", "The marginal mandibular branch of CN VII supplies muscles of the lower lip and chin, not buccinator.", "The auriculotemporal nerve (V3) is sensory to the temple and carries postganglionic parotid fibers."], "pearl": "Buccal BRANCH of VII moves buccinator; buccal NERVE of V3 feels the cheek.", "set": "vii"}, {"id": "VII-10", "stem": "Which branch of the facial nerve supplies the platysma?", "opts": ["Temporal", "Marginal mandibular", "Cervical", "Posterior auricular", "Buccal"], "ans": 2, "why": "The cervical branch, the most inferior of the five terminal branches emerging from the parotid, supplies platysma.", "wrong": ["The temporal branch supplies occipitofrontalis and the upper part of orbicularis oculi.", "The marginal mandibular branch supplies muscles of the lower lip and chin.", "", "The posterior auricular branch supplies the auricular muscles and arises before the terminal branching.", "The buccal branch supplies buccinator and upper lip muscles."], "pearl": "Five terminal branches: Temporal, Zygomatic, Buccal, Marginal mandibular, Cervical.", "set": "vii"}, {"id": "VII-11", "stem": "A woman has a complete right facial nerve palsy. Which action remains intact on the right?", "opts": ["Closing the eyelids", "Wrinkling the forehead", "Tensing the skin of the neck", "Elevating the upper eyelid", "Puckering the lips"], "ans": 3, "why": "Elevating the upper eyelid is levator palpebrae superioris (CN III, assisted by the sympathetically driven superior tarsal muscle), so it is unaffected by a facial nerve lesion.", "wrong": ["Eyelid closure is orbicularis oculi, a CN VII muscle, and is lost.", "Wrinkling the forehead is occipitofrontalis via the temporal branch of CN VII, and is lost.", "Tensing the neck skin is platysma via the cervical branch of CN VII, and is lost.", "", "Puckering the lips is orbicularis oris, a CN VII muscle, and is lost."], "pearl": "VII palsy leaves the lid wide open, not drooping - ptosis points to III or sympathetics.", "set": "vii"}, {"id": "VII-12", "stem": "Which pair of suprahyoid muscles is supplied by the facial nerve?", "opts": ["Mylohyoid and anterior belly of digastric", "Posterior belly of digastric and stylohyoid", "Geniohyoid and mylohyoid", "Stylopharyngeus and stylohyoid", "Geniohyoid and anterior belly of digastric"], "ans": 1, "why": "Besides the muscles of facial expression and stapedius, CN VII supplies the posterior belly of digastric and stylohyoid.", "wrong": ["Mylohyoid and the anterior belly of digastric are supplied by the nerve to mylohyoid from V3.", "", "Geniohyoid is supplied by C1 and mylohyoid by V3.", "Stylopharyngeus is the one pharyngeal muscle supplied by CN IX; only stylohyoid in this pair is CN VII.", "Geniohyoid is C1 and the anterior belly of digastric is V3."], "pearl": "VII takes the POSTERIOR digastric + stylohyoid; V3 takes the ANTERIOR digastric + mylohyoid.", "set": "vii"}, {"id": "VII-13", "stem": "Which nerve supplies the geniohyoid muscle?", "opts": ["Nerve to mylohyoid (V3)", "Facial nerve", "Glossopharyngeal nerve", "Ansa cervicalis", "C1 fibers travelling with the hypoglossal nerve"], "ans": 4, "why": "Geniohyoid is supplied by C1 fibers that run with the hypoglossal nerve, the same arrangement as thyrohyoid.", "wrong": ["The nerve to mylohyoid (V3) supplies mylohyoid and the anterior belly of digastric.", "Among the suprahyoids, CN VII supplies the posterior belly of digastric and stylohyoid.", "CN IX supplies only stylopharyngeus.", "The ansa cervicalis supplies the infrahyoid strap muscles, not geniohyoid.", ""], "pearl": "Geniohyoid and thyrohyoid are both C1 hitching a ride on CN XII.", "set": "vii"}, {"id": "VII-14", "stem": "A parotid tumor is infiltrating the facial nerve within the gland. Which action would be impaired?", "opts": ["Closing the eye", "Adducting the eye", "Protruding the tongue", "Depressing the jaw", "Elevating the mandible"], "ans": 0, "why": "CN VII within the parotid supplies only muscles of facial expression at that point, so eye closure by orbicularis oculi is the action lost.", "wrong": ["", "Adduction of the eye is medial rectus, supplied by CN III.", "Protrusion of the tongue is genioglossus, supplied by CN XII.", "Depression of the jaw is gravity plus the lateral pterygoid, supplied by V3.", "Elevation of the mandible is temporalis, masseter, and medial pterygoid, all V3."], "pearl": "Inside the parotid, VII moves face only - no eye rotation, no tongue, no jaw.", "set": "vii"}, {"id": "VII-15", "stem": "The ansa cervicalis supplies the infrahyoid (strap) muscles with one exception. Which statement about that exception is correct?", "opts": ["Sternothyroid is the exception and is supplied by CN VII", "Omohyoid is the exception and is supplied by V3", "Thyrohyoid is the exception and is supplied by C1 travelling with the hypoglossal nerve", "Sternocleidomastoid is the exception and is supplied by the ansa cervicalis", "Cricothyroid is the exception and is supplied by the recurrent laryngeal nerve"], "ans": 2, "why": "Every strap muscle takes the ansa cervicalis except thyrohyoid, which is supplied by C1 fibers running with the hypoglossal nerve.", "wrong": ["Sternothyroid is an ordinary ansa cervicalis muscle, and CN VII supplies no strap muscle.", "Omohyoid is supplied by the ansa cervicalis, not by V3.", "", "Sternocleidomastoid is not a strap muscle; it is supplied by CN XI, along with trapezius.", "Cricothyroid is an intrinsic laryngeal muscle supplied by the external laryngeal nerve, not the recurrent laryngeal."], "pearl": "Straps = ansa cervicalis, except THYROhyoid = C1 with XII.", "set": "vii"}, {"id": "VII-16", "stem": "During neck surgery a nerve must be identified to protect the cricothyroid muscle. Which nerve supplies cricothyroid?", "opts": ["Facial nerve", "Recurrent laryngeal nerve", "Ansa cervicalis", "External laryngeal nerve", "Glossopharyngeal nerve"], "ans": 3, "why": "Cricothyroid is the single intrinsic laryngeal muscle supplied by the external laryngeal nerve; the recurrent laryngeal nerve supplies all the others.", "wrong": ["CN VII supplies muscles of facial expression, stapedius, stylohyoid, and the posterior belly of digastric, but no laryngeal muscle.", "The recurrent laryngeal nerve supplies every intrinsic laryngeal muscle EXCEPT cricothyroid.", "The ansa cervicalis supplies the infrahyoid strap muscles.", "", "CN IX supplies only stylopharyngeus among the pharyngeal muscles."], "pearl": "External laryngeal -> cricothyroid; recurrent laryngeal -> all the rest.", "set": "vii"}, {"id": "VII-17", "stem": "Which structure does the facial nerve traverse first on its course from the posterior cranial fossa toward the face?", "opts": ["Stylomastoid foramen", "Internal acoustic meatus", "Jugular foramen", "Parotid gland", "Foramen ovale"], "ans": 1, "why": "CN VII first enters the internal acoustic meatus, then runs in the facial canal, exits the stylomastoid foramen, and only then enters the parotid gland.", "wrong": ["The stylomastoid foramen is the exit, reached after the nerve has traversed the facial canal.", "", "The jugular foramen transmits CN IX, X, and XI.", "The parotid gland is entered only after the nerve leaves the stylomastoid foramen.", "The foramen ovale transmits V3."], "pearl": "Order: IAM -> facial canal -> stylomastoid foramen -> parotid -> 5 branches.", "set": "vii"}, {"id": "AUT-1", "stem": "A 54-year-old man has markedly reduced salivary output from the parotid gland on one side. The lesion is localized to the parasympathetic ganglion that supplies that gland. Which cranial nerve delivers preganglionic fibers to this ganglion?", "opts": ["CN III", "CN V", "CN VII", "CN IX", "CN XII"], "ans": 3, "why": "The parotid gland is served by the otic ganglion, and by the COPS rule the Otic ganglion receives preganglionic parasympathetics from CN IX (glossopharyngeal) via the lesser petrosal nerve.", "wrong": ["CN III supplies the ciliary ganglion, for pupil constriction and accommodation, not any salivary gland.", "CN V carries postganglionic fibers as hitchhikers (for example the auriculotemporal nerve to the parotid) but contributes no preganglionic parasympathetics of its own.", "CN VII supplies the pterygopalatine and submandibular ganglia (lacrimal, nasal/palatal, submandibular and sublingual glands), not the otic ganglion.", "", "CN XII is purely motor to the tongue muscles and carries no parasympathetic fibers."], "pearl": "COPS: Ciliary-Oculomotor, Otic-nine (IX), Pterygopalatine-Seven, Submandibular-Seven.", "set": "auto"}, {"id": "AUT-2", "stem": "A woman develops a dry, gritty right eye with absent reflex tearing after a lesion of the pterygopalatine ganglion. By which route do postganglionic fibers normally travel from that ganglion to the lacrimal gland?", "opts": ["Zygomatic nerve (V2) -> communicating branch -> lacrimal nerve (V1)", "Greater palatine nerve -> lacrimal nerve (V1)", "Chorda tympani -> lingual nerve (V3)", "Auriculotemporal nerve (V3)", "Short ciliary nerves"], "ans": 0, "why": "Lacrimal postganglionics leave the pterygopalatine ganglion on the zygomatic nerve of V2, pass through a communicating branch to the lacrimal nerve of V1, and reach the gland.", "wrong": ["", "The greater palatine nerve carries pterygopalatine postganglionics to the hard palate mucosa, not to the lacrimal gland.", "The chorda tympani joins the lingual nerve to reach the submandibular ganglion for submandibular and sublingual saliva.", "The auriculotemporal nerve carries otic ganglion postganglionics to the parotid gland.", "Short ciliary nerves carry ciliary ganglion postganglionics to the sphincter pupillae and ciliary muscle."], "pearl": "Tears take a V2-to-V1 detour: pterygopalatine -> zygomatic -> communicating -> lacrimal nerve.", "set": "auto"}, {"id": "AUT-3", "stem": "After middle ear surgery a patient notices reduced saliva under the tongue and floor of the mouth, though parotid secretion and tearing are normal. Which nerve was most likely injured?", "opts": ["Lesser petrosal nerve", "Chorda tympani", "Greater petrosal nerve", "Deep petrosal nerve", "Auriculotemporal nerve"], "ans": 1, "why": "The chorda tympani carries CN VII preganglionic parasympathetics through the middle ear, joins the lingual nerve (V3), and synapses in the submandibular ganglion for the submandibular and sublingual glands.", "wrong": ["The lesser petrosal nerve carries CN IX preganglionics to the otic ganglion for the parotid, which is spared here.", "", "The greater petrosal nerve carries CN VII preganglionics toward the pterygopalatine ganglion; loss would cause dry eye and dry nasal/palatal mucosa.", "The deep petrosal nerve is sympathetic and joins the greater petrosal to form the nerve of the pterygoid canal.", "The auriculotemporal nerve delivers otic ganglion postganglionics to the parotid gland."], "pearl": "Chorda tympani -> lingual nerve -> submandibular ganglion -> submandibular AND sublingual glands.", "set": "auto"}, {"id": "AUT-4", "stem": "Eight months after parotid gland surgery a man sweats and flushes over the skin anterior to his ear whenever he eats. Injury to which nerve, with misdirected regrowth, explains this?", "opts": ["Greater petrosal nerve", "Chorda tympani", "Lesser palatine nerve", "Zygomatic nerve", "Auriculotemporal nerve"], "ans": 4, "why": "This is Frey syndrome (gustatory sweating): parasympathetic fibers destined for the parotid regrow along auriculotemporal nerve pathways to reach facial sweat glands.", "wrong": ["Greater petrosal injury affects lacrimal and nasal/palatal secretion, and misrouting there produces lacrimation while eating rather than sweating.", "Chorda tympani injury reduces submandibular and sublingual saliva and does not produce sweating over the parotid region.", "The lesser palatine nerve carries secretomotor fibers to soft palate mucosa only.", "The zygomatic nerve carries lacrimal secretomotor fibers from the pterygopalatine ganglion.", ""], "pearl": "Frey syndrome = gustatory Sweating; auriculotemporal nerve near the parotid is the culprit.", "set": "auto"}, {"id": "AUT-5", "stem": "A patient recovering from a proximal facial nerve injury reports that his left eye waters every time he begins a meal. Which mechanism best explains this finding?", "opts": ["Sympathetic postganglionics regrowing into the ciliary ganglion", "CN IX preganglionics regrowing into the pterygopalatine ganglion", "Salivary preganglionic fibers regrowing along the pathway to the lacrimal gland", "Lacrimal postganglionics regrowing into the parotid gland", "Loss of superior cervical ganglion input to the lacrimal gland"], "ans": 2, "why": "In crocodile tears syndrome, preganglionic fibers originally destined for salivary glands are misrouted through the pterygopalatine ganglion and drive lacrimation during eating.", "wrong": ["The ciliary ganglion controls the pupil and accommodation; sympathetic misrouting there would not cause tearing with meals.", "CN IX preganglionics run in the lesser petrosal nerve to the otic ganglion, and misrouting there gives gustatory sweating, not tearing.", "", "Misrouting runs toward the lacrimal gland in this syndrome; parotid secretion during eating is the normal response, not a symptom.", "The superior cervical ganglion is sympathetic; its loss produces Horner syndrome, not tearing while eating."], "pearl": "Crocodile tears: eating makes you cry - salivary fibers took the tear road after a proximal CN VII injury.", "set": "auto"}, {"id": "AUT-6", "stem": "A 60-year-old woman with an apical lung mass has a constricted right pupil and a partially drooping right upper eyelid. Which additional finding is most likely on examination?", "opts": ["Diplopia on lateral gaze", "Absent gag reflex", "Difficulty swallowing", "Decreased sweating on the right face", "Absent corneal blink reflex"], "ans": 3, "why": "Interruption of the cervical sympathetic chain or superior cervical ganglion gives Horner syndrome: miosis, partial ptosis, and anhidrosis on the affected side.", "wrong": ["Diplopia reflects extraocular muscle weakness from CN III, IV, or VI and is not part of Horner syndrome.", "The gag reflex depends on CN IX afferents and CN X efferents, neither of which is sympathetic.", "Dysphagia points to CN X injury, not to loss of head sympathetics.", "", "The corneal blink reflex uses V1 afferents and CN VII efferents and is preserved in Horner syndrome."], "pearl": "Horner = miosis + partial ptosis + anhidrosis. No swallowing, no double vision, no gag loss.", "set": "auto"}, {"id": "AUT-7", "stem": "A surgeon planning a deep neck dissection wants to avoid the ganglion that houses the postganglionic cell bodies for sympathetic innervation of the head. Where is this ganglion located?", "opts": ["Within the carotid sheath alongside CN X", "In the retropharyngeal space behind the carotid sheath at about C1-C2", "In the pterygopalatine fossa deep to the maxillary nerve", "In the jugular foramen with CN IX, X, and XI", "In the orbital apex lateral to the optic nerve"], "ans": 1, "why": "The superior cervical ganglion sits in the retropharyngeal space, posterior to the carotid sheath, at roughly the C1-C2 vertebral level.", "wrong": ["The carotid sheath contains the carotid artery, internal jugular vein, CN X, and deep cervical nodes; the sympathetic chain lies outside and behind it.", "", "The pterygopalatine fossa houses the pterygopalatine ganglion, a parasympathetic ganglion of CN VII.", "The jugular foramen transmits CN IX, X, and XI but contains no sympathetic ganglion.", "The orbital apex contains the ciliary ganglion, a parasympathetic ganglion of CN III."], "pearl": "Superior cervical ganglion: retropharyngeal, BEHIND the sheath, up at C1-C2.", "set": "auto"}, {"id": "AUT-8", "stem": "A penetrating neck wound opens the carotid sheath. Which structure is normally located OUTSIDE this sheath?", "opts": ["Internal carotid artery", "Internal jugular vein", "Vagus nerve", "Deep cervical lymph nodes", "Cervical sympathetic trunk"], "ans": 4, "why": "The carotid sheath encloses the common/internal carotid artery, internal jugular vein, CN X, and deep cervical lymph nodes; the sympathetic trunk lies posterior to and outside the sheath.", "wrong": ["The common and internal carotid arteries are core contents of the carotid sheath.", "The internal jugular vein runs within the sheath lateral to the artery.", "CN X (vagus) travels inside the sheath between the artery and vein.", "Deep cervical lymph nodes are sheath contents and are removed with neck dissections.", ""], "pearl": "Sheath = artery + IJV + vagus + deep cervical nodes. Sympathetic chain is the outsider.", "set": "auto"}, {"id": "AUT-9", "stem": "Light shone into a patient's right eye produces no constriction in either pupil, but light in the left eye constricts both. Which structure carries the afferent limb that has failed?", "opts": ["Right optic nerve through the optic canal", "Right oculomotor nerve through the superior orbital fissure", "Right ophthalmic nerve through the superior orbital fissure", "Right short ciliary nerves", "Right facial nerve through the internal acoustic meatus"], "ans": 0, "why": "The afferent limb of the pupillary light reflex is CN II, which leaves the orbit through the optic canal; a right optic nerve lesion abolishes the response to light in that eye bilaterally.", "wrong": ["", "CN III is the efferent limb; a right CN III lesion would leave the right pupil fixed even when the left eye is lit.", "V1 is the afferent limb of the corneal blink reflex, not of the pupillary light reflex.", "Short ciliary nerves are the final postganglionic efferents from the ciliary ganglion, not afferents.", "CN VII is the efferent limb of the corneal blink reflex and supplies lacrimal and salivary secretomotor fibers."], "pearl": "Light in, CN II; pupil out, CN III. Blind eye = no response to light in it, either pupil.", "set": "auto"}, {"id": "AUT-10", "stem": "A patient has a dilated pupil that will not constrict to light and cannot focus on near objects, while vision and eye movements are intact. Which pathway is interrupted?", "opts": ["Optic nerve afferents to the pretectal area", "Sympathetic postganglionics on the carotid plexus", "Postganglionic fibers in the short ciliary nerves", "Postganglionic fibers on the auriculotemporal nerve", "Preganglionic fibers in the greater petrosal nerve"], "ans": 2, "why": "Short ciliary nerves carry ciliary ganglion postganglionics to the sphincter pupillae and ciliary muscle, so their loss produces both a poorly reactive pupil and failed accommodation.", "wrong": ["An optic nerve lesion would impair vision and the afferent limb, but the pupil would still constrict when the other eye is lit.", "Carotid plexus sympathetics supply the dilator pupillae; losing them causes a constricted pupil, as in Horner syndrome.", "", "The auriculotemporal nerve carries parotid secretomotor fibers and has no role in the pupil.", "The greater petrosal nerve carries lacrimal and nasal/palatal secretomotor preganglionics, not pupillary fibers."], "pearl": "Short ciliary nerves do two jobs: sphincter pupillae (constrict) and ciliary muscle (accommodate).", "set": "auto"}, {"id": "AUT-11", "stem": "In the orbit, preganglionic parasympathetic fibers reach the ciliary ganglion by traveling with a branch of the inferior division of the oculomotor nerve. Which branch is this?", "opts": ["Nerve to superior rectus", "Nerve to inferior oblique", "Nasociliary nerve", "Frontal nerve", "Nerve to superior oblique"], "ans": 1, "why": "Preganglionic parasympathetics from CN III travel in the inferior division, specifically along the nerve to the inferior oblique, to reach the ciliary ganglion.", "wrong": ["The nerve to superior rectus arises from the superior division of CN III and carries no parasympathetic fibers to the ganglion.", "", "The nasociliary nerve is a sensory branch of V1 and gives the long ciliary nerves, not the parasympathetic supply.", "The frontal nerve is a sensory branch of V1 to the forehead.", "The superior oblique is supplied by CN IV, which carries no parasympathetic fibers."], "pearl": "Inferior division of CN III, nerve to inferior oblique, carries the pupil-constricting preganglionics.", "set": "auto"}, {"id": "AUT-12", "stem": "A tumor at the jugular foramen compresses the nerve that provides preganglionic parasympathetics to the otic ganglion. Which nerve carries these fibers out of the cranial cavity region toward that ganglion?", "opts": ["Chorda tympani", "Greater petrosal nerve", "Deep petrosal nerve", "Lesser petrosal nerve", "Nerve of the pterygoid canal"], "ans": 3, "why": "CN IX exits through the jugular foramen and its lesser petrosal nerve carries preganglionic parasympathetics to the otic ganglion for parotid secretion.", "wrong": ["The chorda tympani is a CN VII branch to the submandibular ganglion for submandibular and sublingual saliva.", "The greater petrosal nerve is a CN VII branch heading toward the pterygopalatine ganglion.", "The deep petrosal nerve is sympathetic, derived from the carotid plexus.", "", "The nerve of the pterygoid canal (Vidian) is the combined greater petrosal plus deep petrosal nerve supplying the pterygopalatine ganglion."], "pearl": "LeSSer petrosal -> otic ganglion -> parotid Saliva. Jugular foramen carries IX, X, XI.", "set": "auto"}, {"id": "AUT-13", "stem": "The nerve of the pterygoid canal (Vidian nerve) is formed by the union of which two nerves?", "opts": ["Greater petrosal nerve and deep petrosal nerve", "Lesser petrosal nerve and deep petrosal nerve", "Chorda tympani and lingual nerve", "Greater petrosal nerve and auriculotemporal nerve", "Zygomatic nerve and lacrimal nerve"], "ans": 0, "why": "The greater petrosal nerve (CN VII parasympathetic preganglionics) joins the deep petrosal nerve (sympathetics) to form the nerve of the pterygoid canal, which reaches the pterygopalatine ganglion.", "wrong": ["", "The lesser petrosal nerve goes to the otic ganglion and is not part of the Vidian nerve.", "The chorda tympani joins the lingual nerve, but that union serves the submandibular ganglion, not the pterygoid canal.", "The auriculotemporal nerve is a V3 branch carrying otic postganglionics to the parotid.", "The zygomatic and lacrimal nerves form the communicating route for lacrimal postganglionics past the ganglion, not the Vidian nerve."], "pearl": "Vidian = Greater petrosal (parasympathetic) + Deep petrosal (sympathetic).", "set": "auto"}, {"id": "AUT-14", "stem": "A patient reports an abnormally dry nose and palate with crusting after a lesion in the pterygopalatine fossa. Postganglionic secretomotor fibers to this mucosa normally travel on branches of which nerve?", "opts": ["V1 (ophthalmic)", "V3 (mandibular)", "V2 (maxillary)", "CN VII proper", "CN IX"], "ans": 2, "why": "Pterygopalatine postganglionics to nasal and palatal mucosa ride V2 branches, namely the nasopalatine, greater palatine, and lesser palatine nerves.", "wrong": ["V1 carries lacrimal postganglionics only after they transfer from the zygomatic branch of V2 via a communicating branch.", "V3 branches carry submandibular postganglionics on the lingual nerve and parotid postganglionics on the auriculotemporal nerve.", "", "CN VII delivers the preganglionic fibers via the greater petrosal nerve but does not carry the postganglionics to the mucosa.", "CN IX supplies the otic ganglion for the parotid and has no role in nasal or palatal secretion."], "pearl": "Nose and palate secretomotor fibers hitchhike on V2: nasopalatine, greater palatine, lesser palatine.", "set": "auto"}, {"id": "AUT-15", "stem": "Touching the posterior oropharyngeal wall in a patient produces no pharyngeal contraction. Which pair of nerves forms the afferent and efferent limbs of this reflex?", "opts": ["Afferent CN II, efferent CN III", "Afferent V1, efferent CN VII", "Afferent CN VII, efferent CN IX", "Afferent CN X, efferent CN IX", "Afferent CN IX, efferent CN X"], "ans": 4, "why": "The gag reflex uses CN IX for sensation from the oropharynx and CN X for motor contraction of the pharyngeal muscles.", "wrong": ["CN II in and CN III out is the pupillary light reflex.", "V1 in and CN VII out is the corneal blink reflex.", "CN VII carries taste and facial motor fibers but is not part of the gag reflex arc.", "The limbs are reversed: CN X is the efferent and CN IX the afferent.", ""], "pearl": "Gag: IX in, X out. Compare corneal (V1 in, VII out) and light (II in, III out).", "set": "auto"}, {"id": "AUT-16", "stem": "A patient does not blink when a wisp of cotton touches the right cornea, yet sensation on the right cornea is intact and the left eye blinks when the right cornea is touched. Which nerve is most likely injured?", "opts": ["Right CN II", "Right V1", "Right CN III", "Right CN VII", "Right CN IX"], "ans": 3, "why": "Intact corneal sensation with a consensual blink means the V1 afferent limb works, so the failure is in the right CN VII efferent limb to the orbicularis oculi.", "wrong": ["CN II is the afferent limb of the pupillary light reflex, not of the blink reflex.", "A V1 lesion would abolish corneal sensation and prevent any blink, including the consensual one.", "CN III elevates the lid and constricts the pupil but does not close the eye.", "", "CN IX is the afferent limb of the gag reflex and plays no role in corneal sensation or blinking."], "pearl": "Corneal reflex: V1 feels it, VII blinks it. Sensation present but no blink = CN VII.", "set": "auto"}, {"id": "AUT-17", "stem": "A skull base mass narrows the jugular foramen. Which set of cranial nerves is at greatest risk?", "opts": ["CN III, IV, VI", "CN IX, X, XI", "CN VII, VIII", "CN II only", "CN V2, V3"], "ans": 1, "why": "The jugular foramen transmits CN IX, X, and XI, so compression there threatens the gag reflex, swallowing, and trapezius/sternocleidomastoid function.", "wrong": ["CN III, IV, and VI travel through the superior orbital fissure and control eye movements, so their loss causes diplopia.", "", "CN VII and VIII pass through the internal acoustic meatus.", "CN II passes through the optic canal, the afferent limb of the pupillary light reflex.", "V2 passes through the foramen rotundum and V3 through the foramen ovale."], "pearl": "Jugular foramen = 9, 10, 11 (gag, swallow, shoulder shrug).", "set": "auto"}, {"id": "ORB-1", "stem": "A neurologist wants to test one extraocular muscle in isolation in a patient with vertical diplopia. Which instruction isolates the action of the superior oblique muscle?", "opts": ["Adduct the eye, then look down", "Abduct the eye, then look down", "Adduct the eye, then look up", "Abduct the eye, then look up", "Look straight down from primary gaze"], "ans": 0, "why": "With the eye adducted the obliques are isolated, and depression in adduction is the job of the superior oblique (CN IV).", "wrong": ["", "Depression with the eye abducted tests the inferior rectus.", "Elevation with the eye adducted tests the inferior oblique.", "Elevation with the eye abducted tests the superior rectus.", "Straight depression from primary gaze uses inferior rectus and superior oblique together, so it isolates neither."], "pearl": "ABducted = recti, ADducted = obliques. Superior oblique = adduct, then look DOWN.", "set": "orbit"}, {"id": "ORB-2", "stem": "A 58-year-old man reports vertical double vision that is worst when he walks down stairs. He holds his head tilted toward the right shoulder, and in primary gaze the left eye sits slightly higher than the right.", "opts": ["Left medial rectus", "Left inferior oblique", "Left superior oblique", "Left lateral rectus", "Right superior rectus"], "ans": 2, "why": "A CN IV palsy weakens the only muscle it supplies, the superior oblique, so the eye drifts up, diplopia is worst looking down and in, and the head tilts away from the lesion.", "wrong": ["The medial rectus (CN III) adducts; weakness gives horizontal, not vertical, diplopia.", "The inferior oblique (CN III) elevates and extorts the adducted eye; weakness limits upgaze in adduction.", "", "The lateral rectus (CN VI) abducts; weakness gives horizontal diplopia worse on gaze toward that side.", "The superior rectus (CN III) elevates the abducted eye; weakness limits upgaze in abduction."], "pearl": "CN IV = superior oblique only: vertical diplopia looking DOWN and IN, head tilts AWAY from the lesion.", "set": "orbit"}, {"id": "ORB-3", "stem": "A woman with a brain tumor and raised intracranial pressure develops horizontal double vision. The right eye rests slightly medially and will not move past the midline on attempted rightward gaze. Which nerve has the longest intracranial course and is most likely stretched?", "opts": ["Optic (CN II)", "Oculomotor (CN III)", "Trochlear (CN IV)", "Facial (CN VII)", "Abducens (CN VI)"], "ans": 4, "why": "CN VI has the longest intracranial course and is the classic false localizing sign in raised intracranial pressure; losing the lateral rectus causes failure of abduction with horizontal diplopia.", "wrong": ["CN II is sensory for vision and the afferent limb of the light reflex; it moves no muscle.", "A CN III palsy gives a down-and-out eye with ptosis, not isolated loss of abduction.", "A CN IV palsy gives vertical diplopia worst on looking down and in.", "CN VII closes the eye through orbicularis oculi and supplies no extraocular muscle.", ""], "pearl": "Cannot abduct = CN VI. Longest intracranial course, and also picked off in the cavernous sinus.", "set": "orbit"}, {"id": "ORB-4", "stem": "A tumor at the orbital apex compresses only the contents of the optic canal. Which pair of structures is affected?", "opts": ["CN III and the superior ophthalmic vein", "CN II and the ophthalmic artery", "CN IV and the lacrimal nerve", "CN VI and the inferior ophthalmic vein", "The infraorbital and zygomatic nerves"], "ans": 1, "why": "The optic canal transmits CN II together with the ophthalmic artery; every other nerve entering the orbit uses one of the orbital fissures.", "wrong": ["CN III and the superior ophthalmic vein both pass through the superior orbital fissure.", "", "CN IV and the lacrimal nerve (V1) both enter through the superior orbital fissure.", "CN VI enters through the superior orbital fissure, while the inferior ophthalmic vein uses the inferior orbital fissure.", "The infraorbital and zygomatic nerves (V2) traverse the inferior orbital fissure."], "pearl": "Optic canal holds exactly two things: CN II + ophthalmic artery.", "set": "orbit"}, {"id": "ORB-5", "stem": "During orbital surgery a nerve is identified entering the orbit through the superior orbital fissure. Which nerve is it?", "opts": ["Infraorbital nerve", "Zygomatic nerve", "Optic nerve", "Nasociliary nerve", "Anterior ethmoidal nerve"], "ans": 3, "why": "The superior orbital fissure transmits CN III, CN IV, CN VI, the superior ophthalmic vein, and the three V1 branches: frontal, lacrimal, and nasociliary.", "wrong": ["The infraorbital nerve (V2) runs through the inferior orbital fissure and exits the infraorbital foramen on the face.", "The zygomatic nerve (V2) passes through the inferior orbital fissure.", "The optic nerve enters through the optic canal with the ophthalmic artery.", "", "The anterior ethmoidal nerve is a nasociliary branch that leaves the orbit through the anterior ethmoidal foramen to reach the ethmoid sinuses."], "pearl": "Superior orbital fissure: 3, 4, 6, and V1 (Frontal, Lacrimal, Nasociliary) + superior ophthalmic vein.", "set": "orbit"}, {"id": "ORB-6", "stem": "A man has a mildly droopy right upper lid, a small right pupil, and decreased sweating on the right side of the face. Extraocular movements are full and the pupil still constricts to light. Which muscle is failing to contract?", "opts": ["Superior tarsal muscle", "Levator palpebrae superioris", "Orbicularis oculi", "Superior rectus", "Sphincter pupillae"], "ans": 0, "why": "Horner syndrome removes sympathetic tone to the smooth superior tarsal muscle, producing partial ptosis while CN III function stays intact.", "wrong": ["", "Levator palpebrae superioris (CN III) is the main lid elevator; its loss causes complete ptosis along with a down-and-out eye.", "Orbicularis oculi (CN VII) closes the eye, so weakness causes failure of lid closure rather than ptosis.", "The superior rectus (CN III) elevates the eye, not the lid.", "Sphincter pupillae (CN III parasympathetics) constricts the pupil; here the small pupil comes from lost sympathetic dilation, not extra constriction."], "pearl": "Partial ptosis + miosis + anhidrosis = Horner: the smooth superior tarsal muscle lost its sympathetics.", "set": "orbit"}, {"id": "ORB-7", "stem": "A patient cannot squeeze the right eye shut and the cornea is drying out, but lid elevation and all eye movements are normal. Which nerve is injured?", "opts": ["Oculomotor (CN III)", "Ophthalmic division of trigeminal (V1)", "Facial (CN VII)", "Abducens (CN VI)", "Trochlear (CN IV)"], "ans": 2, "why": "Orbicularis oculi closes the eye and is supplied by CN VII; CN III opens the lid through levator palpebrae superioris.", "wrong": ["CN III elevates the lid and moves the eye, so its loss causes ptosis rather than failure of closure.", "V1 is sensory to the cornea, forehead, and scalp; losing it blunts the blink reflex afferent but paralyzes no muscle.", "", "CN VI supplies only the lateral rectus, so its loss impairs abduction.", "CN IV supplies only the superior oblique, so its loss causes vertical diplopia."], "pearl": "CN VII shuts the eye, CN III opens it.", "set": "orbit"}, {"id": "ORB-8", "stem": "A 60-year-old woman with a posterior communicating artery aneurysm has a right eye that rests down and out, a drooping right lid, and a dilated right pupil that does not react to light. Which movement of the right eye remains intact?", "opts": ["Elevation in abduction", "Adduction", "Elevation in adduction", "Lid elevation", "Abduction"], "ans": 4, "why": "A CN III palsy spares only the lateral rectus (CN VI) and superior oblique (CN IV), so abduction is preserved and the resting eye sits down and out.", "wrong": ["Elevation in abduction tests the superior rectus, a CN III muscle.", "Adduction is performed by the medial rectus, a CN III muscle.", "Elevation in adduction tests the inferior oblique, a CN III muscle.", "Lid elevation is performed by levator palpebrae superioris (CN III), which is why she is ptotic.", ""], "pearl": "LR6 SO4 AO3: in CN III palsy only abduction (LR) and depression/intorsion in adduction (SO) survive.", "set": "orbit"}, {"id": "ORB-9", "stem": "After a blow that fractures the roof of the orbit, a patient has numbness of the forehead and the front of the scalp. Eye movements, lid function, and sensation over the tip of the nose are all normal. Which nerve was injured?", "opts": ["Lacrimal nerve", "Frontal nerve", "Nasociliary nerve", "Infraorbital nerve", "Zygomatic nerve"], "ans": 1, "why": "The frontal nerve (V1) runs on top of levator palpebrae superioris and continues as the supraorbital and supratrochlear nerves, which give general sensation to the forehead and scalp.", "wrong": ["The lacrimal nerve (V1) is sensory to the lacrimal gland and carries parasympathetic fibers into it.", "", "Nasociliary (V1) injury would numb the nose tip through its external nasal branch and the ethmoid sinuses through the ethmoidal nerves.", "The infraorbital nerve (V2) supplies the cheek, upper lip, and lower eyelid skin after leaving the infraorbital foramen.", "The zygomatic nerve (V2) supplies skin over the cheekbone and relays parasympathetics toward the lacrimal nerve."], "pearl": "Frontal nerve rides on TOP of levator palpebrae -> supraorbital + supratrochlear = forehead and scalp.", "set": "orbit"}, {"id": "ORB-10", "stem": "A patient develops vesicles on the tip of the nose during a herpes zoster outbreak, a sign that predicts involvement of the eye. Which nerve supplies the skin of the nose tip?", "opts": ["Infraorbital nerve (V2)", "Supratrochlear nerve (V1)", "Lacrimal nerve (V1)", "External nasal nerve from nasociliary (V1)", "Zygomatic nerve (V2)"], "ans": 3, "why": "The external nasal nerve is a branch of nasociliary (V1), so nose-tip involvement flags the ophthalmic division and therefore risk to the globe.", "wrong": ["The infraorbital nerve (V2) supplies the cheek, upper lip, and side of the nose, not the tip.", "The supratrochlear nerve (V1) is a frontal nerve branch to the medial forehead.", "The lacrimal nerve (V1) is sensory to the lacrimal gland, not to skin of the nose.", "", "The zygomatic nerve (V2) supplies skin over the cheekbone and temple."], "pearl": "Nose TIP = nasociliary (V1). Vesicles there -> examine the eye.", "set": "orbit"}, {"id": "ORB-11", "stem": "A resident is asked to trace the pupillary light reflex. Through which opening of the orbit does the afferent limb of this reflex travel?", "opts": ["Optic canal", "Superior orbital fissure", "Inferior orbital fissure", "Infraorbital foramen", "Anterior ethmoidal foramen"], "ans": 0, "why": "The afferent limb is CN II, which leaves the orbit through the optic canal alongside the ophthalmic artery.", "wrong": ["", "The superior orbital fissure carries the efferent CN III plus CN IV, CN VI, the V1 branches, and the superior ophthalmic vein.", "The inferior orbital fissure carries the zygomatic and infraorbital nerves (V2) and the inferior ophthalmic vein.", "The infraorbital foramen lies on the face below the orbit and transmits the infraorbital nerve (V2).", "The anterior ethmoidal foramen transmits an ethmoidal nerve from nasociliary to the ethmoid sinuses."], "pearl": "Light reflex goes IN through the optic canal (CN II) and OUT through the superior orbital fissure (CN III).", "set": "orbit"}, {"id": "ORB-12", "stem": "A mass destroys a parasympathetic ganglion in the posterior orbit. The patient's pupil no longer constricts to light and near focusing is impaired, yet visual acuity and eye movements are normal. Which pathway has been interrupted?", "opts": ["Long ciliary nerves from nasociliary", "Greater petrosal nerve to the pterygopalatine ganglion", "Short ciliary nerves from the ciliary ganglion", "Sympathetic fibers to the superior tarsal muscle", "Optic nerve fibers in the optic canal"], "ans": 2, "why": "CN III parasympathetics synapse in the ciliary ganglion and travel in the short ciliary nerves to sphincter pupillae and the ciliary muscle for accommodation.", "wrong": ["The long ciliary nerves are sensory branches of nasociliary (V1) to the globe, including the cornea.", "The greater petrosal nerve carries CN VII parasympathetics to the pterygopalatine ganglion for tear production, not pupil constriction.", "", "Loss of sympathetics to the superior tarsal muscle causes partial ptosis and a small pupil, not a fixed dilated one.", "Optic nerve damage would abolish the afferent limb and reduce vision, but acuity here is normal."], "pearl": "Ciliary ganglion -> short ciliary nerves -> sphincter pupillae + ciliary muscle (both CN III).", "set": "orbit"}, {"id": "ORB-13", "stem": "A patient has a dry right eye from failure of reflex tear production, while corneal sensation and eye movements are intact. Which nerve carries the secretomotor fibers to the lacrimal gland?", "opts": ["Ophthalmic division of trigeminal (V1)", "Maxillary division of trigeminal (V2)", "Oculomotor (CN III)", "Abducens (CN VI)", "Facial (CN VII)"], "ans": 4, "why": "Lacrimal secretomotor fibers are CN VII parasympathetics: greater petrosal nerve -> pterygopalatine ganglion -> zygomatic nerve (V2) -> lacrimal nerve (V1) -> gland.", "wrong": ["V1 supplies only general sensation to the gland; its lacrimal nerve merely carries the para
