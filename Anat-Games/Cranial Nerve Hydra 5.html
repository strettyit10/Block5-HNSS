<style>
/* Deliberately single-theme: a night-arena world. Every color is painted explicitly. */
:root{
  --ground:#17142B; --ground2:#120F22; --panel:#221D3F; --sunk:#1B1734; --line:#3A3366;
  --ink:#EEEAFB; --muted:#A39CC8;
  --p1:#FFB341; --p2:#3DD6C6; --boss:#FF4F8B; --heal:#6BD88E; --bad:#FF6B5B;
  --hy-bg:#3A3212; --hy-line:#D9AE2B; --hy-ink:#F7E6A6;
  --display:"Chakra Petch","Arial Narrow",sans-serif;
  --pix:"Silkscreen","Courier New",monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font:15px/1.55 var(--body);padding-inline:16px;padding-block:16px 40px;
  background-image:radial-gradient(ellipse 80% 50% at 50% 0%, #2A2352 0%, transparent 70%);background-attachment:fixed}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.pix{font-family:var(--pix);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.brand b{color:var(--boss)}

/* ---------- setup ---------- */
.setup{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:start}
.hero{display:flex;flex-direction:column;gap:14px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,6.4vw,74px);line-height:.92;margin:0;text-transform:uppercase;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--boss)}
.hero p{margin:0;color:var(--muted);max-width:54ch}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.foe{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:8px;display:flex;gap:8px;align-items:center}
.foe svg{width:44px;height:44px;flex:none}
.foe b{display:block;font-family:var(--display);font-size:13.5px;line-height:1.15}
.foe span{font-family:var(--pix);font-size:9.5px;color:var(--muted);text-transform:uppercase}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:6px;max-width:58ch}
.rules li{display:grid;grid-template-columns:92px 1fr;gap:10px;border-top:1px dashed var(--line);padding-top:6px;font-size:14px}
.rules b{font-family:var(--pix);font-size:11px;color:var(--p1);font-weight:400;padding-top:3px}
.form{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:16px}
.fl{display:flex;flex-direction:column;gap:6px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names input{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:9px 10px;border-left:5px solid var(--p1)}
.names input#p2name{border-left-color:var(--p2)}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;min-width:72px;background:var(--sunk);border:0;border-right:1px solid var(--line);padding:9px 8px;font-size:14px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:600}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.picker button{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:7px 9px;text-align:left;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.picker button[aria-pressed="true"]{border-color:var(--boss);box-shadow:inset 3px 0 0 var(--boss)}
.picker em{font-style:normal;font-family:var(--pix);font-size:10px;color:var(--muted)}
.go{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase;background:var(--boss);color:#1a0610;border:0;border-radius:4px;padding:11px 16px}

/* ---------- arena ---------- */
.arena{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:12px;align-items:stretch}
.hero-card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;transition:box-shadow .2s,opacity .3s}
.hero-card.p1{--c:var(--p1)} .hero-card.p2{--c:var(--p2)}
.hero-card.on{box-shadow:0 0 0 2px var(--c),0 0 24px -4px var(--c)}
.hero-card.ko{opacity:.45}
.hero-card .nm{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1;color:var(--c)}
.hero-card .role{font-family:var(--pix);font-size:10px;color:var(--muted);text-transform:uppercase}
.bar{height:14px;background:var(--ground2);border:1px solid var(--line);border-radius:3px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.bar.hp i{background:var(--heal)} .bar.hp.low i{background:var(--bad)}
.bar.boss{height:18px} .bar.boss i{background:linear-gradient(90deg,#B8265A,var(--boss))}
.hpnum{font-family:var(--pix);font-size:11px;display:flex;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.abil{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.abil button{flex:1;min-width:90px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:6px 6px;font-size:12.5px;line-height:1.2}
.abil button small{display:block;font-family:var(--pix);font-size:9px;color:var(--muted)}
.abil button:disabled{opacity:.35;cursor:not-allowed}
.abil button:not(:disabled):hover{border-color:var(--c)}
.ko-tag{position:absolute;top:10px;right:10px;font-family:var(--pix);font-size:12px;color:var(--bad)}
.boss-card{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center}
.boss-card .bn{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;line-height:1;letter-spacing:.03em}
.boss-card .bt{font-size:12.5px;color:var(--muted)}
.beast{height:150px;display:grid;place-items:center}
.beast svg{display:block;height:150px;width:auto;max-width:100%;overflow:visible}
.beast.hit svg{animation:hit .45s}
.beast.atk svg{animation:atk .5s}
.beast.dead svg{animation:dead .9s forwards}
.beast.gone svg{transform:translateY(20px) scale(.6);opacity:.1;filter:grayscale(1)}
@keyframes hit{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px);filter:brightness(2.2)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
@keyframes atk{0%,100%{transform:scale(1)}40%{transform:scale(1.14) translateY(8px)}}
@keyframes dead{to{transform:translateY(20px) scale(.6);opacity:.1;filter:grayscale(1)}}
.rage{font-family:var(--pix);font-size:10.5px;color:var(--boss)}
.dmg{position:absolute;font-family:var(--display);font-weight:700;font-size:30px;pointer-events:none;animation:float 1s forwards;text-shadow:0 2px 0 #000}
@keyframes float{from{transform:translateY(0);opacity:1}to{transform:translateY(-44px);opacity:0}}
.timer{height:6px;background:var(--ground2);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--muted);transform-origin:left;transition:transform .25s linear}
.timer.warn i{background:var(--bad)}
.log{font-family:var(--pix);font-size:11px;color:var(--muted);min-height:16px;text-transform:uppercase;letter-spacing:.04em}
.log b{color:var(--ink);font-weight:400}

.qpanel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--pix);font-size:10.5px;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid var(--line)}
.chip.p1{background:var(--p1);color:#231500;border-color:var(--p1)}
.chip.p2{background:var(--p2);color:#032421;border-color:var(--p2)}
.chip.dash{border-style:dashed}
.stem{margin:0;font-size:16px;line-height:1.62;max-width:76ch}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:8px 12px}
.opt .lt{font-family:var(--display);font-weight:700;font-size:17px;width:28px;height:28px;border:1.5px solid var(--line);border-radius:3px;display:grid;place-items:center;transform:rotate(45deg)}
.opt .lt span{transform:rotate(-45deg)}
.opt:not(:disabled):hover{border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.out{opacity:.3;text-decoration:line-through}
.opt.right{border-color:var(--heal);background:#193326}
.opt.right .lt{background:var(--heal);border-color:var(--heal);color:#07210F}
.opt.wrong{border-color:var(--bad);background:#3A1A22}
.opt.wrong .lt{background:var(--bad);border-color:var(--bad);color:#2a0606}
.verdict{border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--sunk)}
.verdict h3{margin:0;font-family:var(--display);font-size:22px;text-transform:uppercase}
.verdict.good h3{color:var(--heal)} .verdict.bad h3{color:var(--bad)}
.verdict p{margin:0;max-width:76ch}
.why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--muted)}
.why b{color:var(--ink);font-family:var(--pix);font-weight:400;margin-right:6px}
.hy{background:var(--hy-bg);border:1.5px solid var(--hy-line);color:var(--hy-ink);border-radius:4px;padding:9px 12px;font-size:14px}
.hy b{display:block;font-family:var(--pix);font-size:10px;font-weight:400;letter-spacing:.1em;text-transform:uppercase}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--ground);border:0;border-radius:4px;padding:10px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
kbd{font-family:var(--pix);font-size:10px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--muted)}

/* ---------- interlude / end ---------- */
.interlude{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px;display:grid;grid-template-columns:180px 1fr;gap:22px;align-items:center}
.interlude svg{width:100%;height:auto}
.interlude h2,.end h2{font-family:var(--display);font-weight:700;font-size:clamp(32px,5vw,54px);line-height:.95;margin:0 0 8px;text-transform:uppercase;text-wrap:balance}
.interlude p{margin:0 0 12px;color:var(--muted);max-width:60ch}
.path{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.path span{font-family:var(--pix);font-size:10px;padding:3px 7px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
.path span.done{color:var(--heal);border-color:var(--heal)}
.path span.now{color:var(--boss);border-color:var(--boss)}
.end{display:flex;flex-direction:column;gap:18px}
.end h2.win{color:var(--heal)} .end h2.lose{color:var(--bad)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.p1{--c:var(--p1)} .card.p2{--c:var(--p2)}
.big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;color:var(--c)}
.missed{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.missed li{font-size:13.5px;border-left:3px solid var(--line);padding-left:9px}
.missed li span{display:block;font-family:var(--pix);font-size:9.5px;color:var(--muted);text-transform:uppercase}
.foot{font-family:var(--pix);font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;text-transform:uppercase}
@media (max-width:860px){
  .setup,.cards,.interlude{grid-template-columns:1fr}
  .interlude svg{max-width:160px}
  .arena{grid-template-columns:1fr 1fr}
  .boss-card{grid-column:1 / -1;order:-1}
  .beast{height:110px}.beast svg{height:110px}
  .names,.picker{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const DECK=5;
const SETS={"neck": "The Neck", "face": "Face, Scalp & ITF", "cranial": "Skull, Meninges & Foramina", "orbit": "Orbit & Eye Reflexes", "nasal_oral": "Nose, Pharynx, Palate & Oral Cavity", "larynx": "Larynx", "cn": "Cranial Nerve Lesions"};
const Q=[{"id": "LC-26", "stem": "A 25-year-old boxer is knocked unconscious. After waking he has a severe headache, nausea, and vomiting. Concerned about intracranial trauma, which cranial nerve can the ringside physician observe, without imaging, for signs of increased intracranial pressure?", "opts": ["Optic nerve", "Oculomotor nerve", "Olfactory nerve", "Trigeminal nerve", "Trochlear nerve"], "ans": 0, "why": "The optic nerve is wrapped in meninges with CSF in its subarachnoid space, so raised ICP is transmitted to the optic disc. Fundoscopy shows papilledema (swollen disc with blurred margins).", "wrong": ["", "CN III palsy does not give a directly viewable measure of ICP.", "Anosmia would point to cribriform trauma, not raised ICP.", "CN V deficits give numbness/mastication weakness, not ICP information.", "CN IV palsy causes diplopia but gives no information on ICP."], "pearl": "Papilledema on fundoscopy = raised ICP transmitted along the optic nerve sheath.", "set": "cn"}, {"id": "BH-31", "stem": "A 37-year-old man has discomfort moving his tongue, pharynx, and larynx. Examination shows that the muscles attached to the styloid process are paralyzed. Which group of cranial nerves is damaged?", "opts": ["Facial, glossopharyngeal, and hypoglossal nerves", "Hypoglossal, vagus, and facial nerves", "Glossopharyngeal, trigeminal, and vagus nerves", "Vagus, spinal accessory, and hypoglossal nerves", "Facial, glossopharyngeal, and vagus nerves"], "ans": 0, "why": "Three muscles arise from the styloid process: stylohyoid (CN VII), stylopharyngeus (CN IX), and styloglossus (CN XII).", "wrong": ["", "Vagus supplies no styloid muscle; CN IX (stylopharyngeus) is missing.", "Neither CN V nor CN X supplies a styloid muscle.", "CN X and XI supply no styloid muscle.", "Vagus supplies no styloid muscle; CN XII (styloglossus) is missing."], "pearl": "Styloid muscles: stylohyoid (VII), stylopharyngeus (IX), styloglossus (XII).", "set": "cn"}, {"id": "LC-19", "stem": "To distinguish idiopathic unilateral facial paralysis (Bell palsy) from herpes zoster infection of CN VII, the physician looks for small herpetic vesicles. Where are these lesions located in herpes zoster infection involving the facial nerve?", "opts": ["Mental region of the mandible", "Temporal and parietal region of the scalp", "Upper lip and cheek of the face", "Auricle of the external ear", "Bridge and tip of the external nose"], "ans": 3, "why": "CN VII's only cutaneous territory is a small part of the auricle/external ear. Reactivation in the geniculate ganglion (Ramsay Hunt syndrome) puts vesicles there along with facial paralysis.", "wrong": ["Supplied by the mental nerve (V3).", "Supplied by the auriculotemporal nerve (V3).", "Supplied by the infraorbital nerve (V2).", "", "Supplied by infratrochlear and external nasal nerves (V1)."], "pearl": "Ramsay Hunt: facial palsy + ear vesicles (geniculate ganglion), ± hearing loss/vertigo.", "set": "cn"}, {"id": "G-99", "stem": "An 8-year-old boy has a radical mastoid operation for a middle ear infection that spread to the mastoid air cells. Afterward his mouth is pulled up toward the left, he cannot close his right eye, and saliva pools in his right cheek and dribbles from the corner of his mouth. Which structure was most likely damaged?", "opts": ["Mandibular nerve", "Parotid duct", "Vagus nerve", "Facial nerve", "Glossopharyngeal nerve"], "ans": 3, "why": "The facial nerve runs through the temporal bone next to the mastoid and exits at the stylomastoid foramen. Injury there paralyzes the facial muscles on that side, so the eye stays open, the cheek (buccinator) is slack and the mouth is pulled to the healthy side.", "wrong": ["V3 moves the jaw (chewing muscles), not the facial muscles.", "Injury would affect saliva flow, not the facial muscles.", "The vagus does not supply the facial muscles.", "", "CN IX does not supply the facial muscles."], "pearl": "Mastoid surgery puts CN VII at risk (stylomastoid foramen); a lower motor neuron lesion paralyzes the whole side of the face.", "set": "cn"}, {"id": "G-102", "stem": "A 45-year-old woman has trouble seeing when walking down stairs. On examination she is weak at looking down and in. Imaging shows an arterial aneurysm pressing on a nerve just below the tentorium cerebelli. Which artery and nerve are most likely involved?", "opts": ["Internal carotid artery/abducens nerve", "Middle cerebral artery/oculomotor nerve", "Posterior cerebral artery/ophthalmic nerve", "Basilar artery/ophthalmic nerve", "Superior cerebellar artery/trochlear nerve"], "ans": 4, "why": "Weak down-and-in gaze (trouble with stairs) points to the superior oblique, supplied by CN IV. CN IV wraps around the midbrain beside the superior cerebellar artery, just below the tentorium.", "wrong": ["A CN VI lesion causes loss of abduction, not weak downward gaze.", "A CN III lesion would also cause ptosis, a dilated pupil and a 'down and out' eye.", "The ophthalmic nerve is sensory and cannot weaken eye movement.", "The ophthalmic nerve is sensory; it cannot cause gaze weakness.", ""], "pearl": "Trouble reading or going down stairs with head tilt = CN IV (superior oblique) lesion.", "set": "cn"}, {"id": "G-21", "stem": "A 45-year-old woman with an intracranial tumor has dryness of the nasal cavity and paranasal sinuses, loss of lacrimation, and loss of taste from the anterior two thirds of the tongue. Which structure is most likely involved by the tumor?", "opts": ["Auriculotemporal nerve", "Lesser petrosal nerve", "Facial nerve", "Inferior salivatory nucleus", "Pterygopalatine ganglion"], "ans": 2, "why": "Lacrimal/nasal secretion (greater petrosal) and anterior-tongue taste (chorda tympani) are both carried by the facial nerve, so a single lesion proximal to both branches explains all deficits.", "wrong": ["Sensory to temple, TMJ and ear; carries parotid secretomotor fibers only.", "Carries CN IX parasympathetics to the parotid, not lacrimal or taste fibers.", "", "Brainstem nucleus of CN IX (parotid); unrelated to lacrimation or anterior tongue taste.", "Explains lacrimal and nasal dryness but not loss of anterior-tongue taste."], "pearl": "Dry eye + dry nose + lost anterior 2/3 taste = CN VII proximal to the geniculate ganglion (before greater petrosal and chorda tympani branch).", "set": "cn"}, {"id": "LH-14", "stem": "A 22-year-old man receives a 3-cm-deep stab wound in the left anterior cervical region at the C2 vertebral level, anterior to the sternocleidomastoid and superior to the greater horn of the hyoid bone. Postoperatively he has dysarthria (difficulty speaking). Which structure is most likely damaged?", "opts": ["Hypoglossal nerve", "Accessory nerve", "Mandibular division of trigeminal nerve", "Lingual branch of glossopharyngeal nerve", "Roots of the brachial plexus"], "ans": 0, "why": "CN XII crosses the carotid arteries just above the greater horn of the hyoid in the anterior triangle. It supplies all intrinsic and most extrinsic tongue muscles, so injury impairs articulation, and the tongue deviates toward the injured side on protrusion.", "wrong": ["", "Supplies only SCM and trapezius; lies posterior, deep to SCM", "Lies high in the infratemporal fossa, not the anterior neck at C2", "Sensory/taste to posterior tongue; no motor role in speech", "Lie between the scalenes low in the neck, far from this wound"], "pearl": "CN XII lesion: dysarthria + tongue deviates toward the lesion ('licks the wound').", "set": "cn"}, {"id": "BH-49", "stem": "A 59-year-old stroke patient cannot swallow because of a nerve injury. Which of the following nerves is NOT involved in swallowing?", "opts": ["Hypoglossal nerve", "Spinal accessory nerve", "Vagus nerve", "Facial nerve", "Trigeminal nerve"], "ans": 1, "why": "The spinal accessory nerve supplies only the SCM and trapezius, which have no role in swallowing.", "wrong": ["CN XII moves the tongue to push the bolus back.", "", "CN X supplies palate, pharynx, and larynx muscles.", "CN VII supplies posterior digastric and stylohyoid, elevating the hyoid.", "V3 supplies mylohyoid and anterior digastric, elevating the hyoid."], "pearl": "CN XI = SCM + trapezius only.", "set": "cn"}, {"id": "G-240", "stem": "A 72-year-old woman has herpes zoster oticus. She says she must hold the phone away from her ear because sounds seem too loud. Which cranial nerve's involvement causes this hyperacusis?", "opts": ["Hypoglossal", "Facial", "Spinal accessory", "Vagus", "Glossopharyngeal"], "ans": 1, "why": "Reactivated varicella in the geniculate ganglion (Ramsay Hunt) affects CN VII, including the nerve to stapedius. Without stapedius damping of the stapes, sounds are perceived as abnormally loud.", "wrong": ["CN XII is motor to the tongue only.", "", "CN XI supplies SCM and trapezius.", "CN X supplies pharynx/larynx; no middle-ear muscle.", "CN IX supplies stylopharyngeus and tympanic plexus sensation, not stapedius."], "pearl": "Hyperacusis = CN VII lesion proximal to the nerve to stapedius (Bell palsy, Ramsay Hunt).", "set": "cn"}, {"id": "G-232", "stem": "A 55-year-old woman is found unconscious and brought to the hospital with findings suggesting a ruptured aneurysm. Examination of the right eye shows ptosis, a dilated pupil, and the eye deviated inferolaterally. Angiography most likely shows a hematoma compressing which structure?", "opts": ["Oculomotor nerve", "Optic nerve", "Facial nerve", "Ciliary ganglion", "Superior cervical ganglion"], "ans": 0, "why": "CN III supplies levator palpebrae, most extraocular muscles, and parasympathetics to the sphincter pupillae. Its compression leaves the lateral rectus and superior oblique unopposed (down and out), removes lid elevation (ptosis), and leaves the dilator pupillae unopposed (mydriasis).", "wrong": ["", "CN II lesion causes visual loss, not ptosis or a down-and-out eye.", "CN VII paralyzes facial muscles; it would cause inability to close the eye, not ptosis.", "Ciliary ganglion lesion gives a dilated pupil but no ptosis or eye deviation.", "Sympathetic lesion gives mild ptosis with a constricted pupil (Horner)."], "pearl": "Down and out + ptosis + blown pupil = CN III compression (think PComm/aneurysm or uncal herniation).", "set": "cn"}, {"id": "G-260", "stem": "During a cranial nerve exam, a 49-year-old patient's uvula deviates to the right. The gag reflex is weaker when the left pharyngeal mucosa is touched than when the right is touched. Which nerve is most likely injured?", "opts": ["Left vagus", "Left glossopharyngeal", "Right vagus", "Left V3", "Right glossopharyngeal"], "ans": 0, "why": "A vagal lesion weakens the ipsilateral levator veli palatini, so the uvula is pulled toward the intact side (away from the lesion). The motor limb of the gag reflex is also weakened on the left.", "wrong": ["", "A CN IX lesion reduces gag sensation but does not deviate the uvula.", "Right vagus lesion would deviate the uvula to the left.", "V3 does not control the uvula or the gag reflex.", "Right CN IX would weaken the right-sided gag and not deviate the uvula."], "pearl": "Uvula deviates AWAY from the side of a CN X lesion.", "set": "cn"}, {"id": "G-136", "stem": "A 52-year-old man has a gunshot wound in the infratemporal fossa. He has lost hot, cold, pain and pressure sensation on one side of the front of his tongue, but taste and salivary function are normal. What is the most likely explanation?", "opts": ["The facial nerve was transected distal to the origin of the chorda tympani", "Receptors for hot, cold, pain, and pressure are absent in the patient's tongue", "The glossopharyngeal nerve has been injured in the pharynx", "The superior laryngeal nerve was obviously severed by the bullet", "The lingual nerve was injured at its origin near the foramen ovale"], "ans": 4, "why": "The chorda tympani (taste and salivary fibers) joins the lingual nerve after the lingual nerve branches from V3. An injury high up, before that junction, removes only general sensation.", "wrong": ["Past the chorda tympani, CN VII supplies only the facial muscles; tongue sensation is unaffected.", "Not a real anatomical explanation for a sudden injury.", "CN IX supplies the posterior third of the tongue.", "The superior laryngeal nerve supplies the larynx, not the tongue.", ""], "pearl": "Lingual nerve injury above the chorda tympani junction = general sensory loss only; below the junction = loss of taste and salivation too.", "set": "nasal_oral"}, {"id": "BH-3", "stem": "A 19-year-old woman complains of numbness of the nasopharynx after surgical removal of the adenoids. A lesion of which of the following nerves would be expected?", "opts": ["Maxillary nerve", "Superior cervical ganglion", "External laryngeal nerve", "Glossopharyngeal nerve", "Vagus nerve"], "ans": 3, "why": "Sensory innervation of the upper pharyngeal mucosa is provided by CN IX via the pharyngeal plexus; the vagus covers the lower pharynx and larynx.", "wrong": ["V2 supplies nasal mucosa and palate, not the pharyngeal wall per the book.", "Superior cervical ganglion contributes sympathetics with no afferent fibers.", "External laryngeal nerve is motor to cricothyroid and inferior constrictor.", "", "Vagus supplies sensation to the lower pharynx and larynx."], "pearl": "Pharyngeal sensation = CN IX (upper) / CN X (lower); pharyngeal motor = CN X.", "set": "nasal_oral"}, {"id": "BC-23", "stem": "The pharyngeal (gag) reflex is contraction of the pharyngeal constrictor muscles elicited by touching the back of the pharynx (e.g., with a tongue depressor). The afferent fibers that innervate the pharyngeal mucosa for this reflex are branches of which of the following nerves?", "opts": ["Trigeminal nerve", "Facial nerve", "Glossopharyngeal nerve", "Vagus nerve", "Hypoglossal nerve"], "ans": 2, "why": "Pharyngeal branches of CN IX carry sensation from the oropharyngeal mucosa and form the afferent limb of the gag reflex; CN X provides the motor (efferent) limb.", "wrong": ["Trigeminal nerve is not part of the gag reflex.", "Facial nerve is not part of the gag reflex.", "", "Vagus is the efferent limb, not the afferent.", "Hypoglossal nerve is not part of the gag reflex."], "pearl": "Gag reflex: afferent IX, efferent X.", "set": "nasal_oral"}, {"id": "LC-15", "stem": "A 12-year-old boy fractures the floor of the right middle cranial fossa in a car accident. Examination shows loss of emotional tearing on the same side. Which nerve is most likely damaged?", "opts": ["Greater petrosal nerve", "Lesser petrosal nerve", "Deep petrosal nerve", "Lacrimal nerve", "Chorda tympani nerve"], "ans": 0, "why": "Tearing depends on preganglionic parasympathetic fibers of CN VII carried by the greater petrosal nerve. It leaves the geniculum and runs along the middle cranial fossa floor toward the pterygoid canal and pterygopalatine ganglion, so it is easily hurt in fractures there.", "wrong": ["", "Carries CN IX parasympathetics to the otic ganglion for the parotid.", "Sympathetic fibers; does not drive lacrimation.", "Lies in the orbit, not injured by a middle cranial fossa fracture.", "Supplies submandibular/sublingual glands and anterior tongue taste."], "pearl": "Lacrimation pathway: CN VII → greater petrosal → n. of pterygoid canal → pterygopalatine ganglion → lacrimal gland.", "set": "nasal_oral"}, {"id": "LH-5", "stem": "A 27-year-old man has a painful, swollen floor of the mouth. Imaging shows an 8-mm stone (sialolith) in the right submandibular duct. If the duct is partially obstructed, where would the physician observe salivation in the oral cavity after applying pressure to the right submandibular gland?", "opts": ["Second maxillary molar tooth", "Oral vestibule", "Palatine mucosa", "Sublingual fold", "Lingual frenulum"], "ans": 4, "why": "The submandibular duct opens on the sublingual papilla (caruncle) on each side of the base of the lingual frenulum, so expressed saliva appears there.", "wrong": ["Site of the parotid duct opening, not the submandibular duct", "Receives parotid saliva, not submandibular saliva", "Contains minor palatine glands only", "Where multiple small sublingual gland ducts open, not the submandibular duct", ""], "pearl": "Submandibular (Wharton) duct opens at the sublingual caruncle beside the lingual frenulum.", "set": "nasal_oral"}, {"id": "G-91", "stem": "A 54-year-old man needs surgery near the cavernous sinus, and the surgeon plans an approach to the sella turcica through the nasal cavity. Through which route would the surgeon most likely reach the cranial cavity?", "opts": ["Cribriform plate", "Cavernous sinus", "Frontal sinus", "Maxillary sinus", "Sphenoidal sinus"], "ans": 4, "why": "The sphenoid sinus lies directly below the sella turcica and pituitary, so the transsphenoidal approach is the most direct way in through the nose.", "wrong": ["Too far forward; entering here damages the olfactory nerves and causes CSF leak.", "The cavernous sinus is inside the skull beside the sella; it is not an entry route.", "The frontal sinus does not open toward the sella.", "The maxillary sinus does not open into the cranial cavity.", ""], "pearl": "Pituitary surgery is transsphenoidal: nose -> sphenoid sinus -> sella turcica.", "set": "nasal_oral"}, {"id": "G-120", "stem": "A 14-year-old girl has a right peritonsillar abscess (quinsy). Which artery is at greatest risk during removal or incision and drainage of the diseased tissue?", "opts": ["Lingual", "A branch of facial", "Superior laryngeal artery", "Ascending pharyngeal artery", "Descending palatine artery"], "ans": 1, "why": "The tonsillar branch of the facial artery is the main supply to the palatine tonsil and lies right in the surgical field.", "wrong": ["Runs below the oropharynx, deep to the hyoglossus.", "", "Lies lower, at the thyrohyoid membrane.", "Arises low in the carotid triangle and is a minor tonsillar supplier.", "Only its terminal branches reach the upper pole of the tonsil; the main vessel is not at risk."], "pearl": "Tonsillar surgery puts the tonsillar branch of the facial artery at risk.", "set": "nasal_oral"}, {"id": "BH-9", "stem": "A young girl complains of dryness of the nose and palate. This would indicate a lesion of which of the following ganglia?", "opts": ["Nodose ganglion", "Otic ganglion", "Pterygopalatine ganglion", "Submandibular ganglion", "Ciliary ganglion"], "ans": 2, "why": "Postganglionic parasympathetic fibers from the pterygopalatine ganglion supply the mucous glands of the nasal cavity and palate (and the lacrimal gland).", "wrong": ["Nodose (inferior vagal) ganglion is sensory.", "Otic ganglion supplies the parotid gland.", "", "Submandibular ganglion supplies submandibular and sublingual glands.", "Ciliary ganglion supplies the ciliary muscle and sphincter pupillae."], "pearl": "Pterygopalatine ganglion = 'hay fever ganglion': lacrimal, nasal, palatal glands.", "set": "nasal_oral"}, {"id": "LC-4", "stem": "A 10-year-old boy undergoes bilateral palatine tonsillectomy. Postoperatively he has no gag reflex when the right posterior tongue is stimulated and reports abnormal taste in the back of his mouth. The soft palate elevates symmetrically. No other deficits are noted. What cranial nerve was damaged?", "opts": ["Trigeminal nerve", "Facial nerve", "Glossopharyngeal nerve", "Vagus nerve", "Hypoglossal nerve"], "ans": 2, "why": "The tonsillar and lingual branches of CN IX lie in the tonsillar bed and are vulnerable during tonsillectomy. CN IX carries taste/general sensation from the posterior third of the tongue and forms the afferent limb of the gag reflex.", "wrong": ["CN V (lingual n.) gives general sensation to the anterior two thirds, not posterior tongue.", "CN VII (chorda tympani) carries anterior two-thirds taste; not part of gag reflex.", "", "CN X is the efferent gag limb; symmetric palate elevation shows it is intact.", "CN XII is purely motor to tongue; no taste or gag role."], "pearl": "Tonsillectomy + lost gag afferent + posterior tongue taste loss = CN IX.", "set": "nasal_oral"}, {"id": "G-225", "stem": "A 72-year-old man has difficulty eating. MRI shows a brainstem tumor affecting the contents of the hypoglossal canal. Which muscle would be affected?", "opts": ["Geniohyoid", "Mylohyoid", "Palatoglossus", "Genioglossus", "Stylohyoid"], "ans": 3, "why": "CN XII passes through the hypoglossal canal and supplies all intrinsic and extrinsic tongue muscles except palatoglossus, including genioglossus.", "wrong": ["Supplied by C1 fibers that only travel with CN XII, not by CN XII itself.", "Supplied by the nerve to mylohyoid (V3).", "Supplied by the vagus (pharyngeal plexus).", "", "Supplied by the facial nerve."], "pearl": "CN XII lesion: tongue deviates TOWARD the lesion (unopposed contralateral genioglossus).", "set": "nasal_oral"}, {"id": "G-174", "stem": "A 36-year-old woman has severe head injuries after a car crash. On neurologic examination her palate elevates asymmetrically, being pulled up toward the right. Which of the following muscles is paralyzed?", "opts": ["Left levator veli palatini", "Left tensor veli palatini", "Right levator veli palatini", "Right tensor veli palatini", "Right tensor veli palatini and left levator veli palatini"], "ans": 0, "why": "The levator veli palatini (CN X) elevates the soft palate. With the left one paralyzed, the intact right levator acts unopposed and pulls the palate and uvula toward the right (healthy) side.", "wrong": ["", "Tensor (V3) tenses the palate; its loss does not cause deviated elevation.", "The palate deviates TOWARD the intact side, so the right levator is working.", "Tensor (V3) loss does not produce the asymmetric elevation seen.", "Mixed option; a right-sided levator-intact pattern implicates only the left levator."], "pearl": "Uvula/palate deviates AWAY from the side of the CN X lesion (toward the intact side).", "set": "nasal_oral"}, {"id": "G-110", "stem": "An 11-year-old boy has swollen palatine tonsils. Which artery supplies most of the blood to these tonsils?", "opts": ["Ascending pharyngeal", "Facial", "Lingual", "Descending palatine", "Superior thyroid"], "ans": 1, "why": "The tonsillar branch of the facial artery is the main blood supply to the palatine tonsil, so it must be controlled during tonsillectomy.", "wrong": ["A minor contributor to the tonsil.", "", "Contributes only small dorsal lingual branches.", "Contributes only via the lesser palatine branches, a minor supply.", "Supplies the thyroid and larynx, not the tonsil."], "pearl": "Main tonsillar artery = tonsillar branch of the facial artery.", "set": "nasal_oral"}, {"id": "BH-24", "stem": "A 32-year-old house painter falls from a ladder and has intracranial bleeding. During intraoperative testing, the neurosurgeon notes loss of general sensation in the dura of the middle cranial fossa. Which nerve has been affected?", "opts": ["Vagus nerve", "Facial nerve", "Hypoglossal nerve", "Trigeminal nerve", "Glossopharyngeal nerve"], "ans": 3, "why": "Dura of the middle cranial fossa is supplied by meningeal branches of V2 and V3 (e.g., nervus spinosus); V1 covers the anterior fossa.", "wrong": ["Vagus supplies posterior cranial fossa dura.", "Facial nerve does not supply cranial dura.", "Hypoglossal (carrying C1-C2 fibers) supplies posterior fossa dura.", "", "CN IX does not supply cranial dura."], "pearl": "Supratentorial dura = CN V; posterior fossa dura = CN X and upper cervical nerves.", "set": "cranial"}, {"id": "G-267", "stem": "A 75-year-old woman has double vision and cannot abduct her right eye. An aneurysm of which artery would most likely compress the nerve responsible?", "opts": ["Posterior cerebral artery", "Internal carotid artery", "External carotid artery", "Anterior cerebral artery", "Posterior communicating artery"], "ans": 1, "why": "CN VI runs through the cavernous sinus right beside the internal carotid artery, free in the sinus rather than in its lateral wall. An ICA aneurysm there readily compresses CN VI, causing lateral rectus palsy.", "wrong": ["PCA aneurysms typically compress CN III.", "", "The ECA stays outside the cranium.", "ACA/AComm aneurysms affect the optic chiasm.", "PComm aneurysms classically compress CN III (ptosis, blown pupil)."], "pearl": "CN VI lies free in the cavernous sinus next to the ICA -> first nerve hit by cavernous ICA aneurysm.", "set": "cranial"}, {"id": "BH-20", "stem": "A 31-year-old woman has headache and dizziness after hitting her head on a cabinet door. MRI venography shows a large clot in the great cerebral vein (of Galen). This vein is a direct tributary of which of the following?", "opts": ["Emissary veins", "Pterygoid venous plexus", "Diploic veins", "Dural venous sinuses", "Internal jugular vein"], "ans": 3, "why": "Veins of the brain drain directly into dural venous sinuses; the great cerebral vein joins the inferior sagittal sinus to form the straight sinus.", "wrong": ["Emissary veins connect dural sinuses with scalp veins.", "Pterygoid plexus connects to the cavernous sinus via emissary veins.", "Diploic veins run within the skull diploe.", "", "The IJV receives the sinuses' outflow, not brain veins directly."], "pearl": "Great cerebral vein + inferior sagittal sinus -> straight sinus.", "set": "cranial"}, {"id": "LC-34", "stem": "MRI shows atherosclerotic stenosis of the right internal carotid artery within the cavernous sinus, with increased pressure leading to an aneurysm there. Given its location, which cranial nerve would most likely be damaged?", "opts": ["Trochlear nerve", "Abducent nerve", "Maxillary nerve", "Ophthalmic nerve", "Oculomotor nerve"], "ans": 1, "why": "CN VI runs free within the cavernous sinus right beside the ICA, while CN III, IV, V1, and V2 lie in the lateral wall. An ICA aneurysm there therefore hits CN VI first.", "wrong": ["Lies in the lateral wall, farther from the ICA.", "", "Lies in the lateral wall, farther from the ICA.", "Lies in the lateral wall, farther from the ICA.", "Lies in the lateral wall, farther from the ICA."], "pearl": "Cavernous sinus: CN VI travels with the ICA in the sinus itself; it is the first nerve affected.", "set": "cranial"}, {"id": "G-4", "stem": "Early closure of the fontanelles of the infant skull can compress the brain and restrict its growth. Which fontanelle lies at the junction of the sagittal and coronal sutures, and at about what age does it typically close?", "opts": ["Posterior fontanelle, which closes at about 2 years", "Mastoid fontanelle, which closes at about 16 months", "Lambdoid fontanelle, which closes at 8 months to 1 year", "Sphenoidal fontanelle, which closes at 3 years", "Anterior fontanelle, which closes at 18 months"], "ans": 4, "why": "The anterior fontanelle sits where the sagittal and coronal sutures meet (the future bregma) and is the last to close, at roughly 18 months.", "wrong": ["Posterior fontanelle is at sagittal–lambdoid junction (lambda) and closes by 2–3 months.", "Mastoid fontanelle is at squamous–lambdoid junction and closes near the end of year 1.", "There is a lambdoid suture but no 'lambdoid fontanelle'.", "Sphenoidal fontanelle is at squamous–coronal junction (pterion) and closes by 2–3 months.", ""], "pearl": "Anterior fontanelle = future bregma (sagittal + coronal), closes ~18 months; posterior = lambda, closes ~2–3 months.", "set": "cranial"}, {"id": "BC-19", "stem": "A 31-year-old hockey player is hit in the head by a puck. His radiograph shows a fracture involving the foramen rotundum. Which of the following nerves would be damaged?", "opts": ["Ophthalmic nerve", "Mandibular nerve", "Maxillary nerve", "Optic nerve", "Trochlear nerve"], "ans": 2, "why": "The maxillary division of the trigeminal nerve (V2) exits the middle cranial fossa through the foramen rotundum into the pterygopalatine fossa.", "wrong": ["V1 passes through the superior orbital fissure.", "V3 passes through the foramen ovale.", "", "Optic nerve passes through the optic canal.", "CN IV passes through the superior orbital fissure."], "pearl": "V1 = SOF, V2 = rotundum, V3 = ovale ('Standing Room Only').", "set": "cranial"}, {"id": "BH-11", "stem": "A 39-year-old woman with headache and dizziness has an infection of a dural venous sinus. The infected sinus lies in the attached margin of the tentorium cerebelli and runs from the posterior end of the cavernous sinus to the transverse sinus. Which sinus is affected?", "opts": ["Straight sinus", "Inferior sagittal sinus", "Sphenoparietal sinus", "Superior petrosal sinus", "Cavernous sinus"], "ans": 3, "why": "The superior petrosal sinus runs along the petrous ridge in the attached edge of the tentorium, linking the cavernous sinus to the transverse sinus.", "wrong": ["Straight sinus lies at the junction of falx cerebri and tentorium.", "Inferior sagittal sinus lies in the free edge of the falx cerebri.", "Sphenoparietal sinus follows the lesser wing of the sphenoid.", "", "Cavernous sinus sits beside the sella turcica."], "pearl": "Superior petrosal sinus: cavernous -> transverse, along the petrous ridge.", "set": "cranial"}, {"id": "LH-62", "stem": "During a fight, one construction worker strikes the other with a hammer at the pterion of the skull. Which of the following bones may be fractured?", "opts": ["Zygomatic process of the temporal bone", "Greater wing of the sphenoid bone", "Mastoid process of the temporal bone", "Lateral pterygoid plate of the sphenoid bone", "Coronoid process of the mandible"], "ans": 1, "why": "The pterion is the H-shaped junction of the frontal, parietal, squamous temporal, and greater wing of the sphenoid bones. It is thin, and the anterior branch of the middle meningeal artery runs deep to it.", "wrong": ["Forms the zygomatic arch, inferior to the pterion", "", "Lies behind the ear, far from the pterion", "Lies deep in the infratemporal fossa", "Part of the mandible, below the zygomatic arch"], "pearl": "Pterion = frontal + parietal + temporal + greater wing of sphenoid; overlies the middle meningeal a.", "set": "cranial"}, {"id": "G-46", "stem": "A 63-year-old man with left-sided hearing loss complains of loss of taste and drooling from the left side of his mouth. CT shows a tumor compressing the nerve exiting the skull through which opening?", "opts": ["Foramen ovale", "Foramen rotundum", "Internal acoustic meatus", "Jugular foramen", "Superior orbital fissure"], "ans": 2, "why": "Hearing loss (CN VIII) plus taste loss and facial weakness (CN VII) localize to the internal acoustic meatus, which both nerves enter together.", "wrong": ["Transmits V3 (mastication, lower face sensation).", "Transmits V2.", "", "Transmits CN IX, X, XI.", "Transmits III, IV, V1, VI."], "pearl": "CN VII + VIII together = internal acoustic meatus / cerebellopontine angle (e.g., vestibular schwannoma).", "set": "cranial"}, {"id": "G-132", "stem": "A 65-year-old man bumped his head on a low branch while driving a tractor 3 weeks ago. He now has confusion and poor coordination, and imaging shows a clot from a leaking cerebral vein over the right hemisphere. What type of bleeding is he most likely having?", "opts": ["Subarachnoid bleeding", "Epidural bleeding", "Intracerebral bleeding into the brain parenchyma", "Subdural bleeding", "Bleeding into the cerebral ventricular system"], "ans": 3, "why": "Torn bridging veins that cross from the brain to the dural sinuses bleed slowly into the subdural space. This causes a gradual, delayed rise in pressure, which is typical in older adults after minor trauma.", "wrong": ["Usually arterial (aneurysm) and sudden, with blood in the CSF.", "Usually a middle meningeal artery tear with rapid decline.", "Usually due to high blood pressure, with sudden focal deficits.", "", "Comes from choroid plexus or deep bleeds, not a surface cerebral vein."], "pearl": "Elderly patient + minor trauma + weeks-long decline = subdural (bridging vein), crescent-shaped on CT.", "set": "cranial"}, {"id": "G-186", "stem": "A 54-year-old man has severe headaches. CT reveals a tumor occupying a portion of the anterior cranial fossa. Which of the following is responsible for the sensation of headache pain in this case?", "opts": ["Meningeal branches of the maxillary nerve", "Meningeal branches of the mandibular nerve", "Meningeal branches of the ethmoidal nerve", "Tentorial nerve", "C2 and C3 fibers"], "ans": 2, "why": "The dura of the anterior cranial fossa is supplied by meningeal branches of the anterior and posterior ethmoidal nerves (from V1), which carry the pain from a tumor there.", "wrong": ["V2 meningeal branches supply dura of the middle cranial fossa.", "V3 (nervus spinosus) supplies middle fossa dura, not anterior fossa.", "", "V1 branch to the tentorium and posterior falx, not the anterior fossa floor.", "Upper cervical fibers supply posterior cranial fossa dura."], "pearl": "Dura: anterior fossa = V1 (ethmoidal), middle = V2/V3, posterior = C1-C3 & CN X.", "set": "cranial"}, {"id": "LH-49", "stem": "A 32-year-old woman has LASIK surgery. To treat dry eyes, her ophthalmologist inserts a small silicone plug to block drainage of tears from her left eye. Obstruction of what structure prevents tears from entering the lacrimal drainage apparatus?", "opts": ["Lacrimal punctum", "Lacrimal canaliculus", "Lacrimal sac", "Nasolacrimal duct", "Inferior nasal meatus"], "ans": 0, "why": "Tears enter the drainage system through the lacrimal puncta on the lacrimal papillae at the medial lid margins. A punctal plug blocks this entry point so tears stay on the eye.", "wrong": ["", "Lies downstream of the punctum; tears have already entered", "Downstream collecting chamber in the lacrimal fossa", "Carries tears from the sac to the nose; far downstream", "Final outlet of the nasolacrimal duct in the nasal cavity"], "pearl": "Tear drainage: punctum -> canaliculus -> lacrimal sac -> nasolacrimal duct -> inferior meatus.", "set": "orbit"}, {"id": "BC-18", "stem": "A 22-year-old patient has dryness of the corneal surface of his eye because of a lack of tears. Which of the following nerves may be damaged?", "opts": ["Proximal portion of the lacrimal nerve", "Zygomatic branch of the facial nerve", "Lesser petrosal nerve", "Greater petrosal nerve", "Deep petrosal nerve"], "ans": 3, "why": "Lacrimal secretomotor fibers leave CN VII in the greater petrosal nerve, travel through the pterygoid canal to synapse in the pterygopalatine ganglion, then reach the gland via zygomatic and the terminal lacrimal nerve.", "wrong": ["Only the terminal portion of the lacrimal nerve carries the secretomotor fibers.", "Zygomatic branch of CN VII is motor to facial muscles.", "Lesser petrosal nerve serves the parotid gland.", "", "Deep petrosal nerve carries postganglionic sympathetic fibers."], "pearl": "Tears: CN VII -> greater petrosal -> pterygopalatine ganglion -> zygomatic -> lacrimal n.", "set": "orbit"}, {"id": "G-126", "stem": "During a routine eye exam, which nerves must work properly for a patient to turn the eye outward (abduction) smoothly, without drifting up or down?", "opts": ["Superior division of oculomotor, ophthalmic nerve, abducens nerve", "Trochlear nerve, abducens nerve, nasociliary nerve", "Inferior division of oculomotor, trochlear, abducens", "Oculomotor and ophthalmic nerves", "Superior division of oculomotor, trochlear, and abducens nerves"], "ans": 2, "why": "The lateral rectus (CN VI) does the main abduction, the superior oblique (CN IV) helps, and the inferior rectus (inferior division of CN III) balances the upward pull of the superior rectus so the eye stays level.", "wrong": ["The ophthalmic nerve is sensory and has no motor role.", "The nasociliary nerve is sensory.", "", "The ophthalmic nerve is sensory, and CN VI is missing.", "The superior division supplies the superior rectus and levator; it does not balance upward drift."], "pearl": "Only CN III, IV and VI move the eye; V1 branches are purely sensory.", "set": "orbit"}, {"id": "BC-16", "stem": "A 20-year-old guard blinks when a strong wind hits the cornea of his eye. The afferent fibers of the corneal reflex arc are carried by which of the following nerves?", "opts": ["Optic nerve", "Lacrimal nerve", "Nasociliary nerve", "Zygomatic nerve", "Oculomotor nerve"], "ans": 2, "why": "Corneal sensation travels in the long ciliary branches of the nasociliary nerve (V1), forming the afferent limb; the facial nerve closes the eye as the efferent limb.", "wrong": ["Optic nerve is the afferent limb of the pupillary light reflex.", "Lacrimal nerve supplies the lateral upper eyelid and gland, not the cornea.", "", "Zygomatic nerve (V2) supplies lateral face skin.", "CN III opens the eye; it is not part of the corneal reflex."], "pearl": "Corneal reflex: afferent V1 (nasociliary) -> efferent VII (orbicularis oculi).", "set": "orbit"}, {"id": "G-35", "stem": "A 48-year-old man complains of diplopia. On neurologic examination he cannot adduct his left eye and lacks a corneal reflex on the left side. Where is the lesion most likely located?", "opts": ["Inferior orbital fissure", "Optic canal", "Superior orbital fissure", "Foramen rotundum", "Foramen ovale"], "ans": 2, "why": "Failure of adduction points to CN III (medial rectus) and loss of the corneal reflex to the nasociliary nerve (V1); both traverse the superior orbital fissure.", "wrong": ["Transmits infraorbital (V2) nerve/vessels and zygomatic nerve, not III or V1.", "Transmits the optic nerve and ophthalmic artery.", "", "Transmits V2 only.", "Transmits V3 and lesser petrosal nerve."], "pearl": "SOF carries III, IV, V1 (lacrimal, frontal, nasociliary), VI and superior ophthalmic vein; a SOF lesion = ophthalmoplegia + V1 sensory loss.", "set": "orbit"}, {"id": "G-76", "stem": "A 43-year-old man complains of diplopia when walking down stairs. When asked to turn his right eye inward toward his nose and look down, he can look inward but not down. Which nerve is most likely involved?", "opts": ["Abducens", "Nasociliary", "Oculomotor, inferior division", "Oculomotor, superior division", "Trochlear"], "ans": 4, "why": "With the eye adducted, the superior oblique is the depressor; failure of downgaze in adduction (with intact adduction) indicates a trochlear nerve lesion.", "wrong": ["Supplies lateral rectus (abduction).", "Purely sensory branch of V1.", "Its loss would also impair adduction (medial rectus) and elevation (inferior oblique).", "Supplies superior rectus and levator; elevation/ptosis, not downgaze.", ""], "pearl": "Test CN IV: adduct the eye, then look down (superior oblique depresses the adducted eye).", "set": "orbit"}, {"id": "G-106", "stem": "A 57-year-old man has a tumor in the superior orbital fissure. His eye is fixed looking outward and slightly down, the pupil is dilated and the upper lid droops. When asked to look toward his nose, the eye only rotates inward (intorsion). The consensual corneal reflexes are normal. Which nerve is most likely affected?", "opts": ["Trochlear nerve", "Oculomotor nerve", "Abducens nerve and sympathetic nerve plexus accompanying the ophthalmic artery", "Ophthalmic nerve and short ciliary nerve", "Superior division of oculomotor nerve and the nasociliary nerve"], "ans": 1, "why": "A CN III lesion leaves only the lateral rectus (CN VI) and superior oblique (CN IV) working, so the eye sits down and out. The lid droops (levator), the pupil is dilated (loss of parasympathetic supply), and trying to adduct shows only superior oblique intorsion.", "wrong": ["A CN IV lesion causes weak down-and-in gaze, not ptosis or a dilated pupil.", "", "A CN VI lesion causes inward deviation; sympathetic loss causes a small pupil, not a dilated one.", "Normal corneal reflexes argue against V1 injury, and ptosis is not explained.", "The superior division alone would spare the pupil and medial rectus."], "pearl": "CN III palsy: 'down and out', ptosis, dilated pupil; intorsion on attempted adduction shows CN IV is intact.", "set": "orbit"}, {"id": "BH-54", "stem": "A 51-year-old woman can see the distant sky clearly but cannot focus on her face in a mirror. Her lack of accommodation results from paralysis of which muscle?", "opts": ["Tarsal muscle", "Sphincter pupillae", "Dilator pupillae", "Ciliary muscle", "Orbitalis muscle"], "ans": 3, "why": "Near focusing requires contraction of the ciliary muscle (parasympathetic via CN III and the ciliary ganglion), which lets the lens round up.", "wrong": ["Superior tarsal muscle helps elevate the eyelid.", "Sphincter pupillae constricts the pupil; not the focusing muscle.", "Dilator pupillae dilates the pupil.", "", "Orbitalis bridges the inferior orbital fissure."], "pearl": "Accommodation = ciliary muscle contraction (CN III parasympathetics).", "set": "orbit"}, {"id": "LC-25", "stem": "A 27-year-old man reports double vision. His left eye is turned inward (esotropia), giving a cross-eyed appearance. When asked to follow the examiner's finger, he cannot look laterally with that eye. No other visual deficits are noted. What specific nerve is most likely damaged?", "opts": ["Left oculomotor nerve", "Right oculomotor nerve", "Left abducent nerve", "Right abducent nerve", "Left trochlear nerve"], "ans": 2, "why": "The left abducens supplies only the left lateral rectus. Without it, the unopposed medial rectus pulls the eye inward (esotropia) and the eye cannot abduct.", "wrong": ["Left CN III palsy gives a down-and-out eye with ptosis, not esotropia.", "Right CN III would affect the right eye and cause ptosis.", "", "The left eye is the one affected, not the right.", "CN IV palsy impairs depression in adduction, not abduction."], "pearl": "Esotropia + failed abduction = ipsilateral CN VI palsy (lateral rectus).", "set": "orbit"}, {"id": "G-263", "stem": "A neurologist strokes the patient's left cornea with cotton and gets no response. When the right cornea is touched, both eyes blink. Damage to which left cranial nerve best explains this?", "opts": ["Optic", "Oculomotor", "Trigeminal", "Abducens", "Facial"], "ans": 2, "why": "The corneal reflex uses V1 (nasociliary) as the afferent limb and CN VII as the bilateral efferent. Touching the right cornea produces a bilateral blink, so both facial nerves work; the left V1 afferent is the problem.", "wrong": ["CN II carries vision, not corneal touch.", "CN III elevates the lid; it does not close it.", "", "CN VI moves the eye laterally; not part of the reflex.", "A left CN VII lesion would stop the left eye blinking when the right cornea is touched."], "pearl": "No blink either eye from one side = afferent (V1) lesion; one eye never blinks = efferent (VII) lesion.", "set": "orbit"}, {"id": "G-299", "stem": "A 30-year-old man is struck just below the right eye by a cricket ball and has severe pain and double vision. CT shows a displaced fracture of the inferior orbital margin and floor along the zygomaticomaxillary suture. Which finding best explains his symptoms?", "opts": ["Partial ptosis of the upper eyelid", "Complete ptosis of the upper eyelid", "Inability to elevate the abducted eyeball", "Inability to depress the abducted eyeball", "Inability to produce tears"], "ans": 2, "why": "An orbital floor fracture can entrap the inferior muscles (inferior rectus/inferior oblique) and tether the globe, so the eye cannot be elevated and the patient has diplopia on upgaze.", "wrong": ["Ptosis requires levator or tarsal muscle injury in the upper orbit.", "Complete ptosis requires CN III or levator injury.", "", "Depression in abduction is inferior rectus action; the key issue is restricted elevation.", "Tear production depends on the lacrimal gland/parasympathetics, not the orbital floor."], "pearl": "Orbital floor fracture -> restricted upgaze, diplopia, infraorbital numbness.", "set": "orbit"}, {"id": "G-34", "stem": "A 33-year-old woman is unconscious after falling and hitting her head. The emergency physician performs a pupillary light reflex test. The integrity of which nerves is being checked?", "opts": ["Optic and facial", "Optic and oculomotor", "Maxillary and facial", "Ophthalmic and oculomotor", "Ophthalmic and facial"], "ans": 1, "why": "The optic nerve carries the afferent light signal and the oculomotor nerve carries the parasympathetic efferent to the sphincter pupillae.", "wrong": ["Optic is correct afferent, but CN VII closes the lids; it does not constrict the pupil.", "", "Neither nerve participates in the light reflex.", "V1 is the afferent limb of the corneal reflex, not the light reflex.", "This pair is the corneal (blink) reflex."], "pearl": "Pupillary light reflex: II in, III out. Corneal reflex: V1 (nasociliary) in, VII out.", "set": "orbit"}, {"id": "G-133", "stem": "After a boxing match, a 27-year-old man is tested for the strength and symmetry of jaw opening. Which muscle is most important for protruding the jaw and depressing the mandible?", "opts": ["Anterior portion of temporalis", "Lateral pterygoid", "Medial pterygoid", "Masseter", "Platysma"], "ans": 1, "why": "The lateral pterygoid pulls the condyle and articular disc forward, which protrudes the jaw and starts mouth opening.", "wrong": ["Elevates (closes) the jaw.", "", "Elevates the jaw and helps with side-to-side grinding.", "A strong jaw elevator.", "A facial muscle (CN VII) that only weakly depresses the jaw."], "pearl": "Lateral pterygoid = the only chewing muscle that opens the jaw and protrudes it.", "set": "face"}, {"id": "G-184", "stem": "A newborn is delivered with forceps after a difficult delivery. A cephalohematoma from rupture of small periosteal arteries is noted. Between which of the following layers does the blood accumulate?", "opts": ["Between skin and dense connective tissue layer", "Between loose connective tissue layer and galea aponeurotica", "Between galea aponeurotica and pericranium", "Between pericranium and calvaria", "In the subcutaneous layer"], "ans": 3, "why": "A cephalohematoma is bleeding beneath the periosteum, i.e., between the pericranium and the skull bone, so it is limited by suture lines where the pericranium attaches.", "wrong": ["Skin and dense connective tissue are firmly bound; blood doesn't collect here.", "The loose areolar layer lies deep to the galea, not superficial to it.", "This is the subgaleal (loose areolar) space; bleeding here crosses sutures.", "", "Subcutaneous swelling is caput succedaneum-type edema, not periosteal bleeding."], "pearl": "Cephalohematoma: subperiosteal, does not cross sutures; subgaleal bleed crosses sutures.", "set": "face"}, {"id": "LC-17", "stem": "A 32-year-old man has paralysis of the muscles of mastication on the right side, causing facial asymmetry and difficulty chewing. His chief complaint is difficulty swallowing (dysphagia). Which muscle is most likely involved in his dysphagia?", "opts": ["Sternohyoid", "Stylohyoid", "Cricothyroid", "Stylopharyngeus", "Mylohyoid"], "ans": 4, "why": "Paralysis of mastication muscles points to a V3 lesion. V3 also supplies mylohyoid (and anterior digastric), which elevate the hyoid and floor of mouth during swallowing, so its loss causes dysphagia.", "wrong": ["Innervated by ansa cervicalis (C1-C3), not V3.", "Innervated by CN VII, not V3.", "Innervated by the external branch of the superior laryngeal nerve; affects pitch.", "Innervated by CN IX, not V3.", ""], "pearl": "V3 motor: 4 muscles of mastication + MATT (Mylohyoid, Anterior digastric, Tensor tympani, Tensor veli palatini).", "set": "face"}, {"id": "LH-36", "stem": "Startled while shaving his head with a straight razor, a young man cuts his scalp, severing branches of the supraorbital and superficial temporal vessels. The wound is modest but bleeds profusely. In what layer of the scalp do the severed vessels reside?", "opts": ["Skin", "Dense connective tissue", "Epicranial aponeurosis", "Loose connective tissue", "Pericranium"], "ans": 1, "why": "The main scalp vessels and nerves run in the dense connective tissue (second) layer. Their walls are bound to this fibrous tissue, which holds cut ends open and prevents vasoconstriction, so scalp wounds bleed heavily.", "wrong": ["Outermost layer; contains hair follicles and glands, not the main vessels", "", "Tendinous sheet linking frontalis and occipitalis; not the vascular layer", "'Danger layer' with emissary veins; spreads infection but not the main arteries", "Periosteum of the skull; not the site of the scalp arteries"], "pearl": "SCALP: Skin, Connective tissue (vessels), Aponeurosis, Loose areolar (danger), Pericranium.", "set": "face"}, {"id": "LH-56", "stem": "During extraction of impacted wisdom teeth, a 22-year-old woman suffers damage to her right inferior alveolar nerve. Which of the following is most likely to result?", "opts": ["Inability to compress the cheek", "Paresthesia of the lower lip", "Weakness in closing the jaw", "Decreased salivary flow", "Reduced taste in the body of the tongue"], "ans": 1, "why": "The inferior alveolar nerve (CN V3) runs in the mandibular canal and ends as the mental nerve, which supplies the skin and mucosa of the lower lip and chin; injury causes lower lip numbness or paresthesia.", "wrong": ["Buccinator is supplied by CN VII", "", "Jaw closers are supplied by other V3 motor branches; the inferior alveolar gives motor only to mylohyoid/anterior digastric", "Salivary secretomotor fibers travel with the chorda tympani/lingual nerve", "Taste from the anterior tongue travels via the lingual nerve/chorda tympani"], "pearl": "Inferior alveolar -> mental n.: lower teeth, lower lip, chin. Lingual n. (nearby) -> tongue sensation/taste.", "set": "face"}, {"id": "G-17", "stem": "A 50-year-old woman complains of pain over her chin and lower lip. A few days later, small vesicles appear over the same area and erupt. She is diagnosed with herpes zoster (shingles). Which nerve most likely contains the virus?", "opts": ["Auriculotemporal", "Buccal", "Lesser petrosal", "Mental", "Infraorbital"], "ans": 3, "why": "Skin of the chin and lower lip is supplied by the mental nerve, the terminal cutaneous branch of the inferior alveolar nerve (V3).", "wrong": ["Supplies temple, TMJ, parotid region and ear skin, not the chin.", "Supplies cheek skin and inner buccal mucosa.", "Carries preganglionic parasympathetics to the otic ganglion; not a cutaneous sensory nerve.", "", "Branch of V2 supplying the upper lip, lower eyelid and side of nose."], "pearl": "Chin + lower lip = mental nerve (V3, via inferior alveolar n. exiting the mental foramen).", "set": "face"}, {"id": "G-74", "stem": "A 59-year-old man has acute pain in his mandible. MRI reveals acute arthritic inflammation of the temporomandibular joint. Which muscle will most likely be affected by the inflammatory process in this joint?", "opts": ["Temporalis", "Medial pterygoid", "Masseter", "Lateral pterygoid", "Buccinator"], "ans": 3, "why": "Part of the lateral pterygoid inserts into the TMJ capsule and articular disc, so joint inflammation directly involves it.", "wrong": ["Inserts on the coronoid process; elevates/retracts the jaw.", "Inserts on the medial angle of the mandible; elevates the jaw.", "Inserts on the lateral ramus/angle; elevates the jaw.", "", "Facial muscle of the cheek; unrelated to the TMJ."], "pearl": "Lateral pterygoid (superior head) attaches to the TMJ disc; it is the main protractor/depressor (opens mouth).", "set": "face"}, {"id": "LH-38", "stem": "After facial injuries in an automobile accident, a 17-year-old girl is unable to close her lips together tightly. Which of the following muscles is paralyzed?", "opts": ["Zygomaticus major", "Buccinator", "Levator labii superioris", "Orbicularis oris", "Mentalis"], "ans": 3, "why": "The orbicularis oris is the sphincter encircling the mouth; it closes and purses the lips. Its paralysis (CN VII buccal/mandibular branches) prevents tight lip closure.", "wrong": ["Elevates the corners of the mouth", "Compresses the cheek against the teeth", "Elevates the upper lip", "", "Elevates and protrudes the lower lip and wrinkles the chin"], "pearl": "Orbicularis oris = oral sphincter (CN VII).", "set": "face"}, {"id": "LH-48", "stem": "During surgery, the anesthesiologist at the head of the table periodically checks the patient's pulse by palpating the artery located just anterior to the tragus of the ear. Which artery is being used?", "opts": ["Maxillary", "Posterior auricular", "Superficial temporal", "Facial", "Internal carotid"], "ans": 2, "why": "The superficial temporal artery, a terminal branch of the external carotid, ascends anterior to the tragus over the zygomatic root, where its pulse is easily felt.", "wrong": ["Runs deep to the mandibular neck in the infratemporal fossa; not palpable", "Runs behind the ear", "", "Palpated at the inferior border of the mandible", "Runs deep in the neck and skull base; not palpable anterior to the ear"], "pearl": "Pulse in front of the tragus = superficial temporal a.", "set": "face"}, {"id": "G-214", "stem": "A neonate has bilateral swellings on both sides of the head. The swellings do not cross suture lines, transillumination of the skull is normal, and the neurologic exam is normal. What is most likely responsible?", "opts": ["Intracranial bleeding", "Blockage of the interventricular foramen", "Failure of cleavage of the prosencephalon", "Collection of blood beneath the periosteum of the bone", "Collection of edema fluid above the periosteum of the bone"], "ans": 3, "why": "A cephalohematoma is subperiosteal bleeding; because the pericranium is anchored at the sutures, the swelling is confined to one bone and does not cross suture lines.", "wrong": ["Neurologic exam is normal and swelling is external.", "Would cause hydrocephalus, not scalp swelling.", "Holoprosencephaly; a brain malformation with neurologic findings.", "", "Caput succedaneum; edema crosses suture lines."], "pearl": "Cephalohematoma respects sutures; caput succedaneum and subgaleal hemorrhage cross them.", "set": "face"}, {"id": "G-62", "stem": "A 35-year-old woman's upper airway is obstructed with blood and mucus after a violent car crash, and a midline tracheostomy inferior to the thyroid isthmus is performed. Which vessels are most likely present at the incision site and need to be cauterized?", "opts": ["Middle thyroid vein and inferior thyroid artery", "Inferior thyroid artery and inferior thyroid vein", "Inferior thyroid vein and thyroidea ima artery", "Cricothyroid artery and inferior thyroid vein", "Left brachiocephalic vein and inferior thyroid artery"], "ans": 2, "why": "Below the isthmus in the midline lie the inferior thyroid veins (descending to the left brachiocephalic vein) and, when present, the thyroidea ima artery.", "wrong": ["Middle thyroid vein drains laterally to the IJV; inferior thyroid artery approaches laterally.", "Inferior thyroid artery reaches the gland laterally from the thyrocervical trunk.", "", "Cricothyroid artery lies above the isthmus, at the cricothyroid membrane.", "Brachiocephalic vein is lower; inferior thyroid artery is lateral."], "pearl": "Low tracheostomy hazards: inferior thyroid veins, thyroidea ima a. (~10%), left brachiocephalic v. in children.", "set": "neck"}, {"id": "G-228", "stem": "After thyroidectomy, a 29-year-old woman develops a neck hematoma. Examination shows partial ptosis and pupillary constriction on the side of the hematoma. The hematoma is most likely compressing which ganglion?", "opts": ["Submandibular", "Trigeminal", "Superior cervical", "Geniculate", "Ciliary"], "ans": 2, "why": "The superior cervical ganglion, posterior to the carotid sheath, supplies sympathetics to the head, including the dilator pupillae and superior tarsal muscle; compression gives Horner syndrome (partial ptosis, miosis).", "wrong": ["Parasympathetic ganglion for the submandibular and sublingual glands.", "Sensory ganglion for the face; no pupil or lid effect.", "", "Sensory (taste) ganglion of CN VII.", "Parasympathetic; its loss would dilate, not constrict, the pupil."], "pearl": "Horner: partial ptosis (superior tarsal), miosis, anhidrosis -> sympathetic chain/superior cervical ganglion.", "set": "neck"}, {"id": "LC-32", "stem": "A first-year medical student accidentally walks into the wrong locker room, is shocked and embarrassed, and runs away with his heart pounding. In this agitated state, which ganglion is showing an extremely high rate of activity?", "opts": ["Ciliary ganglion", "Trigeminal ganglion", "Inferior (nodose) vagal ganglion", "Superior cervical ganglion", "Pterygopalatine ganglion"], "ans": 3, "why": "This is a sympathetic fight-or-flight response. The superior cervical ganglion (about C2, top of the sympathetic chain) holds the postganglionic sympathetic cell bodies for the head, so it is the sympathetic ganglion listed.", "wrong": ["Parasympathetic ganglion for the eye.", "Sensory ganglion of CN V.", "Visceral sensory ganglion of CN X.", "", "Parasympathetic ganglion for lacrimal and nasal glands."], "pearl": "SCG (≈C2) = all postganglionic sympathetics to the head.", "set": "neck"}, {"id": "G-203", "stem": "Hikers discover the body of a man in his 20s. Postmortem examination shows no penetrating wounds. A radiograph shows a fractured hyoid bone, with the calvaria and other bones intact. What is the most likely cause of death?", "opts": ["Myocardial infarction (heart attack)", "A fall from a height that resulted in fatal internal bleeding", "Subdural hematoma", "Strangulation", "Ingestion of a poisonous substance"], "ans": 3, "why": "The hyoid is protected and rarely broken except by direct compression of the neck; an isolated hyoid fracture strongly suggests strangulation.", "wrong": ["Would not fracture the hyoid.", "A fatal fall would usually fracture other bones as well.", "Usually from head trauma, often with skull fractures; doesn't explain hyoid fracture.", "", "Would not cause a hyoid fracture."], "pearl": "Fractured hyoid bone = strangulation until proven otherwise.", "set": "neck"}, {"id": "LH-24", "stem": "A 36-year-old woman has palpitations, weight loss, anxiety, insomnia, fatigue, and amenorrhea. The physician palpates a 1.5-cm neck mass that elevates on swallowing, located inferior to the cricoid cartilage and off the midline. What is the most likely structure involved?", "opts": ["Enlarged deep cervical lymph node", "Thyroid nodule", "Benign parathyroid adenoma", "Thyroglossal duct cyst", "Branchial cyst"], "ans": 1, "why": "The thyroid lobes lie lateral to the trachea below the cricoid and move with swallowing because they are enclosed in pretracheal fascia. A hyperfunctioning nodule explains the hyperthyroid symptoms.", "wrong": ["Lies along the IJV in the carotid sheath and would not cause hyperthyroidism", "", "Would cause hypercalcemia symptoms, not hyperthyroidism", "Midline, usually at the hyoid level, and moves with tongue protrusion", "Lateral neck mass at the anterior SCM border; does not cause hyperthyroidism"], "pearl": "Neck mass that moves with swallowing = thyroid (invested by pretracheal fascia).", "set": "neck"}, {"id": "G-65", "stem": "A 55-year-old woman with severe hypertension and 90% occlusion of both common carotid arteries undergoes carotid endarterectomy. Postoperatively, her tongue deviates to the right when protruded. Which nerve was most likely injured?", "opts": ["Right glossopharyngeal", "Right hypoglossal", "Left hypoglossal", "Left lingual", "Left vagus"], "ans": 1, "why": "CN XII crosses the carotid bifurcation and is at risk in endarterectomy; with a right lesion the unopposed left genioglossus pushes the tongue toward the right.", "wrong": ["Lesion causes loss of posterior-tongue taste and gag, not deviation.", "", "Would deviate the tongue to the left.", "Sensory/taste nerve; no motor role in protrusion.", "Lesion affects palate and larynx, not tongue protrusion."], "pearl": "Tongue points TOWARD the side of the CN XII lesion ('lick your wounds'); CN XII crosses ICA/ECA near the bifurcation.", "set": "neck"}, {"id": "G-68", "stem": "During removal of a benign thyroid tumor, the superior thyroid artery is identified and used as a landmark to avoid damaging its small companion nerve. Which nerve most likely accompanies the superior thyroid artery?", "opts": ["Cervical sympathetic trunk", "External branch of the superior laryngeal", "Inferior root of the ansa cervicalis", "Internal branch of the superior laryngeal", "Recurrent laryngeal"], "ans": 1, "why": "The external laryngeal nerve descends alongside the superior thyroid artery to reach cricothyroid, so ligation of the artery near the upper pole risks it.", "wrong": ["Lies posterolateral, behind the carotid sheath.", "", "Lies more superficially on the carotid sheath.", "Runs above the artery and pierces the thyrohyoid membrane with the superior laryngeal artery.", "Runs with the inferior thyroid artery near the lower pole."], "pearl": "Superior thyroid a. ↔ external laryngeal n.; inferior thyroid a. ↔ recurrent laryngeal n.; superior laryngeal a. ↔ internal laryngeal n.", "set": "neck"}, {"id": "G-140", "stem": "A 45-year-old construction worker falls onto a nail, which pierces the skin over the submental triangle just lateral to the midline. Which muscle would the nail pass through last?", "opts": ["Platysma", "Mylohyoid", "Anterior belly of the digastric", "Geniohyoid", "Genioglossus"], "ans": 4, "why": "Going upward from the skin, the layers are platysma, anterior digastric, mylohyoid, geniohyoid and then genioglossus, the deepest.", "wrong": ["The most superficial muscle, pierced first.", "The third layer, forming the floor of the mouth.", "The second layer, just deep to the platysma.", "The fourth layer, lying just above the mylohyoid.", ""], "pearl": "Submental layers from below: platysma -> anterior digastric -> mylohyoid -> geniohyoid -> genioglossus.", "set": "neck"}, {"id": "G-116", "stem": "A 59-year-old painter falls from scaffolding and arrives unconscious. During an emergency tracheostomy, brisk arterial bleeding suddenly comes from the midline incision over the trachea. Which vessel was most likely cut?", "opts": ["Inferior thyroid branch of thyrocervical trunk", "Cricothyroid branch of the superior thyroid artery", "Thyroidea ima artery", "Middle thyroid vein", "Jugular arch connecting the anterior jugular veins"], "ans": 2, "why": "The thyroidea ima artery, present in about 10% of people, rises in the midline on the front of the trachea, so a midline tracheostomy can cut it.", "wrong": ["Approaches the thyroid from the side, not in the midline in front of the trachea.", "Crosses the cricothyroid ligament, above a tracheostomy site.", "", "A vein, so bleeding would not be arterial.", "A vein, so bleeding would not be arterial."], "pearl": "Thyroidea ima (from the brachiocephalic trunk or aortic arch) is a midline trap during tracheostomy.", "set": "neck"}, {"id": "LH-68", "stem": "The external laryngeal nerve of a 23-year-old man becomes compressed by a tortuous superior thyroid artery, which parallels the nerve's course. Which of the following functions is most likely to be affected?", "opts": ["Sensation above the true vocal fold", "Sensation below the true vocal fold", "Abduction of the vocal cord", "Tension of the vocal cord", "Depression of the hyoid bone"], "ans": 3, "why": "The external branch of the superior laryngeal nerve runs with the superior thyroid artery and supplies the cricothyroid muscle, which tilts the thyroid cartilage to tense the vocal cords (pitch).", "wrong": ["Carried by the internal laryngeal nerve", "Carried by the recurrent laryngeal nerve", "Posterior cricoarytenoid, supplied by the recurrent laryngeal nerve", "", "Infrahyoid muscles are supplied by the ansa cervicalis"], "pearl": "External laryngeal n. -> cricothyroid (tenses cords, high pitch); at risk when ligating the superior thyroid a.", "set": "larynx"}, {"id": "G-67", "stem": "A 38-year-old man undergoes partial thyroidectomy for a benign tumor. Twenty-four hours later he cannot abduct his true vocal cords because of a nerve injury during the operation. Which muscle was most likely denervated?", "opts": ["Posterior cricoarytenoid", "Lateral cricoarytenoid", "Thyroarytenoid", "Arytenoid", "Cricothyroid"], "ans": 0, "why": "The posterior cricoarytenoid is the only abductor of the vocal folds, so inability to abduct reflects its denervation (via the recurrent laryngeal nerve).", "wrong": ["", "Adducts the vocal folds.", "Adducts and relaxes the vocal folds.", "Adducts by approximating the arytenoids.", "Tenses the vocal folds (supplied by external laryngeal n.)."], "pearl": "Bilateral RLN injury → both PCAs paralyzed → cords stuck near midline → stridor/airway emergency.", "set": "larynx"}, {"id": "G-113", "stem": "After a thyroidectomy, a 32-year-old woman has lost sensation inside the larynx from the vocal folds up to the laryngeal inlet, and liquids enter her airway. Which nerve is most likely injured?", "opts": ["Internal laryngeal nerve", "External laryngeal nerve", "Glossopharyngeal nerve", "Hypoglossal nerve", "Recurrent laryngeal nerve"], "ans": 0, "why": "The internal laryngeal nerve supplies the laryngeal mucosa above the vocal folds. Losing it removes the cough reflex that protects against aspiration.", "wrong": ["", "Motor to the cricothyroid; injury weakens the voice without sensory loss.", "Injury would cause wider pharyngeal and posterior tongue sensory loss.", "Motor to the tongue only.", "Supplies sensation below the vocal folds and most of the laryngeal muscles."], "pearl": "Internal laryngeal injury -> loss of supraglottic sensation -> aspiration.", "set": "larynx"}, {"id": "G-56", "stem": "A 35-year-old woman is under general anesthesia. Before laryngeal intubation, the rima glottidis is opened by which pair of muscles?", "opts": ["Posterior cricoarytenoids", "Lateral cricoarytenoids", "Thyroarytenoids", "Transverse arytenoids", "Cricothyroids"], "ans": 0, "why": "The posterior cricoarytenoids rotate the arytenoids laterally, abducting the vocal processes and opening the rima glottidis.", "wrong": ["", "Adduct the vo
