<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HNSS Anatomy Final Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Extra+Condensed:wght@500;700;800&display=swap">
<style>
:root{
  --ground:#EEF3F0; --panel:#FFFFFF; --sunk:#E2EAE6; --line:#C9D6D0;
  --ink:#13201D; --muted:#566963;
  --accent:#1F5C4A; --accent-soft:#DDEFE7; --accent-ink:#14463789;
  --gold:#E3AE12; --gold-ink:#7A5B00; --gold-soft:#FBF1CF;
  --ok:#1F7A52; --ok-soft:#DDF0E5; --ok-line:#4FA37C;
  --bad:#A8333C; --bad-soft:#F8E8E9; --bad-line:#CF5A63;
  --flag:#8C5A00; --flag-soft:#FBEFD6;
  --shadow:0 1px 2px rgba(19,32,29,.05),0 8px 24px -16px rgba(19,32,29,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#111715; --panel:#19211E; --sunk:#222C28; --line:#2E3B36;
  --ink:#E6EDE9; --muted:#8FA099;
  --accent:#5FBF9B; --accent-soft:#162B24; --accent-ink:#7FD3B4;
  --gold:#F2C230; --gold-ink:#F5CD4E; --gold-soft:#2E2A14;
  --ok:#5CC394; --ok-soft:#162B23; --ok-line:#3D8A68;
  --bad:#E2727A; --bad-soft:#2E1A1D; --bad-line:#A04A52;
  --flag:#E0B255; --flag-soft:#2D2413;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px -16px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --ground:#111715; --panel:#19211E; --sunk:#222C28; --line:#2E3B36;
  --ink:#E6EDE9; --muted:#8FA099;
  --accent:#5FBF9B; --accent-soft:#162B24; --accent-ink:#7FD3B4;
  --gold:#F2C230; --gold-ink:#F5CD4E; --gold-soft:#2E2A14;
  --ok:#5CC394; --ok-soft:#162B23; --ok-line:#3D8A68;
  --bad:#E2727A; --bad-soft:#2E1A1D; --bad-line:#A04A52;
  --flag:#E0B255; --flag-soft:#2D2413;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px -16px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding-inline:18px;padding-block:0 60px}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
a{color:var(--accent)}

.mast{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:baseline;justify-content:space-between;padding-block:20px 12px;border-bottom:2px solid var(--ink);margin-bottom:22px}
.brand{font-family:"Saira Extra Condensed",sans-serif;font-size:27px;font-weight:800;letter-spacing:.01em;text-transform:uppercase}
.brand b{color:var(--gold-ink)}
.tag{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

h1{font-family:"Saira Extra Condensed",sans-serif;font-size:clamp(40px,9vw,66px);line-height:.94;font-weight:800;text-transform:uppercase;margin:0 0 4px}
h1 span{display:block;color:var(--accent)}
.lede{font-size:1.02rem;color:var(--muted);max-width:60ch;margin:10px 0 0}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:24px 0}
.facts div{background:var(--panel);padding:13px 14px}
.facts .n{font-family:"IBM Plex Mono",monospace;font-size:1.45rem;font-weight:600;color:var(--accent);display:block;line-height:1.1}
.facts .l{font-size:11.5px;color:var(--muted);display:block;margin-top:4px;line-height:1.35}

.fl{margin:20px 0}
.lab{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;flex-wrap:wrap}
.seg button{font:inherit;font-size:13.5px;background:var(--panel);color:var(--ink);border:0;border-right:1px solid var(--line);padding:9px 16px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"],
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0C1512}}
.hint{font-size:12.8px;color:var(--muted);margin:8px 0 0}

.go{font:inherit;font-size:15px;font-weight:600;background:var(--accent);color:#fff;border:0;padding:13px 28px;border-radius:3px;cursor:pointer;margin-top:8px}
.go:hover{filter:brightness(1.08)}
.btn{font:inherit;font-size:13.8px;background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:9px 16px;border-radius:3px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.warn{border-color:var(--bad-line);color:var(--bad)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* exam bar */
#bar{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--line);padding-block:10px 0;margin-bottom:18px}
.barrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.barrow .spacer{flex:1}
.stat{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
.stat b{color:var(--ink);font-size:15px;font-weight:600}
#clock{font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:600;letter-spacing:.02em}
#clock.low{color:var(--bad)}
.prog{height:3px;background:var(--sunk);margin-top:9px}
.prog i{display:block;height:100%;background:var(--accent);width:0}

.qcard{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:22px 22px 18px;box-shadow:var(--shadow)}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:13px}
.chip{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);padding:3px 8px;border-radius:2px}
.chip.ord{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.stem{font-size:1.06rem;line-height:1.55;margin:0 0 17px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;background:var(--ground);border:1px solid var(--line);border-radius:3px;padding:11px 13px;cursor:pointer;text-align:left;width:100%;font:inherit;font-size:14.7px;line-height:1.45;color:inherit}
.opt:hover{border-color:var(--accent)}
.opt .k{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:2px;width:22px;height:22px;display:grid;place-items:center;margin-top:1px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .k{border-color:var(--accent);color:var(--accent);font-weight:700}
.opt.ok{border-color:var(--ok-line);background:var(--ok-soft)}
.opt.ok .k{border-color:var(--ok-line);color:var(--ok);font-weight:700}
.opt.no{border-color:var(--bad-line);background:var(--bad-soft)}
.opt.no .k{border-color:var(--bad-line);color:var(--bad);font-weight:700}
.opt[disabled]{cursor:default}
.opt[disabled]:hover{border-color:var(--line)}
.opt.ok[disabled]:hover{border-color:var(--ok-line)}
.opt.no[disabled]:hover{border-color:var(--bad-line)}
.opt .onote{display:block;font-style:normal;color:var(--muted);font-size:12.9px;line-height:1.45;margin-top:5px}
.opt.ok .onote{color:var(--ok)}
.vchip{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;padding:3px 8px;border-radius:2px}
.vchip.y{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-line)}
.vchip.n{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad-line)}
.score{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
.score b{color:var(--ink);font-size:13px}
.nav{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap;align-items:center}
.nav .spacer{flex:1}
.flagbtn[aria-pressed="true"]{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}

/* navigator */
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:14px}
.cell{font-family:"IBM Plex Mono",monospace;font-size:12px;padding:7px 0;border:1px solid var(--line);background:var(--panel);border-radius:2px;cursor:pointer;color:var(--muted)}
.cell.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.cell.flag{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border:1px solid var(--line);border-radius:2px;display:inline-block}
.sw.d{background:var(--accent-soft);border-color:var(--accent)}
.sw.f{background:var(--flag-soft);border-color:var(--flag)}

details.navwrap{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:13px 16px;margin-top:16px}
details.navwrap summary{cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* results */
.hero{text-align:center;padding:30px 16px 24px;border-bottom:1px solid var(--line)}
.hero .pct{font-family:"IBM Plex Mono",monospace;font-size:clamp(3.4rem,17vw,5.4rem);font-weight:600;line-height:1;color:var(--accent)}
.hero .sub{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.hero .verdict{font-family:"Saira Extra Condensed",sans-serif;font-size:1.7rem;text-transform:uppercase;margin-top:14px;line-height:1.1}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:18px 0}
.rgrid div{background:var(--panel);padding:12px 10px;text-align:center}
.rgrid .v{font-family:"IBM Plex Mono",monospace;font-size:1.4rem;font-weight:600}
.rgrid .k{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-top:3px}
h2.sec{font-family:"Saira Extra Condensed",sans-serif;font-size:1.9rem;text-transform:uppercase;margin:30px 0 10px;border-top:2px solid var(--ink);padding-top:10px}
.tbar{display:grid;grid-template-columns:1fr 130px 54px;gap:11px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.tbar .track{height:8px;background:var(--sunk);border-radius:1px;overflow:hidden}
.tbar .track i{display:block;height:100%;background:var(--ok)}
.tbar .track i.mid{background:var(--gold)} .tbar .track i.low{background:var(--bad)}
.tbar .pc{font-family:"IBM Plex Mono",monospace;font-size:12.5px;text-align:right;color:var(--muted)}
@media(max-width:520px){.tbar{grid-template-columns:1fr 70px 46px;gap:8px;font-size:13.2px}}

.rev{border:1px solid var(--line);background:var(--panel);border-radius:4px;margin-bottom:10px;overflow:hidden}
.rev summary{cursor:pointer;padding:12px 15px;display:grid;grid-template-columns:30px 1fr auto;gap:11px;align-items:start;font-size:14.4px;line-height:1.45}
.rev summary::-webkit-details-marker{display:none}
.rev .num{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted)}
.rev .mark{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:2px;white-space:nowrap}
.rev.right .mark{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-line)}
.rev.wrong .mark{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad-line)}
.rev.skip .mark{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.revbody{padding:0 15px 15px;border-top:1px solid var(--line);margin-top:2px}
.revbody ol{list-style:none;padding:0;margin:13px 0 0;counter-reset:o}
.revbody li{counter-increment:o;position:relative;padding:8px 10px 8px 34px;border:1px solid var(--line);border-radius:3px;margin-bottom:6px;font-size:14px;line-height:1.45;background:var(--ground)}
.revbody li::before{content:counter(o,upper-alpha);position:absolute;left:11px;top:8px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted)}
.revbody li.c{border-color:var(--ok-line);background:var(--ok-soft)}
.revbody li.y{border-color:var(--bad-line);background:var(--bad-soft)}
.revbody li em{display:block;font-style:normal;color:var(--muted);font-size:13px;margin-top:4px}
.revbody li.c em{color:var(--ok)}
.why{margin-top:13px;padding:12px 14px;background:var(--ground);border-left:3px solid var(--accent);border-radius:2px;font-size:14.2px;line-height:1.5}
.pearl{margin-top:9px;padding:11px 14px;background:var(--gold-soft);border:1px solid var(--gold);border-left-width:3px;border-radius:2px;font-size:13.8px;color:var(--gold-ink);line-height:1.5}
.pearl b{font-weight:600}

.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>

<script>
const SETS = {
  LOC: "Localize, then Predict",
  SRG: "Surgical & Procedural Consequences",
  AUT: "Autonomic Pathways in Depth",
  DSC: "Discriminate the Lesion",
  INT: "Integrated Vignettes",
  REL: "Structure & Relationship Reasoning"
};
const Q = [{"id": "E1","set": "LOC","ord": 3,"stem": "A patient has paralysis of styloglossus. Applying the same logic used to localize that deficit, which ADDITIONAL finding would you expect if the causative lesion sat at the opening through which that nerve leaves the skull?","opts": ["Loss of bitter taste over the posterior third of the tongue","Weakness of shoulder shrug with winging of the scapula","Ipsilateral tongue wasting with deviation toward the weak side","Absent gag reflex with reduced elevation of the palate","Contralateral tongue wasting with deviation away from the lesion"],"ans": 2,"why": "Styloglossus is CN XII, which leaves through the hypoglossal canal. That canal transmits CN XII alone, so a lesion there produces only hypoglossal findings: ipsilateral wasting, fasciculation and deviation of the protruded tongue toward the lesion.","wrong": ["Posterior third taste is CN IX, which leaves by the jugular foramen.","Shoulder elevation is CN XI, which also leaves by the jugular foramen.","","The gag reflex needs CN IX and CN X, both at the jugular foramen.","Wasting follows the injured nerve and so is ipsilateral, and the protruded tongue deviates toward the weak side, not away from it."],"pearl": "The hypoglossal canal is a solo act. If other lower cranial nerves are involved, the lesion has moved to the jugular foramen or beyond."},{"id": "E2","set": "LOC","ord": 3,"stem": "A man cannot shrug one shoulder and cannot turn his head to the opposite side. He also has dysphagia and an absent gag. Which single additional finding would move your localization OUT of the jugular foramen?","opts": ["Hoarseness with one vocal fold immobile on laryngoscopy","Wasting of the tongue with deviation on protrusion","Loss of bitter taste over the posterior third of the tongue","Palatal droop with the uvula deviating to one side","Reduced sensation over the posterior pharyngeal wall"],"ans": 1,"why": "CN IX, X and XI all leave through the jugular foramen and explain every finding listed except tongue deviation. CN XII uses the hypoglossal canal, so adding it means the lesion is larger than the foramen and has reached the retroparotid space - the Collet-Sicard pattern.","wrong": ["Hoarseness is CN X, still within the jugular foramen.","","Posterior third taste is CN IX, also at the jugular foramen.","Palatal elevation is CN X, also at the jugular foramen.","Pharyngeal sensation is CN IX, also at the jugular foramen."],"pearl": "Vernet is IX, X and XI at the jugular foramen. Adding the tongue (CN XII) makes it Collet-Sicard; adding Horner syndrome on top of that makes it Villaret."},{"id": "E3","set": "LOC","ord": 3,"stem": "A patient has a complete ophthalmoplegia with a fixed dilated pupil, partial ptosis, loss of corneal sensation and numbness over the cheek and upper lip, but normal sensation over the chin and normal jaw strength. Where is the lesion, and which finding tells you it is NOT at the superior orbital fissure?","opts": ["Orbital apex; the preserved V3 sensation over the chin","Cavernous sinus; the V2 sensory loss over the cheek","Superior orbital fissure; the fixed dilated pupil","Foramen ovale; the complete external ophthalmoplegia","Optic canal; the partial ptosis of the upper lid"],"ans": 1,"why": "III, IV, V1 and VI all pass the superior orbital fissure, so that site explains the eye findings and corneal loss. Only V2 separates the two sites: it runs in the cavernous sinus wall but leaves through the foramen rotundum, never entering the fissure.","wrong": ["An orbital apex lesion would take CN II and would still spare V2.","","The fissure transmits no V2, so it cannot explain mid-face loss.","The foramen ovale transmits V3, which is spared in this patient.","The optic canal transmits CN II, which carries no motor fibres."],"pearl": "V2 is the discriminator between cavernous sinus and superior orbital fissure. V3 sparing tells you it is not the trigeminal ganglion."},{"id": "E4","set": "LOC","ord": 3,"stem": "A patient has facial weakness including the forehead, hyperacusis and loss of taste on the anterior tongue, but tearing is normal. If a second lesion were placed just proximal to the first, which finding would be ADDED?","opts": ["Loss of reflex tearing from the lacrimal gland","Loss of sensation over the cheek on that side","Loss of salivation from the submandibular gland","Loss of the corneal blink afferent on that side","Loss of power in the masseter on that side"],"ans": 0,"why": "Branch order along CN VII is greater petrosal, then nerve to stapedius, then chorda tympani, then the motor branches. Intact tearing places the lesion below the greater petrosal; moving proximal to it adds loss of lacrimation.","wrong": ["","Cheek sensation is V2 and is never carried by CN VII.","Submandibular secretion rides with the chorda tympani, which the taste loss shows is already out, so it is not added.","The corneal reflex afferent limb is carried by V1.","The masseter is supplied by V3 through the foramen ovale."],"pearl": "Read a facial palsy by what is SPARED. Tears, then hearing comfort, then taste, then the face — in that order from proximal to distal."},{"id": "E5","set": "LOC","ord": 2,"stem": "Paralysis of the muscle that retracts the tongue would localize to which opening?","opts": ["Foramen ovale in the greater sphenoid wing","Jugular foramen behind the carotid canal","Hypoglossal canal above the occipital condyle","Stylomastoid foramen behind the styloid process","Internal acoustic meatus in the petrous temporal"],"ans": 2,"why": "Styloglossus retracts the tongue and is supplied by CN XII, which exits through the hypoglossal canal.","wrong": ["The foramen ovale transmits V3 to the muscles of mastication.","The jugular foramen transmits CN IX, X and XI, not CN XII.","","The stylomastoid foramen transmits CN VII to the facial muscles.","The internal acoustic meatus transmits CN VII and CN VIII."],"pearl": "Protrusion is genioglossus, depression is hyoglossus, retraction is styloglossus, elevation is palatoglossus — and only the last is CN X."},{"id": "E6","set": "LOC","ord": 3,"stem": "A patient cannot abduct one eye. Over the next weeks she develops facial weakness on the same side and reduced hearing. Which single site accounts for all three?","opts": ["Cavernous sinus along the carotid groove","Superior orbital fissure at the orbital apex","Internal acoustic meatus in the petrous bone","Cerebellopontine angle beside the pons","Jugular foramen below the petrous apex"],"ans": 3,"why": "CN VI arises at the pons and CN VII and VIII enter the internal acoustic meatus nearby. A lesion at the cerebellopontine angle can catch all three; no bony foramen transmits VI together with VII and VIII.","wrong": ["The cavernous sinus carries CN VI but neither CN VII nor CN VIII.","The fissure carries CN VI but neither CN VII nor CN VIII.","The meatus carries CN VII and CN VIII but never CN VI.","","The jugular foramen carries CN IX, X and XI, none of them here."],"pearl": "When the deficits cross foramina, think of the brainstem or the cistern rather than a bony opening."},{"id": "E7","set": "LOC","ord": 3,"stem": "A patient's uvula deviates to the left and the gag reflex is absent when either side of the pharynx is touched, but pharyngeal sensation is normal bilaterally. Where is the lesion?","opts": ["Left glossopharyngeal nerve in the jugular foramen","Right glossopharyngeal nerve in the jugular foramen","Left pharyngeal branch of the vagus in the neck","Right pharyngeal branch of the vagus in the neck","Both glossopharyngeal nerves in the jugular foramen"],"ans": 3,"why": "Normal sensation means the afferent limb (CN IX) is intact bilaterally, so the failure is efferent. The gag fails whichever side is touched because it is the response, not the stimulus, that is lost: with one vagus down the pharynx and palate cannot mount a normal bilateral contraction. The uvula deviates away from the lesion, so pointing left means the right vagus is down.","wrong": ["A left CN IX lesion would abolish sensation on the left side.","A right CN IX lesion would abolish sensation on the right side.","A left vagal lesion would push the uvula toward the right side.","","Pharyngeal sensation is normal, so CN IX is intact on both sides."],"pearl": "Test both limbs separately. Intact sensation with an absent gag isolates the efferent CN X, and the uvula then gives you the side."},{"id": "E8","set": "LOC","ord": 3,"stem": "A patient has anaesthesia of the skin over the tip of the nose. Which OTHER territory supplied by the same parent nerve should you test to confirm the level of the lesion?","opts": ["The skin of the upper lip below the nostril","The surface of the cornea at the limbus","The skin over the angle of the mandible","The skin of the lower lip beside the chin","The mucosa of the anterior tongue dorsum"],"ans": 1,"why": "The nasal tip is supplied by the external nasal branch of the anterior ethmoidal nerve, from nasociliary. Nasociliary also gives the long ciliary nerves to the cornea, so corneal sensation tests the same parent nerve.","wrong": ["The upper lip is V2 territory through the infraorbital nerve.","","The mandibular angle is great auricular, from the cervical plexus.","The lower lip is V3 territory through the mental nerve.","The anterior tongue is V3 territory through the lingual nerve."],"pearl": "Nasociliary reaches both nose tip and cornea — the anatomical basis of Hutchinson sign in ophthalmic zoster."},{"id": "E9","set": "LOC","ord": 3,"stem": "A lesion abolishes the afferent limb of the corneal reflex on the right. Which pattern of blinking would you observe?","opts": ["Right cornea touched, neither eye blinks; left cornea touched, both blink","Right cornea touched, only the left blinks; left cornea touched, only the left","Right cornea touched, neither eye blinks; left cornea touched, neither blinks","Right cornea touched, only the right blinks; left cornea touched, both blink","Right cornea touched, only the right blinks; left cornea touched, only the right"],"ans": 0,"why": "The afferent limb is V1. With it gone on the right, stimulating that cornea generates no signal, so neither eye blinks. Stimulating the intact left cornea still drives bilateral CN VII, so both blink.","wrong": ["","This is the pattern of a right CN VII efferent lesion instead.","This needs the afferent limb lost on both sides, not on one.","With the right afferent gone that cornea cannot trigger any blink.","This is the pattern of a left CN VII efferent lesion instead."],"pearl": "Same logic as the pupillary reflex: afferent loss means one eye cannot TRIGGER, efferent loss means one eye cannot RESPOND."},{"id": "E10","set": "LOC","ord": 3,"stem": "A patient has decreased vocal range but a clear voice, normal fold mobility and preserved laryngeal sensation. Which vagal branch is injured, and which artery is its surgical companion?","opts": ["Recurrent laryngeal nerve; inferior thyroid artery","Internal laryngeal nerve; superior laryngeal artery","External laryngeal nerve; superior thyroid artery","Pharyngeal branch of CN X; ascending pharyngeal artery","Auricular branch of CN X; posterior auricular artery"],"ans": 2,"why": "Normal mobility excludes the recurrent laryngeal nerve, and preserved sensation excludes the internal laryngeal nerve. Loss of cricothyroid narrows pitch range, and its nerve runs with the superior thyroid artery at the superior pole.","wrong": ["Recurrent laryngeal injury gives hoarseness with an immobile fold.","Internal laryngeal injury abolishes sensation above the vocal folds.","","The pharyngeal branch gives dysphagia with uvular deviation.","The auricular branch is sensory to the external ear canal."],"pearl": "Three nerves pair with three arteries: internal laryngeal with superior laryngeal, external laryngeal with superior thyroid, recurrent laryngeal with inferior thyroid."},{"id": "E11","set": "LOC","ord": 3,"stem": "A boy has an absent gag reflex on one side and cannot taste bitter at the back of the tongue on that side, but swallowing, phonation and palatal elevation are all normal. Which nerve alone is affected, and which finding confirms the vagus is spared?","opts": ["CN IX; the symmetrical elevation of the palate","CN X; the absent gag on stimulating the pharynx","CN VII; the loss of taste at the back of the tongue","CN XII; the normal swallowing of a water bolus","CN V3; the normal phonation and the clear voice"],"ans": 0,"why": "Afferent gag and posterior-third taste are both CN IX. A symmetrically elevating palate shows the efferent limb, which is CN X, is working.","wrong": ["","A vagal lesion would impair palatal elevation and phonation too.","CN VII carries taste from the anterior two-thirds of the tongue.","CN XII moves the tongue and has no role in the palate or gag.","V3 is motor to mastication and has no role in phonation."],"pearl": "An isolated CN IX lesion removes the afferent gag and posterior taste while leaving the palate and voice untouched."},{"id": "E12","set": "LOC","ord": 2,"stem": "Weakness of the muscle that presses the cheek against the molars during chewing localizes to which nerve?","opts": ["Buccal nerve of V3 crossing the buccinator","Buccal branch of CN VII crossing the masseter","Inferior alveolar nerve in the mandibular canal","Lingual nerve passing beside the third molar","Mandibular nerve trunk below the foramen ovale"],"ans": 1,"why": "Buccinator is a muscle of facial expression despite its chewing role, so its motor supply is the buccal branch of CN VII. The similarly named buccal nerve of V3 is purely sensory to the same region.","wrong": ["The buccal nerve of V3 is purely sensory to the cheek.","","The inferior alveolar nerve supplies the mandibular teeth.","The lingual nerve carries tongue sensation and taste fibres.","The V3 trunk supplies mastication, not facial expression."],"pearl": "Two nerves called 'buccal'. Motor is facial, sensory is trigeminal — this exact pair is used on the released practice set."},{"id": "E13","set": "LOC","ord": 3,"stem": "A patient cannot close the eye on one side and has a dry eye, yet corneal sensation is intact and taste is normal. Which two branches are involved and where does that place the lesion?","opts": ["Greater petrosal and motor branches, placing it at the geniculate ganglion","Chorda tympani and motor branches, placing it at the stylomastoid foramen","Nerve to stapedius and motor branches, placing it in the middle ear cavity","V1 and the facial motor branches, placing it in the cavernous sinus wall","CN VIII and the facial motor branches, placing it in the acoustic meatus"],"ans": 0,"why": "Dry eye puts the greater petrosal out and facial weakness puts the motor fibres out, yet normal taste means the chorda tympani is spared. No single clean transection does that, so this is a selective lesion of the greater petrosal and motor fascicles at the geniculate ganglion with the chorda tympani fibres spared - the only site where those two components can be hit together.","wrong": ["","Normal taste excludes chorda tympani involvement in this lesion.","A middle ear lesion lies distal to the greater petrosal, so it cannot explain the dry eye at all.","Corneal sensation is intact, so V1 is working normally here.","Hearing is unaffected, so CN VIII is not part of the lesion."],"pearl": "Dry eye plus facial weakness with normal taste cannot come from one clean cut. Think branch order and a partial injury, not a single exit point."},{"id": "E14","set": "LOC","ord": 3,"stem": "After a stab wound to the posterior triangle, a patient cannot elevate the arm above the horizontal. Which additional deficit would suggest the blade went deeper, into the carotid sheath?","opts": ["Numbness over the skin of the upper clavicle","Hoarseness with one vocal fold lying immobile","Weakness of head turning against resistance","Numbness over the skin at the mandibular angle","Winging of the scapula on pushing against a wall"],"ans": 1,"why": "Superficial injury takes CN XI and the cutaneous cervical plexus branches. Reaching the carotid sheath adds the vagus, whose recurrent laryngeal branch produces hoarseness.","wrong": ["Supraclavicular nerves are superficial cervical plexus branches.","","Head turning is sternocleidomastoid, also CN XI, already injured at the superficial level.","The great auricular nerve is superficial to the sternocleidomastoid.","The long thoracic nerve lies on the lateral thoracic wall."],"pearl": "CN XI is almost subcutaneous in the posterior triangle. The vagus is deep, inside the sheath — depth is what separates the two injuries."},{"id": "E15","set": "SRG","ord": 3,"stem": "During a submandibular gland excision the surgeon must identify a nerve that loops BENEATH the gland's duct. If that nerve is divided, which three functions are lost?","opts": ["Tongue protrusion, intrinsic tongue muscle action, and midline resting position","Anterior tongue general sensation, anterior tongue taste, and submandibular secretion","Posterior tongue general sensation, posterior tongue taste, and parotid gland secretion","Lower lip sensation, chin skin sensation, and mandibular incisor pulp sensation","Depressor labii movement, mentalis movement, and lower lip symmetry on smiling"],"ans": 1,"why": "The lingual nerve crosses beneath the submandibular duct and carries V3 general sensation, hitchhiking chorda tympani taste fibres, and the parasympathetic fibres running to and from the submandibular ganglion.","wrong": ["Those are the motor functions of CN XII, which does not loop under the duct.","","That trio belongs to CN IX, which never reaches the submandibular duct.","That is the inferior alveolar nerve and its mental branch, inside the mandible.","That is the marginal mandibular branch of CN VII, superficial to the gland."],"pearl": "The lingual nerve is the only nerve carrying three different modalities from two different cranial nerves into one small region."},{"id": "E16","set": "SRG","ord": 3,"stem": "A surgeon ligates a vessel deep to hyoglossus during a tongue resection. Which structure lies on the OPPOSITE side of that muscle and is therefore protected by staying deep?","opts": ["Lingual artery, the chief arterial supply of the tongue","Hypoglossal nerve, the motor supply of the tongue muscles","Glossopharyngeal nerve, the afferent limb of the gag reflex","Inferior alveolar nerve, the sensory supply of the lower teeth","Facial artery, the vessel supplying the tonsil and upper lip"],"ans": 1,"why": "The lingual artery runs medial (deep) to hyoglossus, while CN XII, the lingual nerve and the submandibular duct run lateral (superficial) to it. Staying deep reaches the artery and keeps the nerve out of the field.","wrong": ["That is the vessel being ligated deep to the muscle, not the structure spared.","","CN IX also runs deep to hyoglossus, on the same side as the artery, not on the protected superficial face.","That nerve runs inside the mandibular canal, outside this dissection plane.","It grooves the submandibular gland well lateral to the floor of the mouth."],"pearl": "Nerve outside, artery inside. Hyoglossus is the single landmark that organises the whole floor of the mouth."},{"id": "E17","set": "SRG","ord": 3,"stem": "Two weeks after a total thyroidectomy a patient is hoarse AND has lost her upper singing register. How many nerves were injured, and which?","opts": ["One: the recurrent laryngeal nerve alone, low at the inferior pole","One: the external laryngeal nerve alone, at the superior pole","Two: the recurrent and the external laryngeal, at opposite poles","Two: the recurrent and the internal laryngeal, both inferiorly","Three: the recurrent, internal and external laryngeal nerves"],"ans": 2,"why": "Hoarseness is recurrent laryngeal, injured with the inferior thyroid artery at the inferior pole. Loss of pitch range is external laryngeal, injured with the superior thyroid artery at the superior pole. Two separate injuries at two separate poles.","wrong": ["One recurrent laryngeal injury gives hoarseness but leaves pitch range intact.","An isolated external laryngeal injury narrows pitch range without hoarseness.","","Internal laryngeal injury causes silent aspiration, not loss of pitch range.","Nothing in the presentation points to a supraglottic sensory deficit."],"pearl": "Two deficits that cannot come from one nerve means two injuries. Map each to its artery and its pole."},{"id": "E18","set": "SRG","ord": 3,"stem": "An emergency cricothyroidotomy is performed. Which structure is deliberately NOT cut, and what would happen if the incision were placed a centimetre higher?","opts": ["The cricoid cartilage; a higher incision would divide the thyroid isthmus","The thyroid isthmus; a higher incision would tear the inferior thyroid vein plexus","The vocal folds; a higher incision through thyroid cartilage would divide them","The thyrohyoid membrane; a higher incision would open the piriform recess","The conus elasticus; a higher incision would reach the epiglottic cartilage"],"ans": 2,"why": "The median cricothyroid ligament sits just below the vocal folds. Cutting higher, through the thyroid cartilage, risks the folds themselves and permanent voice change.","wrong": ["The cricoid is indeed spared, but cutting higher moves toward the folds.","The isthmus and those veins are a tracheostomy hazard, lower in the neck.","","That membrane lies above the thyroid cartilage, beyond a cricothyroid window.","Its median part is the very ligament the blade is meant to go through."],"pearl": "Cricothyroidotomy is a narrow window: above the cricoid, below the folds. Tracheostomy avoids the problem by going lower, through rings 2 to 4."},{"id": "E19","set": "SRG","ord": 3,"stem": "During tonsillectomy, brisk bleeding is controlled in the tonsillar bed. Deep cautery there risks a nerve whose injury would produce which combination?","opts": ["Loss of taste from the anterior two-thirds and reduced submandibular flow","Loss of the afferent gag and loss of taste from the posterior third","Hoarseness with a breathy voice and aspiration of thin liquids","Failure of palatal elevation and regurgitation of fluid into the nose","Deviation of the protruded tongue and wasting of one side of it"],"ans": 1,"why": "CN IX lies just deep and lateral to the tonsillar fossa. It carries the gag afferent and posterior-third taste.","wrong": ["That pairing is chorda tympani of CN VII, well away from the tonsillar bed.","","Those are vagal laryngeal branches, deep in the neck below this field.","That is the pharyngeal branch of CN X to the palate and pharynx.","That is CN XII, which passes forward well below the tonsillar fossa."],"pearl": "The tonsillar bed has two hazards: the tonsillar branch of the facial artery for bleeding, CN IX for function."},{"id": "E20","set": "SRG","ord": 3,"stem": "A transnasal pituitary approach passes through a sinus and then the sella. If the dissection strays laterally out of the sella, which structure is at greatest immediate risk, and what would the consequence be?","opts": ["Optic chiasm above the diaphragma sellae; bitemporal hemianopia","Internal carotid artery in the cavernous sinus; torrential haemorrhage","Cribriform plate in the anterior fossa floor; cerebrospinal fluid leak","Maxillary sinus through its medial wall; infraorbital numbness","Foramen ovale in the middle fossa floor; loss of chin sensation"],"ans": 1,"why": "The cavernous sinuses flank the sella and carry the internal carotid arteries. Lateral deviation from the sella enters the sinus and can tear the artery.","wrong": ["The chiasm sits directly above, so superior rather than lateral straying hits it.","","That plate lies anterior and superior, in the roof of the nasal cavity.","That sinus is in the face, encountered long before the sella is reached.","It lies far lateral and inferior, outside any transsellar dissection plane."],"pearl": "Above the sella is the chiasm, either side is the cavernous sinus with the ICA. Direction of error predicts the complication."},{"id": "E21","set": "SRG","ord": 2,"stem": "An inferior alveolar nerve block is placed at the mandibular foramen. Compared with a block at the mental foramen, what ADDITIONAL territory is anaesthetised?","opts": ["General sensation from the anterior two-thirds of the tongue","Pulpal sensation from the mandibular premolars and molars","Sensation from the skin and mucosa of the whole lower lip","Sensation from the skin over the chin and mental region","Sensation from the cheek mucosa and the buccal gingiva"],"ans": 1,"why": "The inferior alveolar nerve gives its dental branches inside the mandible before emerging as the mental nerve. Blocking at the foramen catches the teeth as well as the lip and chin; a mental block catches only lip and chin.","wrong": ["That needs the lingual nerve, a separate branch often caught incidentally.","","The lower lip is anaesthetised by a mental block as well, so it is not extra.","The chin is covered by a mental block too, so nothing is added there.","That territory belongs to the buccal nerve, missed by either injection."],"pearl": "Mandibular foramen = teeth plus lip plus chin. Mental foramen = lip and chin only. The released practice set uses exactly this contrast."},{"id": "E22","set": "SRG","ord": 3,"stem": "A carotid endarterectomy is complicated by injury to a nerve crossing superficial to the carotid arteries. Which deficit results, and how does it differ from injury to the nerve inside the sheath?","opts": ["Tongue deviates to the injured side, whereas the sheath nerve causes hoarseness","Hoarseness with a weak cough, whereas the sheath nerve causes tongue deviation","Shoulder droop with a weak shrug, whereas the sheath nerve causes dysphagia","Loss of the pharyngeal gag, whereas the sheath nerve causes facial weakness","Ptosis with miosis of that eye, whereas the sheath nerve causes anhidrosis"],"ans": 0,"why": "CN XII loops forward across the carotids superficially and supplies the tongue. CN X lies within the sheath and its recurrent branch produces hoarseness.","wrong": ["","This reverses the pair: hoarseness is the nerve inside the sheath, not on it.","CN XI runs posterolateral through the posterior triangle, off the carotids.","CN IX has already left the region above the level of the carotid bifurcation.","Horner syndrome follows the sympathetic trunk lying behind the sheath."],"pearl": "Three layers at the carotid: sympathetics behind, vagus inside, hypoglossal crossing in front."},{"id": "E23","set": "SRG","ord": 3,"stem": "A patient aspirates thin liquids after neck surgery, yet the voice is normal and both folds abduct fully on laryngoscopy. Which nerve was injured, and why is the voice spared?","opts": ["Recurrent laryngeal nerve; its supply to the folds is sensory only","Internal laryngeal nerve; it is purely sensory, so fold movement persists","External laryngeal nerve; it governs pitch and does not weaken fold closure","Pharyngeal branch of vagus; it acts on the palate and not the larynx","Hypoglossal nerve; the tongue moves the bolus but does not phonate"],"ans": 1,"why": "The internal laryngeal nerve supplies sensation above the vocal folds and forms the afferent limb of the cough reflex. Without it, material enters the airway unnoticed, but every laryngeal muscle still works.","wrong": ["It is the motor nerve to all but one laryngeal muscle, so voice would change.","","Loss of cricothyroid narrows the singing range and does not cause aspiration.","Palatal weakness gives nasal regurgitation rather than silent aspiration.","CN XII injury would show as tongue deviation and wasting, not aspiration."],"pearl": "Silent aspiration with a normal voice is a sensory problem. That is the internal laryngeal nerve, and it is easy to miss."},{"id": "E24","set": "SRG","ord": 3,"stem": "During removal of a parotid tumour the surgeon must preserve a nerve passing through the gland. Which statement about that nerve's relationship to the gland is correct?","opts": ["It passes through the gland and carries its secretomotor fibres from CN VII","It passes through the gland but does not innervate it; CN IX does that","It innervates the gland without entering it, running along the capsule","It neither enters nor innervates the gland, which the great auricular supplies","It passes through the gland and supplies it with sympathetic fibres alone"],"ans": 1,"why": "CN VII divides within the parotid into its five terminal branches, but the gland's parasympathetic supply comes from CN IX through the lesser petrosal nerve, the otic ganglion and then the auriculotemporal nerve of V3.","wrong": ["CN VII traverses the gland but sends it no secretomotor fibres at all.","","It does enter, dividing inside the gland into its five terminal branches.","It does enter the gland, and great auricular supplies only overlying skin.","Sympathetics arrive on the arteries, which is not a role of CN VII here."],"pearl": "Passing through is not innervating. The annotated key asks this question directly: does CN VII innervate the parotid?"},{"id": "E25","set": "SRG","ord": 3,"stem": "A dental abscess of a lower second molar spreads below the mylohyoid line. Which space is entered, and what is the immediate threat?","opts": ["Sublingual space; a swelling under the tongue that obstructs the duct","Submandibular space; airway loss as the floor of the mouth is lifted","Parapharyngeal space; erosion into the carotid with sudden haemorrhage","Retropharyngeal space; tracking to the mediastinum over several days","Pterygopalatine fossa; loss of lacrimation and of palatal sensation"],"ans": 1,"why": "Roots projecting below the mylohyoid line discharge into the submandibular space rather than into the mouth. Bilateral involvement lifts the floor of the mouth and the tongue, obstructing the airway.","wrong": ["Roots ending above the mylohyoid line discharge into that space instead.","","Carotid involvement is a late and uncommon sequel, not the first threat.","Posterior spread can happen later but is not what molar roots open into.","That fossa sits high behind the maxilla, far from any mandibular root."],"pearl": "The mylohyoid line is the watershed. Above it drains into the mouth, below it drains into the neck."},{"id": "E26","set": "SRG","ord": 3,"stem": "A laryngoscope blade is seated correctly but the tube passes lateral to the aditus. Which structure has it entered, and which nerve lies just beneath the mucosa there?","opts": ["Vallecula; the lingual branch of the glossopharyngeal nerve","Piriform recess; the internal laryngeal nerve in its floor","Laryngeal ventricle; the recurrent laryngeal nerve below it","Cervical oesophagus; the external laryngeal nerve above it","Nasopharynx; the pharyngeal branch of the vagus nerve there"],"ans": 1,"why": "The piriform recesses flank the laryngeal inlet. The internal laryngeal nerve runs submucosally in the floor of each recess after piercing the thyrohyoid membrane.","wrong": ["The vallecula lies in front of the epiglottis, where the blade tip sits.","","The ventricle is a slit between the folds, inside the inlet rather than lateral.","The oesophagus is posterior and in the midline, not lateral to the aditus.","The nasopharynx lies far above a correctly seated laryngoscope blade."],"pearl": "Piriform recess: where tubes go astray, where fish bones lodge, and where the cough afferent lies exposed."},{"id": "E27","set": "AUT","ord": 3,"stem": "A lesion destroys the pterygopalatine ganglion. Which trigeminal branches lose their hitchhiking parasympathetic fibres, and which gland and mucosa are affected?","opts": ["V3 lingual then its sublingual branches, plus direct glandular twigs; submandibular and sublingual glands","V1 nasociliary then the short ciliary nerves, plus V1 long ciliary twigs; ciliary muscle and sphincter pupillae","V2 zygomatic then V1 lacrimal, plus V2 palatine and nasopalatine; lacrimal gland and nasal and palatine mucosa","V3 auriculotemporal then its temporal twigs, plus V3 buccal branches; parotid gland and buccal mucous glands","V1 nasociliary then V1 lacrimal, plus V1 anterior ethmoidal branches; lacrimal gland and nasal mucosa only"],"ans": 2,"why": "Fibres for the lacrimal gland leave on the zygomatic branch of V2 and cross to the lacrimal nerve of V1. Fibres for the nasal and palatine mucosa leave on the nasopalatine and the greater and lesser palatine nerves, all V2.","wrong": ["That is the submandibular ganglion, whose fibres reach the floor of the mouth on the lingual nerve.","That is the ciliary ganglion, and the long ciliary nerves are sympathetic and sensory rather than parasympathetic.","","That is the otic ganglion, relaying CN IX fibres to the parotid and the buccal glands.","Lacrimal and nasal secretomotor fibres leave the ganglion on V2 branches first, and this route omits the palate."],"pearl": "One ganglion, two outputs. Tears take the V2-to-V1 handoff; nasal mucus stays on V2 throughout."},{"id": "E28","set": "AUT","ord": 3,"stem": "Preganglionic fibres to the otic ganglion arise in which nerve, and if that nerve were cut proximal to its ganglionic branch, which OTHER deficits would appear alongside dry mouth?","opts": ["CN VII; loss of taste from the anterior tongue and weakness of facial muscles","CN IX; loss of the afferent gag and loss of taste from the posterior third","CN V3; weakness of the muscles of mastication and numbness of the chin","CN X; hoarseness from vocal fold paralysis and loss of the palatal reflex","CN III; a dilated unreactive pupil and ptosis of the upper eyelid"],"ans": 1,"why": "The lesser petrosal nerve is a CN IX branch. Cutting CN IX proximally removes parotid secretion together with everything else CN IX carries — the gag afferent, posterior-third taste and general sensation of the oropharynx.","wrong": ["CN VII supplies the lacrimal, submandibular and sublingual glands, not the parotid.","","V3 only delivers the postganglionic fibres on the auriculotemporal nerve and never carries the preganglionics.","CN X has no secretomotor supply to the parotid gland at all.","CN III feeds the ciliary ganglion for the pupil and lens, not any salivary gland."],"pearl": "Cut a nerve proximally and you lose every modality it carries. The otic ganglion question is really a CN IX question."},{"id": "E29","set": "AUT","ord": 3,"stem": "Sympathetic fibres destined for the dilator pupillae pass through which ganglion WITHOUT synapsing, and where do they actually synapse?","opts": ["Ciliary ganglion; they synapse in the superior cervical ganglion","Ciliary ganglion; they synapse in the stellate ganglion at T1","Ciliary ganglion; they relay within the internal carotid plexus","Otic ganglion; they synapse in the superior cervical ganglion","Pterygopalatine ganglion; they synapse in the stellate ganglion"],"ans": 0,"why": "All sympathetic fibres for the head relay in the superior cervical ganglion, then run on the internal carotid plexus and hitch onto trigeminal branches to reach the eye. They traverse both the stellate ganglion below and the ciliary ganglion in the orbit without synapsing in either.","wrong": ["","Preganglionic fibres pass up through the stellate ganglion on their way to the neck but do not relay in it.","The internal carotid plexus is made of fibres that have already relayed, so no synapse occurs within it.","The otic ganglion sits on the parasympathetic route to the parotid, nowhere near the pupillary pathway.","The pterygopalatine ganglion serves the lacrimal gland and nasal mucosa, and no relay happens at T1 either."],"pearl": "Passing through is not synapsing. This is the single most-used trap in autonomic questions."},{"id": "E30","set": "AUT","ord": 3,"stem": "A patient has a dry eye, a dry nose AND a small pupil with mild ptosis on the same side. Which single site could produce all of this?","opts": ["The geniculate ganglion in the facial canal, where the greater petrosal nerve leaves","The internal carotid plexus in the cavernous sinus, running alongside the V1 and V2 fibres","The superior cervical ganglion in the carotid sheath, at the level of the upper cervical vertebrae","The pterygopalatine ganglion in the pterygopalatine fossa, on the roots of the palatine nerves","The ciliary ganglion in the posterior orbit, on the lateral side of the optic nerve"],"ans": 1,"why": "Miosis with partial ptosis means the carotid sympathetics have been lost, and they run as the internal carotid plexus through the cavernous sinus. V1 and V2 lie in the same lateral wall, and reflex tearing and reflex nasal secretion both depend on their afferent limbs, so a single lesion there can dry the eye and the nose as well. Facial sweating is spared because those fibres follow the external carotid.","wrong": ["A lesion there dries the eye and nose but spares the sympathetic supply, so there is no miosis or ptosis.","","A lesion there gives miosis, ptosis and anhidrosis but leaves tear and nasal secretion intact.","A lesion there dries the eye and nose yet has no effect on pupil size or lid position.","A lesion there gives a dilated poorly accommodating pupil rather than a small one."],"pearl": "A reflex fails when its afferent fails. Cavernous sinus loss of V1 and V2 dries the eye and nose, and the carotid plexus running alongside adds the Horner signs."},{"id": "E31","set": "AUT","ord": 3,"stem": "Which single nerve, if cut, would abolish BOTH the efferent limb of the corneal blink reflex and reflex tear production?","opts": ["CN V1 proximal to the lacrimal nerve branch","CN VII proximal to the greater petrosal nerve","CN III proximal to its inferior division","CN V2 proximal to the zygomaticotemporal branch","CN VII distal to the chorda tympani branch"],"ans": 1,"why": "CN VII closes the eye through orbicularis oculi and drives lacrimation through the greater petrosal nerve. Cutting it proximal to that branch removes both efferent functions.","wrong": ["V1 is the afferent limb of both reflexes, not the efferent one.","","CN III elevates the lid and constricts the pupil but neither closes the eye nor makes tears.","V2 carries the lacrimal fibres onward but does not originate them and has no motor role.","That level spares the greater petrosal nerve, so lacrimation survives the lesion."],"pearl": "V1 in for both reflexes, VII out for both. One nerve does the sensing, the other does both responses."},{"id": "E32","set": "AUT","ord": 2,"stem": "Postganglionic parasympathetic fibres to the submandibular and sublingual glands travel on which nerve, and from which cranial nerve did the preganglionic fibres come?","opts": ["Auriculotemporal nerve, from the otic ganglion; CN IX","Lingual nerve, from the submandibular ganglion; CN VII","Lingual nerve, from the submandibular ganglion; CN V3","Palatine nerves, from the pterygopalatine ganglion; CN VII","Chorda tympani, from the geniculate ganglion; CN IX"],"ans": 1,"why": "Preganglionic fibres come from CN VII in the chorda tympani, which joins the lingual nerve. After synapsing in the submandibular ganglion, the postganglionic fibres continue on the lingual nerve.","wrong": ["That is the parotid pathway rather than the floor-of-mouth pathway.","","V3 carries the fibres in its lingual branch but does not originate them; the source is CN VII.","Those fibres serve the palate and nasal mucosa, not the submandibular and sublingual glands.","The chorda tympani is a CN VII branch and is the preganglionic limb, not the postganglionic one."],"pearl": "The lingual nerve is both the road in and the road out for the submandibular ganglion."},{"id": "E33","set": "AUT","ord": 3,"stem": "A patient has anisocoria that is MORE obvious in bright light, with a normal upper lid position and normal sweating. Which limb is affected, and which reflex arc does that implicate?","opts": ["Sympathetic; the dilator pathway from the superior cervical ganglion","Parasympathetic; the CN III efferent limb of the pupillary light reflex","Afferent; the optic nerve input to the pupillary light reflex arc","Afferent; the nasociliary nerve limb of the corneal blink reflex","Sympathetic; the superior tarsal limb of the oculosympathetic chain"],"ans": 1,"why": "Worse in bright light means the affected pupil fails to constrict, so the parasympathetic efferent is at fault. Normal lid and sweating argue against a sympathetic lesion.","wrong": ["Sympathetic failure is worse in dim light and usually adds a degree of ptosis.","","An afferent defect slows the reaction to light but leaves the pupils equal at rest.","The nasociliary nerve is the corneal afferent and has no role in pupil size.","That lesion would give ptosis, which this patient does not have."],"pearl": "Dim light worse means sympathetic. Bright light worse means parasympathetic. The accompanying lid and sweat findings confirm which."},{"id": "E34","set": "AUT","ord": 3,"stem": "Which pathway would be INTERRUPTED by a lesion of the nerve of the pterygoid canal, and which would be preserved?","opts": ["Interrupted: lacrimation and nasal secretion. Preserved: pupil constriction and salivation","Interrupted: submandibular and sublingual salivation. Preserved: lacrimation and nasal secretion","Interrupted: pupil constriction and accommodation. Preserved: lacrimation and salivation","Interrupted: parotid secretion and its vasodilation. Preserved: nasal secretion and lacrimation","Interrupted: lacrimation and pupil constriction. Preserved: nasal and salivary secretion"],"ans": 0,"why": "The nerve of the pterygoid canal carries the greater petrosal (parasympathetic) and deep petrosal (sympathetic) fibres to the pterygopalatine ganglion, serving the lacrimal gland and the nasal and palatine mucosa. The ciliary, otic and submandibular pathways are elsewhere.","wrong": ["","Those glands run on the chorda tympani and submandibular ganglion, which this nerve never touches.","Pupil constriction and accommodation run through the ciliary ganglion, which this nerve never touches.","The parotid runs on the lesser petrosal nerve and otic ganglion, which this nerve never touches.","Lacrimation is indeed lost, but so is nasal secretion, and the pupillary pathway lies outside this nerve."],"pearl": "Greater petrosal plus deep petrosal equals the nerve of the pterygoid canal — parasympathetic and sympathetic travelling together to one ganglion."},{"id": "E35","set": "AUT","ord": 3,"stem": "Which combination correctly pairs a ganglion with BOTH its preganglionic cranial nerve and the trigeminal branch its postganglionic fibres use?","opts": ["Ciliary ganglion; CN III; short ciliary nerves of V1","Otic ganglion; CN VII; auriculotemporal nerve of V3","Pterygopalatine ganglion; CN IX; palatine nerves of V2","Submandibular ganglion; CN IX; lingual nerve of V3","Ciliary ganglion; CN VII; long ciliary nerves of V1"],"ans": 0,"why": "The ciliary ganglion takes preganglionic fibres from CN III and sends postganglionic fibres out in the short ciliary nerves, which are associated with the nasociliary branch of V1.","wrong": ["","The otic ganglion takes its preganglionic fibres from CN IX, not from CN VII.","The pterygopalatine ganglion takes its preganglionic fibres from CN VII, not from CN IX.","The submandibular ganglion takes its preganglionic fibres from CN VII, not from CN IX.","The ciliary ganglion is fed by CN III, and the long ciliary nerves are sympathetic and sensory."],"pearl": "CN III feeds one ganglion, CN IX feeds one, CN VII feeds two. Every output rides a branch of CN V."},{"id": "E36","set": "AUT","ord": 3,"stem": "A tumour in the infratemporal fossa compresses the auriculotemporal nerve where it encircles the middle meningeal artery. Which two deficits result?","opts": ["Dry mouth from loss of parotid secretion, and numbness of the temple and anterior ear","Dry eye from loss of lacrimal secretion, and numbness of the forehead and upper eyelid","Loss of taste from the anterior tongue, and numbness of the chin and the lower lip","Weak jaw closure from masseter paralysis, and numbness of the cheek and upper lip","Dry mouth from loss of sublingual secretion, and numbness of the anterior tongue"],"ans": 0,"why": "The auriculotemporal nerve carries general sensation from the temple, external ear and temporomandibular joint, and delivers the otic ganglion's postganglionic fibres to the parotid.","wrong": ["","Those are the lacrimal nerve of V1 and the pterygopalatine pathway, both outside this fossa route.","Those belong to the chorda tympani and the mental nerve of V3.","Those belong to the motor root of V3 and to the buccal and infraorbital territory.","Those belong to the lingual nerve, which carries the submandibular ganglion's fibres instead."],"pearl": "Auriculotemporal is the one V3 branch carrying parasympathetics, and the roots that encircle the middle meningeal artery are its landmark."},{"id": "E37","set": "AUT","ord": 2,"stem": "Which gland's secretomotor pathway does NOT involve CN VII at any point?","opts": ["The lacrimal gland in the superolateral orbit","The mucous glands of the nasal septum and palate","The submandibular gland in the digastric triangle","The sublingual gland in the floor of the mouth","The parotid gland over the masseter and ramus"],"ans": 4,"why": "The parotid is served by CN IX through the lesser petrosal nerve and the otic ganglion. All the others are CN VII, through either the greater petrosal or the chorda tympani.","wrong": ["That gland is reached by CN VII through the greater petrosal nerve.","Those glands are reached by CN VII through the greater petrosal nerve.","That gland is reached by CN VII through the chorda tympani.","That gland is reached by CN VII through the chorda tympani.",""],"pearl": "Four glands on CN VII, one on CN IX. The parotid is always the odd one out."},{"id": "E38","set": "AUT","ord": 3,"stem": "If the superior cervical ganglion were destroyed on one side, which of the following would remain NORMAL?","opts": ["Pupil dilation in dim ambient light","Sweating over the forehead and face","Resting position of the upper eyelid","Reflex tear production on that side","Vasomotor tone of the facial vessels"],"ans": 3,"why": "Reflex lacrimation is parasympathetic, driven by CN VII through the pterygopalatine ganglion, and is unaffected by sympathetic loss. Everything else listed is sympathetic.","wrong": ["The pupil would sit small and fail to dilate in the dark.","Anhidrosis of that side of the face would follow.","Partial ptosis would follow from superior tarsal muscle paralysis.","","Vasomotor tone of these vessels is sympathetic and would be lost."],"pearl": "Horner syndrome does not cause a dry eye. Sympathetic loss affects pupil, lid and sweat, not tear production."},{"id": "E39","set": "DSC","ord": 3,"stem": "Two patients both have a hoarse voice. Patient A also has loss of sensation in the laryngeal vestibule; patient B has a normal sensory exam but cannot raise pitch. Which nerves are injured in A and B respectively?","opts": ["A: recurrent and external laryngeal. B: recurrent and internal laryngeal","A: internal and external laryngeal. B: recurrent and external laryngeal","A: recurrent and internal laryngeal. B: recurrent and external laryngeal","A: recurrent and internal laryngeal. B: internal and external laryngeal","A: pharyngeal branch and recurrent. B: pharyngeal and external laryngeal"],"ans": 2,"why": "Both are hoarse, so both have recurrent laryngeal injury. A adds sensory loss above the folds, which is internal laryngeal. B adds loss of pitch, which is external laryngeal.","wrong": ["Reverses the second branch: vestibular sensation is internal laryngeal and pitch is external laryngeal.","A superior laryngeal injury weakens the voice but cannot give frank hoarseness with an immobile fold, so patient A must have a recurrent laryngeal injury in the pair.","","Patient B has a normal sensory exam, so the internal laryngeal nerve cannot be part of that pair.","The pharyngeal branch gives palatal weakness and nasal regurgitation rather than either voice finding."],"pearl": "Hoarseness is the constant here. Read the SECOND finding to work out which additional branch went with it."},{"id": "E40","set": "DSC","ord": 3,"stem": "A patient has a facial palsy. Which single finding would tell you it is central (upper motor neuron) rather than peripheral?","opts": ["Voluntary forehead wrinkling is preserved on the affected side","Taste on the anterior tongue is preserved on the affected side","Reflex tearing from that eye is preserved on the affected side","Loudness tolerance in that ear is preserved on the affected side","The blink reflex afferent limb is preserved on the affected side"],"ans": 0,"why": "The forehead receives bilateral cortical input, so an upper motor neuron lesion spares it. Every peripheral CN VII lesion, at any level, involves the forehead.","wrong": ["","Taste survives any facial lesion distal to the chorda tympani, so it separates two peripheral levels.","Tearing survives any lesion distal to the greater petrosal nerve, which is still a peripheral level.","Normal loudness tolerance only places a peripheral lesion distal to the nerve to stapedius.","That afferent limb is V1 and stays intact in central and peripheral facial lesions alike."],"pearl": "Only the forehead separates central from peripheral. Everything else separates one PERIPHERAL level from another."},{"id": "E41","set": "DSC","ord": 3,"stem": "A patient cannot look down when the eye is adducted. A second patient cannot look down when the eye is abducted. Which muscles and nerves are involved?","opts": ["First: inferior rectus, CN III. Second: superior oblique, CN IV","First: superior oblique, CN IV. Second: inferior rectus, CN III","First: inferior oblique, CN III. Second: superior rectus, CN III","First: superior oblique, CN IV. Second: lateral rectus, CN VI","First: inferior rectus, CN III. Second: inferior oblique, CN III"],"ans": 1,"why": "With the eye adducted the obliques become pure vertical movers, so depression is superior oblique (CN IV). With the eye abducted the recti take over, so depression is inferior rectus (CN III).","wrong": ["This reverses them.","","Both of those elevate.","Lateral rectus abducts and does not depress.","Inferior oblique elevates."],"pearl": "Adducted, the obliques do the vertical work. Abducted, the recti do. This is the whole basis of the H-test."},{"id": "E42","set": "DSC","ord": 3,"stem": "A patient has numbness of the lower lip and chin plus weakness of chewing. A second has numbness of the cheek and upper lip with normal chewing. Which foramina are involved?","opts": ["First: the foramen rotundum. Second: the foramen ovale","First: the foramen spinosum. Second: the foramen ovale","First: the orbital fissure. Second: the foramen rotundum","First: the foramen ovale. Second: the foramen rotundum","First: the foramen ovale. Second: the orbital fissure"],"ans": 3,"why": "Motor fibres to the muscles of mastication travel only with V3, through the foramen ovale. A purely sensory mid-face deficit with normal chewing is V2, through the foramen rotundum.","wrong": ["Reverses them: weakness of chewing marks V3 leaving through the foramen ovale.","The foramen spinosum transmits the middle meningeal artery, not a division of the trigeminal nerve.","The orbital fissure carries V1 and no motor fibres to the muscles of mastication.","","The first is right, but the orbital fissure carries V1, which numbs the forehead rather than the cheek."],"pearl": "Presence or absence of motor findings is the fastest way to separate V3 from V2."},{"id": "E43","set": "DSC","ord": 3,"stem": "Two patients have a deviated tongue. In patient A the tongue deviates left and the left side is wasted. In patient B the tongue deviates left with no wasting and there is also left arm weakness. Which lesions are these?","opts": ["A: left CN XII (lower motor neuron). B: right corticobulbar (upper motor neuron)","A: right CN XII (lower motor neuron). B: left corticobulbar (upper motor neuron)","A: left CN XII (lower motor neuron). B: left CN XII (lower motor neuron) as well","A: left corticobulbar (upper motor neuron). B: left CN XII (lower motor neuron)","A: right corticobulbar (upper motor neuron). B: right CN XII (lower motor neuron)"],"ans": 0,"why": "Wasting marks a lower motor neuron lesion of the nerve itself, ipsilateral to the deviation. Deviation without wasting, with limb signs, indicates a contralateral upper motor neuron lesion.","wrong": ["","Reverses both sides: a right hypoglossal lesion deviates the tongue to the right.","Patient B has limb weakness and no wasting, which a peripheral hypoglossal lesion cannot produce.","Reverses the levels, and a left corticobulbar lesion would push the tongue to the right.","Reverses the levels: wasting marks the lower motor neuron lesion, which is patient A."],"pearl": "In both cases the tongue points away from the strong side. Wasting and fasciculation are what mark the peripheral lesion."},{"id": "E44","set": "DSC","ord": 3,"stem": "Two patients have a dilated pupil. In A the pupil is dilated and the eye is down and out with complete ptosis. In B the pupil is dilated with normal eye movements and normal lid position. What distinguishes them?","opts": ["A is confined to the ciliary ganglion or its short ciliary nerves; B is a CN III trunk lesion taking somatic and parasympathetic fibres","A is a CN III trunk lesion taking somatic and parasympathetic fibres; B is confined to the ciliary ganglion or its short ciliary nerves","A is a superior cervical sympathetic trunk lesion with a drooping lid; B is an optic nerve lesion with an afferent pupillary defect","A is a cavernous sinus lesion involving CN III, IV and VI; B is a superior cervical sympathetic trunk lesion with a drooping lid","A is a nuclear midbrain CN III lesion that spares the pupil; B is a lesion of the long ciliary nerves carrying sympathetic fibres"],"ans": 1,"why": "A full CN III palsy takes the somatic motor fibres as well as the parasympathetics, giving ptosis and an abnormal resting position. An isolated pupil abnormality with normal movements places the lesion distal, at the ganglion or its short ciliary nerves.","wrong": ["Reverses them: the ptosis and down-and-out eye in A require the somatic motor fibres to be involved.","","A sympathetic lesion gives a small pupil, and an optic lesion leaves the resting pupil normal in size.","The cavernous sinus is tenable for A, but loss of sympathetics in B would constrict the pupil, not dilate it.","A pupil-sparing lesion cannot explain A's dilated pupil, and losing sympathetics in B would give miosis."],"pearl": "Ask whether the motor fibres went with the pupil. That single question separates a nerve trunk lesion from a ganglion lesion."},{"id": "E45","set": "DSC","ord": 3,"stem": "Which finding would distinguish injury of the pharyngeal branch of CN X from injury of the recurrent laryngeal nerve?","opts": ["Hoarseness with an immobile vocal fold","Uvular deviation with nasal regurgitation","A weak cough with a breathy and quiet voice","Loss of sensation below the vocal folds","Loss of sensation above the vocal folds"],"ans": 1,"why": "The pharyngeal branch supplies the palate and constrictors, so its loss gives uvular deviation, dysphagia and nasal regurgitation. The recurrent laryngeal nerve produces hoarseness and fold immobility instead.","wrong": ["Both halves are recurrent laryngeal findings, so they cannot separate it from the pharyngeal branch.","","A weak cough follows any loss of glottic closure, so either lesion can produce it.","Subglottic sensation is recurrent laryngeal territory, not pharyngeal branch territory.","Sensation above the folds is internal laryngeal territory, which neither lesion involves."],"pearl": "Palate findings mean the pharyngeal branch. Fold findings mean the recurrent laryngeal. Both are CN X, but at different levels."},{"id": "E46","set": "DSC","ord": 3,"stem": "A patient has a dry mouth. Which additional finding would tell you the lesion is in CN VII rather than CN IX?","opts": ["Loss of taste from the posterior third of the tongue","Loss of the afferent limb of the gag reflex on that side","Loss of taste from the anterior two-thirds of the tongue","Loss of sensation over the middle ear mucosal lining","Weakness of stylopharyngeus on attempted swallowing"],"ans": 2,"why": "CN VII supplies the submandibular and sublingual glands and carries taste from the anterior two-thirds. CN IX supplies the parotid and carries posterior-third taste, the gag afferent, middle ear sensation and stylopharyngeus.","wrong": ["Posterior-third taste is carried by the lingual branches of CN IX.","The afferent limb of the gag reflex is carried by CN IX.","","The middle ear lining is supplied by the tympanic branch of CN IX.","Stylopharyngeus is the single muscle supplied by CN IX."],"pearl": "Both cause a dry mouth, but they take different glands and different taste territories. Taste distribution is the discriminator."},{"id": "E47","set": "DSC","ord": 3,"stem": "Which finding would distinguish a lesion at the internal acoustic meatus from one at the stylomastoid foramen?","opts": ["Hyperacusis with loss of taste on that side","Forehead weakness with an incomplete blink","Loss of taste from the posterior third only","Absent gag with deviation of the palate","Numbness of the jaw angle and the ear lobule"],"ans": 0,"why": "Both sites give a complete peripheral facial palsy including the forehead, so no motor finding separates them. Only the lesion at the meatus lies proximal to the nerve to stapedius and the chorda tympani, so only it adds hyperacusis and loss of taste from the anterior two-thirds. Posterior-third taste, the gag reflex and the skin over the jaw angle are not CN VII territory at all.","wrong": ["","Forehead weakness appears with a lesion at either site, since both are peripheral.","Posterior-third taste belongs to CN IX and survives a facial nerve lesion at either site.","The gag reflex runs on CN IX and CN X, so a facial nerve lesion spares it wherever it sits.","That skin is supplied by the great auricular nerve of the cervical plexus, not by CN VII."],"pearl": "When the motor findings match, look for the non-motor CN VII branches. Stapedius and the chorda tympani are what localise a lesion along the facial canal."},{"id": "E48","set": "DSC","ord": 3,"stem": "Two patients have shoulder weakness. In A the trapezius is wasted and head turning to the opposite side is weak. In B the scapula wings and trapezius is normal. Which nerves are involved?","opts": ["A: the long thoracic nerve. B: the accessory nerve (XI)","A: the accessory nerve (XI). B: the long thoracic nerve","A: the accessory nerve (XI). B: the suprascapular nerve","A: the dorsal scapular nerve. B: the accessory nerve (XI)","A: the dorsal scapular nerve. B: the long thoracic nerve"],"ans": 1,"why": "CN XI supplies trapezius and sternocleidomastoid, so its loss weakens shrugging and contralateral head turning. Winging comes from serratus anterior, supplied by the long thoracic nerve.","wrong": ["Reverses them: sternocleidomastoid weakness in A marks the accessory nerve.","","The suprascapular nerve supplies supraspinatus and infraspinatus and does not cause winging.","The dorsal scapular nerve supplies the rhomboids, whose loss does not waste trapezius.","Neither of these explains wasted trapezius with weak turning of the head to the other side."],"pearl": "Sternocleidomastoid involvement is what marks the weakness as CN XI rather than a brachial plexus branch."},{"id": "E49","set": "DSC","ord": 3,"stem": "Which finding would tell you a mid-face sensory loss comes from a lesion at the trigeminal ganglion rather than in the cavernous sinus?","opts": ["Loss of corneal sensation with a reduced blink reflex","Loss of sensation over the chin with weak jaw clenching","Loss of sensation over the upper lip with an intact blink","Ptosis with a dilated pupil and impaired adduction","Diplopia on lateral gaze with intact facial sensation"],"ans": 1,"why": "V3 does not enter the cavernous sinus, so mandibular involvement, especially with motor weakness, places the lesion back at the ganglion where all three divisions lie together.","wrong": ["The corneal afferent is V1, which is involved at the ganglion and in the cavernous sinus alike.","","Upper lip sensation is V2, which also runs through the cavernous sinus.","Those are oculomotor findings and point to the cavernous sinus rather than the ganglion.","Failed abduction with normal sensation points to CN VI within the cavernous sinus."],"pearl": "V3 is the tell. Present means ganglion or more proximal; absent means cavernous sinus or fissure."},{"id": "E50","set": "DSC","ord": 3,"stem": "A patient has an absent corneal reflex on the right. Touching the LEFT cornea produces a blink in the left eye only. Where is the lesion?","opts": ["The right ophthalmic nerve (V1) afferent limb","The right facial nerve (VII) efferent limb","The left ophthalmic nerve (V1) afferent limb","The left facial nerve (VII) efferent limb","The efferent limbs of both facial nerves (VII)"],"ans": 1,"why": "The left cornea is sensed normally and drives a blink, but only on the left. That means the right efferent limb has failed — a right CN VII lesion. The right eye cannot blink regardless of which cornea is touched.","wrong": ["That would stop the right cornea triggering, yet the right eye would still blink consensually.","","The left cornea clearly triggers a blink, so its afferent limb is intact.","The left eye blinks normally, so its efferent limb is working.","The left eye blinks, so at least the left efferent limb is intact."],"pearl": "Work out which eye fails to RESPOND versus which cornea fails to TRIGGER. Response failure is CN VII; trigger failure is V1."},{"id": "E51","set": "INT","ord": 3,"stem": "A 58-year-old smoker has a hoarse voice. Examination shows a left vocal fold immobile in the paramedian position, a normal gag reflex, normal palatal elevation and no tongue deviation. Where along the vagus is the lesion, and what should be imaged?","opts": ["In the nucleus ambiguus of the medulla; image the brainstem and the lateral tegmentum","At the superior laryngeal nerve by the hyoid; image the thyrohyoid membrane and piriform fossa","At the pharyngeal plexus on the constrictors; image the nasopharynx and parapharyngeal space","Below the pharyngeal branch at the recurrent laryngeal nerve; image the neck and upper chest","At the jugular foramen above the pharyngeal branch; image the skull base and the foramen itself"],"ans": 3,"why": "An intact gag and normal palate place the lesion below the pharyngeal branch. An isolated recurrent laryngeal palsy on the left demands imaging along its long course under the aortic arch.","wrong": ["A nuclear lesion would add crossed sensory or cerebellar signs rather than an isolated fold palsy.","The superior laryngeal nerve governs pitch and supraglottic sensation, not fold adduction or position.","The pharyngeal plexus moves the palate and constrictors, so palatal elevation would be impaired.","","A jugular foramen lesion would add palatal weakness and an absent gag, both normal in this patient."],"pearl": "Normal palate plus immobile fold equals a lesion below the pharyngeal branch — and on the left that means look in the chest."},{"id": "E52","set": "INT","ord": 3,"stem": "A 40-year-old has a mass in the parapharyngeal space. She has a dry mouth on that side, deviation of the tongue toward the lesion, and a hoarse voice, but normal facial movement and normal tearing. Which nerves are involved?","opts": ["CN IX, X and XII; dry mouth, hoarseness and tongue deviation to the affected side","CN VII, IX and X; facial droop, dry mouth and hoarseness with palatal weakness","CN VII, X and XII; facial droop, hoarseness and tongue deviation toward the lesion","CN V3, VII and IX; jaw weakness, facial droop and dry mouth on the affected side","CN IX, XI and XII; dry mouth, shoulder droop and tongue deviation toward the lesion"],"ans": 0,"why": "Dry mouth from parotid loss is CN IX, hoarseness is CN X, and tongue deviation toward the lesion is CN XII. Normal face and tearing exclude CN VII.","wrong": ["","Facial movement and tearing are normal, so CN VII cannot be part of this deficit.","This substitutes CN VII for CN IX, yet the face moves normally and the mouth is dry.","Jaw weakness and facial droop are absent, and this set leaves the hoarseness unexplained.","Nothing in the case suggests shoulder weakness, and CN XI does not cause hoarseness."],"pearl": "Work each finding back to its nerve, then ask which single space contains all of them. Here it is the parapharyngeal space."},{"id": "E53","set": "INT","ord": 3,"stem": "A patient presents with a painless neck mass, referred ear pain and a unilateral middle ear effusion. Which primary site best explains all three, and by which mechanisms?","opts": ["Supraglottic larynx; vagal afferents refer pain to the ear and nodal spread gives the mass","Deep parotid lobe; the mass indents the pharyngeal wall and auriculotemporal fibres refer pain","Nasopharynx at the pharyngeal recess; the tube is blocked and pharyngeal afferents refer pain","Tonsillar fossa; glossopharyngeal afferents refer pain to the ear and the tumour blocks the tube","Base of tongue; lingual and vagal afferents refer pain to the ear and nodal spread gives the mass"],"ans": 2,"why": "A tumour in the fossa of Rosenmuller blocks the pharyngotympanic tube, producing a unilateral effusion in an adult, while pharyngeal sensory afferents shared with the ear produce referred otalgia. Nodal spread gives the neck mass.","wrong": ["Supraglottic cancer does refer otalgia through the vagus but cannot obstruct the tube.","A deep parotid mass sits lateral and well below the tube orifice, so no effusion follows.","","Tonsillar cancer
