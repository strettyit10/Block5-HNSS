does refer otalgia, but it lies below the orifice and leaves the tube patent.","Tongue base cancer spreads to nodes early and refers otalgia, but never reaches the tube."],"pearl": "A unilateral middle ear effusion in an adult is nasopharyngeal carcinoma until proven otherwise."},{"id": "E54","set": "INT","ord": 3,"stem": "A patient has an epidural haematoma after a blow to the side of the head. Tracing the ruptured vessel backwards, which sequence is correct?","opts": ["Internal carotid, then ophthalmic, then supraorbital, leaving at the supraorbital notch","External carotid, then superficial temporal, then middle meningeal, entering at the pterion","Subclavian, then vertebral, then posterior meningeal, entering at the foramen magnum","Internal carotid, then middle meningeal, entering the fossa through the foramen lacerum","External carotid, then maxillary, then middle meningeal, entering at the foramen spinosum"],"ans": 4,"why": "The middle meningeal artery arises from the first part of the maxillary artery, which is the terminal branch of the external carotid, and enters the middle cranial fossa through the foramen spinosum.","wrong": ["That chain supplies the orbit and forehead and never enters the middle cranial fossa.","The superficial temporal artery is the other terminal branch and gives no meningeal artery.","The posterior meningeal artery supplies posterior fossa dura, far from the temporal region.","The middle meningeal arises from the maxillary artery, not from the carotid trunk, and it enters through the foramen spinosum.",""],"pearl": "Pterion, middle meningeal artery, maxillary artery, foramen spinosum. The released practice set tests the first and last links of this chain."},{"id": "E55","set": "INT","ord": 3,"stem": "A woman has left ptosis and miosis, wasting of the left sternocleidomastoid and trapezius, dysphagia, absent gag, hoarseness and left tongue deviation. Which structure must the lesion involve IN ADDITION to the jugular foramen contents and CN XII?","opts": ["The optic canal, injury to which gives visual loss with a poorly reacting large pupil","The cervical sympathetic chain, interruption of which gives a small pupil with ptosis","The facial canal, injury to which gives facial weakness with drooping of the brow","The cavernous sinus, injury to which gives a dilated pupil with lid droop and diplopia","The foramen ovale, injury to which gives jaw weakness with numbness of the chin"],"ans": 1,"why": "Ptosis with miosis is Horner syndrome, which requires sympathetic interruption. Added to CN IX, X, XI and XII, this defines Villaret syndrome.","wrong": ["Optic canal involvement affects vision and the light reflex, and neither is described here.","","The facial canal carries CN VII, and facial movement is intact in this patient.","A cavernous sinus lesion gives ocular motor palsies, not neck muscle wasting or an absent gag.","The foramen ovale transmits V3, so chewing and chin sensation would be disturbed instead."],"pearl": "Villaret = IX, X, XI, XII plus sympathetics. The sympathetic component is what separates it from a pure jugular foramen syndrome."},{"id": "E56","set": "INT","ord": 3,"stem": "A patient with a maxillary sinus tumour develops numbness of the cheek and upper teeth, then loss of tearing on the same side. Which route best explains the progression?","opts": ["Spread up into the orbit, taking V1 and the lacrimal gland with its nerve supply","Spread laterally into the infratemporal fossa, taking V3 and the otic ganglion with it","Spread up into the cavernous sinus, taking CN III and the internal carotid plexus","Spread back into the pterygopalatine fossa, taking V2 and the pterygopalatine ganglion","Spread medially through the cribriform plate, taking CN I and the anterior ethmoidal nerve"],"ans": 3,"why": "Cheek and upper teeth are V2 territory. Tracking back along V2 reaches the pterygopalatine fossa, where the ganglion supplying the lacrimal gland sits.","wrong": ["Orbital spread numbs the forehead and can strike the gland, but cheek and teeth are V2.","The otic ganglion serves the parotid, and V3 loss would numb the chin, not the cheek.","Cavernous sinus involvement causes diplopia and a dilated pupil before it dries the eye.","","Cribriform spread causes anosmia, and neither cheek numbness nor loss of tearing follows."],"pearl": "Perineural spread follows the nerve backwards. A sensory deficit that later becomes autonomic points at the ganglion on that nerve."},{"id": "E57","set": "INT","ord": 3,"stem": "A child has a nasal-sounding voice, mouth breathing and recurrent middle ear effusions. Which structure is enlarged, and which muscle's action is being defeated?","opts": ["Pharyngeal tonsil; tensor veli palatini, which normally opens the pharyngotympanic tube","Palatine tonsil; palatopharyngeus, which normally narrows the oropharyngeal isthmus","Lingual tonsil; genioglossus, which normally holds the tongue base off the pharynx","Tubal tonsil; salpingopharyngeus, which normally helps hold the tubal orifice open","Torus tubarius; levator veli palatini, which normally seals off the nasopharyngeal isthmus"],"ans": 0,"why": "Adenoid hypertrophy obstructs the choanae and the tubal openings. Tensor veli palatini normally opens the tube during swallowing, and its action is overwhelmed by the obstructing tissue.","wrong": ["","Palatine tonsil enlargement narrows the oropharynx and gives snoring, not nasal speech.","The lingual tonsil sits at the tongue base and cannot obstruct the choanae or the tube.","The tubal tonsil is small, and salpingopharyngeus is a weak elevator, not the tube's dilator.","The torus is the cartilage of the tube itself, not lymphoid tissue that hypertrophies."],"pearl": "Tensor veli palatini is V3 and opens the tube. Levator veli palatini is CN X and lifts the palate. The exam separates them constantly."},{"id": "E58","set": "INT","ord": 3,"stem": "A patient has anaesthesia over the chin, weakness on biting, and an inability to detect touch on the anterior tongue, but taste on the anterior tongue is preserved. Where is the lesion?","opts": ["The chorda tympani in the middle ear, before its junction with the lingual nerve","The lingual nerve in the floor of the mouth, beyond the chorda tympani junction","The V3 trunk above the chorda tympani junction, proximal to all of its branches","The inferior alveolar nerve just proximal to the mandibular foramen it enters","The mental nerve where it emerges from the mental foramen onto the chin"],"ans": 2,"why": "Chin numbness with weakness of biting localises the lesion to the V3 trunk, proximal to its inferior alveolar and lingual branches. Touch on the anterior tongue is lost because the V3 fibres of the lingual nerve are cut, while taste survives because the chorda tympani is a CN VII branch that joins the lingual nerve distal to this lesion.","wrong": ["A chorda tympani lesion abolishes taste on the anterior tongue, which is preserved here.","Beyond that junction both fibre types run together, so taste would be lost as well.","","That nerve serves the teeth and chin only, so biting and tongue touch would be spared.","A mental nerve lesion numbs the chin alone, leaving biting and tongue sensation intact."],"pearl": "The tongue's touch and taste come from different nerves that travel together. Dissociating them tells you where along the route the lesion sits."},{"id": "E59","set": "INT","ord": 3,"stem": "A patient bitten on the ear develops facial weakness, ear pain and vesicles in the conchal bowl. Which two branches of the same nerve explain the motor and the sensory findings?","opts": ["The chorda tympani nerve and the greater petrosal nerve","The terminal motor branches and the chorda tympani nerve","The greater petrosal nerve and the nerve to the stapedius","The posterior auricular nerve and the tympanic plexus branches","The terminal motor branches and the posterior auricular nerve"],"ans": 4,"why": "The terminal branches supply the muscles of facial expression, while the posterior auricular nerve carries general sensation from the external ear. Zoster in the geniculate ganglion produces both.","wrong": ["Both are taste and secretomotor branches; neither moves the face nor senses the auricle.","The motor half fits, but the chorda tympani carries taste and never senses the auricle.","One is secretomotor to the lacrimal gland and the other dampens sound; neither is facial motor.","The auricular part fits, but the tympanic plexus comes from CN IX and moves nothing.",""],"pearl": "Ramsay Hunt works anatomically because CN VII carries both motor fibres to the face and sensory fibres to the auricle."},{"id": "E60","set": "INT","ord": 3,"stem": "A patient has anosmia, and CSF rhinorrhoea after a frontal blow. Which bone is fractured, and what explains the two findings together?","opts": ["Sphenoid at the sella; the pituitary stalk is torn and CSF drains into the sinus","Ethmoid at the cribriform plate; olfactory fibres are sheared and the dura is torn","Frontal at the posterior table; the sinus is opened and its mucosa is stripped away","Maxilla at the sinus roof; the antrum is opened and nasal airflow is diverted","Temporal at the tegmen tympani; the roof is breached and CSF tracks down the tube"],"ans": 1,"why": "The cribriform plate transmits the olfactory fibres and is covered by dura. A fracture shears the fibres and tears the dura, letting CSF into the nose.","wrong": ["A sellar breach gives endocrine failure and field loss, with the sense of smell intact.","","A frontal sinus fracture can leak CSF, but the olfactory fibres lie below in the ethmoid.","The maxillary sinus has no dural boundary and lies far from the olfactory apparatus.","That route can leak into the nose, yet hearing rather than smell would be disturbed."],"pearl": "Anosmia plus a clear nasal discharge after trauma is a cribriform plate fracture until proven otherwise."},{"id": "E61","set": "REL","ord": 3,"stem": "A structure is tagged passing through the foramen transversarium of C6. Tracing it proximally, which vessel does it arise from, and which part of that vessel?","opts": ["External carotid artery; first part, above the bifurcation","Subclavian artery; first part, medial to the anterior scalene","Subclavian artery; third part, lateral to the anterior scalene","Thyrocervical trunk; second branch, behind the anterior scalene","Common carotid artery; terminal branch, at the carotid sinus"],"ans": 1,"why": "The vertebral artery passes through the transverse foramina and arises from the first part of the subclavian artery, medial to anterior scalene, along with the internal thoracic artery and thyrocervical trunk.","wrong": ["The external carotid begins at the bifurcation and supplies the superficial face and neck, never entering a transverse foramen.","","The third part lies lateral to the anterior scalene and gives the dorsal scapular artery, not the vertebral.","The thyrocervical trunk arises medial to the anterior scalene but gives inferior thyroid, transverse cervical and suprascapular branches.","The common carotid ends by dividing into internal and external carotid and gives no other named branch in the neck."],"pearl": "VIT C: Vertebral, Internal thoracic, Thyrocervical from part one; Costocervical from part two. The released practice set uses this exact mnemonic."},{"id": "E62","set": "REL","ord": 3,"stem": "Which pair of structures lies in the same fascial compartment, such that a single injury could affect both?","opts": ["Sympathetic trunk and internal jugular vein, meeting on prevertebral fascia","Vagus nerve and internal jugular vein, wrapped in the carotid sheath","Hypoglossal nerve and vertebral artery, sharing the prevertebral plane","Phrenic nerve and recurrent laryngeal nerve, both on the anterior scalene","Accessory nerve and common carotid artery, bound in the same sheath"],"ans": 1,"why": "The carotid sheath contains the common or internal carotid artery medially, the internal jugular vein laterally, and the vagus nerve posteriorly between them.","wrong": ["The sympathetic trunk does lie on prevertebral fascia, but that plane is BEHIND the carotid sheath, so the vein is not with it.","","CN XII crosses superficially over the carotids while the vertebral artery runs deep in the transverse foramina, so they never share a plane.","The phrenic nerve lies on the anterior scalene but the recurrent laryngeal runs in the tracheo-oesophageal groove, far medial to it.","CN XI passes near the sheath but leaves it to cross the posterior triangle to trapezius, so it is not bound with the carotid."],"pearl": "Three in the sheath: artery, vein, vagus. The sympathetic trunk is just outside it, which is why Horner syndrome accompanies but is not part of vagal injury."},{"id": "E63","set": "REL","ord": 3,"stem": "A tag sits on the muscle forming the floor of the submandibular triangle. Which nerve supplies it, and which other muscle shares that nerve?","opts": ["CN VII via its digastric branch; the stylohyoid muscle","Nerve to mylohyoid from V3; the anterior belly of digastric","Ansa cervicalis from C1 to C3; the sternohyoid strap muscle","C1 fibres travelling with CN XII; the thyrohyoid muscle","CN IX via its muscular branch; the stylopharyngeus muscle"],"ans": 1,"why": "Mylohyoid forms the floor of the submandibular triangle and the muscular floor of the mouth. Its nerve, a branch of the inferior alveolar nerve from V3, also supplies the anterior belly of digastric.","wrong": ["CN VII supplies stylohyoid together with the POSTERIOR belly of digastric, neither of which floors the triangle.","","The ansa cervicalis supplies the infrahyoid straps sternohyoid, sternothyroid and omohyoid, which lie below the hyoid.","C1 fibres riding with CN XII supply thyrohyoid and geniohyoid, which sit below and above this muscular sheet.","CN IX gives one muscular branch, to stylopharyngeus, which is its only motor target in the whole head."],"pearl": "One muscle, two bellies, two arches, two nerves. Digastric is the classic demonstration."},{"id": "E64","set": "REL","ord": 2,"stem": "Which structures pass BELOW the inferior pharyngeal constrictor?","opts": ["Levator veli palatini and the pharyngotympanic tube","Stylopharyngeus muscle and the glossopharyngeal nerve","Internal laryngeal nerve and the superior laryngeal vessels","Recurrent laryngeal nerve and the inferior laryngeal artery","Ascending pharyngeal artery and the pharyngeal plexus"],"ans": 3,"why": "Four gaps exist between and around the constrictors. The lowest, below the inferior constrictor, transmits the recurrent laryngeal nerve and the inferior laryngeal artery.","wrong": ["Those two pass ABOVE the superior constrictor, through the sinus of Morgagni.","Those two pass between the superior and middle constrictors into the oropharynx.","Those two pierce the thyrohyoid membrane between the middle and inferior constrictors.","","Those two lie on the outer surface of the pharyngeal wall rather than passing through any gap."],"pearl": "Top to bottom: tube and levator; CN IX and stylopharyngeus; internal laryngeal; recurrent laryngeal. Nerve and artery travel together at each level."},{"id": "E65","set": "REL","ord": 3,"stem": "A tag sits on the fold running from the soft palate to the SIDE OF THE TONGUE. Which nerve supplies the muscle inside it, and why is that surprising?","opts": ["CN XII, because every muscle inserting into the tongue takes that nerve","CN X, because the muscle is palatal in origin despite reaching the tongue","CN IX, because the fold borders the tonsillar bed that CN IX supplies","V3, because the muscle works with the masticatory group to place the bolus","CN VII, because the fold is a second arch derivative like the face muscles"],"ans": 1,"why": "The palatoglossal fold contains palatoglossus. Although it inserts into the tongue, it is developmentally and functionally palatal, so its supply is CN X via the pharyngeal plexus.","wrong": ["This is the trap: CN XII supplies every tongue muscle EXCEPT the one in this fold.","","CN IX carries sensation from the tonsillar bed but its only motor target is stylopharyngeus.","V3 supplies tensor veli palatini among the palatal muscles, but no muscle of this fold.","CN VII supplies no palatal or lingual muscle; the palate is third and fourth arch territory."],"pearl": "All tongue muscles are CN XII except palatoglossus. All palatal muscles are CN X except tensor veli palatini. Two rules, two exceptions."},{"id": "E66","set": "REL","ord": 3,"stem": "Which sinus opens into the space beneath the MIDDLE concha at a curved slit, and which two other sinuses share that same space by different openings?","opts": ["Maxillary at the semilunar hiatus; frontal and anterior ethmoid share it","Sphenoid at the sphenoethmoidal recess; the frontal and maxillary share it","Posterior ethmoid at the superior meatus; sphenoid and frontal share it","Frontal at the inferior meatus; maxillary and anterior ethmoid share it","Maxillary at the ethmoid bulla; sphenoid and posterior ethmoid share it"],"ans": 0,"why": "The semilunar hiatus in the middle meatus receives the maxillary sinus. The frontal sinus and the anterior ethmoidal cells also drain into the middle meatus, and the middle ethmoidal cells drain onto the ethmoid bulla there.","wrong": ["","The sphenoethmoidal recess sits above the superior concha and receives the sphenoid sinus alone.","The superior meatus receives only the posterior ethmoidal cells, and the sphenoid drains above it.","The inferior meatus receives only the nasolacrimal duct, and the frontal sinus drains far higher.","The ethmoid bulla is the opening of the middle ethmoidal cells, not of the maxillary sinus."],"pearl": "The middle meatus is the busiest: frontal, anterior ethmoid, middle ethmoid and maxillary all arrive there by different routes."},{"id": "E67","set": "REL","ord": 3,"stem": "On the lateral nasal wall, which opening leads to a cavity that is NOT a paranasal sinus?","opts": ["Semilunar hiatus, on the middle meatus wall","Ethmoid bulla, bulging into the middle meatus","Sphenoethmoidal recess, above the superior concha","Pharyngotympanic tube, behind the inferior concha","Frontonasal duct, high in the anterior middle meatus"],"ans": 3,"why": "The pharyngotympanic tube opens on the lateral wall of the nasopharynx and leads to the middle ear, which is not a paranasal sinus. Every other option leads to a sinus.","wrong": ["The semilunar hiatus is the curved slit through which the maxillary sinus drains into the middle meatus.","The ethmoid bulla is the opening of the middle ethmoidal air cells, which are true paranasal sinuses.","The sphenoethmoidal recess leads back and up into the sphenoid sinus within the body of that bone.","","The frontonasal duct leads up into the frontal sinus, a paranasal sinus hollowed out of the frontal bone."],"pearl": "The released practice set asks exactly this: which indicated structure opens into the middle ear."},{"id": "E68","set": "REL","ord": 3,"stem": "Which structure is crossed by the hypoglossal nerve on its way to the tongue, and which artery does the nerve pass superficial to?","opts": ["Hyoglossus on its lateral surface; superficial to the lingual artery","Mylohyoid on its medial surface; superficial to the facial artery","Genioglossus on its lateral surface; deep to the inferior alveolar artery","Stylohyoid on its medial surface; superficial to the maxillary artery","Digastric on its deep surface; deep to the superior thyroid artery"],"ans": 0,"why": "CN XII runs on the lateral surface of hyoglossus, superficial to the lingual artery, which lies deep to the same muscle.","wrong": ["","Mylohyoid lies below the nerve and the facial artery runs outside this plane, arching over the mandible.","Genioglossus lies deeper and more medial, and the inferior alveolar artery runs inside the mandible.","Stylohyoid lies further posteriorly, and the maxillary artery is up in the infratemporal fossa.","The digastric tendon lies below the nerve and the superior thyroid artery is down in the carotid triangle."],"pearl": "Hyoglossus separates nerve from artery. Knowing which side each is on is what makes the floor of the mouth navigable."},{"id": "E69","set": "REL","ord": 3,"stem": "Which single muscle, if paralysed, would most impair the ability to keep food between the teeth while chewing, and what makes its nerve supply counter-intuitive?","opts": ["Masseter; CN VII despite its chewing power, because it develops in the parotid bed","Buccinator; CN VII despite its chewing role, because it is a facial expression muscle","Temporalis; CN VII despite its chewing role, because it arises from second arch mesoderm","Medial pterygoid; CN VII despite chewing, because it lies deep within the facial sheet","Orbicularis oris; CN VII despite its chewing role, because it is a muscle of expression"],"ans": 1,"why": "Buccinator presses the cheek against the molars to hold the bolus over the teeth. It is a second arch muscle of facial expression, so it is CN VII, unlike the true muscles of mastication which are V3.","wrong": ["Masseter is a first arch muscle of mastication supplied by V3, and it elevates rather than holds the bolus.","","Temporalis is first arch and V3, and it elevates and retracts the mandible rather than compressing the cheek.","Medial pterygoid is first arch and V3, and it elevates and protrudes the mandible from inside the ramus.","Orbicularis oris is correctly CN VII and does keep food behind the lips, but it cannot press the cheek against the molars, which is what holds the bolus over the teeth."],"pearl": "Function does not determine nerve supply; developmental arch does. Buccinator is the proof."},{"id": "E70","set": "REL","ord": 3,"stem": "Lymph from the tip of the tongue drains first to which nodes, and where does it go next?","opts": ["Submandibular nodes first, then the superficial cervical","Submental nodes first, then the deep cervical chain","Jugulodigastric node first, then the submental group","Retropharyngeal nodes first, then the submandibular","Deep cervical chain first, with no intermediate"],"ans": 1,"why": "The tip of the tongue drains to the submental nodes, which then pass to the deep cervical chain along the internal jugular vein — the final common pathway for all head and neck lymph.","wrong": ["Submandibular nodes take the rest of the anterior tongue and the floor of the mouth, and they pass to the deep chain.","","The jugulodigastric node belongs to the deep cervical chain, so it receives from the submental rather than sending to it.","Retropharyngeal nodes drain the nasopharynx and the posterior nasal cavity, not the tip of the tongue.","The tongue tip does have an intermediate group, the submental nodes, before reaching the deep chain."],"pearl": "Everything ends at the deep cervical chain. Which node comes FIRST is what changes with the site of the primary."},{"id": "E71","set": "REL","ord": 3,"stem": "Kiesselbach's plexus is formed by five arteries. Which of them arises from the INTERNAL carotid system, making this plexus a site where both carotid systems meet?","opts": ["Sphenopalatine artery on the posterior septum","Greater palatine artery on the lower septum","Superior labial artery at the nasal vestibule","Anterior ethmoidal artery on the upper septum","Septal branch of the facial artery at the sill"],"ans": 3,"why": "The anterior and posterior ethmoidal arteries come from the ophthalmic artery, a branch of the internal carotid. The sphenopalatine and greater palatine come from the maxillary artery, and the superior labial from the facial artery, all external carotid.","wrong": ["The sphenopalatine is the terminal branch of the maxillary artery, so it belongs to the external carotid.","The greater palatine reaches the septum from the palate but also arises from the maxillary artery.","The superior labial is a branch of the facial artery, and the facial arises from the external carotid.","","The septal branch is another twig of the facial artery, so it too belongs to the external carotid system."],"pearl": "Anterior epistaxis bleeds hard because two arterial systems anastomose there. Posterior epistaxis is sphenopalatine and needs a different approach."},{"id": "E72","set": "REL","ord": 3,"stem": "An arteriovenous fistula forms between a meningeal artery and a dural venous sinus. Which property of dural venous sinuses determines how the arterial blood behaves?","opts": ["They contain valves that keep flow directed toward the heart","They have no valves, so flow can travel in either direction","They sit in the subarachnoid space and mix freely with CSF","Their resting pressure normally exceeds arterial pressure","They drain only to the vertebral plexus, not to the jugular"],"ans": 1,"why": "Dural venous sinuses lie between the periosteal and meningeal layers of dura and have no valves. Arterial blood entering a sinus is carried toward the internal jugular vein, but the absence of valves also permits retrograde flow.","wrong": ["Dural venous sinuses carry no valves at all, which is the property this question turns on.","","The sinuses lie between the periosteal and meningeal layers of dura, outside the subarachnoid space.","Arterial pressure always exceeds sinus pressure, and that gradient is what drives blood into the shunt.","The sinuses drain chiefly into the internal jugular vein, with emissary and vertebral routes secondary."],"pearl": "No valves anywhere in the head's venous drainage. That single fact explains the danger triangle, emissary vein spread and dural fistula physiology."},{"id": "E73","set": "DSC","ord": 3,"stem": "Two intrinsic laryngeal muscles act on the arytenoid's muscular process in opposite directions. Which pair, and what does each do?","opts": ["Lateral cricoarytenoid abducts and opens the glottis; posterior cricoarytenoid adducts and closes it","Cricothyroid abducts and lengthens the fold; thyroarytenoid adducts and closes the glottis","Transverse arytenoid abducts and opens the glottis; oblique arytenoid adducts and closes it","Vocalis abducts and tenses the vocal fold; thyroarytenoid adducts and closes the glottis","Posterior cricoarytenoid abducts and opens the glottis; lateral cricoarytenoid adducts and closes it"],"ans": 4,"why": "Both are supplied by the recurrent laryngeal nerve and both pull on the muscular process, but in opposite directions: the posterior cricoarytenoid swings the vocal process laterally to open the glottis, the lateral cricoarytenoid swings it medially to close it.","wrong": ["Reverses them: the posterior cricoarytenoid is the only abductor in the larynx.","Cricothyroid tenses the fold and runs with the external laryngeal nerve, and neither muscle abducts.","Both arytenoid muscles adduct, so they are not an antagonistic pair.","Vocalis fine-tunes tension and thyroarytenoid relaxes the fold, and neither one abducts.",""],"pearl": "Posterior opens, Lateral closes. Same nerve, same bone, opposite directions — the cleanest antagonistic pair in the larynx."},{"id": "E74","set": "LOC","ord": 3,"stem": "A patient is in stridor with both vocal folds sitting near the midline. Which muscle has failed bilaterally, and why is the airway, rather than the voice, the problem?","opts": ["Cricothyroid; loss of fold tension narrows the airway lumen","Posterior cricoarytenoid; no abductor is left to open the glottis","Lateral cricoarytenoid; unopposed adduction shuts the glottis tight","Thyroarytenoid; slack folds are drawn into the airway stream","Transverse arytenoid; the posterior glottic chink is sealed off"],"ans": 1,"why": "Every other intrinsic muscle adducts or tenses. With both posterior cricoarytenoids denervated there is no abductor anywhere, so the folds rest adducted and the airway, not phonation, is threatened.","wrong": ["Cricothyroid sets pitch and does not change the airway calibre.","","Losing the lateral cricoarytenoid would open, not close, the glottis.","Thyroarytenoid loss changes voice quality rather than the airway.","Losing an adductor cannot narrow the airway at the glottic chink."],"pearl": "Unilateral recurrent laryngeal palsy is a voice problem. Bilateral is an airway emergency, because the sole abductor is gone on both sides."},{"id": "E75","set": "REL","ord": 3,"stem": "A tag sits on the POSTERIOR tonsillar pillar. Name the fold, the muscle within it, and its nerve.","opts": ["Palatoglossal fold; palatoglossus; CN X pharyngeal plexus","Palatopharyngeal fold; palatopharyngeus; CN X pharyngeal plexus","Palatopharyngeal fold; palatopharyngeus; CN IX pharyngeal branch","Salpingopharyngeal fold; salpingopharyngeus; CN X pharyngeal plexus","Palatoglossal fold; palatoglossus; CN XII lingual branches"],"ans": 1,"why": "The posterior pillar is the palatopharyngeal fold, raised by palatopharyngeus, which like almost all palatal and pharyngeal muscles is CN X through the pharyngeal plexus.","wrong": ["The palatoglossal fold is the ANTERIOR pillar, running in front of the tonsil to the side of the tongue.","","The fold and muscle are right, but CN IX supplies only stylopharyngeus, never palatopharyngeus.","The salpingopharyngeal fold lies in the nasopharynx behind the tubal opening, not at the tonsil.","Palatoglossus sits in the anterior pillar and takes CN X; CN XII supplies no palatal muscle at all."],"pearl": "Anterior pillar palatoglossal, posterior pillar palatopharyngeal, palatine tonsil between them, CN IX just deep to the bed."},{"id": "E76","set": "DSC","ord": 3,"stem": "A thin sheet of muscle in the superficial fascia of the neck is tagged. Which nerve supplies it, and which nerve supplies the SKIN directly over it?","opts": ["Motor: the cervical branch of CN VII. Sensory: the transverse cervical nerve of the cervical plexus","Motor: the ansa cervicalis of the cervical plexus. Sensory: the great auricular nerve of that plexus","Motor: the transverse cervical nerve of the cervical plexus. Sensory: the cervical branch of CN VII","Motor: the accessory nerve (CN XI). Sensory: the supraclavicular nerves of the cervical plexus","Motor: the mandibular branch of CN VII. Sensory: the great auricular nerve of the cervical plexus"],"ans": 0,"why": "Platysma is a muscle of facial expression that migrated into the neck, so it is CN VII through the cervical branch. The overlying skin of the anterior triangle is supplied by the transverse cervical nerve from the cervical plexus.","wrong": ["","The ansa cervicalis supplies the infrahyoid straps that lie deep to this sheet of muscle.","Reverses the two: the transverse cervical nerve is purely sensory and the cervical branch purely motor.","CN XI supplies sternocleidomastoid and trapezius, and supraclavicular skin lies lower, over the clavicle.","The mandibular branch supplies the lower lip depressors, and great auricular skin lies over the jaw angle."],"pearl": "Platysma is the one muscle of facial expression below the mandible. Its nerve is the giveaway that it is a second arch derivative."},{"id": "E77","set": "REL","ord": 2,"stem": "Three foramina lie in a near-vertical line on the front of the skull. Which trigeminal divisions emerge from them, from top to bottom?","opts": ["V1 above, V2 in the middle, V3 below","V1 above, V3 in the middle, V2 below","V2 above, V1 in the middle, V3 below","V3 above, V2 in the middle, V1 below","V2 above, V3 in the middle, V1 below"],"ans": 0,"why": "The supraorbital foramen transmits the supraorbital nerve of V1, the infraorbital foramen the infraorbital nerve of V2, and the mental foramen the mental nerve of V3.","wrong": ["","This swaps the lower two, putting the mental nerve at the infraorbital foramen.","This puts V2 at the supraorbital foramen, which in fact transmits a V1 branch.","This is the sequence completely inverted, with V3 emerging at the brow.","This is scrambled, leaving V1 at the mental foramen on the chin."],"pearl": "Supraorbital, infraorbital, mental — V1, V2, V3 stacked in order down the face, a favourite dry-skull tag."},{"id": "E78","set": "LOC","ord": 3,"stem": "A lesion spares levator palpebrae superioris and superior rectus but paralyses medial rectus, inferior rectus and inferior oblique, with a dilated pupil. Which part of CN III is involved?","opts": ["Superior division inside the orbital apex","Inferior division inside the orbital apex","The whole trunk in the interpeduncular fossa","The Edinger-Westphal nucleus in the midbrain","The ciliary ganglion behind the eyeball"],"ans": 1,"why": "The inferior division supplies medial rectus, inferior rectus and inferior oblique, and carries the parasympathetic root to the ciliary ganglion. The superior division, supplying levator and superior rectus, is spared.","wrong": ["A superior division lesion would drop the lid and weaken elevation.","","A whole-trunk lesion would add ptosis from levator paralysis.","That nucleus alone gives a dilated pupil with full eye movements.","The ciliary ganglion also spares all the extraocular muscles."],"pearl": "Preserved lid elevation with a blown pupil localises to the inferior division, because the parasympathetics travel with it."},{"id": "E79","set": "DSC","ord": 3,"stem": "A patient with vertical diplopia habitually tilts the head to the LEFT. Which nerve is affected, on which side, and what is the mechanism?","opts": ["Left CN IV; the left eye rests extorted and slightly elevated, and tilting toward it fuses the images","Right CN VI; the right eye rests adducted at rest, and tilting the head makes up for the lost abduction","Right CN IV; the right eye rests extorted and slightly elevated, and tilting away from it fuses images","Right CN IV; the right eye rests intorted and slightly depressed, and tilting toward it fuses images","Left CN III; the left eye rests down and out with ptosis, and tilting clears the images past the lid"],"ans": 2,"why": "Loss of superior oblique leaves the eye extorted and a little elevated. Head tilt to the opposite side drives compensatory intorsion of that eye and brings the two images together.","wrong": ["The tilt is away from the palsied side, so a leftward tilt does not fit a left CN IV lesion.","A CN VI palsy gives horizontal diplopia, which head tilt does not correct.","","The mechanism is inverted: losing superior oblique leaves the eye extorted and slightly elevated.","A CN III palsy gives a down-and-out eye with heavy ptosis, not a compensatory head tilt."],"pearl": "Head tilts AWAY from a CN IV palsy. Normally a leftward tilt extorts the right eye and intorts the left."},{"id": "E80","set": "INT","ord": 3,"stem": "During carotid surgery, manipulation near the bifurcation produces sudden bradycardia and hypotension. Which structure was stimulated, what does it sense, and which nerve carries the afferent?","opts": ["Carotid body; oxygen tension; afferents in CN X","Carotid body; arterial stretch; afferents in CN IX","Carotid sinus; carbon dioxide; afferents in CN X","Carotid sinus; arterial stretch; afferents in CN IX","Superior cervical ganglion; sympathetic tone; CN IX"],"ans": 3,"why": "The carotid sinus is a baroreceptor in the dilated proximal internal carotid. Stretch signals travel in CN IX and reflexly slow the heart and drop the pressure.","wrong": ["The carotid body is a chemoreceptor, and its afferents travel in CN IX, not CN X.","The body samples blood chemistry; stretch is detected by the sinus just above it.","The sinus senses pressure rather than carbon dioxide, and it reports through CN IX.","","The ganglion is an efferent sympathetic relay and carries no baroreceptor afferents."],"pearl": "Sinus senses stretch, body senses chemistry. Both report to CN IX, and the sinus reflex is why surgeons infiltrate it with local anaesthetic."},{"id": "E81","set": "DSC","ord": 3,"stem": "A patient has acute unilateral facial weakness involving the forehead, with normal taste, normal tearing and no hyperacusis. Where along CN VII does this place the lesion, and what is the likely diagnosis?","opts": ["Proximal to the greater petrosal nerve; Ramsay Hunt","Near the stylomastoid foramen; idiopathic Bell palsy","At the internal acoustic meatus; a vestibular schwannoma","In the contralateral motor cortex; a lacunar stroke","At the geniculate ganglion; herpes zoster reactivation"],"ans": 1,"why": "Forehead involvement makes it peripheral. Sparing of tears, stapedius and taste places it distal to all three of those branches, which is the stylomastoid region — the classic Bell palsy location.","wrong": ["A lesion that proximal would dry the eye, abolish taste and add hyperacusis.","","A mass at the meatus would usually add hearing loss and imbalance.","A cortical lesion spares the forehead, which is weak in this patient.","Geniculate involvement would abolish tearing and add ear pain with vesicles."],"pearl": "Bell palsy follows inflammation within the facial canal or near the stylomastoid exit, and is a diagnosis of exclusion."},{"id": "E82","set": "DSC","ord": 3,"stem": "Two muscles lie stacked immediately beneath the orbital roof and share one cranial nerve. How would you tell their deficits apart clinically?","opts": ["Levator palpebrae loss drops the lid; superior rectus loss impairs elevation of the globe","Levator palpebrae loss impairs elevation of the globe; superior rectus loss drops the lid","Levator palpebrae loss drops the lid; superior rectus loss also drops the lid to the same degree","Levator palpebrae loss impairs elevation of the globe; superior rectus loss also impairs it equally","Levator palpebrae loss causes proptosis of the globe; superior rectus loss drops the lid"],"ans": 0,"why": "Both are CN III and lie one on top of the other, but levator palpebrae superioris inserts into the superior tarsus and moves the LID, while superior rectus inserts on the sclera and moves the GLOBE.","wrong": ["","Reverses them: levator inserts on the tarsal plate and superior rectus on the sclera.","Superior rectus inserts on the globe and has no attachment that moves the lid.","Levator inserts on the tarsal plate and does not elevate the globe at all.","Neither muscle tethers the globe back, so losing either one cannot cause proptosis."],"pearl": "On a specimen they are stacked and easy to confuse. Lid versus globe is the functional test that separates them."},{"id": "E83","set": "DSC","ord": 2,"stem": "On laryngoscopy, which set of features identifies the TRUE vocal fold rather than the vestibular fold?","opts": ["Superior, pink and thick, with a rounded free edge","Inferior, white and taut, with a sharp free edge","Superior, white and taut, with a sharp free edge","Inferior, pink and thick, with a rounded free edge","Inferior, pink and taut, with a sharp free edge"],"ans": 1,"why": "The avascular vocal ligament under the mucosa makes the true fold white with a crisp edge. The vestibular fold above it is pinker and thicker, and the ventricle lies between them.","wrong": ["Those are the features of the vestibular fold, above the ventricle.","","Colour and edge are right, but the fold above the ventricle is the vestibular fold.","Position is right, but a pink thick fold with a blunt edge is the vestibular fold.","Position and edge are right, but the avascular vocal ligament makes the true fold white."],"pearl": "White and sharp is true, pink and plump is false, ventricle in between."},{"id": "E84","set": "REL","ord": 3,"stem": "Two strap muscles both attach to the thyroid cartilage. Which is which, and why do they have different nerves?","opts": ["Thyrohyoid runs hyoid to thyroid on C1 with CN XII; sternothyroid runs sternum to thyroid on the ansa cervicalis","Thyrohyoid runs hyoid to thyroid on the ansa cervicalis; sternothyroid runs sternum to thyroid on C1 with CN XII","Thyrohyoid runs hyoid to thyroid and sternothyroid runs sternum to thyroid, both of them on the ansa cervicalis","Thyrohyoid runs hyoid to thyroid and sternothyroid runs sternum to thyroid, both on C1 fibres riding with CN XII","Thyrohyoid runs hyoid to thyroid on C1 with CN XII; sternothyroid runs sternum to hyoid on the ansa cervicalis"],"ans": 0,"why": "Thyrohyoid is the exception among the infrahyoid muscles: C1 fibres travelling with CN XII leave the nerve to supply it, and also geniohyoid. The other three straps are ansa cervicalis.","wrong": ["","This reverses the supply: thyrohyoid is the C1 exception and sternothyroid is the one on the ansa.","Three of the four straps are on the ansa, but thyrohyoid is the exception supplied by C1 fibres.","Only thyrohyoid and geniohyoid take C1 fibres; sternothyroid is supplied by the ansa cervicalis.","The nerves are right, but sternothyroid ends on the thyroid cartilage; sternum to hyoid is sternohyoid."],"pearl": "Three of four infrahyoids on the ansa, one quarter (thyrohyoid) on C1 riding CN XII."},{"id": "E85","set": "REL","ord": 3,"stem": "Two veins in the face are easily confused on a specimen. Which description correctly matches each?","opts": ["Retromandibular forms in the parotid from superficial temporal and maxillary; facial runs obliquely down the face with its artery","Retromandibular runs obliquely down the face with its artery; facial forms in the parotid from superficial temporal and maxillary","Retromandibular forms in the parotid from superficial temporal and maxillary; facial also lies within the parotid gland substance","Retromandibular drains the orbit through the ophthalmic veins; facial drains the scalp through the superficial temporal vein","Retromandibular drains the upper lip and side of the nose; facial forms from the superficial temporal and maxillary veins"],"ans": 0,"why": "The retromandibular vein forms inside the parotid from the superficial temporal and maxillary veins. The facial vein is superficial, running with the facial artery from the medial angle of the eye down across the mandible.","wrong": ["","This reverses them: the facial vein is the superficial one accompanying the facial artery across the cheek.","Only the retromandibular vein is intraparotid; the facial vein stays superficial and crosses the mandible.","The facial vein, not the retromandibular, communicates with the orbit through the ophthalmic veins.","This reverses the tributaries: the superficial temporal and maxillary veins form the retromandibular."],"pearl": "The facial vein's communication with the ophthalmic veins is what makes the danger triangle dangerous."},{"id": "E86","set": "LOC","ord": 3,"stem": "A patient's jaw deviates to the RIGHT on opening. Which muscle is weak, on which side, and why does the jaw move that way?","opts": ["Right lateral pterygoid; the intact left one swings the jaw right","Left lateral pterygoid; the intact right one swings the jaw right","Right temporalis; unopposed retraction pulls the jaw to the right","Right masseter; unopposed elevation drags the jaw to the right","Left medial pterygoid; unopposed protrusion swings the jaw right"],"ans": 0,"why": "Lateral pterygoid protrudes the mandible and swings it to the opposite side. With the right paralysed, the left one pushes the jaw across to the right, toward the weak side.","wrong": ["","A left lesion would let the right muscle swing the jaw to the left.","Temporalis retracts and elevates and causes no deviation on opening.","Masseter elevates the mandible and takes no part in opening it.","Medial pterygoid elevates and protrudes but does not open the jaw."],"pearl": "Jaw deviates TOWARD the weak side on opening — the same rule as the tongue in CN XII palsy."},{"id": "E87","set": "REL","ord": 2,"stem": "The frontal nerve divides into two terminal branches. Which are they, and which division of CN V do they belong to?","opts": ["Supraorbital and supratrochlear, both V1, to the forehead","Supraorbital and infraorbital, V1 and V2, to the mid face","Infratrochlear and external nasal, both V1, to the nose","Zygomaticofacial and zygomaticotemporal, both V2, to the cheek","Supratrochlear and infratrochlear, both V2, to the brow"],"ans": 0,"why": "The frontal nerve is the largest V1 branch, running forward under the orbital roof and dividing into the supraorbital and supratrochlear nerves to supply the forehead and anterior scalp.","wrong": ["","The infraorbital nerve is the terminal branch of V2, emerging on the maxilla below the orbital rim.","Infratrochlear and external nasal are branches of the nasociliary nerve rather than of the frontal.","Those two are the cutaneous branches of the zygomatic nerve from V2, reaching the cheek and temple.","Both of those are V1 rather than V2, and the infratrochlear comes off the nasociliary nerve."],"pearl": "Frontal is the nerve you meet first on lifting the orbital roof, lying directly on levator palpebrae superioris."},{"id": "E88","set": "SRG","ord": 3,"stem": "A retropharyngeal abscess is drained. The surgeon must know which fascial plane it occupies, because one plane stops at the mediastinum and another does not. Which pair of boundaries defines the space that reaches the DIAPHRAGM?","opts": ["The buccopharyngeal and the alar fascia","The alar and the prevertebral fasciae","The investing and the pretracheal fascia","The pretracheal fascia and carotid sheath","The pretracheal and the buccopharyngeal fascia"],"ans": 1,"why": "The danger space lies between the alar and prevertebral fasciae and runs uninterrupted from the skull base to the diaphragm. The retropharyngeal space proper, between buccopharyngeal and alar fascia, ends around T1 to T6.","wrong": ["Those bound the retropharyngeal space proper, which ends around T1 to T6.","","Those enclose the infrahyoid strap muscle compartment of the neck.","Pretracheal spread passes anteriorly to the pericardium, not to the diaphragm.","Those two are parts of the same middle fascial layer, so no potential space of note lies between them."],"pearl": "Two spaces, one fascia apart. Alar fascia is the divider, and which side of it the pus sits on decides how far it travels."},{"id": "E89","set": "SRG","ord": 3,"stem": "A scalp wound bleeds profusely and its edges gape widely. A week later infection has tracked into the eyelids. Which two layers explain these two behaviours?","opts": ["Skin with its subcutaneous vessels for the bleeding; pericranium for the spread","Dense connective tissue for the bleeding; loose areolar tissue for the spread","Epicranial aponeurosis for the bleeding; the skin and dermis for the spread","Loose areolar tissue for the bleeding; dense connective tissue for the spread","Pericranium for the bleeding; the epicranial aponeurosis for the spread"],"ans": 1,"why": "Layer two is dense and richly vascular, with vessels tethered open so they cannot retract, hence the profuse bleeding. Layer four is loose areolar tissue, the danger area, through which blood and pus spread freely and forward into the eyelids. The gaping edges are a third, separate effect, produced by the cut epicranial aponeurosis of layer three, which is not one of the two layers asked for here.","wrong": ["Skin alone bleeds no harder than elsewhere and pericranium confines spread.","","The aponeurosis is what makes a transverse wound gape, not what bleeds.","This reverses the two layers: the loose layer spreads, the dense one bleeds.","Pericranium is adherent at the sutures and limits collections to one bone."],"pearl": "SCALP: Skin, Connective tissue, Aponeurosis, Loose connective tissue, Pericranium. Layer 2 bleeds, layer 4 spreads, layer 3 makes it gape."},{"id": "E90","set": "AUT","ord": 3,"stem": "Taste is lost from the root of the tongue and the epiglottis, but taste over the posterior third and the anterior two-thirds is normal. Which nerve is affected?","opts": ["CN VII via the chorda tympani nerve","CN IX via its posterior lingual branches","CN X via the internal laryngeal nerve","CN V3 via the lingual nerve branches","CN XII via its terminal lingual branches"],"ans": 2,"why": "Three nerves carry taste, front to back: CN VII for the anterior two-thirds, CN IX for the posterior third, and CN X, through the internal laryngeal nerve, for the most posterior strip of tongue in front of the epiglottis, the valleculae and the epiglottis itself.","wrong": ["That route carries taste from the anterior two-thirds, which is normal here.","That route carries taste from the posterior third, which is normal here.","","The lingual nerve carries general sensation, not taste, in its own right.","CN XII is purely motor and carries no taste at all."],"pearl": "Most students stop at two taste nerves. The review adds a third: CN X takes the valleculae and epiglottis, behind the CN IX territory."},{"id": "E91","set": "AUT","ord": 3,"stem": "Which branch of CN VII carries BOTH branchial motor and general sensory fibres, and what does each component supply?","opts": ["Chorda tympani nerve; the palatoglossus muscle, plus taste from the anterior tongue","Greater petrosal nerve; the tensor tympani muscle, plus the lacrimal and nasal glands","Posterior auricular nerve; the occipital belly and auricular muscles, plus external ear skin","Nerve to stapedius; the stapedius muscle, plus sensation from the tympanic membrane","Marginal mandibular branch; the depressor anguli oris, plus the skin of the lower lip"],"ans": 2,"why": "The posterior auricular nerve is motor to the occipital belly of occipitofrontalis and the auricular muscles, and sensory to the skin of the external ear.","wrong": ["The chorda tympani carries special sensory and parasympathetic fibres only, and palatoglossus is a CN X muscle.","The greater petrosal nerve carries parasympathetic and palatal taste fibres but no motor supply, and tensor tympani belongs to V3.","","That branch is branchial motor only, and the tympanic membrane is served by CN IX and CN X.","The terminal branches are motor only, and the lower lip skin belongs to the mental nerve of V3."],"pearl": "This branch is why Ramsay Hunt gives ear pain and vesicles alongside facial weakness — CN VII genuinely has a skin territory."},{"id": "E92","set": "REL","ord": 3,"stem": "All four cutaneous branches of the cervical plexus emerge at one point. Where is it, and which branch supplies the skin over the CLAVICLE?","opts": ["Anterior border of sternocleidomastoid; the great auricular nerve","Posterior border of sternocleidomastoid; supraclavicular nerves","Posterior border of the trapezius; the lesser occipital nerve","Anterior border of the trapezius; the transverse cervical nerve","Midpoint of the clavicle itself; the supraclavicular nerves"],"ans": 1,"why": "The nerve point of the neck lies at the middle of the posterior border of sternocleidomastoid, where the great auricular, lesser occipital, transverse cervical and supraclavicular nerves all emerge. The supraclavicular nerves cover the clavicle and shoulder.","wrong": ["The four nerves emerge from the POSTERIOR border, and the great auricular covers the ear and mastoid skin.","","The lesser occipital does arise at the nerve point but it covers the scalp behind the ear, not the clavicle.","The transverse cervical crosses sternocleidomastoid to supply the skin of the anterior triangle.","The supraclavicular nerves are the right branch, but they emerge higher up at the nerve point of the neck."],"pearl": "One point, four nerves, four territories: ear and mastoid, behind the ear, anterior triangle, clavicle and shoulder."},{"id": "E93","set": "SRG","ord": 3,"stem": "A supraclavicular block is placed and the patient becomes breathless. Which nerve was affected, where does it lie, and what is its root value?","opts": ["Phrenic nerve, on the anterior surface of anterior scalene, C3 to C5","Phrenic nerve, deep to the belly of anterior scalene, C5 to C7","Long thoracic nerve, on the surface of middle scalene, C5 to C7","Vagus nerve, within the carotid sheath medially, cranial rootlets","Recurrent laryngeal nerve, deep in the tracheo-oesophageal groove, vagal"],"ans": 0,"why": "The phrenic nerve arises from C3, C4 and C5 and descends on the ANTERIOR surface of anterior scalene, where local anaesthetic tracking from a supraclavicular block can reach it and paralyse the hemidiaphragm.","wrong": ["","The nerve lies on the muscle's front face and its roots are C3 to C5.","Blocking it would give scapular winging rather than breathlessness.","A vagal block would alter voice and swallowing instead of ventilation.","Its involvement produces hoarseness, not loss of diaphragm excursion."],"pearl": "C3, 4, 5 keeps the diaphragm alive. Anterior to anterior scalene is phrenic; posterior to it are the trunks and the subclavian artery."},{"id": "E94","set": "INT","ord": 3,"stem": "A schwannoma is resected from the infratemporal fossa and bleeding is controlled by clamping the main arterial supply of the region. Which artery, and which of its branches would also be devascularised?","opts": ["Maxillary artery; the inferior alveolar, middle meningeal, deep temporal and buccal branches","Facial artery; the ascending palatine, tonsillar, glandular and submental branches","Superficial temporal artery; the transverse facial, zygomatic, frontal and parietal branches","Internal carotid artery; the ophthalmic, posterior communicating and choroidal branches","Ascending pharyngeal artery; its pharyngeal, prevertebral and inferior tympanic branches"],"ans": 0,"why": "The maxillary artery is the larger terminal branch of the external carotid and the principal supply of the infratemporal fossa. Its branches there include the inferior alveolar, middle meningeal, deep temporal and buccal arteries.","wrong": ["","The facial artery supplies the tonsil, gland and face, all outside this fossa.","The superficial temporal artery is the other terminal branch and supplies the scalp.","The internal carotid gives no branch in the neck and supplies the brain and orbit.","The ascending pharyngeal artery runs up the pharyngeal wall medial to this fossa."],"pearl": "Clamping the maxillary artery also cuts the middle meningeal — which is why a pterion fracture and an infratemporal fossa operation involve the same arterial tree."},{"id": "E95","set": "REL","ord": 3,"stem": "Which structures pass through the gap BETWEEN the superior and middle pharyngeal constrictors?","opts": ["Levator veli palatini and the pharyngotympanic tube","Stylopharyngeus muscle and the glossopharyngeal nerve","Internal laryngeal nerve and the superior laryngeal vessels","Recurrent laryngeal nerve and the inferior laryngeal artery","Ascending palatine artery and its tonsillar branch"],"ans": 1,"why": "Stylopharyngeus descends from the styloid process into the pharyngeal wall through this interval, carrying CN IX with it to reach the oropharynx and tonsillar bed.","wrong": ["Those two pass ABOVE the superior constrictor, through the sinus of Morgagni.","","Those two pierce the thyrohyoid membrane between the middle and inferior constrictors.","Those two pass below the inferior constrictor to reach the larynx from behind.","Those two ascend on the outer surface of the pharyngeal wall to the tonsil and palate."],"pearl": "Four gaps, four contents, top to bottom: tube and levator; stylopharyngeus and CN IX; internal laryngeal; recurrent laryngeal."},{"id": "E96","set": "INT","ord": 3,"stem": "During thyroidectomy both arterial supplies are ligated. From which parent vessels do the superior and inferior thyroid arteries arise?","opts": ["Both from the external carotid artery, arising a short distance apart on its front","Superior from the thyrocervical trunk of the subclavian; inferior from the external carotid","Superior from the external carotid; inferior from the thyrocervical trunk of the subclavian","Both from the subclavian artery, one directly and one through the thyrocervical trunk","Superior from the common carotid; inferior from the internal thoracic of the subclavian"],"ans": 2,"why": "The superior thyroid artery is the first anterior branch of the external carotid. The inferior thyroid artery is a branch of the thyrocervical trunk, which arises from the first part of the subclavian artery.","wrong": ["Only the superior thyroid artery comes from the external carotid; the inferior does not.","This reverses the two origins, which is the classic trap in this question.","","The subclavian supplies only the inferior thyroid artery, by way of the thyrocervical trunk.","Neither thyroid artery arises from the common carotid or the internal thoracic artery."],"pearl": "Two arteries, two origins, two nerves at risk: superior with the external laryngeal, inferior with the recurrent laryngeal."},{"id": "E97","set": "INT","ord": 3,"stem": "Match each extrinsic tongue muscle to its action. Which set is entirely correct?","opts": ["Genioglossus protrudes, hyoglossus depresses, styloglossus elevates, palatoglossus retracts","Genioglossus protrudes, hyoglossus depresses, styloglossus retracts, palatoglossus elevates","Genioglossus retracts, hyoglossus depresses, styloglossus protrudes, palatoglossus elevates","Genioglossus protrudes, hyoglossus retracts, styloglossus depresses, palatoglossus elevates","Genioglossus elevates, hyoglossus depresses, styloglossus retracts, palatoglossus protrudes"],"ans": 1,"why": "Genioglossus pulls the tongue forward from the mandible, hyoglossus pulls it down toward the hyoid, styloglossus pulls it back and up toward the styloid process, and palatoglossus lifts its posterior part toward the palate.","wrong": ["Palatoglossus elevates the posterior tongue rather than retracting it; retraction belongs to styloglossus.","","Genioglossus protrudes and styloglossus retracts, so this option exchanges their actions.","Styloglossus retracts and elevates the tongue and never depresses it, which is where this set fails.","Genioglossus protrudes and palatoglossus elevates the posterior tongue; these are reversed."],"pearl": "Name the attachment and the action follows: genio- forward, hyo- down, stylo- back, palato- up."},{"id": "E98","set": "LOC","ord": 3,"stem": "A patient can elevate the mandible normally and can protrude it, but cannot retract it. Which muscle is affected, and which of its neighbours would you expect to be normal?","opts": ["Temporalis affected; masseter and medial pterygoid normal","Masseter affected; temporalis and lateral pterygoid normal","Lateral pterygoid affected; temporalis and masseter normal","Medial pterygoid affected; masseter and temporalis normal","Buccinator affected; masseter and temporalis normal"],"ans": 0,"why": "Retraction is performed by the posterior fibres of temporalis alone. Masseter and medial pterygoid elevate and protrude, and lateral pterygoid protrudes and depresses — none of them retracts.","wrong": ["","Masseter elevates the mandible and plays no part in retraction.","Lateral pterygoid protrudes and depresses rather than retracts.","Medial pterygoid elevates and protrudes rather than retracts.","Buccinator is a facial muscle and does not move the mandible."],"pearl": "Elevation is shared by three muscles, so it never localises. Retraction belongs to temporalis alone and always does."},{"id": "E99","set": "AUT","ord": 3,"stem": "A patient reports that swallowing no longer relieves ear fullness on one side, and the palate droops on the same side. Which two muscles are affected, and which nerves supply them?","opts": ["Tensor veli palatini (V3) and levator veli palatini (CN X)","Tensor veli palatini (CN X) and levator veli palatini (CN X)","Tensor veli palatini (V3) and levator veli palatini (V3)","Salpingopharyngeus (CN X) and palatopharyngeus (CN IX)","Tensor tympani (V3) and levator veli palatini (CN IX)"],"ans": 0,"why": "Tensor veli palatini opens the pharyngotympanic tube during swallowing and is the one palatal muscle on V3. Levator veli palatini elevates the palate and, like the rest, is CN X.","wrong": ["","Tensor veli palatini is the one palatal muscle on V3, not on CN X.","Levator veli palatini is on CN X, not on V3.","Palatopharyngeus is CN X, and although salpingopharyngeus assists tubal opening, neither muscle elevates the palate.","Tensor tympani damps the ossicles rather than opening the tube, and levator is CN X."],"pearl": "Tensor tenses and opens the tube (V3). Levator lifts (CN X). Losing both at once means the lesion is near the skull base where they arise together."},{"id": "E100","set": "INT","ord": 3,"stem": "A patient has constant overflow of tears down one cheek after a midfacial fracture. Tracing the drainage pathway, where is the obstruction most likely, and into which space should the fluid normally arrive?","opts": ["The lacrimal gland ducts; the superior conjunctival fornix","The lacrimal canaliculi; the middle meatus of the nose","The lacrimal sac; the sphenoethmoidal recess of the nose","The nasolacrimal duct; the inferior meatus of the nose","The lacrimal punctum; the superior meatus of the nose"],"ans": 3,"why": "Tears pass from the puncta through the canaliculi to the lacrimal sac and down the nasolacrimal duct, which opens into the inferior meatus beneath the inferior concha. A midfacial fracture most often disrupts the duct within the bony canal.","wrong": ["The gland delivers tears to the fornix, so blocking it dries the eye rather than flooding it.","The canaliculi drain into the sac, and the middle meatus receives the paranasal sinuses.","The sac drains onward through the nasolacrimal duct into the inferior meatus, while that recess takes the sphenoid sinus.","","A punctum can stenose, but a midfacial fracture disrupts the duct within its bony canal."],"pearl": "The inferior meatus has exactly one customer: the nasolacrimal duct. That is why you sniff when you cry."}];
</script>
<script>
"use strict";
var app=document.getElementById('app'), bar=document.getElementById('bar');
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var S=null, tick=null, LEARN=false;

/* shuffle options per question so the key is never positional */
function prep(){
  return Q.map(function(q){
    var idx=q.opts.map(function(_,i){return i;});
    for(var a=idx.length-1;a>0;a--){var b=Math.floor(Math.random()*(a+1));var t=idx[a];idx[a]=idx[b];idx[b]=t;}
    return {id:q.id,set:q.set,ord:q.ord,stem:q.stem,why:q.why,pearl:q.pearl,
            opts:idx.map(function(i){return q.opts[i];}),
            wrong:idx.map(function(i){return q.wrong[i];}),
            ans:idx.indexOf(q.ans)};
  });
}
function shuffled(a){var x=a.slice();for(var i=x.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=x[i];x[i]=x[j];x[j]=t;}return x;}

/* ---------- start ---------- */
function renderStart(){
  S=null; bar.classList.add('hide'); stopClock();
  var best=0; try{best=parseInt(localStorage.getItem('hnss-final-best')||'0',10)||0;}catch(e){}
  app.innerHTML=
  '<div class="mast"><div class="brand">HoyaDocs <b>&middot;</b> Anatomy Final</div>'+
  '<div class="tag">Block 5 &middot; HNSS &middot; Rev 2 &middot; Updated Sep 27, 2026</div></div>'+
  '<h1>One hundred questions.<span>No easy marks.</span></h1>'+
  '<p class="lede">A full-length written paper built from the exam forecast, the annotated practice set, the GA cranial nerve review, the formative keys and all six lab quizzes &mdash; audited so that every distinct teachable point in those five documents is tested at least once. Almost every item is second or third order: you are given a finding and asked to localize it, then predict a different consequence of the same lesion.</p>'+
  '<div class="facts">'+
  '<div><span class="n">100</span><span class="l">Questions, five options each</span></div>'+
  '<div><span class="n">91</span><span class="l">Third-order items</span></div>'+
  '<div><span class="n">6</span><span class="l">Reasoning domains</span></div>'+
  '<div><span class="n">'+(best?best+'%':'&mdash;')+'</span><span class="l">Your best score</span></div>'+
  '</div>'+
  '<div class="fl"><span class="lab">Mode</span><div class="seg" id="segM">'+
  '<button data-v="exam" aria-pressed="'+(!LEARN)+'">Exam</button><button data-v="learn" aria-pressed="'+LEARN+'">Learning</button></div>'+
  '<p class="hint">'+(LEARN
    ? 'Answer, then the explanation opens straight away &mdash; the key, a line on each of the other four, and the pearl. No clock. Work through it like a tutorial.'
    : 'A full sitting: answer all hundred, flag as you go, then submit for the score and the full review.')+'</p></div>'+
  (LEARN?'':'<div class="fl"><span class="lab">Timing</span><div class="seg" id="segT">'+
  '<button data-v="100" aria-pressed="true">100 min</button><button data-v="130" aria-pressed="false">130 min</button><button data-v="0" aria-pressed="false">Untimed</button></div>'+
  '<p class="hint">A hundred minutes is one per question. Untimed is the better first pass &mdash; read every explanation as you go.</p></div>')+
  '<div class="fl"><span class="lab">Order</span><div class="seg" id="segO">'+
  '<button data-v="shuffle" aria-pressed="true">Shuffle</button><button data-v="domain" aria-pressed="false">By domain</button></div>'+
  '<p class="hint">Shuffling mixes the domains the way a real paper does. Option order is always randomised.</p></div>'+
  '<button class="go" id="btnStart">'+(LEARN?'Start learning':'Begin exam')+'</button>';
  var mins=LEARN?0:100, ord='shuffle';
  document.getElementById('segM').onclick=function(e){var b=e.target.closest('button');if(!b)return;
    LEARN=(b.dataset.v==='learn'); renderStart();};
  var segT=document.getElementById('segT');
  if(segT)segT.onclick=function(e){var b=e.target.closest('button');if(!b)return;mins=parseInt(b.dataset.v,10);
    [].forEach.call(this.children,function(c){c.setAttribute('aria-pressed',String(c===b));});};
  document.getElementById('segO').onclick=function(e){var b=e.target.closest('button');if(!b)return;ord=b.dataset.v;
    [].forEach.call(this.children,function(c){c.setAttribute('aria-pressed',String(c===b));});};
  document.getElementById('btnStart').onclick=function(){begin(LEARN?0:mins,ord,LEARN);};
}

/* ---------- exam ---------- */
function begin(mins,ord,learn){
  var deck=prep();
  deck = ord==='shuffle' ? shuffled(deck)
       : deck.sort(function(a,b){return Object.keys(SETS).indexOf(a.set)-Object.keys(SETS).indexOf(b.set);});
  S={deck:deck,i:0,pick:new Array(deck.length).fill(-1),flag:new Array(deck.length).fill(false),
     mins:mins,deadline:mins?Date.now()+mins*60000:0,learn:!!learn};
  bar.classList.remove('hide');
  document.getElementById('qt').textContent=deck.length;
  document.getElementById('clock').classList.toggle('hide',!mins);
  if(mins){startClock();}
  renderQ();
}
function startClock(){stopClock();tick=setInterval(function(){
  var left=S.deadline-Date.now();
  if(left<=0){stopClock();finish();return;}
  var m=Math.floor(left/60000), s=Math.floor(left%60000/1000);
  var el=document.getElementById('clock');
  el.textContent=m+':'+(s<10?'0':'')+s;
  el.classList.toggle('low',left<5*60000);
},250);}
function stopClock(){if(tick){clearInterval(tick);tick=null;}}

function updBar(){
  document.getElementById('qn').textContent=S.i+1;
  document.getElementById('an').textContent=S.pick.filter(function(p){return p>=0;}).length;
  document.getElementById('pbar').style.width=((S.i+1)/S.deck.length*100)+'%';
}
function learnScore(){
  var r=0,n=0;
  S.deck.forEach(function(q,i){ if(S.pick[i]>=0){n++; if(S.pick[i]===q.ans)r++;} });
  return {r:r,n:n};
}
function renderQ(){
  var q=S.deck[S.i];
  var shown = S.learn && S.pick[S.i]>=0;          /* learning mode: answered means revealed */
  var ok = shown && S.pick[S.i]===q.ans;
  var sc = S.learn ? learnScore() : null;
  updBar();
  app.innerHTML=
  '<div class="qcard"><div class="qmeta">'+
  '<span class="chip">'+esc(SETS[q.set])+'</span>'+
  '<span class="chip ord">'+(q.ord===3?'Third order':'Second order')+'</span>'+
  (shown?'<span class="vchip '+(ok?'y':'n')+'">'+(ok?'Correct':'Answer: '+'ABCDE'[q.ans])+'</span>':'')+
  (S.learn?'<span class="score">Correct <b>'+sc.r+'</b> / '+sc.n+'</span>':'')+
  '</div>'+
  '<p class="stem">'+q.stem+'</p><div class="opts" id="opts">'+
  q.opts.map(function(o,i){
    var cls='opt', note='';
    if(shown){
      if(i===q.ans){cls+=' ok'; note='<span class="onote">Correct answer</span>';}
      else {
        if(i===S.pick[S.i])cls+=' no';
        if(q.wrong[i])note='<span class="onote">'+esc(q.wrong[i])+'</span>';
      }
    }
    return '<button class="'+cls+'" data-i="'+i+'"'+(shown?' disabled':'')+' aria-pressed="'+(S.pick[S.i]===i)+'"><span class="k">'+'ABCDE'[i]+'</span><span>'+esc(o)+note+'</span></button>';
  }).join('')+
  '</div>'+
  (shown?'<div class="why">'+q.why+'</div><div class="pearl"><b>Pearl &middot;</b> '+q.pearl+'</div>':'')+
  '<div class="nav">'+
  '<button class="btn" id="prev"'+(S.i===0?' disabled':'')+'>&larr; Prev</button>'+
  '<button class="btn flagbtn" id="flag" aria-pressed="'+S.flag[S.i]+'">Flag</button>'+
  '<span class="spacer"></span>'+
  '<button class="btn primary" id="next">'+(S.i===S.deck.length-1?(S.learn?'Finish':'Review all'):(S.learn&&!shown?'Skip &rarr;':'Next &rarr;'))+'</button>'+
  '</div></div>'+
  '<details class="navwrap"><summary>Question navigator</summary>'+
  '<div class="navgrid" id="grid">'+S.deck.map(function(_,i){
    var c='cell'+(S.pick[i]>=0?' done':'')+(S.flag[i]?' flag':'')+(i===S.i?' cur':'');
    return '<button class="'+c+'" data-g="'+i+'">'+(i+1)+'</button>';}).join('')+'</div>'+
  '<div class="legend"><span><i class="sw d"></i>Answered</span><span><i class="sw f"></i>Flagged</span><span><i class="sw"></i>Untouched</span></div>'+
  '</details>';

  document.getElementById('opts').onclick=function(e){
    var b=e.target.closest('.opt'); if(!b||b.disabled)return;
    if(S.learn&&S.pick[S.i]>=0)return;
    S.pick[S.i]=parseInt(b.dataset.i,10);
    if(S.learn){renderQ();return;}
    [].forEach.call(this.children,function(c){c.setAttribute('aria-pressed',String(c===b));});
    updBar();
    var g=document.querySelector('[data-g="'+S.i+'"]'); if(g)g.classList.add('done');
  };
  document.getElementById('prev').onclick=function(){if(S.i>0){S.i--;renderQ();window.scrollTo(0,0);}};
  document.getElementById('next').onclick=function(){
    if(S.i===S.deck.length-1){finish();} else {S.i++;renderQ();window.scrollTo(0,0);} };
  document.getElementById('flag').onclick=function(){
    S.flag[S.i]=!S.flag[S.i]; this.setAttribute('aria-pressed',String(S.flag[S.i]));
    var g=document.querySelector('[data-g="'+S.i+'"]'); if(g)g.classList.toggle('flag',S.flag[S.i]);
  };
  document.getElementById('grid').onclick=function(e){
    var b=e.target.closest('[data-g]'); if(!b)return;
    S.i=parseInt(b.dataset.g,10); renderQ(); window.scrollTo(0,0);
  };
}

/* ---------- results ---------- */
function finish(){
  stopClock(); bar.classList.add('hide');
  var right=0, byset={}, byord={2:{r:0,n:0},3:{r:0,n:0}};
  S.deck.forEach(function(q,i){
    var ok=S.pick[i]===q.ans; if(ok)right++;
    if(!byset[q.set])byset[q.set]={r:0,n:0};
    byset[q.set].n++; if(ok)byset[q.set].r++;
    byord[q.ord].n++; if(ok)byord[q.ord].r++;
  });
  var n=S.deck.length, pct=Math.round(right/n*100);
  var skipped=S.pick.filter(function(p){return p<0;}).length;
  var best=0; try{best=parseInt(localStorage.getItem('hnss-final-best')||'0',10)||0;
    if(pct>best){localStorage.setItem('hnss-final-best',String(pct));}}catch(e){}
  var verdict = pct>=85?'Exam ready' : pct>=70?'Close &mdash; clean up the weak domains'
              : pct>=55?'The reasoning is forming, the traps are still landing'
              : 'Go back to the forecast before the next attempt';

  var bars=Object.keys(byset).sort(function(a,b){
      return byset[a].r/byset[a].n - byset[b].r/byset[b].n; })
    .map(function(k){var o=byset[k],p=Math.round(o.r/o.n*100);
      var cls=p<55?'low':(p<80?'mid':'');
      return '<div class="tbar"><span>'+esc(SETS[k])+'</span><span class="track"><i class="'+cls+'" style="width:'+p+'%"></i></span><span class="pc">'+p+'%</span></div>';}).join('');

  var rev=S.deck.map(function(q,i){
    var pick=S.pick[i], ok=pick===q.ans, cls=pick<0?'skip':(ok?'right':'wrong');
    var mark=pick<0?'Skipped':(ok?'Correct':'Missed');
    return '<details class="rev '+cls+'"><summary><span class="num">'+(i+1)+'</span>'+
      '<span>'+q.stem+'</span><span class="mark">'+mark+'</span></summary>'+
      '<div class="revbody"><ol>'+q.opts.map(function(o,j){
        var c=j===q.ans?' c':(j===pick?' y':'');
        var note=q.wrong[j]?'<em>'+esc(q.wrong[j])+'</em>':(j===q.ans?'<em>Correct answer</em>':'');
        return '<li class="'+c.trim()+'">'+esc(o)+note+'</li>';}).join('')+'</ol>'+
      '<div class="why">'+q.why+'</div>'+
      '<div class="pearl"><b>Pearl &middot;</b> '+q.pearl+'</div></div></details>';
  }).join('');

  app.innerHTML=
  '<div class="mast"><div class="brand">HoyaDocs <b>&middot;</b> Anatomy Final</div><div class="tag">Result</div></div>'+
  '<div class="hero"><div class="pct">'+pct+'%</div>'+
  '<div class="sub">'+right+' of '+n+' correct'+(pct>=best&&pct>0?' &middot; personal best':'')+'</div>'+
  '<div class="verdict">'+verdict+'</div></div>'+
  '<div class="rgrid">'+
  '<div><div class="v" style="color:var(--ok)">'+right+'</div><div class="k">Right</div></div>'+
  '<div><div class="v" style="color:var(--bad)">'+(n-right-skipped)+'</div><div class="k">Missed</div></div>'+
  '<div><div class="v" style="color:var(--muted)">'+skipped+'</div><div class="k">Skipped</div></div>'+
  '<div><div class="v">'+Math.round(byord[3].r/(byord[3].n||1)*100)+'%</div><div class="k">3rd order</div></div>'+
  '<div><div class="v">'+Math.round(byord[2].r/(byord[2].n||1)*100)+'%</div><div class="k">2nd order</div></div>'+
  '</div>'+
  '<h2 class="sec">Accuracy by domain <span class="tag">weakest first</span></h2>'+bars+
  '<h2 class="sec">Full review</h2>'+
  '<p class="hint" style="margin-bottom:12px">Every question, with your answer marked and each distractor explained. Open the ones you missed first.</p>'+
  rev+
  '<div class="nav" style="margin-top:24px"><button class="btn primary" id="again">Retake</button>'+
  '<button class="btn" id="home">Start screen</button></div>';
  var wasLearn=S.learn; document.getElementById('again').onclick=function(){begin(S.mins,'shuffle',wasLearn);window.scrollTo(0,0);};
  document.getElementById('home').onclick=function(){renderStart();window.scrollTo(0,0);};
  window.scrollTo(0,0);
}

document.getElementById('btnEnd').onclick=function(){
  var un=S?S.pick.filter(function(p){return p<0;}).length:0;
  if(un===0||confirm(un+' question'+(un===1?'':'s')+' still unanswered. Submit anyway?')) finish();
};
document.addEventListener('keydown',function(e){
  if(!S||!document.getElementById('opts'))return;
  var locked = S.learn && S.pick[S.i]>=0;
  if(!locked&&/^[1-5]$/.test(e.key)){var b=document.querySelector('.opt[data-i="'+(+e.key-1)+'"]');if(b){e.preventDefault();b.click();}}
  if(!locked&&/^[a-eA-E]$/.test(e.key)){var j='abcde'.indexOf(e.key.toLowerCase());var b2=document.querySelector('.opt[data-i="'+j+'"]');if(b2){e.preventDefault();b2.click();}}
  if(locked&&e.key==='Enter'){var nx=document.getElementById('next');if(nx){e.preventDefault();nx.click();}}
  if(e.key==='ArrowRight'){var n=document.getElementById('next');if(n){e.preventDefault();n.click();}}
  if(e.key==='ArrowLeft'){var p=document.getElementById('prev');if(p&&!p.disabled){e.preventDefault();p.click();}}
  if(e.key==='f'||e.key==='F'){var f=document.getElementById('flag');if(f){e.preventDefault();f.click();}}
});
renderStart();
</script></body></html>
