/* ============ EXPANSION TO 100 ============ */
{id:"E71",set:"REL",ord:3,
 stem:"Kiesselbach's plexus is formed by five arteries. Which of them arises from the INTERNAL carotid system, making this plexus a site where both carotid systems meet?",
 opts:["Sphenopalatine artery","Greater palatine artery","Superior labial artery","Anterior ethmoidal artery","Septal branch of the facial artery"],ans:3,
 why:"The anterior and posterior ethmoidal arteries come from the ophthalmic artery, a branch of the internal carotid. The sphenopalatine and greater palatine come from the maxillary artery, and the superior labial from the facial artery, all external carotid.",
 wrong:["External carotid, via the maxillary artery.","External carotid, via the maxillary artery.","External carotid, via the facial artery.","","External carotid, via the facial artery."],
 pearl:"Anterior epistaxis bleeds hard because two arterial systems anastomose there. Posterior epistaxis is sphenopalatine and needs a different approach."},
{id:"E72",set:"REL",ord:3,
 stem:"An arteriovenous fistula forms between a meningeal artery and a dural venous sinus. Which property of dural venous sinuses determines how the arterial blood behaves?",
 opts:["They contain valves that direct flow toward the heart","They have no valves, so flow can travel in either direction","They lie within the subarachnoid space and mix with CSF","Their pressure normally exceeds arterial pressure","They drain into the vertebral venous plexus only"],ans:1,
 why:"Dural venous sinuses lie between the periosteal and meningeal layers of dura and have no valves. Arterial blood entering a sinus is carried toward the internal jugular vein, but the absence of valves also permits retrograde flow.",
 wrong:["Sinuses have no valves at all.","","They lie between dural layers, not in the subarachnoid space.","Arterial pressure always exceeds venous, which is what drives the shunt.","Their main outflow is the internal jugular vein."],
 pearl:"No valves anywhere in the head's venous drainage. That single fact explains the danger triangle, emissary vein spread and dural fistula physiology."},
{id:"E73",set:"DSC",ord:3,
 stem:"Two intrinsic laryngeal muscles act on the arytenoid's muscular process in opposite directions. Which pair, and what does each do?",
 opts:["Posterior cricoarytenoid abducts and opens the glottis; lateral cricoarytenoid adducts and closes it","Posterior cricoarytenoid adducts; lateral cricoarytenoid abducts","Cricothyroid abducts; thyroarytenoid adducts","Transverse arytenoid abducts; oblique arytenoid adducts","Vocalis abducts; thyroarytenoid adducts"],ans:0,
 why:"Both are supplied by the recurrent laryngeal nerve and both pull on the muscular process, but in opposite directions: the posterior cricoarytenoid swings the vocal process laterally to open the glottis, the lateral cricoarytenoid swings it medially to close it.",
 wrong:["","This reverses them.","Cricothyroid tenses and is on the external laryngeal nerve; thyroarytenoid relaxes.","Both arytenoid muscles adduct.","Neither abducts."],
 pearl:"Posterior opens, Lateral closes. Same nerve, same bone, opposite directions — the cleanest antagonistic pair in the larynx."},
{id:"E74",set:"LOC",ord:3,
 stem:"A patient is in stridor with both vocal folds sitting near the midline. Which muscle has failed bilaterally, and why is the airway, rather than the voice, the problem?",
 opts:["Cricothyroid; pitch collapse narrows the airway","Posterior cricoarytenoid; it is the only abductor, so nothing opens the glottis","Lateral cricoarytenoid; unopposed adduction closes the glottis","Thyroarytenoid; relaxed folds flap into the airway","Transverse arytenoid; the posterior glottis seals"],ans:1,
 why:"Every other intrinsic muscle adducts or tenses. With both posterior cricoarytenoids denervated there is no abductor anywhere, so the folds rest adducted and the airway, not phonation, is threatened.",
 wrong:["Cricothyroid affects pitch, not calibre.","","Losing the lateral cricoarytenoid would OPEN the glottis, not close it.","Thyroarytenoid loss changes voice quality.","Loss of an adductor cannot narrow the airway."],
 pearl:"Unilateral recurrent laryngeal palsy is a voice problem. Bilateral is an airway emergency, because the sole abductor is gone on both sides."},
{id:"E75",set:"REL",ord:3,
 stem:"A tag sits on the POSTERIOR tonsillar pillar. Name the fold, the muscle within it, and its nerve.",
 opts:["Palatoglossal fold; palatoglossus; CN X","Palatopharyngeal fold; palatopharyngeus; CN X","Palatopharyngeal fold; palatopharyngeus; CN IX","Salpingopharyngeal fold; salpingopharyngeus; CN IX","Palatoglossal fold; palatoglossus; CN XII"],ans:1,
 why:"The posterior pillar is the palatopharyngeal fold, raised by palatopharyngeus, which like almost all palatal and pharyngeal muscles is CN X through the pharyngeal plexus.",
 wrong:["That is the ANTERIOR pillar.","","CN IX supplies only stylopharyngeus.","That fold is in the nasopharynx, not the tonsillar region.","Palatoglossus is CN X, not CN XII, and sits in the anterior pillar."],
 pearl:"Anterior pillar palatoglossal, posterior pillar palatopharyngeal, palatine tonsil between them, CN IX just deep to the bed."},
{id:"E76",set:"DSC",ord:3,
 stem:"A thin sheet of muscle in the superficial fascia of the neck is tagged. Which nerve supplies it, and which nerve supplies the SKIN directly over it?",
 opts:["Motor: cervical branch of CN VII. Sensory: transverse cervical nerve of the cervical plexus","Motor: ansa cervicalis. Sensory: great auricular nerve","Motor: cervical plexus. Sensory: cervical branch of CN VII","Motor: CN XI. Sensory: supraclavicular nerves","Motor and sensory: both cervical plexus"],ans:0,
 why:"Platysma is a muscle of facial expression that migrated into the neck, so it is CN VII through the cervical branch. The overlying skin of the anterior triangle is supplied by the transverse cervical nerve from the cervical plexus.",
 wrong:["","Ansa cervicalis supplies the infrahyoid straps, deep to platysma.","This reverses motor and sensory.","CN XI supplies sternocleidomastoid and trapezius.","The motor supply is cranial, not cervical."],
 pearl:"Platysma is the one muscle of facial expression below the mandible. Its nerve is the giveaway that it is a second arch derivative."},
{id:"E77",set:"REL",ord:2,
 stem:"Three foramina lie in a near-vertical line on the front of the skull. Which trigeminal divisions emerge from them, from top to bottom?",
 opts:["V1, V2, V3","V1, V3, V2","V2, V1, V3","V3, V2, V1","V2, V3, V1"],ans:0,
 why:"The supraorbital foramen transmits the supraorbital nerve of V1, the infraorbital foramen the infraorbital nerve of V2, and the mental foramen the mental nerve of V3.",
 wrong:["","V2 and V3 are swapped.","V1 is uppermost.","This is inverted.","This is scrambled."],
 pearl:"Supraorbital, infraorbital, mental — V1, V2, V3 stacked in order down the face, a favourite dry-skull tag."},
{id:"E78",set:"LOC",ord:3,
 stem:"A lesion spares levator palpebrae superioris and superior rectus but paralyses medial rectus, inferior rectus and inferior oblique, with a dilated pupil. Which part of CN III is involved?",
 opts:["Superior division only","Inferior division only","The whole nerve trunk","The Edinger-Westphal nucleus only","The ciliary ganglion only"],ans:1,
 why:"The inferior division supplies medial rectus, inferior rectus and inferior oblique, and carries the parasympathetic root to the ciliary ganglion. The superior division, supplying levator and superior rectus, is spared.",
 wrong:["That would paralyse the lid and superior rectus.","","A whole-trunk lesion would add ptosis.","That would give a dilated pupil with normal eye movements.","That too would spare the extraocular muscles."],
 pearl:"Preserved lid elevation with a blown pupil localises to the inferior division, because the parasympathetics travel with it."},
{id:"E79",set:"DSC",ord:3,
 stem:"A patient with vertical diplopia habitually tilts the head to the LEFT. Which nerve is affected, on which side, and what is the mechanism?",
 opts:["Right CN IV; the right eye is extorted and slightly elevated, and tilting away realigns the images","Left CN IV; tilting toward the lesion compensates","Right CN VI; tilting compensates for lost abduction","Left CN III; tilting lifts the ptotic lid","Right CN IV; tilting toward the lesion compensates"],ans:0,
 why:"Loss of superior oblique leaves the eye extorted and a little elevated. Head tilt to the opposite side drives compensatory intorsion of that eye and brings the two images together.",
 wrong:["","The tilt is away from the lesion, not toward it.","CN VI palsy causes horizontal, not vertical, diplopia.","CN III palsy gives a down-and-out eye with severe ptosis.","The direction of tilt is wrong."],
 pearl:"Head tilts AWAY from a CN IV palsy. Normally a leftward tilt extorts the right eye and intorts the left."},
{id:"E80",set:"INT",ord:3,
 stem:"During carotid surgery, manipulation near the bifurcation produces sudden bradycardia and hypotension. Which structure was stimulated, what does it sense, and which nerve carries the afferent?",
 opts:["Carotid body; oxygen tension; CN X","Carotid sinus; arterial stretch; CN IX","Carotid body; arterial stretch; CN IX","Carotid sinus; carbon dioxide; CN X","Superior cervical ganglion; sympathetic tone; CN IX"],ans:1,
 why:"The carotid sinus is a baroreceptor in the dilated proximal internal carotid. Stretch signals travel in CN IX and reflexly slow the heart and drop the pressure.",
 wrong:["The carotid body is a chemoreceptor and would not produce this reflex.","","The body senses chemistry, not stretch.","The sinus senses pressure, and its afferent is CN IX.","The ganglion is efferent sympathetic."],
 pearl:"Sinus senses stretch, body senses chemistry. Both report to CN IX, and the sinus reflex is why surgeons infiltrate it with local anaesthetic."},
{id:"E81",set:"DSC",ord:3,
 stem:"A patient has acute unilateral facial weakness involving the forehead, with normal taste, normal tearing and no hyperacusis. Where along CN VII does this place the lesion, and what is the likely diagnosis?",
 opts:["Proximal to the greater petrosal nerve; Ramsay Hunt syndrome","At or near the stylomastoid foramen; Bell palsy","At the internal acoustic meatus; acoustic neuroma","In the cerebral cortex; a stroke","At the geniculate ganglion; herpes zoster"],ans:1,
 why:"Forehead involvement makes it peripheral. Sparing of tears, stapedius and taste places it distal to all three of those branches, which is the stylomastoid region — the classic Bell palsy location.",
 wrong:["That would abolish tearing and taste and add hyperacusis.","","That would usually add hearing loss.","A cortical lesion spares the forehead.","That would abolish tearing and add ear pain and vesicles."],
 pearl:"Bell palsy follows inflammation within the facial canal or near the stylomastoid exit, and is a diagnosis of exclusion."},
{id:"E82",set:"DSC",ord:3,
 stem:"Two muscles lie stacked immediately beneath the orbital roof and share one cranial nerve. How would you tell their deficits apart clinically?",
 opts:["Levator palpebrae superioris loss drops the lid; superior rectus loss impairs upgaze of the globe","Levator loss impairs upgaze; superior rectus loss drops the lid","Both drop the lid equally","Both impair upgaze equally","Levator loss causes proptosis; superior rectus loss causes ptosis"],ans:0,
 why:"Both are CN III and lie one on top of the other, but levator palpebrae superioris inserts into the superior tarsus and moves the LID, while superior rectus inserts on the sclera and moves the GLOBE.",
 wrong:["","This reverses them.","Only levator moves the lid.","Only superior rectus elevates the globe.","Neither causes proptosis."],
 pearl:"On a specimen they are stacked and easy to confuse. Lid versus globe is the functional test that separates them."},
{id:"E83",set:"DSC",ord:2,
 stem:"On laryngoscopy, which set of features identifies the TRUE vocal fold rather than the vestibular fold?",
 opts:["Superior, pink, thick, with a rounded edge","Inferior, pearly white, with a sharp free edge","Superior, white, with a sharp edge","Inferior, pink, with a rounded edge","Neither can be distinguished without palpation"],ans:1,
 why:"The avascular vocal ligament under the mucosa makes the true fold white with a crisp edge. The vestibular fold above it is pinker and thicker, and the ventricle lies between them.",
 wrong:["That is the vestibular fold.","","Colour is right but position is wrong.","Position is right but colour is wrong.","They are readily distinguished on inspection."],
 pearl:"White and sharp is true, pink and plump is false, ventricle in between."},
{id:"E84",set:"REL",ord:3,
 stem:"Two strap muscles both attach to the thyroid cartilage. Which is which, and why do they have different nerves?",
 opts:["Thyrohyoid runs hyoid to thyroid and is C1 via CN XII; sternothyroid runs sternum to thyroid and is ansa cervicalis","Thyrohyoid is ansa cervicalis; sternothyroid is C1 via CN XII","Both are ansa cervicalis","Both are C1 via CN XII","Thyrohyoid is CN VII; sternothyroid is ansa cervicalis"],ans:0,
 why:"Thyrohyoid is the exception among the infrahyoid muscles: C1 fibres travelling with CN XII leave the nerve to supply it, and also geniohyoid. The other three straps are ansa cervicalis.",
 wrong:["","This reverses them.","Thyrohyoid is the exception.","Only thyrohyoid and geniohyoid are C1.","No strap muscle is CN VII."],
 pearl:"Three of four infrahyoids on the ansa, one quarter (thyrohyoid) on C1 riding CN XII."},
{id:"E85",set:"REL",ord:3,
 stem:"Two veins in the face are easily confused on a specimen. Which description correctly matches each?",
 opts:["Retromandibular lies within the parotid and is formed by superficial temporal plus maxillary; facial runs obliquely across the face with the facial artery","Retromandibular runs with the facial artery; facial lies within the parotid","Both lie within the parotid","Retromandibular drains the orbit; facial drains the scalp","Facial is formed by superficial temporal plus maxillary; retromandibular drains the lip"],ans:0,
 why:"The retromandibular vein forms inside the parotid from the superficial temporal and maxillary veins. The facial vein is superficial, running with the facial artery from the medial angle of the eye down across the mandible.",
 wrong:["","This reverses them.","Only the retromandibular is intraparotid.","The facial vein communicates with the orbit, not the retromandibular.","This reverses the tributaries."],
 pearl:"The facial vein's communication with the ophthalmic veins is what makes the danger triangle dangerous."},
{id:"E86",set:"LOC",ord:3,
 stem:"A patient's jaw deviates to the RIGHT on opening. Which muscle is weak, on which side, and why does the jaw move that way?",
 opts:["Right lateral pterygoid; the intact left muscle protrudes the left condyle and swings the jaw right","Left lateral pterygoid; the intact right muscle swings the jaw right","Right temporalis; unopposed retraction pulls the jaw right","Right masseter; unopposed elevation pulls the jaw right","Left medial pterygoid; unopposed elevation swings the jaw right"],ans:0,
 why:"Lateral pterygoid protrudes the mandible and swings it to the opposite side. With the right paralysed, the left one pushes the jaw across to the right, toward the weak side.",
 wrong:["","A left lesion would deviate the jaw left.","Temporalis retracts and elevates; it does not cause deviation on opening.","Masseter elevates and does not open the jaw.","Medial pterygoid elevates and protrudes but is not the main opener."],
 pearl:"Jaw deviates TOWARD the weak side on opening — the same rule as the tongue in CN XII palsy."},
{id:"E87",set:"REL",ord:2,
 stem:"The frontal nerve divides into two terminal branches. Which are they, and which division of CN V do they belong to?",
 opts:["Supraorbital and supratrochlear; V1","Supraorbital and infraorbital; V1 and V2","Infratrochlear and external nasal; V1","Zygomaticofacial and zygomaticotemporal; V2","Supratrochlear and infratrochlear; V2"],ans:0,
 why:"The frontal nerve is the largest V1 branch, running forward under the orbital roof and dividing into the supraorbital and supratrochlear nerves to supply the forehead and anterior scalp.",
 wrong:["","The infraorbital nerve is V2.","Those are nasociliary branches.","Those are zygomatic branches of V2.","Both belong to V1, and infratrochlear is nasociliary."],
 pearl:"Frontal is the nerve you meet first on lifting the orbital roof, lying directly on levator palpebrae superioris."},
{id:"E88",set:"SRG",ord:3,
 stem:"A retropharyngeal abscess is drained. The surgeon must know which fascial plane it occupies, because one plane stops at the mediastinum and another does not. Which pair of boundaries defines the space that reaches the DIAPHRAGM?",
 opts:["Buccopharyngeal and alar fascia","Alar and prevertebral fascia","Investing and pretracheal fascia","Pretracheal fascia and the carotid sheath","Prevertebral fascia and the vertebral bodies"],ans:1,
 why:"The danger space lies between the alar and prevertebral fasciae and runs uninterrupted from the skull base to the diaphragm. The retropharyngeal space proper, between buccopharyngeal and alar fascia, ends around T1 to T6.",
 wrong:["That is the retropharyngeal space, which stops at T1 to T6.","","Those enclose the infrahyoid compartment.","Pretracheal spread goes anterior to the pericardium.","There is no clinically relevant space there."],
 pearl:"Two spaces, one fascia apart. Alar fascia is the divider, and which side of it the pus sits on decides how far it travels."},
{id:"E89",set:"SRG",ord:3,
 stem:"A scalp wound bleeds profusely and its edges gape widely. A week later infection has tracked into the eyelids. Which two layers explain these two behaviours?",
 opts:["Skin for the bleeding; pericranium for the spread","Dense connective tissue for the bleeding; loose connective tissue for the spread","Aponeurosis for the bleeding; skin for the spread","Loose connective tissue for the bleeding; dense connective tissue for the spread","Pericranium for both"],ans:1,
 why:"Layer two is dense and richly vascular, with vessels tethered open so they cannot retract — hence profuse bleeding. Layer four is loose areolar tissue, the danger area, through which blood and pus spread freely and forward into the eyelids.",
 wrong:["Skin alone bleeds no more than elsewhere; pericranium limits spread to one bone.","","The aponeurosis is what makes the wound GAPE when cut transversely.","This reverses the two layers.","Pericranium is adherent at the sutures and limits spread."],
 pearl:"SCALP: Skin, Connective tissue, Aponeurosis, Loose connective tissue, Pericranium. Layer 2 bleeds, layer 4 spreads, layer 3 makes it gape."},
{id:"E90",set:"AUT",ord:3,
 stem:"Taste is lost from the root of the tongue and the epiglottis, but taste over the posterior third and the anterior two-thirds is normal. Which nerve is affected?",
 opts:["CN VII via the chorda tympani","CN IX","CN X","CN V3 via the lingual nerve","CN XII"],ans:2,
 why:"Three nerves carry taste, front to back: CN VII for the anterior two-thirds, CN IX for the posterior third, and CN X for the root of the tongue and the epiglottis.",
 wrong:["That covers the anterior two-thirds.","That covers the posterior third.","","The lingual nerve carries general sensation, not taste, in its own right.","CN XII is purely motor."],
 pearl:"Most students stop at two taste nerves. The review adds a third: CN X takes the root and epiglottis."},
{id:"E91",set:"AUT",ord:3,
 stem:"Which branch of CN VII carries BOTH branchial motor and general sensory fibres, and what does each component supply?",
 opts:["Chorda tympani; taste and salivation","Greater petrosal nerve; lacrimation and nasal secretion","Posterior auricular nerve; occipital belly and auricular muscles, plus skin of the external ear","Nerve to stapedius; the stapedius muscle only","Marginal mandibular branch; depressor muscles and lower lip skin"],ans:2,
 why:"The posterior auricular nerve is motor to the occipital belly of occipitofrontalis and the auricular muscles, and sensory to the skin of the external ear.",
 wrong:["That carries special sensory and parasympathetic fibres.","That carries parasympathetic fibres only.","","That is branchial motor only.","The terminal branches are motor only; lower lip skin is the mental nerve of V3."],
 pearl:"This branch is why Ramsay Hunt gives ear pain and vesicles alongside facial weakness — CN VII genuinely has a skin territory."},
{id:"E92",set:"REL",ord:3,
 stem:"All four cutaneous branches of the cervical plexus emerge at one point. Where is it, and which branch supplies the skin over the CLAVICLE?",
 opts:["Anterior border of sternocleidomastoid; great auricular nerve","Posterior border of sternocleidomastoid; supraclavicular nerves","Posterior border of trapezius; lesser occipital nerve","Anterior border of trapezius; transverse cervical nerve","Midpoint of the clavicle; supraclavicular nerves"],ans:1,
 why:"The nerve point of the neck lies at the middle of the posterior border of sternocleidomastoid, where the great auricular, lesser occipital, transverse cervical and supraclavicular nerves all emerge. The supraclavicular nerves cover the clavicle and shoulder.",
 wrong:["The point is on the posterior border, and the great auricular covers the ear and mastoid.","","The lesser occipital covers scalp behind the ear.","The transverse cervical covers the anterior triangle.","They emerge higher, at the nerve point."],
 pearl:"One point, four nerves, four territories: ear and mastoid, behind the ear, anterior triangle, clavicle and shoulder."},
{id:"E93",set:"SRG",ord:3,
 stem:"A supraclavicular block is placed and the patient becomes breathless. Which nerve was affected, where does it lie, and what is its root value?",
 opts:["Phrenic nerve, on the anterior surface of anterior scalene, C3 to C5","Phrenic nerve, posterior to anterior scalene, C5 to C7","Long thoracic nerve, on middle scalene, C5 to C7","Vagus nerve, in the carotid sheath, cranial","Recurrent laryngeal nerve, in the tracheo-oesophageal groove, cranial"],ans:0,
 why:"The phrenic nerve arises from C3, C4 and C5 and descends on the ANTERIOR surface of anterior scalene, where local anaesthetic tracking from a supraclavicular block can reach it and paralyse the hemidiaphragm.",
 wrong:["","It lies anterior to the muscle, and its roots are C3 to C5.","That would cause scapular winging, not breathlessness.","Vagal block would affect voice and swallowing.","That would cause hoarseness."],
 pearl:"C3, 4, 5 keeps the diaphragm alive. Anterior to anterior scalene is phrenic; posterior to it are the trunks and the subclavian artery."},
{id:"E94",set:"INT",ord:3,
 stem:"A schwannoma is resected from the infratemporal fossa and bleeding is controlled by clamping the main arterial supply of the region. Which artery, and which of its branches would also be devascularised?",
 opts:["Facial artery; the tonsillar and submental branches","Maxillary artery; the inferior alveolar, middle meningeal, deep temporal and buccal branches","Superficial temporal artery; the frontal and parietal branches","Internal carotid artery; the ophthalmic branch","Ascending pharyngeal artery; its pharyngeal branches"],ans:1,
 why:"The maxillary artery is the larger terminal branch of the external carotid and the principal supply of the infratemporal fossa. Its branches there include the inferior alveolar, middle meningeal, deep temporal and buccal arteries.",
 wrong:["The facial artery supplies the face and tonsil, outside this fossa.","","The superficial temporal artery supplies the scalp.","The internal carotid supplies the brain and orbit.","The ascending pharyngeal artery runs on the pharyngeal wall."],
 pearl:"Clamping the maxillary artery also cuts the middle meningeal — which is why a pterion fracture and an infratemporal fossa operation involve the same arterial tree."},
{id:"E95",set:"REL",ord:3,
 stem:"Which structures pass through the gap BETWEEN the superior and middle pharyngeal constrictors?",
 opts:["Levator veli palatini and the pharyngotympanic tube","Stylopharyngeus and the glossopharyngeal nerve","Internal laryngeal nerve and the superior laryngeal vessels","Recurrent laryngeal nerve and the inferior laryngeal artery","Ascending palatine artery alone"],ans:1,
 why:"Stylopharyngeus descends from the styloid process into the pharyngeal wall through this interval, carrying CN IX with it to reach the oropharynx and tonsillar bed.",
 wrong:["Those pass ABOVE the superior constrictor.","","Those pass between middle and inferior.","That passes below the inferior constrictor.","That accompanies levator veli palatini above the superior constrictor."],
 pearl:"Four gaps, four contents, top to bottom: tube and levator; stylopharyngeus and CN IX; internal laryngeal; recurrent laryngeal."},
{id:"E96",set:"INT",ord:3,
 stem:"During thyroidectomy both arterial supplies are ligated. From which parent vessels do the superior and inferior thyroid arteries arise?",
 opts:["Both from the external carotid artery","Superior from the external carotid; inferior from the thyrocervical trunk of the subclavian","Superior from the thyrocervical trunk; inferior from the external carotid","Both from the subclavian artery","Superior from the common carotid; inferior from the internal thoracic artery"],ans:1,
 why:"The superior thyroid artery is the first anterior branch of the external carotid. The inferior thyroid artery is a branch of the thyrocervical trunk, which arises from the first part of the subclavian artery.",
 wrong:["Only the superior is external carotid.","","This reverses them.","Only the inferior derives from the subclavian.","Neither arises from those vessels."],
 pearl:"Two arteries, two origins, two nerves at risk: superior with the external laryngeal, inferior with the recurrent laryngeal."},
{id:"E97",set:"INT",ord:3,
 stem:"Match each extrinsic tongue muscle to its action. Which set is entirely correct?",
 opts:["Genioglossus protrudes, hyoglossus depresses, styloglossus retracts, palatoglossus elevates","Genioglossus retracts, hyoglossus elevates, styloglossus protrudes, palatoglossus depresses","Genioglossus depresses, hyoglossus protrudes, styloglossus elevates, palatoglossus retracts","Genioglossus elevates, hyoglossus retracts, styloglossus depresses, palatoglossus protrudes","All four protrude the tongue to differing degrees"],ans:0,
 why:"Genioglossus pulls the tongue forward from the mandible, hyoglossus pulls it down toward the hyoid, styloglossus pulls it back and up toward the styloid process, and palatoglossus lifts its posterior part toward the palate.",
 wrong:["","Each of these is reversed.","Each of these is reversed.","Each of these is reversed.","They act in different directions."],
 pearl:"Name the attachment and the action follows: genio- forward, hyo- down, stylo- back, palato- up."},
{id:"E98",set:"LOC",ord:3,
 stem:"A patient can elevate the mandible normally and can protrude it, but cannot retract it. Which muscle is affected, and which of its neighbours would you expect to be normal?",
 opts:["Temporalis affected; masseter and both pterygoids normal","Masseter affected; temporalis normal","Lateral pterygoid affected; temporalis normal","Medial pterygoid affected; masseter normal","Buccinator affected; temporalis normal"],ans:0,
 why:"Retraction is performed by the posterior fibres of temporalis alone. Masseter and medial pterygoid elevate and protrude, and lateral pterygoid protrudes and depresses — none of them retracts.",
 wrong:["","Masseter does not retract.","Lateral pterygoid protrudes and depresses.","Medial pterygoid elevates and protrudes.","Buccinator does not move the mandible."],
 pearl:"Elevation is shared by three muscles, so it never localises. Retraction belongs to temporalis alone and always does."},
{id:"E99",set:"AUT",ord:3,
 stem:"A patient reports that swallowing no longer relieves ear fullness on one side, and the palate droops on the same side. Which two muscles are affected, and which nerves supply them?",
 opts:["Tensor veli palatini (V3) and levator veli palatini (CN X)","Both tensor and levator veli palatini, both CN X","Both tensor and levator veli palatini, both V3","Salpingopharyngeus (CN IX) and palatoglossus (CN XII)","Musculus uvulae (V3) and palatopharyngeus (CN IX)"],ans:0,
 why:"Tensor veli palatini opens the pharyngotympanic tube during swallowing and is the one palatal muscle on V3. Levator veli palatini elevates the palate and, like the rest, is CN X.",
 wrong:["","Tensor is V3, not CN X.","Levator is CN X, not V3.","Salpingopharyngeus is CN X and palatoglossus is CN X.","Musculus uvulae is CN X and palatopharyngeus is CN X."],
 pearl:"Tensor tenses and opens the tube (V3). Levator lifts (CN X). Losing both at once means the lesion is near the skull base where they arise together."},
{id:"E100",set:"INT",ord:3,
 stem:"A patient has constant overflow of tears down one cheek after a midfacial fracture. Tracing the drainage pathway, where is the obstruction most likely, and into which space should the fluid normally arrive?",
 opts:["Lacrimal gland; the conjunctival sac","Nasolacrimal duct; the inferior meatus","Lacrimal canaliculi; the middle meatus","Lacrimal sac; the sphenoethmoidal recess","Punctum; the superior meatus"],ans:1,
 why:"Tears pass from the puncta through the canaliculi to the lacrimal sac and down the nasolacrimal duct, which opens into the inferior meatus beneath the inferior concha. A midfacial fracture most often disrupts the duct within the bony canal.",
 wrong:["The gland produces tears; obstruction there would cause a dry eye, not overflow.","","The canaliculi drain to the sac, and the middle meatus takes sinuses.","The sac drains to the inferior meatus, not that recess.","A punctal problem is possible but the duct is what a midfacial fracture disrupts, and it opens into the inferior meatus."],
 pearl:"The inferior meatus has exactly one customer: the nasolacrimal duct. That is why you sniff when you cry."}
];
</script>
<script>
"use strict";
var app=document.getElementById('app'), bar=document.getElementById('bar');
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var S=null, tick=null;

/* shuffle options per question so the key is never positional */
function prep(){
  return Q.map(function(q){
    var idx=q.opts.map(function(_,i){return i;});
    for(var a=idx.length-1;a>0;a--){var b=Math.floor(Math.random()*(a+1));var t=idx[a];idx[a]=idx[b];idx[b]=t;}
    return {id:q.id,set:q.set,ord:q.ord,stem:q.stem,why:q.why,pearl:q.pearl,
            opts:idx.map(function(i){return q.opts[i];}),
            wrong:idx.map(function(i){return q.wrong[i];}),
            ans:idx.indexOf(q.ans)};
  });
}
function shuffled(a){var x=a.slice();for(var i=x.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=x[i];x[i]=x[j];x[j]=t;}return x;}

/* ---------- start ---------- */
function renderStart(){
  S=null; bar.classList.add('hide'); stopClock();
  var best=0; try{best=parseInt(localStorage.getItem('hnss-final-best')||'0',10)||0;}catch(e){}
  app.innerHTML=
  '<div class="mast"><div class="brand">HoyaDocs <b>&middot;</b> Anatomy Final</div>'+
  '<div class="tag">Block 5 &middot; HNSS &middot; Rev 1 &middot; Updated Sep 27, 2026</div></div>'+
  '<h1>One hundred questions.<span>No easy marks.</span></h1>'+
  '<p class="lede">A full-length written paper built from the exam forecast, the annotated practice set, the GA cranial nerve review, the formative keys and all six lab quizzes &mdash; audited so that every distinct teachable point in those five documents is tested at least once. Almost every item is second or third order: you are given a finding and asked to localize it, then predict a different consequence of the same lesion.</p>'+
  '<div class="facts">'+
  '<div><span class="n">100</span><span class="l">Questions, five options each</span></div>'+
  '<div><span class="n">91</span><span class="l">Third-order items</span></div>'+
  '<div><span class="n">6</span><span class="l">Reasoning domains</span></div>'+
  '<div><span class="n">'+(best?best+'%':'&mdash;')+'</span><span class="l">Your best score</span></div>'+
  '</div>'+
  '<div class="fl"><span class="lab">Timing</span><div class="seg" id="segT">'+
  '<button data-v="100" aria-pressed="true">100 min</button><button data-v="130" aria-pressed="false">130 min</button><button data-v="0" aria-pressed="false">Untimed</button></div>'+
  '<p class="hint">A hundred minutes is one per question. Untimed is the better first pass &mdash; read every explanation as you go.</p></div>'+
  '<div class="fl"><span class="lab">Order</span><div class="seg" id="segO">'+
  '<button data-v="shuffle" aria-pressed="true">Shuffle</button><button data-v="domain" aria-pressed="false">By domain</button></div>'+
  '<p class="hint">Shuffling mixes the domains the way a real paper does. Option order is always randomised.</p></div>'+
  '<button class="go" id="btnStart">Begin exam</button>';
  var mins=100, ord='shuffle';
  document.getElementById('segT').onclick=function(e){var b=e.target.closest('button');if(!b)return;mins=parseInt(b.dataset.v,10);
    [].forEach.call(this.children,function(c){c.setAttribute('aria-pressed',String(c===b));});};
  document.getElementById('segO').onclick=function(e){var b=e.target.closest('button');if(!b)return;ord=b.dataset.v;
    [].forEach.call(this.children,function(c){c.setAttribute('aria-pressed',String(c===b));});};
  document.getElementById('btnStart').onclick=function(){begin(mins,ord);};
}

/* ---------- exam ---------- */
function begin(mins,ord){
  var deck=prep();
  deck = ord==='shuffle' ? shuffled(deck)
       : deck.sort(function(a,b){return Object.keys(SETS).indexOf(a.set)-Object.keys(SETS).indexOf(b.set);});
  S={deck:deck,i:0,pick:new Array(deck.length).fill(-1),flag:new Array(deck.length).fill(false),
     mins:mins,deadline:mins?Date.now()+mins*60000:0};
  bar.classList.remove('hide');
  document.getElementById('qt').textContent=deck.length;
  document.getElementById('clock').classList.toggle('hide',!mins);
  if(mins){startClock();}
  renderQ();
}
function startClock(){stopClock();tick=setInterval(function(){
  var left=S.deadline-Date.now();
  if(left<=0){stopClock();finish();return;}
  var m=Math.floor(left/60000), s=Math.floor(left%60000/1000);
  var el=document.getElementById('clock');
  el.textContent=m+':'+(s<10?'0':'')+s;
  el.classList.toggle('low',left<5*60000);
},250);}
function stopClock(){if(tick){clearInterval(tick);tick=null;}}

function updBar(){
  document.getElementById('qn').textContent=S.i+1;
  document.getElementById('an').textContent=S.pick.filter(function(p){return p>=0;}).length;
  document.getElementById('pbar').style.width=((S.i+1)/S.deck.length*100)+'%';
}
function renderQ(){
  var q=S.deck[S.i];
  updBar();
  app.innerHTML=
  '<div class="qcard"><div class="qmeta">'+
  '<span class="chip">'+esc(SETS[q.set])+'</span>'+
  '<span class="chip ord">'+(q.ord===3?'Third order':'Second order')+'</span></div>'+
  '<p class="stem">'+q.stem+'</p><div class="opts" id="opts">'+
  q.opts.map(function(o,i){return '<button class="opt" data-i="'+i+'" aria-pressed="'+(S.pick[S.i]===i)+'"><span class="k">'+'ABCDE'[i]+'</span><span>'+esc(o)+'</span></button>';}).join('')+
  '</div><div class="nav">'+
  '<button class="btn" id="prev"'+(S.i===0?' disabled':'')+'>&larr; Prev</button>'+
  '<button class="btn flagbtn" id="flag" aria-pressed="'+S.flag[S.i]+'">Flag</button>'+
  '<span class="spacer"></span>'+
  '<button class="btn primary" id="next">'+(S.i===S.deck.length-1?'Review all':'Next &rarr;')+'</button>'+
  '</div></div>'+
  '<details class="navwrap"><summary>Question navigator</summary>'+
  '<div class="navgrid" id="grid">'+S.deck.map(function(_,i){
    var c='cell'+(S.pick[i]>=0?' done':'')+(S.flag[i]?' flag':'')+(i===S.i?' cur':'');
    return '<button class="'+c+'" data-g="'+i+'">'+(i+1)+'</button>';}).join('')+'</div>'+
  '<div class="legend"><span><i class="sw d"></i>Answered</span><span><i class="sw f"></i>Flagged</span><span><i class="sw"></i>Untouched</span></div>'+
  '</details>';

  document.getElementById('opts').onclick=function(e){
    var b=e.target.closest('.opt'); if(!b)return;
    S.pick[S.i]=parseInt(b.dataset.i,10);
    [].forEach.call(this.children,function(c){c.setAttribute('aria-pressed',String(c===b));});
    updBar();
    var g=document.querySelector('[data-g="'+S.i+'"]'); if(g)g.classList.add('done');
  };
  document.getElementById('prev').onclick=function(){if(S.i>0){S.i--;renderQ();window.scrollTo(0,0);}};
  document.getElementById('next').onclick=function(){
    if(S.i===S.deck.length-1){finish();} else {S.i++;renderQ();window.scrollTo(0,0);} };
  document.getElementById('flag').onclick=function(){
    S.flag[S.i]=!S.flag[S.i]; this.setAttribute('aria-pressed',String(S.flag[S.i]));
    var g=document.querySelector('[data-g="'+S.i+'"]'); if(g)g.classList.toggle('flag',S.flag[S.i]);
  };
  document.getElementById('grid').onclick=function(e){
    var b=e.target.closest('[data-g]'); if(!b)return;
    S.i=parseInt(b.dataset.g,10); renderQ(); window.scrollTo(0,0);
  };
}

/* ---------- results ---------- */
function finish(){
  stopClock(); bar.classList.add('hide');
  var right=0, byset={}, byord={2:{r:0,n:0},3:{r:0,n:0}};
  S.deck.forEach(function(q,i){
    var ok=S.pick[i]===q.ans; if(ok)right++;
    if(!byset[q.set])byset[q.set]={r:0,n:0};
    byset[q.set].n++; if(ok)byset[q.set].r++;
    byord[q.ord].n++; if(ok)byord[q.ord].r++;
  });
  var n=S.deck.length, pct=Math.round(right/n*100);
  var skipped=S.pick.filter(function(p){return p<0;}).length;
  var best=0; try{best=parseInt(localStorage.getItem('hnss-final-best')||'0',10)||0;
    if(pct>best){localStorage.setItem('hnss-final-best',String(pct));}}catch(e){}
  var verdict = pct>=85?'Exam ready' : pct>=70?'Close &mdash; clean up the weak domains'
              : pct>=55?'The reasoning is forming, the traps are still landing'
              : 'Go back to the forecast before the next attempt';

  var bars=Object.keys(byset).sort(function(a,b){
      return byset[a].r/byset[a].n - byset[b].r/byset[b].n; })
    .map(function(k){var o=byset[k],p=Math.round(o.r/o.n*100);
      var cls=p<55?'low':(p<80?'mid':'');
      return '<div class="tbar"><span>'+esc(SETS[k])+'</span><span class="track"><i class="'+cls+'" style="width:'+p+'%"></i></span><span class="pc">'+p+'%</span></div>';}).join('');

  var rev=S.deck.map(function(q,i){
    var pick=S.pick[i], ok=pick===q.ans, cls=pick<0?'skip':(ok?'right':'wrong');
    var mark=pick<0?'Skipped':(ok?'Correct':'Missed');
    return '<details class="rev '+cls+'"><summary><span class="num">'+(i+1)+'</span>'+
      '<span>'+q.stem+'</span><span class="mark">'+mark+'</span></summary>'+
      '<div class="revbody"><ol>'+q.opts.map(function(o,j){
        var c=j===q.ans?' c':(j===pick?' y':'');
        var note=q.wrong[j]?'<em>'+esc(q.wrong[j])+'</em>':(j===q.ans?'<em>Correct answer</em>':'');
        return '<li class="'+c.trim()+'">'+esc(o)+note+'</li>';}).join('')+'</ol>'+
      '<div class="why">'+q.why+'</div>'+
      '<div class="pearl"><b>Pearl &middot;</b> '+q.pearl+'</div></div></details>';
  }).join('');

  app.innerHTML=
  '<div class="mast"><div class="brand">HoyaDocs <b>&middot;</b> Anatomy Final</div><div class="tag">Result</div></div>'+
  '<div class="hero"><div class="pct">'+pct+'%</div>'+
  '<div class="sub">'+right+' of '+n+' correct'+(pct>=best&&pct>0?' &middot; personal best':'')+'</div>'+
  '<div class="verdict">'+verdict+'</div></div>'+
  '<div class="rgrid">'+
  '<div><div class="v" style="color:var(--ok)">'+right+'</div><div class="k">Right</div></div>'+
  '<div><div class="v" style="color:var(--bad)">'+(n-right-skipped)+'</div><div class="k">Missed</div></div>'+
  '<div><div class="v" style="color:var(--muted)">'+skipped+'</div><div class="k">Skipped</div></div>'+
  '<div><div class="v">'+Math.round(byord[3].r/(byord[3].n||1)*100)+'%</div><div class="k">3rd order</div></div>'+
  '<div><div class="v">'+Math.round(byord[2].r/(byord[2].n||1)*100)+'%</div><div class="k">2nd order</div></div>'+
  '</div>'+
  '<h2 class="sec">Accuracy by domain <span class="tag">weakest first</span></h2>'+bars+
  '<h2 class="sec">Full review</h2>'+
  '<p class="hint" style="margin-bottom:12px">Every question, with your answer marked and each distractor explained. Open the ones you missed first.</p>'+
  rev+
  '<div class="nav" style="margin-top:24px"><button class="btn primary" id="again">Retake</button>'+
  '<button class="btn" id="home">Start screen</button></div>';
  document.getElementById('again').onclick=function(){begin(S.mins,'shuffle');window.scrollTo(0,0);};
  document.getElementById('home').onclick=function(){renderStart();window.scrollTo(0,0);};
  window.scrollTo(0,0);
}

document.getElementById('btnEnd').onclick=function(){
  var un=S?S.pick.filter(function(p){return p<0;}).length:0;
  if(un===0||confirm(un+' question'+(un===1?'':'s')+' still unanswered. Submit anyway?')) finish();
};
document.addEventListener('keydown',function(e){
  if(!S||!document.getElementById('opts'))return;
  if(/^[1-5]$/.test(e.key)){var b=document.querySelector('.opt[data-i="'+(+e.key-1)+'"]');if(b){e.preventDefault();b.click();}}
  if(/^[a-eA-E]$/.test(e.key)){var j='abcde'.indexOf(e.key.toLowerCase());var b2=document.querySelector('.opt[data-i="'+j+'"]');if(b2){e.preventDefault();b2.click();}}
  if(e.key==='ArrowRight'){var n=document.getElementById('next');if(n){e.preventDefault();n.click();}}
  if(e.key==='ArrowLeft'){var p=document.getElementById('prev');if(p&&!p.disabled){e.preventDefault();p.click();}}
  if(e.key==='f'||e.key==='F'){var f=document.getElementById('flag');if(f){e.preventDefault();f.click();}}
});
renderStart();
</script></body></html>
