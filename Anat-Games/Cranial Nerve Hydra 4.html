<style>
/* Deliberately single-theme: a night-arena world. Every color is painted explicitly. */
:root{
  --ground:#17142B; --ground2:#120F22; --panel:#221D3F; --sunk:#1B1734; --line:#3A3366;
  --ink:#EEEAFB; --muted:#A39CC8;
  --p1:#FFB341; --p2:#3DD6C6; --boss:#FF4F8B; --heal:#6BD88E; --bad:#FF6B5B;
  --hy-bg:#3A3212; --hy-line:#D9AE2B; --hy-ink:#F7E6A6;
  --display:"Chakra Petch","Arial Narrow",sans-serif;
  --pix:"Silkscreen","Courier New",monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font:15px/1.55 var(--body);padding-inline:16px;padding-block:16px 40px;
  background-image:radial-gradient(ellipse 80% 50% at 50% 0%, #2A2352 0%, transparent 70%);background-attachment:fixed}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.pix{font-family:var(--pix);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.brand b{color:var(--boss)}

/* ---------- setup ---------- */
.setup{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:start}
.hero{display:flex;flex-direction:column;gap:14px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,6.4vw,74px);line-height:.92;margin:0;text-transform:uppercase;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--boss)}
.hero p{margin:0;color:var(--muted);max-width:54ch}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.foe{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:8px;display:flex;gap:8px;align-items:center}
.foe svg{width:44px;height:44px;flex:none}
.foe b{display:block;font-family:var(--display);font-size:13.5px;line-height:1.15}
.foe span{font-family:var(--pix);font-size:9.5px;color:var(--muted);text-transform:uppercase}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:6px;max-width:58ch}
.rules li{display:grid;grid-template-columns:92px 1fr;gap:10px;border-top:1px dashed var(--line);padding-top:6px;font-size:14px}
.rules b{font-family:var(--pix);font-size:11px;color:var(--p1);font-weight:400;padding-top:3px}
.form{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:16px}
.fl{display:flex;flex-direction:column;gap:6px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names input{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:9px 10px;border-left:5px solid var(--p1)}
.names input#p2name{border-left-color:var(--p2)}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;min-width:72px;background:var(--sunk);border:0;border-right:1px solid var(--line);padding:9px 8px;font-size:14px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:600}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.picker button{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:7px 9px;text-align:left;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.picker button[aria-pressed="true"]{border-color:var(--boss);box-shadow:inset 3px 0 0 var(--boss)}
.picker em{font-style:normal;font-family:var(--pix);font-size:10px;color:var(--muted)}
.go{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase;background:var(--boss);color:#1a0610;border:0;border-radius:4px;padding:11px 16px}

/* ---------- arena ---------- */
.arena{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:12px;align-items:stretch}
.hero-card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;transition:box-shadow .2s,opacity .3s}
.hero-card.p1{--c:var(--p1)} .hero-card.p2{--c:var(--p2)}
.hero-card.on{box-shadow:0 0 0 2px var(--c),0 0 24px -4px var(--c)}
.hero-card.ko{opacity:.45}
.hero-card .nm{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1;color:var(--c)}
.hero-card .role{font-family:var(--pix);font-size:10px;color:var(--muted);text-transform:uppercase}
.bar{height:14px;background:var(--ground2);border:1px solid var(--line);border-radius:3px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.bar.hp i{background:var(--heal)} .bar.hp.low i{background:var(--bad)}
.bar.boss{height:18px} .bar.boss i{background:linear-gradient(90deg,#B8265A,var(--boss))}
.hpnum{font-family:var(--pix);font-size:11px;display:flex;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.abil{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.abil button{flex:1;min-width:90px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:6px 6px;font-size:12.5px;line-height:1.2}
.abil button small{display:block;font-family:var(--pix);font-size:9px;color:var(--muted)}
.abil button:disabled{opacity:.35;cursor:not-allowed}
.abil button:not(:disabled):hover{border-color:var(--c)}
.ko-tag{position:absolute;top:10px;right:10px;font-family:var(--pix);font-size:12px;color:var(--bad)}
.boss-card{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center}
.boss-card .bn{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;line-height:1;letter-spacing:.03em}
.boss-card .bt{font-size:12.5px;color:var(--muted)}
.beast{height:150px;display:grid;place-items:center}
.beast svg{display:block;height:150px;width:auto;max-width:100%;overflow:visible}
.beast.hit svg{animation:hit .45s}
.beast.atk svg{animation:atk .5s}
.beast.dead svg{animation:dead .9s forwards}
.beast.gone svg{transform:translateY(20px) scale(.6);opacity:.1;filter:grayscale(1)}
@keyframes hit{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px);filter:brightness(2.2)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
@keyframes atk{0%,100%{transform:scale(1)}40%{transform:scale(1.14) translateY(8px)}}
@keyframes dead{to{transform:translateY(20px) scale(.6);opacity:.1;filter:grayscale(1)}}
.rage{font-family:var(--pix);font-size:10.5px;color:var(--boss)}
.dmg{position:absolute;font-family:var(--display);font-weight:700;font-size:30px;pointer-events:none;animation:float 1s forwards;text-shadow:0 2px 0 #000}
@keyframes float{from{transform:translateY(0);opacity:1}to{transform:translateY(-44px);opacity:0}}
.timer{height:6px;background:var(--ground2);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--muted);transform-origin:left;transition:transform .25s linear}
.timer.warn i{background:var(--bad)}
.log{font-family:var(--pix);font-size:11px;color:var(--muted);min-height:16px;text-transform:uppercase;letter-spacing:.04em}
.log b{color:var(--ink);font-weight:400}

.qpanel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--pix);font-size:10.5px;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid var(--line)}
.chip.p1{background:var(--p1);color:#231500;border-color:var(--p1)}
.chip.p2{background:var(--p2);color:#032421;border-color:var(--p2)}
.chip.dash{border-style:dashed}
.stem{margin:0;font-size:16px;line-height:1.62;max-width:76ch}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:8px 12px}
.opt .lt{font-family:var(--display);font-weight:700;font-size:17px;width:28px;height:28px;border:1.5px solid var(--line);border-radius:3px;display:grid;place-items:center;transform:rotate(45deg)}
.opt .lt span{transform:rotate(-45deg)}
.opt:not(:disabled):hover{border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.out{opacity:.3;text-decoration:line-through}
.opt.right{border-color:var(--heal);background:#193326}
.opt.right .lt{background:var(--heal);border-color:var(--heal);color:#07210F}
.opt.wrong{border-color:var(--bad);background:#3A1A22}
.opt.wrong .lt{background:var(--bad);border-color:var(--bad);color:#2a0606}
.verdict{border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--sunk)}
.verdict h3{margin:0;font-family:var(--display);font-size:22px;text-transform:uppercase}
.verdict.good h3{color:var(--heal)} .verdict.bad h3{color:var(--bad)}
.verdict p{margin:0;max-width:76ch}
.why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--muted)}
.why b{color:var(--ink);font-family:var(--pix);font-weight:400;margin-right:6px}
.hy{background:var(--hy-bg);border:1.5px solid var(--hy-line);color:var(--hy-ink);border-radius:4px;padding:9px 12px;font-size:14px}
.hy b{display:block;font-family:var(--pix);font-size:10px;font-weight:400;letter-spacing:.1em;text-transform:uppercase}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--ground);border:0;border-radius:4px;padding:10px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
kbd{font-family:var(--pix);font-size:10px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--muted)}

/* ---------- interlude / end ---------- */
.interlude{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px;display:grid;grid-template-columns:180px 1fr;gap:22px;align-items:center}
.interlude svg{width:100%;height:auto}
.interlude h2,.end h2{font-family:var(--display);font-weight:700;font-size:clamp(32px,5vw,54px);line-height:.95;margin:0 0 8px;text-transform:uppercase;text-wrap:balance}
.interlude p{margin:0 0 12px;color:var(--muted);max-width:60ch}
.path{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.path span{font-family:var(--pix);font-size:10px;padding:3px 7px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
.path span.done{color:var(--heal);border-color:var(--heal)}
.path span.now{color:var(--boss);border-color:var(--boss)}
.end{display:flex;flex-direction:column;gap:18px}
.end h2.win{color:var(--heal)} .end h2.lose{color:var(--bad)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.p1{--c:var(--p1)} .card.p2{--c:var(--p2)}
.big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;color:var(--c)}
.missed{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.missed li{font-size:13.5px;border-left:3px solid var(--line);padding-left:9px}
.missed li span{display:block;font-family:var(--pix);font-size:9.5px;color:var(--muted);text-transform:uppercase}
.foot{font-family:var(--pix);font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;text-transform:uppercase}
@media (max-width:860px){
  .setup,.cards,.interlude{grid-template-columns:1fr}
  .interlude svg{max-width:160px}
  .arena{grid-template-columns:1fr 1fr}
  .boss-card{grid-column:1 / -1;order:-1}
  .beast{height:110px}.beast svg{height:110px}
  .names,.picker{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const DECK=4;
const SETS={"neck": "The Neck", "face": "Face, Scalp & ITF", "cranial": "Skull, Meninges & Foramina", "orbit": "Orbit & Eye Reflexes", "nasal_oral": "Nose, Pharynx, Palate & Oral Cavity", "larynx": "Larynx", "cn": "Cranial Nerve Lesions"};
const Q=[{"id": "G-195", "stem": "A 55-year-old woman has unilateral neck pain, sore throat, and ear pain. Imaging shows Eagle syndrome, with an elongated, calcified styloid process and stylohyoid ligament. Which nerve is most likely affected?", "opts": ["Vagus", "Facial", "Glossopharyngeal", "Hypoglossal", "Vestibulocochlear"], "ans": 2, "why": "CN IX winds around stylopharyngeus and passes near the stylohyoid ligament to enter the oropharynx, so an elongated calcified styloid/ligament irritates it, causing throat and referred ear pain.", "wrong": ["Lies within the carotid sheath, not directly against the stylohyoid ligament.", "Exits the stylomastoid foramen and enters the parotid, not the pharynx region.", "", "Passes lateral to the carotids lower in the neck; not the classic Eagle nerve.", "Confined to the internal acoustic meatus and inner ear."], "pearl": "Eagle syndrome: long styloid irritates CN IX -> throat pain, dysphagia, otalgia.", "set": "cn"}, {"id": "G-230", "stem": "An 82-year-old man with a posterior cranial fossa tumor shows perineural spread along nervous tissue at the jugular foramen. Which deficit would you expect?", "opts": ["Loss of tongue movements", "Loss of facial expression", "Loss of sensation from the face and the scalp", "Loss of hearing", "Loss of gag reflex"], "ans": 4, "why": "The jugular foramen transmits CN IX, X, and XI. The gag reflex uses CN IX (afferent) and CN X (efferent), so involvement there abolishes it.", "wrong": ["Tongue is CN XII, which exits the hypoglossal canal.", "Facial expression is CN VII (internal acoustic meatus/stylomastoid foramen).", "Face and scalp sensation is CN V (and cervical nerves).", "Hearing is CN VIII (internal acoustic meatus).", ""], "pearl": "Jugular foramen syndrome (Vernet): CN IX, X, XI deficits -> lost gag, hoarseness, weak SCM/trapezius.", "set": "cn"}, {"id": "G-84", "stem": "A 56-year-old man has an extradural tumor in the posterior cranial fossa. When he sticks out his tongue, it deviates to the right. Which muscle and nerve are most likely injured?", "opts": ["Right hypoglossal nerve and right genioglossus", "Left hypoglossal nerve and left genioglossus", "Right hyoglossus and left styloglossus", "Right geniohyoid and first cervical nerve", "Contralateral vagus and hypoglossal nerves"], "ans": 0, "why": "Each genioglossus pushes the tongue forward and toward the opposite side. If the right one is paralyzed (right CN XII), the working left genioglossus pushes the tip toward the right, the weak side.", "wrong": ["", "A left lesion would make the tongue deviate to the left.", "The hyoglossus and styloglossus retract the tongue; they do not cause deviation on protrusion.", "The geniohyoid (C1) moves the hyoid, not the tongue.", "The vagus does not supply the protruding muscles of the tongue."], "pearl": "Tongue 'licks the lesion': it deviates toward the side of a lower motor neuron CN XII injury.", "set": "cn"}, {"id": "G-70", "stem": "A 27-year-old woman has a LeFort I fracture and comminuted fractures of the mandible and TMJ after being thrown from a motor scooter. Despite reconstructive surgery, she develops hyperacusis due to facial nerve paralysis. Which muscle is most likely paralyzed?", "opts": ["Posterior belly of digastric", "Stapedius", "Tensor tympani", "Stylohyoid", "Cricothyroid"], "ans": 1, "why": "Stapedius, supplied by CN VII, damps the stapes; its paralysis makes sounds abnormally loud.", "wrong": ["Supplied by CN VII, but its paralysis does not cause hyperacusis.", "", "Also damps sound but is supplied by V3, not CN VII.", "Supplied by CN VII, but has no role in hearing.", "Supplied by the external laryngeal nerve; no role in hearing."], "pearl": "CN VII motor: facial expression + stapedius + posterior digastric + stylohyoid; tensor tympani/tensor veli palatini = V3.", "set": "cn"}, {"id": "G-64", "stem": "A 55-year-old woman has difficulty swallowing, severe headaches, and frequently aspirates fluids when drinking. Imaging reveals a skull base tumor occupying the space behind the jugular foramen. Involvement of which structure most likely explains her findings?", "opts": ["Ansa cervicalis", "Cervical sympathetic trunk", "External laryngeal nerve", "Hypoglossal nerve", "Vagus nerve"], "ans": 4, "why": "The vagus leaves through the jugular foramen and supplies pharyngeal, palatal and laryngeal muscles and laryngeal sensation, so its compression causes dysphagia and aspiration.", "wrong": ["Supplies infrahyoid strap muscles; no swallowing/aspiration deficit.", "Runs behind the carotid sheath; lesion gives Horner syndrome.", "Supplies cricothyroid only; causes voice fatigue, not dysphagia.", "Lesion causes tongue deviation and dysarthria.", ""], "pearl": "Jugular foramen mass → CN X → dysphagia, aspiration, hoarseness, uvula deviates away.", "set": "cn"}, {"id": "G-32", "stem": "A 70-year-old man with severe headaches has difficulty coughing and swallowing. MRI shows a tumor affecting a cranial nerve. Which nerve is most likely affected?", "opts": ["Mandibular", "Maxillary", "Glossopharyngeal", "Vagus", "Hypoglossal"], "ans": 3, "why": "The vagus provides laryngeal sensation and the motor supply to pharyngeal and laryngeal muscles needed for cough and swallowing.", "wrong": ["Motor to mastication muscles; not responsible for cough or swallowing.", "Purely sensory to the midface.", "Motor only to stylopharyngeus; sensory limb of gag, not cough.", "", "Moves the tongue; not involved in the cough reflex."], "pearl": "Cough reflex: CN X (internal laryngeal) afferent and CN X efferent; CN X also supplies nearly all pharyngeal and palatal muscles.", "set": "cn"}, {"id": "G-286", "stem": "A 28-year-old woman has a painful outer-ear infection. When a speculum is pressed against the posterior wall of her external auditory meatus, she coughs and feels dizzy. Which nerve was most likely stimulated?", "opts": ["Vestibulocochlear", "Vagus", "Trigeminal", "Facial", "Accessory"], "ans": 1, "why": "The posterior canal wall is supplied by the auricular branch of the vagus. Stimulating it can trigger a cough or a vasovagal response (bradycardia, hypotension, lightheadedness).", "wrong": ["CN VIII serves hearing and balance, not canal skin.", "", "The auriculotemporal (V3) supplies most of the canal but does not provoke cough/syncope.", "CN VII's small sensory contribution does not trigger these reflexes.", "CN XI is motor only."], "pearl": "Posterior ear canal = auricular br. of X -> cough or vasovagal syncope.", "set": "cn"}, {"id": "LH-67", "stem": "A 40-year-old woman has headaches, nausea, vomiting, and multiple lower cranial nerve deficits. CT shows a tumor centered at the right jugular foramen that has destroyed the jugular foramen and hypoglossal canal and damaged the cranial nerves passing through them. Which of the following functions will remain intact?", "opts": ["Control of the true vocal fold", "Taste in the anterior two thirds of the tongue", "Symmetric protrusion of the tongue", "Sensation in the tympanic cavity", "Elevation of the shoulder"], "ans": 1, "why": "The jugular foramen transmits CN IX, X, and XI, and the hypoglossal canal transmits CN XII. Taste from the anterior two thirds of the tongue travels with the chorda tympani (CN VII), which uses the internal acoustic meatus, so it is spared.", "wrong": ["Intrinsic laryngeal muscles are supplied by CN X (jugular foramen)", "", "CN XII in the hypoglossal canal is damaged, so the tongue deviates", "Tympanic cavity sensation is via CN IX (jugular foramen)", "Trapezius is supplied by CN XI (jugular foramen)"], "pearl": "Jugular foramen: CN IX, X, XI (+ IJV); hypoglossal canal: CN XII.", "set": "cn"}, {"id": "G-183", "stem": "A 58-year-old man has progressive unilateral hearing loss and tinnitus for 4 months. MRI reveals a tumor at the cerebellopontine angle. Which of the following nerves is most likely affected?", "opts": ["Vagus", "Hypoglossal", "Vestibulocochlear", "Glossopharyngeal", "Trigeminal"], "ans": 2, "why": "A cerebellopontine angle tumor (usually a vestibular schwannoma) first affects CN VIII, producing hearing loss and tinnitus, and then the adjacent facial nerve.", "wrong": ["Lower cranial nerve at the jugular foramen; would cause dysphagia/hoarseness.", "Would cause tongue deviation, not hearing symptoms.", "", "Would affect gag and posterior tongue sensation.", "Can be affected by large tumors (facial numbness), but not first with hearing loss."], "pearl": "CPA tumor: CN VIII first (hearing loss, tinnitus), then VII, then V.", "set": "cn"}, {"id": "G-165", "stem": "A 34-year-old woman's right cheekbone and orbit hit the dashboard in a car crash. The affected eye cannot be directed downward when the pupil is adducted. MRI reveals a torn nerve. What is the most common location at which this nerve is injured?", "opts": ["As it pierces the dura of the tentorium cerebelli in the tentorial notch", "At the cavernous sinus", "At the sella turcica", "At the inferior orbital fissure", "At the superior orbital fissure"], "ans": 0, "why": "Inability to look down when adducted means superior oblique weakness from a trochlear nerve lesion. The long, thin CN IV is easily torn where it pierces the tentorial dura, as the brainstem moves during coup-contrecoup impact.", "wrong": ["", "CN IV travels in the lateral wall here but is protected and rarely torn.", "CN IV does not pass through the sella turcica.", "CN IV does not traverse the inferior orbital fissure (V2/infraorbital structures do).", "CN IV enters here, but trauma typically tears it at the tentorial edge."], "pearl": "CN IV: longest intracranial course, only dorsal exit; head trauma -> vertical diplopia, head tilt away.", "set": "cn"}, {"id": "BH-56", "stem": "A 42-year-old patient has an aneurysm at the junction of the posterior cerebral and posterior communicating arteries that compresses a nerve. On the affected side, the patient is most likely to show:", "opts": ["Bitemporal hemianopsia", "A dilated pupil", "A medially deviated eye", "A constricted pupil", "Anosmia"], "ans": 1, "why": "CN III passes near the PCA-PComm junction; its superficially placed parasympathetic fibers are compressed first, giving an ipsilateral dilated pupil.", "wrong": ["Bitemporal hemianopsia comes from chiasmal compression (pituitary tumor).", "", "Medial deviation reflects CN VI palsy.", "Constricted pupil reflects sympathetic injury.", "Anosmia reflects olfactory nerve injury."], "pearl": "PComm aneurysm -> 'blown pupil' (compressive CN III palsy affects pupil first).", "set": "cn"}, {"id": "G-18", "stem": "A 68-year-old woman has excruciating, sudden bouts of pain over her midface and is diagnosed with tic douloureux (trigeminal neuralgia). In which ganglion are the cell bodies of the neurons mediating this pain located?", "opts": ["Geniculate", "Trigeminal (semilunar or Gasserian)", "Inferior glossopharyngeal", "Otic", "Pterygopalatine"], "ans": 1, "why": "Pseudounipolar sensory neurons of CN V, which carry the facial pain of trigeminal neuralgia, have their cell bodies in the trigeminal (semilunar) ganglion.", "wrong": ["Sensory ganglion of CN VII (taste from anterior tongue), not facial pain.", "", "Sensory ganglion of CN IX, not trigeminal territory.", "Parasympathetic ganglion for the parotid; no sensory cell bodies.", "Parasympathetic ganglion for lacrimal and nasal glands; no sensory cell bodies."], "pearl": "Sensory cell bodies of CN V = trigeminal ganglion in Meckel's cave; parasympathetic ganglia hanging off V branches contain no sensory somata.", "set": "cn"}, {"id": "G-88", "stem": "A 45-year-old man has severe difficulty breathing. His mouth floor and pharynx are swollen and his airway is almost completely blocked; his lower jaw and upper neck are also swollen. A lower molar was pulled a week ago, and he has felt worse each day since. What is the most likely diagnosis?", "opts": ["Quinsy", "Torus palatinus", "Ankyloglossia", "Ranula", "Ludwig's angina"], "ans": 4, "why": "Ludwig's angina is a spreading infection of the submandibular and sublingual spaces, usually from a lower molar. It raises the floor of the mouth and can block the airway.", "wrong": ["Quinsy is a peritonsillar abscess that complicates tonsillitis, not a tooth infection.", "A benign bony growth on the hard palate; it causes no swelling or airway blockage.", "Tongue-tie: a short lingual frenulum present from birth.", "A mucous cyst in the floor of the mouth that is usually painless.", ""], "pearl": "Lower molar infection -> submandibular space -> Ludwig's angina -> airway threat.", "set": "nasal_oral"}, {"id": "BH-43", "stem": "A 7-year-old girl has difficulty breathing through her nose and is diagnosed with adenoids. Which tonsil is enlarged?", "opts": ["Palatine tonsil", "Pharyngeal tonsil", "Tubal tonsil", "Lingual tonsil", "Eustachian tonsil"], "ans": 1, "why": "Adenoids are an enlarged pharyngeal tonsil in the nasopharynx roof, blocking airflow from the choanae.", "wrong": ["Palatine (faucial) tonsil lies in the oropharynx tonsillar fossa.", "", "Tubal tonsil surrounds the auditory tube opening.", "Lingual tonsil lies on the posterior tongue.", "Eustachian tonsil is another name for the tubal tonsil."], "pearl": "Adenoids = pharyngeal tonsil -> mouth breathing, may block auditory tube (otitis media).", "set": "nasal_oral"}, {"id": "G-86", "stem": "A 17-year-old girl has a tonsillectomy for tonsillitis and afterward complains of ear pain. Which nerve was most likely injured or irritated during the operation?", "opts": ["Auriculotemporal", "Lesser petrosal", "Vagus", "Glossopharyngeal", "Chorda tympani"], "ans": 3, "why": "CN IX carries sensation from the tonsillar bed and pharynx and also from the middle ear (tympanic branch). Irritating it in the tonsillar bed causes pain that is felt in the ear (referred pain).", "wrong": ["Supplies the auricle, external meatus and temple; it is not in the tonsillar bed.", "Carries parasympathetic fibers to the otic ganglion; it has no role in sensation.", "The vagus supplies the external meatus but does not lie in the tonsillar bed.", "", "Carries taste from the anterior 2/3 of the tongue; it is not in the tonsillar field."], "pearl": "Post-tonsillectomy ear pain = CN IX (it lies in the tonsillar bed and also supplies the middle ear).", "set": "nasal_oral"}, {"id": "G-92", "stem": "A 10-year-old girl has her tonsils removed. One week later, pressing on the back of her tongue on the left does not trigger a gag reflex. The sensory part of which nerve was most likely injured?", "opts": ["Facial", "Glossopharyngeal", "Mandibular", "Maxillary", "Hypoglossal"], "ans": 1, "why": "CN IX carries the sensory (afferent) signal for the gag reflex from the posterior tongue and oropharynx. It runs in the tonsillar bed, so tonsillectomy can injure it.", "wrong": ["CN VII carries taste from the anterior 2/3 of the tongue; it has no role in the gag reflex.", "", "V3 carries general sensation from the anterior 2/3 of the tongue, not the posterior third.", "V2 supplies the palate and nasal cavity, not the posterior tongue.", "CN XII is purely motor to the tongue."], "pearl": "Gag reflex: CN IX sensory (afferent), CN X motor (efferent).", "set": "nasal_oral"}, {"id": "G-255", "stem": "A 49-year-old woman with swollen palatine tonsils undergoes tonsillectomy. Which nerve running along the tonsillar bed must be spared?", "opts": ["Vagus", "Hypoglossal", "Glossopharyngeal", "Internal laryngeal", "External laryngeal"], "ans": 2, "why": "CN IX runs with the stylopharyngeus through the tonsillar bed deep to the palatine tonsil. Injury can cause loss of sensation and taste on the posterior third of the tongue.", "wrong": ["CN X lies in the carotid sheath and pharyngeal plexus, not the tonsillar bed.", "CN XII runs below the tongue, not in the tonsillar fossa.", "", "Internal laryngeal is in the neck and piriform recess.", "External laryngeal runs with the superior thyroid artery in the neck."], "pearl": "Tonsillectomy risks CN IX (posterior 1/3 tongue sensation/taste) in the tonsillar bed.", "set": "nasal_oral"}, {"id": "LH-66", "stem": "During a mixed martial arts fight, a fighter is punched in the anterior neck, fracturing the hyoid bone. Which of the following muscles would be most directly affected?", "opts": ["Palatopharyngeus", "Stylopharyngeus", "Superior pharyngeal constrictor", "Middle pharyngeal constrictor", "Inferior pharyngeal constrictor"], "ans": 3, "why": "The middle pharyngeal constrictor arises from the greater and lesser horns of the hyoid and the stylohyoid ligament, so a hyoid fracture directly disrupts its attachment.", "wrong": ["Arises from the palate and inserts into the pharynx/thyroid cartilage", "Arises from the styloid process", "Arises from the pterygomandibular raphe, pterygoid hamulus, and mandible", "", "Arises from the thyroid and cricoid cartilages"], "pearl": "Constrictor origins: superior = pterygomandibular raphe; middle = hyoid; inferior = thyroid & cricoid.", "set": "nasal_oral"}, {"id": "LH-72", "stem": "During an initial oral examination, a dental hygienist inspects the vestibule of the mouth. Which of the following structures is encountered in this area?", "opts": ["Lingual frenulum", "Opening of the parotid duct", "Opening of the submandibular duct", "Uvula", "Palatine tonsil"], "ans": 1, "why": "The oral vestibule is the space between the lips/cheeks and the teeth/gums. The parotid duct opens into it on a small papilla opposite the upper second molar.", "wrong": ["Lies in the oral cavity proper, under the tongue", "", "Opens on the floor of the oral cavity proper beside the frenulum", "Hangs from the soft palate at the back of the oral cavity", "Lies in the oropharynx between the palatine arches"], "pearl": "Vestibule = between cheeks and teeth; parotid duct opens here opposite upper 2nd molar.", "set": "nasal_oral"}, {"id": "G-31", "stem": "A 55-year-old man has left-sided upper jaw tooth pain, but a dental examination is normal. Tapping on his left maxilla elicits sharp pain on the left side of his face, including his left maxillary teeth. He has no allergies. What is the most likely diagnosis?", "opts": ["Sphenoid sinusitis", "Anterior ethmoidal sinusitis", "Posterior ethmoidal sinusitis", "Maxillary sinusitis", "Frontal sinusitis"], "ans": 3, "why": "The maxillary sinus lies in the body of the maxilla directly above the upper molar roots, so its inflammation causes maxillary tenderness and referred upper-tooth pain (both via V2 superior alveolar nerves).", "wrong": ["Lies deep in the sphenoid body; causes deep/retro-orbital headache.", "Lies between orbit and nasal cavity; causes medial orbital pain.", "Lies posteriorly between orbits; would not cause maxillary tenderness.", "", "Lies in the frontal bone above the orbit; causes forehead pain."], "pearl": "Maxillary sinusitis mimics upper toothache because superior alveolar nerves (V2) run in the sinus walls.", "set": "nasal_oral"}, {"id": "G-153", "stem": "A 1-year-old boy has a fever after several falls at the playground the day before. Meningitis is suspected, and imaging shows a sinus infection. Which paranasal sinus is present at this age?", "opts": ["Frontal sinus", "Maxillary sinus", "Sphenoid sinus", "Middle ethmoidal air cells", "Posterior ethmoidal air cells"], "ans": 1, "why": "The maxillary sinus is the only sinus clearly present at birth, so it is the likely site of a sinus infection in a 1-year-old.", "wrong": ["Develops after about age 2, from the anterior ethmoidal cells.", "", "Develops after about age 2, from the posterior ethmoidal cells.", "Very small in infancy; the book keys the maxillary sinus as the only one present.", "Very small in infancy; the book keys the maxillary sinus."], "pearl": "Maxillary sinus is present at birth; frontal and sphenoid sinuses appear in childhood.", "set": "nasal_oral"}, {"id": "G-96", "stem": "A 25-year-old medical student eats burnt toast in a hurry and scratches the roof of his mouth, leaving a stinging feeling on his hard palate. Which nerve carries this sensation from the hard palate?", "opts": ["Posterior superior alveolar nerve", "Inferior alveolar nerve", "Lingual nerve", "Greater palatine nerve", "Lesser palatine nerve"], "ans": 3, "why": "The greater palatine nerve (V2, through the pterygopalatine fossa) exits the greater palatine foramen and supplies most of the hard palate mucosa.", "wrong": ["Supplies the upper molars and nearby gums, not the palate.", "Supplies the lower teeth and chin (V3).", "Supplies the anterior 2/3 of the tongue and floor of the mouth.", "", "Supplies the soft palate, not the hard palate."], "pearl": "Hard palate = greater palatine n. (plus nasopalatine anteriorly); soft palate = lesser palatine n.", "set": "nasal_oral"}, {"id": "G-187", "stem": "A 55-year-old woman with an acute myocardial infarction is given sublingual nitroglycerin. Which of the following structures is most likely the route of absorption of this drug?", "opts": ["Deep lingual vein", "Submandibular duct", "Sublingual duct", "Lingual vein", "Sublingual vein"], "ans": 0, "why": "The deep lingual veins are visible through the thin mucosa on the underside of the tongue, making them the most direct route for rapid absorption of sublingual drugs.", "wrong": ["", "Carries saliva out of the gland; ducts do not absorb drugs.", "Excretory ducts; they secrete, not absorb.", "Lies deeper within the tongue/floor of mouth.", "Lies deeper in the floor of the mouth; less direct than the deep lingual vein."], "pearl": "Sublingual drugs absorb via the thin-walled deep lingual veins on the tongue's underside.", "set": "nasal_oral"}, {"id": "G-277", "stem": "A 20-year-old man has a fracture of the sella turcica after a motorcycle crash. Which bone was most likely damaged?", "opts": ["Sphenoid", "Temporal", "Occipital", "Ethmoid", "Frontal"], "ans": 0, "why": "The sella turcica (hypophyseal fossa) is a saddle-shaped depression on the upper surface of the body of the sphenoid bone.", "wrong": ["", "The temporal bone forms the lateral middle fossa and petrous ridge.", "The occipital bone forms the posterior fossa and foramen magnum.", "The ethmoid is in the anterior fossa (cribriform plate).", "The frontal bone forms most of the anterior fossa floor."], "pearl": "Sella turcica = sphenoid body; houses the pituitary, flanked by cavernous sinuses.", "set": "cranial"}, {"id": "G-231", "stem": "A soccer goalkeeper strikes his head on the goal post, is confused for several minutes, then resumes playing. Four hours later he is found unconscious. CT shows a hemorrhage consistent with an epidural hematoma. The ruptured vessel enters the skull through which opening?", "opts": ["Foramen spinosum", "Foramen ovale", "Jugular foramen", "Hypoglossal canal", "Foramen lacerum"], "ans": 0, "why": "A lucid interval after head trauma suggests an epidural hematoma from a torn middle meningeal artery, which enters the skull through the foramen spinosum and runs deep to the pterion.", "wrong": ["", "Transmits V3 and the lesser petrosal nerve (plus accessory meningeal artery).", "Transmits CN IX-XI and the IJV.", "Transmits CN XII.", "Filled with cartilage in life; the ICA passes across its upper aspect."], "pearl": "Epidural hematoma = middle meningeal artery (foramen spinosum), lucid interval, biconvex lens.", "set": "cranial"}, {"id": "G-45", "stem": "A 45-year-old woman with severe ear pain has chronic mastoiditis. The infection can erode the thin bone between the mastoid air cells and the posterior cranial fossa. Into which venous structure does it most commonly spread?", "opts": ["Superior sagittal sinus", "Inferior sagittal sinus", "Straight sinus", "Cavernous sinus", "Sigmoid sinus"], "ans": 4, "why": "The sigmoid sinus grooves the posterior cranial fossa immediately medial to the mastoid air cells before becoming the IJV, so mastoid infection readily causes sigmoid sinus thrombosis.", "wrong": ["Runs in the superior margin of the falx cerebri, far from the mastoid.", "Lies in the free lower edge of the falx.", "Runs at the falx–tentorium junction, midline.", "Lies beside the sella in the middle cranial fossa.", ""], "pearl": "Mastoiditis → sigmoid sinus thrombophlebitis (lateral sinus thrombosis).", "set": "cranial"}, {"id": "LC-8", "stem": "An 18-year-old skier strikes a tree with his forehead, sustaining multiple fractures. He has a clear nasal discharge that tests positive for glucose. Which cranial nerve was most likely damaged?", "opts": ["Olfactory nerve", "Optic nerve", "Abducent nerve", "Facial nerve", "Hypoglossal nerve"], "ans": 0, "why": "Glucose-positive rhinorrhea is CSF leaking through a fractured cribriform plate of the ethmoid. The olfactory nerve fibers pass through that plate and are torn, causing anosmia.", "wrong": ["", "CN II injury causes visual loss, not linked to CSF rhinorrhea.", "CN VI is classically hurt by raised ICP or cavernous sinus lesions.", "CN VII injury causes facial paralysis, hyperacusis, taste loss; none present.", "CN XII injury causes tongue deviation and dysarthria; none present."], "pearl": "CSF rhinorrhea = cribriform plate fracture = anosmia (CN I).", "set": "cranial"}, {"id": "BC-1", "stem": "A 27-year-old man presents with drooping of the upper eyelid (ptosis), a dilated pupil, and difficulty focusing on near objects. He also has an internal strabismus (medial deviation of the eye) and cannot look inferiorly when the eye is adducted. Which of the following is the most likely cause?", "opts": ["Lesion in the medulla", "Tumor in the optic canal", "Thrombosis in the cavernous sinus", "Lesion of the olfactory nerve", "Fracture of the foramen spinosum"], "ans": 2, "why": "The findings combine CN III (ptosis, mydriasis, lost accommodation), CN IV (can't look down in adduction), and CN VI (medial deviation) deficits. All three nerves travel through the cavernous sinus, so a single thrombosis there explains everything.", "wrong": ["The medulla houses nuclei for CN IX, X, and XII, not III, IV, VI.", "Optic canal tumor affects the optic nerve and ophthalmic artery.", "", "Olfactory nerve lesion causes anosmia only.", "Foramen spinosum fracture injures the middle meningeal artery."], "pearl": "Multiple ocular motor palsies (III, IV, VI) together = think cavernous sinus.", "set": "cranial"}, {"id": "G-276", "stem": "A patient has a brain tumor near the crista galli and cribriform plate of the ethmoid bone. Which symptom is most likely?", "opts": ["Paralysis of facial muscles", "Loss of vision", "Difficulty swallowing", "Loss of smell", "Loss of hearing"], "ans": 3, "why": "Olfactory nerve fibers pass through the cribriform plate to the olfactory bulbs beside the crista galli, so a mass there causes anosmia.", "wrong": ["CN VII is in the posterior fossa and temporal bone.", "The optic nerve and chiasm lie further back, near the sella.", "Swallowing is IX and X in the posterior fossa.", "", "Hearing is CN VIII at the internal acoustic meatus."], "pearl": "Cribriform plate lesion/fracture -> anosmia +/- CSF rhinorrhea.", "set": "cranial"}, {"id": "G-26", "stem": "A 40-year-old man is unconscious after being hit in the head with a baseball. CT reveals a fractured pterion and an epidural hematoma. Branches of which artery are most likely injured?", "opts": ["External carotid", "Superficial temporal", "Maxillary", "Deep temporal", "Middle meningeal"], "ans": 4, "why": "The middle meningeal artery (from the maxillary artery) runs between the dura and the skull deep to the pterion; tearing it causes an epidural hematoma.", "wrong": ["Ends behind the mandible; does not run between dura and skull.", "Lies outside the skull in the scalp.", "Parent vessel lies in the infratemporal fossa, outside the cranium.", "Supply temporalis outside the skull; do not enter the cranial cavity.", ""], "pearl": "Pterion fracture → middle meningeal a. → epidural (biconvex) hematoma with lucid interval.", "set": "cranial"}, {"id": "G-272", "stem": "A physician palpates the mastoid process of an adolescent with pain behind the ear. Which bone is being palpated?", "opts": ["Occipital", "Zygomatic", "Temporal", "Parietal", "Sphenoid"], "ans": 2, "why": "The mastoid process belongs to the mastoid part of the temporal bone (the others being squamous, petrous, and tympanic parts).", "wrong": ["The occipital bone is posterior but does not form the mastoid process.", "The zygomatic bone forms the cheek.", "", "The parietal bone forms the upper side of the vault.", "The sphenoid is central in the skull base."], "pearl": "Temporal bone parts: squamous, petrous, tympanic, mastoid (+ styloid and zygomatic processes).", "set": "cranial"}, {"id": "LH-13", "stem": "A baby girl presents with a disproportionately wide skull with a short occipitofrontal (front-to-back) diameter. What cranial suture most likely closed prematurely to result in this deformity?", "opts": ["Sphenosquamous", "Sphenoparietal", "Lambdoid", "Coronal", "Sagittal"], "ans": 3, "why": "Premature fusion of the coronal suture blocks anteroposterior growth, so the skull expands sideways, giving a short, wide head (brachycephaly).", "wrong": ["Early closure would give a localized temporal deformity, not a short wide skull", "Part of the pterion region; not the cause of a globally short, wide skull", "Bilateral fusion flattens the back of the head, typically with posterior asymmetry", "", "Causes a long, narrow (boat-shaped) head, scaphocephaly"], "pearl": "Coronal synostosis -> brachycephaly; sagittal -> scaphocephaly.", "set": "cranial"}, {"id": "G-245", "stem": "Herpetic lesions of the forehead need prompt treatment because infection can reach the cavernous sinus. Which venous structure is the most likely route of spread to the cavernous sinus?", "opts": ["Pterygoid venous plexus", "Ophthalmic vein", "Superior petrosal sinus", "Basilar venous plexus", "Parietal emissary vein"], "ans": 1, "why": "Forehead veins (supratrochlear and supraorbital) form the angular vein, which connects to the superior ophthalmic vein; this valveless vein drains directly into the cavernous sinus.", "wrong": ["The pterygoid plexus links the deep face to the sinus but does not drain the forehead.", "", "The superior petrosal sinus drains the cavernous sinus toward the transverse sinus.", "The basilar plexus lies over the clivus, joining the inferior petrosal sinuses.", "Parietal emissary veins connect scalp veins to the superior sagittal sinus."], "pearl": "Danger triangle: facial/angular v. -> superior ophthalmic v. -> cavernous sinus thrombosis.", "set": "cranial"}, {"id": "G-138", "stem": "A 65-year-old woman has signs of cavernous sinus thrombosis, and imaging shows an internal carotid artery aneurysm inside the cavernous sinus. If a nerve is compressed within the sinus, which sign would appear first?", "opts": ["Inability to gaze downward and medially on the affected side", "Complete ptosis of the superior palpebra (upper eyelid)", "Bilateral loss of accommodation and loss of direct pupillary reflex", "Ipsilateral loss of the consensual corneal reflex", "Ipsilateral paralysis of abduction of the pupil"], "ans": 4, "why": "CN VI runs through the middle of the cavernous sinus right beside the ICA, rather than in the lateral wall, so it is the first nerve affected by an ICA aneurysm there.", "wrong": ["A trochlear sign; CN IV is protected in the lateral wall.", "Requires a complete CN III lesion, which is not the first to occur.", "A unilateral lesion would not cause bilateral loss.", "Would require loss of both V1 and VII.", ""], "pearl": "CN VI is the first nerve hit in the cavernous sinus because it runs free next to the ICA.", "set": "cranial"}, {"id": "G-107", "stem": "A 57-year-old man falls from a tree, and CT shows a fracture of the cribriform plate. Which finding is most likely on examination?", "opts": ["Entrapment of the eyeball", "Anosmia", "Hyperacusis", "Tinnitus", "Deafness"], "ans": 1, "why": "Olfactory nerve fibers pass through the foramina of the cribriform plate, so a fracture there can tear them and cause loss of smell.", "wrong": ["Muscle entrapment comes from orbital wall fractures, not the cribriform plate.", "", "Caused by stapedius paralysis (CN VII).", "Caused by inner ear or CN VIII problems.", "Caused by middle ear, inner ear or CN VIII problems."], "pearl": "Cribriform plate fracture: anosmia + CSF rhinorrhea.", "set": "cranial"}, {"id": "G-156", "stem": "A 24-year-old man is admitted to the hospital after a street fight. Radiographic examination reveals an inferior blow-out fracture of the orbit. Which of the following nerves is particularly vulnerable with this type of injury?", "opts": ["Infraorbital", "Supratrochlear", "Frontal", "Inferior alveolar", "Optic"], "ans": 0, "why": "The infraorbital nerve (V2) runs in the groove and canal of the orbital floor before exiting at the infraorbital foramen, so a floor (inferior wall) fracture readily injures it, causing numbness of the cheek, lateral nose, and upper lip.", "wrong": ["", "Branch of frontal nerve (V1) running along the superior orbit, away from the floor.", "Runs superiorly over levator palpebrae, beneath the orbital roof, not the floor.", "Lies in the mandible (mandibular canal), not related to the orbit.", "Lies posterior to the globe in the optic canal, away from the orbital floor."], "pearl": "Orbital floor blow-out: infraorbital nerve numbness (cheek/upper lip) + inferior rectus entrapment.", "set": "orbit"}, {"id": "G-77", "stem": "A 44-year-old woman being treated for Raynaud's disease receives a sympathetic blocking drug in high doses. Which adverse effect is most likely?", "opts": ["Exophthalmos and dilated pupil", "Enophthalmos and dry eye", "Dry eye and inability to accommodate for reading", "Wide open eyelids and loss of depth perception", "Ptosis and miosis"], "ans": 4, "why": "Blocking sympathetics paralyzes the superior tarsal (Müller) muscle, giving partial ptosis, and leaves the parasympathetic sphincter pupillae unopposed, giving miosis.", "wrong": ["Pupil dilation needs sympathetic dilator pupillae, which is blocked.", "Lacrimation is parasympathetic and would be preserved.", "Lacrimation and accommodation are both parasympathetic and unaffected.", "Eyelid elevation would be reduced, and depth perception is a visual pathway function.", ""], "pearl": "Sympathetic loss = Horner features: partial ptosis (Müller) + miosis ± anhidrosis; complete ptosis = CN III (levator).", "set": "orbit"}, {"id": "BH-29", "stem": "The pupil of a 43-year-old patient remains small even when room lighting is dim. Which of the following is injured?", "opts": ["Trochlear nerve", "Superior cervical ganglion", "Oculomotor nerve", "Ophthalmic nerve", "Abducens nerve"], "ans": 1, "why": "Failure to dilate in dim light indicates loss of the postganglionic sympathetic fibers from the superior cervical ganglion that supply the dilator pupillae.", "wrong": ["CN IV is purely motor to superior oblique.", "", "CN III injury causes a dilated, not small, pupil.", "V1 carries sensory fibers; it only conveys sympathetics passively.", "CN VI is purely motor to lateral rectus."], "pearl": "Persistent miosis = sympathetic (superior cervical ganglion) lesion - Horner.", "set": "orbit"}, {"id": "LC-33", "stem": "A physician shines a light into only the left eye. The left pupil does not constrict, but the right pupil does. Which nerve is most likely damaged?", "opts": ["Right optic nerve", "Left optic nerve", "Right ophthalmic nerve", "Right oculomotor nerve", "Left oculomotor nerve"], "ans": 4, "why": "A consensual response in the right eye shows the left optic nerve (afferent limb) works. The absent direct response in the left eye means the left oculomotor nerve (efferent limb) is damaged.", "wrong": ["Not tested, because light was shone only into the left eye.", "Intact: the right pupil responded consensually.", "V1 carries corneal sensation; not part of the light reflex.", "Intact: the right pupil constricted.", ""], "pearl": "Light reflex: afferent CN II, efferent CN III; no direct but intact consensual = ipsilateral CN III.", "set": "orbit"}, {"id": "G-105", "stem": "A 22-year-old man is hit in the right eye by a frozen fish. His eyelids are swollen and bruised, and he cannot turn the eye outward from straight-ahead gaze, suggesting a trapped muscle. Which bone is most likely fractured?", "opts": ["Orbital plate of the frontal bone", "Lamina papyracea of the ethmoid bone", "Orbital plate of the maxilla", "Cribriform plate of the ethmoid bone", "Greater wing of the sphenoid bone"], "ans": 1, "why": "The paper-thin lamina papyracea forms the medial orbital wall. A blowout through it can trap the medial rectus, which then cannot relax, so the eye cannot turn outward.", "wrong": ["A roof fracture would rarely trap the superior muscles.", "", "A floor fracture traps the inferior rectus or oblique and limits upward gaze.", "Causes anosmia and CSF rhinorrhea, not muscle entrapment.", "The lateral wall is thick and does not typically trap muscles."], "pearl": "Medial wall (ethmoid) blowout traps the medial rectus; floor (maxilla) blowout traps the inferior rectus.", "set": "orbit"}, {"id": "BC-10", "stem": "A patient can move his eyeballs normally and see distant objects clearly but cannot focus on near objects. This condition may indicate damage to which of the following structures?", "opts": ["Ciliary ganglion and oculomotor nerve", "Oculomotor nerve and long ciliary nerve", "Short ciliary nerves and ciliary ganglion", "Superior cervical ganglion and long ciliary nerve", "Oculomotor, trochlear, and abducens nerves"], "ans": 2, "why": "Accommodation depends on postganglionic parasympathetic fibers from the ciliary ganglion traveling in short ciliary nerves to the ciliary muscle. Normal eye movements show CN III itself is intact.", "wrong": ["Eye movements are normal, so the oculomotor nerve is intact.", "CN III is intact, and long ciliary nerves carry sympathetic fibers.", "", "Sympathetic pathway controls pupil dilation, not accommodation.", "Normal eye movements rule out lesions of III, IV, and VI."], "pearl": "Accommodation: CN III preganglionic -> ciliary ganglion -> short ciliary nn. -> ciliary muscle.", "set": "orbit"}, {"id": "LH-7", "stem": "A 16-year-old girl develops mild ptosis and miosis in her right eye following resection of a lymphangioma from the apex of her right lung. Vision in each eye is normal. These findings are most likely due to a lesion involving which structure on the right?", "opts": ["Cervical posterior roots", "Thoracic posterior roots", "Thoracic anterior roots", "Thoracic posterior primary rami", "Thoracic gray rami communicantes"], "ans": 2, "why": "Ptosis plus miosis indicates Horner syndrome, loss of sympathetic supply to the head. Preganglionic sympathetic fibers for the head leave the cord in the upper thoracic (T1-T3) anterior roots, reach the sympathetic chain via white rami and ascend to synapse in the superior cervical ganglion.", "wrong": ["Carry only sensory fibers; no sympathetic outflow", "Sensory (afferent) roots; carry no preganglionic sympathetics", "", "Supply deep back muscles and skin, not the head", "Carry postganglionic fibers back to spinal nerves, not up to the head"], "pearl": "Horner = ptosis + miosis + anhidrosis; lung apex (Pancoast) lesions interrupt the T1 sympathetic outflow.", "set": "orbit"}, {"id": "LC-11", "stem": "A 38-year-old woman reports tripping and double vision when descending stairs. On eye-movement testing she cannot move her left eye inferiorly when looking toward her right side. What specific nerve is most likely damaged?", "opts": ["Left oculomotor nerve", "Right oculomotor nerve", "Left abducent nerve", "Right abducent nerve", "Left trochlear nerve"], "ans": 4, "why": "Superior oblique (CN IV) is the main depressor of the adducted eye. Looking right adducts the left eye, so inability to look down there points to the left trochlear nerve, giving diplopia on stairs.", "wrong": ["Left CN III palsy gives ptosis and a down-and-out eye; not present.", "Right CN III would affect the right eye, with ptosis.", "Left CN VI palsy impairs abduction, causing esotropia.", "Right CN VI would affect the right eye's abduction.", ""], "pearl": "Trouble walking downstairs / reading = CN IV (superior oblique) palsy; test by looking down with eye adducted.", "set": "orbit"}, {"id": "BH-47", "stem": "A 65-year-old man with vision problems visits an eye clinic. The pupillary light reflex can be eliminated by cutting which of the following nerves?", "opts": ["Short ciliary, ophthalmic, and oculomotor nerves", "Long ciliary, optic, and short ciliary nerves", "Oculomotor, short ciliary, and optic nerves", "Optic and long ciliary nerves and ciliary ganglion", "Ophthalmic and optic nerves and ciliary ganglion"], "ans": 2, "why": "The reflex uses the optic nerve (afferent) and the oculomotor nerve -> ciliary ganglion -> short ciliary nerves (efferent) to the sphincter pupillae.", "wrong": ["Ophthalmic nerve (V1) carries only sensory fibers.", "Long ciliary nerves carry sympathetic fibers.", "", "Long ciliary nerves are not part of the reflex.", "Ophthalmic nerve is not part of the reflex."], "pearl": "Pupillary light reflex: afferent CN II, efferent CN III (via ciliary ganglion, short ciliary nn.).", "set": "orbit"}, {"id": "G-161", "stem": "A 36-year-old female racquetball player is struck in the orbital region. Radiographs reveal a blow-out fracture of the medial wall of the orbit. The pupil of the affected eye cannot be turned laterally. Which of the following muscles is most likely injured or trapped?", "opts": ["Lateral rectus", "Medial and inferior recti", "Medial rectus", "Medial rectus and superior oblique", "Inferior rectus"], "ans": 2, "why": "In a medial wall fracture the medial rectus becomes caught between bone fragments. The trapped muscle tethers the globe, so the eye cannot be moved laterally (abducted), even though its nerve is intact.", "wrong": ["Abducts the eye but lies along the lateral wall, away from a medial fracture.", "Inferior rectus relates to the floor; the deficit here is only abduction.", "", "Superior oblique is superomedial and would not block abduction.", "Lies on the orbital floor; entrapment limits upgaze, not abduction."], "pearl": "Entrapped muscle limits movement OPPOSITE to its action: medial wall -> medial rectus -> can't abduct.", "set": "orbit"}, {"id": "G-139", "stem": "A 54-year-old man fractures his frontozygomatic suture in a car crash. His upper eyelid has several cuts and small fragments of his glasses are in the sclera. Where should the needle be placed to anesthetize the orbital contents and then the injured eyelid?", "opts": ["Into the sclera in the limbic region and also into the infraorbital foramen", "Into the lacrimal fossa and also beneath the lateral bulbar conjunctiva", "Into the supraorbital foramen and also into the lacrimal caruncle", "Through the upper eyelid deeply toward the orbital apex and also between the orbital septum and the palpebral musculature laterally", "Directly posteriorly through the anulus tendineus and superior orbital fissure"], "ans": 3, "why": "The needle aimed deep toward the orbital apex blocks the nasociliary nerve (V1), which supplies the globe. A second injection laterally, between the septum and the lid muscle, blocks the lacrimal nerve supply to the lid.", "wrong": ["Injecting into the sclera would injure the globe.", "The lacrimal fossa is too far medial and does not anesthetize the globe.", "The supraorbital nerve supplies the forehead, not the globe.", "", "Driving the needle through the common tendinous ring risks nerve and vessel injury."], "pearl": "Nasociliary n. (V1) supplies the cornea and globe (the afferent limb of the corneal reflex).", "set": "orbit"}, {"id": "G-112", "stem": "A 45-year-old man has trigeminal neuralgia so severe that he has thought of suicide. Even a light touch on the skin between the lower eyelid and upper lip sets off severe pain. The plan is to destroy the involved nerve branch by injecting alcohol into it. Through which opening will the needle most likely need to pass to reach the nerve?", "opts": ["Foramen ovale", "Foramen spinosum", "Infraorbital foramen", "Mandibular foramen", "Foramen magnum"], "ans": 2, "why": "The skin between the lower lid and upper lip is supplied by the infraorbital nerve (V2), which exits through the infraorbital foramen below the orbit.", "wrong": ["V3 exits here; it does not supply the skin between the lid and lip.", "Carries the middle meningeal artery.", "", "The inferior alveolar nerve (lower teeth) enters here.", "Carries the spinal cord, vertebral arteries and the spinal part of CN XI."], "pearl": "Lower lid, cheek and upper lip = V2 via the infraorbital foramen.", "set": "face"}, {"id": "G-290", "stem": "A 60-year-old man has numbness of the right lower jaw and inner cheek, loss of sensation over the posterior temporal scalp and anterior auricle, and weak lateral deviation of the mandible. CT shows a mass in the infratemporal fossa. Which other function is most likely affected?", "opts": ["Weak elevation of the corner of the right side of the mouth", "Loss of sensation over the upper lip and to the upper teeth", "Inability to sense a foreign body in the right eye", "Decreased secretion from the parotid gland", "Inability to abduct the right eye"], "ans": 3, "why": "The findings point to V3 branches in the infratemporal fossa, including the auriculotemporal nerve. That nerve also carries postganglionic parasympathetic fibers from the otic ganglion to the parotid, so salivation from the parotid would drop.", "wrong": ["Mouth-corner elevation is CN VII (zygomatic/buccal branches).", "Upper lip and upper teeth are V2.", "Corneal sensation is V1.", "", "Abduction is CN VI in the orbit/cavernous sinus."], "pearl": "Otic ganglion (IX via lesser petrosal) -> auriculotemporal n. (V3) -> parotid.", "set": "face"}, {"id": "G-24", "stem": "A 35-year-old man has a tumor in the infratemporal fossa. He has lost general sensation from the anterior two thirds of his tongue, but taste and salivation are intact. Which nerve is most likely affected?", "opts": ["Lingual proximal to its junction with the chorda tympani", "Chorda tympani", "Inferior alveolar", "Lesser petrosal", "Glossopharyngeal"], "ans": 0, "why": "Proximal to where the chorda tympani joins it in the infratemporal fossa, the lingual nerve carries only V3 general sensation, so a lesion there spares taste and submandibular/sublingual secretion.", "wrong": ["", "Would cause loss of taste and reduced submandibular/sublingual salivation.", "Supplies mandibular teeth and chin, not the tongue.", "Parotid secretomotor; would affect salivation, not tongue sensation.", "Serves the posterior third of the tongue, not the anterior two thirds."], "pearl": "Lingual n. above chorda tympani junction = general sensation only; below it = sensation + taste + submandibular parasympathetics.", "set": "face"}, {"id": "G-130", "stem": "A 65-year-old man hits his head on the dashboard in a car crash. The inferior alveolar nerve is injured at its origin. Which muscle would most likely be paralyzed?", "opts": ["Geniohyoid", "Hyoglossus", "Mylohyoid", "Stylohyoid", "Palatoglossus"], "ans": 2, "why": "Before it enters the mandibular foramen, the inferior alveolar nerve gives off the nerve to mylohyoid, which supplies the mylohyoid and the anterior belly of the digastric.", "wrong": ["Supplied by C1 fibers that travel with CN XII.", "Supplied by CN XII.", "", "Supplied by CN VII.", "Supplied by CN X."], "pearl": "Nerve to mylohyoid (from the inferior alveolar n., V3) supplies the mylohyoid and anterior digastric.", "set": "face"}, {"id": "LH-71", "stem": "A 21-year-old boxer takes punches to the side of his face that fracture the left mandible just above the mandibular angle. Muscle spasm makes his jaw close, so it is hard to remove his mouthpiece. Which muscle is acting to close the jaw?", "opts": ["Temporalis", "Lateral pterygoid", "Zygomaticus major", "Masseter", "Posterior digastric"], "ans": 3, "why": "The masseter inserts on the angle and lateral ramus of the mandible. A fracture in the middle of its insertion leaves much of the muscle attached to the fragment, and its spasm powerfully elevates the jaw (the medial pterygoid acts similarly on the deep side).", "wrong": ["Inserts on the coronoid process, away from the fracture near the angle", "Protrudes and helps depress the mandible, not close it", "Facial expression muscle; does not move the mandible", "", "Helps depress the mandible, not close it"], "pearl": "Masseter + medial pterygoid form a sling at the mandibular angle; both are powerful jaw closers.", "set": "face"}, {"id": "LC-31", "stem": "A 46-year-old woman is cut on the right side of her face by shattered glass, with a laceration at the anterior border of the inferior part of the masseter. When her stitches are removed, her lower lip is asymmetric when she grimaces. Damage to which nerve would cause this asymmetry?", "opts": ["Zygomatic branch of facial nerve", "Temporal branch of facial nerve", "Cervical branch of facial nerve", "Buccal branch of facial nerve", "Marginal mandibular branch of facial nerve"], "ans": 4, "why": "The marginal mandibular branch runs along the lower border of the mandible near the masseter and supplies depressor anguli oris, depressor labii inferioris, and mentalis. Losing it causes lower-lip asymmetry.", "wrong": ["Supplies lower orbicularis oculi (eye closure).", "Supplies frontalis and upper orbicularis oculi.", "Supplies platysma.", "Supplies buccinator and upper-lip muscles.", ""], "pearl": "CN VII branches: Two Zebras Bit My Cheek; marginal mandibular = lower lip depressors.", "set": "face"}, {"id": "LH-58", "stem": "A 35-year-old woman has tenderness in her cheek near the parotid gland, bad breath, and a foul taste at mealtimes. Sialography confirms a stone (sialolith) blocking the parotid duct. Through which muscle does the parotid duct pass, most likely creating the narrowing where the stone lodged?", "opts": ["Buccinator", "Mentalis", "Temporalis", "Orbicularis oris", "Masseter"], "ans": 0, "why": "The parotid duct crosses superficial to the masseter, then turns medially to pierce the buccinator before opening opposite the upper second molar. The passage through the buccinator narrows the duct and is a common site for a stone to lodge.", "wrong": ["", "In the chin; unrelated to the parotid duct", "Lies in the temporal fossa, above the duct", "Surrounds the mouth; the duct does not pass through it", "The duct crosses its surface but does not pierce it"], "pearl": "Parotid (Stensen) duct: over masseter -> pierces buccinator -> opens opposite upper 2nd molar.", "set": "face"}, {"id": "G-279", "stem": "A 20-year-old man has a deep 10-cm oblique laceration across his right cheek from a broken bottle. He cannot close his right eye or smile on the right side. Which additional structure was most likely damaged?", "opts": ["Vertebral artery", "Common carotid artery", "Parotid gland", "Lateral pterygoid muscle", "Temporalis muscle"], "ans": 2, "why": "CN VII branches radiate from within the parotid gland across the cheek. A wound deep enough to cut the zygomatic and buccal branches will likely also injure the parotid gland (and possibly its duct).", "wrong": ["The vertebral artery is deep in the neck, not the cheek.", "The common carotid artery is in the neck, below the face.", "", "Lateral pterygoid is a deep V3 muscle; injury would not cause facial palsy.", "Temporalis is in the temporal fossa and supplied by V3."], "pearl": "CN VII branches in parotid: To Zanzibar By Motor Car (temporal, zygomatic, buccal, marginal mandibular, cervical).", "set": "face"}, {"id": "LH-65", "stem": "A 17-year-old woman has an anterior dislocation of her temporomandibular joint, with her mandible stuck in the protruded position. Her dentist pulls the mandible inferiorly so that muscle tone can retract it. Which muscle returns the mandibular condyle to its normal position after it clears the articular eminence?", "opts": ["Lateral pterygoid", "Masseter", "Medial pterygoid", "Stylohyoid", "Temporalis"], "ans": 4, "why": "The horizontal posterior fibers of the temporalis retract (retrude) the mandible, pulling the condyle back into the mandibular fossa once it is past the articular eminence.", "wrong": ["Protrudes the mandible; its spasm helps cause the dislocation", "Mainly elevates the mandible; its spasm contributes to locking", "Elevates and protrudes the mandible", "Elevates and retracts the hyoid, not the mandible", ""], "pearl": "Retrusion of the mandible = posterior fibers of temporalis; protrusion = lateral pterygoid.", "set": "face"}, {"id": "BH-37", "stem": "During surgery for a malignant parotid tumor in a 69-year-old woman, the main trunk of the facial nerve is lacerated. Which muscle is paralyzed?", "opts": ["Masseter muscle", "Stylopharyngeus muscle", "Anterior belly of the digastric muscle", "Buccinator muscle", "Tensor tympani"], "ans": 3, "why": "The buccinator is a muscle of facial expression supplied by the buccal branches of CN VII.", "wrong": ["Masseter is supplied by V3.", "Stylopharyngeus is supplied by CN IX.", "Anterior belly of digastric is supplied by V3 (nerve to mylohyoid).", "", "Tensor tympani is supplied by V3."], "pearl": "Buccinator: CN VII motor; buccal nerve of V3 is only sensory to the cheek.", "set": "face"}, {"id": "LH-34", "stem": "A 78-year-old man has signs of reduced blood flow to the right side of his face. The physician wants to palpate the facial artery pulse on both sides. Where can the facial artery pulse be readily palpated?", "opts": ["Lateral side of the body of the hyoid bone", "Inferior edge of the zygomatic arch", "Apex of the zygomatic bone", "Lateral surface of the nasal bone", "Inferior margin of the body of the mandible"], "ans": 4, "why": "The facial artery hooks around the inferior border of the mandible just anterior to the masseter, where it is superficial and can be compressed against bone to feel a pulse.", "wrong": ["The lingual artery, not the facial, lies near the hyoid", "The transverse facial artery runs near here, not the facial artery", "The facial artery does not pass over the zygomatic bone", "Only the terminal angular/lateral nasal branches are here; not a pulse site", ""], "pearl": "Facial a. pulse: inferior border of mandible, anterior edge of masseter.", "set": "face"}, {"id": "LH-19", "stem": "A newborn girl is unable to turn her head to the right, even with assistance. Her neck rotation and lateral bending are limited, and her head is tilted toward the right with the chin elevated and turned toward the left. What muscle is most likely responsible?", "opts": ["Platysma", "Trapezius", "Sternocleidomastoid", "Masseter", "Digastric"], "ans": 2, "why": "Congenital torticollis results from a shortened or fibrosed sternocleidomastoid. The right SCM tilts the head toward the right shoulder and turns the chin to the left, so a tight right SCM produces this posture and blocks turning to the right.", "wrong": ["Thin cutaneous muscle (CN VII) that only tenses neck skin", "Elevates/retracts the scapula and extends the neck; does not produce this tilt-rotation posture", "", "Muscle of mastication; does not move the neck", "Suprahyoid muscle that moves the hyoid/mandible, not the head"], "pearl": "Torticollis: head tilts toward the tight SCM, chin rotates to the opposite side.", "set": "neck"}, {"id": "LH-39", "stem": "A 50-year-old man has recurrent dizziness, ataxia, vertigo, aphasia, and right upper limb weakness. MRA shows stenosis of the proximal right subclavian artery with poststenotic dilatation, consistent with subclavian steal syndrome, in which blood is shunted from the left-side arterial tree via collaterals into the right-side circulation. Through which ipsilateral vessel is blood entering the right subclavian artery distal to the stenosis?", "opts": ["Internal thoracic artery", "Common carotid artery", "Vertebral artery", "Superior thyroid artery", "Suprascapular artery"], "ans": 2, "why": "With proximal subclavian stenosis, pressure distal to the block falls, so blood from the basilar/circle of Willis flows backward down the ipsilateral vertebral artery into the subclavian. This 'steal' from the brain explains the vertebrobasilar symptoms.", "wrong": ["Subclavian branch to the anterior chest wall; not the reversed-flow vessel in steal", "Arises from the brachiocephalic trunk proximal to the stenosis; does not enter the subclavian", "", "Branch of the external carotid supplying thyroid/larynx", "Thyrocervical trunk branch to the scapular region; not the steal pathway"], "pearl": "Subclavian steal: retrograde flow in the ipsilateral vertebral a. -> vertebrobasilar symptoms with arm use.", "set": "neck"}, {"id": "LC-3", "stem": "A 23-year-old man has shoulder weakness and instability; his left shoulder sits lower than the right. He cannot abduct his left arm above his head and cannot shrug his left shoulder against resistance. What nerve was most likely damaged?", "opts": ["Facial nerve", "Glossopharyngeal nerve", "Vagus nerve", "Accessory nerve", "Hypoglossal nerve"], "ans": 3, "why": "CN XI supplies trapezius (and SCM). Trapezius paralysis causes a drooping shoulder, weak shrug, and loss of the upward scapular rotation needed to abduct above 90 degrees.", "wrong": ["CN VII lesions cause facial paralysis, hyperacusis, taste loss; not shoulder weakness.", "CN IX lesions affect gag afferent, posterior tongue taste, parotid secretion.", "CN X lesions cause dysphagia and dysphonia, not trapezius weakness.", "", "CN XII supplies tongue muscles; would not affect trapezius."], "pearl": "Shoulder droop + weak shrug + can't abduct above 90 degrees = CN XI (trapezius).", "set": "neck"}, {"id": "G-200", "stem": "Cardiac pain is sometimes referred to the mandible and the region of the temporomandibular joint. Cutaneous sensation over the angle of the mandible is normally supplied by which nerve?", "opts": ["Cervical branch of facial", "Great auricular nerve", "Mandibular branch of trigeminal nerve", "Mandibular branch of facial nerve", "Transverse cervical nerve"], "ans": 1, "why": "The great auricular nerve (C2-C3, cervical plexus) supplies skin over the angle of the mandible, the parotid region, and the ear up toward the TMJ, an area not covered by V3.", "wrong": ["Motor to platysma; facial nerve branches carry no skin sensation.", "", "V3 supplies most of the lower face but spares the angle of the mandible.", "Motor to lower lip muscles; not cutaneous.", "Supplies skin of the anterior neck, below the mandible."], "pearl": "Angle of the mandible = great auricular nerve (C2-C3), not trigeminal.", "set": "neck"}, {"id": "G-158", "stem": "A 55-year-old man presents with pain when chewing over the previous 3 months. Physical examination reveals odynophagia and hoarseness. Radiographic examination reveals a tumor in the tracheoesophageal groove. Which of the following nerves is most likely affected by the tumor?", "opts": ["Recurrent laryngeal", "Internal laryngeal", "Vagus", "External laryngeal", "Phrenic"], "ans": 0, "why": "After looping around the subclavian artery (right) or aortic arch (left), the recurrent laryngeal nerve ascends in the tracheoesophageal groove. Compression there paralyzes most intrinsic laryngeal muscles, producing hoarseness.", "wrong": ["", "Sensory above the vocal folds; enters via the thyrohyoid membrane, not the tracheoesophageal groove.", "Lies in the carotid sheath; a lesion would cause many deficits beyond hoarseness.", "Motor to cricothyroid only; runs with the superior thyroid artery, not in the groove.", "Descends on anterior scalene; injury affects the diaphragm, not the voice."], "pearl": "Tracheoesophageal groove = recurrent laryngeal nerve -> hoarseness.", "set": "neck"}, {"id": "G-242", "stem": "A 30-year-old woman had a total thyroidectomy for a cancerous nodule. Three weeks later she has persistent hoarseness. Which nerve was most likely injured during surgery?", "opts": ["Internal laryngeal", "External laryngeal", "Recurrent laryngeal", "Superior laryngeal", "Glossopharyngeal"], "ans": 2, "why": "The recurrent laryngeal nerve ascends in the tracheoesophageal groove directly behind the thyroid and supplies all intrinsic laryngeal muscles except cricothyroid. Injury paralyzes the vocal fold, causing hoarseness.", "wrong": ["Internal laryngeal is sensory above the folds; injury causes numbness, not hoarseness.", "External laryngeal injury gives a weak, monotone voice with poor pitch, not true hoarseness.", "", "Superior laryngeal injury causes supraglottic anesthesia and loss of pitch control.", "CN IX is not at risk in thyroid surgery and does not supply laryngeal muscles."], "pearl": "RLN: tracheoesophageal groove, near inferior thyroid a.; injury -> hoarseness (bilateral -> stridor).", "set": "neck"}, {"id": "G-22", "stem": "A 17-year-old girl has had painful discoloration of her hand for the past year. MRI reveals thoracic outlet syndrome. Which symptom would most likely result from this syndrome?", "opts": ["Problems with respiration because of pressure on the phrenic nerve", "Reduced blood flow to the thoracic wall", "Reduced venous return from the head and neck", "Numbness in the upper limb", "Distention of the internal jugular vein"], "ans": 3, "why": "Thoracic outlet syndrome (e.g., from a cervical rib or scalene bands) compresses the lower brachial plexus trunks, producing upper-limb numbness/paresthesia.", "wrong": ["The phrenic nerve descends on anterior scalene and is not compressed at the outlet.", "Rich anastomoses keep the chest wall well perfused.", "Head and neck venous drainage via the IJV is not compressed here.", "", "The IJV lies medially in the carotid sheath and is not obstructed."], "pearl": "Cervical rib/scalene compression of the lower trunk (C8–T1) and subclavian vessels = thoracic outlet syndrome → ulnar-side paresthesia.", "set": "neck"}, {"id": "G-191", "stem": "An 11-year-old boy has recurrent palatine tonsillitis. Which of the following lymph nodes is most likely to first become visibly enlarged?", "opts": ["Submandibular", "Parotid", "Jugulodigastric", "Submental", "Preauricular"], "ans": 2, "why": "The jugulodigastric (tonsillar) node of the superior deep cervical chain, located where the posterior digastric crosses the IJV, receives lymph from the palatine tonsil and enlarges in tonsillitis.", "wrong": ["Drains lateral face, lips, and anterior tongue.", "Drains the scalp, eyelids, and external ear region.", "", "Drains the tongue tip, chin, and central lower lip.", "Drains the lateral eyelids and anterior ear region."], "pearl": "Tonsil -> jugulodigastric node (below angle of mandible).", "set": "neck"}, {"id": "G-60", "stem": "A 20-year-old man has a stab wound in the superior neck that has not affected major structures, but he has lost sensation over the skin at the angle of the jaw. Which nerve is most likely injured?", "opts": ["Supraclavicular", "Transverse cervical", "Great auricular", "Greater occipital", "Lesser occipital"], "ans": 2, "why": "The great auricular nerve (C2–C3) ascends over SCM to supply skin over the angle of the mandible, parotid region and lower auricle.", "wrong": ["C3–C4; supplies skin over the clavicle and shoulder.", "Supplies skin of the anterior neck.", "", "Dorsal ramus of C2; supplies the posterior scalp.", "C2; supplies scalp behind the ear."], "pearl": "Skin over angle of jaw = great auricular (C2–3), not trigeminal.", "set": "neck"}, {"id": "BH-36", "stem": "A 76-year-old man with swallowing difficulty undergoes imaging. A CT image at the level of the cricothyroid ligament should show which of the following structures?", "opts": ["Inferior laryngeal nerves", "External carotid arteries", "Inferior thyroid veins", "Thyrocervical trunks", "Internal laryngeal nerves"], "ans": 0, "why": "The inferior laryngeal nerves, the terminal parts of the recurrent laryngeal nerves, ascend at the cricoid level and so lie at the level of the cricothyroid ligament.", "wrong": ["", "External carotids begin higher, at the upper thyroid cartilage border.", "Inferior thyroid veins lie below, anterior to the trachea.", "Thyrocervical trunks arise low, in the root of the neck.", "Internal laryngeal nerves pierce the thyrohyoid membrane, above this level."], "pearl": "Recurrent laryngeal n. becomes the inferior laryngeal n. as it enters the larynx near the cricothyroid joint.", "set": "larynx"}, {"id": "LH-12", "stem": "A newborn exhibits labored, gasping breaths and unusual vocal tones when crying. Examination reveals malformed vocal folds due to displaced attachments of the vocal ligaments. Which of the following structures is most likely defective?", "opts": ["Arytenoid cartilages", "Cricoid cartilage", "Epiglottic cartilage", "Corniculate cartilages", "Cuneiform cartilages"], "ans": 0, "why": "Each vocal ligament runs from the inner surface of the thyroid cartilage anteriorly to the vocal process of the arytenoid cartilage posteriorly. Arytenoid movements set vocal fold position and tension, so malformed arytenoids displace the ligament attachments.", "wrong": ["", "Unpaired ring articulating with thyroid and arytenoids; vocal ligaments do not attach to it", "Leaf-shaped cartilage that covers the laryngeal inlet; no vocal ligament attachment", "Small cartilages on the arytenoid apices within the aryepiglottic folds", "Small cartilages within the aryepiglottic folds; not vocal ligament attachments"], "pearl": "Vocal ligament: thyroid cartilage (anterior) -> vocal process of arytenoid (posterior).", "set": "larynx"}, {"id": "G-234", "stem": "A 73-year-old patient has neck pain, hoarseness, and weight loss for 6 months. Laryngoscopy shows a large tumor on one of the true vocal folds, and the specialist cannot pass the scope through
