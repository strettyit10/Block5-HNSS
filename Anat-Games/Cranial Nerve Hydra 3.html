<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Cranial Nerve Hydra 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Deliberately single-theme: a night-arena world. Every color is painted explicitly. */
:root{
  --ground:#17142B; --ground2:#120F22; --panel:#221D3F; --sunk:#1B1734; --line:#3A3366;
  --ink:#EEEAFB; --muted:#A39CC8;
  --p1:#FFB341; --p2:#3DD6C6; --boss:#FF4F8B; --heal:#6BD88E; --bad:#FF6B5B;
  --hy-bg:#3A3212; --hy-line:#D9AE2B; --hy-ink:#F7E6A6;
  --display:"Chakra Petch","Arial Narrow",sans-serif;
  --pix:"Silkscreen","Courier New",monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font:15px/1.55 var(--body);padding-inline:16px;padding-block:16px 40px;
  background-image:radial-gradient(ellipse 80% 50% at 50% 0%, #2A2352 0%, transparent 70%);background-attachment:fixed}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.pix{font-family:var(--pix);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.brand b{color:var(--boss)}

/* ---------- setup ---------- */
.setup{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:start}
.hero{display:flex;flex-direction:column;gap:14px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,6.4vw,74px);line-height:.92;margin:0;text-transform:uppercase;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--boss)}
.hero p{margin:0;color:var(--muted);max-width:54ch}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.foe{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:8px;display:flex;gap:8px;align-items:center}
.foe svg{width:44px;height:44px;flex:none}
.foe b{display:block;font-family:var(--display);font-size:13.5px;line-height:1.15}
.foe span{font-family:var(--pix);font-size:9.5px;color:var(--muted);text-transform:uppercase}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:6px;max-width:58ch}
.rules li{display:grid;grid-template-columns:92px 1fr;gap:10px;border-top:1px dashed var(--line);padding-top:6px;font-size:14px}
.rules b{font-family:var(--pix);font-size:11px;color:var(--p1);font-weight:400;padding-top:3px}
.form{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:16px}
.fl{display:flex;flex-direction:column;gap:6px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names input{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:9px 10px;border-left:5px solid var(--p1)}
.names input#p2name{border-left-color:var(--p2)}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;min-width:72px;background:var(--sunk);border:0;border-right:1px solid var(--line);padding:9px 8px;font-size:14px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:600}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.picker button{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:7px 9px;text-align:left;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.picker button[aria-pressed="true"]{border-color:var(--boss);box-shadow:inset 3px 0 0 var(--boss)}
.picker em{font-style:normal;font-family:var(--pix);font-size:10px;color:var(--muted)}
.go{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase;background:var(--boss);color:#1a0610;border:0;border-radius:4px;padding:11px 16px}

/* ---------- arena ---------- */
.arena{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:12px;align-items:stretch}
.hero-card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;transition:box-shadow .2s,opacity .3s}
.hero-card.p1{--c:var(--p1)} .hero-card.p2{--c:var(--p2)}
.hero-card.on{box-shadow:0 0 0 2px var(--c),0 0 24px -4px var(--c)}
.hero-card.ko{opacity:.45}
.hero-card .nm{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1;color:var(--c)}
.hero-card .role{font-family:var(--pix);font-size:10px;color:var(--muted);text-transform:uppercase}
.bar{height:14px;background:var(--ground2);border:1px solid var(--line);border-radius:3px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.bar.hp i{background:var(--heal)} .bar.hp.low i{background:var(--bad)}
.bar.boss{height:18px} .bar.boss i{background:linear-gradient(90deg,#B8265A,var(--boss))}
.hpnum{font-family:var(--pix);font-size:11px;display:flex;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.abil{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.abil button{flex:1;min-width:90px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:6px 6px;font-size:12.5px;line-height:1.2}
.abil button small{display:block;font-family:var(--pix);font-size:9px;color:var(--muted)}
.abil button:disabled{opacity:.35;cursor:not-allowed}
.abil button:not(:disabled):hover{border-color:var(--c)}
.ko-tag{position:absolute;top:10px;right:10px;font-family:var(--pix);font-size:12px;color:var(--bad)}
.boss-card{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center}
.boss-card .bn{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;line-height:1;letter-spacing:.03em}
.boss-card .bt{font-size:12.5px;color:var(--muted)}
.beast{height:150px;display:grid;place-items:center}
.beast svg{display:block;height:150px;width:auto;max-width:100%;overflow:visible}
.beast.hit svg{animation:hit .45s}
.beast.atk svg{animation:atk .5s}
.beast.dead svg{animation:dead .9s forwards}
.beast.gone svg{transform:translateY(20px) scale(.6);opacity:.1;filter:grayscale(1)}
@keyframes hit{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px);filter:brightness(2.2)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
@keyframes atk{0%,100%{transform:scale(1)}40%{transform:scale(1.14) translateY(8px)}}
@keyframes dead{to{transform:translateY(20px) scale(.6);opacity:.1;filter:grayscale(1)}}
.rage{font-family:var(--pix);font-size:10.5px;color:var(--boss)}
.dmg{position:absolute;font-family:var(--display);font-weight:700;font-size:30px;pointer-events:none;animation:float 1s forwards;text-shadow:0 2px 0 #000}
@keyframes float{from{transform:translateY(0);opacity:1}to{transform:translateY(-44px);opacity:0}}
.timer{height:6px;background:var(--ground2);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--muted);transform-origin:left;transition:transform .25s linear}
.timer.warn i{background:var(--bad)}
.log{font-family:var(--pix);font-size:11px;color:var(--muted);min-height:16px;text-transform:uppercase;letter-spacing:.04em}
.log b{color:var(--ink);font-weight:400}

.qpanel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--pix);font-size:10.5px;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid var(--line)}
.chip.p1{background:var(--p1);color:#231500;border-color:var(--p1)}
.chip.p2{background:var(--p2);color:#032421;border-color:var(--p2)}
.chip.dash{border-style:dashed}
.stem{margin:0;font-size:16px;line-height:1.62;max-width:76ch}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:8px 12px}
.opt .lt{font-family:var(--display);font-weight:700;font-size:17px;width:28px;height:28px;border:1.5px solid var(--line);border-radius:3px;display:grid;place-items:center;transform:rotate(45deg)}
.opt .lt span{transform:rotate(-45deg)}
.opt:not(:disabled):hover{border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.out{opacity:.3;text-decoration:line-through}
.opt.right{border-color:var(--heal);background:#193326}
.opt.right .lt{background:var(--heal);border-color:var(--heal);color:#07210F}
.opt.wrong{border-color:var(--bad);background:#3A1A22}
.opt.wrong .lt{background:var(--bad);border-color:var(--bad);color:#2a0606}
.verdict{border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--sunk)}
.verdict h3{margin:0;font-family:var(--display);font-size:22px;text-transform:uppercase}
.verdict.good h3{color:var(--heal)} .verdict.bad h3{color:var(--bad)}
.verdict p{margin:0;max-width:76ch}
.why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--muted)}
.why b{color:var(--ink);font-family:var(--pix);font-weight:400;margin-right:6px}
.hy{background:var(--hy-bg);border:1.5px solid var(--hy-line);color:var(--hy-ink);border-radius:4px;padding:9px 12px;font-size:14px}
.hy b{display:block;font-family:var(--pix);font-size:10px;font-weight:400;letter-spacing:.1em;text-transform:uppercase}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--ground);border:0;border-radius:4px;padding:10px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
kbd{font-family:var(--pix);font-size:10px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--muted)}

/* ---------- interlude / end ---------- */
.interlude{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px;display:grid;grid-template-columns:180px 1fr;gap:22px;align-items:center}
.interlude svg{width:100%;height:auto}
.interlude h2,.end h2{font-family:var(--display);font-weight:700;font-size:clamp(32px,5vw,54px);line-height:.95;margin:0 0 8px;text-transform:uppercase;text-wrap:balance}
.interlude p{margin:0 0 12px;color:var(--muted);max-width:60ch}
.path{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.path span{font-family:var(--pix);font-size:10px;padding:3px 7px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
.path span.done{color:var(--heal);border-color:var(--heal)}
.path span.now{color:var(--boss);border-color:var(--boss)}
.end{display:flex;flex-direction:column;gap:18px}
.end h2.win{color:var(--heal)} .end h2.lose{color:var(--bad)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.p1{--c:var(--p1)} .card.p2{--c:var(--p2)}
.big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;color:var(--c)}
.missed{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.missed li{font-size:13.5px;border-left:3px solid var(--line);padding-left:9px}
.missed li span{display:block;font-family:var(--pix);font-size:9.5px;color:var(--muted);text-transform:uppercase}
.foot{font-family:var(--pix);font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;text-transform:uppercase}
@media (max-width:860px){
  .setup,.cards,.interlude{grid-template-columns:1fr}
  .interlude svg{max-width:160px}
  .arena{grid-template-columns:1fr 1fr}
  .boss-card{grid-column:1 / -1;order:-1}
  .beast{height:110px}.beast svg{height:110px}
  .names,.picker{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const DECK=3;
const SETS={"neck": "The Neck", "face": "Face, Scalp & ITF", "cranial": "Skull, Meninges & Foramina", "orbit": "Orbit & Eye Reflexes", "nasal_oral": "Nose, Pharynx, Palate & Oral Cavity", "larynx": "Larynx", "cn": "Cranial Nerve Lesions"};
const Q=[{"id": "BC-11", "stem": "A 32-year-old woman has a hoarse voice, and her uvula deviates to the left on phonation. Which of the following nerves is most likely damaged?", "opts": ["Right trigeminal nerve", "Left trigeminal nerve", "Right vagus nerve", "Left vagus nerve", "Left glossopharyngeal nerve"], "ans": 2, "why": "The vagus supplies the musculus uvulae and laryngeal muscles. With a vagal lesion, the uvula is pulled away from the lesion side, so leftward deviation means the right vagus is injured; hoarseness reflects laryngeal paralysis.", "wrong": ["Trigeminal nerve does not supply the uvula or larynx.", "Trigeminal nerve does not supply the uvula or larynx.", "", "A left vagal lesion would deviate the uvula to the right.", "CN IX does not supply uvular or laryngeal muscles."], "pearl": "Uvula deviates AWAY from the side of the vagal lesion (tongue deviates TOWARD a CN XII lesion).", "set": "cn"}, {"id": "G-258", "stem": "After a small brainstem stroke, a 64-year-old diabetic woman has uncoordinated swallowing and difficulty with phonation. Dysfunction of the responsible cranial nerve will most likely also produce which symptom?", "opts": ["Weakness/paralysis of muscles of mastication on one side", "Weakness/paralysis of muscles of facial expression on one side", "Hearing loss and balance problems", "Decreased/absent sensation in the oropharynx", "Decreased/absent cough reflex"], "ans": 4, "why": "CN X supplies the pharyngeal and laryngeal muscles, so its lesion impairs swallowing and phonation. CN X is also both limbs of the cough reflex, so cough is reduced.", "wrong": ["Mastication is V3.", "Facial expression is CN VII.", "Hearing and balance are CN VIII.", "Oropharyngeal sensation is mainly CN IX.", ""], "pearl": "CN X: dysphagia, dysphonia, uvula deviation away from lesion, lost cough reflex.", "set": "cn"}, {"id": "G-101", "stem": "A 32-year-old man has a tumor of the anterior pituitary gland. He has lost the outer (lateral) half of the visual field in both eyes (bitemporal hemianopia). Which structure is most likely compressed?", "opts": ["Optic nerve", "Optic chiasm", "Optic tract", "Oculomotor", "Abducens nerve"], "ans": 1, "why": "The optic chiasm lies just above the pituitary. Pressure on it damages the crossing fibers from both nasal retinas, which see the temporal visual fields.", "wrong": ["Compression would cause complete blindness in one eye.", "", "Compression would cause a homonymous hemianopia.", "Compression would cause a 'down and out' eye, ptosis and a dilated pupil.", "Compression would cause loss of abduction (the eye turns inward)."], "pearl": "Pituitary tumor -> chiasm -> bitemporal hemianopia.", "set": "cn"}, {"id": "G-285", "stem": "A 55-year-old man has progressive right-sided hearing loss and tinnitus, an asymmetric smile, and a decreased right corneal reflex. CT shows a large intracranial tumor. Where is the tumor most likely located?", "opts": ["Between the medulla and the cerebellar hemisphere", "Above the diaphragma sellae", "Over the lateral hemispheric fissure", "Between the cerebellum and the lateral pons", "Between the cerebellar peduncles"], "ans": 3, "why": "An acoustic neuroma (vestibular schwannoma) grows in the cerebellopontine angle, where it compresses CN VIII and then the nearby CN VII and CN V.", "wrong": ["That region relates to the lower cranial nerves (IX-XII).", "Suprasellar masses compress the optic chiasm.", "A mass over the lateral fissure affects cortex, not cranial nerves.", "", "The region between the peduncles relates to the fourth ventricle, not CN V/VII/VIII."], "pearl": "CP angle tumor: VIII first (hearing loss, tinnitus), then VII (facial weakness) and V (lost corneal reflex).", "set": "cn"}, {"id": "LH-32", "stem": "A young child has a condition causing progressive degeneration of the motor axons that innervate the masseter muscle. Which of the following muscles is most likely to be similarly affected?", "opts": ["Genioglossus", "Tensor tympani", "Orbicularis oris", "Levator veli palatini", "Stylopharyngeus"], "ans": 1, "why": "The masseter is supplied by CN V3, which also innervates the other muscles of mastication plus mylohyoid, anterior digastric, tensor veli palatini, and tensor tympani. The tensor tympani therefore shares the same motor supply.", "wrong": ["Supplied by CN XII", "", "Muscle of facial expression supplied by CN VII", "Supplied by CN X (pharyngeal plexus)", "The only muscle supplied by CN IX"], "pearl": "CN V3 motor: 4 mastication muscles + 'MATT' (mylohyoid, anterior digastric, tensor tympani, tensor veli palatini).", "set": "cn"}, {"id": "G-288", "stem": "A 55-year-old woman has 2 weeks of severe headache. CT shows a dilated branch of the basilar artery at the junction of the pons and medulla on the right side. Which clinical feature might she have?", "opts": ["Weak abduction and depression of the right eye", "Weak adduction of the left eye", "Weak adduction and elevation of the right eye", "Weak abduction of the right eye", "Weak abduction of the left eye"], "ans": 3, "why": "CN VI emerges at the pontomedullary junction close to the AICA and labyrinthine arteries. A right-sided aneurysm there compresses the right abducens nerve, weakening the right lateral rectus.", "wrong": ["Adding weak depression implies CN IV, which exits the dorsal midbrain.", "Adduction is CN III; the lesion is right-sided and at the wrong level.", "Weak adduction/elevation implies CN III at the pons-midbrain junction.", "", "The lesion is on the right, so the left eye is unaffected."], "pearl": "Pontomedullary junction = CN VI (near AICA); pons-midbrain junction = CN III (between PCA and SCA).", "set": "cn"}, {"id": "LH-44", "stem": "During a difficult delivery, obstetric forceps are misapplied at the infant's right stylomastoid foramen and crush its contents at the opening of the foramen. Which of the following ipsilateral deficits is the baby most likely to have?", "opts": ["Reduced blood flow to the inner ear", "No sensation in the external acoustic meatus", "Inability to close the eyelids", "Lack of taste on the body of the tongue", "Inability to tense the eardrum"], "ans": 2, "why": "The facial nerve leaves the skull at the stylomastoid foramen, which is superficial in newborns because the mastoid process is undeveloped. Injury there paralyzes the muscles of facial expression, including orbicularis oculi, so the eye cannot close.", "wrong": ["Inner ear is supplied by the labyrinthine artery via the internal acoustic meatus", "Meatal skin is supplied mainly by V3 and CN X; unaffected", "", "Chorda tympani leaves CN VII above the stylomastoid foramen, so taste is spared", "Tensor tympani is supplied by CN V3"], "pearl": "Stylomastoid foramen lesion = facial muscle paralysis only (taste, lacrimation, stapedius spared). Newborns lack a mastoid process to protect it.", "set": "cn"}, {"id": "G-71", "stem": "A 43-year-old man with a basilar skull fracture is suspected of having injured his right greater petrosal nerve. Which finding would confirm this diagnosis?", "opts": ["Partial dryness of the mouth due to lack of salivary secretions from the submandibular and sublingual glands", "Partial dryness of the mouth due to lack of salivary secretions from the parotid gland", "Dryness of the right cornea due to lack of lacrimal gland secretion", "Loss of taste sensation from the right anterior two thirds of the tongue", "Loss of general sensation from the right anterior two thirds of the tongue"], "ans": 2, "why": "The greater petrosal nerve carries the preganglionic parasympathetic supply for the lacrimal gland (and nasal/palatal glands), so its loss causes ipsilateral dry eye.", "wrong": ["These glands are supplied via chorda tympani and lingual nerve.", "Parotid is supplied via CN IX, lesser petrosal and auriculotemporal nerves.", "", "Anterior-tongue taste travels in the chorda tympani.", "General sensation of the anterior tongue is the lingual nerve (V3)."], "pearl": "Greater petrosal = tears + nasal/palatal mucus; chorda tympani = submandibular/sublingual saliva + anterior taste.", "set": "cn"}, {"id": "G-43", "stem": "A 7-year-old boy had severe otitis media that spread to the mastoid air cells. After mastoid surgery, the right corner of his mouth droops, he cannot close his right eye, and food collects in his right oral vestibule. Which nerve was injured?", "opts": ["Glossopharyngeal", "Vagus", "Facial", "Maxillary division of the trigeminal nerve", "Mandibular division of the trigeminal nerve"], "ans": 2, "why": "The facial nerve runs in the facial canal adjacent to the middle ear and mastoid; its injury paralyzes orbicularis oculi, orbicularis oris and buccinator.", "wrong": ["Does not supply facial muscles.", "Does not supply facial muscles.", "", "Purely sensory; no motor to face.", "Supplies mastication muscles, not buccinator or facial expression."], "pearl": "Food pooling in the vestibule = buccinator paralysis = CN VII (buccal branch).", "set": "cn"}, {"id": "G-238", "stem": "A 27-year-old unconscious woman has a right pupil that is dilated and unresponsive to light. CT shows a large aneurysm of the superior cerebellar artery just after its origin from the basilar artery, compressing the nerve responsible. Which nerve is compressed?", "opts": ["Oculomotor", "Trigeminal", "Facial", "Vagus", "Abducens"], "ans": 0, "why": "CN III emerges between the posterior cerebral and superior cerebellar arteries, so an SCA aneurysm can compress it. Its superficial parasympathetic fibers are affected first, producing a fixed dilated pupil.", "wrong": ["", "CN V does not control the pupil.", "CN VII does not control the pupil.", "CN X has no role in the pupillary reflex.", "CN VI moves the eye laterally; it has no pupillary fibers."], "pearl": "CN III passes between PCA and SCA; compression -> fixed dilated pupil first (parasympathetics are peripheral).", "set": "cn"}, {"id": "G-40", "stem": "A 55-year-old woman has a tumor at the base of the skull that decreases tear production. Which nerve is most likely injured?", "opts": ["Chorda tympani", "Deep petrosal", "Greater petrosal", "Lesser petrosal", "Nasociliary"], "ans": 2, "why": "The greater petrosal nerve (CN VII) carries preganglionic parasympathetics to the pterygopalatine ganglion, whose postganglionic fibers drive lacrimal secretion.", "wrong": ["Supplies submandibular/sublingual glands and anterior-tongue taste.", "Sympathetic; does not drive tear secretion.", "", "Parasympathetic to the parotid via the otic ganglion.", "Sensory to cornea, ethmoid sinuses and nose; not secretomotor."], "pearl": "Tears: CN VII → greater petrosal → nerve of pterygoid canal → pterygopalatine ganglion → zygomatic → lacrimal nerve.", "set": "cn"}, {"id": "G-87", "stem": "A 49-year-old woman has a tumor at the jugular foramen. When the right side of her pharyngeal wall is touched, the uvula deviates to the left and the left pharyngeal wall moves upward. Touching the left wall gives the same response. Which nerve has the tumor most likely injured?", "opts": ["Right glossopharyngeal", "Left glossopharyngeal", "Right mandibular", "Left hypoglossal", "Right vagus"], "ans": 4, "why": "The uvula is pulled toward the healthy side by the working levator veli palatini, so deviation to the left means the right palatal and pharyngeal muscles (CN X) are paralyzed. Sensation is intact on both sides, so CN IX is working.", "wrong": ["The reflex can still be triggered from the right side, so right CN IX sensation is intact.", "A left CN IX lesion would block the reflex from the left; the left side contracts normally.", "V3 supplies the chewing muscles and tensor veli palatini, not the pharyngeal constrictors.", "CN XII moves the tongue and has no effect on uvula position.", ""], "pearl": "Uvula deviates AWAY from the side of a CN X lesion.", "set": "cn"}, {"id": "BH-46", "stem": "A 37-year-old man has a fracture of the floor of the middle cranial fossa that severs the greater petrosal nerve. Which condition could result?", "opts": ["Increased lacrimal gland secretion", "Loss of taste sensation in the epiglottis", "Dryness in the nose and palate", "Decreased parotid gland secretion", "Loss of sensation in the pharynx"], "ans": 2, "why": "The greater petrosal nerve carries preganglionic parasympathetic fibers to the pterygopalatine ganglion for lacrimal, nasal, and palatal glands, so its loss causes dry eye, nose, and palate.", "wrong": ["Lacrimal secretion would decrease, not increase.", "Epiglottic taste travels via the internal laryngeal nerve (CN X).", "", "Parotid secretion depends on the lesser petrosal nerve (CN IX).", "Pharyngeal sensation is carried by CN IX."], "pearl": "Greater petrosal (VII) = lacrimal/nasal/palatal glands; lesser petrosal (IX) = parotid.", "set": "nasal_oral"}, {"id": "BC-8", "stem": "After radical resection of a primary tongue tumor, a 72-year-old patient has lost general sensation on the anterior two-thirds of the tongue. This is most likely due to injury to branches of which of the following nerves?", "opts": ["Trigeminal nerve", "Facial nerve", "Glossopharyngeal nerve", "Vagus nerve", "Hypoglossal nerve"], "ans": 0, "why": "General sensation of the anterior two-thirds of the tongue travels in the lingual nerve, a branch of V3.", "wrong": ["", "Facial nerve (chorda tympani) carries only taste to the anterior 2/3.", "CN IX supplies the posterior 1/3 of the tongue.", "Vagus supplies the epiglottic region via the internal laryngeal nerve.", "Hypoglossal is purely motor to tongue muscles."], "pearl": "Anterior 2/3 tongue: general sensation = V3 (lingual); taste = VII (chorda tympani).", "set": "nasal_oral"}, {"id": "G-198", "stem": "A 22-year-old woman has a 2-week sinus infection with focal inflammation and mucosal edema in the inferior nasal meatus. Drainage from which structure is most likely obstructed?", "opts": ["Anterior ethmoidal air cells", "Frontonasal duct", "Maxillary sinus", "Middle ethmoidal air cells", "Nasolacrimal duct"], "ans": 4, "why": "The nasolacrimal duct is the only structure that opens into the inferior meatus, so edema there blocks tear drainage.", "wrong": ["Open into the middle meatus (ethmoidal infundibulum).", "Opens into the middle meatus via the ethmoidal infundibulum.", "Opens into the middle meatus via the hiatus semilunaris.", "Open onto the ethmoidal bulla in the middle meatus.", ""], "pearl": "Inferior meatus receives ONLY the nasolacrimal duct.", "set": "nasal_oral"}, {"id": "BH-53", "stem": "A 46-year-old man complains of dry mouth. A swallowing study shows absent salivary secretion from the submandibular gland. This indicates a lesion of which structure?", "opts": ["Lingual nerve at its origin", "Chorda tympani in the middle ear cavity", "Superior cervical ganglion", "Lesser petrosal nerve", "Auriculotemporal nerve"], "ans": 1, "why": "Preganglionic parasympathetic fibers for the submandibular gland run in the chorda tympani, then join the lingual nerve to reach the submandibular ganglion.", "wrong": ["At its origin the lingual nerve has not yet received the chorda tympani.", "", "Superior cervical ganglion supplies vasomotor sympathetics only.", "Lesser petrosal nerve serves the otic ganglion/parotid.", "Auriculotemporal nerve carries parotid secretomotor fibers."], "pearl": "Submandibular/sublingual secretion: CN VII -> chorda tympani -> lingual n. -> submandibular ganglion.", "set": "nasal_oral"}, {"id": "G-90", "stem": "A 54-year-old man has a carcinoma in his nasal cavity. In which location would the tumor block the opening of the maxillary sinus?", "opts": ["Inferior meatus", "Middle meatus", "Superior meatus", "Nasopharynx", "Sphenoethmoidal recess"], "ans": 1, "why": "The maxillary sinus drains into the semilunar hiatus, which lies in the middle meatus under the middle concha.", "wrong": ["The inferior meatus receives the nasolacrimal duct.", "", "The superior meatus drains the posterior ethmoidal cells.", "The nasopharynx receives the auditory tube, not the sinuses.", "The sphenoethmoidal recess drains the sphenoid sinus."], "pearl": "Middle meatus (semilunar hiatus) drains the frontal, maxillary and anterior ethmoidal sinuses; the inferior meatus drains the nasolacrimal duct.", "set": "nasal_oral"}, {"id": "G-193", "stem": "A 45-year-old woman has dysphagia, nighttime coughing, repeated chest infections, and a palpable neck swelling. Imaging reveals a persistent pharyngeal pouch (diverticulum). Between which muscles is this pouch most likely located?", "opts": ["Between styloglossus and stylopharyngeus", "Between palatoglossal arch and median glossoepiglottic fold", "Between upper and middle pharyngeal constrictors", "Between the cricopharyngeal and thyropharyngeal portions of the inferior pharyngeal constrictor", "Between the middle and inferior pharyngeal constrictors"], "ans": 3, "why": "A Zenker diverticulum herniates through Killian's triangle, the weak area between the thyropharyngeus and cricopharyngeus parts of the inferior constrictor.", "wrong": ["Not a gap in the pharyngeal wall where diverticula form.", "These are oral/oropharyngeal landmarks, not a muscular weak area.", "This gap transmits stylopharyngeus/CN IX; not the Zenker site.", "", "This gap transmits the internal laryngeal nerve; not the usual pouch site."], "pearl": "Zenker = Killian's triangle between thyropharyngeus and cricopharyngeus -> halitosis, regurgitation.", "set": "nasal_oral"}, {"id": "LC-1", "stem": "After asking a 47-year-old woman to open her mouth wide and say \"Ah,\" the physician notes deviation of the uvula to the left side and asymmetric elevation of the soft palate, with the right side of the palate sagging. What specific nerve is most likely damaged?", "opts": ["Left glossopharyngeal nerve", "Left vagus nerve", "Right vagus nerve", "Left hypoglossal nerve", "Right hypoglossal nerve"], "ans": 2, "why": "The vagus (via pharyngeal plexus) supplies all palatal muscles except tensor veli palatini. With a right CN X lesion, the right palate droops and intact left muscles pull the uvula toward the left (away from the lesion).", "wrong": ["CN IX supplies only stylopharyngeus; no palatal muscle, so no uvular deviation.", "A left CN X lesion would make the uvula deviate to the right.", "", "CN XII moves the tongue, not the palate; left lesion deviates tongue left.", "CN XII moves the tongue, not the palate; right lesion deviates tongue right."], "pearl": "Uvula points AWAY from the damaged vagus nerve.", "set": "nasal_oral"}, {"id": "BH-34", "stem": "A 53-year-old man has difficulty breathing through his nose. His physician finds swelling of the mucous membrane of the superior nasal meatus. Which paranasal sinus opening is most likely blocked?", "opts": ["Middle ethmoidal sinus", "Maxillary sinus", "Posterior ethmoidal sinus", "Anterior ethmoidal sinus", "Frontal sinus"], "ans": 2, "why": "Only the posterior ethmoidal cells drain into the superior meatus.", "wrong": ["Middle ethmoidal cells open on the ethmoidal bulla (middle meatus).", "Maxillary sinus drains into the hiatus semilunaris (middle meatus).", "", "Anterior ethmoidal cells drain into the middle meatus.", "Frontal sinus drains via the frontonasal duct into the middle meatus."], "pearl": "Superior meatus = posterior ethmoid; middle = frontal, maxillary, anterior/middle ethmoid; inferior = nasolacrimal duct.", "set": "nasal_oral"}, {"id": "LH-6", "stem": "A 65-year-old man has a persistent nosebleed. His physician uses a cotton swab to apply pressure at the source, the inferior and posterior aspects of the lateral nasal wall. Which artery is the most likely source of the bleeding?", "opts": ["Greater palatine", "Infraorbital", "Facial", "Anterior ethmoidal", "Sphenopalatine"], "ans": 4, "why": "The sphenopalatine artery, a terminal branch of the maxillary artery, enters the nasal cavity through the sphenopalatine foramen and supplies the posterior lateral wall and septum; it is the usual source of posterior epistaxis.", "wrong": ["Supplies the hard palate; only a small branch reaches the anterior septum via the incisive canal", "Supplies the lower eyelid, cheek and upper lip, not the nasal cavity", "Supplies the external nose and anterior septum via septal branches, not the posterior lateral wall", "Supplies the anterosuperior nasal cavity, not the posteroinferior wall", ""], "pearl": "Posterior epistaxis = sphenopalatine a.; anterior = Kiesselbach plexus.", "set": "nasal_oral"}, {"id": "G-188", "stem": "A 35-year-old man with a tumor of the right submandibular gland undergoes removal of the gland and its duct. Which of the following nerves is most prone to injury in this procedure?", "opts": ["Buccal", "Lingual", "Inferior alveolar", "Nerve to mylohyoid", "Glossopharyngeal"], "ans": 1, "why": "The lingual nerve lies just under the floor-of-mouth mucosa and loops around the submandibular duct (lateral, then under, then medial), with the submandibular ganglion hanging from it, so it is at risk during gland/duct excision.", "wrong": ["Supplies cheek mucosa/skin, away from the gland and duct.", "", "Enters the mandibular foramen to supply lower teeth; not in the surgical field.", "Runs on the superficial surface of mylohyoid but is less closely related to the duct.", "Lies deep in the pharynx region, not near the submandibular duct."], "pearl": "Lingual nerve 'double-crosses' the submandibular duct -> at risk in gland/duct surgery.", "set": "nasal_oral"}, {"id": "LC-27", "stem": "A 14-year-old girl develops Horner syndrome after surgical removal of a posterior mediastinal mass. Which nerve would be affected by the loss of sympathetic innervation to the head?", "opts": ["Lesser petrosal", "Deep petrosal", "Greater petrosal", "Chorda tympani", "Optic"], "ans": 1, "why": "The deep petrosal nerve is made of postganglionic sympathetic fibers from the internal carotid plexus. It joins the greater petrosal to form the vidian nerve, so a sympathetic chain lesion removes its fibers.", "wrong": ["Carries CN IX preganglionic parasympathetics to the otic ganglion.", "", "Carries CN VII preganglionic parasympathetics for lacrimation.", "Carries CN VII taste and parasympathetic fibers.", "Pure special sensory; carries no autonomic fibers."], "pearl": "Deep petrosal = sympathetic; greater and lesser petrosal = parasympathetic.", "set": "nasal_oral"}, {"id": "G-117", "stem": "A 21-year-old baseball player comes in with severe dizziness, poor balance and memory problems. He has a 3-cm scalp wound from an injury in a game several weeks earlier. A lumbar puncture shows no blood in the CSF. What is the most likely diagnosis?", "opts": ["The middle meningeal artery was torn, resulting in epidural hematoma", "There is a fracture in the pterion with injury to the adjacent vasculature", "The injury resulted in the bursting of a preexisting aneurysm of the anterior communicating artery of the cerebral circle", "A cerebral vein is torn", "The cavernous sinus has a thrombus"], "ans": 3, "why": "A torn bridging (cerebral) vein bleeds slowly into the subdural space, so symptoms build over weeks. The blood stays out of the subarachnoid space, so the CSF is clear.", "wrong": ["An epidural bleed is acute (lucid interval), not delayed by weeks.", "A pterion fracture tears the middle meningeal artery and causes an acute epidural bleed.", "An aneurysm rupture causes subarachnoid bleeding, which puts blood in the CSF.", "", "Would cause palsies of CN III, IV, V1/V2 and VI."], "pearl": "Slow, delayed symptoms with clear CSF = subdural hematoma (torn bridging veins).", "set": "cranial"}, {"id": "BH-15", "stem": "A 14-year-old boy hits his head on the road after falling from his skateboard. Radiographs show damage to the sella turcica. Which bone is fractured?", "opts": ["Frontal bone", "Ethmoid bone", "Temporal bone", "Basioccipital bone", "Sphenoid bone"], "ans": 4, "why": "The sella turcica is part of the body of the sphenoid bone, sitting above the sphenoid sinus.", "wrong": ["Frontal bone forms the forehead and anterior fossa floor.", "Ethmoid forms the cribriform plate, not the sella.", "Temporal bone forms the lateral skull and petrous ridge.", "Basioccipital (clivus) lies posterior-inferior to the sella.", ""], "pearl": "Sella turcica = sphenoid body.", "set": "cranial"}, {"id": "BH-17", "stem": "A 37-year-old patient has an infection of the dural venous sinus closest to the pituitary gland with secondary thrombus formation. Which is the most likely site?", "opts": ["Straight sinus", "Cavernous sinus", "Superior petrosal sinus", "Sigmoid sinus", "Confluence of sinuses"], "ans": 1, "why": "The cavernous sinuses flank the sella turcica and pituitary; cavernous sinus thrombophlebitis can cause ophthalmoplegia, exophthalmos, and papilledema.", "wrong": ["Straight sinus lies at the falx-tentorium junction, far posterior.", "", "Superior petrosal sinus lies along the petrous ridge.", "Sigmoid sinus lies in the posterior cranial fossa.", "Confluence lies at the internal occipital protuberance."], "pearl": "Cavernous sinus = lateral to pituitary; danger-triangle infections spread here.", "set": "cranial"}, {"id": "G-128", "stem": "A 55-year-old man has severe headaches, and a lumbar puncture shows traces of blood in the CSF. What has most likely happened?", "opts": ["Fracture of the pterion with vascular injury", "A ruptured 'berry' aneurysm", "Leakage of branches of the middle meningeal vein within the temporal bone", "A tear of the cerebral vein at the entrance to the superior sagittal sinus", "Occlusion of the internal carotid artery by a clot generated in the left atrium"], "ans": 1, "why": "A ruptured berry aneurysm bleeds into the subarachnoid space, where CSF circulates, so blood shows up on lumbar puncture.", "wrong": ["Causes an epidural bleed, which stays out of the CSF.", "", "Bleeding inside the bone does not reach the CSF.", "Causes a subdural bleed, which stays out of the CSF.", "A clot causes ischemic stroke, not bleeding."], "pearl": "Blood in the CSF = subarachnoid hemorrhage (berry aneurysm, 'worst headache of life').", "set": "cranial"}, {"id": "LH-57", "stem": "A 17-year-old woman strikes the front of her head on the steering wheel in a head-on collision. CT shows a left crescent-shaped extra-axial hematoma compressing the brain. What blood vessel(s) is/are the most likely source of this hemorrhage?", "opts": ["Middle meningeal artery", "Superficial temporal artery", "Cerebral arterial circle", "Superior cerebral veins", "Occipital artery"], "ans": 3, "why": "A crescent-shaped collection that crosses suture lines is a subdural hematoma, caused by tearing of the superior cerebral (bridging) veins as they cross from the brain to the superior sagittal sinus during sudden head acceleration-deceleration.", "wrong": ["Causes a biconvex epidural hematoma", "Lies in the scalp; bleeds outside the skull", "Aneurysm rupture causes subarachnoid hemorrhage", "", "Supplies the posterior scalp; outside the skull"], "pearl": "Subdural = bridging (superior cerebral) veins, crescent-shaped, crosses sutures.", "set": "cranial"}, {"id": "LH-69", "stem": "An 82-year-old woman develops a dural meningioma that compresses the confluence of the dural venous sinuses. Drainage from which of the following vessels would be impeded by the tumor?", "opts": ["Superior sagittal sinus", "Transverse sinus", "Cavernous sinus", "Superior petrosal sinus", "Inferior petrosal sinus"], "ans": 0, "why": "The superior sagittal sinus runs in the attached border of the falx cerebri and empties into the confluence of sinuses near the internal occipital protuberance. Blocking the confluence backs up flow in the superior sagittal sinus.", "wrong": ["", "Carries blood AWAY from the confluence, so it is downstream, not impeded", "Drains via the petrosal sinuses, not the confluence", "Drains the cavernous sinus into the transverse/sigmoid junction, bypassing the confluence", "Drains the cavernous sinus directly into the internal jugular vein"], "pearl": "Superior sagittal (+ straight, occipital) -> confluence -> transverse -> sigmoid -> IJV.", "set": "cranial"}, {"id": "G-247", "stem": "A 51-year-old man has left-sided hearing loss, poor balance, loss of taste, and drooling from the left side of his mouth. CT shows a tumor on the left side of the posterior cranial fossa. Where is the tumor located?", "opts": ["Foramen ovale", "Foramen rotundum", "Internal acoustic meatus", "Jugular foramen", "Superior orbital fissure"], "ans": 2, "why": "The internal acoustic meatus carries both CN VII (taste to the anterior tongue, facial muscles) and CN VIII (hearing and balance), so one lesion there explains all the findings.", "wrong": ["Foramen ovale carries V3, which gives jaw weakness and lower-face numbness.", "Foramen rotundum carries V2, which is sensory to the midface.", "", "Jugular foramen lesions affect IX, X, XI, not hearing or facial movement.", "The SOF lesion affects eye movement and V1 sensation."], "pearl": "Internal acoustic meatus = CN VII + VIII (+ labyrinthine artery).", "set": "cranial"}, {"id": "BH-39", "stem": "A 58-year-old woman has progressive loss of voice, numbness and loss of taste on the back of her tongue, and difficulty shrugging her shoulders. MRI shows a dural meningioma compressing the nerves as they leave the skull. Through which opening do these nerves exit?", "opts": ["Foramen spinosum", "Foramen rotundum", "Internal auditory meatus", "Jugular foramen", "Foramen lacerum"], "ans": 3, "why": "Voice loss (CN X), posterior-tongue taste/sensation loss (CN IX), and weak shoulder shrug (CN XI) localize to the jugular foramen, which transmits all three.", "wrong": ["Foramen spinosum transmits the middle meningeal artery.", "Foramen rotundum transmits V2.", "Internal auditory meatus transmits CN VII and VIII.", "", "Foramen lacerum transmits essentially nothing (ICA crosses its top)."], "pearl": "Jugular foramen syndrome = CN IX, X, XI deficits.", "set": "cranial"}, {"id": "BH-13", "stem": "A 67-year-old woman complains of visual loss. MRI shows an enlarged pituitary gland in the sella turcica. The sella lies immediately posterior and superior to which of the following structures?", "opts": ["Frontal sinus", "Maxillary sinus", "Ethmoid air cells", "Mastoid air cells", "Sphenoid sinus"], "ans": 4, "why": "The hypophyseal fossa sits on the body of the sphenoid, directly above and behind the sphenoid sinus - the basis for transsphenoidal pituitary surgery.", "wrong": ["Frontal sinus is in the frontal bone, far anterior.", "Maxillary sinus lies lateral to the nasal cavity, below the orbit.", "Ethmoid cells lie between the orbit and nasal cavity.", "Mastoid air cells are in the temporal bone.", ""], "pearl": "Sella turcica sits on top of the sphenoid sinus - transsphenoidal approach.", "set": "cranial"}, {"id": "G-278", "stem": "A 21-year-old man cuts his scalp deeply while shaving his head; the wound becomes infected and then subsides. Three weeks later he has severe headache and nausea and is found to have an infection of the superior sagittal sinus. Which veins most likely carried the infection?", "opts": ["Intercavernous", "Inferior sagittal", "Diploic", "Basilar", "Emissary"], "ans": 4, "why": "Emissary veins pass through foramina in the calvaria and link scalp veins in the loose connective tissue layer with the dural venous sinuses, allowing scalp infections to reach the superior sagittal sinus.", "wrong": ["Intercavernous sinuses connect the two cavernous sinuses.", "The inferior sagittal sinus is in the free edge of the falx, not connected to scalp.", "Diploic veins drain the marrow space of the skull bones.", "The basilar plexus lies over the clivus.", ""], "pearl": "Scalp -> emissary veins -> dural sinuses (valveless route for infection).", "set": "cranial"}, {"id": "G-190", "stem": "A 55-year-old farmer falls from a hayloft. Radiographs reveal a small depressed fracture of the skull vertex and thrombosis of the superior sagittal sinus. A day later he loses consciousness. What is the most likely cause?", "opts": ["Obstruction of CSF resorption", "Obstruction of the cerebral aqueduct (of Sylvius)", "Laceration of the middle meningeal artery", "Fracture of the cribriform plate with CSF rhinorrhea", "Aneurysm of the middle cerebral artery"], "ans": 0, "why": "CSF is returned to the venous blood through arachnoid granulations that project into the superior sagittal sinus. Sinus thrombosis blocks this resorption, raising intracranial pressure (communicating hydrocephalus).", "wrong": ["", "Not a relevant structure here; the vertex fracture affects the sinus, not ventricular channels.", "Middle meningeal artery runs at the pterion, not the vertex.", "Cribriform plate is in the anterior fossa floor, not the vertex.", "No evidence of aneurysm; the problem is sinus thrombosis."], "pearl": "Arachnoid granulations drain CSF into the superior sagittal sinus.", "set": "cranial"}, {"id": "BH-42", "stem": "A 57-year-old man has fever, headache, nausea, and vomiting; imaging localizes an infection to the cavernous sinus. Which nerves would be unaffected by this condition?", "opts": ["Oculomotor nerves", "Abducens nerves", "Trochlear nerves", "Mandibular nerves", "Ophthalmic nerves"], "ans": 3, "why": "V3 leaves the trigeminal ganglion directly through the foramen ovale and does not travel in the cavernous sinus wall.", "wrong": ["CN III runs in the lateral wall of the sinus.", "CN VI runs through the middle of the sinus.", "CN IV runs in the lateral wall of the sinus.", "", "V1 runs in the lateral wall of the sinus."], "pearl": "Cavernous sinus: III, IV, V1, V2 (lateral wall) + VI and ICA (inside); NOT V3.", "set": "cranial"}, {"id": "G-243", "stem": "An 82-year-old man is noted to have unequal pupils. Which test would help determine which eye is abnormal and whether the problem is a sympathetic or an oculomotor lesion?", "opts": ["Startle reflex", "Blink reflex", "Pupillary light reflex", "H-test", "Vision test (reading chart)"], "ans": 2, "why": "Testing direct and consensual responses to light shows which pupil fails to constrict (CN III efferent) versus a small pupil that reacts but fails to dilate (sympathetic lesion).", "wrong": ["Startle is an acoustic reflex, not a pupil test.", "Blink (corneal) reflex tests V1 and VII.", "", "H-test assesses extraocular muscles, not pupil size.", "Visual acuity tests the optic pathway, not pupillary innervation."], "pearl": "Anisocoria worse in light = parasympathetic (CN III) problem; worse in dark = sympathetic (Horner).", "set": "orbit"}, {"id": "G-269", "stem": "A 16-year-old boy is struck in the left eye by a baseball bat and has pain and blurred vision. When asked to look upward, the left eye fails to elevate. Imaging shows a fracture of the orbital floor. Which muscle is most likely affected?", "opts": ["Levator palpebrae superioris", "Inferior oblique", "Inferior rectus", "Medial rectus", "Superior rectus"], "ans": 2, "why": "A blow-out fracture of the orbital floor can trap the inferior rectus in the fracture. The tethered muscle cannot relax, so the eye cannot look up and the patient has diplopia on upward gaze.", "wrong": ["Levator lies superiorly and elevates the lid, not the globe.", "Inferior oblique can be involved but the classic entrapped muscle is inferior rectus.", "", "Medial rectus is trapped with medial wall (ethmoid) fractures.", "Superior rectus lies superiorly, away from the floor."], "pearl": "Orbital floor blow-out -> inferior rectus entrapment -> impaired upgaze; also infraorbital n. numbness.", "set": "orbit"}, {"id": "G-41", "stem": "A 24-year-old man has an inferior (blow-out) fracture of the orbit after a street fight. Into which space would orbital structures most likely herniate inferiorly?", "opts": ["Ethmoidal sinus", "Frontal sinus", "Maxillary sinus", "Nasal cavity", "Sphenoidal sinus"], "ans": 2, "why": "The orbital floor is the roof of the maxillary sinus, so a floor blow-out displaces orbital contents downward into that sinus.", "wrong": ["Lies medial to the orbit (medial wall blow-out).", "Lies above the orbit.", "", "Lies medial, not inferior, to the orbit.", "Lies posterior and medial, not below the orbit."], "pearl": "Orbital floor blow-out → inferior rectus/fat herniate into maxillary sinus → upward-gaze diplopia and infraorbital numbness.", "set": "orbit"}, {"id": "LC-9", "stem": "A 54-year-old man cannot open his left eye. When he lifts the lid with his fingers, the left eye is directed inferiorly and laterally, causing diplopia, and the left pupil is dilated. What nerve is most likely affected?", "opts": ["Left oculomotor nerve", "Right oculomotor nerve", "Left abducent nerve", "Right abducent nerve", "Left trochlear nerve"], "ans": 0, "why": "CN III supplies levator palpebrae (ptosis when lost), four EOMs (unopposed lateral rectus and superior oblique leave the eye down and out), and parasympathetics to sphincter pupillae (mydriasis).", "wrong": ["", "Findings are in the left eye, so the right CN III is intact.", "Left CN VI palsy leaves the eye adducted, without ptosis or mydriasis.", "Right CN VI palsy would affect the right eye and cause esotropia.", "CN IV palsy causes vertical diplopia but no ptosis or dilated pupil."], "pearl": "\"Down and out\" eye + ptosis + blown pupil = CN III palsy.", "set": "orbit"}, {"id": "G-166", "stem": "A 56-year-old woman presents with eye pain that is excruciating with any eye movement. MRI reveals that the optic nerve is inflamed. What is the most likely explanation?", "opts": ["The anular tendon (of Zinn) is inflamed", "The inflammation has affected the nerves innervating the eye muscles", "The muscles are contracting due to generalized inflammation", "The nasociliary nerve is affected", "The ophthalmic artery is constricted"], "ans": 0, "why": "The dural sheath of the optic nerve blends with the common tendinous (anular) ring from which the four recti arise. In optic neuritis, rectus contraction pulls on this inflamed ring and nerve sheath, causing pain with eye movement.", "wrong": ["", "Motor nerve involvement would cause weakness/diplopia, not movement-evoked pain.", "No generalized muscle inflammation is described.", "Nasociliary involvement would affect sensation, not explain pain triggered by movement.", "Vascular constriction would affect vision/ischemia, not pain on movement."], "pearl": "Optic neuritis hurts with eye movement because recti arise from the anular tendon fused to the optic sheath.", "set": "orbit"}, {"id": "BC-7", "stem": "A 34-year-old man in a bar fight suffers a knife wound that severs the abducens nerve proximal to its entrance into the orbit. Which of the following conditions results from this injury?", "opts": ["Ptosis of the upper eyelid", "Loss of the ability to dilate the pupil", "External strabismus (lateral deviation)", "Loss of visual accommodation", "Internal strabismus (medial deviation)"], "ans": 4, "why": "CN VI innervates the lateral rectus. Without it, the medial rectus pulls the eye medially, causing internal strabismus and horizontal diplopia.", "wrong": ["Ptosis follows CN III or sympathetic lesions.", "Inability to dilate the pupil follows sympathetic injury.", "External strabismus follows medial rectus (CN III) paralysis.", "Accommodation loss follows parasympathetic (CN III/ciliary) injury.", ""], "pearl": "CN VI lesion = eye deviates medially (esotropia), can't abduct.", "set": "orbit"}, {"id": "BC-2", "stem": "A 16-year-old boy presents with double vision. Examination shows difficulty turning his eye inferolaterally and trouble going down stairs. Which of the following nerves is most likely damaged?", "opts": ["Oculomotor nerve", "Optic nerve", "Ophthalmic nerve", "Trochlear nerve", "Abducens nerve"], "ans": 3, "why": "The trochlear nerve supplies the superior oblique, which moves the eye down and out. Its paralysis causes vertical diplopia that is worst when looking down, such as descending stairs.", "wrong": ["CN III palsy gives ptosis, mydriasis, and a down-and-out eye.", "Optic nerve lesion causes blindness, not diplopia.", "V1 is sensory to the forehead/upper face; no eye movement.", "", "CN VI palsy causes medial deviation (internal strabismus)."], "pearl": "Trouble walking down stairs + vertical diplopia = CN IV (superior oblique).", "set": "orbit"}, {"id": "G-80", "stem": "A 32-year-old woman has headaches and dizziness. On examination she has partial ptosis (drooping eyelid). Which muscle is most likely paralyzed?", "opts": ["Orbicularis oculi, lacrimal part", "Orbicularis oculi, palpebral part", "Levator palpebrae superioris", "Superior oblique", "Superior tarsal (of Müller)"], "ans": 4, "why": "The superior tarsal muscle is sympathetically innervated smooth muscle that helps hold the lid up. Losing it causes only mild (partial) ptosis, whereas losing the levator (CN III) causes complete ptosis.", "wrong": ["The lacrimal part helps drain tears; it does not lift the lid.", "The palpebral part closes the lid gently; paralysis would not cause ptosis.", "Levator (CN III) paralysis causes complete ptosis, not partial.", "The superior oblique moves the globe; it does not lift the eyelid.", ""], "pearl": "Partial ptosis = superior tarsal (sympathetic, Horner); complete ptosis = levator palpebrae (CN III).", "set": "orbit"}, {"id": "LH-8", "stem": "A 75-year-old man reports progressively more trouble opening his left eye because his upper eyelid tends to droop. Which of the following muscles is most likely weakened?", "opts": ["Orbicularis oculi", "Frontalis", "Levator palpebrae superioris", "Superior rectus", "Orbital muscle"], "ans": 2, "why": "The levator palpebrae superioris (CN III) is the main elevator of the upper eyelid; its weakness or aponeurotic dehiscence in the elderly causes ptosis.", "wrong": ["Closes the eyelids (CN VII); weakness causes inability to close, not ptosis", "Raises the eyebrows and wrinkles the forehead; does not lift the lid itself", "", "Elevates the eyeball, not the eyelid", "Smooth muscle bridging the inferior orbital fissure; not an eyelid elevator"], "pearl": "Ptosis: large = LPS/CN III; mild = superior tarsal (Müller) muscle/sympathetic loss.", "set": "orbit"}, {"id": "G-53", "stem": "A 22-year-old woman has an eye injury. The corneal reflex is tested and found to be present. Which nerve is responsible for the afferent limb of this reflex?", "opts": ["Frontal", "Lacrimal", "Nasociliary", "Oculomotor", "Optic"], "ans": 2, "why": "The cornea is supplied by the long ciliary branches of the nasociliary nerve (V1), which form the sensory limb of the blink reflex.", "wrong": ["Supplies forehead and upper lid skin, not the cornea.", "Supplies lacrimal gland region and lateral upper lid.", "", "Motor to levator (reopens eye); not afferent.", "Afferent for the light reflex, not the corneal reflex."], "pearl": "Corneal reflex: nasociliary (V1) afferent → facial (VII) efferent to orbicularis oculi, bilaterally.", "set": "orbit"}, {"id": "G-181", "stem": "A 34-year-old woman presents with a painful eye. Examination reveals a lump in the lower eyelid consisting of debris, and a chalazion is diagnosed. Which of the following structures is most likely blocked?", "opts": ["Lacrimal ducts", "Tarsal glands", "Sclera", "Pupil", "Nasolacrimal duct"], "ans": 1, "why": "A chalazion is a cyst from obstruction of a tarsal (meibomian) gland embedded in the tarsal plate of the eyelid.", "wrong": ["Lacrimal gland swelling presents in the upper lateral lid, not as a chalazion.", "", "Part of the globe wall; not a glandular structure that can be blocked.", "An opening in the iris, not related to eyelid glands.", "Drains the lacrimal sac to the inferior meatus; unrelated to a lid lump."], "pearl": "Chalazion = blocked tarsal (meibomian) gland; stye (hordeolum) = infected gland of eyelash follicle.", "set": "orbit"}, {"id": "G-169", "stem": "A 6-year-old boy has high fever and pain over the parotid gland. A diagnosis of parotitis (mumps) is established. Which of the following nerves is responsible for painful sensations from the region of the parotid gland?", "opts": ["Facial", "Auriculotemporal", "Lesser petrosal", "Lingual", "Chorda tympani"], "ans": 1, "why": "The auriculotemporal nerve (V3) supplies sensation to the parotid gland and its capsule. The tough, nondistensible parotid fascia makes swelling very painful, and the pain may be referred to the ear.", "wrong": ["Passes through the parotid but is motor to facial muscles, not sensory to the gland.", "", "Carries preganglionic parasympathetics (CN IX) to the otic ganglion, not pain.", "Supplies the anterior tongue and floor of mouth.", "Carries taste and submandibular/sublingual secretomotor fibers."], "pearl": "Parotid pain = auriculotemporal (V3); parotid secretomotor = CN IX via otic ganglion.", "set": "face"}, {"id": "LH-18", "stem": "A 23-year-old woman wakes up with a facial nerve (Bell) palsy. What muscle will continue to function despite this condition?", "opts": ["Zygomaticus major", "Levator labii superioris", "Buccinator", "Masseter", "Platysma"], "ans": 3, "why": "The masseter is a muscle of mastication supplied by CN V3, so it is unaffected by a CN VII palsy; all the other choices are muscles of facial expression innervated by the facial nerve.", "wrong": ["Muscle of facial expression (CN VII, zygomatic/buccal branches)", "Muscle of facial expression (CN VII)", "Cheek muscle of facial expression (CN VII buccal branch)", "", "Facial expression muscle supplied by the cervical branch of CN VII"], "pearl": "Bell palsy spares mastication (CN V3): masseter, temporalis, pterygoids still work.", "set": "face"}, {"id": "LH-64", "stem": "A bony overgrowth narrows the pterygomaxillary fissure, compressing the third (pterygopalatine) part of the maxillary artery. Blood flow will be reduced in which of the following arteries?", "opts": ["Superficial temporal", "Sphenopalatine", "Inferior alveolar", "Middle meningeal", "Ophthalmic"], "ans": 1, "why": "The third part of the maxillary artery passes through the pterygomaxillary fissure into the pterygopalatine fossa and gives off the sphenopalatine, descending palatine, posterior superior alveolar, and infraorbital arteries.", "wrong": ["Terminal branch of the external carotid, separate from the maxillary artery", "", "Branch of the first (mandibular) part of the maxillary artery", "Branch of the first (mandibular) part of the maxillary artery", "Branch of the internal carotid artery"], "pearl": "Maxillary a.: 1st part (middle meningeal, inferior alveolar); 2nd (muscular); 3rd (sphenopalatine, infraorbital, PSA, descending palatine).", "set": "face"}, {"id": "G-222", "stem": "A severe mandibular fracture in a 22-year-old woman requires surgical reconstruction. Postoperatively she has numbness of the lower lip and chin. Which nerve was most likely injured?", "opts": ["Auriculotemporal", "Buccal", "Lesser petrosal", "Mental", "Infraorbital"], "ans": 3, "why": "The mental nerve, the terminal branch of the inferior alveolar nerve (V3), exits the mental foramen to supply the skin and mucosa of the lower lip and chin.", "wrong": ["Supplies skin of the temple, auricle, and TMJ/parotid.", "Supplies cheek skin and buccal mucosa.", "Carries CN IX parasympathetics to the otic ganglion; no skin sensation.", "", "V2 branch supplying the lower eyelid, cheek, and upper lip."], "pearl": "Lower lip + chin numbness = mental nerve (from inferior alveolar, V3).", "set": "face"}, {"id": "G-274", "stem": "A teenager's friend tries to pierce her left tragus but the needle punctures deeply just anterior to the tragus. The next morning the left temporal scalp up to the vertex is numb. Which nerve is most likely damaged?", "opts": ["Lesser occipital", "Greater occipital", "Auriculotemporal", "Zygomaticotemporal", "Great auricular"], "ans": 2, "why": "The auriculotemporal nerve (V3) emerges behind the TMJ and ascends just in front of the ear with the superficial temporal vessels, supplying the tragus, anterior auricle, and most of the temporal scalp.", "wrong": ["Lesser occipital supplies the scalp behind the ear.", "Greater occipital supplies the occipital scalp.", "", "Zygomaticotemporal supplies a small area over the anterior temple.", "Great auricular supplies skin over the angle of the mandible, parotid, and lower ear."], "pearl": "Auriculotemporal n.: pre-auricular, runs with superficial temporal a., carries otic parasympathetics to parotid.", "set": "face"}, {"id": "G-291", "stem": "A 40-year-old woman has painful, warm swelling over the left mandible in front of the ear. Ultrasound shows a stone in the parotid duct with the duct distended proximally. Which other clinical feature is most likely?", "opts": ["Weak deviation of the mandible to the right", "Complete ptosis of the left eyelid", "Numbness of the skin over the left lower mandible", "Excessive tearing", "Pain over the anterior auricle, tragus, and anterior helix"], "ans": 4, "why": "A swollen parotid can irritate the auriculotemporal nerve, which runs through/near the gland and supplies the anterior auricle, tragus, and helix, giving pain there.", "wrong": ["Lateral jaw movement is by the pterygoids (V3), not in the gland.", "Complete ptosis is CN III.", "Skin over the lower mandible is supplied by the mental nerve and great auricular nerve.", "Tearing is driven by CN VII via the pterygopalatine ganglion, not the parotid.", ""], "pearl": "Parotid swelling -> auriculotemporal pain (pre-auricular/temple); CN VII branches also run through gland.", "set": "face"}, {"id": "G-57", "stem": "A 32-year-old woman asks about the soft, thin ridge she can feel running forward across her masseter muscle toward her upper lip. What structure is she most likely feeling?", "opts": ["Facial artery", "Maxillary artery", "Parotid duct", "Marginal mandibular branch of the facial nerve", "Facial vein"], "ans": 2, "why": "The parotid (Stensen's) duct crosses the masseter horizontally, then pierces buccinator to open opposite the upper second molar; it is palpable over a clenched masseter.", "wrong": ["Pulse is felt at the anterior border of masseter on the mandible, not across it.", "Lies deep in the infratemporal fossa; not palpable.", "", "Runs along the lower border of the mandible; too fine to palpate.", "Runs obliquely anterior to the facial artery, not across masseter."], "pearl": "Parotid duct: across masseter, pierces buccinator, opens at upper 2nd molar.", "set": "face"}, {"id": "BH-10", "stem": "A 33-year-old woman develops Bell palsy and is warned that she may develop corneal inflammation and ulceration. This risk results from which of the following?", "opts": ["Sensory loss of the cornea and conjunctiva", "Lack of secretion of the parotid gland", "Absence of the corneal blink reflex", "Absence of sweating on the face", "Inability to constrict the pupil"], "ans": 2, "why": "Facial palsy paralyzes the orbicularis oculi, the efferent limb of the corneal blink reflex, so the eye cannot close to protect the cornea.", "wrong": ["Corneal sensation is V1, which is intact in Bell palsy.", "Parotid secretion depends on CN IX (lesser petrosal).", "", "Facial sweating is sympathetic.", "Pupillary constriction depends on CN III parasympathetics."], "pearl": "Bell palsy: can't close eye -> exposure keratitis; protect the cornea.", "set": "face"}, {"id": "G-308", "stem": "A 64-year-old man had a parotidectomy for a malignant tumor. About a year later, he sweats on that side of his face when he sees appetizing food. Where are the cell bodies of the nerve fibers now innervating his sweat glands?", "opts": ["Ciliary ganglion", "Pterygopalatine ganglion", "Otic ganglion", "Submandibular ganglion", "Superior salivatory nucleus"], "ans": 2, "why": "In Frey syndrome, cut postganglionic parasympathetic fibers from the otic ganglion regrow along the auriculotemporal nerve into facial sweat glands, so salivary stimuli now cause sweating.", "wrong": ["The ciliary ganglion supplies the sphincter pupillae and ciliary muscle.", "The pterygopalatine ganglion supplies lacrimal and nasal/palatal glands.", "", "The submandibular ganglion supplies the submandibular/sublingual glands.", "The superior salivatory nucleus holds preganglionic CN VII cell bodies, not postganglionic."], "pearl": "Frey syndrome: otic ganglion fibers via auriculotemporal n. aberrantly reinnervate sweat glands.", "set": "face"}, {"id": "G-73", "stem": "A 38-year-old woman has acute dental pain from penetrating caries in a mandibular molar. Which nerve would the dentist need to anesthetize to treat this tooth?", "opts": ["Lingual", "Inferior alveolar", "Buccal", "Mental", "Mylohyoid"], "ans": 1, "why": "The inferior alveolar nerve (V3) runs in the mandibular canal and supplies all mandibular teeth.", "wrong": ["Supplies the anterior tongue and lingual gingiva, not the teeth.", "", "Supplies cheek skin/mucosa and buccal gingiva.", "Terminal branch after the mental foramen; supplies chin/lip, not molars.", "Motor to mylohyoid and anterior digastric."], "pearl": "Inferior alveolar nerve block (at the mandibular foramen) numbs all lower teeth on that side plus lip and chin.", "set": "face"}, {"id": "LH-37", "stem": "A 9-year-old girl with mumps has painful unilateral inflammation of her right parotid gland due to the stretched capsule. Her physician is concerned about the structures contained within the gland. Which of the following may be directly compressed?", "opts": ["Buccal nerve of CN V3", "Auriculotemporal nerve", "Posterior belly of the digastric muscle", "External jugular vein", "Facial artery"], "ans": 1, "why": "The auriculotemporal nerve (CN V3) passes through the upper parotid gland and supplies its capsule, so it can be compressed by the swollen gland and carries much of the pain.", "wrong": ["Runs anteriorly on the buccinator, not within the parotid", "", "Lies deep to the parotid, not inside it", "Forms below the gland from the retromandibular and posterior auricular veins", "Runs in the submandibular region and face, not through the parotid"], "pearl": "Parotid contents: CN VII branches, retromandibular v., ECA (and its terminal branches), auriculotemporal n.", "set": "face"}, {"id": "G-227", "stem": "A 23-year-old right-handed baseball pitcher has hypertrophied right scalene muscles on CT, and thoracic outlet syndrome is diagnosed. Which symptom is consistent with this diagnosis?", "opts": ["Problems with respiration because of pressure on the phrenic nerve", "Reduced blood flow to the thoracic wall", "Reduced venous return from the head and neck", "Numbness in the upper extremity", "Distension of the internal jugular vein"], "ans": 3, "why": "The brachial plexus trunks and subclavian artery pass through the interscalene gap between anterior and middle scalenes; hypertrophy compresses them, producing upper limb numbness, tingling, weakness, and coldness.", "wrong": ["The phrenic nerve lies on the anterior surface of anterior scalene, not in the gap.", "Thoracic wall supply is not the typical target of this compression.", "Head and neck veins do not pass through the scalene gap.", "", "The IJV is not compressed by scalene hypertrophy."], "pearl": "Scalene triangle transmits brachial plexus + subclavian artery (vein passes anterior to anterior scalene).", "set": "neck"}, {"id": "LH-27", "stem": "A 42-year-old man has a lymph node biopsy in the left posterior triangle of the neck. After closure, the physician asks him to rotate his head to the right against resistance. What nerve is the doctor assessing with this test?", "opts": ["Hypoglossal", "Accessory", "Mandibular division of trigeminal", "Great auricular", "Upper trunk of the brachial plexus"], "ans": 1, "why": "CN XI runs superficially across the posterior triangle, where it is at risk during node biopsy. It supplies the SCM; the left SCM turns the chin to the right, so resisted right rotation tests the left accessory nerve.", "wrong": ["Supplies tongue muscles; not tested by head rotation", "", "Supplies muscles of mastication, not neck rotators", "Purely sensory (skin over parotid and ear)", "Supplies shoulder muscles; does not rotate the head"], "pearl": "Turn head to the RIGHT against resistance = LEFT SCM = left CN XI.", "set": "neck"}, {"id": "LH-16", "stem": "A 9-year-old girl with a history of strep throat has her palatine tonsils removed. She returns 3 days later with high fever and chest pain; CT shows infection in the superior mediastinum. What is the most likely route for this infection to descend through the neck to reach the superior mediastinum?", "opts": ["Parapharyngeal space", "Retropharyngeal space", "Buccal space", "Carotid sheath", "Suprasternal space"], "ans": 1, "why": "The retropharyngeal space lies between the buccopharyngeal (visceral) fascia and the prevertebral fascia and extends from the skull base into the superior mediastinum, making it the most common path for pharyngeal infection to spread into the chest.", "wrong": ["Lateral to the pharynx; reaches the mediastinum only by communicating with the retropharyngeal space", "", "Lies in the cheek; has no path to the mediastinum", "Can conduct infection, but it is not the most common route", "Small space above the manubrium within the investing fascia; closed inferiorly"], "pearl": "Retropharyngeal space: skull base -> superior mediastinum; 'danger' route for neck infections.", "set": "neck"}, {"id": "G-194", "stem": "A 5-year-old boy falls from a tree and is unconscious. During an emergency tracheostomy, profuse dark venous bleeding suddenly occurs from the midline incision over the trachea. Which vessel was most likely cut?", "opts": ["Superior thyroid vein", "Inferior thyroid vein", "Left brachiocephalic vein", "Middle thyroid vein", "Jugular arch connecting the anterior jugular veins"], "ans": 2, "why": "The left brachiocephalic vein crosses anterior to the trachea from left to right to form the SVC; in children it can project above the manubrium into the low midline neck, so a low tracheostomy can tear it.", "wrong": ["Drains upward and laterally to the IJV, above and lateral to the incision.", "Descends on the trachea but is smaller; profuse bleeding favors the brachiocephalic vein.", "", "Runs laterally to the IJV, away from the midline incision.", "Superficial and small; not usually a source of major bleeding."], "pearl": "Children: left brachiocephalic vein may rise above the jugular notch -> risk in low tracheostomy.", "set": "neck"}, {"id": "BH-32", "stem": "A high school basketball player develops sudden difficulty breathing. When a low tracheotomy is performed below the isthmus of the thyroid, which vessels may be encountered?", "opts": ["Inferior thyroid artery", "Inferior thyroid vein", "Costocervical trunk", "Superior thyroid artery", "Right brachiocephalic vein"], "ans": 1, "why": "The inferior thyroid veins descend from the isthmus on the anterior trachea to the brachiocephalic veins, directly in the path of a low tracheotomy.", "wrong": ["Inferior thyroid artery approaches the gland laterally, behind the carotid sheath.", "", "Costocervical trunk lies deep, posterior in the root of the neck.", "Superior thyroid artery reaches the upper poles.", "The brachiocephalic veins lie lower and more lateral."], "pearl": "Low tracheotomy hazards: inferior thyroid veins (and a thyroid ima artery, if present).", "set": "neck"}, {"id": "BH-40", "stem": "A 21-year-old woman has an infection within the carotid sheath. Which structures would be damaged?", "opts": ["Vagus nerve and middle cervical ganglion", "Internal carotid artery and recurrent laryngeal nerve", "Internal jugular vein and vagus nerve", "Sympathetic trunk and common carotid artery", "External carotid artery and ansa cervicalis"], "ans": 2, "why": "The carotid sheath contains the common and internal carotid arteries, internal jugular vein, and vagus nerve.", "wrong": ["The cervical ganglia lie behind the sheath.", "Recurrent laryngeal nerve lies in the tracheoesophageal groove.", "", "Sympathetic trunk lies posterior to the sheath.", "External carotid is outside the sheath; ansa lies on/within its surface."], "pearl": "Carotid sheath: CCA/ICA (medial), IJV (lateral), CN X (posterior between them).", "set": "neck"}, {"id": "G-287", "stem": "During thyroidectomy the superior thyroid artery is ligated, taking care to protect the nerve that runs next to it. Which muscle does this nerve supply?", "opts": ["Thyroarytenoid", "Lateral cricoarytenoid", "Posterior cricoarytenoid", "Cricothyroid", "Aryepiglotticus"], "ans": 3, "why": "The external branch of the superior laryngeal nerve accompanies the superior thyroid artery toward the upper pole of the thyroid and supplies the cricothyroid muscle.", "wrong": ["Supplied by the recurrent laryngeal nerve.", "Supplied by the recurrent laryngeal nerve.", "Supplied by the recurrent laryngeal nerve.", "", "Supplied by the recurrent laryngeal nerve."], "pearl": "Ligate superior thyroid a. close to the gland to spare the external laryngeal n. (cricothyroid).", "set": "neck"}, {"id": "G-264", "stem": "A 12-year-old girl has a tender swelling in the anterior neck just above the thyroid notch. The physician says there is a cyst in the tract along which the thyroid gland descended. All tract tissue between which two structures must be removed?", "opts": ["Left lobe of thyroid gland and tonsillar fossa", "Right lobe of thyroid gland and epiglottis", "Right lobe of thyroid gland and hyoid bone", "Thyroid isthmus and foramen cecum", "Thyroid isthmus and piriform recess"], "ans": 3, "why": "The thyroid descends from the foramen cecum at the tongue base, passing near the hyoid, to its final position at the isthmus. A thyroglossal duct cyst is treated by removing the whole tract between these two points (including part of the hyoid).", "wrong": ["The tonsillar fossa is unrelated to the midline thyroid tract.", "The epiglottis is not on the descent path.", "The tract is midline and ends at the isthmus, not a lateral lobe.", "", "The piriform recess is lateral and relates to branchial anomalies."], "pearl": "Midline neck mass that moves with swallowing/tongue protrusion = thyroglossal duct cyst (Sistrunk procedure).", "set": "neck"}, {"id": "BC-3", "stem": "A 31-year-old man with a penetrating injury to the posterior triangle of the neck cannot shrug his shoulder or turn his head to the opposite side. Which of the following nerves is most likely damaged?", "opts": ["Trigeminal nerve", "Facial nerve", "Glossopharyngeal nerve", "Accessory nerve", "Hypoglossal nerve"], "ans": 3, "why": "The spinal accessory nerve crosses the posterior cervical triangle superficially and innervates the trapezius (shoulder shrug) and sternocleidomastoid (turns head to the opposite side).", "wrong": ["Trigeminal nerve supplies facial sensation and muscles of mastication.", "Facial nerve supplies muscles of facial expression.", "CN IX supplies stylopharyngeus and posterior-tongue taste.", "", "Hypoglossal nerve moves the tongue."], "pearl": "CN XI is superficial in the posterior triangle - easily injured (e.g., lymph node biopsy).", "set": "neck"}, {"id": "G-127", "stem": "A 34-year-old woman has had hoarseness for 3 months. Imaging shows a laryngeal cancer with no spread, in an area with very little lymphatic drainage. Where is the tumor most likely located?", "opts": ["Anterior commissure of the vocal ligaments", "Interarytenoid fold", "Laryngeal ventricle", "Cricothyroid ligament", "Middle segment of the vocal cord"], "ans": 4, "why": "The true vocal folds have almost no lymphatic vessels, so glottic cancers stay local for a long time and cause hoarseness early.", "wrong": ["Has more lymphatic drainage than the mid-fold.", "The supraglottic area drains well to the superior deep cervical nodes.", "The supraglottic ventricle has rich lymphatic drainage.", "The subglottic region drains to the pretracheal and inferior deep cervical nodes.", ""], "pearl": "Vocal fold = lymphatic watershed: supraglottic drains to superior deep cervical nodes, subglottic to pretracheal/inferior deep cervical nodes.", "set": "larynx"}, {"id": "G-93", "stem": "A 56-year-old woman has a complete thyroidectomy. After anesthesia her voice is hoarse for 3 weeks, and examination shows her right vocal fold is permanently adducted. Surgical injury to the nerve supply of which muscle most likely explains this vocal fold position?", "opts": ["Aryepiglottic", "Posterior cricoarytenoid", "Thyroarytenoid", "Transverse arytenoids", "Vocalis"], "ans": 1, "why": "The posterior cricoarytenoid is the only muscle that abducts the vocal fold, and it is supplied by the recurrent laryngeal nerve. If it is paralyzed, the adductors win and the fold stays near the midline.", "wrong": ["Narrows the laryngeal inlet; it does not abduct the vocal fold.", "", "Relaxes and shortens the vocal fold; losing it would not leave the fold adducted.", "Adducts the arytenoids; losing it would not cause fixed adduction.", "Adjusts vocal fold tension; it is not an abductor."], "pearl": "Posterior cricoarytenoid = the only abductor ('pull apart') and is supplied by the RLN.", "set": "larynx"}, {"id": "G-109", "stem": "A 54-year-old man is having a bilateral thyroidectomy. If a certain nerve is injured on both sides, the muscles that open the airway could be paralyzed, and he could suffocate unless he is intubated or has a surgical airway. Which pair of muscles opens the airway?", "opts": ["Cricothyroids", "Posterior cricoarytenoids", "Arytenoids", "Thyroarytenoids", "Lateral cricoarytenoids"], "ans": 1, "why": "The posterior cricoarytenoids are the only muscles that abduct the vocal folds and widen the rima glottidis. Bilateral RLN injury paralyzes them and can cause airway obstruction.", "wrong": ["They tense the vocal folds (external laryngeal n.); they do not abduct.", "", "They adduct the arytenoids and close the posterior glottis.", "They relax and adduct the vocal folds."
