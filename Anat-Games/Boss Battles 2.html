<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Boss Battles 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=Silkscreen&display=swap">
<style>
/* Deliberately single-theme: a night-arena world. Every color is painted explicitly. */
:root{
  --ground:#17142B; --ground2:#120F22; --panel:#221D3F; --sunk:#1B1734; --line:#3A3366;
  --ink:#EEEAFB; --muted:#A39CC8;
  --p1:#FFB341; --p2:#3DD6C6; --boss:#FF4F8B; --heal:#6BD88E; --bad:#FF6B5B;
  --hy-bg:#3A3212; --hy-line:#D9AE2B; --hy-ink:#F7E6A6;
  --display:"Chakra Petch","Arial Narrow",sans-serif;
  --pix:"Silkscreen","Courier New",monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font:15px/1.55 var(--body);padding-inline:16px;padding-block:16px 40px;
  background-image:radial-gradient(ellipse 80% 50% at 50% 0%, #2A2352 0%, transparent 70%);background-attachment:fixed}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.pix{font-family:var(--pix);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.brand b{color:var(--boss)}

/* ---------- setup ---------- */
.setup{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:start}
.hero{display:flex;flex-direction:column;gap:14px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,6.4vw,74px);line-height:.92;margin:0;text-transform:uppercase;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--boss)}
.hero p{margin:0;color:var(--muted);max-width:54ch}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.foe{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:8px;display:flex;gap:8px;align-items:center}
.foe svg{width:44px;height:44px;flex:none}
.foe b{display:block;font-family:var(--display);font-size:13.5px;line-height:1.15}
.foe span{font-family:var(--pix);font-size:9.5px;color:var(--muted);text-transform:uppercase}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:6px;max-width:58ch}
.rules li{display:grid;grid-template-columns:92px 1fr;gap:10px;border-top:1px dashed var(--line);padding-top:6px;font-size:14px}
.rules b{font-family:var(--pix);font-size:11px;color:var(--p1);font-weight:400;padding-top:3px}
.form{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:16px}
.fl{display:flex;flex-direction:column;gap:6px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names input{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:9px 10px;border-left:5px solid var(--p1)}
.names input#p2name{border-left-color:var(--p2)}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;min-width:72px;background:var(--sunk);border:0;border-right:1px solid var(--line);padding:9px 8px;font-size:14px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:600}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.picker button{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:7px 9px;text-align:left;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.picker button[aria-pressed="true"]{border-color:var(--boss);box-shadow:inset 3px 0 0 var(--boss)}
.picker em{font-style:normal;font-family:var(--pix);font-size:10px;color:var(--muted)}
.go{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase;background:var(--boss);color:#1a0610;border:0;border-radius:4px;padding:11px 16px}

/* ---------- arena ---------- */
.arena{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:12px;align-items:stretch}
.hero-card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;transition:box-shadow .2s,opacity .3s}
.hero-card.p1{--c:var(--p1)} .hero-card.p2{--c:var(--p2)}
.hero-card.on{box-shadow:0 0 0 2px var(--c),0 0 24px -4px var(--c)}
.hero-card.ko{opacity:.45}
.hero-card .nm{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1;color:var(--c)}
.hero-card .role{font-family:var(--pix);font-size:10px;color:var(--muted);text-transform:uppercase}
.bar{height:14px;background:var(--ground2);border:1px solid var(--line);border-radius:3px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.bar.hp i{background:var(--heal)} .bar.hp.low i{background:var(--bad)}
.bar.boss{height:18px} .bar.boss i{background:linear-gradient(90deg,#B8265A,var(--boss))}
.hpnum{font-family:var(--pix);font-size:11px;display:flex;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.abil{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.abil button{flex:1;min-width:90px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:6px 6px;font-size:12.5px;line-height:1.2}
.abil button small{display:block;font-family:var(--pix);font-size:9px;color:var(--muted)}
.abil button:disabled{opacity:.35;cursor:not-allowed}
.abil button:not(:disabled):hover{border-color:var(--c)}
.ko-tag{position:absolute;top:10px;right:10px;font-family:var(--pix);font-size:12px;color:var(--bad)}
.boss-card{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center}
.boss-card .bn{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;line-height:1;letter-spacing:.03em}
.boss-card .bt{font-size:12.5px;color:var(--muted)}
.beast{height:150px;display:grid;place-items:center}
.beast svg{display:block;height:150px;width:auto;max-width:100%;overflow:visible}
.beast.hit svg{animation:hit .45s}
.beast.atk svg{animation:atk .5s}
.beast.dead svg{animation:dead .9s forwards}
.beast.gone svg{transform:translateY(20px) scale(.6);opacity:.1;filter:grayscale(1)}
@keyframes hit{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px);filter:brightness(2.2)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
@keyframes atk{0%,100%{transform:scale(1)}40%{transform:scale(1.14) translateY(8px)}}
@keyframes dead{to{transform:translateY(20px) scale(.6);opacity:.1;filter:grayscale(1)}}
.rage{font-family:var(--pix);font-size:10.5px;color:var(--boss)}
.dmg{position:absolute;font-family:var(--display);font-weight:700;font-size:30px;pointer-events:none;animation:float 1s forwards;text-shadow:0 2px 0 #000}
@keyframes float{from{transform:translateY(0);opacity:1}to{transform:translateY(-44px);opacity:0}}
.timer{height:6px;background:var(--ground2);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--muted);transform-origin:left;transition:transform .25s linear}
.timer.warn i{background:var(--bad)}
.log{font-family:var(--pix);font-size:11px;color:var(--muted);min-height:16px;text-transform:uppercase;letter-spacing:.04em}
.log b{color:var(--ink);font-weight:400}

.qpanel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--pix);font-size:10.5px;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid var(--line)}
.chip.p1{background:var(--p1);color:#231500;border-color:var(--p1)}
.chip.p2{background:var(--p2);color:#032421;border-color:var(--p2)}
.chip.dash{border-style:dashed}
.stem{margin:0;font-size:16px;line-height:1.62;max-width:76ch}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:8px 12px}
.opt .lt{font-family:var(--display);font-weight:700;font-size:17px;width:28px;height:28px;border:1.5px solid var(--line);border-radius:3px;display:grid;place-items:center;transform:rotate(45deg)}
.opt .lt span{transform:rotate(-45deg)}
.opt:not(:disabled):hover{border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.out{opacity:.3;text-decoration:line-through}
.opt.right{border-color:var(--heal);background:#193326}
.opt.right .lt{background:var(--heal);border-color:var(--heal);color:#07210F}
.opt.wrong{border-color:var(--bad);background:#3A1A22}
.opt.wrong .lt{background:var(--bad);border-color:var(--bad);color:#2a0606}
.verdict{border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--sunk)}
.verdict h3{margin:0;font-family:var(--display);font-size:22px;text-transform:uppercase}
.verdict.good h3{color:var(--heal)} .verdict.bad h3{color:var(--bad)}
.verdict p{margin:0;max-width:76ch}
.why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--muted)}
.why b{color:var(--ink);font-family:var(--pix);font-weight:400;margin-right:6px}
.hy{background:var(--hy-bg);border:1.5px solid var(--hy-line);color:var(--hy-ink);border-radius:4px;padding:9px 12px;font-size:14px}
.hy b{display:block;font-family:var(--pix);font-size:10px;font-weight:400;letter-spacing:.1em;text-transform:uppercase}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--ground);border:0;border-radius:4px;padding:10px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
kbd{font-family:var(--pix);font-size:10px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--muted)}

/* ---------- interlude / end ---------- */
.interlude{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px;display:grid;grid-template-columns:180px 1fr;gap:22px;align-items:center}
.interlude svg{width:100%;height:auto}
.interlude h2,.end h2{font-family:var(--display);font-weight:700;font-size:clamp(32px,5vw,54px);line-height:.95;margin:0 0 8px;text-transform:uppercase;text-wrap:balance}
.interlude p{margin:0 0 12px;color:var(--muted);max-width:60ch}
.path{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.path span{font-family:var(--pix);font-size:10px;padding:3px 7px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
.path span.done{color:var(--heal);border-color:var(--heal)}
.path span.now{color:var(--boss);border-color:var(--boss)}
.end{display:flex;flex-direction:column;gap:18px}
.end h2.win{color:var(--heal)} .end h2.lose{color:var(--bad)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.p1{--c:var(--p1)} .card.p2{--c:var(--p2)}
.big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;color:var(--c)}
.missed{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.missed li{font-size:13.5px;border-left:3px solid var(--line);padding-left:9px}
.missed li span{display:block;font-family:var(--pix);font-size:9.5px;color:var(--muted);text-transform:uppercase}
.foot{font-family:var(--pix);font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;text-transform:uppercase}
@media (max-width:860px){
  .setup,.cards,.interlude{grid-template-columns:1fr}
  .interlude svg{max-width:160px}
  .arena{grid-template-columns:1fr 1fr}
  .boss-card{grid-column:1 / -1;order:-1}
  .beast{height:110px}.beast svg{height:110px}
  .names,.picker{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- return to hub (added Sep 22, 2026) ---------- */
.tohub{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  font-family:var(--mono,var(--pix,ui-monospace,Menlo,monospace));font-size:11px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;line-height:1;
  transition:color .12s,border-color .12s,background .12s}
.tohub:hover{color:var(--ink);border-color:var(--muted);background:var(--sunk)}
.tohub:focus-visible{outline:2px solid var(--p2,var(--p1,currentColor));outline-offset:2px}
.tohub svg{width:13px;height:13px;flex:none;transition:transform .12s}
.tohub:hover svg{transform:translateX(-2px)}
@media print{.tohub{display:none}}
</style>

<script>
const DECK=2;
const SETS={"neck": "The Neck", "face": "Face, Scalp & ITF", "cranial": "Skull, Meninges & Foramina", "orbit": "Orbit & Eye Reflexes", "nasal_oral": "Nose, Pharynx, Palate & Oral Cavity", "larynx": "Larynx", "cn": "Cranial Nerve Lesions"};
const Q=[{"id": "G-40", "stem": "A 55-year-old woman has a tumor at the base of the skull that decreases tear production. Which nerve is most likely injured?", "opts": ["Chorda tympani", "Deep petrosal", "Greater petrosal", "Lesser petrosal", "Nasociliary"], "ans": 2, "why": "The greater petrosal nerve (CN VII) carries preganglionic parasympathetics to the pterygopalatine ganglion, whose postganglionic fibers drive lacrimal secretion.", "wrong": ["Supplies submandibular/sublingual glands and anterior-tongue taste.", "Sympathetic; does not drive tear secretion.", "", "Parasympathetic to the parotid via the otic ganglion.", "Sensory to cornea, ethmoid sinuses and nose; not secretomotor."], "pearl": "Tears: CN VII → greater petrosal → nerve of pterygoid canal → pterygopalatine ganglion → zygomatic → lacrimal nerve.", "set": "cn"}, {"id": "G-232", "stem": "A 55-year-old woman is found unconscious and brought to the hospital with findings suggesting a ruptured aneurysm. Examination of the right eye shows ptosis, a dilated pupil, and the eye deviated inferolaterally. Angiography most likely shows a hematoma compressing which structure?", "opts": ["Oculomotor nerve", "Optic nerve", "Facial nerve", "Ciliary ganglion", "Superior cervical ganglion"], "ans": 0, "why": "CN III supplies levator palpebrae, most extraocular muscles, and parasympathetics to the sphincter pupillae. Its compression leaves the lateral rectus and superior oblique unopposed (down and out), removes lid elevation (ptosis), and leaves the dilator pupillae unopposed (mydriasis).", "wrong": ["", "CN II lesion causes visual loss, not ptosis or a down-and-out eye.", "CN VII paralyzes facial muscles; it would cause inability to close the eye, not ptosis.", "Ciliary ganglion lesion gives a dilated pupil but no ptosis or eye deviation.", "Sympathetic lesion gives mild ptosis with a constricted pupil (Horner)."], "pearl": "Down and out + ptosis + blown pupil = CN III compression (think PComm/aneurysm or uncal herniation).", "set": "cn"}, {"id": "G-260", "stem": "During a cranial nerve exam, a 49-year-old patient's uvula deviates to the right. The gag reflex is weaker when the left pharyngeal mucosa is touched than when the right is touched. Which nerve is most likely injured?", "opts": ["Left vagus", "Left glossopharyngeal", "Right vagus", "Left V3", "Right glossopharyngeal"], "ans": 0, "why": "A vagal lesion weakens the ipsilateral levator veli palatini, so the uvula is pulled toward the intact side (away from the lesion). The motor limb of the gag reflex is also weakened on the left.", "wrong": ["", "A CN IX lesion reduces gag sensation but does not deviate the uvula.", "Right vagus lesion would deviate the uvula to the left.", "V3 does not control the uvula or the gag reflex.", "Right CN IX would weaken the right-sided gag and not deviate the uvula."], "pearl": "Uvula deviates AWAY from the side of a CN X lesion.", "set": "cn"}, {"id": "G-297", "stem": "A 20-year-old man with a recent open fracture of the right temporal bone develops fever and a tender temporal swelling. Examination suggests neuritis of the nerve in the distal part of the facial canal. Which function is likely spared?", "opts": ["Taste from the anterior two thirds of the tongue", "Movements of the right side of the face", "Secretions from the submandibular gland", "Secretions from the sublingual gland", "Secretions from the lacrimal gland"], "ans": 4, "why": "The greater petrosal nerve (lacrimal secretomotor) leaves CN VII at the geniculate ganglion, proximal to the distal facial canal. A distal lesion therefore spares tearing but affects the chorda tympani (taste, submandibular/sublingual secretion) and facial motor fibers.", "wrong": ["Chorda tympani leaves in the distal canal, so taste is affected.", "The motor fibers run through the entire canal and are affected.", "Submandibular secretion rides with the chorda tympani and is affected.", "Sublingual secretion rides with the chorda tympani and is affected.", ""], "pearl": "Level of CN VII lesion: geniculate (lacrimation) -> stapedius (hyperacusis) -> chorda tympani (taste/saliva) -> stylomastoid (face only).", "set": "cn"}, {"id": "G-275", "stem": "A 27-year-old woman has unilateral facial paralysis. MRI shows a small tumor at the internal acoustic meatus. Which cranial nerve is most likely compressed?", "opts": ["V", "VI", "VII", "IX", "X"], "ans": 2, "why": "The internal acoustic meatus transmits CN VII and CN VIII; of these, only CN VII moves the facial muscles.", "wrong": ["CN V exits via SOF, rotundum, and ovale.", "CN VI enters the cavernous sinus and SOF.", "", "CN IX exits via the jugular foramen.", "CN X exits via the jugular foramen."], "pearl": "Facial palsy + hearing loss = internal acoustic meatus / CP angle lesion.", "set": "cn"}, {"id": "G-246", "stem": "An 87-year-old woman has a vestibular schwannoma removed from the internal acoustic meatus. Afterwards the right corner of her mouth droops, she cannot close her right eye, and food collects in her right oral vestibule. Which cranial nerve was injured?", "opts": ["IX", "X", "VII", "V2", "V3"], "ans": 2, "why": "CN VII travels with CN VIII through the internal acoustic meatus and supplies the muscles of facial expression, including orbicularis oculi (eye closure) and buccinator (keeps food out of the vestibule).", "wrong": ["CN IX supplies stylopharyngeus and posterior tongue sensation.", "CN X supplies palate, pharynx, and larynx.", "", "V2 is purely sensory to the midface.", "V3 moves the jaw; it does not close the eye or move the mouth corner."], "pearl": "Food pocketing in the cheek = buccinator weakness = CN VII (buccal branch).", "set": "cn"}, {"id": "G-177", "stem": "A 32-year-old man presents with nausea, vomiting, and severe headache. MRI reveals an acoustic neuroma. Which of the following nerves is most likely compressed by the tumor?", "opts": ["Facial", "Oculomotor", "Vagus", "Hypoglossal", "Abducens"], "ans": 0, "why": "An acoustic neuroma (vestibular schwannoma) arises on CN VIII in the internal acoustic meatus/cerebellopontine angle, where CN VII runs alongside it, so the facial nerve is the neighboring nerve most often compressed.", "wrong": ["", "Emerges from the midbrain, far above the CPA.", "Exits the jugular foramen, below the CPA; only affected by very large tumors.", "Exits the hypoglossal canal, not near the internal acoustic meatus.", "Runs up the clivus; not typically compressed by a CPA tumor."], "pearl": "CN VII and VIII share the internal acoustic meatus -> acoustic neuroma affects both (then V with growth).", "set": "cn"}, {"id": "LC-35", "stem": "A 68-year-old man reports hyperacusis, an increased sensitivity to loud, low-frequency sounds such as subwoofer bass. Audiometry shows normal hearing for his age. Which cranial nerve is most likely involved?", "opts": ["Facial nerve", "Vestibulocochlear nerve", "Glossopharyngeal nerve", "Vagus nerve", "Hypoglossal nerve"], "ans": 0, "why": "CN VII supplies the stapedius, which damps stapes movement in response to loud sounds. When stapedius is paralyzed, sounds feel abnormally loud (hyperacusis).", "wrong": ["", "Normal audiometry indicates CN VIII is intact.", "CN IX supplies only stylopharyngeus; no acoustic reflex role.", "CN X has no role in the acoustic reflex.", "CN XII palsy causes tongue deviation, not hyperacusis."], "pearl": "Hyperacusis with facial palsy = lesion proximal to the nerve to stapedius (CN VII).", "set": "cn"}, {"id": "G-258", "stem": "After a small brainstem stroke, a 64-year-old diabetic woman has uncoordinated swallowing and difficulty with phonation. Dysfunction of the responsible cranial nerve will most likely also produce which symptom?", "opts": ["Weakness/paralysis of muscles of mastication on one side", "Weakness/paralysis of muscles of facial expression on one side", "Hearing loss and balance problems", "Decreased/absent sensation in the oropharynx", "Decreased/absent cough reflex"], "ans": 4, "why": "CN X supplies the pharyngeal and laryngeal muscles, so its lesion impairs swallowing and phonation. CN X is also both limbs of the cough reflex, so cough is reduced.", "wrong": ["Mastication is V3.", "Facial expression is CN VII.", "Hearing and balance are CN VIII.", "Oropharyngeal sensation is mainly CN IX.", ""], "pearl": "CN X: dysphagia, dysphonia, uvula deviation away from lesion, lost cough reflex.", "set": "cn"}, {"id": "LH-44", "stem": "During a difficult delivery, obstetric forceps are misapplied at the infant's right stylomastoid foramen and crush its contents at the opening of the foramen. Which of the following ipsilateral deficits is the baby most likely to have?", "opts": ["Reduced blood flow to the inner ear", "No sensation in the external acoustic meatus", "Inability to close the eyelids", "Lack of taste on the body of the tongue", "Inability to tense the eardrum"], "ans": 2, "why": "The facial nerve leaves the skull at the stylomastoid foramen, which is superficial in newborns because the mastoid process is undeveloped. Injury there paralyzes the muscles of facial expression, including orbicularis oculi, so the eye cannot close.", "wrong": ["Inner ear is supplied by the labyrinthine artery via the internal acoustic meatus", "Meatal skin is supplied mainly by V3 and CN X; unaffected", "", "Chorda tympani leaves CN VII above the stylomastoid foramen, so taste is spared", "Tensor tympani is supplied by CN V3"], "pearl": "Stylomastoid foramen lesion = facial muscle paralysis only (taste, lacrimation, stapedius spared). Newborns lack a mastoid process to protect it.", "set": "cn"}, {"id": "LC-15", "stem": "A 12-year-old boy fractures the floor of the right middle cranial fossa in a car accident. Examination shows loss of emotional tearing on the same side. Which nerve is most likely damaged?", "opts": ["Greater petrosal nerve", "Lesser petrosal nerve", "Deep petrosal nerve", "Lacrimal nerve", "Chorda tympani nerve"], "ans": 0, "why": "Tearing depends on preganglionic parasympathetic fibers of CN VII carried by the greater petrosal nerve. It leaves the geniculum and runs along the middle cranial fossa floor toward the pterygoid canal and pterygopalatine ganglion, so it is easily hurt in fractures there.", "wrong": ["", "Carries CN IX parasympathetics to the otic ganglion for the parotid.", "Sympathetic fibers; does not drive lacrimation.", "Lies in the orbit, not injured by a middle cranial fossa fracture.", "Supplies submandibular/sublingual glands and anterior tongue taste."], "pearl": "Lacrimation pathway: CN VII → greater petrosal → n. of pterygoid canal → pterygopalatine ganglion → lacrimal gland.", "set": "nasal_oral"}, {"id": "BH-9", "stem": "A young girl complains of dryness of the nose and palate. This would indicate a lesion of which of the following ganglia?", "opts": ["Nodose ganglion", "Otic ganglion", "Pterygopalatine ganglion", "Submandibular ganglion", "Ciliary ganglion"], "ans": 2, "why": "Postganglionic parasympathetic fibers from the pterygopalatine ganglion supply the mucous glands of the nasal cavity and palate (and the lacrimal gland).", "wrong": ["Nodose (inferior vagal) ganglion is sensory.", "Otic ganglion supplies the parotid gland.", "", "Submandibular ganglion supplies submandibular and sublingual glands.", "Ciliary ganglion supplies the ciliary muscle and sphincter pupillae."], "pearl": "Pterygopalatine ganglion = 'hay fever ganglion': lacrimal, nasal, palatal glands.", "set": "nasal_oral"}, {"id": "LC-4", "stem": "A 10-year-old boy undergoes bilateral palatine tonsillectomy. Postoperatively he has no gag reflex when the right posterior tongue is stimulated and reports abnormal taste in the back of his mouth. The soft palate elevates symmetrically. No other deficits are noted. What cranial nerve was damaged?", "opts": ["Trigeminal nerve", "Facial nerve", "Glossopharyngeal nerve", "Vagus nerve", "Hypoglossal nerve"], "ans": 2, "why": "The tonsillar and lingual branches of CN IX lie in the tonsillar bed and are vulnerable during tonsillectomy. CN IX carries taste/general sensation from the posterior third of the tongue and forms the afferent limb of the gag reflex.", "wrong": ["CN V (lingual n.) gives general sensation to the anterior two thirds, not posterior tongue.", "CN VII (chorda tympani) carries anterior two-thirds taste; not part of gag reflex.", "", "CN X is the efferent gag limb; symmetric palate elevation shows it is intact.", "CN XII is purely motor to tongue; no taste or gag role."], "pearl": "Tonsillectomy + lost gag afferent + posterior tongue taste loss = CN IX.", "set": "nasal_oral"}, {"id": "G-254", "stem": "A 55-year-old man with a history of cocaine use has severe epistaxis from Kiesselbach's area. Anastomoses between which arteries are involved?", "opts": ["Descending palatine and ascending pharyngeal", "Posterior superior alveolar and accessory meningeal", "Lateral branches of posterior ethmoidal and middle meningeal", "Branches of sphenopalatine, superior labial, and anterior ethmoidal", "Descending palatine and tonsillar branches of the ascending pharyngeal"], "ans": 3, "why": "Kiesselbach's plexus on the anterior septum is formed by the sphenopalatine, superior labial (facial), anterior ethmoidal, and greater palatine arteries. It is the most common site of epistaxis.", "wrong": ["These vessels lie in the palate and pharynx, not the anterior septum.", "The PSA runs in the maxilla; the accessory meningeal serves the ITF/cranium.", "The middle meningeal artery is intracranial and does not reach the septum.", "", "These supply the palate and tonsil, not the anterior septum."], "pearl": "Kiesselbach (anterior septum) = most epistaxis; posterior bleeds = sphenopalatine a.", "set": "nasal_oral"}, {"id": "G-20", "stem": "A 34-year-old man has severe headaches, dizziness, and vomiting. Imaging reveals a tumor at the hypoglossal canal. Which muscle is most likely affected?", "opts": ["Geniohyoid", "Mylohyoid", "Palatoglossus", "Genioglossus", "Thyrohyoid"], "ans": 3, "why": "The hypoglossal canal transmits CN XII, which supplies the genioglossus (and other tongue muscles except palatoglossus).", "wrong": ["Supplied by C1 fibers that join CN XII only after it leaves the canal.", "Supplied by the nerve to mylohyoid (V3).", "Supplied by the vagus (pharyngeal plexus), the one tongue muscle not CN XII.", "", "Supplied by C1 fibers traveling with CN XII below the skull."], "pearl": "All tongue muscles = CN XII except palatoglossus (CN X); C1 hitchhikes on XII to geniohyoid and thyrohyoid.", "set": "nasal_oral"}, {"id": "G-54", "stem": "A 21-year-old man has severe epistaxis from the nasal septum. This area, Kiesselbach's (Little's) area, involves mostly anastomoses between which arteries?", "opts": ["Ascending palatine and ascending pharyngeal", "Posterior superior alveolar and accessory meningeal", "Lateral branches of posterior ethmoidal and middle meningeal", "Septal branches of the sphenopalatine and superior labial", "Descending palatine and tonsillar branches of the pharyngeal"], "ans": 3, "why": "Kiesselbach's plexus on the anterior septum is fed by anterior ethmoidal, sphenopalatine, greater palatine and superior labial arteries, with septal sphenopalatine and superior labial branches the main contributors.", "wrong": ["Pharyngeal/palatine vessels that do not reach the anterior septum.", "Supply maxillary teeth and cranial structures, not the septum.", "Middle meningeal is intracranial; posterior ethmoidal supplies the upper posterior nose.", "", "Supply palate and tonsil, not the anterior septum."], "pearl": "Anterior epistaxis = Kiesselbach's plexus; posterior epistaxis = sphenopalatine artery.", "set": "nasal_oral"}, {"id": "LC-10", "stem": "A 24-year-old man with chronic maxillary sinusitis has a soft-tissue mass in the roof of the right maxillary sinus, which is biopsied endoscopically. Postoperatively he has paresthesia and numbness of the right lower eyelid and upper lip. Which nerve was most likely damaged?", "opts": ["First division of trigeminal nerve", "Second division of trigeminal nerve", "Third division of trigeminal nerve", "Zygomatic branch of facial nerve", "Buccal branch of facial nerve"], "ans": 1, "why": "The infraorbital nerve, the continuation of V2, runs in the roof of the maxillary sinus (orbital floor) and supplies the lower eyelid, cheek, and upper lip.", "wrong": ["V1 supplies the forehead and upper eyelid and does not course through the maxillary sinus.", "", "V3 supplies the lower lip and chin; no branch runs in the sinus roof.", "Facial nerve branches are motor only and cause no numbness.", "Facial nerve branches are motor only and cause no numbness."], "pearl": "Maxillary sinus roof / orbital floor injury = infraorbital nerve (V2): numb lower lid, cheek, upper lip.", "set": "nasal_oral"}, {"id": "BC-8", "stem": "After radical resection of a primary tongue tumor, a 72-year-old patient has lost general sensation on the anterior two-thirds of the tongue. This is most likely due to injury to branches of which of the following nerves?", "opts": ["Trigeminal nerve", "Facial nerve", "Glossopharyngeal nerve", "Vagus nerve", "Hypoglossal nerve"], "ans": 0, "why": "General sensation of the anterior two-thirds of the tongue travels in the lingual nerve, a branch of V3.", "wrong": ["", "Facial nerve (chorda tympani) carries only taste to the anterior 2/3.", "CN IX supplies the posterior 1/3 of the tongue.", "Vagus supplies the epiglottic region via the internal laryngeal nerve.", "Hypoglossal is purely motor to tongue muscles."], "pearl": "Anterior 2/3 tongue: general sensation = V3 (lingual); taste = VII (chorda tympani).", "set": "nasal_oral"}, {"id": "G-198", "stem": "A 22-year-old woman has a 2-week sinus infection with focal inflammation and mucosal edema in the inferior nasal meatus. Drainage from which structure is most likely obstructed?", "opts": ["Anterior ethmoidal air cells", "Frontonasal duct", "Maxillary sinus", "Middle ethmoidal air cells", "Nasolacrimal duct"], "ans": 4, "why": "The nasolacrimal duct is the only structure that opens into the inferior meatus, so edema there blocks tear drainage.", "wrong": ["Open into the middle meatus (ethmoidal infundibulum).", "Opens into the middle meatus via the ethmoidal infundibulum.", "Opens into the middle meatus via the hiatus semilunaris.", "Open onto the ethmoidal bulla in the middle meatus.", ""], "pearl": "Inferior meatus receives ONLY the nasolacrimal duct.", "set": "nasal_oral"}, {"id": "G-90", "stem": "A 54-year-old man has a carcinoma in his nasal cavity. In which location would the tumor block the opening of the maxillary sinus?", "opts": ["Inferior meatus", "Middle meatus", "Superior meatus", "Nasopharynx", "Sphenoethmoidal recess"], "ans": 1, "why": "The maxillary sinus drains into the semilunar hiatus, which lies in the middle meatus under the middle concha.", "wrong": ["The inferior meatus receives the nasolacrimal duct.", "", "The superior meatus drains the posterior ethmoidal cells.", "The nasopharynx receives the auditory tube, not the sinuses.", "The sphenoethmoidal recess drains the sphenoid sinus."], "pearl": "Middle meatus (semilunar hiatus) drains the frontal, maxillary and anterior ethmoidal sinuses; the inferior meatus drains the nasolacrimal duct.", "set": "nasal_oral"}, {"id": "G-193", "stem": "A 45-year-old woman has dysphagia, nighttime coughing, repeated chest infections, and a palpable neck swelling. Imaging reveals a persistent pharyngeal pouch (diverticulum). Between which muscles is this pouch most likely located?", "opts": ["Between styloglossus and stylopharyngeus", "Between palatoglossal arch and median glossoepiglottic fold", "Between upper and middle pharyngeal constrictors", "Between the cricopharyngeal and thyropharyngeal portions of the inferior pharyngeal constrictor", "Between the middle and inferior pharyngeal constrictors"], "ans": 3, "why": "A Zenker diverticulum herniates through Killian's triangle, the weak area between the thyropharyngeus and cricopharyngeus parts of the inferior constrictor.", "wrong": ["Not a gap in the pharyngeal wall where diverticula form.", "These are oral/oropharyngeal landmarks, not a muscular weak area.", "This gap transmits stylopharyngeus/CN IX; not the Zenker site.", "", "This gap transmits the internal laryngeal nerve; not the usual pouch site."], "pearl": "Zenker = Killian's triangle between thyropharyngeus and cricopharyngeus -> halitosis, regurgitation.", "set": "nasal_oral"}, {"id": "G-88", "stem": "A 45-year-old man has severe difficulty breathing. His mouth floor and pharynx are swollen and his airway is almost completely blocked; his lower jaw and upper neck are also swollen. A lower molar was pulled a week ago, and he has felt worse each day since. What is the most likely diagnosis?", "opts": ["Quinsy", "Torus palatinus", "Ankyloglossia", "Ranula", "Ludwig's angina"], "ans": 4, "why": "Ludwig's angina is a spreading infection of the submandibular and sublingual spaces, usually from a lower molar. It raises the floor of the mouth and can block the airway.", "wrong": ["Quinsy is a peritonsillar abscess that complicates tonsillitis, not a tooth infection.", "A benign bony growth on the hard palate; it causes no swelling or airway blockage.", "Tongue-tie: a short lingual frenulum present from birth.", "A mucous cyst in the floor of the mouth that is usually painless.", ""], "pearl": "Lower molar infection -> submandibular space -> Ludwig's angina -> airway threat.", "set": "nasal_oral"}, {"id": "G-247", "stem": "A 51-year-old man has left-sided hearing loss, poor balance, loss of taste, and drooling from the left side of his mouth. CT shows a tumor on the left side of the posterior cranial fossa. Where is the tumor located?", "opts": ["Foramen ovale", "Foramen rotundum", "Internal acoustic meatus", "Jugular foramen", "Superior orbital fissure"], "ans": 2, "why": "The internal acoustic meatus carries both CN VII (taste to the anterior tongue, facial muscles) and CN VIII (hearing and balance), so one lesion there explains all the findings.", "wrong": ["Foramen ovale carries V3, which gives jaw weakness and lower-face numbness.", "Foramen rotundum carries V2, which is sensory to the midface.", "", "Jugular foramen lesions affect IX, X, XI, not hearing or facial movement.", "The SOF lesion affects eye movement and V1 sensation."], "pearl": "Internal acoustic meatus = CN VII + VIII (+ labyrinthine artery).", "set": "cranial"}, {"id": "BH-42", "stem": "A 57-year-old man has fever, headache, nausea, and vomiting; imaging localizes an infection to the cavernous sinus. Which nerves would be unaffected by this condition?", "opts": ["Oculomotor nerves", "Abducens nerves", "Trochlear nerves", "Mandibular nerves", "Ophthalmic nerves"], "ans": 3, "why": "V3 leaves the trigeminal ganglion directly through the foramen ovale and does not travel in the cavernous sinus wall.", "wrong": ["CN III runs in the lateral wall of the sinus.", "CN VI runs through the middle of the sinus.", "CN IV runs in the lateral wall of the sinus.", "", "V1 runs in the lateral wall of the sinus."], "pearl": "Cavernous sinus: III, IV, V1, V2 (lateral wall) + VI and ICA (inside); NOT V3.", "set": "cranial"}, {"id": "BC-1", "stem": "A 27-year-old man presents with drooping of the upper eyelid (ptosis), a dilated pupil, and difficulty focusing on near objects. He also has an internal strabismus (medial deviation of the eye) and cannot look inferiorly when the eye is adducted. Which of the following is the most likely cause?", "opts": ["Lesion in the medulla", "Tumor in the optic canal", "Thrombosis in the cavernous sinus", "Lesion of the olfactory nerve", "Fracture of the foramen spinosum"], "ans": 2, "why": "The findings combine CN III (ptosis, mydriasis, lost accommodation), CN IV (can't look down in adduction), and CN VI (medial deviation) deficits. All three nerves travel through the cavernous sinus, so a single thrombosis there explains everything.", "wrong": ["The medulla houses nuclei for CN IX, X, and XII, not III, IV, VI.", "Optic canal tumor affects the optic nerve and ophthalmic artery.", "", "Olfactory nerve lesion causes anosmia only.", "Foramen spinosum fracture injures the middle meningeal artery."], "pearl": "Multiple ocular motor palsies (III, IV, VI) together = think cavernous sinus.", "set": "cranial"}, {"id": "G-26", "stem": "A 40-year-old man is unconscious after being hit in the head with a baseball. CT reveals a fractured pterion and an epidural hematoma. Branches of which artery are most likely injured?", "opts": ["External carotid", "Superficial temporal", "Maxillary", "Deep temporal", "Middle meningeal"], "ans": 4, "why": "The middle meningeal artery (from the maxillary artery) runs between the dura and the skull deep to the pterion; tearing it causes an epidural hematoma.", "wrong": ["Ends behind the mandible; does not run between dura and skull.", "Lies outside the skull in the scalp.", "Parent vessel lies in the infratemporal fossa, outside the cranium.", "Supply temporalis outside the skull; do not enter the cranial cavity.", ""], "pearl": "Pterion fracture → middle meningeal a. → epidural (biconvex) hematoma with lucid interval.", "set": "cranial"}, {"id": "BH-12", "stem": "A 25-year-old man hits his head on a concrete bridge wall in a car accident. CT shows rupture of the middle meningeal artery with the meninges intact. Blood leaking from this artery enters which of the following spaces?", "opts": ["Subarachnoid space", "Subdural space", "Epidural space", "Subpial space", "Cranial dural sinuses"], "ans": 2, "why": "The middle meningeal artery runs between the skull and the periosteal dura, so its rupture strips the dura from bone to form an epidural hematoma.", "wrong": ["Subarachnoid bleeding comes from cerebral vessels/aneurysms.", "Subdural hematoma comes from torn bridging veins.", "", "Subpial bleeding comes from small pial/brain vessels.", "Dural sinuses carry venous blood, not arterial leakage."], "pearl": "Pterion fracture -> middle meningeal a. -> epidural hematoma (lucid interval, biconvex).", "set": "cranial"}, {"id": "G-81", "stem": "A 16-year-old boy with severe facial acne has fever, confusion and drowsiness. Imaging shows cavernous sinus thrombosis. Which route most likely carried the infection into the cavernous sinus?", "opts": ["Carotid artery", "Mastoid emissary vein", "Middle meningeal artery", "Ophthalmic vein", "Parietal emissary vein"], "ans": 3, "why": "Veins around the nose drain through the angular vein into the superior ophthalmic vein, which empties straight into the cavernous sinus. These veins have no valves, so infection can travel backward into the sinus.", "wrong": ["The ICA passes through the sinus but is not a route for infection from the face.", "The mastoid emissary vein links scalp veins with the sigmoid sinus, not the face with the cavernous sinus.", "The middle meningeal artery lies between dura and bone and does not drain the face.", "", "The parietal emissary vein connects scalp veins to the superior sagittal sinus."], "pearl": "Danger triangle of face -> angular v. -> superior ophthalmic v. -> cavernous sinus (valveless veins).", "set": "cranial"}, {"id": "G-42", "stem": "A 35-year-old woman has cavernous sinus thrombosis resulting from a facial infection. What is the most direct route for spread of infection from the face to the cavernous sinus?", "opts": ["Pterygoid venous plexus", "Superior ophthalmic vein", "Frontal venous plexus", "Basilar venous plexus", "Parietal emissary vein"], "ans": 1, "why": "The facial vein in the danger triangle communicates with the superior ophthalmic vein, which drains straight into the cavernous sinus.", "wrong": ["Reaches the sinus only indirectly via the inferior ophthalmic vein/emissary veins.", "", "Does not connect directly to the cavernous sinus.", "Links the inferior petrosal sinuses to the vertebral venous plexus.", "Connects scalp veins to the superior sagittal sinus, not cavernous."], "pearl": "Danger triangle → facial v. → superior ophthalmic v. (valveless) → cavernous sinus.", "set": "cranial"}, {"id": "LH-26", "stem": "A 36-year-old man flies over the handlebars of his motorcycle without a helmet and strikes his head. He is alert but has a clear nasal discharge that tests positive for glucose. The patient most likely has a fracture of which of the following bones?", "opts": ["Ethmoid", "Vomer", "Sphenoid", "Maxilla", "Frontal"], "ans": 0, "why": "Glucose-positive clear rhinorrhea is CSF. The cribriform plate of the ethmoid separates the anterior cranial fossa from the nasal cavity, so its fracture lets CSF leak from the nose.", "wrong": ["", "Forms the posteroinferior nasal septum; does not border the cranial cavity", "A sphenoid fracture would drain CSF via the sphenoid sinus but is less typical than cribriform injury", "Does not border the cranial cavity", "Frontal sinus injury can leak CSF, but the classic site of CSF rhinorrhea is the cribriform plate"], "pearl": "CSF rhinorrhea (+ anosmia) = cribriform plate of ethmoid fracture.", "set": "cranial"}, {"id": "BH-44", "stem": "A 59-year-old woman with pain at the side of her skull has a large lesion in the internal auditory meatus on CT. This condition may progress to damage which pair of structures?", "opts": ["Vagus and glossopharyngeal nerves", "Internal carotid and vertebral arteries", "Internal jugular vein and trigeminal nerve", "Facial and vestibulocochlear nerves", "Hypoglossal and accessory nerves"], "ans": 3, "why": "The internal acoustic meatus transmits CN VII and CN VIII (with the labyrinthine artery).", "wrong": ["CN IX and X exit via the jugular foramen.", "ICA uses the carotid canal; vertebral uses the foramen magnum.", "IJV uses the jugular foramen; CN V divisions use SOF/rotundum/ovale.", "", "CN XII uses the hypoglossal canal; CN XI the jugular foramen."], "pearl": "Internal acoustic meatus = CN VII + VIII (vestibular schwannoma).", "set": "cranial"}, {"id": "BC-2", "stem": "A 16-year-old boy presents with double vision. Examination shows difficulty turning his eye inferolaterally and trouble going down stairs. Which of the following nerves is most likely damaged?", "opts": ["Oculomotor nerve", "Optic nerve", "Ophthalmic nerve", "Trochlear nerve", "Abducens nerve"], "ans": 3, "why": "The trochlear nerve supplies the superior oblique, which moves the eye down and out. Its paralysis causes vertical diplopia that is worst when looking down, such as descending stairs.", "wrong": ["CN III palsy gives ptosis, mydriasis, and a down-and-out eye.", "Optic nerve lesion causes blindness, not diplopia.", "V1 is sensory to the forehead/upper face; no eye movement.", "", "CN VI palsy causes medial deviation (internal strabismus)."], "pearl": "Trouble walking down stairs + vertical diplopia = CN IV (superior oblique).", "set": "orbit"}, {"id": "G-80", "stem": "A 32-year-old woman has headaches and dizziness. On examination she has partial ptosis (drooping eyelid). Which muscle is most likely paralyzed?", "opts": ["Orbicularis oculi, lacrimal part", "Orbicularis oculi, palpebral part", "Levator palpebrae superioris", "Superior oblique", "Superior tarsal (of Müller)"], "ans": 4, "why": "The superior tarsal muscle is sympathetically innervated smooth muscle that helps hold the lid up. Losing it causes only mild (partial) ptosis, whereas losing the levator (CN III) causes complete ptosis.", "wrong": ["The lacrimal part helps drain tears; it does not lift the lid.", "The palpebral part closes the lid gently; paralysis would not cause ptosis.", "Levator (CN III) paralysis causes complete ptosis, not partial.", "The superior oblique moves the globe; it does not lift the eyelid.", ""], "pearl": "Partial ptosis = superior tarsal (sympathetic, Horner); complete ptosis = levator palpebrae (CN III).", "set": "orbit"}, {"id": "LC-33", "stem": "A physician shines a light into only the left eye. The left pupil does not constrict, but the right pupil does. Which nerve is most likely damaged?", "opts": ["Right optic nerve", "Left optic nerve", "Right ophthalmic nerve", "Right oculomotor nerve", "Left oculomotor nerve"], "ans": 4, "why": "A consensual response in the right eye shows the left optic nerve (afferent limb) works. The absent direct response in the left eye means the left oculomotor nerve (efferent limb) is damaged.", "wrong": ["Not tested, because light was shone only into the left eye.", "Intact: the right pupil responded consensually.", "V1 carries corneal sensation; not part of the light reflex.", "Intact: the right pupil constricted.", ""], "pearl": "Light reflex: afferent CN II, efferent CN III; no direct but intact consensual = ipsilateral CN III.", "set": "orbit"}, {"id": "BC-16", "stem": "A 20-year-old guard blinks when a strong wind hits the cornea of his eye. The afferent fibers of the corneal reflex arc are carried by which of the following nerves?", "opts": ["Optic nerve", "Lacrimal nerve", "Nasociliary nerve", "Zygomatic nerve", "Oculomotor nerve"], "ans": 2, "why": "Corneal sensation travels in the long ciliary branches of the nasociliary nerve (V1), forming the afferent limb; the facial nerve closes the eye as the efferent limb.", "wrong": ["Optic nerve is the afferent limb of the pupillary light reflex.", "Lacrimal nerve supplies the lateral upper eyelid and gland, not the cornea.", "", "Zygomatic nerve (V2) supplies lateral face skin.", "CN III opens the eye; it is not part of the corneal reflex."], "pearl": "Corneal reflex: afferent V1 (nasociliary) -> efferent VII (orbicularis oculi).", "set": "orbit"}, {"id": "G-76", "stem": "A 43-year-old man complains of diplopia when walking down stairs. When asked to turn his right eye inward toward his nose and look down, he can look inward but not down. Which nerve is most likely involved?", "opts": ["Abducens", "Nasociliary", "Oculomotor, inferior division", "Oculomotor, superior division", "Trochlear"], "ans": 4, "why": "With the eye adducted, the superior oblique is the depressor; failure of downgaze in adduction (with intact adduction) indicates a trochlear nerve lesion.", "wrong": ["Supplies lateral rectus (abduction).", "Purely sensory branch of V1.", "Its loss would also impair adduction (medial rectus) and elevation (inferior oblique).", "Supplies superior rectus and levator; elevation/ptosis, not downgaze.", ""], "pearl": "Test CN IV: adduct the eye, then look down (superior oblique depresses the adducted eye).", "set": "orbit"}, {"id": "G-263", "stem": "A neurologist strokes the patient's left cornea with cotton and gets no response. When the right cornea is touched, both eyes blink. Damage to which left cranial nerve best explains this?", "opts": ["Optic", "Oculomotor", "Trigeminal", "Abducens", "Facial"], "ans": 2, "why": "The corneal reflex uses V1 (nasociliary) as the afferent limb and CN VII as the bilateral efferent. Touching the right cornea produces a bilateral blink, so both facial nerves work; the left V1 afferent is the problem.", "wrong": ["CN II carries vision, not corneal touch.", "CN III elevates the lid; it does not close it.", "", "CN VI moves the eye laterally; not part of the reflex.", "A left CN VII lesion would stop the left eye blinking when the right cornea is touched."], "pearl": "No blink either eye from one side = afferent (V1) lesion; one eye never blinks = efferent (VII) lesion.", "set": "orbit"}, {"id": "G-78", "stem": "A 47-year-old woman has signs of cavernous sinus thrombosis, and imaging shows a pituitary tumor invading the cavernous sinus. The physician suspects the tumor has damaged her right abducens nerve. In which direction would the physician most likely ask her to move her right eye to confirm the abducens injury, assuming she cannot do it?", "opts": ["Inward", "Outward", "Downward", "Down and out", "Down and in"], "ans": 1, "why": "CN VI supplies only the lateral rectus, the muscle that abducts (turns the eye outward). Failure to look outward is the direct test for abducens injury.", "wrong": ["Adduction is done by the medial rectus (CN III).", "", "Downward gaze uses inferior rectus (CN III) and superior oblique (CN IV).", "Down and out needs inferior rectus plus lateral rectus; not a pure CN VI test.", "Down and in is the superior oblique (CN IV) test."], "pearl": "CN VI = lateral rectus = abduction; it is the most vulnerable nerve in the cavernous sinus (runs free beside the ICA).", "set": "orbit"}, {"id": "G-244", "stem": "A 22-year-old baseball player is hit in the eye. He moves the eye normally and sees distant objects, but cannot focus on near objects. Injury to which nerve structures most likely explains this?", "opts": ["Trochlear nerve and abducens nerve", "Oculomotor nerve and abducens nerve", "Superior cervical ganglion and long ciliary nerves", "Short ciliary nerves and ciliary ganglion", "Infratrochlear nerve and ciliary ganglion"], "ans": 3, "why": "Accommodation needs parasympathetic input to the ciliary muscle and sphincter pupillae via the ciliary ganglion and short ciliary nerves. Since eye movements are normal, the lesion is in this parasympathetic pathway rather than the motor nerves.", "wrong": ["IV and VI injury would impair eye movement, which is normal here.", "Eye movements are intact, so CN III/VI trunks are not the issue.", "Sympathetic fibers dilate the pupil; they do not mediate accommodation.", "", "Infratrochlear is a sensory V1 branch with no role in accommodation."], "pearl": "Near focus = ciliary muscle contraction via CN III -> ciliary ganglion -> short ciliary nerves.", "set": "orbit"}, {"id": "G-39", "stem": "A 48-year-old man has a constricted right pupil; his left pupil and vision in both eyes are normal. These findings are most likely due to a lesion of which right-sided structure?", "opts": ["Oculomotor nerve", "Superior cervical ganglion", "Nervus intermedius", "Edinger-Westphal nucleus", "Trigeminal (semilunar, Gasserian) ganglion"], "ans": 1, "why": "A constricted pupil means loss of sympathetic dilator input; the superior cervical ganglion supplies postganglionic sympathetics to the dilator pupillae via the internal carotid plexus.", "wrong": ["Lesion abolishes constriction, producing a dilated pupil.", "", "Parasympathetic to lacrimal/salivary glands; no pupillary role.", "Lesion removes constriction, causing mydriasis.", "Purely sensory; no effect on pupil size."], "pearl": "Miosis = sympathetic loss (Horner/SCG); mydriasis = parasympathetic loss (CN III/Edinger-Westphal/ciliary ganglion).", "set": "orbit"}, {"id": "G-103", "stem": "A 72-year-old woman has painful tenderness in her upper right chest. On examination her right eyelid droops slightly and her right pupil is smaller than the left. What is the most likely diagnosis?", "opts": ["Raynaud disease", "Frey syndrome", "Bell palsy", "Quinsy", "Pancoast tumor"], "ans": 4, "why": "A Pancoast tumor at the lung apex can invade the cervical sympathetic chain and stellate ganglion, causing Horner syndrome (mild ptosis and miosis) on the same side.", "wrong": ["A vasospastic disorder of the fingers and toes; it does not cause Horner signs.", "Gustatory sweating after parotid surgery.", "A CN VII palsy causes facial muscle weakness, not miosis.", "A peritonsillar abscess.", ""], "pearl": "Apical lung tumor + ipsilateral Horner syndrome = Pancoast tumor.", "set": "orbit"}, {"id": "G-79", "stem": "An 8-year-old boy has a drooping right eyelid (ptosis), and Horner syndrome is suspected. Which additional sign on the right side would confirm the diagnosis?", "opts": ["Constricted pupil", "Dry eye", "Exophthalmos", "Pale, blanched face", "Sweaty face"], "ans": 0, "why": "Horner syndrome is loss of sympathetic supply to the head: ptosis, miosis (small pupil) and anhidrosis. With the dilator pupillae unopposed, the pupil constricts.", "wrong": ["", "Tear secretion is parasympathetic (CN VII), so tearing is spared.", "Horner causes no protrusion (apparent enophthalmos, if anything); exophthalmos suggests hyperthyroidism.", "Loss of sympathetic vasoconstriction causes flushing, not pallor.", "Sympathetic loss causes anhidrosis, not sweating."], "pearl": "Horner triad: ptosis, miosis, anhidrosis (plus facial flushing).", "set": "orbit"}, {"id": "LC-6", "stem": "A 47-year-old woman with multiple sclerosis has sudden paroxysms of pain in her right lower lip, mandibular teeth and gingivae, and cheek, triggered by eating, talking, or brushing her teeth. Which nerve is the source of her pain?", "opts": ["First division of trigeminal nerve", "Second division of trigeminal nerve", "Third division of trigeminal nerve", "Buccal branch of facial nerve", "Marginal mandibular branch of facial nerve"], "ans": 2, "why": "This is trigeminal neuralgia in the V3 territory: V3 supplies the lower lip, chin, cheek (buccal n.), and mandibular teeth/gums (inferior alveolar n.). Demyelinating disease such as MS is a known cause.", "wrong": ["V1 supplies forehead, upper eyelid, and dorsum of nose.", "V2 supplies lower eyelid, upper lip, cheek, and maxillary teeth.", "", "Facial nerve branches are motor only; no pain sensation.", "Facial nerve branches are motor only; supplies lower lip muscles."], "pearl": "Trigeminal neuralgia (tic douloureux): lancinating triggered facial pain; think MS in young patients.", "set": "face"}, {"id": "BH-6", "stem": "A 45-year-old woman has numbness over the tip of her nose. Which of the following nerves is most likely damaged?", "opts": ["Ophthalmic division of the trigeminal nerve", "Maxillary division of the trigeminal nerve", "Mandibular division of the trigeminal nerve", "Facial nerve", "Auriculotemporal nerve"], "ans": 0, "why": "The skin of the nasal tip is supplied by the external nasal branch of the anterior ethmoidal nerve, a branch of nasociliary from V1.", "wrong": ["", "V2 supplies skin between lower eyelid and upper lip, including the side of the nose.", "V3 supplies the lower face below the lower lip/jaw.", "Facial nerve is motor to facial muscles and gives no facial skin sensation.", "Auriculotemporal (V3) supplies the auricle and temporal scalp."], "pearl": "Nasal tip = V1 (external nasal n.) - Hutchinson sign in zoster.", "set": "face"}, {"id": "G-100", "stem": "After a mastoidectomy, an 8-year-old boy has facial paralysis (Bell palsy). Saliva collects in the vestibule of his mouth and dribbles from the corner of his mouth. Which muscle is most likely paralyzed?", "opts": ["Zygomaticus major", "Orbicularis oculi", "Buccinator", "Levator palpebrae superioris", "Orbicularis oris"], "ans": 2, "why": "The buccinator keeps the cheek pressed against the teeth, which stops food and saliva from collecting in the vestibule. When it is paralyzed, material pools in the cheek.", "wrong": ["Raises the corner of the mouth when smiling; it does not keep the vestibule clear.", "Closes the eyelids; it has no role in the cheek.", "", "Raises the eyelid and is supplied by CN III, not CN VII.", "Closes the lips, but the cheek muscle is what keeps the vestibule empty."], "pearl": "Buccinator (CN VII buccal branch) keeps food and saliva out of the vestibule.", "set": "face"}, {"id": "G-141", "stem": "A 55-year-old woman has a malignant parotid tumor removed. Afterward, the muscles of her lower lip are clearly weak. Which nerve was most likely injured?", "opts": ["Marginal mandibular branch of facial", "Zygomatic branch of facial", "Mandibular division of the trigeminal nerve", "Buccal branch of facial", "Buccal nerve"], "ans": 0, "why": "The marginal mandibular branch of CN VII leaves the parotid and runs along the mandible to supply the lower lip depressors.", "wrong": ["", "Supplies the orbicularis oculi (eye closure).", "V3 supplies the chewing muscles, not the lip muscles.", "Supplies the buccinator and upper lip muscles.", "The buccal nerve (V3) is sensory to the cheek."], "pearl": "Parotid surgery puts the CN VII branches at risk; the marginal mandibular branch controls the lower lip.", "set": "face"}, {"id": "LH-18", "stem": "A 23-year-old woman wakes up with a facial nerve (Bell) palsy. What muscle will continue to function despite this condition?", "opts": ["Zygomaticus major", "Levator labii superioris", "Buccinator", "Masseter", "Platysma"], "ans": 3, "why": "The masseter is a muscle of mastication supplied by CN V3, so it is unaffected by a CN VII palsy; all the other choices are muscles of facial expression innervated by the facial nerve.", "wrong": ["Muscle of facial expression (CN VII, zygomatic/buccal branches)", "Muscle of facial expression (CN VII)", "Cheek muscle of facial expression (CN VII buccal branch)", "", "Facial expression muscle supplied by the cervical branch of CN VII"], "pearl": "Bell palsy spares mastication (CN V3): masseter, temporalis, pterygoids still work.", "set": "face"}, {"id": "G-222", "stem": "A severe mandibular fracture in a 22-year-old woman requires surgical reconstruction. Postoperatively she has numbness of the lower lip and chin. Which nerve was most likely injured?", "opts": ["Auriculotemporal", "Buccal", "Lesser petrosal", "Mental", "Infraorbital"], "ans": 3, "why": "The mental nerve, the terminal branch of the inferior alveolar nerve (V3), exits the mental foramen to supply the skin and mucosa of the lower lip and chin.", "wrong": ["Supplies skin of the temple, auricle, and TMJ/parotid.", "Supplies cheek skin and buccal mucosa.", "Carries CN IX parasympathetics to the otic ganglion; no skin sensation.", "", "V2 branch supplying the lower eyelid, cheek, and upper lip."], "pearl": "Lower lip + chin numbness = mental nerve (from inferior alveolar, V3).", "set": "face"}, {"id": "BH-10", "stem": "A 33-year-old woman develops Bell palsy and is warned that she may develop corneal inflammation and ulceration. This risk results from which of the following?", "opts": ["Sensory loss of the cornea and conjunctiva", "Lack of secretion of the parotid gland", "Absence of the corneal blink reflex", "Absence of sweating on the face", "Inability to constrict the pupil"], "ans": 2, "why": "Facial palsy paralyzes the orbicularis oculi, the efferent limb of the corneal blink reflex, so the eye cannot close to protect the cornea.", "wrong": ["Corneal sensation is V1, which is intact in Bell palsy.", "Parotid secretion depends on CN IX (lesser petrosal).", "", "Facial sweating is sympathetic.", "Pupillary constriction depends on CN III parasympathetics."], "pearl": "Bell palsy: can't close eye -> exposure keratitis; protect the cornea.", "set": "face"}, {"id": "G-73", "stem": "A 38-year-old woman has acute dental pain from penetrating caries in a mandibular molar. Which nerve would the dentist need to anesthetize to treat this tooth?", "opts": ["Lingual", "Inferior alveolar", "Buccal", "Mental", "Mylohyoid"], "ans": 1, "why": "The inferior alveolar nerve (V3) runs in the mandibular canal and supplies all mandibular teeth.", "wrong": ["Supplies the anterior tongue and lingual gingiva, not the teeth.", "", "Supplies cheek skin/mucosa and buccal gingiva.", "Terminal branch after the mental foramen; supplies chin/lip, not molars.", "Motor to mylohyoid and anterior digastric."], "pearl": "Inferior alveolar nerve block (at the mandibular foramen) numbs all lower teeth on that side plus lip and chin.", "set": "face"}, {"id": "G-290", "stem": "A 60-year-old man has numbness of the right lower jaw and inner cheek, loss of sensation over the posterior temporal scalp and anterior auricle, and weak lateral deviation of the mandible. CT shows a mass in the infratemporal fossa. Which other function is most likely affected?", "opts": ["Weak elevation of the corner of the right side of the mouth", "Loss of sensation over the upper lip and to the upper teeth", "Inability to sense a foreign body in the right eye", "Decreased secretion from the parotid gland", "Inability to abduct the right eye"], "ans": 3, "why": "The findings point to V3 branches in the infratemporal fossa, including the auriculotemporal nerve. That nerve also carries postganglionic parasympathetic fibers from the otic ganglion to the parotid, so salivation from the parotid would drop.", "wrong": ["Mouth-corner elevation is CN VII (zygomatic/buccal branches).", "Upper lip and upper teeth are V2.", "Corneal sensation is V1.", "", "Abduction is CN VI in the orbit/cavernous sinus."], "pearl": "Otic ganglion (IX via lesser petrosal) -> auriculotemporal n. (V3) -> parotid.", "set": "face"}, {"id": "G-24", "stem": "A 35-year-old man has a tumor in the infratemporal fossa. He has lost general sensation from the anterior two thirds of his tongue, but taste and salivation are intact. Which nerve is most likely affected?", "opts": ["Lingual proximal to its junction with the chorda tympani", "Chorda tympani", "Inferior alveolar", "Lesser petrosal", "Glossopharyngeal"], "ans": 0, "why": "Proximal to where the chorda tympani joins it in the infratemporal fossa, the lingual nerve carries only V3 general sensation, so a lesion there spares taste and submandibular/sublingual secretion.", "wrong": ["", "Would cause loss of taste and reduced submandibular/sublingual salivation.", "Supplies mandibular teeth and chin, not the tongue.", "Parotid secretomotor; would affect salivation, not tongue sensation.", "Serves the posterior third of the tongue, not the anterior two thirds."], "pearl": "Lingual n. above chorda tympani junction = general sensation only; below it = sensation + taste + submandibular parasympathetics.", "set": "face"}, {"id": "BH-40", "stem": "A 21-year-old woman has an infection within the carotid sheath. Which structures would be damaged?", "opts": ["Vagus nerve and middle cervical ganglion", "Internal carotid artery and recurrent laryngeal nerve", "Internal jugular vein and vagus nerve", "Sympathetic trunk and common carotid artery", "External carotid artery and ansa cervicalis"], "ans": 2, "why": "The carotid sheath contains the common and internal carotid arteries, internal jugular vein, and vagus nerve.", "wrong": ["The cervical ganglia lie behind the sheath.", "Recurrent laryngeal nerve lies in the tracheoesophageal groove.", "", "Sympathetic trunk lies posterior to the sheath.", "External carotid is outside the sheath; ansa lies on/within its surface."], "pearl": "Carotid sheath: CCA/ICA (medial), IJV (lateral), CN X (posterior between them).", "set": "neck"}, {"id": "G-287", "stem": "During thyroidectomy the superior thyroid artery is ligated, taking care to protect the nerve that runs next to it. Which muscle does this nerve supply?", "opts": ["Thyroarytenoid", "Lateral cricoarytenoid", "Posterior cricoarytenoid", "Cricothyroid", "Aryepiglotticus"], "ans": 3, "why": "The external branch of the superior laryngeal nerve accompanies the superior thyroid artery toward the upper pole of the thyroid and supplies the cricothyroid muscle.", "wrong": ["Supplied by the recurrent laryngeal nerve.", "Supplied by the recurrent laryngeal nerve.", "Supplied by the recurrent laryngeal nerve.", "", "Supplied by the recurrent laryngeal nerve."], "pearl": "Ligate superior thyroid a. close to the gland to spare the external laryngeal n. (cricothyroid).", "set": "neck"}, {"id": "BC-3", "stem": "A 31-year-old man with a penetrating injury to the posterior triangle of the neck cannot shrug his shoulder or turn his head to the opposite side. Which of the following nerves is most likely damaged?", "opts": ["Trigeminal nerve", "Facial nerve", "Glossopharyngeal nerve", "Accessory nerve", "Hypoglossal nerve"], "ans": 3, "why": "The spinal accessory nerve crosses the posterior cervical triangle superficially and innervates the trapezius (shoulder shrug) and sternocleidomastoid (turns head to the opposite side).", "wrong": ["Trigeminal nerve supplies facial sensation and muscles of mastication.", "Facial nerve supplies muscles of facial expression.", "CN IX supplies stylopharyngeus and posterior-tongue taste.", "", "Hypoglossal nerve moves the tongue."], "pearl": "CN XI is superficial in the posterior triangle - easily injured (e.g., lymph node biopsy).", "set": "neck"}, {"id": "G-68", "stem": "During removal of a benign thyroid tumor, the superior thyroid artery is identified and used as a landmark to avoid damaging its small companion nerve. Which nerve most likely accompanies the superior thyroid artery?", "opts": ["Cervical sympathetic trunk", "External branch of the superior laryngeal", "Inferior root of the ansa cervicalis", "Internal branch of the superior laryngeal", "Recurrent laryngeal"], "ans": 1, "why": "The external laryngeal nerve descends alongside the superior thyroid artery to reach cricothyroid, so ligation of the artery near the upper pole risks it.", "wrong": ["Lies posterolateral, behind the carotid sheath.", "", "Lies more superficially on the carotid sheath.", "Runs above the artery and pierces the thyrohyoid membrane with the superior laryngeal artery.", "Runs with the inferior thyroid artery near the lower pole."], "pearl": "Superior thyroid a. ↔ external laryngeal n.; inferior thyroid a. ↔ recurrent laryngeal n.; superior laryngeal a. ↔ internal laryngeal n.", "set": "neck"}, {"id": "G-115", "stem": "A 45-year-old woman with hypertension and arrhythmias has a severe headache. To lower her blood pressure, massage is applied at a point deep to the anterior border of the sternocleidomastoid at the level of the upper border of the thyroid cartilage. Which structure is being targeted?", "opts": ["Carotid sinus", "Carotid body", "Thyroid gland", "Parathyroid gland", "Inferior cervical ganglion"], "ans": 0, "why": "The carotid sinus, a widening at the carotid bifurcation (C4), is a baroreceptor. Pressing on it reflexively slows the heart and lowers blood pressure through CN IX and CN X.", "wrong": ["", "A chemoreceptor that senses O2 and CO2, not pressure.", "Plays no part in acute pressure reflexes.", "Controls calcium, not blood pressure reflexes.", "Part of the stellate ganglion, low in the neck; it is not a baroreceptor."], "pearl": "Carotid sinus = baroreceptor (CN IX); carotid body = chemoreceptor. Both are at the bifurcation, level of the upper border of the thyroid cartilage.", "set": "neck"}, {"id": "G-61", "stem": "A 6-year-old boy with a history of complicated delivery has a persistent head tilt, with the right ear near the right shoulder and the face turned upward and to the left. Which muscle was most likely damaged during birth?", "opts": ["Anterior scalene", "Omohyoid", "Sternocleidomastoid", "Trapezius", "Platysma"], "ans": 2, "why": "Congenital torticollis results from birth injury/fibrosis of the sternocleidomastoid; a shortened right SCM tilts the head to the right and rotates the face to the left.", "wrong": ["Elevates the first rib; does not produce torticollis.", "Depresses the hyoid.", "", "Elevates and retracts the scapula; does not rotate the face contralaterally like this.", "Thin superficial muscle; tenses neck skin."], "pearl": "One SCM: tilt head to same side, turn face to opposite side (congenital muscular torticollis).", "set": "neck"}, {"id": "BH-5", "stem": "A 17-year-old boy injures his phrenic nerve in a knife wound to the neck. The damaged nerve has which of the following relationships in the neck?", "opts": ["Anterior to the subclavian vein", "Posterior to the subclavian artery", "Deep to the brachial plexus", "Medial to the common carotid artery", "Superficial to the anterior scalene muscle"], "ans": 4, "why": "The phrenic nerve (C3-C5) descends on the anterior surface of the anterior scalene, then enters the thorax between the subclavian vein (in front) and artery (behind).", "wrong": ["It passes posterior to the subclavian vein.", "It passes anterior to the subclavian artery.", "The brachial plexus lies deep (posterior) to the anterior scalene.", "It lies lateral to the common carotid artery.", ""], "pearl": "Phrenic n. rides on the anterior scalene; brachial plexus and subclavian a. pass behind it.", "set": "neck"}, {"id": "G-93", "stem": "A 56-year-old woman has a complete thyroidectomy. After anesthesia her voice is hoarse for 3 weeks, and examination shows her right vocal fold is permanently adducted. Surgical injury to the nerve supply of which muscle most likely explains this vocal fold position?", "opts": ["Aryepiglottic", "Posterior cricoarytenoid", "Thyroarytenoid", "Transverse arytenoids", "Vocalis"], "ans": 1, "why": "The posterior cricoarytenoid is the only muscle that abducts the vocal fold, and it is supplied by the recurrent laryngeal nerve. If it is paralyzed, the adductors win and the fold stays near the midline.", "wrong": ["Narrows the laryngeal inlet; it does not abduct the vocal fold.", "", "Relaxes and shortens the vocal fold; losing it would not leave the fold adducted.", "Adducts the arytenoids; losing it would not cause fixed adduction.", "Adjusts vocal fold tension; it is not an abductor."], "pearl": "Posterior cricoarytenoid = the only abductor ('pull apart') and is supplied by the RLN.", "set": "larynx"}, {"id": "BH-16", "stem": "The nerve accompanying the superior thyroid artery may be damaged during thyroid surgery. Which functional defect may result?", "opts": ["Loss of sensation above the vocal cord", "Loss of lateral rotation of the arytenoid cartilages", "Paralysis of the vocalis muscle", "Lack of abduction of the vocal cord", "Decreased tension of the vocal cord"], "ans": 4, "why": "The external laryngeal nerve travels with the superior thyroid artery and supplies the cricothyroid; its loss reduces vocal cord tension.", "wrong": ["Supraglottic sensation is the internal laryngeal nerve.", "Lateral rotation of the arytenoid is posterior cricoarytenoid (recurrent laryngeal).", "Vocalis is supplied by the recurrent laryngeal nerve.", "Abduction loss reflects posterior cricoarytenoid paralysis.", ""], "pearl": "Superior thyroid a. <-> external laryngeal n.; inferior thyroid a. <-> recurrent laryngeal n.", "set": "larynx"}, {"id": "G-97", "stem": "Two months after a thyroidectomy, a 32-year-old woman cannot sense foreign objects in her laryngeal vestibule. Which nerve was most likely injured?", "opts": ["Internal laryngeal nerve", "External laryngeal nerve", "Glossopharyngeal nerve", "Hypoglossal nerve", "Recurrent laryngeal nerve"], "ans": 0, "why": "The internal branch of the superior laryngeal nerve pierces the thyrohyoid membrane and supplies the laryngeal mucosa above the vocal folds, including the vestibule.", "wrong": ["", "Motor to the cricothyroid; injury causes a weak voice, not sensory loss.", "Supplies the pharynx and posterior tongue, not the laryngeal vestibule.", "Motor to the tongue; injury does not affect laryngeal sensation.", "Supplies sensation below the vocal folds, plus most laryngeal muscles."], "pearl": "Above the vocal folds = internal laryngeal n.; below the folds = recurrent laryngeal n.", "set": "larynx"}, {"id": "BH-1", "stem": "A 38-year-old man undergoes thyroid surgery for papillary carcinoma. The external laryngeal nerve, which accompanies the superior thyroid artery, is damaged during the operation. This injury would most severely impair which of the following functions?", "opts": ["Relaxing the vocal cords", "Rotating the arytenoid cartilages", "Tensing the vocal cords", "Widening the rima glottidis", "Abducting the vocal cords"], "ans": 2, "why": "The external laryngeal nerve supplies the cricothyroid, the main tensor of the vocal cords; losing it produces a weak, monotone voice that cannot reach high pitch.", "wrong": ["Relaxation is mainly by thyroarytenoid/posterior vocalis (recurrent laryngeal n.).", "Arytenoid rotation is by the cricoarytenoid muscles (recurrent laryngeal n.).", "", "Rima widening is by posterior cricoarytenoid (recurrent laryngeal n.).", "Abduction is solely by posterior cricoarytenoid (recurrent laryngeal n.)."], "pearl": "External laryngeal n. (with superior thyroid a.) -> cricothyroid -> vocal cord tension/pitch.", "set": "larynx"}, {"id": "G-113", "stem": "After a thyroidectomy, a 32-year-old woman has lost sensation inside the larynx from the vocal folds up to the laryngeal inlet, and liquids enter her airway. Which nerve is most likely injured?", "opts": ["Internal laryngeal nerve", "External laryngeal nerve", "Glossopharyngeal nerve", "Hypoglossal nerve", "Recurrent laryngeal nerve"], "ans": 0, "why": "The internal laryngeal nerve supplies the laryngeal mucosa above the vocal folds. Losing it removes the cough reflex that protects against aspiration.", "wrong": ["", "Motor to the cricothyroid; injury weakens the voice without sensory loss.", "Injury would cause wider pharyngeal and posterior tongue sensory loss.", "Motor to the tongue only.", "Supplies sensation below the vocal folds and most of the laryngeal muscles."], "pearl": "Internal laryngeal injury -> loss of supraglottic sensation -> aspiration.", "set": "larynx"}, {"id": "G-256", "stem": "A 39-year-old man has hoarseness; laryngoscopy shows vocal cord nodules with normal movement. Which muscle opens the rima glottidis?", "opts": ["Posterior cricoarytenoids", "Lateral cricoarytenoids", "Thyroarytenoids", "Transverse arytenoids", "Cricothyroids"], "ans": 0, "why": "The posterior cricoarytenoid is the only muscle that abducts the vocal folds, rotating the arytenoids to widen the rima glottidis.", "wrong": ["", "Lateral cricoarytenoids adduct the vocal folds.", "Thyroarytenoids relax/shorten the vocal folds.", "Transverse arytenoids adduct by closing the posterior rima.", "Cricothyroids tense (lengthen) the vocal folds."], "pearl": "'Posterior cricoarytenoids pull the cords apart' - the only abductor.", "set": "larynx"}];
</script>
<script>
(function(){
const app=document.getElementById('app');
const byId=Object.fromEntries(Q.map(q=>[q.id,q]));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LET=['A','B','C','D','E'];

/* ---- bosses: one per topic, final is the Hydra ---- */
const BOSSES=[
 {key:'neck',name:'The Carotid Warden',title:'Keeper of the sheath — IJV, CN X, common carotid',hue:'#E86A4A',eyes:2,horns:2,shape:'wide'},
 {key:'face',name:'The Parotid Gorgon',title:'Five facial branches writhe through its gland',hue:'#D9A43B',eyes:2,horns:5,shape:'round'},
 {key:'larynx',name:'The Glottis Siren',title:'Sings only through the rima glottidis',hue:'#4FC0B0',eyes:2,horns:0,shape:'tall'},
 {key:'nasal_oral',name:'The Sinus Leviathan',title:'Drains into every meatus at once',hue:'#5B8DEF',eyes:3,horns:1,shape:'wide'},
 {key:'orbit',name:'The Six-Muscle Cyclops',title:'LR6 · SO4 · the rest are III',hue:'#B06CF0',eyes:1,horns:2,shape:'round'},
 {key:'cranial',name:'The Foramen Keeper',title:'Guards every hole in the skull base',hue:'#C9C2A8',eyes:4,horns:3,shape:'tall'},
 {key:'cn',name:'The Cranial Nerve Hydra',title:'Twelve heads. Olfactory to hypoglossal.',hue:'#FF4F8B',eyes:2,horns:0,shape:'hydra',final:true}
];
const BY_KEY=Object.fromEntries(BOSSES.map(b=>[b.key,b]));
const TOPIC_COUNT={};Q.forEach(q=>TOPIC_COUNT[q.set]=(TOPIC_COUNT[q.set]||0)+1);

function beastSVG(b,small){
  const c=b.hue, W=200,H=170;
  let g='';
  if(b.shape==='hydra'){
    // 12 heads on necks fanning from one body
    for(let i=0;i<12;i++){
      const a=(-150+i*(120/11))*Math.PI/180, r=i%2?78:92;
      const x=100+Math.cos(a)*r, y=128+Math.sin(a)*r;
      g+=`<path d="M100 130 Q${(100+x)/2+(i%2?8:-8)} ${(130+y)/2} ${x.toFixed(1)} ${y.toFixed(1)}" stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round" opacity=".9"/>`;
      g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9" fill="${c}"/><circle cx="${(x+2.5).toFixed(1)}" cy="${(y-2).toFixed(1)}" r="2.6" fill="#17142B"/>`;
    }
    g+=`<ellipse cx="100" cy="142" rx="54" ry="26" fill="${c}"/><ellipse cx="100" cy="146" rx="36" ry="12" fill="#17142B" opacity=".35"/>`;
    g+=`<text x="100" y="150" text-anchor="middle" font-family="Silkscreen,monospace" font-size="11" fill="#17142B">I–XII</text>`;
  }else{
    const rx=b.shape==='wide'?78:b.shape==='tall'?52:64, ry=b.shape==='tall'?70:b.shape==='wide'?52:60, cy=98;
    for(let i=0;i<b.horns;i++){
      const t=b.horns===1?0.5:i/(b.horns-1), hx=100-rx*0.8+t*rx*1.6, top=cy-ry-26+Math.abs(t-.5)*18;
      g+=`<polygon points="${hx-9},${cy-ry+14} ${hx+9},${cy-ry+14} ${hx+(t-.5)*14},${top}" fill="${c}" opacity=".85"/>`;
    }
    g+=`<ellipse cx="100" cy="${cy}" rx="${rx}" ry="${ry}" fill="${c}"/>`;
    g+=`<ellipse cx="100" cy="${cy+ry*0.45}" rx="${rx*0.62}" ry="${ry*0.3}" fill="#17142B" opacity=".18"/>`;
    const n=b.eyes, span=Math.min(rx*1.1,26*n);
    for(let i=0;i<n;i++){
      const ex=n===1?100:100-span/2+i*(span/(n-1)), er=n===1?22:n>2?9:13, ey=cy-ry*0.18;
      g+=`<circle cx="${ex}" cy="${ey}" r="${er}" fill="#F4F0FF"/><circle class="pupil" cx="${ex}" cy="${ey+1}" r="${er*0.45}" fill="#17142B"/>`;
    }
    // mouth with teeth
    const mw=rx*0.9, my=cy+ry*0.32;
    g+=`<path d="M${100-mw/2} ${my} Q100 ${my+22} ${100+mw/2} ${my} Z" fill="#17142B"/>`;
    for(let i=0;i<5;i++){const tx=100-mw/2+8+i*((mw-16)/4);g+=`<polygon points="${tx-4},${my+2} ${tx+4},${my+2} ${tx},${my+10}" fill="#F4F0FF"/>`;}
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(b.name)}">${g}</svg>`;
}

/* ---- state ---- */
let S, tick=null;
function fresh(){return{phase:'setup',names:['Player 1','Player 2'],mode:'campaign',pick:'cn',timer:60,diff:'normal'};}
/* Every question in the boss's deck pool is asked. Boss HP = share of the max base damage. */
const DIFF={normal:{ratio:.6,finalRatio:.65,dmg:20,rage:30,hit:15},hard:{ratio:.75,finalRatio:.8,dmg:20,rage:40,hit:22}};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function begin(){
  const order=S.mode==='campaign'?BOSSES.map(b=>b.key):[S.pick];
  Object.assign(S,{phase:'intro',order,stage:0,
