<meta charset="utf-8">
<title>Neuromon HNSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Press+Start+2P&display=swap">
<style>
/* Single deliberate look: a handheld console. Painted explicitly so it holds on light or dark hosts. */
:root{
  color-scheme: dark;
  --shell:#1E2440; --shell2:#262E52; --shell-line:#3A4470; --shell-ink:#E9ECF7; --shell-mute:#A3AACB;
  --screen:#F3F7EE; --ink:#1B2033; --mute:#5B6280; --line:#1B2033;
  --sky:#D6ECDF; --sky2:#BFE0CE; --grass:#8CC06A; --grass2:#6FA553; --pad:#B9D89A; --pad2:#9BC47C;
  --gold:#E3AE12; --gold-ink:#7A5B00;
  --good:#1E8A57; --good-soft:#DCF2E6; --bad:#C2412F; --bad-soft:#F8E1DC; --trap:#96313B; --trap-soft:#F8E8E9;
  --hp-hi:#38B26A; --hp-mid:#E3AE12; --hp-lo:#D9442F; --xp:#3E8FE0;
  --hy-bg:#FFF4C2; --hy-line:#D4A300; --hy-ink:#4A3A00;
  --pixel:"Press Start 2P","Courier New",monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--shell);color:var(--shell-ink)}
body{font:15px/1.55 var(--body);margin:0;padding-inline:16px;padding-block:14px 40px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.px{font-family:var(--pixel);letter-spacing:.02em}
.mast{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--pixel);font-size:11px;color:var(--shell-mute);line-height:1.8}
.brand b{color:var(--gold)}
.brand a{color:var(--shell-mute)}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.hbtn{background:var(--shell2);border:2px solid var(--shell-line);border-radius:6px;padding:7px 10px;font-family:var(--pixel);font-size:9px;color:var(--shell-ink);line-height:1.4}
.hbtn:hover{border-color:var(--gold)}
.hbtn b{color:var(--gold)}
.screen{background:var(--screen);color:var(--ink);border:4px solid #0F1326;border-radius:14px;box-shadow:0 0 0 4px var(--shell-line),0 16px 40px #0008;overflow:hidden}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--pixel);font-size:8.5px;color:var(--shell-mute);line-height:1.8}

/* ---------- generic in-screen UI ---------- */
.pane{padding:18px;display:flex;flex-direction:column;gap:14px}
.h1{font-family:var(--pixel);font-size:clamp(18px,4vw,28px);line-height:1.3;margin:0;text-wrap:balance}
.h2{font-family:var(--pixel);font-size:13px;line-height:1.5;margin:0}
.lede{margin:0;color:var(--mute);max-width:62ch}
.box{border:3px solid var(--line);border-radius:8px;background:#fff;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px #C9CFE0;padding:14px 16px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:11px 16px;font-family:var(--pixel);font-size:10px;line-height:1.4;box-shadow:0 3px 0 #000}
.btn:hover{background:#2E3659}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn.gold{background:var(--gold);color:#241A00}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink),0 3px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tchip{display:inline-block;font-family:var(--pixel);font-size:8px;line-height:1;padding:4px 6px;border-radius:3px;color:#fff;vertical-align:middle}
.small{font-size:13px;color:var(--mute)}
.hy{background:var(--hy-bg);border:2px solid var(--hy-line);border-radius:6px;padding:10px 12px;color:var(--hy-ink);font-size:14px}
.hy b{display:block;font-family:var(--pixel);font-size:8.5px;letter-spacing:.04em;margin-bottom:6px}
.trapbox{background:var(--trap-soft);border:2px solid var(--trap);border-radius:6px;padding:10px 12px;font-size:14px;color:#4A1419}
.trapbox b.lab{display:block;font-family:var(--pixel);font-size:8.5px;color:var(--trap);margin-bottom:6px}

/* ---------- title ---------- */
.title{background:linear-gradient(180deg,var(--sky) 0 58%,var(--grass) 58% 100%);position:relative}
.title .pane{gap:16px}
.logo{font-family:var(--pixel);font-size:clamp(26px,7vw,52px);line-height:1.05;color:var(--ink);text-shadow:3px 3px 0 var(--gold);margin:0}
.logo small{display:block;font-size:.3em;margin-top:10px;text-shadow:none;color:var(--mute)}
.starters{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.starter{background:#fff;border:3px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left}
.starter:hover,.starter[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}
.starter .spr{width:96px;height:108px;align-self:center}
.starter h3{font-family:var(--pixel);font-size:11px;margin:0}
.starter p{margin:0;font-size:13px;color:var(--mute)}
.namefield{display:flex;flex-direction:column;gap:6px;max-width:320px}
.namefield label{font-family:var(--pixel);font-size:9px}
.namefield input{font:inherit;border:3px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff;color:var(--ink)}

/* ---------- map ---------- */
.map{position:relative;aspect-ratio:100/62;max-width:100%;background:
  radial-gradient(circle at 20% 30%,#9ACB76 0 6%,transparent 6.5%),
  radial-gradient(circle at 70% 80%,#9ACB76 0 5%,transparent 5.5%),
  repeating-linear-gradient(0deg,transparent 0 11px,#0000000a 11px 12px),
  repeating-linear-gradient(90deg,transparent 0 11px,#0000000a 11px 12px),var(--grass);
  border-bottom:4px solid var(--line)}
.map svg.paths{position:absolute;inset:0;width:100%;height:100%}
.pond{position:absolute;left:66%;top:6%;width:14%;height:20%;background:#6FB6DC;border:3px solid #3E7FA6;border-radius:48% 52% 45% 55%}
.tree{position:absolute;width:3.2%;aspect-ratio:1;background:#3F7F3A;border:2px solid #1F4A22;border-radius:50% 50% 45% 45%}
.loc{position:absolute;transform:translate(-50%,-60%);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0}
.loc .ico{width:clamp(38px,8vw,64px);aspect-ratio:1}
.loc .lbl{font-family:var(--pixel);font-size:clamp(6.5px,1.4vw,9px);background:#fff;border:2px solid var(--line);border-radius:4px;padding:3px 5px;white-space:nowrap;line-height:1.3}
.loc .lbl em{display:block;font-style:normal;color:var(--mute);font-size:.85em}
.loc[disabled]{cursor:not-allowed;filter:grayscale(.9);opacity:.75}
.loc:hover .lbl{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.avatar{position:absolute;width:clamp(20px,4vw,34px);transform:translate(-50%,-100%);transition:left .55s steps(6),top .55s steps(6);pointer-events:none;z-index:3}
@media (max-width:600px){.map{aspect-ratio:100/100}}
.mapfoot{padding:14px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{border:2px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff}
.stat .k{font-family:var(--pixel);font-size:8px;color:var(--mute)}
.stat .v{font-family:var(--mono);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.badges{display:flex;gap:6px;margin-top:4px}
.badge{width:22px;height:22px}

/* ---------- route ---------- */
.patches{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.patch{text-align:left;background:
  repeating-linear-gradient(135deg,var(--grass) 0 6px,var(--grass2) 6px 8px);border:3px solid var(--line);border-radius:10px;padding:0;overflow:hidden;display:flex;flex-direction:column}
.patch .in{background:#fff;margin-top:26px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--line);flex:1}
.patch h3{margin:0;font-size:15px;font-weight:600}
.patch:hover{box-shadow:0 0 0 3px var(--gold)}
.meter{height:8px;border:2px solid var(--line);border-radius:4px;background:#E8ECF4;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.gymcard{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border:3px solid var(--line);border-radius:10px;padding:14px;background:#fff}
.gymcard .trn{width:64px;height:88px}
@media (max-width:520px){.gymcard{grid-template-columns:1fr}.gymcard .trn{justify-self:center}}

/* ---------- battle ---------- */
.scene{position:relative;aspect-ratio:16/9;max-width:100%;background:linear-gradient(180deg,var(--sky) 0 52%,var(--sky2) 52% 60%,var(--grass) 60% 100%);overflow:hidden;border-bottom:4px solid var(--line)}
.scene.gym{background:linear-gradient(180deg,#E6E1F4 0 52%,#CFC6EA 52% 60%,#B7A9DE 60% 100%)}
.scene.cave{background:linear-gradient(180deg,#D9D2C6 0 52%,#C3B8A6 52% 60%,#A8987F 60% 100%)}
.plat{position:absolute;border-radius:50%;background:var(--pad);border:3px solid var(--pad2)}
.plat.e{right:6%;top:40%;width:34%;height:13%}
.plat.p{left:4%;bottom:4%;width:40%;height:15%}
.scene.gym .plat,.scene.cave .plat{background:#fff8;border-color:#0002}
.mon{position:absolute;image-rendering:pixelated}
.mon.e{right:12%;top:8%;width:22%;aspect-ratio:16/18}
.mon.p{left:9%;bottom:8%;width:28%;aspect-ratio:16/18}
.mon.e.enter{animation:slideE .7s steps(8) both}
.mon.p.enter{animation:slideP .6s steps(8) both}
@keyframes slideE{from{transform:translateX(160%)}to{transform:none}}
@keyframes slideP{from{transform:translateX(-160%)}to{transform:none}}
.mon.hit{animation:blink .5s steps(2) 2}
@keyframes blink{50%{opacity:.1}}
.mon.e.leave{animation:slideOut .5s steps(6) forwards}
.mon.faint{animation:faint .6s ease-in forwards}
@keyframes faint{to{transform:translateY(60%);opacity:0}}
.mon.lunge.p{animation:lungeP .35s ease-out}
.mon.lunge.e{animation:lungeE .35s ease-out}
@keyframes lungeP{50%{transform:translate(18%,-10%)}}
@keyframes lungeE{50%{transform:translate(-18%,10%)}}
.scene.shake{animation:shake .35s steps(4)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.orb{position:absolute;width:7%;aspect-ratio:1;left:30%;bottom:30%;z-index:4;animation:throw .7s ease-out forwards}
@keyframes throw{to{left:73%;bottom:62%}}
.orb.wobble{left:73%;bottom:62%;animation:wob .5s ease-in-out 3}
@keyframes wob{25%{transform:rotate(-20deg)}75%{transform:rotate(20deg)}}
.stbox{position:absolute;background:#fff;border:3px solid var(--line);border-radius:8px 8px 8px 0;padding:6px 9px;min-width:0;width:44%;box-shadow:4px 4px 0 #0002}
.stbox.e{left:3%;top:5%}
.stbox.p{right:3%;bottom:6%;border-radius:8px 0 8px 8px}
.stbox .nm{font-family:var(--pixel);font-size:clamp(7px,1.5vw,10px);line-height:1.35;display:flex;justify-content:space-between;gap:8px}
.stbox .nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stbox .nm span:last-child{flex:none}
.hpline{display:flex;align-items:center;gap:6px;margin-top:5px}
.hpline .lab{font-family:var(--pixel);font-size:7px;color:var(--gold-ink);background:#FFF1C4;padding:2px 3px;border-radius:2px}
.hpbar{flex:1;height:8px;border:2px solid var(--line);border-radius:4px;background:#E8ECF4;overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--hp-hi);transition:width .6s steps(12),background .3s}
.hpnum{font-family:var(--mono);font-size:clamp(10px,1.8vw,13px);text-align:right;font-variant-numeric:tabular-nums;margin-top:2px}
.xpbar{height:4px;background:#E8ECF4;margin-top:4px;border-radius:2px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--xp);transition:width .6s}
.tbadge{position:absolute;right:3%;top:5%;display:flex;gap:4px}
.tbadge i{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:#fff}
.tbadge i.dead{background:#9aa0b4}
.tbadge i.alive{background:var(--gold)}
.leader{position:absolute;right:4%;top:6%;width:13%;aspect-ratio:10/14}
.leader.leave{animation:slideOut .5s steps(6) forwards}
@keyframes slideOut{to{transform:translateX(200%)}}

.msg{margin:12px;border:4px double var(--line);border-radius:8px;background:#fff;padding:12px 40px 12px 14px;min-height:62px;font-family:var(--pixel);font-size:clamp(9px,1.8vw,12px);line-height:1.8;position:relative;cursor:pointer}
.msg .more{position:absolute;right:14px;bottom:10px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--ink);animation:bob .8s steps(2) infinite;opacity:0}
.msg.done .more{opacity:1}
@keyframes bob{50%{transform:translateY(3px)}}

.qpanel{padding:0 12px 14px;display:flex;flex-direction:column;gap:10px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qhead .mv{font-family:var(--pixel);font-size:10px}
.qhead .hint{font-size:12.5px;color:var(--mute)}
.stem{margin:0;font-size:16px;max-width:70ch}
.chart{border:2px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.chart .ch{display:flex;justify-content:space-between;gap:10px;background:var(--ink);color:#fff;padding:5px 10px;font-family:var(--pixel);font-size:8px;line-height:1.6}
.chart .cr{display:grid;grid-template-columns:100px 1fr;border-top:1px solid #D7DCEA}
.chart .cr:first-of-type{border-top:0}
.chart .sys{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);padding:7px 10px;background:#F4F6FB}
.chart .fx{padding:7px 10px;font-size:14.5px}
.chart .cr.hid .fx{color:#A8AEC4;font-style:italic}
.chart .cr.new{animation:flash 1s}
@keyframes flash{from{background:#FFF1C4}}
.chart .cr.hist .sys{background:#FFF7DA}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:600px){.moves{grid-template-columns:1fr}}
.move{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;text-align:left;background:#fff;border:3px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14.5px;line-height:1.4;box-shadow:0 3px 0 var(--line)}
.move:hover{background:#FFF8DE}
.move:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.move .k{font-family:var(--pixel);font-size:9px;background:var(--ink);color:#fff;border-radius:4px;height:22px;display:grid;place-items:center}
.move.gone{opacity:.3;text-decoration:line-through;pointer-events:none}
.cmds{display:flex;gap:8px;flex-wrap:wrap}
.cmd{background:#fff;border:3px solid var(--line);border-radius:6px;padding:8px 12px;font-family:var(--pixel);font-size:9px;line-height:1.3}
.cmd:hover{background:#FFF8DE}
.cmd[disabled]{opacity:.4;pointer-events:none}
.cmd.examine{background:#EAF3FF}
.sub{border:2px dashed var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#fff}
.sub .opt{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.fb{display:flex;flex-direction:column;gap:10px}
.verdict{font-family:var(--pixel);font-size:11px;padding:9px 12px;border-radius:6px;border:3px solid}
.verdict.ok{background:var(--good-soft);border-color:var(--good);color:#0E4A2D}
.verdict.no{background:var(--bad-soft);border-color:var(--bad);color:#6B1B10}
.verdict.tr{background:var(--trap-soft);border-color:var(--trap);color:var(--trap)}
.ans{font-size:15px}
.ans b{font-weight:600}
.whys{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.whys small{display:block;color:var(--mute)}
.recall{font-size:15px}

/* ---------- lists / dex / party ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:#fff;border:3px solid var(--line);border-radius:6px;padding:7px 10px;font-family:var(--pixel);font-size:8.5px;line-height:1.3}
.tab[aria-pressed="true"]{background:var(--ink);color:#fff}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.dexe{background:#fff;border:2px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12px;line-height:1.25}
.dexe .spr{width:64px;height:72px}
.dexe .no{font-family:var(--mono);font-size:10px;color:var(--mute)}
.dexe.unseen{background:#EEF0F6;color:#8C93AE}
.dexe.caught{box-shadow:inset 0 0 0 2px var(--gold)}
.card{background:#fff;border:3px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:18px}
.lin{font-size:13px;color:var(--mute)}
.fx-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.fx-list li{display:grid;grid-template-columns:96px 1fr;gap:8px;font-size:14px;border-top:1px solid #E1E5EF;padding-top:6px}
.fx-list li span:first-child{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;color:var(--mute);letter-spacing:.04em}
.fx-list small{display:block;color:var(--mute)}
.party{display:flex;flex-direction:column;gap:8px}
.pm{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:10px;padding:8px 10px}
.pm .spr{width:56px;height:63px}
.pm.lead{box-shadow:0 0 0 3px var(--gold)}
.pm .nm{font-weight:600}
@media (max-width:480px){.pm{grid-template-columns:52px 1fr}.pm .act{grid-column:1/-1}}
.misslist{display:flex;flex-direction:column;gap:6px}
.missi{display:flex;justify-content:space-between;gap:10px;background:#fff;border:2px solid var(--line);border-radius:6px;padding:7px 10px;font-size:14px}
.missi b{font-family:var(--mono);color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-family:var(--pixel);font-size:9px;padding:10px 14px;border-radius:6px;border:2px solid var(--gold);z-index:20;line-height:1.6;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<script>
/* ===== Source data: Lesion Rounds I (unchanged) ===== */
const LR1=(function(){
/* ---------- Lesion atlas data ----------
   SIG: id -> [exam system, finding, why it happens]
   MINOR: true findings that are never used as the "expected" answer (conditional / subtle)
   NODES: lesions. own = its own findings, inc = lesions it contains, spared = classic "NOT seen" findings
*/
const SIG = {
 ga:["Sensory","Numbness over the angle of the mandible, the parotid region, and the earlobe","The great auricular n. (C2–C3) supplies skin over the parotid and lower ear."],
 lo:["Sensory","Numbness of the scalp just behind and above the ear","The lesser occipital n. (C2) ascends along the posterior SCM border to this skin."],
 tc:["Sensory","Numbness of the skin of the anterior neck","The transverse cervical n. (C2–C3) crosses the SCM to supply the anterior triangle skin."],
 sc:["Sensory","Numbness over the clavicle and the top of the shoulder","The supraclavicular nn. (C3–C4) fan out over the clavicle."],
 phr:["Motor","Paralysis of the hemidiaphragm on that side (elevated on X-ray, paradoxical movement on sniff test)","The phrenic n. (C3–C5) is the only motor supply to its half of the diaphragm."],
 ansa:["Motor","Weakness of the infrahyoid strap muscles (omohyoid, sternohyoid, sternothyroid)","The ansa cervicalis (C1–C3) supplies these hyoid/larynx depressors."],
 thy:["Motor","Weakness of the thyrohyoid alone, with the other strap muscles intact","Thyrohyoid gets C1 fibers that travel with CN XII and leave it beyond the ansa."],
 xi_scm:["Motor","Weakness turning the chin to the OPPOSITE side against resistance","The SCM (CN XI) turns the face to the opposite side."],
 xi_shrug:["Motor","Drooping shoulder and weak shoulder shrug","Trapezius (CN XI) elevates the scapula."],
 xi_abd:["Motor","Difficulty abducting the arm above 90°","Trapezius rotates the scapula upward, needed for overhead abduction."],

 o:[{t:"Submandibular ganglion",c:1},{t:"Chorda tympani",p:1},{t:"Otic ganglion"},{t:"Superior cervical ganglion"}],
 w:"The <b>submandibular ganglion</b>, suspended from the lingual nerve, holds the postganglionic cell bodies.",
 trap:"Chorda tympani is the trap — it is the <i>pre</i>ganglionic limb, and the stem asked for postganglionic. Read the prefix every time."},

{id:"m04",topic:"Autonomics",q:"During transnasal pituitary surgery a ganglion in the pterygopalatine fossa is inadvertently injured. What is most likely impaired?",
 o:[{t:"Lacrimation",c:1},{t:"Pupillary constrictor muscle",p:1},{t:"Parotid secretion"},{t:"Submandibular secretion"}],
 w:"The pterygopalatine ganglion supplies the <b>lacrimal gland</b> plus the nasal and palatine mucous glands.",
 trap:"Pupillary constrictor is the trap — that is ciliary. Anything about the eyelid would be CN III or sympathetics, not this ganglion."},

{id:"m05",topic:"Autonomics",q:"After T1 sympathetic ganglion ablation the patient has Horner syndrome. Preganglionic sympathetics to the indicated orbital structure would normally synapse where?",
 o:[{t:"Superior cervical ganglion",c:1},{t:"Ciliary ganglion",p:1},{t:"Otic ganglion"},{t:"Pterygopalatine ganglion"}],
 w:"All sympathetics to the head synapse in the <b>superior cervical ganglion</b>, then travel on arterial branches or hitch onto CN V.",
 trap:"The ciliary ganglion is the trap. Sympathetic fibres pass straight <i>through</i> it without synapsing — passing through is not synapsing."},

/* Larynx */
{id:"m06",topic:"Larynx & vagus",q:"A tag sits on the <em>cricothyroid muscle</em>. Which nerve innervates it?",
 o:[{t:"External branch of the superior laryngeal n.",c:1},{t:"Recurrent laryngeal n.",p:1},{t:"Internal branch of the superior laryngeal n."},{t:"Pharyngeal branch of CN X"}],
 w:"Cricothyroid is the lone intrinsic laryngeal muscle supplied by the <b>external laryngeal nerve</b>.",
 trap:"Recurrent laryngeal is the trap — it supplies every <i>other</i> intrinsic laryngeal muscle. This is the most reliably tested exception in the block."},

{id:"m07",topic:"Larynx & vagus",q:"After thyroidectomy a woman's voice is abnormally deep. Questioning reveals no hoarseness at all. Which nerve was damaged?",
 o:[{t:"External laryngeal n.",c:1},{t:"Recurrent laryngeal n.",p:1},{t:"Internal laryngeal n."},{t:"Inferior laryngeal n."}],
 w:"The <b>external laryngeal nerve</b>, injured alongside the superior thyroid artery at the superior pole. Loss of cricothyroid means loss of pitch range.",
 trap:"Recurrent laryngeal is the trap — but it would produce hoarseness, which the stem explicitly excludes. The absence of a finding is a clue."},

{id:"m08",topic:"Larynx & vagus",q:"During ligation of the <em>inferior</em> thyroid artery at the inferior pole of the thyroid, a nerve is transected. What is the most likely finding?",
 o:[{t:"Hoarseness from intrinsic laryngeal muscle paralysis",c:1},{t:"Loss of the afferent limb of the cough reflex",p:1},{t:"Decreased vocal pitch range from cricothyroid paralysis"},{t:"Anesthesia of laryngeal mucosa above the vocal folds"}],
 w:"The recurrent laryngeal nerve runs with the inferior thyroid artery at the inferior pole → <b>hoarseness</b>.",
 trap:"The cough-reflex option is the trap — that is the internal laryngeal nerve. Superior pole with the superior thyroid artery risks the external laryngeal nerve instead."},

{id:"m09",topic:"Larynx & vagus",q:"After resection of the external carotid artery a man chokes frequently and has lost sensation in the laryngeal vestibule above the vocal folds. Which nerve was cut?",
 o:[{t:"Internal laryngeal n.",c:1},{t:"Glossopharyngeal n.",p:1},{t:"Recurrent laryngeal n."},{t:"External laryngeal n."}],
 w:"The <b>internal laryngeal nerve</b> pierces the thyrohyoid membrane with the superior laryngeal artery and is the afferent limb of the cough reflex.",
 trap:"Glossopharyngeal is the trap — CN IX handles the oropharynx, not the laryngeal vestibule. Choking plus lost laryngeal sensation is internal laryngeal every time."},

{id:"m10",topic:"Larynx & vagus",q:"A tag sits in the tracheo-oesophageal groove on a nerve ascending toward the larynx. Damage here causes which finding?",
 o:[{t:"Hoarseness",c:1},{t:"Decreased vocal pitch range",p:1},{t:"Loss of the gag reflex"},{t:"Inability to elevate the shoulder"}],
 w:"That is the <b>recurrent laryngeal nerve</b> — paralysis of all intrinsic laryngeal muscles except cricothyroid gives hoarseness.",
 trap:"Decreased pitch range is the trap — that is external laryngeal, which runs with the superior thyroid artery, nowhere near the tracheo-oesophageal groove."},

/* Foramina */
{id:"m11",topic:"Foramina",q:"A tumour compressing the nerves at the indicated skull base opening produces difficulty swallowing and an absent gag reflex. Which opening?",
 o:[{t:"Jugular foramen",c:1},{t:"Hypoglossal canal",p:1},{t:"Internal acoustic meatus"},{t:"Stylomastoid foramen"}],
 w:"The <b>jugular foramen</b> transmits CN IX, X and XI — dysphagia and an absent gag follow.",
 trap:"Hypoglossal canal is the trap; a tongue-paralysis option is always offered alongside. Taste from the anterior two-thirds would point at CN VII instead."},

{id:"m12",topic:"Foramina",q:"Sharp shooting pain triggered by light touch between the lower eyelid and the upper lip. Forehead sensation, jaw strength and the corneal reflex are all normal. That division exits the skull through which foramen?",
 o:[{t:"Foramen rotundum",c:1},{t:"Foramen ovale",p:1},{t:"Superior orbital fissure"},{t:"Inferior orbital fissure"}],
 w:"Mid-face skin is V2, which exits via <b>foramen rotundum</b>. Standing Room Only: V1 superior orbital fissure, V2 rotundum, V3 ovale.",
 trap:"Foramen ovale is the trap — but normal jaw clenching and intact lower-lip sensation rule V3 out. The normal findings are doing the work."},

{id:"m13",topic:"Foramina",q:"A linear fracture over the pterion produces a biconvex, lens-shaped hyperdensity on CT. The bleeding vessel entered the cranium through which foramen?",
 o:[{t:"Foramen spinosum",c:1},{t:"Foramen lacerum",p:1},{t:"Foramen ovale"},{t:"Carotid canal"}],
 w:"The middle meningeal artery, a branch of the maxillary artery, enters via <b>foramen spinosum</b>.",
 trap:"Foramen lacerum is the trap — it sounds right and sits nearby, but nothing functionally traverses it in full. Rotundum, ovale, spinosum run medial to lateral on the greater wing."},

{id:"m14",topic:"Foramina",q:"Paralysis of the indicated muscle produces torticollis and a drooping shoulder. You should look for a lesion at which location?",
 o:[{t:"Jugular foramen",c:1},{t:"Stylomastoid foramen",p:1},{t:"Hypoglossal canal"},{t:"Foramen ovale"}],
 w:"Sternocleidomastoid and trapezius are CN XI, which leaves via the <b>jugular foramen</b>.",
 trap:"Stylomastoid is the trap — that is CN VII and facial expression. A superficial posterior-triangle laceration is the other classic cause of CN XI injury."},

/* Orbit */
{id:"m15",topic:"Orbit",q:"Which of the indicated extraocular muscles is innervated by CN IV?",
 o:[{t:"Superior oblique",c:1},{t:"Inferior oblique",p:1},{t:"Superior rectus"},{t:"Levator palpebrae superioris"}],
 w:"<b>Superior oblique</b> — identify it by the tendon passing through the trochlea at the superomedial orbital rim.",
 trap:"Inferior oblique is the trap: also an oblique, but it arises from the anterior orbital floor, has no trochlea, and is CN III. LR6, SO4, AO3."},

{id:"m16",topic:"Orbit",q:"To isolate and test the indicated muscle (superior oblique), you must first ask the patient to do which of the following?",
 o:[{t:"Adduct",c:1},{t:"Abduct",p:1},{t:"Elevate"},{t:"Extort"}],
 w:"<b>Adduct.</b> With the eye adducted, the obliques become pure vertical movers — SO depresses, IO elevates.",
 trap:"Abduct is the trap — correct for isolating the recti (SR elevates, IR depresses), wrong for the obliques. Reason from the H-test rule, don't recall."},

{id:"m17",topic:"Orbit",q:"Which action is lost with paralysis of the indicated muscle (levator palpebrae superioris)?",
 o:[{t:"Elevation of the eyelid",c:1},{t:"Elevation of the eye",p:1},{t:"Depression of the eyelid"},{t:"Abduction of the eye"}],
 w:"<b>Elevation of the eyelid.</b> Complete CN III palsy gives severe ptosis; the sympathetic superior tarsal muscle beneath it gives the mild ptosis of Horner syndrome.",
 trap:"Elevation of the eye is the trap — that is superior rectus, which sits immediately deep to LPS on a specimen and is easy to confuse."},

{id:"m18",topic:"Orbit",q:"A lesion at the indicated location abolishes the afferent limb of the pupillary light reflex. Which structure is it?",
 o:[{t:"Optic nerve (CN II)",c:1},{t:"Oculomotor nerve (CN III)",p:1},{t:"Nasociliary nerve"},{t:"Ciliary ganglion"}],
 w:"<b>CN II</b> carries the afferent limb; CN III carries the efferent limb.",
 trap:"CN III is the trap — efferent, not afferent. Do not confuse this with the <i>corneal</i> reflex, whose afferent is the nasociliary nerve of V1 and whose efferent is bilateral CN VII."},

/* V3 / ITF */
{id:"m19",topic:"V3 & infratemporal fossa",q:"A mandibular ramus fracture displaces into the infratemporal fossa; there is jaw pain and numbness of the lower lip and chin. Which indicated nerve was injured?",
 o:[{t:"Inferior alveolar n.",c:1},{t:"Lingual n.",p:1},{t:"Buccal n."},{t:"Auriculotemporal n."}],
 w:"The <b>inferior alveolar nerve</b>, heading for the mandibular foramen and emerging as the mental nerve at the chin and lower lip.",
 trap:"Lingual is the trap — it lies immediately anterior and would instead cause loss of sensation and taste on the anterior two-thirds of the tongue."},

{id:"m20",topic:"V3 & infratemporal fossa",q:"Which muscle is responsible for elevation <em>and retraction</em> of the indicated structure (the mandible)?",
 o:[{t:"Temporalis",c:1},{t:"Masseter",p:1},{t:"Medial pterygoid"},{t:"Lateral pterygoid"}],
 w:"<b>Temporalis</b> — its posterior fibres are the only retractors of the mandible.",
 trap:"Masseter is the trap: elevation yes, but protrusion rather than retraction. Elevation alone never separates these — the second verb decides it."},

{id:"m21",topic:"V3 & infratemporal fossa",q:"A mass in the infratemporal fossa causes loss of both general sensation <em>and</em> taste over the anterior two-thirds of the tongue. Which nerve?",
 o:[{t:"Lingual n.",c:1},{t:"Chorda tympani",p:1},{t:"Inferior alveolar n."},{t:"Hypoglossal n."}],
 w:"The <b>lingual nerve</b>, which carries V3 general sensation plus hitchhiking chorda tympani taste fibres.",
 trap:"Chorda tympani is the trap — it would take the taste but leave general sensation intact. Two deficits means the nerve carrying both."},

{id:"m22",topic:"V3 & infratemporal fossa",q:"The indicated artery runs with the inferior alveolar nerve into the mandible. It is a branch of which vessel?",
 o:[{t:"Maxillary a.",c:1},{t:"External carotid a.",p:1},{t:"Facial a."},{t:"Superficial temporal a."}],
 w:"The inferior alveolar artery is a branch of the <b>maxillary artery</b> within the infratemporal fossa.",
 trap:"External carotid is the trap — true at one remove, since the maxillary is its terminal branch. When a parent and a grandparent both appear, take the immediate one."},

/* Tongue / oral / pharynx */
{id:"m23",topic:"Tongue, oral & pharynx",q:"Which nerve provides motor innervation to the indicated muscle (palatoglossus)?",
 o:[{t:"CN X",c:1},{t:"CN XII",p:1},{t:"CN IX"},{t:"CN V3"}],
 w:"<b>CN X</b>, via the pharyngeal plexus. Palatoglossus is functionally a palatal muscle that happens to reach the tongue.",
 trap:"CN XII is the trap — it supplies every other tongue muscle, intrinsic and extrinsic. The lectures flag this exception three separate times."},

{id:"m24",topic:"Tongue, oral & pharynx",q:"A tumour at the indicated point in the tonsillar bed compresses CN IX. Which function is lost?",
 o:[{t:"General sensory and taste from the posterior third of the tongue",c:1},{t:"Motor innervation to the muscles of the oropharynx",p:1},{t:"Motor innervation to the tongue"},{t:"Taste from the anterior two-thirds of the tongue"}],
 w:"CN IX carries <b>general sensation and taste from the posterior third</b>, plus the afferent limb of the gag reflex.",
 trap:"Motor to the oropharynx is the trap — that is CN X. CN IX supplies exactly one muscle in the whole body: stylopharyngeus."},

{id:"m25",topic:"Tongue, oral & pharynx",q:"Which of the indicated structures on the lateral nasopharyngeal wall opens into the middle ear?",
 o:[{t:"Pharyngotympanic tube",c:1},{t:"Pharyngeal recess",p:1},{t:"Salpingopharyngeal fold"},{t:"Torus tubarius"}],
 w:"The <b>pharyngotympanic (Eustachian) tube</b>, whose ostium sits just anterior to the torus tubarius.",
 trap:"Pharyngeal recess is the trap — the fossa of Rosenmüller sits immediately posterior to the torus and leads nowhere. Anterior to the torus is the tube; posterior is the recess."},

/* Neck */
{id:"m26",topic:"Neck",q:"Iatrogenic injury to the ansa cervicalis would paralyse which of the indicated muscles?",
 o:[{t:"Sternohyoid",c:1},{t:"Thyrohyoid",p:1},{t:"Mylohyoid"},{t:"Stylohyoid"}],
 w:"The ansa supplies <b>sternohyoid</b>, sternothyroid and both bellies of omohyoid.",
 trap:"Thyrohyoid is the trap — a strap muscle, but innervated by C1 fibres travelling with CN XII. Mylohyoid is V3 and stylohyoid is CN VII."},

{id:"m27",topic:"Neck",q:"A lesion of the nerve supplying the indicated muscle (mylohyoid) would also affect which other muscle?",
 o:[{t:"Anterior belly of digastric",c:1},{t:"Posterior belly of digastric",p:1},{t:"Stylohyoid"},{t:"Thyrohyoid"}],
 w:"The nerve to mylohyoid, a branch of V3, supplies mylohyoid and the <b>anterior belly of digastric</b>.",
 trap:"Posterior belly is the trap — the two bellies of one muscle have different nerves, because they come from different pharyngeal arches. CN VII takes the posterior belly and stylohyoid."},

{id:"m28",topic:"Neck",q:"A biopsy is planned for a lesion over the angle of the mandible and mastoid region. Which nerve requires a block?",
 o:[{t:"Great auricular n.",c:1},{t:"Lesser occipital n.",p:1},{t:"Transverse cervical n."},{t:"Supraclavicular nn."}],
 w:"The <b>great auricular nerve</b> supplies the skin over the ear, angle of the mandible and mastoid.",
 trap:"Lesser occipital is the trap — also a cervical plexus branch, but its field is the scalp behind the ear. Transverse cervical covers anterior triangle skin; supraclavicular covers the clavicle."},

/* Face / nose */
{id:"m29",topic:"Face, nose & sinuses",q:"A tumour of the gland at the indicated location (parotid) will most likely cause an inability to do which of the following?",
 o:[{t:"Close the eyes",c:1},{t:"Open the eyes",p:1},{t:"Depress the jaw"},{t:"Protrude the tongue"}],
 w:"CN VII branches run through the parotid, so a parotid mass paralyses the muscles of facial expression — including orbicularis oculi, which <b>closes</b> the eye.",
 trap:"Open the eyes is the trap — that is levator palpebrae superioris and CN III, nowhere near the parotid."},

{id:"m30",topic:"Face, nose & sinuses",q:"Pus from an infected maxillary sinus drains into the nasal cavity through which structure?",
 o:[{t:"Semilunar hiatus",c:1},{t:"Ethmoid bulla",p:1},{t:"Sphenoethmoidal recess"},{t:"Inferior meatus"}],
 w:"The maxillary sinus opens into the <b>semilunar hiatus</b> of the middle meatus, alongside the frontal sinus and anterior ethmoid cells.",
 trap:"Ethmoid bulla is the trap — it is the middle ethmoid bulge sitting right beside the hiatus, not a maxillary drainage route. Inferior meatus takes the nasolacrimal duct only."},

{id:"m31",topic:"Face, nose & sinuses",q:"Significant bleeding from the anterior nasal septum after trauma. Which artery contributes to this region?",
 o:[{t:"Sphenopalatine a.",c:1},{t:"Angular a.",p:1},{t:"Middle meningeal a."},{t:"Deep temporal a."}],
 w:"<b>Sphenopalatine</b> — one of the five vessels of Kiesselbach's plexus, with the anterior and posterior ethmoidal, superior labial and greater palatine arteries.",
 trap:"Angular is the trap — the terminal branch of the facial artery, it supplies the <i>external</i> nose, not the septum."},

{id:"m32",topic:"Face, nose & sinuses",q:"A hockey player loses his sense of smell after a stick to the face. Which structure is directly associated with the olfactory nerve?",
 o:[{t:"Cribriform plate",c:1},{t:"Superior concha",p:1},{t:"Crista galli"},{t:"Perpendicular plate of the ethmoid"}],
 w:"Olfactory fibres pass through the olfactory foramina of the <b>cribriform plate</b> of the ethmoid.",
 trap:"Superior concha is the trap — the olfactory epithelium sits near it, but the nerve itself traverses the cribriform plate. Crista galli is the midline ridge above it, not a conduit."}
];

function mkLR(D,key,cfg,FX){
  const BY=Object.fromEntries(D.NODES.map(n=>[n.id,n]));
  let AV=new Set();const fresh=a=>[...a.filter(x=>!AV.has(x)),...a.filter(x=>AV.has(x))];
  const memo={};
  function signs(id){if(memo[id])return memo[id];const n=BY[id];const s=new Set(n.own||[]);(n.inc||[]).forEach(c=>{if(BY[c])signs(c).forEach(x=>s.add(x));});return memo[id]=s;}
  function keySigns(id){const n=BY[id];const mo=new Set(n.minorOwn||[]);return [...signs(id)].filter(x=>!D.MINOR.has(x)&&!mo.has(x)&&D.SIG[x]);}
  function subset(a,b){for(const x of a)if(!b.has(x))return false;return true;}
  function distractorNodes(T,clues,k){
    const ok=D.NODES.filter(n=>n.id!==T.id&&!clues.every(c=>signs(n.id).has(c)));
    const same=shuffle(ok.filter(n=>n.grp===T.grp)),other=shuffle(ok.filter(n=>n.grp!==T.grp));
    const share=n=>[...signs(n.id)].some(x=>signs(T.id).has(x));
    let pri=[...same.filter(share),...same.filter(n=>!share(n)),...shuffle(other.filter(share)),...other.filter(n=>!share(n))];
    pri=[...pri.filter(n=>!AV.has(n.name)),...pri.filter(n=>AV.has(n.name))];
    const seen=new Set([T.name]),out=[];
    for(const n of pri){if(out.length>=k)break;if(seen.has(n.name))continue;seen.add(n.name);out.push(n);}
    return out;
  }
  function distractorSigns(T,k){
    const mine=signs(T.id);const bad=s=>mine.has(s)||D.MINOR.has(s);
    const spared=shuffle((T.spared||[]).filter(s=>!bad(s)&&D.SIG[s]));
    const sameGrp=shuffle([...new Set(D.NODES.filter(n=>n.grp===T.grp&&n.id!==T.id).flatMap(n=>keySigns(n.id)))].filter(s=>!bad(s)));
    const any=shuffle(Object.keys(D.SIG).filter(s=>!bad(s)));
    const cand=[...spared,...sameGrp,...any];const ord=[...cand.filter(s=>!AV.has(D.SIG[s][1])),...cand.filter(s=>AV.has(D.SIG[s][1]))];
    const out=[];for(const s of ord){if(out.length>=k)break;if(!out.includes(s))out.push(s);}
    return out;
  }
  /* ---- nerve fact questions (fiber type, artery, muscles) ---- */
  const FXN=Object.keys(FX||{});
  const ARTS=[...new Set(Object.values(FACTS).flatMap(b=>Object.values(b)).filter(f=>f.a).map(f=>f.a[0]))];
  const ALLM=Object.keys(MUSC);
  function pickK(pool,k){return fresh(shuffle(pool)).slice(0,k);}
  function lin(T){const l=D.LINEAGE&&D.LINEAGE[T.id];return l?`<p class="small">${esc(l[1])}</p>`:'';}
  function musList(F){return `<ul class="whys">${F.m.map(k=>`<li><b>${esc(MUSC[k][0])}</b><small>${esc(MUSC[k][1])}</small></li>`).join('')}</ul>`;}
  const factQ={
    fiber(T){const F=FX&&FX[T.id];if(!F||!F.f)return null;const ans=FIB[F.f];const comp=new Set(ans[1]);
      const pool=Object.keys(FIB).filter(k=>k!==F.f&&!FIB[k][1].every(c=>comp.has(c))).map(k=>FIB[k][0]);
      const opts=shuffle([ans[0],...pickK(pool,3)]);
      return mk({type:'fiber',sig:'f',node:T.id,opts,ans:opts.indexOf(ans[0]),stem:`What kind of fibers does the <strong>${esc(T.name)}</strong> carry?`,
        explain:`<p class="ans">The ${esc(T.name)} carries: <b>${esc(ans[0])}</b>.</p>${lin(T)}${F.m?`<p class="small">Muscles it supplies:</p>${musList(F)}`:''}`});},
    artery(T){const F=FX&&FX[T.id];if(!F||!F.a)return null;
      const opts=shuffle([F.a[0],...pickK(ARTS.filter(a=>a!==F.a[0]),3)]);
      return mk({type:'artery',sig:'a',node:T.id,opts,ans:opts.indexOf(F.a[0]),stem:`Which artery travels with (or sits right beside) the <strong>${esc(T.name)}</strong>?`,
        explain:`<p class="ans"><b>${esc(F.a[0])}</b>: ${esc(F.a[1])}</p>`});},
    muscle(T,avoid){const F=FX&&FX[T.id];if(!F||!F.m)return null;const c=F.m.filter(k=>!(avoid&&avoid.has('m:'+k)));if(!c.length)return null;const k=pick(c);
      const mine=new Set(F.m.map(x=>MUSC[x][0]));const pool=ALLM.filter(x=>!mine.has(MUSC[x][0])).map(x=>MUSC[x][0]);
      const opts=shuffle([MUSC[k][0],...pickK(pool,3)]);
      return mk({type:'muscle',sig:'m:'+k,node:T.id,opts,ans:opts.indexOf(MUSC[k][0]),stem:`Which of these muscles does the <strong>${esc(T.name)}</strong> supply?`,
        explain:`<p class="ans">The ${esc(T.name)} supplies:</p>${musList(F)}`});},
    mfunc(T,avoid){const F=FX&&FX[T.id];if(!F||!F.m)return null;const c=F.m.filter(k=>!(avoid&&avoid.has('mf:'+k)));if(!c.length)return null;const k=pick(c);
      const grp=MUSC[k][2];const pool=[...new Set(ALLM.filter(x=>MUSC[x][2]!==grp).map(x=>MUSC[x][1]))];
      const opts=shuffle([MUSC[k][1],...pickK(pool,3)]);
      return mk({type:'mfunc',sig:'mf:'+k,node:T.id,opts,ans:opts.indexOf(MUSC[k][1]),stem:`The <strong>${esc(T.name)}</strong> supplies <strong>${esc(MUSC[k][0])}</strong>. What does that muscle do?`,
        explain:`<p class="ans"><b>${esc(MUSC[k][0])}</b>: ${esc(MUSC[k][1])}.</p>`});},
    roots(T){const F=FX&&FX[T.id];if(!F||!F.r)return null;
      const pool=['C1','C2','C2–C3','C3–C4','C3–C5','C1–C3','C4–C5','C2–C4','C1–C2'].filter(x=>x!==F.r);
      const opts=shuffle([F.r,...pickK(pool,3)]);
      return mk({type:'roots',sig:'rt',node:T.id,opts,ans:opts.indexOf(F.r),stem:`Which spinal cord levels give rise to the <strong>${esc(T.name)}</strong>?`,
        explain:`<p class="ans">The ${esc(T.name)} comes from <b>${esc(F.r)}</b>.</p>${lin(T)}`});},
    exit(T){const F=FX&&FX[T.id];if(!F||!F.x)return null;
      const pool=[...new Set(Object.values(FACTS).flatMap(b=>Object.values(b)).filter(f=>f.x&&f.x!==F.x).map(f=>f.x))];
      const opts=shuffle([F.x,...pickK(pool,3)]);
      return mk({type:'exit',sig:'ex',node:T.id,opts,ans:opts.indexOf(F.x),stem:`Where does the <strong>${esc(T.name)}</strong> leave the skull, or where do you find it?`,
        explain:`<p class="ans"><b>${esc(F.x)}</b>.</p>${lin(T)}`});},
    whonerve(T,avoid){const F=FX&&FX[T.id];if(!F||!F.m)return null;const c=F.m.filter(k=>!(avoid&&avoid.has('w:'+k)));if(!c.length)return null;const k=pick(c);
      const others=FXN.filter(id=>id!==T.id&&BY[id]&&!((FX[id].m||[]).includes(k))).map(id=>BY[id]);
      const same=others.filter(n=>n.grp===T.grp),rest=others.filter(n=>n.grp!==T.grp);
      const sm=shuffle(same).map(n=>n.name),rs=shuffle(rest).map(n=>n.name);const names=[...new Set([...sm.filter(n=>!AV.has(n)),...rs.filter(n=>!AV.has(n)),...sm,...rs])].filter(n=>n!==T.name).slice(0,3);
      if(names.length<3)return null;const opts=shuffle([T.name,...names]);
      return mk({type:'whonerve',sig:'w:'+k,node:T.id,opts,ans:opts.indexOf(T.name),stem:`Which nerve supplies <strong>${esc(MUSC[k][0])}</strong>?`,
        explain:`<p class="ans"><b>${esc(MUSC[k][0])}</b> (${esc(MUSC[k][1].charAt(0).toLowerCase()+MUSC[k][1].slice(1))}) is supplied by the <b>${esc(T.name)}</b>.</p>`});}
  };
  const SF=(SIDE_FOR[key]||{});
  function under(id,target,seen=new Set()){if(id===target)return true;if(seen.has(id))return false;seen.add(id);const n=BY[id];return !!(n&&(n.inc||[]).some(c=>under(c,target,seen)));}
  const EXACT=new Set(['sd_aorta','sd2_hoarse','sd2_baro']); // stems that name a specific cause
  function sideFits(tid,T){const tg=SF[tid]||[];return EXACT.has(tid)?tg.includes(T.id):tg.some(target=>under(T.id,target));}
  function owner(sig){const n=D.NODES.find(n=>(n.own||[]).includes(sig));return n?n.name:null;}
  const phrase=T=>T.kind==='site'?`A lesion at the <strong>${esc(T.name)}</strong>`:`A lesion of the <strong>${esc(T.name)}</strong>`;
  const mk=(o)=>Object.assign({bank:key,miss:`${key}:n:${o.node}`},o);
  return {
    key,D,BY,signs,keySigns,cfg,FX,setAvoid:s=>{AV=s||new Set();},...factQ,hasFacts:T=>!!(FX&&FX[T.id]),
    typeOf:n=>n.kind==='site'||n.grp==='site'?'FORAMEN':cfg.types[n.grp],
    case(T){
      const key_=keySigns(T.id);if(!key_.length)return null;const all=signs(T.id);let clues=null;
      for(let t=0;t<40;t++){const c=shuffle(key_).slice(0,Math.min(4,key_.length));
        const narrower=D.NODES.some(n=>n.id!==T.id&&subset(c,signs(n.id))&&signs(n.id).size<all.size&&subset(signs(n.id),all));clues=c;if(!narrower)break;}

        opts:opts.map(n=>n.name),ans:opts.indexOf(T),stem:'Which single lesion explains ALL of these findings?',
        explain:`<ul class="whys">${clues.map(s=>`<li>${esc(D.SIG[s][1])}<small>${esc(D.SIG[s][2])}</small></li>`).join('')}</ul>`});
    },
    predict(T,avoid){
      const k=keySigns(T.id).filter(x=>!(avoid&&avoid.has('x:'+x)));if(!k.length)return null;const right=pick(k);const d=distractorSigns(T,3);if(d.length<3)return null;
      const opts=shuffle([right,...d]);
      return mk({type:'predict',sig:'pred',used:['x:'+right],node:T.id,opts:opts.map(s=>D.SIG[s][1]),ans:opts.indexOf(right),stem:`${phrase(T)}. ${pick(['Which finding would you expect?','Which of these findings fits this lesion?','Which finding does this patient have?'])}`,
        explain:`<p class="ans">${esc(D.SIG[right][2])}</p>`});
    },
    spared(T){
      const k=keySigns(T.id);if(k.length<3)return null;const yes=shuffle(k).slice(0,3);const no=distractorSigns(T,1)[0];if(!no)return null;

        explain:`<p class="ans">That finding is not part of this lesion${who&&who!==T.name?` — it points to the <b>${esc(who)}</b>`:''}. ${esc(D.SIG[no][2])}</p>`});

    reverse(T,avoid){

      if(d.length<3)return null;const opts=shuffle([T,...d]);
      return mk({type:'reverse',sig:'r:'+x,used:['x:'+x],node:T.id,opts:opts.map(n=>n.name),ans:opts.indexOf(T),
        stem:`A patient's only complaint: <strong>${esc(D.SIG[x][1])}</strong>. Which of these lesions would cause it?`,
        explain:`<p class="ans">${esc(D.SIG[x][2])}</p>`});
    },
    side(grp,T,avoid){
      // only ask a "Which side?" pattern that this lesion actually produces
      let pool=D.SIDE.filter(t=>sideFits(t.id,T)&&!(avoid&&avoid.has('d:'+t.id)));if(!pool.length)return null;
      const t=pick(pool);const s=t.fixed||(Math.random()<.5?'left':'right');const [ni,side]=t.ans(s);

    sideById(id){const t=D.SIDE.find(x=>x.id===id);return t;}

}

function nextQuestion(e){
  if(e.forcedTrap){const q=trapQ(e.forcedTrap);e.forcedTrap=null;if(q)return q;}
  if(e.loc&&!e.hidden&&(LOC_BONUS[e.loc]||[]).length&&Math.random()<.28){
    B.bonusUsed=B.bonusUsed||new Set();G.bonusSeen=G.bonusSeen||{};const pool=LOC_BONUS[e.loc].filter(id=>!B.bonusUsed.has(id));
    if(pool.length){const unseen=pool.filter(id=>!G.bonusSeen[id]);const id=pick(unseen.length?unseen:pool);B.bonusUsed.add(id);G.bonusSeen[id]=1;const q=trapQ(id);if(q)return q;}}
  if(AUTH[e.bank])return authNext(e);
  if(e.bank==='trap'){
    if(e.forced){const q=trapQ(e.forced);e.forced=null;if(q)return q;}
    if(!e.pool.length)e.pool=shuffle(TRAP_TOPICS.flatMap(topicItems));
    return trapQ(e.pool.pop());
  }
  if(e.bank==='mus')return musNext(e);
  const b=BANK[e.bank],T=b.BY[e.node];
  if(e.forced){const tpl=b.sideById(e.forced);e.forced=null;if(tpl){
      const s=tpl.fixed||(Math.random()<.5?'left':'right');const [ni,side]=tpl.ans(s);const cap=x=>x[0].toUpperCase()+x.slice(1);const opts=[];tpl.nerve.forEach(n=>['left','right'].forEach(sd=>opts.push(`${cap(sd)} ${n.charAt(0).toLowerCase()+n.slice(1)}`)));
      return {bank:e.bank,type:'side',tpl:tpl.id,node:T.id,miss:`${e.bank}:s:${tpl.id}`,opts,ans:ni*2+(side==='left'?0:1),stem:tpl.f(s),explain:`<p class="ans">${esc(tpl.why)}</p>`};}}
  e.asked=e.asked||new Set();e.seenOpts=e.seenOpts||new Set();b.setAvoid(e.seenOpts);
  const track=q=>{if(q){e.asked.add(q.sig);(q.used||[]).forEach(u=>e.asked.add(u));q.opts.forEach(o=>e.seenOpts.add(o));}b.setAvoid(null);return q;};
  if(e.hidden){const q=b.case(T);if(q)return track(q);e.hidden=false;}
  const lesionTypes=['predict','spared','reverse','side'],factTypes=['fiber','artery','muscle','mfunc','whonerve','roots','exit'];
  const last=e.lastKind;

}

function musNext(e){
  const T=MUS.BY[e.node];e.asked=e.asked||new Set();e.seenOpts=e.seenOpts||new Set();MUS.setAvoid(e.seenOpts);
  const track=q=>{if(q){e.asked.add(q.sig);q.opts.forEach(o=>e.seenOpts.add(o));}MUS.setAvoid(null);return q;};
  if(e.hidden){const q=MUS.case(T);if(q)return track(q);e.hidden=false;}
  for(let t=0;t<30;t++){const ty=pick(MUS.TYPES);const q=MUS[ty](T);if(q&&!e.asked.has(q.sig))return track(q);}

async function battle(cfg){

function dmgMult(e,q){
  const pT=SP[B.pm.sp].t,eT=SP[e.sp].t;let m=1+(B.pm.lvl-5)*.03;let eff=false;

async function fight(){

        if(eff)await say("It's super effective!",600);

        if(q.type==='case'&&e.hidden){e.hidden=false;seen(e.sp,'seen');const svg=document.getElementById('emon');svg.innerHTML=spriteSVG(e.sp,{cls:'mon e'});redrawEnemyBox();await say(`${e.bank==='mus'||AUTH[e.bank]?'It is the':'The wild lesion is the'} ${SP[e.sp].name}!`,900);}

        await say(r.i<0?`${SP[B.pm.sp].name} hesitated…`:`${SP[B.pm.sp].name} used ${mvPair(q)[0]}… but it missed!`,600);
        if(trapPick){G.stats.traps++;await say(`${eName(e)} sprang a TRAP CARD! You took the bait!`,800);await enemyAttack(wrongFrac()+.12,'Trap Card');}

}

async function tryCatch(e){
  const already=G.dex[e.sp]==='caught';
  if(already){await say(`${SP[e.sp].name} is already registered as caught.`,800);return;}
  if(G.items.orb<1){await say('No Neuro Orbs left — beat a gym leader to restock.',900);return;}
  const qp=document.getElementById('qp');
  const want=await new Promise(res=>{qp.innerHTML=`<div class="sub"><div class="h2">Throw a Neuro Orb?</div><div class="small">Answer one catch question to seal it. Orbs left: ${G.items.orb}</div><div class="row"><button class="btn gold" id="yes">Throw &gt;</button><button class="btn ghost" id="no">Let it go</button></div></div>`;
    document.getElementById('yes').onclick=()=>{qp.innerHTML='';res(true);};document.getElementById('no').onclick=()=>{qp.innerHTML='';res(false);};});
  if(!want)return;
  G.items.orb--;
  // re-show the fainted foe for the throw
  document.getElementById('emon').innerHTML=spriteSVG(e.sp,{cls:'mon e'});
  const sc=document.getElementById('scene');const orb=document.createElement('div');orb.className='orb';orb.innerHTML=ORB;sc.appendChild(orb);
  await sleep(700);document.getElementById('emon').innerHTML='';orb.classList.add('wobble');
  await say('The orb is wobbling… answer to seal the catch!',500);
  let ok=false;
  const rcs=(LOC_RECALL[e.loc]||[]).map(id=>TH.RECALL.find(r=>r.id===id)).filter(Boolean);
  if(e.bank!=='trap'&&rcs.length&&Math.random()<.35){ok=await recallCatch(pick(rcs));}
  else if(e.bank==='trap'){
    const pool=TH.RECALL.filter(r=>r.topic===e.topic);
    if(pool.length){ok=await recallCatch(pick(pool));}
    else{const q=trapQ(pick(TH.PAIRS).id);ok=await catchQ(q,e);}
  }else if(e.bank==='mus'){const T=MUS.BY[e.node];const asked=e.asked||new Set();let q=null;MUS.setAvoid(e.seenOpts);
    for(let t=0;t<30&&!q;t++){const c=MUS[pick(MUS.TYPES)](T);if(c&&!asked.has(c.sig))q=c;}MUS.setAvoid(null);q=q||MUS.mpar(T);ok=await catchQ(q,e);
  }else if(AUTH[e.bank]){const A=AUTH[e.bank],S=A.BY[e.node];const asked=e.asked||new Set();let q=null;A.setAvoid(e.seenOpts);
    for(let t=0;t<30&&!q;t++){const c=A[pick(A.TYPES)](S,asked);if(c&&!asked.has(c.sig))q=c;}A.setAvoid(null);q=q||A.rev(S)||A.identify(S);ok=q?await catchQ(q,e):true;
  }else{const b=BANK[e.bank],T=b.BY[e.node];const asked=e.asked||new Set();let q=null;
    b.setAvoid(e.seenOpts);for(let t=0;t<30&&!q;t++){const c=pick([()=>b.spared(T),()=>b.reverse(T,asked),()=>b.side(T.grp,T,asked),()=>b.predict(T,asked)])();if(c&&!asked.has(c.sig)&&!(c.used||[]).some(u=>asked.has(u)))q=c;}b.setAvoid(null);
    q=q||b.spared(T)||b.reverse(T)||b.predict(T);ok=q?await catchQ(q,e):true;}
  if(ok){orb.style.animation='none';await say(`Gotcha! ${SP[e.sp].name} was caught!`,1000,true);
    G.party.push(newMon(e.sp,Math.max(3,e.lvl-2)));seen(e.sp,'caught');G.stats.caught++;
    await say(`${SP[e.sp].name}'s Nervedex entry is complete.`,800);}
  else{orb.remove();document.getElementById('emon').innerHTML=spriteSVG(e.sp,{cls:'mon e'});await say('Oh no! It broke free and ran away!',900,true);}
}
async function catchQ(q,e){
  const r=await new Promise(res=>{const qp=document.getElementById('qp');
    qp.innerHTML=`<div class="qhead"><span class="mv">SEAL THE CATCH</span><span class="hint">One try</span></div><p class="stem">${q.stem}</p>
      <div class="moves">${q.opts.map((o,i)=>`<button class="move" data-i="${i}"><span class="k">${LET[i]}</span><span>${q.type==='pair'||q.type==='mcq'?o:esc(o)}</span></button>`).join('')}</div>`;

  const ok=r===q.ans;if(ok){G.stats.right++;decMiss(q.miss);}else{G.stats.wrong++;addMiss(q.miss);}

}

    ${rec.length?`<h3 style="font-size:15px">Recall cards</h3><ol class="whys">${rec.join('')}</ol>`:''}</div>`;}
function areaQuestions(a){
  const items=(LOC_BONUS[a]||[]).map(id=>TRAP_BY_ID[id]).filter(Boolean).map(e=>{if(e.kind==='pair'){const p=e.it;return `<li>${esc(p.clue)}<br><b>Answer: ${esc(p.correct?p.b:p.a)}</b><small>${esc(p.w)}</small></li>`;}
    const m=e.it,c=m.o.find(o=>o.c),t=m.o.find(o=>o.p);return `<li>${m.q}<br><b>Answer: ${c.t}</b>${t?` · <span style="color:var(--trap)">Trap: ${t.t}</span>`:''}<small>${m.w}</small></li>`;});
  const rec=(LOC_RECALL[a]||[]).map(id=>TH.RECALL.find(r=>r.id===id)).filter(Boolean).map(r=>`<li>${r.q}<small>${r.a}</small></li>`);
  if(!items.length&&!rec.length)return '';
  return `<details class="card"><summary style="cursor:pointer;font-weight:600">Trap Hunter questions that live in ${esc(AREAS[a].name)} (${items.length+rec.length})</summary><ol class="whys" style="margin-top:10px">${items.join('')}${rec.join('')}</ol></details>`;}
let studySel=null;
function renderStudy(sel){
  if(sel!==undefined)studySel=sel;
  const caught=Object.keys(G.dex).filter(k=>G.dex[k]==='caught'&&SP[k]&&!k.startsWith('st:'));
  let detail='';
  if(studySel&&SP[studySel]&&caught.includes(studySel)){const s=SP[studySel];
    detail=`<div class="row" style="justify-content:space-between"><div class="row" style="gap:10px">${spriteSVG(studySel,{cls:'spr'}).replace('class="spr"','class="spr" style="width:56px;height:63px"')}<div><div class="h2">${esc(s.name)}</div>${tchip(s.t)}</div></div><button class="btn ghost" id="closeS">Close</button></div>${cardFor(studySel,false)}`;}
  const placed=new Set();
  const groups=Object.keys(AREAS).map(a=>{const ks=caught.filter(k=>areaKeys(a).includes(k)&&!placed.has(k));ks.forEach(k=>placed.add(k));return [AREAS[a].name,ks,a];});
  const retired=caught.filter(k=>!placed.has(k));if(retired.length)groups.push(['Retired Neuromon (from the old routes)',retired,null]);
  app.innerHTML=`<div class="pane"><div class="row" style="justify-content:space-between"><div class="h1">Review</div><button class="btn ghost" id="back">&lt; Map</button></div>
    <p class="lede">Every Neuromon you've caught, with its full anatomy, pathway or lesion review. Tap one to study it.</p>
    <div id="sdetail" style="display:flex;flex-direction:column;gap:12px">${detail}</div>
    ${caught.length?groups.map(([label,ks,a])=>{if(!ks.length)return '';
      return `<div class="h2">${esc(label)} <span class="small">(${ks.length})</span></div><div class="dexgrid">${ks.map(k=>`<button class="dexe caught" data-k="${k}" ${k===studySel?'style="box-shadow:0 0 0 3px var(--gold)"':''}>${spriteSVG(k)}<span>${esc(SP[k].name)}</span></button>`).join('')}</div>${a?areaQuestions(a):''}`;}).join('')
      :'<div class="box">Nothing caught yet. Win a wild battle, then throw a Neuro Orb to catch it.</div>'}</div>`;
  document.getElementById('back').onclick=()=>go('map');
  const c=document.getElementById('closeS');if(c)c.onclick=()=>renderStudy(null);
  app.querySelectorAll('.dexe[data-k]').forEach(b=>b.onclick=()=>{renderStudy(b.dataset.k);window.scrollTo({top:0,behavior:'smooth'});});
}
function renderReview(){
  const ks=Object.keys(G.missed).sort((a,b)=>G.missed[b]-G.missed[a]);
  app.innerHTML=`<div class="pane"><div class="row" style="justify-content:space-between"><div class="h1">Weak Spots</div><button class="btn ghost" id="back">&lt; Map</button></div>
    <p class="lede">Every miss lands here. Rematch battles pull up to six of them; each correct answer knocks one off the list.</p>
    ${ks.length?`<div class="row"><button class="btn gold" id="rm">Rematch weak spots &gt;</button><span class="small">${ks.length} item${ks.length===1?'':'s'} queued</span></div>
    <div class="misslist">${ks.map(k=>`<div class="missi"><span>${esc(missLabel(k))}</span><b>×${G.missed[k]}</b></div>`).join('')}</div>`:'<div class="box">No misses queued. Go find some trouble in the tall grass!</div>'}</div>`;
  document.getElementById('back').onclick=()=>go('map');
  const rm=document.getElementById('rm');if(rm)rm.onclick=startReview;
}

/* ================= boot ================= */
G=load();
if(G)go('map');else go('title');
})();
</script>
