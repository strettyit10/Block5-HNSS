function nextQuestion(e){
  if(e.forcedTrap){const q=trapQ(e.forcedTrap);e.forcedTrap=null;if(q)return q;}
  const bkey=B&&B.kind==='champ'?'champ':(e.loc==='champ'&&e.bank!=='trap')?'none':(e.bank==='rg'&&e.loc==='gang')?'rg':e.bank==='rx'?'rx':e.loc;
  if(bkey&&!e.hidden&&(LOC_BONUS[bkey]||[]).length&&Math.random()<(bkey==='champ'?.35:.28)){
    B.bonusUsed=B.bonusUsed||new Set();G.bonusSeen=G.bonusSeen||{};const pool=LOC_BONUS[bkey].filter(id=>!B.bonusUsed.has(id));
    if(pool.length){const unseen=pool.filter(id=>!G.bonusSeen[id]);const id=pick(unseen.length?unseen:pool);B.bonusUsed.add(id);G.bonusSeen[id]=1;const q=trapQ(id);if(q)return q;}}
  if(AUTH[e.bank])return authNext(e);
  if(e.bank==='trap'){
    if(e.forced){const q=trapQ(e.forced);e.forced=null;if(q)return q;}
    if(!e.pool.length)e.pool=shuffle(TRAP_TOPICS.flatMap(topicItems));
    return trapQ(e.pool.pop());
  }
  if(e.bank==='mus')return musNext(e);
  const b=BANK[e.bank],T=b.BY[e.node];
  if(e.forced){const tpl=b.sideById(e.forced);e.forced=null;if(tpl){
      const s=tpl.fixed||(Math.random()<.5?'left':'right');const [ni,side]=tpl.ans(s);const cap=x=>x[0].toUpperCase()+x.slice(1);const opts=[];tpl.nerve.forEach(n=>['left','right'].forEach(sd=>opts.push(`${cap(sd)} ${n.charAt(0).toLowerCase()+n.slice(1)}`)));
      return {bank:e.bank,type:'side',tpl:tpl.id,node:T.id,miss:`${e.bank}:s:${tpl.id}`,opts,ans:ni*2+(side==='left'?0:1),stem:tpl.f(s),explain:`<p class="ans">${esc(tpl.why)}</p>`};}}
  e.asked=e.asked||new Set();e.seenOpts=e.seenOpts||new Set();b.setAvoid(e.seenOpts);
  const track=q=>{if(q){e.asked.add(q.sig);(q.used||[]).forEach(u=>e.asked.add(u));q.opts.forEach(o=>e.seenOpts.add(o));}b.setAvoid(null);return q;};

function musNext(e){
  const T=MUS.BY[e.node];e.asked=e.asked||new Set();e.seenOpts=e.seenOpts||new Set();MUS.setAvoid(e.seenOpts);
  const track=q=>{if(q){e.asked.add(q.sig);q.opts.forEach(o=>e.seenOpts.add(o));}MUS.setAvoid(null);return q;};
  if(e.hidden){const q=MUS.case(T);if(q)return track(q);e.hidden=false;}
  const has=pre=>[...e.asked].some(s=>s===pre||s.startsWith(pre+':'));
  for(const [pre,ty] of [['nv','mnerve'],['mv','mmove'],['lm','mland']]){if(!has(pre)){const q=MUS[ty](T,e.asked);if(q&&!e.asked.has(q.sig))return track(q);}}
  for(let t=0;t<40;t++){const ty=pick(MUS.TYPES);const q=MUS[ty](T,e.asked);if(q&&!e.asked.has(q.sig))return track(q);}
  e.exhausted=true;MUS.setAvoid(null);return MUS.mnerve(T);
}

        await enemyAttack(.1,'Distract');if(B.pm.hp<=0){const s=await faintSwitch();if(s==='lose')return 'lose';}continue;

      const ok=r.i===q.ans;const trapPick=q.trapIdx>=0&&r.i===q.trapIdx;
      if(ok){
        G.stats.right++;decMiss(q.miss);
        const {m,eff}=dmgMult(e,q);const dmg=e.exhausted?e.hp:Math.round(40*m);
        await say(`${SP[B.pm.sp].name} used ${mvPair(q)[0]}!`,450);
        await anim('#pmon .mon','lunge',350);anim('#emon .mon','hit',500);
        e.hp=Math.max(0,e.hp-dmg);updBars();await sleep(600);
        if(q.type==='case'&&q.shown===1)await say('A critical hit! Named on the first finding!',700);
        else if(q.type==='case'&&q.shown<=2)await say('Sharp localization — bonus damage!',600);
        if(eff)await say("It's super effective!",600);
        if(e.exhausted&&e.hp<=0)await say(`${SP[e.sp].name} has no findings left to hide. A finishing blow!`,700);
        if(q.type==='case'&&e.hidden){e.hidden=false;seen(e.sp,'seen');const svg=document.getElementById('emon');svg.innerHTML=spriteSVG(e.sp,{cls:'mon e'});redrawEnemyBox();await say(`${e.bank==='mus'||AUTH[e.bank]?'It is the':'The wild lesion is the'} ${SP[e.sp].name}!`,900);}
        await gainXP(Math.round(8*(B.kind==='wild'?1:1.5)));
        await feedback(true,q,r.i,e);
      }else{
        G.stats.wrong++;addMiss(q.miss);
        await say(r.i<0?`${SP[B.pm.sp].name} hesitated…`:`${SP[B.pm.sp].name} used ${mvPair(q)[0]}… but it missed!`,600);
        if(trapPick){G.stats.traps++;await say(`${eName(e)} sprang a TRAP CARD! You took the bait!`,800);await enemyAttack(wrongFrac()+.12,'Trap Card');}
        else await enemyAttack(wrongFrac());
        const wasHidden=q.type==='case'&&e.hidden;
        if(wasHidden){e.hidden=false;seen(e.sp,'seen');document.getElementById('emon').innerHTML=spriteSVG(e.sp,{cls:'mon e'});redrawEnemyBox();}
        await feedback(false,q,r.i,e);
        if(wasHidden)await say(`It was the ${SP[e.sp].name}! Now battle it with what you know about it.`,900);
        if(B.pm.hp<=0){const s=await faintSwitch();if(s==='lose')return 'lose';}
      }
      q=null;
    }
    if(e.hp<=0){
      await anim('#emon .mon','faint',650);
      if(e.hidden){e.hidden=false;}
      seen(e.sp,'seen');
      await say(`${B.kind==='wild'?'The wild ':''}${SP[e.sp].name} fainted!`,700);
      await gainXP(B.kind==='wild'?14:22);
      if(B.kind==='wild'){await rewards();await tryCatch(e);return 'win';}
      if(B.ei<B.enemies.length-1){
        B.ei++;const n=B.enemies[B.ei];
        document.getElementById('emon').innerHTML=spriteSVG(n.sp,{cls:'mon e enter',sil:n.hidden});redrawEnemyBox();
        const tb=document.querySelector('.tbadge');if(tb)tb.innerHTML=B.enemies.map(x=>`<i class="${x.hp>0?'alive':'dead'}"></i>`).join('');
        await say(B.gym?`${GYMS[B.gym].leader} sent out ${eName(n)}!`:`Next up: ${eName(n)}!`,800);
        continue;
      }
      return 'win';
    }
  }
}

async function tryCatch(e){
  const already=G.dex[e.sp]==='caught';
  if(already){await say(`${SP[e.sp].name} is already registered as caught.`,800);return;}
  if(G.items.orb<1){await say('No Neuro Orbs left — beat a gym leader to restock.',900);return;}
  const qp=document.getElementById('qp');
  const want=await new Promise(res=>{qp.innerHTML=`<div class="sub"><div class="h2">Throw a Neuro Orb?</div><div class="small">Answer one catch question to seal it. Orbs left: ${G.items.orb}</div><div class="row"><button class="btn gold" id="yes">Throw &gt;</button><button class="btn ghost" id="no">Let it go</button></div></div>`;
    document.getElementById('yes').onclick=()=>{qp.innerHTML='';res(true);};document.getElementById('no').onclick=()=>{qp.innerHTML='';res(false);};});
  if(!want)return;
  G.items.orb--;
  // re-show the fainted foe for the throw
  document.getElementById('emon').innerHTML=spriteSVG(e.sp,{cls:'mon e'});
  const sc=document.getElementById('scene');const orb=document.createElement('div');orb.className='orb';orb.innerHTML=ORB;sc.appendChild(orb);
  await sleep(700);document.getElementById('emon').innerHTML='';orb.classList.add('wobble');
  await say('The orb is wobbling… answer to seal the catch!',500);
  let ok=false;
  const rcs=((e.bank==='rg'&&e.loc==='gang')?[]:(LOC_RECALL[e.loc]||[])).map(id=>TH.RECALL.find(r=>r.id===id)).filter(Boolean);
  if(e.bank!=='trap'&&rcs.length&&Math.random()<.35){ok=await recallCatch(pick(rcs));}
  else if(e.bank==='trap'){
    const pool=TH.RECALL.filter(r=>r.topic===e.topic);
    if(pool.length){ok=await recallCatch(pick(pool));}
    else{const q=trapQ(pick(TH.PAIRS).id);ok=await catchQ(q,e);}
  }else if(e.bank==='mus'){const T=MUS.BY[e.node];const asked=e.asked||new Set();let q=null;MUS.setAvoid(e.seenOpts);
    for(let t=0;t<30&&!q;t++){const c=MUS[pick(MUS.TYPES)](T,asked);if(c&&!asked.has(c.sig))q=c;}MUS.setAvoid(null);q=q||MUS.mpar(T);ok=await catchQ(q,e);
  }else if(AUTH[e.bank]){const A=AUTH[e.bank],S=A.BY[e.node];const asked=e.asked||new Set();let q=null;A.setAvoid(e.seenOpts);
    if(e.bank==='rx')for(const f of ['resp','eff','aff','trig']){if(!q&&![...asked].some(s=>s.startsWith(f+':')))q=A['s_'+f](S,asked);}
    for(let t=0;t<30&&!q;t++){const c=A[pick(A.TYPES)](S,asked);if(c&&!asked.has(c.sig))q=c;}A.setAvoid(null);q=q||A.rev(S)||A.identify(S);ok=q?await catchQ(q,e):true;
  }else{const b=BANK[e.bank],T=b.BY[e.node];const asked=e.asked||new Set();let q=null;
    b.setAvoid(e.seenOpts);for(let t=0;t<30&&!q;t++){const c=pick([()=>b.spared(T),()=>b.reverse(T,asked),()=>b.side(T.grp,T,asked),()=>b.predict(T,asked)])();if(c&&!asked.has(c.sig)&&!(c.used||[]).some(u=>asked.has(u)))q=c;}b.setAvoid(null);
    q=q||b.spared(T)||b.reverse(T)||b.predict(T);ok=q?await catchQ(q,e):true;}
  if(ok){orb.style.animation='none';await say(`Gotcha! ${SP[e.sp].name} was caught!`,1000,true);
    G.party.push(newMon(e.sp,Math.max(3,e.lvl-2)));seen(e.sp,'caught');G.stats.caught++;
    await say(`${SP[e.sp].name}'s Nervedex entry is complete.`,800);}
  else{orb.remove();document.getElementById('emon').innerHTML=spriteSVG(e.sp,{cls:'mon e'});await say('Oh no! It broke free and ran away!',900,true);}
}

      <div class="moves">${q.opts.map((o,i)=>`<button class="move" data-i="${i}"><span class="k">${LET[i]}</span><span>${q.type==='pair'||q.type==='mcq'?o:esc(o)}</span></button>`).join('')}</div>`;

function cardFor(key,compact){const s=SP[key];if(!s)return '';

  if(s.bank==='trap')return compact?'':trapReview(s.topic);
  if(s.bank==='lr1'||s.bank==='lr2')return lrCard(s.bank,s.node,compact)+(compact?'':factsBlock(s.bank,s.node));
  return '';}
/* ordered, nested listing of one patch: parents first, their branches indented beneath */
function patchTree(p,pk){
  const keys=p.sp.filter(k=>SP[k]);const idx=Object.fromEntries(keys.map((k,i)=>[k,i]));
  const parentOf=k=>{const s=SP[k];
    if(AUTH[s.bank]&&s.bank!=='gg'&&s.bank!=='fo'){const S=AUTH[s.bank].BY[s.node];const pk=S&&S.parent?`${s.bank}:${S.parent}`:null;return pk&&pk in idx?pk:null;}
    if(s.bank==='lr1'||s.bank==='lr2'){const par=keys.find(o=>o!==k&&SP[o].bank===s.bank&&(BANK[s.bank].BY[SP[o].node].inc||[]).includes(s.node));return par||null;}
    return null;};
  const par=Object.fromEntries(keys.map(k=>[k,parentOf(k)]));
  const out=[];const seenK=new Set();
  const walk=(k,d)=>{if(seenK.has(k))return;seenK.add(k);out.push({k,d});keys.filter(c=>par[c]===k).sort((a,b)=>idx[a]-idx[b]).forEach(c=>walk(c,d+1));};
  keys.filter(k=>!par[k]).forEach(k=>walk(k,0));keys.forEach(k=>walk(k,0));
  // muscles: sub-group by the class that fits this patch, in a fixed teaching order
  if(keys.length&&SP[keys[0]].bank==='mus'){
    const PC={eom:['Extraocular muscle'],tongue:['Intrinsic tongue muscle','Extrinsic tongue muscle'],palate:['Soft palate muscle'],face:['Muscle of facial expression'],mom:['Muscle of mastication'],
      lxi:['Intrinsic laryngeal muscle'],supra:['Extrinsic laryngeal: suprahyoid'],infra:['Extrinsic laryngeal: infrahyoid (strap)'],pharynx:['Pharyngeal constrictor','Longitudinal pharyngeal muscle'],neck:['Superficial neck muscle','Scalene muscle']};
    const LZ='Lesions & clinical pictures';const order=[...(PC[pk]||[]),LZ];
    const grp=k=>{if(SP[k].bank!=='mus')return LZ;const m=MUS.BY[SP[k].node];return order.find(c=>m.cls.includes(c))||(pk==='tongue'?'Extrinsic tongue muscle':order[0]||m.cls[0]);};
    const groups=order.filter(g=>keys.some(k=>grp(k)===g));
    if(groups.length<2)return keys.map(k=>({k,d:0}));
    return groups.flatMap(g=>[{head:g},...keys.filter(k=>grp(k)===g).map(k=>({k,d:0}))]);}
  return out;
}
function dexSub(k){const s=SP[k];
  if(s.bank==='gg'){const S=AUTH.gg.BY[s.node];return GROLE[S.role].split(':')[0].split(' (')[0];}
  if(s.bank==='rg')return AUTH.rg.BY[s.node].kind;
  if(s.bank==='vb')return VDIV[AUTH.vb.BY[s.node].div];
  if(s.bank==='ml')return 'Muscle lesion / clinical';
  if(s.bank==='rx')return 'Reflex arc';
  if(s.bank==='fo')return FOSSA[AUTH.fo.BY[s.node].fossa].replace(' (face, jaw, temporal bone)','');
  return '';}
function renderDex(sel){
  const tabs=Object.fromEntries(Object.entries(AREAS).map(([k,a])=>[k,a.name]));
  if(!AREAS[dexTab])dexTab='cn';
  const A=AREAS[dexTab];const keys=areaKeys(dexTab);const d=dexProgress(keys);
  const num={};keys.forEach((k,i)=>num[k]=i+1);
  let detail='';
  if(sel&&G.dex[sel]){detail=cardFor(sel,false);if(detail)detail=`<div id="dexdetail">${detail}</div>`;}
  const row=(k,dep)=>{const st=G.dex[k];const sub=st?dexSub(k):'';
    return `<button class="dexrow ${st?st:'unseen'}" data-k="${k}" ${st?'':'disabled'} style="--d:${dep}">
      ${dep?'<span class="twig" aria-hidden="true">└</span>':''}${spriteSVG(k,{sil:!st})}<span class="no">#${String(num[k]).padStart(3,'0')}</span>
      <span class="dn">${esc(SP[k].name)}${sub?`<small>${esc(sub)}</small>`:''}</span>${st==='caught'?'<span class="tag">caught</span>':st?'<span class="tag seen">seen</span>':''}</button>`;};
  const body=Object.entries(A.patches).map(([pk,p])=>{const tree=patchTree(p,pk);const pd=dexProgress(p.sp.filter(k=>SP[k]));
    return `<section class="dexpatch"><div class="dexhead">${tchip(p.type)}<span class="h2">${esc(p.label)}</span><span class="small">Caught ${pd.c} · Seen ${pd.s} · of ${pd.n}</span></div>
      <div class="dexlist">${tree.map(t=>t.head?`<div class="dexsub">${esc(t.head)}</div>`:row(t.k,t.d)).join('')}</div></section>`;}).join('');
  app.innerHTML=`<div class="pane"><div class="row" style="justify-content:space-between"><div class="h1">Nervedex</div><button class="btn ghost" id="back">&lt; Map</button></div>
    <div class="tabs">${Object.entries(tabs).map(([k,v])=>`<button class="tab" data-t="${k}" aria-pressed="${k===dexTab}">${v}</button>`).join('')}</div>
    <div class="small">${esc(A.name)}: seen ${d.s} · caught ${d.c} · of ${d.n}. Grouped by patch, with branches nested under their parent. Grey entries haven't been met yet; tap any seen entry for its full card.</div>
    ${detail}${body}</div>`;
  document.getElementById('back').onclick=()=>go('map');
  app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{dexTab=b.dataset.t;renderDex();});
  app.querySelectorAll('.dexrow[data-k]').forEach(b=>b.onclick=()=>{renderDex(b.dataset.k);const el=document.getElementById('dexdetail');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});});
}
function missLabel(k){const [b,kind,id]=k.split(':');
  if(b==='trap'){const e=TRAP_BY_ID[kind];if(!e)return k;return e.kind==='pair'?`Pair: ${e.it.a} vs ${e.it.b}`:`${e.it.topic}: ${strip(e.it.q).slice(0,90)}${strip(e.it.q).length>90?'…':''}`;}
  const area=key=>{const a=Object.keys(AREAS).find(x=>areaKeys(x).includes(key));return a?AREAS[a].name:'Retired';};
  if(kind==='n'){const key=`${b}:${id}`;return SP[key]?`${area(key)} · ${SP[key].name}`:k;}
  const t=BANK[b]&&BANK[b].sideById(id);return `Which side? ${t?t.nerve[0]:id}`;}
function factsBlock(bank,id){const F=(FACTS[bank]||{})[id];if(!F)return '';
  const row=(k,v)=>`<li><span>${k}</span><span>${v}</span></li>`;let r='';
  if(F.f)r+=row('Fibers',esc(FIB[F.f][0]));
  if(F.r)r+=row('Spinal levels',esc(F.r));
  if(F.x)r+=row('Exit / where',esc(F.x));
  if(F.a)r+=row('Artery',`${esc(F.a[0])}<small>${esc(F.a[1])}</small>`);
  if(F.m)r+=row('Supplies',F.m.filter(k=>MUSC[k]).map(k=>`<b>${esc(MUSC[k][0])}</b>: ${esc(MUSC[k][1])}`).join('<br>'));
  return r?`<div class="card"><h3 style="font-size:15px">Nerve anatomy</h3><ul class="fx-list">${r}</ul></div>`:'';}
function trapReview(topic){
  const items=topic==='Confusable pairs'?TH.PAIRS.filter((p,i,arr)=>arr.findIndex(x=>x.a===p.a&&x.b===p.b)===i).map(p=>`<li><b>${esc(p.a)}</b> vs <b>${esc(p.b)}</b><small>${esc(p.w)}</small></li>`)
    :TH.MCQ.filter(m=>m.topic===topic).map(m=>{const c=m.o.find(o=>o.c),t=m.o.find(o=>o.p);return `<li>${m.q}<br><b>Answer: ${c.t}</b>${t?` · <span style="color:var(--trap)">Trap: ${t.t}</span>`:''}<small>${m.w}</small></li>`;});
  const rec=TH.RECALL.filter(r=>r.topic===topic).map(r=>`<li>${r.q}<small>${r.a}</small></li>`);
  return `<div class="card"><h3 style="font-size:15px">${esc(topic)}: every question and its trap</h3><ol class="whys">${items.join('')}</ol>
    ${rec.length?`<h3 style="font-size:15px">Recall cards</h3><ol class="whys">${rec.join('')}</ol>`:''}</div>`;}
function areaQuestions(a){
  const items=[...(LOC_BONUS[a]||[]),...(a==='gang'?(LOC_BONUS.rg||[]):[])].map(id=>TRAP_BY_ID[id]).filter(Boolean).map(e=>{if(e.kind==='pair'){const p=e.it;return `<li>${esc(p.clue)}<br><b>Answer: ${esc(p.correct?p.b:p.a)}</b><small>${esc(p.w)}</small></li>`;}
    const m=e.it,c=m.o.find(o=>o.c),t=m.o.find(o=>o.p);return `<li>${m.q}<br><b>Answer: ${c.t}</b>${t?` · <span style="color:var(--trap)">Trap: ${t.t}</span>`:''}<small>${m.w}</small></li>`;});
  const rec=(LOC_RECALL[a]||[]).map(id=>TH.RECALL.find(r=>r.id===id)).filter(Boolean).map(r=>`<li>${r.q}<small>${r.a}</small></li>`);
  if(!items.length&&!rec.length)return '';
  return `<details class="card"><summary style="cursor:pointer;font-weight:600">Trap Hunter questions that live in ${esc(AREAS[a].name)} (${items.length+rec.length})</summary><ol class="whys" style="margin-top:10px">${items.join('')}${rec.join('')}</ol></details>`;}
let studySel=null;
function renderStudy(sel){
  if(sel!==undefined)studySel=sel;
  const caught=Object.keys(G.dex).filter(k=>G.dex[k]==='caught'&&SP[k]&&!k.startsWith('st:'));
  let detail='';
  if(studySel&&SP[studySel]&&caught.includes(studySel)){const s=SP[studySel];
    detail=`<div class="row" style="justify-content:space-between"><div class="row" style="gap:10px">${spriteSVG(studySel,{cls:'spr'}).replace('class="spr"','class="spr" style="width:56px;height:63px"')}<div><div class="h2">${esc(s.name)}</div>${tchip(s.t)}</div></div><button class="btn ghost" id="closeS">Close</button></div>${cardFor(studySel,false)}`;}
  const placed=new Set();
  const groups=Object.keys(AREAS).map(a=>{const ks=caught.filter(k=>areaKeys(a).includes(k)&&!placed.has(k));ks.forEach(k=>placed.add(k));return [AREAS[a].name,ks,a];});
  const retired=caught.filter(k=>!placed.has(k));if(retired.length)groups.push(['Retired Neuromon (from the old routes)',retired,null]);
  app.innerHTML=`<div class="pane"><div class="row" style="justify-content:space-between"><div class="h1">Review</div><button class="btn ghost" id="back">&lt; Map</button></div>
    <p class="lede">Every Neuromon you've caught, with its full anatomy, pathway or lesion review. Tap one to study it.</p>
    <div id="sdetail" style="display:flex;flex-direction:column;gap:12px">${detail}</div>
    ${caught.length?groups.map(([label,ks,a])=>{if(!ks.length)return '';
      return `<div class="h2">${esc(label)} <span class="small">(${ks.length})</span></div><div class="dexgrid">${ks.map(k=>`<button class="dexe caught" data-k="${k}" ${k===studySel?'style="box-shadow:0 0 0 3px var(--gold)"':''}>${spriteSVG(k)}<span>${esc(SP[k].name)}</span></button>`).join('')}</div>${a?areaQuestions(a):''}`;}).join('')
      :'<div class="box">Nothing caught yet. Win a wild battle, then throw a Neuro Orb to catch it.</div>'}</div>`;
  document.getElementById('back').onclick=()=>go('map');
  const c=document.getElementById('closeS');if(c)c.onclick=()=>renderStudy(null);
  app.querySelectorAll('.dexe[data-k]').forEach(b=>b.onclick=()=>{renderStudy(b.dataset.k);window.scrollTo({top:0,behavior:'smooth'});});
}

  document.getElementById('back').onclick=()=>go('map');
