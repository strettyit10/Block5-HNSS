<meta charset="utf-8">
<title>Neuromon HNSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Press+Start+2P&display=swap">
<style>
/* Single deliberate look: a handheld console. Painted explicitly so it holds on light or dark hosts. */
:root{
  color-scheme: dark;
  --shell:#1E2440; --shell2:#262E52; --shell-line:#3A4470; --shell-ink:#E9ECF7; --shell-mute:#A3AACB;
  --screen:#F3F7EE; --ink:#1B2033; --mute:#5B6280; --line:#1B2033;
  --sky:#D6ECDF; --sky2:#BFE0CE; --grass:#8CC06A; --grass2:#6FA553; --pad:#B9D89A; --pad2:#9BC47C;
  --gold:#E3AE12; --gold-ink:#7A5B00;
  --good:#1E8A57; --good-soft:#DCF2E6; --bad:#C2412F; --bad-soft:#F8E1DC; --trap:#96313B; --trap-soft:#F8E8E9;
  --hp-hi:#38B26A; --hp-mid:#E3AE12; --hp-lo:#D9442F; --xp:#3E8FE0;
  --hy-bg:#FFF4C2; --hy-line:#D4A300; --hy-ink:#4A3A00;
  --pixel:"Press Start 2P","Courier New",monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--shell);color:var(--shell-ink)}
body{font:15px/1.55 var(--body);margin:0;padding-inline:16px;padding-block:14px 40px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.px{font-family:var(--pixel);letter-spacing:.02em}
.mast{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--pixel);font-size:11px;color:var(--shell-mute);line-height:1.8}
.brand b{color:var(--gold)}
.brand a{color:var(--shell-mute)}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.hbtn{background:var(--shell2);border:2px solid var(--shell-line);border-radius:6px;padding:7px 10px;font-family:var(--pixel);font-size:9px;color:var(--shell-ink);line-height:1.4}
.hbtn:hover{border-color:var(--gold)}
.hbtn b{color:var(--gold)}
.screen{background:var(--screen);color:var(--ink);border:4px solid #0F1326;border-radius:14px;box-shadow:0 0 0 4px var(--shell-line),0 16px 40px #0008;overflow:hidden}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--pixel);font-size:8.5px;color:var(--shell-mute);line-height:1.8}

/* ---------- generic in-screen UI ---------- */
.pane{padding:18px;display:flex;flex-direction:column;gap:14px}
.h1{font-family:var(--pixel);font-size:clamp(18px,4vw,28px);line-height:1.3;margin:0;text-wrap:balance}
.h2{font-family:var(--pixel);font-size:13px;line-height:1.5;margin:0}
.lede{margin:0;color:var(--mute);max-width:62ch}
.box{border:3px solid var(--line);border-radius:8px;background:#fff;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px #C9CFE0;padding:14px 16px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:11px 16px;font-family:var(--pixel);font-size:10px;line-height:1.4;box-shadow:0 3px 0 #000}
.btn:hover{background:#2E3659}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn.gold{background:var(--gold);color:#241A00}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink),0 3px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tchip{display:inline-block;font-family:var(--pixel);font-size:8px;line-height:1;padding:4px 6px;border-radius:3px;color:#fff;vertical-align:middle}
.small{font-size:13px;color:var(--mute)}
.hy{background:var(--hy-bg);border:2px solid var(--hy-line);border-radius:6px;padding:10px 12px;color:var(--hy-ink);font-size:14px}
.hy b{display:block;font-family:var(--pixel);font-size:8.5px;letter-spacing:.04em;margin-bottom:6px}
.trapbox{background:var(--trap-soft);border:2px solid var(--trap);border-radius:6px;padding:10px 12px;font-size:14px;color:#4A1419}
.trapbox b.lab{display:block;font-family:var(--pixel);font-size:8.5px;color:var(--trap);margin-bottom:6px}

/* ---------- title ---------- */
.title{background:linear-gradient(180deg,var(--sky) 0 58%,var(--grass) 58% 100%);position:relative}
.title .pane{gap:16px}
.logo{font-family:var(--pixel);font-size:clamp(26px,7vw,52px);line-height:1.05;color:var(--ink);text-shadow:3px 3px 0 var(--gold);margin:0}
.logo small{display:block;font-size:.3em;margin-top:10px;text-shadow:none;color:var(--mute)}
.starters{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.starter{background:#fff;border:3px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left}
.starter:hover,.starter[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}
.starter .spr{width:96px;height:108px;align-self:center}
.starter h3{font-family:var(--pixel);font-size:11px;margin:0}
.starter p{margin:0;font-size:13px;color:var(--mute)}
.namefield{display:flex;flex-direction:column;gap:6px;max-width:320px}
.namefield label{font-family:var(--pixel);font-size:9px}
.namefield input{font:inherit;border:3px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff;color:var(--ink)}

/* ---------- map ---------- */
.map{position:relative;aspect-ratio:100/62;max-width:100%;background:
  radial-gradient(circle at 20% 30%,#9ACB76 0 6%,transparent 6.5%),
  radial-gradient(circle at 70% 80%,#9ACB76 0 5%,transparent 5.5%),
  repeating-linear-gradient(0deg,transparent 0 11px,#0000000a 11px 12px),
  repeating-linear-gradient(90deg,transparent 0 11px,#0000000a 11px 12px),var(--grass);
  border-bottom:4px solid var(--line)}
.map svg.paths{position:absolute;inset:0;width:100%;height:100%}
.pond{position:absolute;left:66%;top:6%;width:14%;height:20%;background:#6FB6DC;border:3px solid #3E7FA6;border-radius:48% 52% 45% 55%}
.tree{position:absolute;width:3.2%;aspect-ratio:1;background:#3F7F3A;border:2px solid #1F4A22;border-radius:50% 50% 45% 45%}
.loc{position:absolute;transform:translate(-50%,-60%);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0}
.loc .ico{width:clamp(38px,8vw,64px);aspect-ratio:1}
.loc .lbl{font-family:var(--pixel);font-size:clamp(6.5px,1.4vw,9px);background:#fff;border:2px solid var(--line);border-radius:4px;padding:3px 5px;white-space:nowrap;line-height:1.3}
.loc .lbl em{display:block;font-style:normal;color:var(--mute);font-size:.85em}
.loc[disabled]{cursor:not-allowed;filter:grayscale(.9);opacity:.75}
.loc:hover .lbl{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.avatar{position:absolute;width:clamp(20px,4vw,34px);transform:translate(-50%,-100%);transition:left .55s steps(6),top .55s steps(6);pointer-events:none;z-index:3}
@media (max-width:600px){.map{aspect-ratio:100/100}}
.mapfoot{padding:14px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{border:2px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff}
.stat .k{font-family:var(--pixel);font-size:8px;color:var(--mute)}
.stat .v{font-family:var(--mono);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.badges{display:flex;gap:6px;margin-top:4px}
.badge{width:22px;height:22px}

/* ---------- route ---------- */
.patches{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.patch{text-align:left;background:
  repeating-linear-gradient(135deg,var(--grass) 0 6px,var(--grass2) 6px 8px);border:3px solid var(--line);border-radius:10px;padding:0;overflow:hidden;display:flex;flex-direction:column}
.patch .in{background:#fff;margin-top:26px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--line);flex:1}
.patch h3{margin:0;font-size:15px;font-weight:600}
.patch:hover{box-shadow:0 0 0 3px var(--gold)}
.meter{height:8px;border:2px solid var(--line);border-radius:4px;background:#E8ECF4;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.gymcard{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border:3px solid var(--line);border-radius:10px;padding:14px;background:#fff}
.gymcard .trn{width:64px;height:88px}
@media (max-width:520px){.gymcard{grid-template-columns:1fr}.gymcard .trn{justify-self:center}}

/* ---------- battle ---------- */
.scene{position:relative;aspect-ratio:16/9;max-width:100%;background:linear-gradient(180deg,var(--sky) 0 52%,var(--sky2) 52% 60%,var(--grass) 60% 100%);overflow:hidden;border-bottom:4px solid var(--line)}
.scene.gym{background:linear-gradient(180deg,#E6E1F4 0 52%,#CFC6EA 52% 60%,#B7A9DE 60% 100%)}
.scene.cave{background:linear-gradient(180deg,#D9D2C6 0 52%,#C3B8A6 52% 60%,#A8987F 60% 100%)}
.plat{position:absolute;border-radius:50%;background:var(--pad);border:3px solid var(--pad2)}
.plat.e{right:6%;top:40%;width:34%;height:13%}
.plat.p{left:4%;bottom:4%;width:40%;height:15%}
.scene.gym .plat,.scene.cave .plat{background:#fff8;border-color:#0002}
.mon{position:absolute;image-rendering:pixelated}
.mon.e{right:12%;top:8%;width:22%;aspect-ratio:16/18}
.mon.p{left:9%;bottom:8%;width:28%;aspect-ratio:16/18}
.mon.e.enter{animation:slideE .7s steps(8) both}
.mon.p.enter{animation:slideP .6s steps(8) both}
@keyframes slideE{from{transform:translateX(160%)}to{transform:none}}
@keyframes slideP{from{transform:translateX(-160%)}to{transform:none}}
.mon.hit{animation:blink .5s steps(2) 2}
@keyframes blink{50%{opacity:.1}}
.mon.e.leave{animation:slideOut .5s steps(6) forwards}
.mon.faint{animation:faint .6s ease-in forwards}
@keyframes faint{to{transform:translateY(60%);opacity:0}}
.mon.lunge.p{animation:lungeP .35s ease-out}
.mon.lunge.e{animation:lungeE .35s ease-out}
@keyframes lungeP{50%{transform:translate(18%,-10%)}}
@keyframes lungeE{50%{transform:translate(-18%,10%)}}
.scene.shake{animation:shake .35s steps(4)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.orb{position:absolute;width:7%;aspect-ratio:1;left:30%;bottom:30%;z-index:4;animation:throw .7s ease-out forwards}
@keyframes throw{to{left:73%;bottom:62%}}
.orb.wobble{left:73%;bottom:62%;animation:wob .5s ease-in-out 3}
@keyframes wob{25%{transform:rotate(-20deg)}75%{transform:rotate(20deg)}}
.stbox{position:absolute;background:#fff;border:3px solid var(--line);border-radius:8px 8px 8px 0;padding:6px 9px;min-width:0;width:44%;box-shadow:4px 4px 0 #0002}
.stbox.e{left:3%;top:5%}
.stbox.p{right:3%;bottom:6%;border-radius:8px 0 8px 8px}
.stbox .nm{font-family:var(--pixel);font-size:clamp(7px,1.5vw,10px);line-height:1.35;display:flex;justify-content:space-between;gap:8px}
.stbox .nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stbox .nm span:last-child{flex:none}
.hpline{display:flex;align-items:center;gap:6px;margin-top:5px}
.hpline .lab{font-family:var(--pixel);font-size:7px;color:var(--gold-ink);background:#FFF1C4;padding:2px 3px;border-radius:2px}
.hpbar{flex:1;height:8px;border:2px solid var(--line);border-radius:4px;background:#E8ECF4;overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--hp-hi);transition:width .6s steps(12),background .3s}
.hpnum{font-family:var(--mono);font-size:clamp(10px,1.8vw,13px);text-align:right;font-variant-numeric:tabular-nums;margin-top:2px}
.xpbar{height:4px;background:#E8ECF4;margin-top:4px;border-radius:2px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--xp);transition:width .6s}
.tbadge{position:absolute;right:3%;top:5%;display:flex;gap:4px}
.tbadge i{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:#fff}
.tbadge i.dead{background:#9aa0b4}
.tbadge i.alive{background:var(--gold)}
.leader{position:absolute;right:4%;top:6%;width:13%;aspect-ratio:10/14}
.leader.leave{animation:slideOut .5s steps(6) forwards}
@keyframes slideOut{to{transform:translateX(200%)}}

.msg{margin:12px;border:4px double var(--line);border-radius:8px;background:#fff;padding:12px 40px 12px 14px;min-height:62px;font-family:var(--pixel);font-size:clamp(9px,1.8vw,12px);line-height:1.8;position:relative;cursor:pointer}
.msg .more{position:absolute;right:14px;bottom:10px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--ink);animation:bob .8s steps(2) infinite;opacity:0}
.msg.done .more{opacity:1}
@keyframes bob{50%{transform:translateY(3px)}}

.qpanel{padding:0 12px 14px;display:flex;flex-direction:column;gap:10px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qhead .mv{font-family:var(--pixel);font-size:10px}
.qhead .hint{font-size:12.5px;color:var(--mute)}
.stem{margin:0;font-size:16px;max-width:70ch}
.chart{border:2px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.chart .ch{display:flex;justify-content:space-between;gap:10px;background:var(--ink);color:#fff;padding:5px 10px;font-family:var(--pixel);font-size:8px;line-height:1.6}
.chart .cr{display:grid;grid-template-columns:100px 1fr;border-top:1px solid #D7DCEA}
.chart .cr:first-of-type{border-top:0}
.chart .sys{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);padding:7px 10px;background:#F4F6FB}
.chart .fx{padding:7px 10px;font-size:14.5px}
.chart .cr.hid .fx{color:#A8AEC4;font-style:italic}
.chart .cr.new{animation:flash 1s}
@keyframes flash{from{background:#FFF1C4}}
.chart .cr.hist .sys{background:#FFF7DA}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:600px){.moves{grid-template-columns:1fr}}
.move{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;text-align:left;background:#fff;border:3px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14.5px;line-height:1.4;box-shadow:0 3px 0 var(--line)}
.move:hover{background:#FFF8DE}
.move:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.move .k{font-family:var(--pixel);font-size:9px;background:var(--ink);color:#fff;border-radius:4px;height:22px;display:grid;place-items:center}
.move.gone{opacity:.3;text-decoration:line-through;pointer-events:none}
.cmds{display:flex;gap:8px;flex-wrap:wrap}
.cmd{background:#fff;border:3px solid var(--line);border-radius:6px;padding:8px 12px;font-family:var(--pixel);font-size:9px;line-height:1.3}
.cmd:hover{background:#FFF8DE}
.cmd[disabled]{opacity:.4;pointer-events:none}
.cmd.examine{background:#EAF3FF}
.sub{border:2px dashed var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#fff}
.sub .opt{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.fb{display:flex;flex-direction:column;gap:10px}
.verdict{font-family:var(--pixel);font-size:11px;padding:9px 12px;border-radius:6px;border:3px solid}
.verdict.ok{background:var(--good-soft);border-color:var(--good);color:#0E4A2D}
.verdict.no{background:var(--bad-soft);border-color:var(--bad);color:#6B1B10}
.verdict.tr{background:var(--trap-soft);border-color:var(--trap);color:var(--trap)}
.ans{font-size:15px}
.ans b{font-weight:600}
.whys{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.whys small{display:block;color:var(--mute)}
.recall{font-size:15px}

/* ---------- lists / dex / party ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:#fff;border:3px solid var(--line);border-radius:6px;padding:7px 10px;font-family:var(--pixel);font-size:8.5px;line-height:1.3}
.tab[aria-pressed="true"]{background:var(--ink);color:#fff}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.dexe{background:#fff;border:2px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12px;line-height:1.25}
.dexe .spr{width:64px;height:72px}
.dexe .no{font-family:var(--mono);font-size:10px;color:var(--mute)}
.dexe.unseen{background:#EEF0F6;color:#8C93AE}
.dexe.caught{box-shadow:inset 0 0 0 2px var(--gold)}
.card{background:#fff;border:3px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:18px}
.lin{font-size:13px;color:var(--mute)}
.fx-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.fx-list li{display:grid;grid-template-columns:96px 1fr;gap:8px;font-size:14px;border-top:1px solid #E1E5EF;padding-top:6px}
.fx-list li span:first-child{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;color:var(--mute);letter-spacing:.04em}
.fx-list small{display:block;color:var(--mute)}
.party{display:flex;flex-direction:column;gap:8px}
.pm{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:10px;padding:8px 10px}
.pm .spr{width:56px;height:63px}
.pm.lead{box-shadow:0 0 0 3px var(--gold)}
.pm .nm{font-weight:600}
@media (max-width:480px){.pm{grid-template-columns:52px 1fr}.pm .act{grid-column:1/-1}}
.dexpatch{display:flex;flex-direction:column;gap:6px}
.dexhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:3px solid var(--line);padding-bottom:6px}
.dexlist{display:flex;flex-direction:column;gap:4px}
.dexsub{font-family:var(--pixel);font-size:8.5px;color:var(--mute);margin:6px 0 2px;letter-spacing:.03em}
.dexrow{margin-left:calc(var(--d,0)*22px);display:grid;grid-template-columns:auto 38px 44px 1fr auto;align-items:center;gap:8px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:6px;padding:4px 8px;font-size:14px;line-height:1.25;max-width:calc(100% - 0px)}
.dexrow .spr{width:32px;height:36px}
.dexrow .no{font-family:var(--mono);font-size:10px;color:var(--mute)}
.dexrow .dn small{display:block;color:var(--mute);font-size:11.5px}
.dexrow .twig{font-family:var(--mono);color:var(--mute)}
.dexrow:not(:has(.twig)){grid-template-columns:38px 44px 1fr auto}
.dexrow.unseen{background:#EEF0F6;color:#8C93AE}
.dexrow.caught{box-shadow:inset 0 0 0 2px var(--gold)}
.dexrow .tag{font-family:var(--pixel);font-size:7px;background:var(--gold);color:#241A00;border-radius:3px;padding:3px 5px}
.dexrow .tag.seen{background:#9DB4D8;color:#1B2033}
@media (max-width:520px){.dexrow{margin-left:calc(var(--d,0)*12px)}.dexrow .twig{display:none}.dexrow{grid-template-columns:38px 36px 1fr!important}.dexrow .tag{grid-column:3}}
.misslist{display:flex;flex-direction:column;gap:6px}
.missi{display:flex;justify-content:space-between;gap:10px;background:#fff;border:2px solid var(--line);border-radius:6px;padding:7px 10px;font-size:14px}
.missi b{font-family:var(--mono);color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-family:var(--pixel);font-size:9px;padding:10px 14px;border-radius:6px;border:2px solid var(--gold);z-index:20;line-height:1.6;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<div class="wrap">
  <div class="mast">
    <div class="brand"><span id="hublink"></span><b>HoyaDocs</b> · HNSS Block 5 · Neuromon</div>
    <div class="hud" id="hud" hidden></div>
  </div>
  <main class="screen" id="app" aria-live="polite"></main>
  <footer class="foot"><span>HoyaDocs · Neuromon: HNSS Edition · built from Lesion Rounds I &amp; II, Trap Hunter &amp; the HNSS structure lists</span><span>Rev 22 · Updated Sep 24, 2026</span></footer>
</div>

<script>

{id:"lingual",grp:"trig",name:"Lingual nerve distal to the lingual + chorda tympani junction",cause:"Lower third-molar extraction or a floor-of-mouth lesion.",own:["ling_sens"],inc:["chorda"],spared:["ian_teeth","xii_dev"],pearl:"Distal lingual n. lesion: touch AND taste lost on the anterior 2/3 of the tongue."},
{id:"buccal_v3",grp:"trig",name:"Buccal nerve (CN V3)",cause:"Injured deep to the ramus in the infratemporal fossa.",own:["bn_skin"],spared:["vii_buccin"],pearl:"Sensory buccal n. vs motor buccal branch of VII — classic trap."},
{id:"auriculotemp",grp:"trig",name:"Auriculotemporal nerve",cause:"Parotidectomy or TMJ surgery.",own:["at_skin","par_saliva","at_frey"],spared:["ga"],pearl:"Frey syndrome (gustatory sweating) = auriculotemporal n."},
{id:"v3",grp:"trig",name:"Mandibular division (CN V3) at the foramen ovale",cause:"Tumor at the foramen ovale.",own:["ling_sens","v3_chew","v3_jaw","v3_tvp"],inc:["ian","buccal_v3","auriculotemp"],spared:["ct_taste","vii_buccin"],pearl:"V3 is the only trigeminal division with motor fibers. Jaw deviates TOWARD the lesion."},
{id:"cn5",grp:"trig",name:"Trigeminal nerve (CN V), whole nerve",cause:"Lesion at the trigeminal ganglion or root.",inc:["v1","v2","v3"],spared:["vii_whole"],pearl:"Whole CN V lesion = half-face numbness + weak chewing + absent corneal reflex from that side."},
/* orbit */
{id:"cn2",grp:"orbit",name:"Optic nerve (CN II)",cause:"Optic canal fracture or optic neuritis.",own:["ii_blind","ii_rapd"],spared:["cg_pupil"],pearl:"CN II = afferent limb of the light reflex; CN III = efferent limb."},
{id:"ciliary_g",grp:"orbit",name:"Ciliary ganglion / short ciliary nerves",cause:"Orbital surgery or trauma (tonic pupil).",own:["cg_pupil","cg_accom"],spared:["iii_ptosis","iii_downout"],pearl:"Dilated pupil + poor near focus + normal eye movements → ciliary ganglion, not the CN III trunk."},
{id:"cn3",grp:"orbit",name:"Oculomotor nerve (CN III)",cause:"Posterior communicating artery aneurysm, uncal herniation, or diabetes.",own:["iii_ptosis","iii_downout","iii_diplo"],inc:["ciliary_g"],spared:["vi_abd","hor_miosis"],pearl:"Compression (aneurysm) hits the pupil early; diabetic ischemia often spares the pupil."},
{id:"cn4",grp:"orbit",name:"Trochlear nerve (CN IV)",cause:"Closed head trauma (long, thin intracranial course).",own:["iv_diplo","iv_hyper","iv_tilt"],spared:["iii_ptosis","vi_eso"],pearl:"CN IV palsy: trouble with stairs and reading; head tilts AWAY from the lesion."},
{id:"cn6",grp:"orbit",name:"Abducens nerve (CN VI)",cause:"Raised intracranial pressure or cavernous sinus disease.",own:["vi_abd","vi_eso","vi_diplo"],spared:["iii_ptosis","iv_tilt"],pearl:"CN VI palsy is a \"false localizing\" sign of raised intracranial pressure."},
{id:"scg",grp:"orbit",name:"Superior cervical ganglion / cervical sympathetic chain (Horner syndrome)",cause:"Carotid dissection or surgery, Pancoast tumor, or neck trauma.",own:["hor_ptosis","hor_miosis","hor_anhid"],spared:["iii_ptosis","cg_pupil","iii_downout"],pearl:"Horner = mild ptosis (superior tarsal), miosis (dilator pupillae), anhidrosis. Anisocoria worse in DIM light."},
/* other CNs */
{id:"cn1",grp:"other",name:"Olfactory nerve (CN I)",cause:"Cribriform plate fracture or frontal head injury.",own:["i_anosmia","i_flavor"],spared:["ct_taste"],pearl:"Olfactory fibers pass through the cribriform plate of the ethmoid."},
{id:"cn8",grp:"other",name:"Vestibulocochlear nerve (CN VIII)",cause:"Vestibular schwannoma (acoustic neuroma).",own:["viii_hear","viii_vert"],spared:["vii_hyper"],pearl:"Schwannoma in the internal acoustic meatus: CN VIII signs first, then CN VII."},
{id:"cn9",grp:"other",name:"Glossopharyngeal nerve (CN IX)",cause:"Jugular foramen tumor or tonsillectomy injury in the tonsillar bed.",own:["ix_taste","ix_gag","par_saliva","ix_styloph","ix_sinus"],spared:["x_uvula","ct_taste"],pearl:"Gag reflex: afferent = IX, efferent = X. CN IX has one muscle — stylopharyngeus."},
{id:"cn12",grp:"other",name:"Hypoglossal nerve (CN XII)",cause:"Hypoglossal canal tumor, carotid endarterectomy, or submandibular triangle injury.",own:["xii_dev","xii_atro","xii_speech","thy","ansa"],minorOwn:["thy","ansa"],spared:["x_uvula","ling_sens"],pearl:"Tongue \"licks the lesion.\" Palatoglossus is the one tongue muscle NOT supplied by CN XII."},
{id:"ptg_g",grp:"other",name:"Pterygopalatine ganglion",cause:"Tumor or surgery in the pterygopalatine fossa.",own:["ptg_tear","ptg_nose"],spared:["sm_saliva","par_saliva"],pearl:"Pterygopalatine ganglion ← greater petrosal (VII) → lacrimal + nasal/palatal glands."},
{id:"subm_g",grp:"other",name:"Submandibular ganglion",cause:"Floor-of-mouth surgery near the lingual n.",own:["sm_saliva"],spared:["par_saliva","ptg_tear"],pearl:"Submandibular ganglion hangs from the lingual n. → submandibular + sublingual glands."},
/* sites */
{id:"s_cribriform",grp:"site",kind:"site",name:"Cribriform plate",cause:"Frontal head trauma.",own:["csf_rhino"],inc:["cn1"],pearl:"Cribriform fracture: anosmia + CSF rhinorrhea."},
{id:"s_optic",grp:"site",kind:"site",name:"Optic canal",cause:"Fracture of the lesser wing of the sphenoid.",inc:["cn2"],pearl:"Optic canal = CN II + ophthalmic a."},
{id:"s_sof",grp:"site",kind:"site",name:"Superior orbital fissure",cause:"Orbital apex tumor or fracture.",own:["hor_miosis"],minorOwn:["hor_miosis"],inc:["cn3","cn4","cn6","v1"],spared:["io_skin"],pearl:"Superior orbital fissure = III, IV, V1, VI + superior ophthalmic v."},
{id:"s_cav",grp:"site",kind:"site",name:"Cavernous sinus (thrombosis or mass)",cause:"Septic thrombosis spreading from the \"danger triangle\" of the face, or a carotid-cavernous fistula.",own:["cav_first","hor_ptosis","hor_miosis","hor_anhid"],minorOwn:["hor_ptosis","hor_miosis","hor_anhid"],inc:["cn3","cn4","cn6","v1","v2"],spared:["v3_chew"],pearl:"Cavernous sinus: wall = III, IV, V1, V2; middle = ICA + VI."},
{id:"s_rotundum",grp:"site",kind:"site",name:"Foramen rotundum",cause:"Tumor spreading along V2 from the pterygopalatine fossa.",inc:["v2"],spared:["v3_jaw"],pearl:"Upper teeth = V2 (rotundum); lower teeth = V3 (ovale)."},
{id:"s_ovale",grp:"site",kind:"site",name:"Foramen ovale",cause:"Skull-base tumor or perineural spread from the face.",inc:["v3"],spared:["io_skin"],pearl:"Middle cranial fossa, front to back: rotundum (V2) → ovale (V3) → spinosum (middle meningeal a.)."},
{id:"s_stylomastoid",grp:"site",kind:"site",name:"Stylomastoid foramen",cause:"Parotid or mastoid tumor.",inc:["vii_sm"],spared:["ct_taste","viii_hear"],pearl:"Stylomastoid foramen = motor CN VII to the face only."},
{id:"s_iam",grp:"site",kind:"site",name:"Internal acoustic meatus",cause:"Vestibular schwannoma.",inc:["vii_prox","cn8"],spared:["ix_gag"],pearl:"Internal acoustic meatus = CN VII + CN VIII (+ labyrinthine a.)."},
{id:"s_jugular",grp:"site",kind:"site",name:"Jugular foramen (Vernet syndrome)",cause:"Glomus tumor or skull-base fracture (Vernet syndrome).",inc:["cn9","cn10","cn11"],spared:["xii_dev"],pearl:"Jugular foramen = IX, X, XI + internal jugular v. CN XII has its own canal."},
{id:"s_hypoglossal",grp:"site",kind:"site",name:"Hypoglossal canal",cause:"Occipital condyle fracture or tumor.",inc:["cn12"],spared:["x_uvula"],pearl:"The hypoglossal canal runs through the occipital condyle."},
{id:"ii_chiasm",grp:"orbit",name:"Bitemporal hemianopsia (optic chiasm: pituitary tumor)",cause:"Pituitary adenoma (or craniopharyngioma) pressing up on the chiasm.",own:["chi_bitemp","chi_endo"],spared:["ii_blind","tr_hom"],pearl:"In front of the chiasm = one eye. At the chiasm = bitemporal hemianopia. Behind the chiasm = contralateral homonymous hemianopia."},
{id:"ii_tract",grp:"orbit",name:"Left homonymous hemianopsia (right optic tract)",cause:"Stroke, tumor or demyelination behind the chiasm.",own:["tr_hom"],spared:["ii_blind","chi_bitemp"],pearl:"Right optic tract lesion = LEFT homonymous hemianopia. Acuity in each eye is normal because each eye still has half its field."},
{id:"vii_extra",grp:"face",name:"Facial nerve between the stylomastoid foramen and the parotid",cause:"Trauma or tumor on the short extracranial trunk, after the posterior auricular and digastric branches leave but before the parotid.",own:["vii_blink","vii_whole"],inc:["vii_temporal","vii_zygomatic","vii_buccal","vii_mandibular","vii_cervical"],spared:["vii_pad","ct_taste","ptg_tear","vii_hyper"],pearl:"Whole face weak (forehead included) but the auricle and posterior digastric still work, and taste, tears and hearing volume are normal."},
{id:"s_thyroid",grp:"site",kind:"site",name:"Thyroid bed (thyroidectomy)",cause:"Thyroidectomy: the external laryngeal n. runs with the superior thyroid a.; the recurrent laryngeal n. runs with the inferior thyroid a.",inc:["eln","rln"],spared:["x_uvula","iln_cough"],pearl:"Superior pole ligation → external laryngeal n. (high notes lost). Inferior thyroid a. ligation → recurrent laryngeal n. (hoarse; both sides = stridor)."},
{id:"s_fmag",grp:"site",kind:"site",name:"Foramen magnum",cause:"Foramen magnum meningioma or basilar invagination.",own:["fm_cord"],inc:["cn11"],spared:["x_uvula","xii_dev"],pearl:"The SPINAL root of CN XI climbs UP through the foramen magnum, then leaves with IX and X through the jugular foramen."},
{id:"s_supraorbf",grp:"site",kind:"site",name:"Supraorbital foramen (V1)",cause:"Brow trauma or a supraorbital nerve block at the notch.",inc:["supraorb"],spared:["st_skin","vii_brow"],pearl:"Only the supraorbital n. is lost: the supratrochlear n. exits more medially, and brow elevation (CN VII) is normal."},
{id:"s_ethf",grp:"site",kind:"site",name:"Ethmoidal foramina (V1)",cause:"Medial orbital wall fracture or ethmoidectomy.",inc:["ant_eth","post_eth"],spared:["so_skin","v1_blink"],pearl:"Anterior ethmoidal n. = anterior nasal cavity and nose tip; posterior ethmoidal n. = sphenoid sinus and posterior ethmoid cells. Both are nasociliary (V1)."},
{id:"s_nasal",grp:"site",kind:"site",name:"Nasal cavity (V1 front, V2 back)",cause:"Nasal tumor, septal surgery or nasal fracture.",inc:["ant_eth","nasopal"],spared:["io_skin","v1_blink"],pearl:"Anterior-superior nasal cavity = V1 (anterior ethmoidal); posterior-inferior cavity and septum = V2 (nasopalatine, lateral nasal nerves)."},
{id:"s_mentf",grp:"site",kind:"site",name:"Mental foramen (V3)",cause:"Laceration, implant or injection near the 2nd premolar.",own:["mf_hist"],inc:["mental"],spared:["ian_teeth","ling_sens"],pearl:"Mental foramen lesion = lower lip and chin numb, teeth NORMAL (the dental branches left inside the canal)."},
{id:"s_cartri",grp:"site",kind:"site",name:"Carotid triangle",cause:"Carotid endarterectomy, carotid body tumor surgery or a penetrating neck wound.",own:["ct_hist","rln_hoarse"],minorOwn:["rln_hoarse"],inc:["cn12","sln"],spared:["xi_shrug","phr"],pearl:"Carotid triangle risks: CN XII (tongue deviates TO the side), superior laryngeal branches (voice, cough), and the carotid sinus nerve (blood pressure swings)."},
{id:"s_anttri",grp:"site",kind:"site",name:"Anterior triangle",cause:"Anterior neck surgery (submandibular, carotid or thyroid) or a large anterior neck mass.",inc:["vii_mandibular","cn12","rln"],spared:["xi_shrug","phr"],pearl:"Anterior triangle nerves at risk, top to bottom: marginal mandibular (lower lip), hypoglossal (tongue), recurrent laryngeal (voice)."},
{id:"s_posttri",grp:"site",kind:"site",name:"Posterior triangle",cause:"Lymph node biopsy or a penetrating wound behind the sternocleidomastoid.",inc:["xi_pt","great_aur","lesser_occ"],spared:["xi_scm","xii_dev"],pearl:"CN XI is superficial in the posterior triangle; the cervical plexus skin branches fan out from Erb point just above it."},
{id:"s_rootn",grp:"site",kind:"site",name:"Root of the neck (Pancoast tumor)",cause:"Pancoast tumor at the lung apex, or injury during subclavian or central line procedures.",own:["pt_shoulder"],inc:["scg","rln","phrenic"],spared:["xii_dev","eln_pitch"],pearl:"Pancoast tumor: Horner syndrome + shoulder/arm pain + hoarseness (left RLN) ± a raised hemidiaphragm (phrenic)."},
{id:"s_retro",grp:"site",kind:"site",name:"Retropharyngeal space (abscess)",cause:"Suppuration of retropharyngeal lymph nodes after an upper respiratory infection, or a penetrating injury to the back of the pharynx.",own:["rp_kid","rp_xray","rp_med"],minorOwn:["rp_med"],spared:["xii_dev","rln_hoarse"],pearl:"Danger: spread down the danger space to the posterior mediastinum. Treat as an airway emergency."},
{id:"ii_rmono",grp:"orbit",name:"Right monocular blindness (right optic nerve)",cause:"Right optic nerve lesion in front of the chiasm: optic neuritis, trauma, compression or ischemia.",inc:["cn2"],spared:["chi_bitemp","tr_hom"],pearl:"In front of the chiasm = ONE eye. Light in the right eye constricts neither pupil; light in the left eye constricts both (right RAPD)."},
{id:"p_iii",grp:"orbit",name:"Oculomotor palsy",cause:"Posterior communicating artery aneurysm (painful, pupil blown), uncal herniation, or diabetic microvascular palsy (pupil spared).",inc:["cn3"],spared:["vi_abd","iv_tilt"],pearl:"Down and out + complete ptosis + dilated pupil. A blown pupil means compression until proven otherwise."},
{id:"p_iv",grp:"orbit",name:"Trochlear palsy",cause:"Closed head trauma, or a congenital palsy that decompensates in adulthood.",inc:["cn4"],spared:["iii_ptosis","vi_eso"],pearl:"Head tilts AWAY from the lesion; double vision worsens when the head is tilted TOWARD it (Bielschowsky test)."},
{id:"p_vi",grp:"orbit",name:"Abducens palsy",cause:"Raised intracranial pressure, a cavernous sinus lesion, or diabetic microvascular ischemia.",inc:["cn6"],spared:["iii_ptosis","iv_tilt"],pearl:"Eye turned in, cannot abduct, horizontal diplopia worst looking toward the lesion. From raised pressure it is a false localizing sign."},
{id:"p_v",grp:"trig",name:"Trigeminal palsy",cause:"Lesion of the trigeminal ganglion or root: schwannoma, cerebellopontine angle tumor or trauma.",inc:["cn5"],spared:["vii_whole","ct_taste"],pearl:"Half-face numbness + no corneal blink from that side + weak chewing with the jaw deviating TOWARD the lesion."},
{id:"p_vii",grp:"face",name:"Facial palsy",cause:"Bell palsy, Ramsay Hunt syndrome, parotid tumor, temporal bone fracture or Lyme disease.",own:["face_umn_note"],inc:["vii_sm"],spared:["so_skin","v3_chew"],pearl:"Lower motor neuron facial palsy: the forehead is weak too. A stroke (upper motor neuron) spares the forehead because it has input from both hemispheres."},
{id:"p_xi",grp:"neck",kind:"site",name:"Lymph node biopsy in the posterior triangle",cause:"CN XI cut during a posterior triangle lymph node biopsy: the nerve lies just under the investing fascia on levator scapulae.",inc:["xi_pt"],spared:["xi_scm","xii_dev"],pearl:"The classic iatrogenic CN XI injury: trapezius weak, sternocleidomastoid spared."},
{id:"p_xii",grp:"other",name:"Tongue deviation",cause:"Hypoglossal canal tumor, carotid endarterectomy or submandibular surgery.",inc:["cn12"],spared:["x_uvula","ling_sens"],pearl:"Lower motor neuron: the tongue licks the lesion, with atrophy. Upper motor neuron (stroke): it deviates AWAY from the brain lesion, without atrophy."},
{id:"s_tfossa",grp:"site",kind:"site",name:"Temporal fossa (pterion fracture, epidural hematoma)",cause:"Blow to the side of the head fracturing the thin pterion in the floor of the temporal fossa.",own:["eh_lucid","eh_ct","eh_pupil"],spared:["xii_dev","vii_whole"],pearl:"Pterion = where frontal, parietal, temporal and sphenoid meet: thinnest part of the skull, with the middle meningeal artery just inside."},
{id:"s_danger",grp:"site",kind:"site",name:"Danger zone of the face (danger triangle)",cause:"Squeezing or infection of a lesion in the triangle from the corners of the mouth to the bridge of the nose.",own:["dt_hist"],inc:["s_cav"],spared:["v3_chew","xii_dev"],pearl:"Facial vein → ophthalmic veins (no valves) → cavernous sinus. The feared result is cavernous sinus thrombosis."},
{id:"s_dspace",grp:"site",kind:"site",name:"Danger space (spread to the mediastinum)",cause:"Retropharyngeal or parapharyngeal infection breaking into the space between the alar and prevertebral fascia.",own:["ds_hist","rp_med"],spared:["xii_dev","rln_hoarse"],pearl:"The danger space runs from the skull base to the diaphragm with nothing to stop spread: deep neck infection → posterior mediastinitis."},
{id:"cutbr",grp:"neck",name:"Cutaneous branches (cervical plexus)",cause:"Superficial neck incisions or trauma along the sternocleidomastoid (parotidectomy, neck dissection, thyroid or clavicle surgery).",inc:["great_aur","lesser_occ","trans_cerv","supraclav"],spared:["xi_shrug","phr"],pearl:"Four skin branches, all from Erb point: lesser occipital (C2), great auricular (C2–C3), transverse cervical (C2–C3), supraclavicular (C3–C4). Skin only: no weakness."},
{id:"s_erb",grp:"site",kind:"site",name:"Erb point (nerve point of the neck)",cause:"Penetrating wound, lymph node biopsy or a misplaced superficial cervical plexus block at the midpoint of the posterior border of SCM.",inc:["cutbr","xi_pt"],spared:["phr","xii_dev"],pearl:"All four cervical plexus skin branches emerge here, and CN XI crosses just above it, so a lesion here numbs the neck skin AND can weaken trapezius. (Not the brachial plexus Erb point at C5–C6.)"},
{id:"p_voice",grp:"larynx",name:"Voice changes (hoarseness vs lost vocal range)",ph:"A laryngeal nerve injury that changes the voice",cause:"Laryngeal nerve injury in thyroid, neck or chest surgery, or from a tumor.",inc:["eln","rln"],spared:["x_uvula","xii_dev"],pearl:"Hoarse, breathy voice = recurrent laryngeal (all intrinsic muscles except cricothyroid). Lost high notes, monotone = external laryngeal (cricothyroid). Both = the whole laryngeal supply of CN X."}
];

/* ---------- "Which side?" templates ---------- */
const SIDE = [
 {id:"sd_tongue",f:s=>`On protrusion, the tongue deviates to the ${s}.`,nerve:["Hypoglossal nerve (CN XII)","Vagus nerve (CN X)"],ans:(s)=>[0,s],why:"The intact genioglossus pushes the tongue toward the weak side: tongue points TOWARD the lesion."},
 {id:"sd_uvula",f:s=>`When the patient says "ah," the uvula deviates to the ${s}.`,nerve:["Vagus nerve (CN X)","Hypoglossal nerve (CN XII)"],ans:(s)=>[0,opp(s)],why:"The intact levator veli palatini pulls the uvula toward the healthy side: uvula points AWAY from the lesion."},
 {id:"sd_jaw",f:s=>`On opening the mouth, the jaw deviates to the ${s}.`,nerve:["Mandibular division (CN V3)","Facial nerve (CN VII)"],ans:(s)=>[0,s],why:"The intact lateral pterygoid pushes the jaw toward the weak side: jaw points TOWARD the lesion."},
 {id:"sd_scm",f:s=>`The patient cannot turn the chin to the ${s} against resistance.`,nerve:["Accessory nerve (CN XI)","Hypoglossal nerve (CN XII)"],ans:(s)=>[0,opp(s)],why:"Each SCM turns the face to the OPPOSITE side, so weak turning to one side means the other side's CN XI is lesioned."},
 {id:"sd_v1",f:s=>`Touching the ${s} cornea makes neither eye blink. Touching the other cornea makes both eyes blink.`,nerve:["Ophthalmic division (CN V1)","Facial nerve (CN VII)"],ans:(s)=>[0,s],why:"Both eyes can blink, so both CN VII work. The touched side can't trigger the reflex, so that side's V1 (afferent) is lost."},
 {id:"sd_vii",f:s=>`The ${s} eye never blinks, whichever cornea is touched. The other eye blinks every time.`,nerve:["Facial nerve (CN VII)","Ophthalmic division (CN V1)"],ans:(s)=>[0,s],why:"Both corneas trigger a response, so both V1 work. The eye that never closes has lost its CN VII (efferent)."},
 {id:"sd_gag",f:s=>`Touching the ${s} side of the pharynx produces no gag. Touching the other side makes both sides of the palate rise symmetrically.`,nerve:["Glossopharyngeal nerve (CN IX)","Vagus nerve (CN X)"],ans:(s)=>[0,s],why:"Symmetric palate elevation means both CN X work. No response from one side means that side's CN IX (afferent) is lost."},
 {id:"sd_iv",f:s=>`The patient has vertical double vision when reading and tilts the head to the ${s}.`,nerve:["Trochlear nerve (CN IV)","Abducens nerve (CN VI)"],ans:(s)=>[0,opp(s)],why:"The head tilts AWAY from the side of the CN IV lesion."},
 {id:"sd_vi",f:s=>`The ${s} eye is turned inward at rest and cannot move outward.`,nerve:["Abducens nerve (CN VI)","Oculomotor nerve (CN III)"],ans:(s)=>[0,s],why:"Lateral rectus (CN VI) is weak on the side of the inturned eye."},
 {id:"sd_iii",f:s=>`The ${s} eye rests down and out, with a dilated pupil and complete ptosis.`,nerve:["Oculomotor nerve (CN III)","Sympathetic chain (Horner syndrome)"],ans:(s)=>[0,s],why:"All three signs are on the side of the CN III lesion."},
 {id:"sd_horner",f:s=>`The ${s} pupil is smaller than the other, especially in dim light, and the ${s} upper lid droops slightly.`,nerve:["Sympathetic chain (Horner syndrome)","Oculomotor nerve (CN III)"],ans:(s)=>[0,s],why:"Small pupil + mild ptosis = Horner syndrome on that side. A CN III lesion would make the pupil LARGER."},
 {id:"sd_ii",f:s=>`Light shone in the ${s} eye constricts neither pupil. Light in the other eye constricts both.`,nerve:["Optic nerve (CN II)","Oculomotor nerve (CN III)"],ans:(s)=>[0,s],why:"Both pupils can constrict, so both CN III work. The eye that can't trigger the reflex has lost its CN II (afferent)."},
 {id:"sd_phrenic",f:s=>`Chest X-ray shows an elevated ${s} hemidiaphragm that rises paradoxically on sniffing.`,nerve:["Phrenic nerve","Vagus nerve (CN X)"],ans:(s)=>[0,s],why:"Each phrenic n. supplies its own half of the diaphragm."},
 {id:"sd_bell",f:s=>`The whole ${s} side of the face is weak, including the forehead, with normal sensation.`,nerve:["Facial nerve (CN VII)","Trigeminal nerve (CN V)"],ans:(s)=>[0,s],why:"A lower motor neuron CN VII lesion weakens the whole face on the same side."},
 {id:"sd_aorta",fixed:"left",f:()=>`An aortic arch aneurysm causes hoarseness with one vocal fold fixed near the midline.`,nerve:["Recurrent laryngeal nerve","External laryngeal nerve"],ans:()=>[0,"left"],why:"Only the LEFT recurrent laryngeal n. hooks under the aortic arch."}

{id:"nerv_interm",grp:"vii",name:"Nervus intermedius",cause:"Compressed by a vessel or tumor at the cerebellopontine angle.",own:["ni_only"],inc:["chorda2","gr_petrosal"],spared:["face_all"],pearl:"Nervus intermedius = the sensory and parasympathetic half of CN VII."},
/* ---- IX and X ---- */
{id:"tympanic_n",grp:"ixx",name:"Tympanic nerve (CN IX, Jacobson nerve)",cause:"Middle ear tumor (glomus tympanicum) or middle ear surgery.",own:["tymp_ear"],inc:["lesser_pet"],spared:["x_ear_sens"],pearl:"Tympanic n. forms the tympanic plexus, then continues as the lesser petrosal n."},
{id:"lesser_pet",grp:"ixx",name:"Lesser petrosal nerve (CN IX)",cause:"Petrous bone lesion on the way to the otic ganglion.",own:["lpn_parotid"],spared:["ct_saliva"],pearl:"Lesser petrosal (IX) → otic ganglion → parotid. Greater petrosal (VII) → pterygopalatine → tears."},
{id:"hering",grp:"ixx",name:"Carotid sinus nerve (nerve of Hering, CN IX)",cause:"Carotid endarterectomy or carotid body tumor surgery.",own:["hering_baro"],spared:["ix_phar_sens"],pearl:"Carotid sinus = baroreceptor (pressure); carotid body = chemoreceptor (O₂, CO₂). Both report via CN IX."},
{id:"ix_pharyngeal",grp:"ixx",name:"Pharyngeal branches of CN IX",cause:"Tonsillectomy injury or a skull-base tumor.",own:["ix_phar_sens","ix_tonsil"],spared:["x_phar_motor"],pearl:"Gag reflex: IX senses, X moves."},
{id:"ix_lingual",grp:"ixx",name:"Lingual branch of CN IX",cause:"Injury in the tonsillar bed, deep to the palatine tonsil.",own:["ix_taste2"],spared:["ct_taste2"],pearl:"Posterior 1/3 of the tongue: CN IX carries BOTH taste and general sensation."},
{id:"x_pharyngeal",grp:"ixx",name:"Pharyngeal branch of CN X",cause:"Skull-base tumor or a high vagal lesion in the neck.",own:["x_phar_motor"],spared:["ix_phar_sens","rln_left"],pearl:"Say \"ah\": the uvula swings away from the damaged vagus."},
{id:"x_auricular",grp:"ixx",name:"Auricular branch of CN X (Arnold nerve)",cause:"Ear canal instrumentation, or irritation by wax or infection.",own:["x_ear_cough","x_ear_sens"],spared:["tymp_ear"],pearl:"Cough while cleaning the ear = Arnold's ear-cough reflex (CN X)."},
{id:"x_cardiacb",grp:"ixx",name:"Cardiac branches of CN X",cause:"Injured in mediastinal surgery or by a chest tumor.",own:["x_cardiac"],spared:["rln_left"],pearl:"Vagal cardiac branches slow the heart; losing them raises the resting rate."},
{id:"rln_aortic",grp:"ixx",name:"Left recurrent laryngeal nerve at the aortic arch",cause:"Aortic arch aneurysm, left atrial enlargement, or a lung tumor at the hilum (Ortner syndrome).",own:["rln_left","rln_cough"],spared:["eln_pitch2"],pearl:"Only the LEFT recurrent laryngeal n. loops under the aortic arch — that's why chest disease makes you hoarse."},
/* ---- eye ---- */
{id:"iii_sup",grp:"eye",name:"Superior division of CN III",cause:"Orbital apex lesion or a superior orbital fissure mass.",own:["iii_sup_ptosis","iii_sup_pupil_ok"],spared:["iii_inf_pupil"],pearl:"Superior division = levator palpebrae + superior rectus. Pupil is spared."},
{id:"iii_inf",grp:"eye",name:"Inferior division of CN III",cause:"Orbital trauma or a lesion in the inferior orbital fissure region.",own:["iii_inf_pupil","iii_inf_move","iii_inf_lid_ok"],spared:["iii_sup_ptosis"],pearl:"Inferior division carries the pupil fibers to the ciliary ganglion."},
{id:"vi_dorello_n",grp:"eye",name:"Abducens nerve in Dorello's canal",cause:"Raised intracranial pressure stretching the nerve over the petrous apex.",own:["vi_dorello"],spared:["iii_sup_ptosis"],pearl:"A sixth-nerve palsy from raised pressure is a false localizing sign."},
{id:"otic_g",grp:"eye",name:"Otic ganglion",cause:"Infratemporal fossa tumor or surgery below the foramen ovale.",own:["otic_dry"],spared:["ct_saliva","gp_tear"],pearl:"Otic ganglion sits on V3 just under the foramen ovale: IX in, auriculotemporal out."},
{id:"vidian",grp:"eye",name:"Nerve of the pterygoid canal (Vidian nerve)",cause:"Skull-base surgery or a lesion in the pterygoid canal.",own:["vid_dry","gp_tear","gp_nose"],spared:["ct_saliva"],pearl:"Vidian n. = greater petrosal (parasympathetic) + deep petrosal (sympathetic)."},
/* ---- other cranial nerves ---- */
{id:"cochlear",grp:"oth",name:"Cochlear division of CN VIII",cause:"Vestibular schwannoma pressing the cochlear fibers, or ototoxic drugs.",own:["coch_hear"],spared:["vest_vert"],pearl:"Sensorineural loss: Weber localizes to the GOOD ear; air conduction still beats bone."},
{id:"vestibular",grp:"oth",name:"Vertigo (vestibular division of CN VIII)",cause:"Vestibular neuritis or a schwannoma on the vestibular fibers.",own:["vest_vert"],spared:["coch_hear"],pearl:"Vertigo with normal hearing points to the vestibular division alone."},
{id:"olfactory2",grp:"oth",name:"Olfactory nerve fila (CN I)",cause:"Frontal head trauma shearing the fila at the cribriform plate.",own:["olf_anosmia"],spared:["ix_taste2"],pearl:"Anosmia after head trauma; basic tastes (sweet, salt, sour, bitter) stay intact."},
{id:"xi_cranial_root",grp:"oth",name:"Cranial root of CN XI",cause:"Lesion at the jugular foramen before the root joins CN X.",own:["xi_cranial"],spared:["xi_shrug2"],pearl:"The cranial root travels with CN X to the palate and larynx; the spinal root runs the shoulder."},
{id:"xii_submand",grp:"oth",name:"Hypoglossal nerve in the submandibular triangle",cause:"Submandibular gland surgery or a floor-of-mouth tumor.",own:["xii_distal"],spared:["c1_strap"],pearl:"Distal CN XII lesion: tongue only — the C1 fibers have already left."},
{id:"c1_xii",grp:"oth",name:"C1 fibers (traveling with CN XII)",cause:"High neck lesion where C1 runs with the hypoglossal nerve.",own:["c1_strap"],spared:["xii_distal"],pearl:"C1 hitchhikers: nerve to thyrohyoid and nerve to geniohyoid."},
{id:"subm_g2",grp:"oth",name:"Submandibular ganglion",cause:"Floor-of-mouth surgery near the lingual nerve.",own:["sal_dry"],spared:["lpn_parotid","gp_tear"],pearl:"Hangs from the lingual n.: CN VII fibers in, submandibular and sublingual glands out."},
/* ---- sites ---- */
{id:"s_ppf",grp:"site",kind:"site",name:"Pterygopalatine fossa",cause:"Perineural spread of a skin cancer or a juvenile angiofibroma.",inc:["zyg","psa","lesser_pal","v2_phar","vidian"],spared:["mass_weak"],pearl:"Pterygopalatine fossa = V2 + the pterygopalatine ganglion + the third part of the maxillary artery."},
{id:"s_itf",grp:"site",kind:"site",name:"Infratemporal fossa",cause:"Tumor or a displaced mandibular ramus fracture.",inc:["masseteric","deep_temp","n_lat_pt","n_med_pt","ian_prox","ling_prox","auriculo2","otic_g"],spared:["gp_tear"],pearl:"Everything V3 does lives here — plus the otic ganglion and the maxillary artery."},
{id:"s_facial_canal",grp:"site",kind:"site",name:"Facial canal (above the chorda tympani)",cause:"Temporal bone fracture or cholesteatoma.",inc:["vii_parotid","chorda2","n_stapedius"],spared:["coch_hear"],pearl:"Work out how high a CN VII lesion is by what is lost: tears → hyperacusis → taste → face."},
{id:"s_petrous",grp:"site",kind:"site",name:"Petrous apex (Gradenigo syndrome)",cause:"Petrous apicitis spreading from a middle ear infection.",own:["grad_pain","grad_ear"],inc:["vi_dorello_n"],spared:["face_all"],pearl:"Gradenigo triad: ear discharge + retro-orbital pain (V1) + lateral gaze palsy (VI)."},
{id:"s_cpa",grp:"site",kind:"site",name:"Cerebellopontine angle",cause:"Vestibular schwannoma or meningioma.",inc:["cochlear","vestibular","nerv_interm","vii_parotid"],spared:["xii_distal"],pearl:"CPA tumors hit VIII first, then VII and V as they grow."},
{id:"s_parotid_bed",grp:"site",kind:"site",name:"Parotid gland (tumor or parotidectomy)",cause:"Parotid tumor or surgery.",inc:["vii_parotid","auriculo2"],spared:["ct_taste2"],pearl:"Facial weakness with a parotid mass suggests malignancy."},
{id:"ix_tons",grp:"ixx",name:"Tonsillar branch of CN IX",cause:"Injured during tonsillectomy or by a peritonsillar abscess.",own:["ix_tons_sens"],spared:["ix_taste2","x_phar_motor"],pearl:"Referred otalgia after tonsillectomy travels on CN IX (tonsillar branch in, tympanic branch to the ear)."},
{id:"s_tonsil",grp:"site",kind:"site",name:"Tonsillar bed (tonsillectomy)",cause:"Tonsillectomy that reaches through the superior constrictor to the CN IX branches just deep to the tonsillar bed.",inc:["ix_tons","ix_lingual"],spared:["x_phar_motor","ct_taste2"],pearl:"After tonsillectomy: lost taste AND touch on the posterior 1/3 of the tongue, plus referred ear pain. Palate and uvula movement stay normal (that is CN X)."},
{id:"s_npc",grp:"site",kind:"site",name:"Pharyngeal recess (nasopharyngeal carcinoma)",cause:"Nasopharyngeal carcinoma arising in the fossa of Rosenmüller, its most common site.",own:["npc_effusion","npc_node","npc_nose"],inc:["v2_phar"],spared:["face_all"],pearl:"An adult with a NEW one-sided middle ear effusion needs the nasopharynx examined. Upward spread through foramen lacerum reaches the cavernous sinus (CN VI first)."},
{id:"s_spf",grp:"site",kind:"site",name:"Sphenopalatine foramen (V2)",cause:"Endoscopic sphenopalatine artery ligation for posterior epistaxis, or a tumor at the foramen.",own:["np_sens2"],inc:["pslnasal"],spared:["gp_sens2","io_skin"],pearl:"Sphenopalatine foramen = sphenopalatine artery + nasopalatine and posterior superior lateral nasal nerves: pterygopalatine fossa → nasal cavity."},
{id:"s_palf",grp:"site",kind:"site",name:"Greater and lesser palatine foramina (V2)",cause:"Palatal surgery, a palatal nerve block, or a palatal tumor.",own:["gp_sens2"],inc:["lesser_pal"],spared:["np_sens2","io_skin"],pearl:"Greater palatine foramen (medial to the 3rd molar) = hard palate; lesser palatine foramina just behind it = soft palate. The front of the palate stays normal (nasopalatine)."},
{id:"s_iof",grp:"site",kind:"site",name:"Inferior orbital fissure (V2)",cause:"Orbital floor fracture extending back into the fissure, or a tumor spreading from the pterygopalatine fossa.",inc:["zyg","infraorb2"],spared:["psa_teeth","v2_naso"],pearl:"Inferior orbital fissure = infraorbital n. and vessels + zygomatic n. Upper molars are spared because the posterior superior alveolar nn. left V2 earlier, in the fossa."},
{id:"s_iofor",grp:"site",kind:"site",name:"Infraorbital foramen (V2)",cause:"Midface laceration, a zygomaticomaxillary fracture through the foramen, or an infraorbital block.",own:["io_skin","io_lid"],spared:["asa_teeth","msa_teeth","psa_teeth"],pearl:"At the foramen the nerve is skin-only: lower lid, side of the nose, cheek and upper lip. The teeth are NORMAL because the anterior and middle superior alveolar nn. branched off inside the canal."},
{id:"s_mandf",grp:"site",kind:"site",name:"Mandibular foramen (V3)",cause:"Ramus fracture through the foramen or a mass at the lingula.",own:["ian_teeth2","mn_chin"],spared:["myl_floor","ling_touch"],pearl:"The nerve to mylohyoid leaves JUST before the mandibular foramen, so mylohyoid and anterior digastric are spared."},
{id:"ptg_pre",grp:"site",kind:"site",name:"Proximal to the pterygopalatine ganglion (preganglionic fibers)",cause:"Lesion of the greater petrosal or Vidian nerve before the fibers reach the ganglion (temporal bone fracture, pterygoid canal lesion).",own:["gp_tear","gp_nose"],spared:["io_skin","lp_palate","face_all"],pearl:"Proximal = preganglionic CN VII fibers only: dry eye and dry nose, with NORMAL sensation (the V2 sensory fibers never travel with them)."},
{id:"ptg_post",grp:"site",kind:"site",name:"Distal to the pterygopalatine ganglion (postganglionic fibers riding V2)",cause:"Lesion of the branches leaving the ganglion in the pterygopalatine fossa (tumor, surgery).",own:["gp_tear","gp_nose"],inc:["lesser_pal","pslnasal"],spared:["face_all","ct_taste2"],pearl:"Distal = the postganglionic fibers now travel inside V2 branches, so the dryness comes WITH numbness of the palate and nose."},
{id:"otic_pre",grp:"site",kind:"site",name:"Proximal to the otic ganglion (lesser petrosal nerve)",cause:"Lesion of the lesser petrosal nerve in the middle cranial fossa or at the foramen ovale.",own:["lpn_parotid"],spared:["at_temple","gp_tear"],pearl:"Proximal = preganglionic CN IX fibers only: less parotid saliva with NORMAL skin sensation."},
{id:"otic_post",grp:"site",kind:"site",name:"Distal to the otic ganglion (auriculotemporal nerve)",cause:"Lesion of the auriculotemporal nerve behind the TMJ or in the parotid (surgery, trauma).",own:["lpn_parotid","at_temple"],spared:["gp_tear","ling_touch"],pearl:"Distal = postganglionic fibers riding the auriculotemporal n. (V3): less parotid saliva PLUS numb temple, front of the ear and TMJ. After parotid surgery, regrowth causes Frey syndrome."},
{id:"ian_prox",grp:"v3",name:"Inferior alveolar nerve proximal to the mandibular foramen",cause:"Infratemporal fossa lesion before the nerve to mylohyoid branches off.",inc:["n_mylo","ian2"],spared:["ling_touch"],pearl:"Proximal IAN lesion = numb lower teeth, lip and chin PLUS a weak mylohyoid and anterior digastric."},
{id:"ian_block",grp:"site",kind:"site",name:"Mandibular foramen dental block (inferior alveolar nerve block)",cause:"Local anesthetic injected at the lingula for lower dental work; the lingual nerve lies just in front and is usually caught too.",own:["ian_teeth2","mn_chin","ling_touch"],spared:["myl_floor","at_temple"],pearl:"Classic IAN block: numb lower teeth, lip, chin AND tongue (lingual n.). Mylohyoid still works, since its nerve left above the injection site."},
{id:"p_hear",grp:"oth",name:"Loss of hearing",cause:"Vestibular schwannoma, ototoxic drugs (aminoglycosides, cisplatin), loud noise or aging.",inc:["cochlear"],spared:["vest_vert","face_all"],pearl:"Sensorineural loss: Weber lateralizes to the GOOD ear and air conduction still beats bone (Rinne positive). Conductive loss: Weber to the BAD ear, bone beats air."},
{id:"p_uvula",grp:"ixx",name:"Uvula deviation",cause:"Vagal lesion: jugular foramen tumor, lateral medullary stroke or a high neck injury.",inc:["x_pharyngeal"],spared:["ix_phar_sens","xii_distal"],pearl:"The uvula points AWAY from the damaged vagus: the intact levator veli palatini pulls it over."},
{id:"jaw_dev",grp:"v3",name:"Deviated mandible",cause:"V3 lesion at the foramen ovale, injury to the nerve to lateral pterygoid, or a condylar fracture on that side.",inc:["n_lat_pt"],spared:["ling_touch","face_all"],pearl:"On opening, the jaw deviates TOWARD the weak side: the intact lateral pterygoid pulls its own condyle forward and swings the chin across."}
];

/* extra signs used above that belong to shared branches */
SIG.ian_teeth2=["Sensory","Numbness of the lower teeth on that side","The inferior alveolar n. runs inside the mandibular canal."];
SIG.mn_chin=["Sensory","Numbness of the lower lip and chin","The mental n. is the terminal branch of the inferior alveolar n."];
SIG.eln_pitch2=["Voice","Loss of the top of the vocal range","Cricothyroid is supplied by the external laryngeal n., not the recurrent."];
SIG.xi_shrug2=["Motor","Weak shoulder shrug","The spinal root of CN XI supplies trapezius."];
SIG.io_skin=["Sensory","Numbness of the cheek and upper lip","The infraorbital n. (V2) emerges at the infraorbital foramen."];
SIG.msa_teeth=["Sensory","Numbness of the upper premolars (and the mesiobuccal root of the 1st molar)","The middle superior alveolar n. branches from the infraorbital n. and runs in the lateral wall of the maxillary sinus."];
SIG.psln_sens=["Sensory","Numbness of the posterior lateral nasal wall (superior and middle conchae)","The posterior superior lateral nasal nn. (V2) enter the nose through the sphenopalatine foramen."];
SIG.psln_dry=["Autonomic","Dry, crusted mucosa at the back of that side of the nose","Pterygopalatine ganglion secretomotor fibers reach the nasal glands on these nerves."];
SIG.ix_tons_sens=["Sensory","Numbness of the palatine tonsil and tonsillar bed, with throat pain referred to the ear","Tonsillar branches of CN IX supply the tonsillar bed; CN IX also supplies the middle ear, so the pain is felt in the ear."];
SIG.npc_effusion=["Special sense","One-sided conductive hearing loss from a middle ear effusion (serous otitis media) in an adult","Tumor in the pharyngeal recess blocks the opening of the auditory tube."];
SIG.npc_node=["History","Painless upper neck lymph node mass; EBV-associated, most common in people of Southern Chinese descent","Nasopharyngeal carcinoma spreads early to the retropharyngeal and upper deep cervical nodes."];
SIG.npc_nose=["History","One-sided nasal obstruction and blood-stained nasal discharge","The tumor fills the nasopharynx behind the nose."];
SIG.np_sens2=["Sensory","Numbness of the nasal septum and the palate behind the upper incisors","The nasopalatine n. (V2) crosses the septum after passing the sphenopalatine foramen."];
SIG.gp_sens2=["Sensory","Numbness of the hard palate mucosa and palatal gums back to the canine","The greater palatine n. (V2) exits the greater palatine foramen."];
SIG.b3_cheek=["Sensory","Numbness of the skin and inner mucosa of the cheek","The buccal n. is the one sensory branch of the anterior division of V3."];

/* ---------- "Which side?" templates ---------- */
const SIDE = [
 {id:"sd2_jaw",f:s=>`When the patient opens wide, the jaw swings to the ${s}; chewing is weak on that side.`,nerve:["Nerve to lateral pterygoid (CN V3)","Facial nerve (CN VII)"],ans:(s)=>[0,s],why:"The intact lateral pterygoid drives the jaw toward the weak side, so the jaw points to the lesion."},
 {id:"sd2_uvula",f:s=>`On phonation the soft palate droops on the ${s} and the uvula points the other way.`,nerve:["Pharyngeal branch of CN X","Glossopharyngeal nerve (CN IX)"],ans:(s)=>[0,s],why:"The drooping side is the damaged side; the uvula is pulled toward the intact muscle."},
 {id:"sd2_gag",f:s=>`Touching the ${s} side of the oropharynx produces no gag; touching the other side gives a brisk, symmetric response.`,nerve:["Glossopharyngeal nerve (CN IX)","Vagus nerve (CN X)"],ans:(s)=>[0,s],why:"Symmetric elevation from the other side proves both vagus nerves work, so the silent side has lost its CN IX afferent."},
 {id:"sd2_taste_ant",f:s=>`Taste is lost on the front of the tongue on the ${s}, and that side of the mouth feels dry, but touch is normal.`,nerve:["Chorda tympani (CN VII)","Lingual nerve (CN V3)"],ans:(s)=>[0,s],why:"Taste plus reduced saliva with normal touch isolates the chorda tympani on the same side."},
 {id:"sd2_taste_post",f:s=>`Taste AND touch are lost on the back of the tongue on the ${s}.`,nerve:["Glossopharyngeal nerve (CN IX)","Chorda tympani (CN VII)"],ans:(s)=>[0,s],why:"The posterior third gets both taste and general sensation from CN IX on the same side."},
 {id:"sd2_tongue",f:s=>`The tongue is wasted and furrowed on the ${s} and deviates that way when protruded.`,nerve:["Hypoglossal nerve (CN XII)","Vagus nerve (CN X)"],ans:(s)=>[0,s],why:"Atrophy marks the denervated side, and the tongue deviates toward it."},
 {id:"sd2_abduct",f:s=>`The patient cannot move the ${s} eye outward, and double vision is worst when looking that way.`,nerve:["Abducens nerve (CN VI)","Oculomotor nerve (CN III)"],ans:(s)=>[0,s],why:"Lateral rectus weakness is on the side of the eye that cannot abduct."},
 {id:"sd2_iii_sup",f:s=>`The ${s} upper lid droops and that eye cannot look up, but both pupils are equal and reactive.`,nerve:["Superior division of CN III","Inferior division of CN III"],ans:(s)=>[0,s],why:"Levator and superior rectus are on the superior division, which carries no pupil fibers."},
 {id:"sd2_iii_inf",f:s=>`The ${s} pupil is dilated and that eye cannot adduct, but the lid opens normally.`,nerve:["Inferior division of CN III","Superior division of CN III"],ans:(s)=>[0,s],why:"Medial rectus and the pupil fibers travel with the inferior division; levator does not."},
 {id:"sd2_tear",f:s=>`The ${s} eye stays dry even when irritated, and that side of the nose is dry, but the face moves normally.`,nerve:["Greater petrosal nerve (CN VII)","Facial nerve in the parotid"],ans:(s)=>[0,s],why:"Tears and nasal glands are lost on the side of the greater petrosal lesion, while facial movement stays intact."},
 {id:"sd2_hyperacusis",f:s=>`The ${s} side of the face is weak and ordinary sounds are painfully loud in that ear.`,nerve:["Facial nerve in the facial canal","Facial nerve at the stylomastoid foramen"],ans:(s)=>[0,s],why:"Hyperacusis means the lesion is high enough to include the nerve to stapedius, on the weak side."},
 {id:"sd2_hoarse",fixed:"left",f:()=>`A patient with a large aortic arch aneurysm becomes hoarse; one vocal fold lies fixed near the midline.`,nerve:["Recurrent laryngeal nerve","External laryngeal nerve"],ans:()=>[0,"left"],why:"Only the left recurrent laryngeal n. hooks under the aortic arch."},
 {id:"sd2_corneal",f:s=>`Touching the ${s} cornea produces no blink in either eye, and that forehead is numb; touching the other cornea makes both eyes blink.`,nerve:["Ophthalmic division (CN V1)","Facial nerve (CN VII)"],ans:(s)=>[0,s],why:"Both eyes can blink, so both CN VII work; the numb, non-triggering side has lost V1."},
 {id:"sd2_masseter",f:s=>`The ${s} masseter does not bulge on clenching and the temple on that side looks hollow.`,nerve:["Mandibular division (CN V3)","Facial nerve (CN VII)"],ans:(s)=>[0,s],why:"Masseter and temporalis wasting mark the side of the V3 motor lesion."},
 {id:"sd2_baro",f:s=>`After an endarterectomy on the ${s}, the patient has wide blood-pressure swings and faints when a collar presses that side of the neck.`,nerve:["Carotid sinus nerve (CN IX)","Vagus nerve (CN X)"],ans:(s)=>[0,s],why:"The carotid sinus n. of Hering on the operated side carries the baroreceptor signal."}
];

<script>
"use strict";
(function(){
/* ================= utilities ================= */

const strip=s=>String(s).replace(/<[^>]+>/g,'');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const LET=['A','B','C','D','E'];
if(location.protocol==='file:')document.getElementById('hublink').innerHTML='<a href="index.html">&lt; Game Hub</a> · ';

/* ================= types ================= */
const TYPES={
 CERV:{n:'Cervical',c:'#4E9A3A',atk:'Plexus Pinch'},
 VAGAL:{n:'Vagal',c:'#3A7FD0',atk:'Hoarse Roar'},
 FACIAL:{n:'Facial',c:'#D9722B',atk:'Palsy Slap'},
 TRIGEM:{n:'Trigeminal',c:'#B58B0A',atk:'Tic Strike'},

const tchip=t=>`<span class="tchip" style="background:${TYPES[t].c}">${TYPES[t].n.toUpperCase()}</span>`;

/* ================= lesion banks (engine ported from Lesion Rounds) ================= */
function mkLR(D,key,cfg,FX){
  const BY=Object.fromEntries(D.NODES.map(n=>[n.id,n]));
  let AV=new Set();const fresh=a=>[...a.filter(x=>!AV.has(x)),...a.filter(x=>AV.has(x))];
  const memo={};
  function signs(id){if(memo[id])return memo[id];const n=BY[id];const s=new Set(n.own||[]);(n.inc||[]).forEach(c=>{if(BY[c])signs(c).forEach(x=>s.add(x));});return memo[id]=s;}
  function minorAll(id,seen=new Set()){if(seen.has(id))return [];seen.add(id);const n=BY[id];if(!n)return [];return [...(n.minorOwn||[]),...(n.inc||[]).flatMap(c=>minorAll(c,seen))];}
  function keySigns(id){const n=BY[id];const mo=new Set(minorAll(id));return [...signs(id)].filter(x=>!D.MINOR.has(x)&&!mo.has(x)&&D.SIG[x]);}
  function subset(a,b){for(const x of a)if(!b.has(x))return false;return true;}
  function distractorNodes(T,clues,k){
    const ok=D.NODES.filter(n=>n.id!==T.id&&!clues.every(c=>signs(n.id).has(c)));
    const same=shuffle(ok.filter(n=>n.grp===T.grp)),other=shuffle(ok.filter(n=>n.grp!==T.grp));
    const share=n=>[...signs(n.id)].some(x=>signs(T.id).has(x));

    const seen=new Set([T.name]),out=[];
    for(const n of pri){if(out.length>=k)break;if(seen.has(n.name))continue;seen.add(n.name);out.push(n);}
    return out;
  }
  function distractorSigns(T,k){
    const mine=signs(T.id);const bad=s=>mine.has(s)||D.MINOR.has(s);
    const spared=shuffle((T.spared||[]).filter(s=>!bad(s)&&D.SIG[s]));
    const neg=s=>/_ok$/.test(s); // "X is normal" findings are true of most other lesions too, so never use them as a wrong answer
    const sameGrp=shuffle([...new Set(D.NODES.filter(n=>n.grp===T.grp&&n.id!==T.id).flatMap(n=>keySigns(n.id)))].filter(s=>!bad(s)&&!neg(s)));
    const any=shuffle(Object.keys(D.SIG).filter(s=>!bad(s)&&!neg(s)));
    const cand=[...spared,...sameGrp,...any];const ord=[...cand.filter(s=>!AV.has(D.SIG[s][1])),...cand.filter(s=>AV.has(D.SIG[s][1]))];
    const out=[];for(const s of ord){if(out.length>=k)break;if(!out.includes(s))out.push(s);}
    return out;
  }
  /* ---- nerve fact questions (fiber type, artery, muscles) ---- */
  const FXN=Object.keys(FX||{});
  const ARTS=[...new Set(Object.values(FACTS).flatMap(b=>Object.values(b)).filter(f=>f.a).map(f=>f.a[0]))];
  const ALLM=Object.keys(MUSC);
  function pickK(pool,k){return fresh(shuffle(pool)).slice(0,k);}
  function lin(T){const l=D.LINEAGE&&D.LINEAGE[T.id];return l?`<p class="small">${esc(l[1])}</p>`:'';}
  function musList(F){return `<ul class="whys">${F.m.map(k=>`<li><b>${esc(MUSC[k][0])}</b><small>${esc(MUSC[k][1])}</small></li>`).join('')}</ul>`;}
  const factQ={
    fiber(T){const F=FX&&FX[T.id];if(!F||!F.f)return null;const ans=FIB[F.f];const comp=new Set(ans[1]);
      const pool=Object.keys(FIB).filter(k=>k!==F.f&&!FIB[k][1].every(c=>comp.has(c))).map(k=>FIB[k][0]);
      const opts=shuffle([ans[0],...pickK(pool,3)]);
      return mk({type:'fiber',sig:'f',node:T.id,opts,ans:opts.indexOf(ans[0]),stem:`What kind of fibers does the <strong>${esc(T.name)}</strong> carry?`,
        explain:`<p class="ans">The ${esc(T.name)} carries: <b>${esc(ans[0])}</b>.</p>${lin(T)}${F.m?`<p class="small">Muscles it supplies:</p>${musList(F)}`:''}`});},
    artery(T){const F=FX&&FX[T.id];if(!F||!F.a)return null;
      const opts=shuffle([F.a[0],...pickK(ARTS.filter(a=>a!==F.a[0]),3)]);
      return mk({type:'artery',sig:'a',node:T.id,opts,ans:opts.indexOf(F.a[0]),stem:`Which artery travels with (or sits right beside) the <strong>${esc(T.name)}</strong>?`,
        explain:`<p class="ans"><b>${esc(F.a[0])}</b>: ${esc(F.a[1])}</p>`});},
    muscle(T,avoid){const F=FX&&FX[T.id];if(!F||!F.m)return null;const c=F.m.filter(k=>!(avoid&&avoid.has('m:'+k)));if(!c.length)return null;const k=pick(c);
      const mine=new Set(F.m.map(x=>MUSC[x][0]));const pool=ALLM.filter(x=>!mine.has(MUSC[x][0])).map(x=>MUSC[x][0]);
      const opts=shuffle([MUSC[k][0],...pickK(pool,3)]);
      return mk({type:'muscle',sig:'m:'+k,node:T.id,opts,ans:opts.indexOf(MUSC[k][0]),stem:`Which of these muscles does the <strong>${esc(T.name)}</strong> supply?`,
        explain:`<p class="ans">The ${esc(T.name)} supplies:</p>${musList(F)}`});},
    mfunc(T,avoid){const F=FX&&FX[T.id];if(!F||!F.m)return null;const c=F.m.filter(k=>!(avoid&&avoid.has('mf:'+k)));if(!c.length)return null;const k=pick(c);
      const grp=MUSC[k][2];const pool=[...new Set(ALLM.filter(x=>MUSC[x][2]!==grp).map(x=>MUSC[x][1]))];
      const opts=shuffle([MUSC[k][1],...pickK(pool,3)]);
      return mk({type:'mfunc',sig:'mf:'+k,node:T.id,opts,ans:opts.indexOf(MUSC[k][1]),stem:`The <strong>${esc(T.name)}</strong> supplies <strong>${esc(MUSC[k][0])}</strong>. What does that muscle do?`,
        explain:`<p class="ans"><b>${esc(MUSC[k][0])}</b>: ${esc(MUSC[k][1])}.</p>`});},
    roots(T){const F=FX&&FX[T.id];if(!F||!F.r)return null;
      const pool=['C1','C2','C2–C3','C3–C4','C3–C5','C1–C3','C4–C5','C2–C4','C1–C2'].filter(x=>x!==F.r);
      const opts=shuffle([F.r,...pickK(pool,3)]);
      return mk({type:'roots',sig:'rt',node:T.id,opts,ans:opts.indexOf(F.r),stem:`Which spinal cord levels give rise to the <strong>${esc(T.name)}</strong>?`,
        explain:`<p class="ans">The ${esc(T.name)} comes from <b>${esc(F.r)}</b>.</p>${lin(T)}`});},
    exit(T){const F=FX&&FX[T.id];if(!F||!F.x)return null;
      const pool=[...new Set(Object.values(FACTS).flatMap(b=>Object.values(b)).filter(f=>f.x&&f.x!==F.x).map(f=>f.x))];
      const opts=shuffle([F.x,...pickK(pool,3)]);
      return mk({type:'exit',sig:'ex',node:T.id,opts,ans:opts.indexOf(F.x),stem:`Where does the <strong>${esc(T.name)}</strong> leave the skull, or where do you find it?`,
        explain:`<p class="ans"><b>${esc(F.x)}</b>.</p>${lin(T)}`});},
    whonerve(T,avoid){const F=FX&&FX[T.id];if(!F||!F.m)return null;const c=F.m.filter(k=>!(avoid&&avoid.has('w:'+k)));if(!c.length)return null;const k=pick(c);
      const others=FXN.filter(id=>id!==T.id&&BY[id]&&!((FX[id].m||[]).includes(k))).map(id=>BY[id]);
      const same=others.filter(n=>n.grp===T.grp),rest=others.filter(n=>n.grp!==T.grp);
      const sm=shuffle(same).map(n=>n.name),rs=shuffle(rest).map(n=>n.name);const names=[...new Set([...sm.filter(n=>!AV.has(n)),...rs.filter(n=>!AV.has(n)),...sm,...rs])].filter(n=>n!==T.name).slice(0,3);
      if(names.length<3)return null;const opts=shuffle([T.name,...names]);
      return mk({type:'whonerve',sig:'w:'+k,node:T.id,opts,ans:opts.indexOf(T.name),stem:`Which nerve supplies <strong>${esc(MUSC[k][0])}</strong>?`,
        explain:`<p class="ans"><b>${esc(MUSC[k][0])}</b> (${esc(MUSC[k][1].charAt(0).toLowerCase()+MUSC[k][1].slice(1))}) is supplied by the <b>${esc(T.name)}</b>.</p>`});}
  };
  const SF=(SIDE_FOR[key]||{});
  function under(id,target,seen=new Set()){if(id===target)return true;if(seen.has(id))return false;seen.add(id);const n=BY[id];return !!(n&&(n.inc||[]).some(c=>under(c,target,seen)));}
  const EXACT=new Set(['sd_aorta','sd2_hoarse','sd2_baro']); // stems that name a specific cause
  function sideFits(tid,T){const tg=SF[tid]||[];return EXACT.has(tid)?tg.includes(T.id):tg.some(target=>under(T.id,target));}
  function owner(sig){const n=D.NODES.find(n=>(n.own||[]).includes(sig));return n?n.name:null;}
  const phrase=T=>T.ph?T.ph:/^(Proximal|Distal) /.test(T.name)?`A lesion <strong>${esc(T.name.charAt(0).toLowerCase()+T.name.slice(1))}</strong>`:T.kind==='site'?`A lesion at the <strong>${esc(T.name)}</strong>`:`A lesion of the <strong>${esc(T.name)}</strong>`;
  const mk=(o)=>Object.assign({bank:key,miss:`${key}:n:${o.node}`},o);
  return {
    key,D,BY,signs,keySigns,cfg,FX,setAvoid:s=>{AV=s||new Set();},...factQ,hasFacts:T=>!!(FX&&FX[T.id]),
    typeOf:n=>n.kind==='site'||n.grp==='site'?'FORAMEN':cfg.types[n.grp],
    case(T){
      const key_=keySigns(T.id);if(!key_.length)return null;const all=signs(T.id);let clues=null;
      for(let t=0;t<40;t++){const c=shuffle(key_).slice(0,Math.min(4,key_.length));
        const narrower=D.NODES.some(n=>n.id!==T.id&&subset(c,signs(n.id))&&signs(n.id).size<all.size&&subset(signs(n.id),all));clues=c;if(!narrower)break;}
      const d=distractorNodes(T,clues,4);if(d.length<3)return null;
      const opts=shuffle([T,...d]);
      return mk({type:'case',sig:'c',used:clues.map(c=>'x:'+c),node:T.id,rows:[...clues.map(s=>[D.SIG[s][0],D.SIG[s][1]]),['History',T.cause]],shown:1,
        opts:opts.map(n=>n.name),ans:opts.indexOf(T),stem:'Which single lesion explains ALL of these findings?',
        explain:`<ul class="whys">${clues.map(s=>`<li>${esc(D.SIG[s][1])}<small>${esc(D.SIG[s][2])}</small></li>`).join('')}</ul>`});
    },
    predict(T,avoid){
      const k=keySigns(T.id).filter(x=>!(avoid&&avoid.has('x:'+x)));if(!k.length)return null;const right=pick(k);const d=distractorSigns(T,3);if(d.length<3)return null;
      const opts=shuffle([right,...d]);
      return mk({type:'predict',sig:'pred',used:['x:'+right],node:T.id,opts:opts.map(s=>D.SIG[s][1]),ans:opts.indexOf(right),stem:`${phrase(T)}. ${pick(['Which finding would you expect?','Which of these findings fits this lesion?','Which finding does this patient have?'])}`,
        explain:`<p class="ans">${esc(D.SIG[right][2])}</p>`});
    },
    spared(T){
      const k=keySigns(T.id);if(k.length<3)return null;const yes=shuffle(k).slice(0,3);const no=distractorSigns(T,1)[0];if(!no)return null;
      const opts=shuffle([...yes,no]);const who=owner(no);
      return mk({type:'spared',sig:'spared',node:T.id,opts:opts.map(s=>D.SIG[s][1]),ans:opts.indexOf(no),stem:`${phrase(T)}. Which finding would you <strong>NOT</strong> expect?`,
        explain:`<p class="ans">That finding is not part of this lesion${who&&who!==T.name?` — it points to the <b>${esc(who)}</b>`:''}. ${esc(D.SIG[no][2])}</p>`});
    },
    reverse(T,avoid){
      const k=keySigns(T.id).filter(x=>!/_ok$/.test(x)&&!(avoid&&(avoid.has('r:'+x)||avoid.has('x:'+x))));if(!k.length)return null;const x=pick(k);
      const others=shuffle(D.NODES.filter(n=>n.id!==T.id&&!signs(n.id).has(x)));
      const same=others.filter(n=>n.grp===T.grp),rest=others.filter(n=>n.grp!==T.grp);
      const ordered=[...same,...rest];const seen=new Set([T.name]),d=[];for(const n of [...ordered.filter(n=>!AV.has(n.name)),...ordered.filter(n=>AV.has(n.name))]){if(d.length>=3)break;if(seen.has(n.name))continue;seen.add(n.name);d.push(n);}
      if(d.length<3)return null;const opts=shuffle([T,...d]);
      return mk({type:'reverse',sig:'r:'+x,used:['x:'+x],node:T.id,opts:opts.map(n=>n.name),ans:opts.indexOf(T),
        stem:`A patient's only complaint: <strong>${esc(D.SIG[x][1])}</strong>. Which of these lesions would cause it?`,
        explain:`<p class="ans">${esc(D.SIG[x][2])}</p>`});
    },
    side(grp,T,avoid){
      // only ask a "Which side?" pattern that this lesion actually produces
      let pool=D.SIDE.filter(t=>sideFits(t.id,T)&&!(avoid&&avoid.has('d:'+t.id)));if(!pool.length)return null;
      const t=pick(pool);const s=t.fixed||(Math.random()<.5?'left':'right');const [ni,side]=t.ans(s);
      const cap=x=>x[0].toUpperCase()+x.slice(1);
      const opts=[];t.nerve.forEach(n=>['left','right'].forEach(sd=>opts.push(`${cap(sd)} ${n.charAt(0).toLowerCase()+n.slice(1)}`)));
      return {bank:key,type:'side',sig:'d:'+t.id,tpl:t.id,node:T?T.id:null,miss:`${key}:s:${t.id}`,opts,ans:ni*2+(side==='left'?0:1),stem:t.f(s),explain:`<p class="ans">${esc(t.why)}</p>`};
    },
    sideById(id){const t=D.SIDE.find(x=>x.id===id);return t;}
  };
}
/* "Which side?" patterns → the lesion(s) that cause them (a site or whole nerve that contains one also counts) */
const SIDE_FOR={
 lr1:{sd_tongue:['cn12'],sd_uvula:['cn10'],sd_jaw:['v3'],sd_scm:['cn11'],sd_v1:['v1'],sd_vii:['vii_sm'],sd_gag:['cn9'],sd_iv:['cn4'],sd_vi:['cn6'],sd_iii:['cn3'],sd_horner:['scg'],sd_ii:['cn2'],sd_phrenic:['phrenic'],sd_bell:['vii_sm'],sd_aorta:['rln']},
 lr2:{sd2_jaw:['n_lat_pt'],sd2_uvula:['x_pharyngeal'],sd2_gag:['ix_pharyngeal'],sd2_taste_ant:['chorda2'],sd2_taste_post:['ix_lingual'],sd2_tongue:['xii_submand'],sd2_abduct:['vi_dorello_n'],sd2_iii_sup:['iii_sup'],sd2_iii_inf:['iii_inf'],sd2_tear:['gr_petrosal','vidian'],sd2_hyperacusis:['s_facial_canal','geniculate'],sd2_hoarse:['rln_aortic'],sd2_masseter:['masseteric'],sd2_baro:['hering']}
};
const LR_CFG1={name:'Lesion Rounds I',types:{neck:'CERV',larynx:'VAGAL',face:'FACIAL',trig:'TRIGEM',orbit:'OCULAR',other:'SPECIAL',site:'FORAMEN'}};

const BANK={lr1:mkLR(LR1,'lr1',LR_CFG1,FACTS.lr1),lr2:mkLR(LR2,'lr2',LR_CFG2,FACTS.lr2)};
/* ================= muscle bank (Myo Ridge) ================= */
const MUS=(function(){
  const BY=Object.fromEntries(MUSCLES.map(m=>[m.id,m]));let AV=new Set();
  const fresh=a=>[...a.filter(x=>!AV.has(x)),...a.filter(x=>AV.has(x))];
  const nl=m=>MNV[m.n][0];
  const mk=(T,o)=>Object.assign({bank:'mus',node:T.id,miss:`mus:n:${T.id}`},o);
  function names(T,k,filt){const same=shuffle(MUSCLES.filter(m=>m.id!==T.id&&filt(m)&&m.p.some(x=>T.p.includes(x)))).map(m=>m.name);
    const rest=shuffle(MUSCLES.filter(m=>m.id!==T.id&&filt(m)&&!m.p.some(x=>T.p.includes(x)))).map(m=>m.name);
    return [...new Set([...same.filter(n=>!AV.has(n)),...rest.filter(n=>!AV.has(n)).slice(0,1),...same,...rest])].filter(n=>n!==T.name).slice(0,k);}
  const Q={
    case(T){const rows=[['Paralysis',T.par],['Innervation',nl(T)],['Group',T.cls[0]||'Palate muscle that inserts on the tongue'],['Attachments',T.att]];
      const d=names(T,4,m=>m.ag!==T.ag&&m.par!==T.par);if(d.length<3)return null;const opts=shuffle([T.name,...d]);
      return mk(T,{type:'case',sig:'c',rows,shown:1,opts,ans:opts.indexOf(T.name),stem:'Which muscle is this?',
        explain:`<p class="ans"><b>${esc(T.name)}</b>: ${esc(T.act)}.</p>`});},
    mnerve(T){const own=MNV[T.n];const pool=Object.keys(MNV).filter(k=>k!==T.n&&!MNV[k][1].some(x=>own[1].includes(x))).map(k=>MNV[k][0]);
      const same=pool.filter(l=>MNV[Object.keys(MNV).find(k=>MNV[k][0]===l)][2]===own[2]);
      const pickd=[...new Set([...fresh(shuffle(same)).slice(0,1),...fresh(shuffle(pool))])].slice(0,3);
      const opts=shuffle([own[0],...pickd]);
