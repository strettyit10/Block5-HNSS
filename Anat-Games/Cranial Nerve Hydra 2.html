<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Cranial Nerve Hydra 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=Silkscreen&display=swap">
<style>
/* Deliberately single-theme: a night-arena world. Every color is painted explicitly. */
:root{
  --ground:#17142B; --ground2:#120F22; --panel:#221D3F; --sunk:#1B1734; --line:#3A3366;
  --ink:#EEEAFB; --muted:#A39CC8;
  --p1:#FFB341; --p2:#3DD6C6; --boss:#FF4F8B; --heal:#6BD88E; --bad:#FF6B5B;
  --hy-bg:#3A3212; --hy-line:#D9AE2B; --hy-ink:#F7E6A6;
  --display:"Chakra Petch","Arial Narrow",sans-serif;
  --pix:"Silkscreen","Courier New",monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font:15px/1.55 var(--body);padding-inline:16px;padding-block:16px 40px;
  background-image:radial-gradient(ellipse 80% 50% at 50% 0%, #2A2352 0%, transparent 70%);background-attachment:fixed}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.pix{font-family:var(--pix);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.brand b{color:var(--boss)}

/* ---------- setup ---------- */
.setup{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:start}
.hero{display:flex;flex-direction:column;gap:14px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,6.4vw,74px);line-height:.92;margin:0;text-transform:uppercase;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--boss)}
.hero p{margin:0;color:var(--muted);max-width:54ch}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.foe{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:8px;display:flex;gap:8px;align-items:center}
.foe svg{width:44px;height:44px;flex:none}
.foe b{display:block;font-family:var(--display);font-size:13.5px;line-height:1.15}
.foe span{font-family:var(--pix);font-size:9.5px;color:var(--muted);text-transform:uppercase}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:6px;max-width:58ch}
.rules li{display:grid;grid-template-columns:92px 1fr;gap:10px;border-top:1px dashed var(--line);padding-top:6px;font-size:14px}
.rules b{font-family:var(--pix);font-size:11px;color:var(--p1);font-weight:400;padding-top:3px}
.form{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:16px}
.fl{display:flex;flex-direction:column;gap:6px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names input{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:9px 10px;border-left:5px solid var(--p1)}
.names input#p2name{border-left-color:var(--p2)}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;min-width:72px;background:var(--sunk);border:0;border-right:1px solid var(--line);padding:9px 8px;font-size:14px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:600}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.picker button{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:7px 9px;text-align:left;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.picker button[aria-pressed="true"]{border-color:var(--boss);box-shadow:inset 3px 0 0 var(--boss)}
.picker em{font-style:normal;font-family:var(--pix);font-size:10px;color:var(--muted)}
.go{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase;background:var(--boss);color:#1a0610;border:0;border-radius:4px;padding:11px 16px}

/* ---------- arena ---------- */
.arena{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:12px;align-items:stretch}
.hero-card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;transition:box-shadow .2s,opacity .3s}
.hero-card.p1{--c:var(--p1)} .hero-card.p2{--c:var(--p2)}
.hero-card.on{box-shadow:0 0 0 2px var(--c),0 0 24px -4px var(--c)}
.hero-card.ko{opacity:.45}
.hero-card .nm{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1;color:var(--c)}
.hero-card .role{font-family:var(--pix);font-size:10px;color:var(--muted);text-transform:uppercase}
.bar{height:14px;background:var(--ground2);border:1px solid var(--line);border-radius:3px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.bar.hp i{background:var(--heal)} .bar.hp.low i{background:var(--bad)}
.bar.boss{height:18px} .bar.boss i{background:linear-gradient(90deg,#B8265A,var(--boss))}
.hpnum{font-family:var(--pix);font-size:11px;display:flex;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.abil{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.abil button{flex:1;min-width:90px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:6px 6px;font-size:12.5px;line-height:1.2}
.abil button small{display:block;font-family:var(--pix);font-size:9px;color:var(--muted)}
.abil button:disabled{opacity:.35;cursor:not-allowed}
.abil button:not(:disabled):hover{border-color:var(--c)}
.ko-tag{position:absolute;top:10px;right:10px;font-family:var(--pix);font-size:12px;color:var(--bad)}
.boss-card{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center}
.boss-card .bn{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;line-height:1;letter-spacing:.03em}
.boss-card .bt{font-size:12.5px;color:var(--muted)}
.beast{height:150px;display:grid;place-items:center}
.beast svg{display:block;height:150px;width:auto;max-width:100%;overflow:visible}
.beast.hit svg{animation:hit .45s}
.beast.atk svg{animation:atk .5s}
.beast.dead svg{animation:dead .9s forwards}
.beast.gone svg{transform:translateY(20px) scale(.6);opacity:.1;filter:grayscale(1)}
@keyframes hit{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px);filter:brightness(2.2)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
@keyframes atk{0%,100%{transform:scale(1)}40%{transform:scale(1.14) translateY(8px)}}
@keyframes dead{to{transform:translateY(20px) scale(.6);opacity:.1;filter:grayscale(1)}}
.rage{font-family:var(--pix);font-size:10.5px;color:var(--boss)}
.dmg{position:absolute;font-family:var(--display);font-weight:700;font-size:30px;pointer-events:none;animation:float 1s forwards;text-shadow:0 2px 0 #000}
@keyframes float{from{transform:translateY(0);opacity:1}to{transform:translateY(-44px);opacity:0}}
.timer{height:6px;background:var(--ground2);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--muted);transform-origin:left;transition:transform .25s linear}
.timer.warn i{background:var(--bad)}
.log{font-family:var(--pix);font-size:11px;color:var(--muted);min-height:16px;text-transform:uppercase;letter-spacing:.04em}
.log b{color:var(--ink);font-weight:400}

.qpanel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--pix);font-size:10.5px;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid var(--line)}
.chip.p1{background:var(--p1);color:#231500;border-color:var(--p1)}
.chip.p2{background:var(--p2);color:#032421;border-color:var(--p2)}
.chip.dash{border-style:dashed}
.stem{margin:0;font-size:16px;line-height:1.62;max-width:76ch}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:8px 12px}
.opt .lt{font-family:var(--display);font-weight:700;font-size:17px;width:28px;height:28px;border:1.5px solid var(--line);border-radius:3px;display:grid;place-items:center;transform:rotate(45deg)}
.opt .lt span{transform:rotate(-45deg)}
.opt:not(:disabled):hover{border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.out{opacity:.3;text-decoration:line-through}
.opt.right{border-color:var(--heal);background:#193326}
.opt.right .lt{background:var(--heal);border-color:var(--heal);color:#07210F}
.opt.wrong{border-color:var(--bad);background:#3A1A22}
.opt.wrong .lt{background:var(--bad);border-color:var(--bad);color:#2a0606}
.verdict{border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--sunk)}
.verdict h3{margin:0;font-family:var(--display);font-size:22px;text-transform:uppercase}
.verdict.good h3{color:var(--heal)} .verdict.bad h3{color:var(--bad)}
.verdict p{margin:0;max-width:76ch}
.why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--muted)}
.why b{color:var(--ink);font-family:var(--pix);font-weight:400;margin-right:6px}
.hy{background:var(--hy-bg);border:1.5px solid var(--hy-line);color:var(--hy-ink);border-radius:4px;padding:9px 12px;font-size:14px}
.hy b{display:block;font-family:var(--pix);font-size:10px;font-weight:400;letter-spacing:.1em;text-transform:uppercase}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--ground);border:0;border-radius:4px;padding:10px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
kbd{font-family:var(--pix);font-size:10px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--muted)}

/* ---------- interlude / end ---------- */
.interlude{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px;display:grid;grid-template-columns:180px 1fr;gap:22px;align-items:center}
.interlude svg{width:100%;height:auto}
.interlude h2,.end h2{font-family:var(--display);font-weight:700;font-size:clamp(32px,5vw,54px);line-height:.95;margin:0 0 8px;text-transform:uppercase;text-wrap:balance}
.interlude p{margin:0 0 12px;color:var(--muted);max-width:60ch}
.path{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.path span{font-family:var(--pix);font-size:10px;padding:3px 7px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
.path span.done{color:var(--heal);border-color:var(--heal)}
.path span.now{color:var(--boss);border-color:var(--boss)}
.end{display:flex;flex-direction:column;gap:18px}
.end h2.win{color:var(--heal)} .end h2.lose{color:var(--bad)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.p1{--c:var(--p1)} .card.p2{--c:var(--p2)}
.big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;color:var(--c)}
.missed{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.missed li{font-size:13.5px;border-left:3px solid var(--line);padding-left:9px}
.missed li span{display:block;font-family:var(--pix);font-size:9.5px;color:var(--muted);text-transform:uppercase}
.foot{font-family:var(--pix);font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;text-transform:uppercase}
@media (max-width:860px){
  .setup,.cards,.interlude{grid-template-columns:1fr}
  .interlude svg{max-width:160px}
  .arena{grid-template-columns:1fr 1fr}
  .boss-card{grid-column:1 / -1;order:-1}
  .beast{height:110px}.beast svg{height:110px}
  .names,.picker{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const DECK=2;
const SETS={"neck": "The Neck", "face": "Face, Scalp & ITF", "cranial": "Skull, Meninges & Foramina", "orbit": "Orbit & Eye Reflexes", "nasal_oral": "Nose, Pharynx, Palate & Oral Cavity", "larynx": "Larynx", "cn": "Cranial Nerve Lesions"};
const Q=[{"id": "G-289", "stem": "A 65-year-old woman has 2 weeks of severe headache. CT shows a dilated branch of the basilar artery at the junction of the pons and midbrain on the right side. Which clinical feature might she have?", "opts": ["Weak abduction of the right eye", "Blurred vision from the right eye and full ptosis of the right upper eyelid", "Loss of vision from lateral fields right eye and medial fields of left eye", "Inability to detect odors through the right nostril", "Loss of sensation of the skin over the right forehead, cheek, and mandible"], "ans": 1, "why": "CN III emerges at the pons-midbrain junction between the PCA and SCA. Compression causes full ptosis (levator) and blurred near vision from loss of parasympathetic input for accommodation.", "wrong": ["Abduction is CN VI at the pontomedullary junction.", "", "That field loss pattern arises from optic tract/radiation lesions, not CN III.", "Smell is CN I in the anterior cranial fossa.", "That is a CN V lesion, which emerges from the mid-lateral pons."], "pearl": "CN III palsy: complete ptosis, down-and-out eye, dilated pupil, loss of accommodation.", "set": "cn"}, {"id": "G-224", "stem": "A 21-year-old man has an intracranial abscess compressing the ophthalmic division of the trigeminal nerve. Which of the following would be a plausible complaint?", "opts": ["Pain in the hard palate", "Anesthesia of the upper lip", "Painful eyeball", "Pain over the lower eyelid", "Tingling sensation over the buccal region of the face"], "ans": 2, "why": "V1 carries sensation from the eyeball, conjunctiva, and orbital contents (via nasociliary/ciliary nerves), so irritation of V1 can produce eye pain.", "wrong": ["Hard palate is supplied by V2 (greater palatine/nasopalatine).", "Upper lip is V2 (infraorbital).", "", "Lower eyelid is V2 (infraorbital).", "Buccal skin is V3 (buccal nerve) and V2."], "pearl": "V1 = eyeball, upper lid, forehead, nasal dorsum; V2 = lower lid, cheek, upper lip, palate.", "set": "cn"}, {"id": "G-177", "stem": "A 32-year-old man presents with nausea, vomiting, and severe headache. MRI reveals an acoustic neuroma. Which of the following nerves is most likely compressed by the tumor?", "opts": ["Facial", "Oculomotor", "Vagus", "Hypoglossal", "Abducens"], "ans": 0, "why": "An acoustic neuroma (vestibular schwannoma) arises on CN VIII in the internal acoustic meatus/cerebellopontine angle, where CN VII runs alongside it, so the facial nerve is the neighboring nerve most often compressed.", "wrong": ["", "Emerges from the midbrain, far above the CPA.", "Exits the jugular foramen, below the CPA; only affected by very large tumors.", "Exits the hypoglossal canal, not near the internal acoustic meatus.", "Runs up the clivus; not typically compressed by a CPA tumor."], "pearl": "CN VII and VIII share the internal acoustic meatus -> acoustic neuroma affects both (then V with growth).", "set": "cn"}, {"id": "G-27", "stem": "A 48-year-old woman with a brain tumor regains consciousness with her right eye directed laterally and downward, complete ptosis of the upper eyelid, and a dilated pupil. Which structure was most likely affected?", "opts": ["Oculomotor nerve", "Optic nerve", "Facial nerve", "Ciliary ganglion", "Superior cervical ganglion"], "ans": 0, "why": "CN III lesion leaves lateral rectus (VI) and superior oblique (IV) unopposed ('down and out'), paralyzes levator palpebrae (complete ptosis), and removes pupillary constrictor input (mydriasis).", "wrong": ["", "Carries vision; lesion causes visual loss, not ptosis or strabismus.", "Supplies orbicularis oculi (closes eye); lesion prevents closure, not opening.", "Lesion dilates the pupil but cannot explain ptosis or 'down and out' eye.", "Lesion causes partial ptosis with miosis (Horner), not mydriasis."], "pearl": "CN III palsy = down & out + complete ptosis + blown pupil; compressive lesions hit the pupil first.", "set": "cn"}, {"id": "BC-21", "stem": "A 24-year-old man falls from his motorcycle and lands in a creek. Bilateral severance of which of the following nerves may result in death?", "opts": ["Trigeminal nerve", "Facial nerve", "Vagus nerve", "Spinal accessory nerve", "Hypoglossal nerve"], "ans": 2, "why": "Cutting both vagus nerves paralyzes laryngeal and pharyngeal muscles (airway compromise) and removes reflex cardiovascular and GI control, which can be fatal.", "wrong": ["Bilateral trigeminal loss impairs chewing/sensation but is not lethal.", "Bilateral facial palsy is disfiguring but not lethal.", "", "Bilateral CN XI loss weakens SCM/trapezius only.", "Bilateral CN XII loss impairs tongue movement but is not typically lethal."], "pearl": "Bilateral vagal injury -> bilateral vocal cord paralysis/airway obstruction - life-threatening.", "set": "cn"}, {"id": "G-160", "stem": "A 65-year-old man is admitted after a transient ischemic attack. Imaging reveals an aneurysm in the region between the posterior cerebral artery and the superior cerebellar artery. Which of the following nerves will most likely be compressed by the aneurysm?", "opts": ["Trochlear", "Abducens", "Oculomotor", "Vagus", "Optic"], "ans": 2, "why": "The oculomotor nerve emerges from the midbrain and passes between the posterior cerebral and superior cerebellar arteries, so an aneurysm there compresses CN III (often first affecting the pupil).", "wrong": ["Winds around the midbrain; relates to the superior cerebellar artery but not between it and the PCA.", "Emerges at the pontomedullary junction, far from this arterial pair.", "", "Arises from the medulla (postolivary sulcus), too inferior.", "Lies anteriorly near the ICA/anterior circle, not the PCA-SCA region."], "pearl": "CN III passes between PCA and SCA -> aneurysm causes 'down and out' eye + dilated pupil.", "set": "cn"}, {"id": "G-37", "stem": "A 34-year-old swimmer has otitis externa. He coughs during inspection of the external auditory meatus with a speculum. The cough results from irritation of which nerve that supplies part of the external auditory meatus?", "opts": ["Vestibulocochlear", "Vagus", "Trigeminal", "Facial", "Accessory"], "ans": 1, "why": "The auricular branch of the vagus (Arnold's nerve) supplies part of the external canal; stimulating it can trigger a vagal cough reflex, as if the larynx were irritated.", "wrong": ["Serves only the inner ear (hearing and balance).", "", "V3 (auriculotemporal) does supply the canal but does not trigger a cough.", "Gives only a small sensory twig to the ear; not linked to cough.", "Purely motor to SCM and trapezius."], "pearl": "Arnold's nerve (auricular branch of CN X): ear canal stimulation → cough (ear-cough reflex).", "set": "cn"}, {"id": "LC-35", "stem": "A 68-year-old man reports hyperacusis, an increased sensitivity to loud, low-frequency sounds such as subwoofer bass. Audiometry shows normal hearing for his age. Which cranial nerve is most likely involved?", "opts": ["Facial nerve", "Vestibulocochlear nerve", "Glossopharyngeal nerve", "Vagus nerve", "Hypoglossal nerve"], "ans": 0, "why": "CN VII supplies the stapedius, which damps stapes movement in response to loud sounds. When stapedius is paralyzed, sounds feel abnormally loud (hyperacusis).", "wrong": ["", "Normal audiometry indicates CN VIII is intact.", "CN IX supplies only stylopharyngeus; no acoustic reflex role.", "CN X has no role in the acoustic reflex.", "CN XII palsy causes tongue deviation, not hyperacusis."], "pearl": "Hyperacusis with facial palsy = lesion proximal to the nerve to stapedius (CN VII).", "set": "cn"}, {"id": "BC-6", "stem": "A 28-year-old woman complains of difficulty swallowing. Examination reveals no taste sensation on the posterior one-third of her tongue and absent secretion from the parotid gland. Which of the following would most likely cause this condition?", "opts": ["Fracture of the mandibular canal", "Section of the zygomatic nerve", "Glossopharyngeal nerve injury", "Tumor in the pituitary gland", "Lesion of the hypoglossal nerve"], "ans": 2, "why": "CN IX supplies the stylopharyngeus (swallowing), general and taste sensation to the posterior third of the tongue, and parasympathetic fibers (via lesser petrosal/otic ganglion) to the parotid.", "wrong": ["Inferior alveolar injury causes numbness of lower teeth and chin.", "Zygomatic nerve section impairs lacrimal secretion.", "", "Pituitary tumor compresses the chiasm, causing bitemporal hemianopia.", "Hypoglossal lesion causes tongue deviation, not taste or parotid loss."], "pearl": "Posterior 1/3 taste + parotid secretion + stylopharyngeus = CN IX.", "set": "cn"}, {"id": "G-300", "stem": "A 40-year-old woman has 3 months of vertigo, nausea, and reduced hearing in the left ear, along with a dry mouth and dry left eye. CT shows thickening of the skull bones. Which area is most likely affected?", "opts": ["Petrous temporal bone", "Infratemporal fossa", "Facial canal", "Middle ear", "Inner ear"], "ans": 0, "why": "The petrous temporal bone contains the inner ear (CN VIII: hearing, balance) and the facial canal with CN VII (greater petrosal and chorda tympani carrying lacrimal and salivary secretomotor fibers), so one lesion there explains all findings.", "wrong": ["", "An ITF lesion would not cause hearing loss or vertigo.", "A facial canal lesion alone would not cause vertigo or hearing loss.", "Middle ear disease explains hearing loss but not dry eye/mouth.", "Inner ear disease explains vertigo and hearing loss but not dry eye/mouth."], "pearl": "Petrous temporal bone houses CN VII (facial canal) and CN VIII (inner ear).", "set": "cn"}, {"id": "G-241", "stem": "A 70-year-old man has cerumen removed from his external auditory meatus. During the procedure he begins to cough. Stimulation of an area innervated by which nerve causes the cough?", "opts": ["Vestibulocochlear", "Vagus", "Trigeminal", "Facial", "Accessory"], "ans": 1, "why": "The auricular branch of the vagus (Arnold nerve) supplies part of the external acoustic meatus. Because CN X is also the afferent limb of the cough reflex, stimulating the canal can trigger coughing.", "wrong": ["CN VIII carries hearing and balance, not canal skin sensation.", "", "Auriculotemporal (V3) supplies the canal but does not trigger cough.", "CN VII contributes small canal sensation but plays no role in the cough reflex.", "CN XI is purely motor to SCM and trapezius."], "pearl": "Arnold nerve (auricular br. of X): ear canal stimulation -> cough or vasovagal syncope.", "set": "cn"}, {"id": "G-223", "stem": "A 22-year-old man undergoes surgery for multiple facial fractures and afterward cannot taste on the tip of his tongue. Which ganglion contains the neuron cell bodies of taste fibers from this part of the tongue?", "opts": ["Trigeminal", "Geniculate", "Inferior glossopharyngeal", "Submandibular ganglion", "Pterygopalatine"], "ans": 1, "why": "Taste from the anterior two-thirds of the tongue travels in the chorda tympani (CN VII), whose sensory cell bodies are in the geniculate ganglion.", "wrong": ["Holds cell bodies of general sensation (lingual nerve), not taste.", "", "Holds cell bodies for posterior-third taste (CN IX).", "Parasympathetic ganglion; contains postganglionic motor neurons, not sensory ones.", "Parasympathetic ganglion for lacrimal/nasal glands."], "pearl": "Anterior 2/3 taste: chorda tympani -> geniculate ganglion; general sensation: lingual -> trigeminal ganglion.", "set": "cn"}, {"id": "BC-14", "stem": "A young boy with a long-standing tooth abscess suffers damage to the lingual nerve as it enters the oral cavity. Which of the following structures contain the cell bodies of the injured sensory nerve fibers?", "opts": ["Geniculate and otic ganglia", "Trigeminal and submandibular ganglia", "Trigeminal and dorsal root ganglia", "Geniculate and trigeminal ganglia", "Geniculate and pterygopalatine ganglia"], "ans": 3, "why": "Distal to its union with the chorda tympani, the lingual nerve carries general sensory fibers (cell bodies in the trigeminal ganglion) and taste fibers (cell bodies in the geniculate ganglion).", "wrong": ["Otic ganglion is parasympathetic to the parotid; no lingual fibers.", "Submandibular ganglion is autonomic, not a sensory cell-body site.", "Dorsal root ganglia belong to spinal nerves.", "", "Pterygopalatine ganglion serves lacrimal/nasal/palatal glands."], "pearl": "Lingual n. (after chorda joins): general sensation = trigeminal ganglion; taste = geniculate ganglion.", "set": "nasal_oral"}, {"id": "LC-5", "stem": "A 23-year-old man has an impacted left third mandibular molar extracted. Afterward he reports numbness of the anterior part of his tongue. Which nerve is damaged?", "opts": ["Chorda tympani nerve", "Mylohyoid nerve", "Inferior alveolar nerve", "Lingual nerve", "Glossopharyngeal nerve"], "ans": 3, "why": "The lingual nerve (CN V3) gives general sensation to the anterior two thirds of the tongue and runs right next to the third molar, so it is at risk during extraction.", "wrong": ["Chorda tympani carries taste and secretomotor fibers, not general sensation (numbness).", "Mylohyoid n. is motor to mylohyoid and anterior digastric.", "IAN supplies lower teeth, gingiva, and (via mental n.) lower lip/chin, not tongue.", "", "CN IX supplies the posterior third of the tongue."], "pearl": "Numb anterior tongue after wisdom tooth extraction = lingual nerve.", "set": "nasal_oral"}, {"id": "G-20", "stem": "A 34-year-old man has severe headaches, dizziness, and vomiting. Imaging reveals a tumor at the hypoglossal canal. Which muscle is most likely affected?", "opts": ["Geniohyoid", "Mylohyoid", "Palatoglossus", "Genioglossus", "Thyrohyoid"], "ans": 3, "why": "The hypoglossal canal transmits CN XII, which supplies the genioglossus (and other tongue muscles except palatoglossus).", "wrong": ["Supplied by C1 fibers that join CN XII only after it leaves the canal.", "Supplied by the nerve to mylohyoid (V3).", "Supplied by the vagus (pharyngeal plexus), the one tongue muscle not CN XII.", "", "Supplied by C1 fibers traveling with CN XII below the skull."], "pearl": "All tongue muscles = CN XII except palatoglossus (CN X); C1 hitchhikes on XII to geniohyoid and thyrohyoid.", "set": "nasal_oral"}, {"id": "G-303", "stem": "A 30-year-old woman has nasal congestion, headache, clear rhinorrhea, fever, and swollen conchae. There is tenderness over the forehead above the nasal root and on either side of the glabella. Which structure is the most likely passage for spread of infection?", "opts": ["Pharyngotympanic tube", "Ethmoidal infundibulum", "Nasolacrimal duct", "Spheno-ethmoidal recess", "Superior nasal meatus"], "ans": 1, "why": "The frontal sinus and anterior ethmoidal cells drain into the middle meatus through the ethmoidal infundibulum and semilunar hiatus, linking nasal infection to the tender sinuses near the glabella.", "wrong": ["The pharyngotympanic tube links the nasopharynx to the middle ear.", "", "The nasolacrimal duct drains tears to the inferior meatus.", "The sphenoethmoidal recess drains the sphenoid sinus.", "The superior meatus drains the posterior ethmoidal cells."], "pearl": "Middle meatus (semilunar hiatus/infundibulum): frontal, maxillary, anterior ethmoid sinuses.", "set": "nasal_oral"}, {"id": "G-49", "stem": "A 24-year-old man had a lower third molar extracted, after which he lost general sensation and taste from the anterior two thirds of his tongue. Which nerve was most likely injured?", "opts": ["Auriculotemporal", "Chorda tympani", "Lingual", "Mental", "Inferior alveolar"], "ans": 2, "why": "Beside the lower third molar the lingual nerve already contains chorda tympani fibers, so its injury removes both general sensation and taste from the anterior tongue.", "wrong": ["Supplies skin of temple and ear, not the tongue.", "Carries taste but not general sensation.", "", "Supplies chin and lower lip skin.", "Supplies lower teeth, chin and lip, not the tongue."], "pearl": "Lingual nerve lies just medial to the lower third molar, a classic extraction injury.", "set": "nasal_oral"}, {"id": "G-229", "stem": "A 26-year-old man suffers a midface injury. Examination reveals intact taste and salivation but no general sensation from his anterior tongue. Which nerve was probably injured?", "opts": ["Lingual proximal to its junction with the chorda tympani", "Chorda tympani", "Inferior alveolar", "Lingual distal to its junction with the chorda tympani", "Glossopharyngeal"], "ans": 0, "why": "Above its junction with the chorda tympani the lingual nerve carries only V3 general sensation. A lesion there removes touch sensation but spares taste and salivary fibers, which join below.", "wrong": ["", "Would lose taste and submandibular/sublingual secretion.", "Supplies the lower teeth and chin, not the tongue.", "Would lose taste and salivary fibers as well as sensation.", "Supplies the posterior third, not the anterior tongue."], "pearl": "Lingual nerve proximal to chorda junction = pure V3 sensation; distal = sensation + taste + secretomotor.", "set": "nasal_oral"}, {"id": "BH-38", "stem": "During a fight, a 17-year-old boy is punched and his nasal septum is broken. Which structures would be damaged?", "opts": ["Septal cartilage and nasal bone", "Inferior concha and vomer", "Vomer and perpendicular plate of the ethmoid", "Septal cartilage and middle concha", "Cribriform plate and frontal bone"], "ans": 2, "why": "The nasal septum is built from the perpendicular plate of the ethmoid, the vomer, and the septal cartilage.", "wrong": ["Nasal bones form the bridge/roof, not the septum.", "Inferior concha is part of the lateral wall.", "", "Middle concha is part of the lateral wall.", "Cribriform plate and frontal bone form the roof."], "pearl": "Septum = perpendicular plate of ethmoid + vomer + septal cartilage.", "set": "nasal_oral"}, {"id": "BC-17", "stem": "A 71-year-old man has a benign tumor in the pterygoid canal. Which of the following nerve fibers could be injured by this condition?", "opts": ["Preganglionic parasympathetic fibers", "Taste fibers from the epiglottis", "Somatic afferent (SA) fibers", "Preganglionic sympathetic fibers", "Branchiomeric muscle fibers"], "ans": 0, "why": "The nerve of the pterygoid canal (Vidian nerve) is formed by the greater petrosal nerve (preganglionic parasympathetic plus palatal taste) and the deep petrosal nerve (postganglionic sympathetic), heading to the pterygopalatine ganglion.", "wrong": ["", "Epiglottic taste travels with the internal laryngeal nerve (CN X).", "Vidian nerve carries visceral, not somatic, afferents.", "Its sympathetic fibers are postganglionic (deep petrosal), not preganglionic.", "It carries no branchial motor fibers."], "pearl": "Vidian nerve = greater petrosal (pre-parasympathetic) + deep petrosal (post-sympathetic).", "set": "nasal_oral"}, {"id": "LC-28", "stem": "While planning a dinner, a physician finds himself salivating at the thought of the meal. Which description accurately describes the secretomotor pathway to the submandibular gland?", "opts": ["Parasympathetic fibers via the inferior alveolar nerve", "Sympathetic fibers via the lingual nerve", "Parasympathetic fibers via the mandibular branch of the facial nerve", "Sympathetic fibers via the hypoglossal nerve", "Parasympathetic fibers via the chorda tympani nerve"], "ans": 4, "why": "Submandibular and sublingual secretion is driven by CN VII parasympathetics in the chorda tympani. These fibers hitch a ride on the lingual nerve and synapse in the submandibular ganglion.", "wrong": ["IAN is sensory to lower teeth/lip; no salivary secretomotor role.", "Secretomotor drive is parasympathetic; lingual n. carries chorda tympani fibers.", "The marginal mandibular branch is motor to facial muscles only.", "CN XII is motor to the tongue; not secretomotor.", ""], "pearl": "Submandibular/sublingual = CN VII (chorda tympani → submandibular ganglion); parotid = CN IX (lesser petrosal → otic ganglion).", "set": "nasal_oral"}, {"id": "G-54", "stem": "A 21-year-old man has severe epistaxis from the nasal septum. This area, Kiesselbach's (Little's) area, involves mostly anastomoses between which arteries?", "opts": ["Ascending palatine and ascending pharyngeal", "Posterior superior alveolar and accessory meningeal", "Lateral branches of posterior ethmoidal and middle meningeal", "Septal branches of the sphenopalatine and superior labial", "Descending palatine and tonsillar branches of the pharyngeal"], "ans": 3, "why": "Kiesselbach's plexus on the anterior septum is fed by anterior ethmoidal, sphenopalatine, greater palatine and superior labial arteries, with septal sphenopalatine and superior labial branches the main contributors.", "wrong": ["Pharyngeal/palatine vessels that do not reach the anterior septum.", "Supply maxillary teeth and cranial structures, not the septum.", "Middle meningeal is intracranial; posterior ethmoidal supplies the upper posterior nose.", "", "Supply palate and tonsil, not the anterior septum."], "pearl": "Anterior epistaxis = Kiesselbach's plexus; posterior epistaxis = sphenopalatine artery.", "set": "nasal_oral"}, {"id": "LC-10", "stem": "A 24-year-old man with chronic maxillary sinusitis has a soft-tissue mass in the roof of the right maxillary sinus, which is biopsied endoscopically. Postoperatively he has paresthesia and numbness of the right lower eyelid and upper lip. Which nerve was most likely damaged?", "opts": ["First division of trigeminal nerve", "Second division of trigeminal nerve", "Third division of trigeminal nerve", "Zygomatic branch of facial nerve", "Buccal branch of facial nerve"], "ans": 1, "why": "The infraorbital nerve, the continuation of V2, runs in the roof of the maxillary sinus (orbital floor) and supplies the lower eyelid, cheek, and upper lip.", "wrong": ["V1 supplies the forehead and upper eyelid and does not course through the maxillary sinus.", "", "V3 supplies the lower lip and chin; no branch runs in the sinus roof.", "Facial nerve branches are motor only and cause no numbness.", "Facial nerve branches are motor only and cause no numbness."], "pearl": "Maxillary sinus roof / orbital floor injury = infraorbital nerve (V2): numb lower lid, cheek, upper lip.", "set": "nasal_oral"}, {"id": "LH-28", "stem": "A 10-year-old boy has sore throat, earache, and high fever, with severely swollen palatine tonsils. What nerve carries the sensory input for most of his symptoms?", "opts": ["Greater palatine", "Lesser palatine", "Vagus", "Posterior superior alveolar", "Glossopharyngeal"], "ans": 4, "why": "CN IX supplies general sensation to the palatine tonsils, oropharynx, posterior tongue, and (via the tympanic nerve) the middle ear, so it carries both the throat pain and the referred earache.", "wrong": ["Supplies the hard palate mucosa and gingiva", "Supplies the soft palate; contributes little to tonsil or ear sensation", "Supplies laryngopharynx and larynx; not the main tonsillar nerve", "Supplies upper molar teeth and maxillary sinus", ""], "pearl": "Tonsillitis earache = referred pain via CN IX (tonsil + tympanic plexus).", "set": "nasal_oral"}, {"id": "LH-63", "stem": "A baby boy has scaphocephaly (a long, narrow, boat-shaped head). Which suture closed prematurely?", "opts": ["Coronal", "Sagittal", "Lambdoid", "Metopic", "Squamous"], "ans": 1, "why": "Early fusion of the sagittal suture prevents side-to-side growth, so the skull lengthens anteroposteriorly into a long, narrow shape; it is the most common craniosynostosis.", "wrong": ["Causes a short, wide skull (brachycephaly)", "", "Causes flattening of the back of the head (plagiocephaly)", "Causes a triangular forehead (trigonocephaly)", "Rarely fuses early; does not cause scaphocephaly"], "pearl": "Sagittal synostosis -> scaphocephaly (most common); metopic -> trigonocephaly.", "set": "cranial"}, {"id": "G-125", "stem": "A 54-year-old man is hit by a car. Imaging shows a fracture through the crista galli with slow local bleeding. What is the most likely source of the bleeding?", "opts": ["Middle meningeal artery", "The great cerebral vein of Galen", "Superior sagittal sinus", "Straight sinus", "Superior ophthalmic vein"], "ans": 2, "why": "The falx cerebri, which carries the superior sagittal sinus, attaches in front to the crista galli. Venous bleeding from the sinus is slow.", "wrong": ["Lies near the pterion and would bleed briskly (arterial).", "Lies at the back, near the straight sinus.", "", "Lies at the back, where the falx meets the tentorium.", "Runs from the orbit to the cavernous sinus, not near the crista galli."], "pearl": "The falx cerebri (with the superior sagittal sinus) anchors to the crista galli in front.", "set": "cranial"}, {"id": "G-239", "stem": "An 88-year-old man cannot abduct his right eye and has an absent corneal reflex on the same side. A growth at which skull opening could explain both findings?", "opts": ["Inferior orbital fissure", "Optic canal", "Superior orbital fissure", "Foramen rotundum", "Foramen ovale"], "ans": 2, "why": "The superior orbital fissure transmits CN VI (lateral rectus) and branches of V1, including the nasociliary nerve that carries corneal sensation (afferent limb of the corneal reflex). A lesion there explains both deficits.", "wrong": ["Transmits the zygomatic nerve (V2) and infraorbital vessels, not CN VI or V1.", "Carries CN II and the ophthalmic artery only.", "", "Carries V2, which does not supply the cornea or lateral rectus.", "Carries V3, unrelated to abduction or corneal sensation."], "pearl": "SOF: CN III, IV, V1 (lacrimal, frontal, nasociliary), VI, superior ophthalmic vein.", "set": "cranial"}, {"id": "G-48", "stem": "A 54-year-old man with severe headaches has an internal carotid artery aneurysm inside the cavernous sinus. Which nerve would typically be affected first?", "opts": ["Abducens nerve", "Oculomotor nerve", "Ophthalmic nerve", "Maxillary nerve", "Trochlear nerve"], "ans": 0, "why": "CN VI runs free within the cavernous sinus right beside the ICA, whereas the others lie in the lateral dural wall, so VI is compressed first.", "wrong": ["", "Lies in the lateral wall, farther from the ICA.", "Lies in the lateral wall, farther from the ICA.", "Lies low in the lateral wall, farther from the ICA.", "Lies in the lateral wall, farther from the ICA."], "pearl": "Cavernous sinus: ICA + CN VI in the middle; III, IV, V1, V2 in the lateral wall → abducens palsy (medial deviation) first.", "set": "cranial"}, {"id": "BH-44", "stem": "A 59-year-old woman with pain at the side of her skull has a large lesion in the internal auditory meatus on CT. This condition may progress to damage which pair of structures?", "opts": ["Vagus and glossopharyngeal nerves", "Internal carotid and vertebral arteries", "Internal jugular vein and trigeminal nerve", "Facial and vestibulocochlear nerves", "Hypoglossal and accessory nerves"], "ans": 3, "why": "The internal acoustic meatus transmits CN VII and CN VIII (with the labyrinthine artery).", "wrong": ["CN IX and X exit via the jugular foramen.", "ICA uses the carotid canal; vertebral uses the foramen magnum.", "IJV uses the jugular foramen; CN V divisions use SOF/rotundum/ovale.", "", "CN XII uses the hypoglossal canal; CN XI the jugular foramen."], "pearl": "Internal acoustic meatus = CN VII + VIII (vestibular schwannoma).", "set": "cranial"}, {"id": "G-19", "stem": "A 17-year-old girl has signs of cavernous sinus thrombosis. Thrombophlebitis in the 'danger area' of the face can spread to the cavernous sinus and involve the ophthalmic division of the trigeminal nerve. Which symptom is most likely present?", "opts": ["Pain in the hard palate", "Anesthesia of the upper lip", "Pain from the eyeball", "Pain over the lower eyelid", "Tingling sensation over the buccal region of the face"], "ans": 2, "why": "The ophthalmic division (V1) carries sensation from the eyeball (via nasociliary/long ciliary nerves), so V1 involvement produces eye pain.", "wrong": ["Hard palate sensation is V2 (greater palatine/nasopalatine).", "Upper lip is supplied by the infraorbital nerve (V2).", "", "Lower eyelid is supplied by the infraorbital nerve (V2).", "Cheek skin over the zygoma/buccal region is V2 (and V3 buccal), not V1."], "pearl": "V1 = eyeball, cornea, forehead, upper eyelid, dorsum of nose; V2 = lower lid, cheek, upper lip, palate.", "set": "cranial"}, {"id": "LC-21", "stem": "A 57-year-old woman has right facial paralysis, dizziness, and hearing loss on the right side. MRI shows a brain tumor. Based on her presentation, where is the tumor located?", "opts": ["Foramen rotundum", "Foramen ovale", "Internal acoustic meatus", "Facial canal", "Stylomastoid foramen"], "ans": 2, "why": "Combined CN VII (facial paralysis) and CN VIII (hearing loss, dizziness) deficits localize to where both nerves run together: the internal acoustic meatus, typical of a vestibular schwannoma at the cerebellopontine angle.", "wrong": ["Transmits V2; would cause midface numbness.", "Transmits V3; would cause mastication weakness and lower-face numbness.", "", "CN VIII is not in the facial canal, so hearing would be spared.", "Only CN VII exits here; hearing would be spared."], "pearl": "CN VII + VIII deficits = internal acoustic meatus / CPA (vestibular schwannoma).", "set": "cranial"}, {"id": "G-135", "stem": "A 56-year-old man has severe headaches and ear pain. Imaging shows a tumor in the middle ear eroding through its bony floor. Which structure will most likely be affected?", "opts": ["The cochlea and lateral semicircular canal", "The internal carotid artery", "The sigmoid venous sinus", "The internal jugular bulb", "The aditus ad antrum of the mastoid region and the facial nerve"], "ans": 3, "why": "The floor of the middle ear is a thin plate of bone lying directly over the superior bulb of the internal jugular vein.", "wrong": ["These are medial, in the inner ear, not below the floor.", "Related to the anterior (carotid) wall.", "Lies posteriorly and becomes the jugular bulb only at the jugular foramen.", "", "These are related to the posterior wall."], "pearl": "Middle ear walls: floor = jugular bulb; anterior = ICA; posterior = mastoid antrum; medial = inner ear.", "set": "cranial"}, {"id": "BC-13", "stem": "A 47-year-old man cannot move his eyeball laterally. Which of the following conditions would cause this sign?", "opts": ["Tumor of the pituitary gland", "Occlusion of the posterior cerebral artery", "Infection in the maxillary sinus", "Infection in the cavernous sinus", "Tumor in the anterior cranial fossa"], "ans": 3, "why": "The abducens nerve runs through the middle of the cavernous sinus beside the internal carotid artery, making it the most vulnerable nerve to cavernous sinus infection or thrombosis.", "wrong": ["Pituitary tumors classically compress the chiasm (bitemporal hemianopia).", "PCA occlusion affects occipital cortex and midbrain, not CN VI in isolation.", "Maxillary sinus infection does not reach CN VI.", "", "Anterior cranial fossa tumors affect olfaction/frontal lobe, not CN VI."], "pearl": "CN VI lies free within the cavernous sinus - often the first nerve affected.", "set": "cranial"}, {"id": "LH-4", "stem": "A 15-year-old boy developed cavernous sinus thrombophlebitis after a 1-week history of a single acne-like lesion at the anterior tip of his nose. He presented with headache, periorbital edema, diplopia, and fever (103°F). What vein is the most likely route for spread of this infection to the cavernous sinus?", "opts": ["Ophthalmic", "Superior cerebral", "Great cerebral (of Galen)", "Maxillary", "Supraorbital"], "ans": 0, "why": "The facial vein communicates with the superior (and inferior) ophthalmic veins, which drain directly into the cavernous sinus. These valveless connections let infection from the 'danger triangle' of the face reach the cavernous sinus.", "wrong": ["", "Drain cerebral cortex into the superior sagittal sinus, not from the nose", "Drains deep brain into the straight sinus", "Drains the infratemporal region into the retromandibular vein; reaches the sinus only indirectly via the pterygoid plexus", "Drains forehead into the ophthalmic/facial veins; not the direct route from the nose tip"], "pearl": "Danger triangle: facial v. -> ophthalmic vv. -> cavernous sinus (valveless).", "set": "cranial"}, {"id": "G-25", "stem": "A 70-year-old man with chronic headache and enlarged lymph nodes has a tumor at the jugular foramen. Which neurologic deficit is most likely?", "opts": ["Loss of tongue movements", "Loss of facial expression", "Loss of sensation from the face and the scalp", "Loss of hearing", "Loss of gag reflex"], "ans": 4, "why": "CN IX (gag afferent) and CN X (gag efferent) both exit the jugular foramen with CN XI and the IJV, so compression abolishes the gag reflex.", "wrong": ["CN XII exits via the hypoglossal canal.", "CN VII exits the skull via the internal acoustic meatus/stylomastoid foramen.", "Facial and scalp sensation is CN V (SOF, rotundum, ovale).", "CN VIII passes through the internal acoustic meatus.", ""], "pearl": "Jugular foramen = CN IX, X, XI + IJV (Vernet syndrome); gag reflex = IX in, X out.", "set": "cranial"}, {"id": "LC-16", "stem": "A 42-year-old woman has a drooping right upper eyelid and a constricted right pupil. Examination shows ptosis, miosis, anhidrosis, facial flushing, and a narrowed palpebral fissure on the right. Which structure is most likely damaged?", "opts": ["Superior division of the oculomotor nerve", "Superior cervical ganglion", "Nerve of the pterygoid canal", "Ciliary ganglion", "Ophthalmic division of trigeminal nerve"], "ans": 1, "why": "This is Horner syndrome, a loss of sympathetic supply to the head. All postganglionic sympathetic fibers to the head arise from the superior cervical ganglion, the only sympathetic option.", "wrong": ["Skeletal motor to superior rectus and levator; ptosis only, no miosis or anhidrosis.", "", "Loss would cause dry eye and nasal mucosa, not Horner signs.", "Damage would impair pupil/accommodation but not facial sweating or flushing.", "Sensory only; would cause numbness of upper face and cornea."], "pearl": "Horner = ptosis (superior tarsal), miosis, anhidrosis; sympathetic chain/SCG lesion.", "set": "orbit"}, {"id": "G-103", "stem": "A 72-year-old woman has painful tenderness in her upper right chest. On examination her right eyelid droops slightly and her right pupil is smaller than the left. What is the most likely diagnosis?", "opts": ["Raynaud disease", "Frey syndrome", "Bell palsy", "Quinsy", "Pancoast tumor"], "ans": 4, "why": "A Pancoast tumor at the lung apex can invade the cervical sympathetic chain and stellate ganglion, causing Horner syndrome (mild ptosis and miosis) on the same side.", "wrong": ["A vasospastic disorder of the fingers and toes; it does not cause Horner signs.", "Gustatory sweating after parotid surgery.", "A CN VII palsy causes facial muscle weakness, not miosis.", "A peritonsillar abscess.", ""], "pearl": "Apical lung tumor + ipsilateral Horner syndrome = Pancoast tumor.", "set": "orbit"}, {"id": "LC-18", "stem": "A 27-year-old woman has asymmetric pupils: her right pupil is abnormally dilated and responds slowly to light. Visual acuity is normal, and there are no other signs or symptoms. Which structure is most likely affected?", "opts": ["Superior cervical ganglion", "Optic nerve", "Oculomotor nerve", "Trochlear nerve", "Abducent nerve"], "ans": 2, "why": "Parasympathetic fibers ride on the outside of CN III, so compression affects them first. Loss of sphincter pupillae gives a dilated, sluggish pupil, an early sign of CN III compression (e.g., uncal herniation).", "wrong": ["SCG damage gives miosis (Horner), not a dilated pupil.", "Optic nerve damage would impair vision in that eye.", "", "CN IV palsy causes vertical diplopia, not pupil changes.", "CN VI palsy causes impaired abduction, not pupil changes."], "pearl": "Isolated blown/sluggish pupil = early CN III compression (parasympathetics are superficial).", "set": "orbit"}, {"id": "LH-54", "stem": "A 47-year-old man has diplopia after hitting his head on the steering wheel. His ophthalmologist asks him to look first inward (toward his nose) and then upward. The integrity of which extraocular muscle is being tested?", "opts": ["Superior oblique", "Inferior oblique", "Lateral rectus", "Inferior rectus", "Superior rectus"], "ans": 1, "why": "When the eye is adducted, the obliques become the main vertical movers; the inferior oblique elevates the adducted eye, so looking in and up isolates it.", "wrong": ["Tested by looking in and DOWN", "", "Tested by looking laterally (abduction)", "Tested by looking out and down", "Tested by looking out and up"], "pearl": "Clinical testing: IO = in & up; SO = in & down; SR = out & up; IR = out & down.", "set": "orbit"}, {"id": "G-79", "stem": "An 8-year-old boy has a drooping right eyelid (ptosis), and Horner syndrome is suspected. Which additional sign on the right side would confirm the diagnosis?", "opts": ["Constricted pupil", "Dry eye", "Exophthalmos", "Pale, blanched face", "Sweaty face"], "ans": 0, "why": "Horner syndrome is loss of sympathetic supply to the head: ptosis, miosis (small pupil) and anhidrosis. With the dilator pupillae unopposed, the pupil constricts.", "wrong": ["", "Tear secretion is parasympathetic (CN VII), so tearing is spared.", "Horner causes no protrusion (apparent enophthalmos, if anything); exophthalmos suggests hyperthyroidism.", "Loss of sympathetic vasoconstriction causes flushing, not pallor.", "Sympathetic loss causes anhidrosis, not sweating."], "pearl": "Horner triad: ptosis, miosis, anhidrosis (plus facial flushing).", "set": "orbit"}, {"id": "G-237", "stem": "A comatose head-trauma patient is examined. A light shined into the right eye causes that pupil to constrict. This confirms that which two nerves are intact?", "opts": ["Optic and facial", "Optic and oculomotor", "Maxillary and facial", "Ophthalmic and oculomotor", "Ophthalmic and facial"], "ans": 1, "why": "In the pupillary light reflex, CN II carries the afferent light signal and CN III carries parasympathetic efferents (Edinger-Westphal -> ciliary ganglion -> short ciliary nerves) to the sphincter pupillae.", "wrong": ["Facial nerve is the efferent limb of the corneal (blink) reflex, not the pupillary reflex.", "", "Neither V2 nor VII participates in the light reflex.", "V1 is the corneal reflex afferent; light is sensed by CN II.", "V1 + VII is the corneal reflex pair."], "pearl": "Light reflex: II in, III out. Corneal reflex: V1 in, VII out.", "set": "orbit"}, {"id": "BH-26", "stem": "A 26-year-old baseball player is struck in the head, fracturing the optic canal. Which pair of structures is most likely damaged?", "opts": ["Optic nerve and ophthalmic vein", "Ophthalmic vein and ophthalmic nerve", "Ophthalmic artery and optic nerve", "Ophthalmic nerve and optic nerve", "Ophthalmic artery and ophthalmic vein"], "ans": 2, "why": "Only the optic nerve and ophthalmic artery pass through the optic canal.", "wrong": ["Ophthalmic vein uses the superior orbital fissure.", "Both of these pass through the superior orbital fissure.", "", "Ophthalmic nerve (V1) uses the superior orbital fissure.", "Ophthalmic vein uses the superior orbital fissure."], "pearl": "Optic canal = CN II + ophthalmic artery.", "set": "orbit"}, {"id": "BH-35", "stem": "A 61-year-old woman has ocular lymphoma invading her optic canal. Which structure is most likely damaged?", "opts": ["Ophthalmic vein", "Ophthalmic nerve", "Oculomotor nerve", "Trochlear nerve", "Ophthalmic artery"], "ans": 4, "why": "The optic canal transmits only the optic nerve and the ophthalmic artery.", "wrong": ["Ophthalmic vein passes through the superior orbital fissure.", "V1 passes through the superior orbital fissure.", "CN III passes through the superior orbital fissure.", "CN IV passes through the superior orbital fissure.", ""], "pearl": "Optic canal = CN II + ophthalmic artery; everything else to the orbit uses the SOF.", "set": "orbit"}, {"id": "LH-17", "stem": "A 23-year-old man was punched in the left eye in a bar fight, resulting in periorbital edema and ecchymosis. When his eyelids are pried open he has vertical diplopia, especially when asked to look up. Coronal CT shows asymmetry of the left orbit with soft tissue in the superior part of the maxillary sinus. What is the most likely cause of the diplopia?", "opts": ["Paralysis of lateral rectus muscle", "Entrapment of inferior rectus muscle", "Detached retina", "Paralysis of superior oblique muscle", "Damage to infraorbital nerve"], "ans": 1, "why": "A blowout fracture of the thin orbital floor lets orbital fat and the inferior rectus herniate into the maxillary sinus. The trapped muscle cannot relax, so upward gaze is restricted and vertical diplopia results.", "wrong": ["Would cause horizontal diplopia; the muscle is lateral, away from the floor fracture", "", "Causes visual field loss, not gaze-dependent diplopia", "Gives vertical diplopia worst on looking down and in, not restricted upgaze", "Causes numbness of the cheek/upper lip, not diplopia"], "pearl": "Orbital floor blowout -> inferior rectus entrapment -> impaired upgaze + infraorbital numbness.", "set": "orbit"}, {"id": "BH-21", "stem": "A 41-year-old woman overdoses on medications that stimulate autonomic nerves. Which of the following results from stimulation of the parasympathetic fibers to the eyeball?", "opts": ["Enhanced vision for distant objects", "Dilation of the pupil", "Contraction of capillaries in the iris", "Contraction of the ciliary muscle", "Flattening of the lens"], "ans": 3, "why": "Parasympathetic fibers (CN III -> ciliary ganglion -> short ciliary nerves) contract the ciliary muscle and sphincter pupillae, rounding the lens for near vision and constricting the pupil.", "wrong": ["Distant vision (lens flattening) occurs when the ciliary muscle relaxes.", "Pupil dilation is sympathetic (dilator pupillae).", "Iris vasoconstriction is sympathetic.", "", "Lens flattening follows ciliary relaxation, not parasympathetic stimulation."], "pearl": "Parasympathetic eye: miosis + ciliary contraction = near vision (accommodation).", "set": "orbit"}, {"id": "BH-30", "stem": "A benign orbital tumor in a 49-year-old man compresses a structure that passes through both the superior orbital fissure and the common tendinous ring. Which structure is most likely damaged?", "opts": ["Frontal nerve", "Lacrimal nerve", "Trochlear nerve", "Abducens nerve", "Ophthalmic vein"], "ans": 3, "why": "The abducens nerve (with CN III divisions and nasociliary) passes through the SOF within the common tendinous ring.", "wrong": ["Frontal nerve passes through the SOF outside the ring.", "Lacrimal nerve passes through the SOF outside the ring.", "Trochlear nerve passes through the SOF outside the ring.", "", "Superior ophthalmic vein passes above/outside the ring."], "pearl": "Inside the ring: CN III (sup & inf), nasociliary, CN VI. Outside: LFT (lacrimal, frontal, trochlear) + vein.", "set": "orbit"}, {"id": "LC-6", "stem": "A 47-year-old woman with multiple sclerosis has sudden paroxysms of pain in her right lower lip, mandibular teeth and gingivae, and cheek, triggered by eating, talking, or brushing her teeth. Which nerve is the source of her pain?", "opts": ["First division of trigeminal nerve", "Second division of trigeminal nerve", "Third division of trigeminal nerve", "Buccal branch of facial nerve", "Marginal mandibular branch of facial nerve"], "ans": 2, "why": "This is trigeminal neuralgia in the V3 territory: V3 supplies the lower lip, chin, cheek (buccal n.), and mandibular teeth/gums (inferior alveolar n.). Demyelinating disease such as MS is a known cause.", "wrong": ["V1 supplies forehead, upper eyelid, and dorsum of nose.", "V2 supplies lower eyelid, upper lip, cheek, and maxillary teeth.", "", "Facial nerve branches are motor only; no pain sensation.", "Facial nerve branches are motor only; supplies lower lip muscles."], "pearl": "Trigeminal neuralgia (tic douloureux): lancinating triggered facial pain; think MS in young patients.", "set": "face"}, {"id": "BH-6", "stem": "A 45-year-old woman has numbness over the tip of her nose. Which of the following nerves is most likely damaged?", "opts": ["Ophthalmic division of the trigeminal nerve", "Maxillary division of the trigeminal nerve", "Mandibular division of the trigeminal nerve", "Facial nerve", "Auriculotemporal nerve"], "ans": 0, "why": "The skin of the nasal tip is supplied by the external nasal branch of the anterior ethmoidal nerve, a branch of nasociliary from V1.", "wrong": ["", "V2 supplies skin between lower eyelid and upper lip, including the side of the nose.", "V3 supplies the lower face below the lower lip/jaw.", "Facial nerve is motor to facial muscles and gives no facial skin sensation.", "Auriculotemporal (V3) supplies the auricle and temporal scalp."], "pearl": "Nasal tip = V1 (external nasal n.) - Hutchinson sign in zoster.", "set": "face"}, {"id": "G-108", "stem": "A 45-year-old woman has a parotid tumor removed. Three months later, her face sweats heavily when she tastes or smells food, and Frey syndrome (gustatory sweating) is diagnosed. Which nerve was most likely injured during the operation?", "opts": ["Buccal", "Inferior alveolar", "Auriculotemporal", "Facial", "Lingual"], "ans": 2, "why": "The auriculotemporal nerve carries parasympathetic fibers from the otic ganglion to the parotid. After it is cut, these fibers can regrow into the skin's sweat glands, so eating triggers sweating instead of salivation.", "wrong": ["Sensory to the cheek; it carries no parotid secretomotor fibers.", "Supplies the lower teeth; it is not in the parotid.", "", "Injury to CN VII causes facial paralysis, not gustatory sweating.", "Carries fibers to the submandibular ganglion, not the parotid."], "pearl": "Frey syndrome = misdirected regrowth of the auriculotemporal nerve (CN IX fibers via the otic ganglion) after parotid surgery.", "set": "face"}, {"id": "G-100", "stem": "After a mastoidectomy, an 8-year-old boy has facial paralysis (Bell palsy). Saliva collects in the vestibule of his mouth and dribbles from the corner of his mouth. Which muscle is most likely paralyzed?", "opts": ["Zygomaticus major", "Orbicularis oculi", "Buccinator", "Levator palpebrae superioris", "Orbicularis oris"], "ans": 2, "why": "The buccinator keeps the cheek pressed against the teeth, which stops food and saliva from collecting in the vestibule. When it is paralyzed, material pools in the cheek.", "wrong": ["Raises the corner of the mouth when smiling; it does not keep the vestibule clear.", "Closes the eyelids; it has no role in the cheek.", "", "Raises the eyelid and is supplied by CN III, not CN VII.", "Closes the lips, but the cheek muscle is what keeps the vestibule empty."], "pearl": "Buccinator (CN VII buccal branch) keeps food and saliva out of the vestibule.", "set": "face"}, {"id": "G-51", "stem": "Where are the postganglionic parasympathetic neuronal cell bodies that directly innervate the parotid gland?", "opts": ["Trigeminal (semilunar, Gasserian) ganglion", "Inferior salivatory nucleus", "Superior cervical ganglion", "Otic ganglion", "Submandibular ganglion"], "ans": 3, "why": "The otic ganglion, just below the foramen ovale on V3, holds the postganglionic neurons whose fibers ride the auriculotemporal nerve to the parotid.", "wrong": ["Contains sensory neurons only.", "Contains the preganglionic neurons (CN IX), not postganglionic.", "Contains postganglionic sympathetic neurons.", "", "Supplies submandibular and sublingual glands."], "pearl": "Parotid: inferior salivatory nucleus → CN IX → tympanic n. → lesser petrosal → otic ganglion → auriculotemporal n.", "set": "face"}, {"id": "LH-25", "stem": "A dentist performs a regional nerve block by passing the needle through the oral mucosa at the apex of the maxillary vestibule and beyond the roots of the teeth toward the right upper canine region. The patient then has numbness of the upper canine and neighboring teeth, as well as the skin of the right lower eyelid, cheek, lateral nose, and upper lip. What nerve was blocked?", "opts": ["Anterior superior alveolar", "External nasal", "Infratrochlear", "Infraorbital", "Nasopalatine"], "ans": 3, "why": "The infraorbital nerve (CN V2) gives off the anterior and middle superior alveolar nerves to the anterior upper teeth and then exits the infraorbital foramen to supply the lower eyelid, cheek, side of the nose, and upper lip. Only it explains both the dental and facial numbness.", "wrong": ["Supplies the anterior upper teeth only, not the eyelid or cheek skin", "Supplies skin of the nasal dorsum and tip only (V1)", "Supplies medial eyelids and side of the nose root (V1)", "", "Supplies the nasal septum and anterior hard palate"], "pearl": "Infraorbital n. (V2): lower eyelid, cheek, lateral nose, upper lip (+ upper anterior teeth via superior alveolar branches).", "set": "face"}, {"id": "G-141", "stem": "A 55-year-old woman has a malignant parotid tumor removed. Afterward, the muscles of her lower lip are clearly weak. Which nerve was most likely injured?", "opts": ["Marginal mandibular branch of facial", "Zygomatic branch of facial", "Mandibular division of the trigeminal nerve", "Buccal branch of facial", "Buccal nerve"], "ans": 0, "why": "The marginal mandibular branch of CN VII leaves the parotid and runs along the mandible to supply the lower lip depressors.", "wrong": ["", "Supplies the orbicularis oculi (eye closure).", "V3 supplies the chewing muscles, not the lip muscles.", "Supplies the buccinator and upper lip muscles.", "The buccal nerve (V3) is sensory to the cheek."], "pearl": "Parotid surgery puts the CN VII branches at risk; the marginal mandibular branch controls the lower lip.", "set": "face"}, {"id": "G-50", "stem": "A 56-year-old woman has rheumatoid arthritis of her temporomandibular joint (TMJ) and severe ear pain. Which nerve most likely conducts the pain sensation?", "opts": ["Facial", "Auriculotemporal", "Lesser petrosal", "Vestibulocochlear", "Chorda tympani"], "ans": 1, "why": "The auriculotemporal nerve (V3) supplies both the TMJ and the skin of the external ear canal, so TMJ pain is referred to the ear.", "wrong": ["Motor to facial muscles; passes through parotid, not a TMJ sensory nerve.", "", "Parasympathetic to the otic ganglion.", "Serves the inner ear only.", "Taste and submandibular secretomotor; joins the lingual nerve."], "pearl": "TMJ is innervated by auriculotemporal and masseteric nerves (V3); TMJ pain often presents as earache.", "set": "face"}, {"id": "BH-45", "stem": "After ingesting a toxic substance at a friend's home, a 12-year-old girl cannot close her lips. Which muscle may be paralyzed?", "opts": ["Levator labii superioris", "Zygomaticus minor", "Orbicularis oris", "Lateral pterygoid", "Depressor labii inferioris"], "ans": 2, "why": "The orbicularis oris is the sphincter of the mouth that closes the lips.", "wrong": ["Elevates the upper lip (opens).", "Elevates the upper lip.", "", "Depresses the mandible (opens the mouth), not the lips.", "Depresses the lower lip (opens)."], "pearl": "Orbicularis oris closes lips; orbicularis oculi closes eyelids - both CN VII.", "set": "face"}, {"id": "LH-20", "stem": "A student learns she has a perfect score on the anatomy portion of her board examination and smiles. What muscle elevates her labial commissures bilaterally to produce the smile?", "opts": ["Zygomaticus major", "Zygomaticus minor", "Levator labii superioris", "Buccinator", "Orbicularis oris"], "ans": 0, "why": "The zygomaticus major runs from the zygomatic bone to the angle of the mouth and pulls the labial commissures up and laterally, producing a smile (CN VII).", "wrong": ["", "Elevates the upper lip rather than the corners of the mouth", "Elevates and everts the upper lip", "Compresses the cheek against the teeth", "Closes and protrudes the lips (sphincter)"], "pearl": "Smile = zygomaticus major (CN VII zygomatic/buccal branches).", "set": "face"}, {"id": "BH-51", "stem": "A 64-year-old woman cannot open her mouth or jaw because of tetanus from a penetrating rusty-nail wound. Which muscle's function is most likely lost?", "opts": ["Masseter muscle", "Medial pterygoid muscle", "Lateral pterygoid muscle", "Buccinator muscle", "Temporalis muscle"], "ans": 2, "why": "The lateral pterygoid is the principal muscle of mastication that opens the jaw by protruding and depressing the mandible.", "wrong": ["Masseter elevates (closes) the jaw.", "Medial pterygoid elevates (closes) the jaw.", "", "Buccinator is a facial muscle of the cheek.", "Temporalis elevates and retracts the jaw."], "pearl": "Lateral pterygoid opens the jaw; masseter, temporalis, medial pterygoid close it.", "set": "face"}, {"id": "LC-12", "stem": "A 68-year-old woman with thyroid cancer undergoes total thyroidectomy. Postoperatively she has hoarseness and dysphonia. What nerve was damaged?", "opts": ["Lingual branch of glossopharyngeal nerve", "Accessory nerve", "Superior laryngeal nerve", "Recurrent laryngeal nerve", "Hypoglossal nerve"], "ans": 3, "why": "The recurrent laryngeal nerve (CN X) ascends behind the thyroid and supplies all intrinsic laryngeal muscles except cricothyroid. Injury during thyroidectomy paralyzes the ipsilateral vocal fold, causing hoarseness.", "wrong": ["Supplies posterior tongue sensation/taste; no role in phonation.", "CN XI injury weakens shoulder shrug and head turning.", "External SLN injury alters pitch (cricothyroid) rather than causing hoarseness.", "", "CN XII injury causes tongue deviation and dysarthria, not hoarseness."], "pearl": "Hoarseness after thyroidectomy = RLN (runs with inferior thyroid artery).", "set": "neck"}, {"id": "G-58", "stem": "A 43-year-old man has a laryngeal carcinoma removed. The right ansa cervicalis is anastomosed with the right recurrent laryngeal nerve to reinnervate the laryngeal muscles and restore phonation. Which muscle will most likely be paralyzed after this operation?", "opts": ["Sternocleidomastoid", "Platysma", "Sternohyoid", "Trapezius", "Cricothyroid"], "ans": 2, "why": "Dividing the ansa cervicalis to redirect it denervates the infrahyoid strap muscles it supplies, such as sternohyoid.", "wrong": ["Supplied by CN XI.", "Supplied by the cervical branch of CN VII.", "", "Supplied by CN XI.", "Supplied by the external laryngeal nerve (CN X)."], "pearl": "Ansa cervicalis (C1–C3) → sternohyoid, sternothyroid, omohyoid; thyrohyoid and geniohyoid get C1 via CN XII.", "set": "neck"}, {"id": "BH-4", "stem": "During neck surgery for squamous cell carcinoma in a 56-year-old man, the surgeon notices profuse bleeding from the deep cervical artery. Which of the following arteries should be ligated to stop the bleeding?", "opts": ["Inferior thyroid artery", "Transverse cervical artery", "Thyrocervical trunk", "Costocervical trunk", "Ascending cervical artery"], "ans": 3, "why": "The deep cervical artery is a branch of the costocervical trunk (along with the superior intercostal artery), so ligating the trunk controls it.", "wrong": ["Inferior thyroid artery comes from the thyrocervical trunk.", "Transverse cervical artery is a thyrocervical branch, not a source of deep cervical.", "Thyrocervical trunk gives inferior thyroid, transverse cervical, and suprascapular.", "", "Ascending cervical artery is a branch of the inferior thyroid artery."], "pearl": "Costocervical trunk -> deep cervical + superior intercostal arteries.", "set": "neck"}, {"id": "BH-25", "stem": "During a carotid endarterectomy on a 57-year-old man, the carotid sinus is damaged. Which statement about this structure is correct?", "opts": ["It is located at the origin of the external carotid artery", "It is innervated by the facial nerve", "It functions as a chemoreceptor", "It is stimulated by changes in blood pressure", "It communicates freely with the cavernous sinus"], "ans": 3, "why": "The carotid sinus is a dilation at the origin of the internal carotid artery that acts as a baroreceptor, sensing arterial pressure.", "wrong": ["It sits at the origin of the internal, not external, carotid.", "It is innervated by CN IX (carotid sinus nerve), with some CN X input.", "The carotid body, not sinus, is the chemoreceptor.", "", "It is an arterial dilation, not a venous sinus."], "pearl": "Carotid sinus = baroreceptor (CN IX); carotid body = chemoreceptor.", "set": "neck"}, {"id": "G-173", "stem": "A 22-year-old woman is unconscious after falling over her bicycle handlebars. An emergency tracheotomy is performed. At what tracheal cartilage level is a tracheotomy incision most commonly made?", "opts": ["First to second", "Second to third", "Third to fourth", "Fourth to fifth", "Fifth to sixth"], "ans": 2, "why": "The thyroid isthmus usually overlies the second (to third) tracheal rings, so incising at the third and fourth rings just below it minimizes bleeding and complications.", "wrong": ["Too high; near the cricoid, risking subglottic stenosis.", "Isthmus of the thyroid usually lies here, a vascular obstacle.", "", "Lower; approaching the jugular arch and inferior thyroid veins.", "Too low; nearer the brachiocephalic vessels and thyroidea ima."], "pearl": "Thyroid isthmus sits over tracheal rings 2-3; tracheostomy usually at rings 3-4.", "set": "neck"}, {"id": "G-63", "stem": "A 34-year-old woman undergoes partial thyroidectomy with ligation of the inferior thyroid artery for a benign tumor. Twenty-four hours later she speaks with a hoarse voice and has difficulty breathing on exertion. Which nerve was most likely injured?", "opts": ["Internal branch of superior laryngeal", "Ansa cervicalis", "Ansa subclavia", "Recurrent laryngeal", "External branch of superior laryngeal"], "ans": 3, "why": "The recurrent laryngeal nerve is intimately related to the inferior thyroid artery; injuring it paralyzes the intrinsic laryngeal muscles (including the sole abductor), causing hoarseness and exertional dyspnea.", "wrong": ["Sensory above the cords; pierces thyrohyoid membrane far from the inferior thyroid a.", "Supplies strap muscles; paralysis does not cause hoarseness.", "Sympathetic loop around the subclavian artery; no laryngeal motor role.", "", "Runs with the superior thyroid artery; causes weak high-pitched voice only."], "pearl": "Ligating inferior thyroid a. → risk to RLN; ligating superior thyroid a. → risk to external laryngeal n.", "set": "neck"}, {"id": "G-59", "stem": "A 67-year-old woman has an abscess surgically removed from the middle of the right posterior cervical triangle. Afterwards her right shoulder droops and she cannot raise her right hand above her head to brush her hair. Which nerve was most likely injured?", "opts": ["Accessory", "Ansa cervicalis", "Facial", "Hypoglossal", "Suprascapular"], "ans": 0, "why": "CN XI crosses the posterior triangle superficially to reach trapezius; its injury causes shoulder droop and inability to elevate/rotate the scapula for overhead abduction.", "wrong": ["", "Supplies infrahyoid muscles; no shoulder effect.", "Does not traverse the neck triangles; supplies facial muscles.", "Supplies tongue muscles.", "Supplies supra-/infraspinatus; would weaken initial abduction and lateral rotation, not cause shoulder droop."], "pearl": "Posterior triangle surgery/lymph node biopsy → CN XI injury → trapezius weakness (droop, can't abduct above 90°).", "set": "neck"}, {"id": "G-38", "stem": "A 29-year-old woman underwent a thyroidectomy. Postoperatively she has hoarseness. Which nerve was most likely injured?", "opts": ["Internal laryngeal", "External laryngeal", "Recurrent laryngeal", "Superior laryngeal", "Glossopharyngeal"], "ans": 2, "why": "The recurrent laryngeal nerve runs in the tracheoesophageal groove intimately related to the thyroid and supplies all intrinsic laryngeal muscles except cricothyroid, so its injury causes hoarseness.", "wrong": ["Sensory to the larynx above the vocal folds; injury causes aspiration risk, not hoarseness.", "Supplies cricothyroid only; injury gives a weak, easily fatigued voice/loss of high pitch.", "", "Its branches lie higher; the classic cause of postop hoarseness is RLN injury.", "Lies superiorly and is not at risk in thyroidectomy."], "pearl": "Post-thyroidectomy hoarseness = RLN (near inferior thyroid a.); loss of high pitch = external laryngeal (near superior thyroid a.).", "set": "neck"}, {"id": "BH-27", "stem": "A 43-year-old man has new difficulty speaking. Examination shows trouble elevating the hyoid bone and floor of the mouth due to paralysis of the posterior belly of the digastric. Which nerve is most likely involved?", "opts": ["Accessory nerve", "Trigeminal nerve", "Ansa cervicalis", "Facial nerve", "Glossopharyngeal nerve"], "ans": 3, "why": "The posterior belly of the digastric (and stylohyoid) derive from the second arch and are supplied by the facial nerve; the anterior belly is supplied by V3 via the nerve to mylohyoid.", "wrong": ["Accessory nerve supplies SCM and trapezius.", "Trigeminal supplies the anterior belly, not the posterior.", "Ansa cervicalis supplies infrahyoid muscles.", "", "CN IX supplies only stylopharyngeus."], "pearl": "Digastric: anterior belly = V3; posterior belly = VII.", "set": "neck"}, {"id": "G-251", "stem": "After thyroidectomy, a 44-year-old soprano has persistent phonation problems. Laryngoscopy shows normal vocal folds that meet in the midline. Surgical injury to the left superior laryngeal nerve is diagnosed. Which additional abnormal finding is expected?", "opts": ["Decreased/absent sensation above the vocal folds", "Decreased/absent sensation below the vocal folds", "Poorly coordinated swallowing reflex", "Bilateral weakness/paralysis of the posterior cricoarytenoid muscles", "Weakness/paralysis of the left posterior cricoarytenoid muscle"], "ans": 0, "why": "The superior laryngeal nerve's internal branch supplies sensation to the laryngeal mucosa above the vocal folds, while its external branch supplies cricothyroid (pitch). Injury to the whole nerve adds supraglottic anesthesia to the pitch problem.", "wrong": ["", "Infraglottic sensation comes from the recurrent laryngeal nerve.", "Swallowing coordination depends on IX and X broadly, not just this branch.", "Posterior cricoarytenoids are supplied by the recurrent laryngeal nerves.", "Left PCA is supplied by the left recurrent laryngeal nerve, not the superior laryngeal."], "pearl": "SLN: internal = sensory above folds; external = cricothyroid (pitch). RLN = sensory below folds + all other intrinsics.", "set": "larynx"}, {"id": "G-172", "stem": "A 32-year-old man is unconscious after a car crash. During an emergency cricothyroidotomy an artery is accidentally injured. Two days later he develops aspiration pneumonia. Which artery was most likely injured?", "opts": ["Superior thyroid", "Inferior thyroid", "Cricothyroid", "Superior laryngeal", "Suprahyoid"], "ans": 2, "why": "The cricothyroid artery (branch of the superior thyroid) crosses the upper part of the median cricothyroid ligament, the site of cricothyroidotomy. It can bleed into the airway unnoticed, leading to aspiration of blood.", "wrong": ["Its main trunk lies lateral to the incision; only its cricothyroid branch crosses the membrane.", "Supplies the lower thyroid from below; not at the cricothyroid membrane.", "", "Pierces the thyrohyoid membrane above the thyroid cartilage.", "A small branch of the lingual artery above the hyoid."], "pearl": "Cricothyroidotomy through the median cricothyroid ligament risks the cricothyroid artery.", "set": "larynx"}, {"id": "LH-52", "stem": "A paralyzed right true vocal fold is most likely associated with which of the following situations?", "opts": ["Repair of a patent ductus arteriosus", "Repair of an aortic aneurysm", "A gunshot wound below the second rib", "Surgical removal of the thyroid gland", "Obstruction of the thoracic duct"], "ans": 3, "why": "The right recurrent laryngeal nerve loops under the right subclavian artery and ascends in the tracheoesophageal groove next to the thyroid, where it is vulnerable during thyroidectomy.", "wrong": ["Endangers the LEFT recurrent laryngeal nerve, which hooks under the aortic arch", "Endangers the LEFT recurrent laryngeal nerve at the aortic arch", "The right recurrent nerve loops at the subclavian artery, above this level", "", "Lymphatic obstruction does not affect the laryngeal nerves"], "pearl": "Right RLN: loops under R subclavian; left RLN: under aortic arch. Thyroidectomy risks both.", "set": "larynx"}, {"id": "BH-48", "stem": "A 12-year-old boy is choking on food. After a failed attempt to dislodge it, the school nurse performs a needle cricothyrotomy. The needle enters which region?", "opts": ["Rima glottidis", "Laryngeal vestibule", "Laryngeal ventricle", "Infraglottic cavity", "Piriform recess"], "ans": 3, "why": "The cricothyroid membrane lies below the vocal folds, so a needle through it enters the infraglottic cavity, which extends from the rima glottidis to the lower cricoid border.", "wrong": ["Rima glottidis is the gap between the vocal folds, above this level.", "Vestibule lies above the vestibular folds.", "Ventricle lies between the vestibular and vocal folds.", "", "Piriform recess is part of the laryngopharynx, outside the larynx."], "pearl": "Cricothyrotomy -> infraglottic cavity (below the vocal cords).", "set": "larynx"}, {"id": "G-284", "stem": "A patient is intubated without anesthesia, and the tube strikes the epiglottis, causing him to grimace. Which cranial nerve carries pain from this part of the larynx?", "opts": ["Vagus", "Glossopharyngeal", "Vestibulocochlear", "Hypoglossal", "Facial"], "ans": 0, "why": "The laryngeal inlet and epiglottis receive sensory supply from the internal laryngeal nerve, a branch of the vagus via the superior laryngeal nerve.", "wrong": ["", "CN IX supplies the oropharynx and posterior tongue, not the laryngeal epiglottis.
