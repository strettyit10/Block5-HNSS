 "wrong": ["Supplied by C1 fibers that join CN XII only after it leaves the canal.", "Supplied by the nerve to mylohyoid (V3).", "Supplied by the vagus (pharyngeal plexus), the one tongue muscle not CN XII.", "", "Supplied by C1 fibers traveling with CN XII below the skull."], "pearl": "All tongue muscles = CN XII except palatoglossus (CN X); C1 hitchhikes on XII to geniohyoid and thyrohyoid.", "set": "nasal_oral"}, {"id": "G-21", "stem": "A 45-year-old woman with an intracranial tumor has dryness of the nasal cavity and paranasal sinuses, loss of lacrimation, and loss of taste from the anterior two thirds of the tongue. Which structure is most likely involved by the tumor?", "opts": ["Auriculotemporal nerve", "Lesser petrosal nerve", "Facial nerve", "Inferior salivatory nucleus", "Pterygopalatine ganglion"], "ans": 2, "why": "Lacrimal/nasal secretion (greater petrosal) and anterior-tongue taste (chorda tympani) are both carried by the facial nerve, so a single lesion proximal to both branches explains all deficits.", "wrong": ["Sensory to temple, TMJ and ear; carries parotid secretomotor fibers only.", "Carries CN IX parasympathetics to the parotid, not lacrimal or taste fibers.", "", "Brainstem nucleus of CN IX (parotid); unrelated to lacrimation or anterior tongue taste.", "Explains lacrimal and nasal dryness but not loss of anterior-tongue taste."], "pearl": "Dry eye + dry nose + lost anterior 2/3 taste = CN VII proximal to the geniculate ganglion (before greater petrosal and chorda tympani branch).", "set": "cn"}, {"id": "G-22", "stem": "A 17-year-old girl has had painful discoloration of her hand for the past year. MRI reveals thoracic outlet syndrome. Which symptom would most likely result from this syndrome?", "opts": ["Problems with respiration because of pressure on the phrenic nerve", "Reduced blood flow to the thoracic wall", "Reduced venous return from the head and neck", "Numbness in the upper limb", "Distention of the internal jugular vein"], "ans": 3, "why": "Thoracic outlet syndrome (e.g., from a cervical rib or scalene bands) compresses the lower brachial plexus trunks, producing upper-limb numbness/paresthesia.", "wrong": ["The phrenic nerve descends on anterior scalene and is not compressed at the outlet.", "Rich anastomoses keep the chest wall well perfused.", "Head and neck venous drainage via the IJV is not compressed here.", "", "The IJV lies medially in the carotid sheath and is not obstructed."], "pearl": "Cervical rib/scalene compression of the lower trunk (C8–T1) and subclavian vessels = thoracic outlet syndrome → ulnar-side paresthesia.", "set": "neck"}, {"id": "G-23", "stem": "A 31-year-old woman has a large hematoma inferior to the right jugular foramen after a car collision. She has right miosis, ptosis, and anhidrosis of the face. Which ganglion is most likely affected?", "opts": ["Submandibular", "Trigeminal (semilunar or Gasserian)", "Superior cervical", "Geniculate", "Ciliary"], "ans": 2, "why": "The superior cervical ganglion, top of the sympathetic chain just below the skull base, supplies the head; its injury produces Horner syndrome (ptosis, miosis, anhidrosis).", "wrong": ["Parasympathetic ganglion for submandibular/sublingual glands.", "Contains only sensory cell bodies of CN V.", "", "Sensory ganglion of CN VII (taste); no sympathetic role.", "Parasympathetic ganglion; lesion causes a dilated pupil, not miosis or facial anhidrosis."], "pearl": "Horner = ptosis (superior tarsal m.) + miosis + anhidrosis; SCG sits at C1–C2 just below the jugular foramen.", "set": "orbit"}, {"id": "G-24", "stem": "A 35-year-old man has a tumor in the infratemporal fossa. He has lost general sensation from the anterior two thirds of his tongue, but taste and salivation are intact. Which nerve is most likely affected?", "opts": ["Lingual proximal to its junction with the chorda tympani", "Chorda tympani", "Inferior alveolar", "Lesser petrosal", "Glossopharyngeal"], "ans": 0, "why": "Proximal to where the chorda tympani joins it in the infratemporal fossa, the lingual nerve carries only V3 general sensation, so a lesion there spares taste and submandibular/sublingual secretion.", "wrong": ["", "Would cause loss of taste and reduced submandibular/sublingual salivation.", "Supplies mandibular teeth and chin, not the tongue.", "Parotid secretomotor; would affect salivation, not tongue sensation.", "Serves the posterior third of the tongue, not the anterior two thirds."], "pearl": "Lingual n. above chorda tympani junction = general sensation only; below it = sensation + taste + submandibular parasympathetics.", "set": "face"}, {"id": "G-25", "stem": "A 70-year-old man with chronic headache and enlarged lymph nodes has a tumor at the jugular foramen. Which neurologic deficit is most likely?", "opts": ["Loss of tongue movements", "Loss of facial expression", "Loss of sensation from the face and the scalp", "Loss of hearing", "Loss of gag reflex"], "ans": 4, "why": "CN IX (gag afferent) and CN X (gag efferent) both exit the jugular foramen with CN XI and the IJV, so compression abolishes the gag reflex.", "wrong": ["CN XII exits via the hypoglossal canal.", "CN VII exits the skull via the internal acoustic meatus/stylomastoid foramen.", "Facial and scalp sensation is CN V (SOF, rotundum, ovale).", "CN VIII passes through the internal acoustic meatus.", ""], "pearl": "Jugular foramen = CN IX, X, XI + IJV (Vernet syndrome); gag reflex = IX in, X out.", "set": "cranial"}, {"id": "G-26", "stem": "A 40-year-old man is unconscious after being hit in the head with a baseball. CT reveals a fractured pterion and an epidural hematoma. Branches of which artery are most likely injured?", "opts": ["External carotid", "Superficial temporal", "Maxillary", "Deep temporal", "Middle meningeal"], "ans": 4, "why": "The middle meningeal artery (from the maxillary artery) runs between the dura and the skull deep to the pterion; tearing it causes an epidural hematoma.", "wrong": ["Ends behind the mandible; does not run between dura and skull.", "Lies outside the skull in the scalp.", "Parent vessel lies in the infratemporal fossa, outside the cranium.", "Supply temporalis outside the skull; do not enter the cranial cavity.", ""], "pearl": "Pterion fracture → middle meningeal a. → epidural (biconvex) hematoma with lucid interval.", "set": "cranial"}, {"id": "G-27", "stem": "A 48-year-old woman with a brain tumor regains consciousness with her right eye directed laterally and downward, complete ptosis of the upper eyelid, and a dilated pupil. Which structure was most likely affected?", "opts": ["Oculomotor nerve", "Optic nerve", "Facial nerve", "Ciliary ganglion", "Superior cervical ganglion"], "ans": 0, "why": "CN III lesion leaves lateral rectus (VI) and superior oblique (IV) unopposed ('down and out'), paralyzes levator palpebrae (complete ptosis), and removes pupillary constrictor input (mydriasis).", "wrong": ["", "Carries vision; lesion causes visual loss, not ptosis or strabismus.", "Supplies orbicularis oculi (closes eye); lesion prevents closure, not opening.", "Lesion dilates the pupil but cannot explain ptosis or 'down and out' eye.", "Lesion causes partial ptosis with miosis (Horner), not mydriasis."], "pearl": "CN III palsy = down & out + complete ptosis + blown pupil; compressive lesions hit the pupil first.", "set": "cn"}, {"id": "G-28", "stem": "A 55-year-old factory worker has severe scalp lacerations that were sutured. Three days later the wound is inflamed, swollen, and painful. Between which tissue layers is the infection most likely located?", "opts": ["The periosteum and bone", "The aponeurosis and the periosteum", "The dense connective tissue and the aponeurosis", "The dense connective tissue and the skin", "The dermis and the epidermis"], "ans": 1, "why": "The layer between the epicranial aponeurosis and the pericranium is the loose connective tissue 'danger zone'; infection spreads easily there and can reach the cranial cavity via emissary veins.", "wrong": ["Periosteum is firmly bound to bone, leaving no plane for spread.", "", "These layers are tightly fused; no loose space for spread.", "Skin and dense connective tissue are firmly united.", "The epidermis and dermis rarely separate; skin is a strong barrier."], "pearl": "SCALP: Skin, Connective tissue (dense), Aponeurosis, Loose areolar tissue (danger zone, emissary veins), Pericranium.", "set": "face"}, {"id": "G-29", "stem": "A 36-year-old woman has severe head injuries after a car crash. On neurologic examination her uvula deviates to the right. Which nerve is most likely affected?", "opts": ["Left vagus", "Right vagus", "Right hypoglossal", "Left glossopharyngeal", "Right glossopharyngeal"], "ans": 0, "why": "With a unilateral vagus lesion, the intact contralateral levator veli palatini and musculus uvulae pull the uvula toward the healthy side, so rightward deviation means a left CN X lesion.", "wrong": ["", "A right vagal lesion would deviate the uvula to the left.", "CN XII moves the tongue, not the uvula.", "CN IX is sensory to the pharynx; it does not move the palate.", "CN IX is sensory to the pharynx; it does not move the palate."], "pearl": "Uvula deviates AWAY from the lesioned vagus; tongue deviates TOWARD the lesioned hypoglossal.", "set": "cn"}, {"id": "G-30", "stem": "A 22-year-old man in the emergency department is intubated. The endotracheal tube passes through the opening between the vocal folds. What is this opening called?", "opts": ["Piriform recess", "Vestibule", "Ventricle", "Vallecula", "Rima glottidis"], "ans": 4, "why": "The rima glottidis is the gap between the two vocal folds (and arytenoid cartilages), the narrowest part of the laryngeal airway.", "wrong": ["Mucosal recess of the laryngopharynx lateral to the laryngeal inlet.", "Space from the laryngeal inlet down to the vestibular folds.", "Recess between vestibular (false) and vocal (true) folds.", "Recess between tongue base and epiglottis.", ""], "pearl": "Rima glottidis = between true cords; rima vestibuli = between false cords.", "set": "larynx"}, {"id": "G-31", "stem": "A 55-year-old man has left-sided upper jaw tooth pain, but a dental examination is normal. Tapping on his left maxilla elicits sharp pain on the left side of his face, including his left maxillary teeth. He has no allergies. What is the most likely diagnosis?", "opts": ["Sphenoid sinusitis", "Anterior ethmoidal sinusitis", "Posterior ethmoidal sinusitis", "Maxillary sinusitis", "Frontal sinusitis"], "ans": 3, "why": "The maxillary sinus lies in the body of the maxilla directly above the upper molar roots, so its inflammation causes maxillary tenderness and referred upper-tooth pain (both via V2 superior alveolar nerves).", "wrong": ["Lies deep in the sphenoid body; causes deep/retro-orbital headache.", "Lies between orbit and nasal cavity; causes medial orbital pain.", "Lies posteriorly between orbits; would not cause maxillary tenderness.", "", "Lies in the frontal bone above the orbit; causes forehead pain."], "pearl": "Maxillary sinusitis mimics upper toothache because superior alveolar nerves (V2) run in the sinus walls.", "set": "nasal_oral"}, {"id": "G-32", "stem": "A 70-year-old man with severe headaches has difficulty coughing and swallowing. MRI shows a tumor affecting a cranial nerve. Which nerve is most likely affected?", "opts": ["Mandibular", "Maxillary", "Glossopharyngeal", "Vagus", "Hypoglossal"], "ans": 3, "why": "The vagus provides laryngeal sensation and the motor supply to pharyngeal and laryngeal muscles needed for cough and swallowing.", "wrong": ["Motor to mastication muscles; not responsible for cough or swallowing.", "Purely sensory to the midface.", "Motor only to stylopharyngeus; sensory limb of gag, not cough.", "", "Moves the tongue; not involved in the cough reflex."], "pearl": "Cough reflex: CN X (internal laryngeal) afferent and CN X efferent; CN X also supplies nearly all pharyngeal and palatal muscles.", "set": "cn"}, {"id": "G-34", "stem": "A 33-year-old woman is unconscious after falling and hitting her head. The emergency physician performs a pupillary light reflex test. The integrity of which nerves is being checked?", "opts": ["Optic and facial", "Optic and oculomotor", "Maxillary and facial", "Ophthalmic and oculomotor", "Ophthalmic and facial"], "ans": 1, "why": "The optic nerve carries the afferent light signal and the oculomotor nerve carries the parasympathetic efferent to the sphincter pupillae.", "wrong": ["Optic is correct afferent, but CN VII closes the lids; it does not constrict the pupil.", "", "Neither nerve participates in the light reflex.", "V1 is the afferent limb of the corneal reflex, not the light reflex.", "This pair is the corneal (blink) reflex."], "pearl": "Pupillary light reflex: II in, III out. Corneal reflex: V1 (nasociliary) in, VII out.", "set": "orbit"}, {"id": "G-35", "stem": "A 48-year-old man complains of diplopia. On neurologic examination he cannot adduct his left eye and lacks a corneal reflex on the left side. Where is the lesion most likely located?", "opts": ["Inferior orbital fissure", "Optic canal", "Superior orbital fissure", "Foramen rotundum", "Foramen ovale"], "ans": 2, "why": "Failure of adduction points to CN III (medial rectus) and loss of the corneal reflex to the nasociliary nerve (V1); both traverse the superior orbital fissure.", "wrong": ["Transmits infraorbital (V2) nerve/vessels and zygomatic nerve, not III or V1.", "Transmits the optic nerve and ophthalmic artery.", "", "Transmits V2 only.", "Transmits V3 and lesser petrosal nerve."], "pearl": "SOF carries III, IV, V1 (lacrimal, frontal, nasociliary), VI and superior ophthalmic vein; a SOF lesion = ophthalmoplegia + V1 sensory loss.", "set": "orbit"}, {"id": "G-36", "stem": "A 34-year-old man complains of hyperacusis (sensitivity to loud sounds). Injury to which cranial nerve is most likely responsible?", "opts": ["Hypoglossal", "Facial", "Accessory", "Vagus", "Glossopharyngeal"], "ans": 1, "why": "The facial nerve's nerve to stapedius damps stapes movement; losing it makes ordinary sounds painfully loud.", "wrong": ["Supplies tongue muscles only.", "", "Supplies SCM and trapezius.", "Has no motor role in the middle ear.", "Sensory to the middle ear and motor only to stylopharyngeus."], "pearl": "Hyperacusis in a facial palsy localizes the lesion proximal to the nerve to stapedius (in the facial canal or above).", "set": "cn"}, {"id": "G-37", "stem": "A 34-year-old swimmer has otitis externa. He coughs during inspection of the external auditory meatus with a speculum. The cough results from irritation of which nerve that supplies part of the external auditory meatus?", "opts": ["Vestibulocochlear", "Vagus", "Trigeminal", "Facial", "Accessory"], "ans": 1, "why": "The auricular branch of the vagus (Arnold's nerve) supplies part of the external canal; stimulating it can trigger a vagal cough reflex, as if the larynx were irritated.", "wrong": ["Serves only the inner ear (hearing and balance).", "", "V3 (auriculotemporal) does supply the canal but does not trigger a cough.", "Gives only a small sensory twig to the ear; not linked to cough.", "Purely motor to SCM and trapezius."], "pearl": "Arnold's nerve (auricular branch of CN X): ear canal stimulation → cough (ear-cough reflex).", "set": "cn"}, {"id": "G-38", "stem": "A 29-year-old woman underwent a thyroidectomy. Postoperatively she has hoarseness. Which nerve was most likely injured?", "opts": ["Internal laryngeal", "External laryngeal", "Recurrent laryngeal", "Superior laryngeal", "Glossopharyngeal"], "ans": 2, "why": "The recurrent laryngeal nerve runs in the tracheoesophageal groove intimately related to the thyroid and supplies all intrinsic laryngeal muscles except cricothyroid, so its injury causes hoarseness.", "wrong": ["Sensory to the larynx above the vocal folds; injury causes aspiration risk, not hoarseness.", "Supplies cricothyroid only; injury gives a weak, easily fatigued voice/loss of high pitch.", "", "Its branches lie higher; the classic cause of postop hoarseness is RLN injury.", "Lies superiorly and is not at risk in thyroidectomy."], "pearl": "Post-thyroidectomy hoarseness = RLN (near inferior thyroid a.); loss of high pitch = external laryngeal (near superior thyroid a.).", "set": "neck"}, {"id": "G-39", "stem": "A 48-year-old man has a constricted right pupil; his left pupil and vision in both eyes are normal. These findings are most likely due to a lesion of which right-sided structure?", "opts": ["Oculomotor nerve", "Superior cervical ganglion", "Nervus intermedius", "Edinger-Westphal nucleus", "Trigeminal (semilunar, Gasserian) ganglion"], "ans": 1, "why": "A constricted pupil means loss of sympathetic dilator input; the superior cervical ganglion supplies postganglionic sympathetics to the dilator pupillae via the internal carotid plexus.", "wrong": ["Lesion abolishes constriction, producing a dilated pupil.", "", "Parasympathetic to lacrimal/salivary glands; no pupillary role.", "Lesion removes constriction, causing mydriasis.", "Purely sensory; no effect on pupil size."], "pearl": "Miosis = sympathetic loss (Horner/SCG); mydriasis = parasympathetic loss (CN III/Edinger-Westphal/ciliary ganglion).", "set": "orbit"}, {"id": "G-40", "stem": "A 55-year-old woman has a tumor at the base of the skull that decreases tear production. Which nerve is most likely injured?", "opts": ["Chorda tympani", "Deep petrosal", "Greater petrosal", "Lesser petrosal", "Nasociliary"], "ans": 2, "why": "The greater petrosal nerve (CN VII) carries preganglionic parasympathetics to the pterygopalatine ganglion, whose postganglionic fibers drive lacrimal secretion.", "wrong": ["Supplies submandibular/sublingual glands and anterior-tongue taste.", "Sympathetic; does not drive tear secretion.", "", "Parasympathetic to the parotid via the otic ganglion.", "Sensory to cornea, ethmoid sinuses and nose; not secretomotor."], "pearl": "Tears: CN VII → greater petrosal → nerve of pterygoid canal → pterygopalatine ganglion → zygomatic → lacrimal nerve.", "set": "cn"}, {"id": "G-41", "stem": "A 24-year-old man has an inferior (blow-out) fracture of the orbit after a street fight. Into which space would orbital structures most likely herniate inferiorly?", "opts": ["Ethmoidal sinus", "Frontal sinus", "Maxillary sinus", "Nasal cavity", "Sphenoidal sinus"], "ans": 2, "why": "The orbital floor is the roof of the maxillary sinus, so a floor blow-out displaces orbital contents downward into that sinus.", "wrong": ["Lies medial to the orbit (medial wall blow-out).", "Lies above the orbit.", "", "Lies medial, not inferior, to the orbit.", "Lies posterior and medial, not below the orbit."], "pearl": "Orbital floor blow-out → inferior rectus/fat herniate into maxillary sinus → upward-gaze diplopia and infraorbital numbness.", "set": "orbit"}, {"id": "G-42", "stem": "A 35-year-old woman has cavernous sinus thrombosis resulting from a facial infection. What is the most direct route for spread of infection from the face to the cavernous sinus?", "opts": ["Pterygoid venous plexus", "Superior ophthalmic vein", "Frontal venous plexus", "Basilar venous plexus", "Parietal emissary vein"], "ans": 1, "why": "The facial vein in the danger triangle communicates with the superior ophthalmic vein, which drains straight into the cavernous sinus.", "wrong": ["Reaches the sinus only indirectly via the inferior ophthalmic vein/emissary veins.", "", "Does not connect directly to the cavernous sinus.", "Links the inferior petrosal sinuses to the vertebral venous plexus.", "Connects scalp veins to the superior sagittal sinus, not cavernous."], "pearl": "Danger triangle → facial v. → superior ophthalmic v. (valveless) → cavernous sinus.", "set": "cranial"}, {"id": "G-43", "stem": "A 7-year-old boy had severe otitis media that spread to the mastoid air cells. After mastoid surgery, the right corner of his mouth droops, he cannot close his right eye, and food collects in his right oral vestibule. Which nerve was injured?", "opts": ["Glossopharyngeal", "Vagus", "Facial", "Maxillary division of the trigeminal nerve", "Mandibular division of the trigeminal nerve"], "ans": 2, "why": "The facial nerve runs in the facial canal adjacent to the middle ear and mastoid; its injury paralyzes orbicularis oculi, orbicularis oris and buccinator.", "wrong": ["Does not supply facial muscles.", "Does not supply facial muscles.", "", "Purely sensory; no motor to face.", "Supplies mastication muscles, not buccinator or facial expression."], "pearl": "Food pooling in the vestibule = buccinator paralysis = CN VII (buccal branch).", "set": "cn"}, {"id": "G-45", "stem": "A 45-year-old woman with severe ear pain has chronic mastoiditis. The infection can erode the thin bone between the mastoid air cells and the posterior cranial fossa. Into which venous structure does it most commonly spread?", "opts": ["Superior sagittal sinus", "Inferior sagittal sinus", "Straight sinus", "Cavernous sinus", "Sigmoid sinus"], "ans": 4, "why": "The sigmoid sinus grooves the posterior cranial fossa immediately medial to the mastoid air cells before becoming the IJV, so mastoid infection readily causes sigmoid sinus thrombosis.", "wrong": ["Runs in the superior margin of the falx cerebri, far from the mastoid.", "Lies in the free lower edge of the falx.", "Runs at the falx–tentorium junction, midline.", "Lies beside the sella in the middle cranial fossa.", ""], "pearl": "Mastoiditis → sigmoid sinus thrombophlebitis (lateral sinus thrombosis).", "set": "cranial"}, {"id": "G-46", "stem": "A 63-year-old man with left-sided hearing loss complains of loss of taste and drooling from the left side of his mouth. CT shows a tumor compressing the nerve exiting the skull through which opening?", "opts": ["Foramen ovale", "Foramen rotundum", "Internal acoustic meatus", "Jugular foramen", "Superior orbital fissure"], "ans": 2, "why": "Hearing loss (CN VIII) plus taste loss and facial weakness (CN VII) localize to the internal acoustic meatus, which both nerves enter together.", "wrong": ["Transmits V3 (mastication, lower face sensation).", "Transmits V2.", "", "Transmits CN IX, X, XI.", "Transmits III, IV, V1, VI."], "pearl": "CN VII + VIII together = internal acoustic meatus / cerebellopontine angle (e.g., vestibular schwannoma).", "set": "cranial"}, {"id": "G-48", "stem": "A 54-year-old man with severe headaches has an internal carotid artery aneurysm inside the cavernous sinus. Which nerve would typically be affected first?", "opts": ["Abducens nerve", "Oculomotor nerve", "Ophthalmic nerve", "Maxillary nerve", "Trochlear nerve"], "ans": 0, "why": "CN VI runs free within the cavernous sinus right beside the ICA, whereas the others lie in the lateral dural wall, so VI is compressed first.", "wrong": ["", "Lies in the lateral wall, farther from the ICA.", "Lies in the lateral wall, farther from the ICA.", "Lies low in the lateral wall, farther from the ICA.", "Lies in the lateral wall, farther from the ICA."], "pearl": "Cavernous sinus: ICA + CN VI in the middle; III, IV, V1, V2 in the lateral wall → abducens palsy (medial deviation) first.", "set": "cranial"}, {"id": "G-49", "stem": "A 24-year-old man had a lower third molar extracted, after which he lost general sensation and taste from the anterior two thirds of his tongue. Which nerve was most likely injured?", "opts": ["Auriculotemporal", "Chorda tympani", "Lingual", "Mental", "Inferior alveolar"], "ans": 2, "why": "Beside the lower third molar the lingual nerve already contains chorda tympani fibers, so its injury removes both general sensation and taste from the anterior tongue.", "wrong": ["Supplies skin of temple and ear, not the tongue.", "Carries taste but not general sensation.", "", "Supplies chin and lower lip skin.", "Supplies lower teeth, chin and lip, not the tongue."], "pearl": "Lingual nerve lies just medial to the lower third molar, a classic extraction injury.", "set": "nasal_oral"}, {"id": "G-50", "stem": "A 56-year-old woman has rheumatoid arthritis of her temporomandibular joint (TMJ) and severe ear pain. Which nerve most likely conducts the pain sensation?", "opts": ["Facial", "Auriculotemporal", "Lesser petrosal", "Vestibulocochlear", "Chorda tympani"], "ans": 1, "why": "The auriculotemporal nerve (V3) supplies both the TMJ and the skin of the external ear canal, so TMJ pain is referred to the ear.", "wrong": ["Motor to facial muscles; passes through parotid, not a TMJ sensory nerve.", "", "Parasympathetic to the otic ganglion.", "Serves the inner ear only.", "Taste and submandibular secretomotor; joins the lingual nerve."], "pearl": "TMJ is innervated by auriculotemporal and masseteric nerves (V3); TMJ pain often presents as earache.", "set": "face"}, {"id": "G-51", "stem": "Where are the postganglionic parasympathetic neuronal cell bodies that directly innervate the parotid gland?", "opts": ["Trigeminal (semilunar, Gasserian) ganglion", "Inferior salivatory nucleus", "Superior cervical ganglion", "Otic ganglion", "Submandibular ganglion"], "ans": 3, "why": "The otic ganglion, just below the foramen ovale on V3, holds the postganglionic neurons whose fibers ride the auriculotemporal nerve to the parotid.", "wrong": ["Contains sensory neurons only.", "Contains the preganglionic neurons (CN IX), not postganglionic.", "Contains postganglionic sympathetic neurons.", "", "Supplies submandibular and sublingual glands."], "pearl": "Parotid: inferior salivatory nucleus → CN IX → tympanic n. → lesser petrosal → otic ganglion → auriculotemporal n.", "set": "face"}, {"id": "G-53", "stem": "A 22-year-old woman has an eye injury. The corneal reflex is tested and found to be present. Which nerve is responsible for the afferent limb of this reflex?", "opts": ["Frontal", "Lacrimal", "Nasociliary", "Oculomotor", "Optic"], "ans": 2, "why": "The cornea is supplied by the long ciliary branches of the nasociliary nerve (V1), which form the sensory limb of the blink reflex.", "wrong": ["Supplies forehead and upper lid skin, not the cornea.", "Supplies lacrimal gland region and lateral upper lid.", "", "Motor to levator (reopens eye); not afferent.", "Afferent for the light reflex, not the corneal reflex."], "pearl": "Corneal reflex: nasociliary (V1) afferent → facial (VII) efferent to orbicularis oculi, bilaterally.", "set": "orbit"}, {"id": "G-54", "stem": "A 21-year-old man has severe epistaxis from the nasal septum. This area, Kiesselbach's (Little's) area, involves mostly anastomoses between which arteries?", "opts": ["Ascending palatine and ascending pharyngeal", "Posterior superior alveolar and accessory meningeal", "Lateral branches of posterior ethmoidal and middle meningeal", "Septal branches of the sphenopalatine and superior labial", "Descending palatine and tonsillar branches of the pharyngeal"], "ans": 3, "why": "Kiesselbach's plexus on the anterior septum is fed by anterior ethmoidal, sphenopalatine, greater palatine and superior labial arteries, with septal sphenopalatine and superior labial branches the main contributors.", "wrong": ["Pharyngeal/palatine vessels that do not reach the anterior septum.", "Supply maxillary teeth and cranial structures, not the septum.", "Middle meningeal is intracranial; posterior ethmoidal supplies the upper posterior nose.", "", "Supply palate and tonsil, not the anterior septum."], "pearl": "Anterior epistaxis = Kiesselbach's plexus; posterior epistaxis = sphenopalatine artery.", "set": "nasal_oral"}, {"id": "G-55", "stem": "An 11-year-old boy has swollen palatine tonsils. The palatine tonsils lie between the anterior and posterior tonsillar pillars. Which muscles form these pillars?", "opts": ["Levator veli palatini and tensor veli palatini", "Palatoglossus and palatopharyngeus", "Styloglossus and stylopharyngeus", "Palatopharyngeus and salpingopharyngeus", "Superior and middle pharyngeal constrictors"], "ans": 1, "why": "The anterior pillar (palatoglossal arch) contains palatoglossus and the posterior pillar (palatopharyngeal arch) contains palatopharyngeus.", "wrong": ["These elevate and tense the soft palate; they do not form the pillars.", "", "Styloglossus is in the tongue; stylopharyngeus runs deep in the pharyngeal wall.", "Salpingopharyngeus forms the salpingopharyngeal fold near the auditory tube.", "Superior constrictor forms the tonsillar bed floor, not the pillars."], "pearl": "Tonsillar fossa: anterior = palatoglossus, posterior = palatopharyngeus, floor = superior constrictor (CN IX runs on it).", "set": "nasal_oral"}, {"id": "G-56", "stem": "A 35-year-old woman is under general anesthesia. Before laryngeal intubation, the rima glottidis is opened by which pair of muscles?", "opts": ["Posterior cricoarytenoids", "Lateral cricoarytenoids", "Thyroarytenoids", "Transverse arytenoids", "Cricothyroids"], "ans": 0, "why": "The posterior cricoarytenoids rotate the arytenoids laterally, abducting the vocal processes and opening the rima glottidis.", "wrong": ["", "Adduct the vocal folds, closing the rima glottidis.", "Relax/shorten and adduct the vocal folds.", "Pull arytenoids together, closing the posterior rima.", "Tense and lengthen the vocal folds (raise pitch)."], "pearl": "Posterior cricoarytenoid is the ONLY vocal fold abductor ('pull cords apart').", "set": "larynx"}, {"id": "G-57", "stem": "A 32-year-old woman asks about the soft, thin ridge she can feel running forward across her masseter muscle toward her upper lip. What structure is she most likely feeling?", "opts": ["Facial artery", "Maxillary artery", "Parotid duct", "Marginal mandibular branch of the facial nerve", "Facial vein"], "ans": 2, "why": "The parotid (Stensen's) duct crosses the masseter horizontally, then pierces buccinator to open opposite the upper second molar; it is palpable over a clenched masseter.", "wrong": ["Pulse is felt at the anterior border of masseter on the mandible, not across it.", "Lies deep in the infratemporal fossa; not palpable.", "", "Runs along the lower border of the mandible; too fine to palpate.", "Runs obliquely anterior to the facial artery, not across masseter."], "pearl": "Parotid duct: across masseter, pierces buccinator, opens at upper 2nd molar.", "set": "face"}, {"id": "G-58", "stem": "A 43-year-old man has a laryngeal carcinoma removed. The right ansa cervicalis is anastomosed with the right recurrent laryngeal nerve to reinnervate the laryngeal muscles and restore phonation. Which muscle will most likely be paralyzed after this operation?", "opts": ["Sternocleidomastoid", "Platysma", "Sternohyoid", "Trapezius", "Cricothyroid"], "ans": 2, "why": "Dividing the ansa cervicalis to redirect it denervates the infrahyoid strap muscles it supplies, such as sternohyoid.", "wrong": ["Supplied by CN XI.", "Supplied by the cervical branch of CN VII.", "", "Supplied by CN XI.", "Supplied by the external laryngeal nerve (CN X)."], "pearl": "Ansa cervicalis (C1–C3) → sternohyoid, sternothyroid, omohyoid; thyrohyoid and geniohyoid get C1 via CN XII.", "set": "neck"}, {"id": "G-59", "stem": "A 67-year-old woman has an abscess surgically removed from the middle of the right posterior cervical triangle. Afterwards her right shoulder droops and she cannot raise her right hand above her head to brush her hair. Which nerve was most likely injured?", "opts": ["Accessory", "Ansa cervicalis", "Facial", "Hypoglossal", "Suprascapular"], "ans": 0, "why": "CN XI crosses the posterior triangle superficially to reach trapezius; its injury causes shoulder droop and inability to elevate/rotate the scapula for overhead abduction.", "wrong": ["", "Supplies infrahyoid muscles; no shoulder effect.", "Does not traverse the neck triangles; supplies facial muscles.", "Supplies tongue muscles.", "Supplies supra-/infraspinatus; would weaken initial abduction and lateral rotation, not cause shoulder droop."], "pearl": "Posterior triangle surgery/lymph node biopsy → CN XI injury → trapezius weakness (droop, can't abduct above 90°).", "set": "neck"}, {"id": "G-60", "stem": "A 20-year-old man has a stab wound in the superior neck that has not affected major structures, but he has lost sensation over the skin at the angle of the jaw. Which nerve is most likely injured?", "opts": ["Supraclavicular", "Transverse cervical", "Great auricular", "Greater occipital", "Lesser occipital"], "ans": 2, "why": "The great auricular nerve (C2–C3) ascends over SCM to supply skin over the angle of the mandible, parotid region and lower auricle.", "wrong": ["C3–C4; supplies skin over the clavicle and shoulder.", "Supplies skin of the anterior neck.", "", "Dorsal ramus of C2; supplies the posterior scalp.", "C2; supplies scalp behind the ear."], "pearl": "Skin over angle of jaw = great auricular (C2–3), not trigeminal.", "set": "neck"}, {"id": "G-61", "stem": "A 6-year-old boy with a history of complicated delivery has a persistent head tilt, with the right ear near the right shoulder and the face turned upward and to the left. Which muscle was most likely damaged during birth?", "opts": ["Anterior scalene", "Omohyoid", "Sternocleidomastoid", "Trapezius", "Platysma"], "ans": 2, "why": "Congenital torticollis results from birth injury/fibrosis of the sternocleidomastoid; a shortened right SCM tilts the head to the right and rotates the face to the left.", "wrong": ["Elevates the first rib; does not produce torticollis.", "Depresses the hyoid.", "", "Elevates and retracts the scapula; does not rotate the face contralaterally like this.", "Thin superficial muscle; tenses neck skin."], "pearl": "One SCM: tilt head to same side, turn face to opposite side (congenital muscular torticollis).", "set": "neck"}, {"id": "G-62", "stem": "A 35-year-old woman's upper airway is obstructed with blood and mucus after a violent car crash, and a midline tracheostomy inferior to the thyroid isthmus is performed. Which vessels are most likely present at the incision site and need to be cauterized?", "opts": ["Middle thyroid vein and inferior thyroid artery", "Inferior thyroid artery and inferior thyroid vein", "Inferior thyroid vein and thyroidea ima artery", "Cricothyroid artery and inferior thyroid vein", "Left brachiocephalic vein and inferior thyroid artery"], "ans": 2, "why": "Below the isthmus in the midline lie the inferior thyroid veins (descending to the left brachiocephalic vein) and, when present, the thyroidea ima artery.", "wrong": ["Middle thyroid vein drains laterally to the IJV; inferior thyroid artery approaches laterally.", "Inferior thyroid artery reaches the gland laterally from the thyrocervical trunk.", "", "Cricothyroid artery lies above the isthmus, at the cricothyroid membrane.", "Brachiocephalic vein is lower; inferior thyroid artery is lateral."], "pearl": "Low tracheostomy hazards: inferior thyroid veins, thyroidea ima a. (~10%), left brachiocephalic v. in children.", "set": "neck"}, {"id": "G-63", "stem": "A 34-year-old woman undergoes partial thyroidectomy with ligation of the inferior thyroid artery for a benign tumor. Twenty-four hours later she speaks with a hoarse voice and has difficulty breathing on exertion. Which nerve was most likely injured?", "opts": ["Internal branch of superior laryngeal", "Ansa cervicalis", "Ansa subclavia", "Recurrent laryngeal", "External branch of superior laryngeal"], "ans": 3, "why": "The recurrent laryngeal nerve is intimately related to the inferior thyroid artery; injuring it paralyzes the intrinsic laryngeal muscles (including the sole abductor), causing hoarseness and exertional dyspnea.", "wrong": ["Sensory above the cords; pierces thyrohyoid membrane far from the inferior thyroid a.", "Supplies strap muscles; paralysis does not cause hoarseness.", "Sympathetic loop around the subclavian artery; no laryngeal motor role.", "", "Runs with the superior thyroid artery; causes weak high-pitched voice only."], "pearl": "Ligating inferior thyroid a. → risk to RLN; ligating superior thyroid a. → risk to external laryngeal n.", "set": "neck"}, {"id": "G-64", "stem": "A 55-year-old woman has difficulty swallowing, severe headaches, and frequently aspirates fluids when drinking. Imaging reveals a skull base tumor occupying the space behind the jugular foramen. Involvement of which structure most likely explains her findings?", "opts": ["Ansa cervicalis", "Cervical sympathetic trunk", "External laryngeal nerve", "Hypoglossal nerve", "Vagus nerve"], "ans": 4, "why": "The vagus leaves through the jugular foramen and supplies pharyngeal, palatal and laryngeal muscles and laryngeal sensation, so its compression causes dysphagia and aspiration.", "wrong": ["Supplies infrahyoid strap muscles; no swallowing/aspiration deficit.", "Runs behind the carotid sheath; lesion gives Horner syndrome.", "Supplies cricothyroid only; causes voice fatigue, not dysphagia.", "Lesion causes tongue deviation and dysarthria.", ""], "pearl": "Jugular foramen mass → CN X → dysphagia, aspiration, hoarseness, uvula deviates away.", "set": "cn"}, {"id": "G-65", "stem": "A 55-year-old woman with severe hypertension and 90% occlusion of both common carotid arteries undergoes carotid endarterectomy. Postoperatively, her tongue deviates to the right when protruded. Which nerve was most likely injured?", "opts": ["Right glossopharyngeal", "Right hypoglossal", "Left hypoglossal", "Left lingual", "Left vagus"], "ans": 1, "why": "CN XII crosses the carotid bifurcation and is at risk in endarterectomy; with a right lesion the unopposed left genioglossus pushes the tongue toward the right.", "wrong": ["Lesion causes loss of posterior-tongue taste and gag, not deviation.", "", "Would deviate the tongue to the left.", "Sensory/taste nerve; no motor role in protrusion.", "Lesion affects palate and larynx, not tongue protrusion."], "pearl": "Tongue points TOWARD the side of the CN XII lesion ('lick your wounds'); CN XII crosses ICA/ECA near the bifurcation.", "set": "neck"}, {"id": "G-66", "stem": "A 34-year-old woman undergoes partial thyroidectomy. Twenty-four hours later she frequently aspirates fluid into her lungs, and the mucosa of the piriform recess and larynx above the vocal folds is anesthetized. Which nerve was most likely injured?", "opts": ["External branch of the superior laryngeal", "Hypoglossal", "Internal branch of the superior laryngeal", "Lingual", "Recurrent laryngeal"], "ans": 2, "why": "The internal laryngeal nerve pierces the thyrohyoid membrane and supplies mucosa above the vocal folds and the piriform recess; losing it abolishes the protective cough reflex, leading to aspiration.", "wrong": ["Motor to cricothyroid; no mucosal sensory loss.", "Motor to tongue; causes deviation and dysarthria.", "", "Sensory/taste to anterior tongue; not laryngeal.", "Sensory BELOW the vocal folds and motor to most laryngeal muscles."], "pearl": "Internal laryngeal = sensation above cords (cough reflex afferent); RLN = sensation below cords.", "set": "larynx"}, {"id": "G-67", "stem": "A 38-year-old man undergoes partial thyroidectomy for a benign tumor. Twenty-four hours later he cannot abduct his true vocal cords because of a nerve injury during the operation. Which muscle was most likely denervated?", "opts": ["Posterior cricoarytenoid", "Lateral cricoarytenoid", "Thyroarytenoid", "Arytenoid", "Cricothyroid"], "ans": 0, "why": "The posterior cricoarytenoid is the only abductor of the vocal folds, so inability to abduct reflects its denervation (via the recurrent laryngeal nerve).", "wrong": ["", "Adducts the vocal folds.", "Adducts and relaxes the vocal folds.", "Adducts by approximating the arytenoids.", "Tenses the vocal folds (supplied by external laryngeal n.)."], "pearl": "Bilateral RLN injury → both PCAs paralyzed → cords stuck near midline → stridor/airway emergency.", "set": "larynx"}, {"id": "G-68", "stem": "During removal of a benign thyroid tumor, the superior thyroid artery is identified and used as a landmark to avoid damaging its small companion nerve. Which nerve most likely accompanies the superior thyroid artery?", "opts": ["Cervical sympathetic trunk", "External branch of the superior laryngeal", "Inferior root of the ansa cervicalis", "Internal branch of the superior laryngeal", "Recurrent laryngeal"], "ans": 1, "why": "The external laryngeal nerve descends alongside the superior thyroid artery to reach cricothyroid, so ligation of the artery near the upper pole risks it.", "wrong": ["Lies posterolateral, behind the carotid sheath.", "", "Lies more superficially on the carotid sheath.", "Runs above the artery and pierces the thyrohyoid membrane with the superior laryngeal artery.", "Runs with the inferior thyroid artery near the lower pole."], "pearl": "Superior thyroid a. ↔ external laryngeal n.; inferior thyroid a. ↔ recurrent laryngeal n.; superior laryngeal a. ↔ internal laryngeal n.", "set": "neck"}, {"id": "G-70", "stem": "A 27-year-old woman has a LeFort I fracture and comminuted fractures of the mandible and TMJ after being thrown from a motor scooter. Despite reconstructive surgery, she develops hyperacusis due to facial nerve paralysis. Which muscle is most likely paralyzed?", "opts": ["Posterior belly of digastric", "Stapedius", "Tensor tympani", "Stylohyoid", "Cricothyroid"], "ans": 1, "why": "Stapedius, supplied by CN VII, damps the stapes; its paralysis makes sounds abnormally loud.", "wrong": ["Supplied by CN VII, but its paralysis does not cause hyperacusis.", "", "Also damps sound but is supplied by V3, not CN VII.", "Supplied by CN VII, but has no role in hearing.", "Supplied by the external laryngeal nerve; no role in hearing."], "pearl": "CN VII motor: facial expression + stapedius + posterior digastric + stylohyoid; tensor tympani/tensor veli palatini = V3.", "set": "cn"}, {"id": "G-71", "stem": "A 43-year-old man with a basilar skull fracture is suspected of having injured his right greater petrosal nerve. Which finding would confirm this diagnosis?", "opts": ["Partial dryness of the mouth due to lack of salivary secretions from the submandibular and sublingual glands", "Partial dryness of the mouth due to lack of salivary secretions from the parotid gland", "Dryness of the right cornea due to lack of lacrimal gland secretion", "Loss of taste sensation from the right anterior two thirds of the tongue", "Loss of general sensation from the right anterior two thirds of the tongue"], "ans": 2, "why": "The greater petrosal nerve carries the preganglionic parasympathetic supply for the lacrimal gland (and nasal/palatal glands), so its loss causes ipsilateral dry eye.", "wrong": ["These glands are supplied via chorda tympani and lingual nerve.", "Parotid is supplied via CN IX, lesser petrosal and auriculotemporal nerves.", "", "Anterior-tongue taste travels in the chorda tympani.", "General sensation of the anterior tongue is the lingual nerve (V3)."], "pearl": "Greater petrosal = tears + nasal/palatal mucus; chorda tympani = submandibular/sublingual saliva + anterior taste.", "set": "cn"}, {"id": "G-72", "stem": "A 12-year-old girl has chronic middle ear infections that have damaged the tympanic plexus, destroying the preganglionic parasympathetic fibers that pass through it. Which condition will be detectable on examination?", "opts": ["Diminished mucus in the nasal cavity", "Diminished mucus on the soft palate", "Diminished saliva production by the parotid gland", "Diminished saliva production by the submandibular and sublingual glands", "Diminished tear production by the lacrimal gland"], "ans": 2, "why": "CN IX preganglionic fibers traverse the tympanic plexus and leave as the lesser petrosal nerve to the otic ganglion, which drives parotid secretion.", "wrong": ["Nasal glands are supplied via the greater petrosal/pterygopalatine ganglion.", "Palatal glands are supplied via the greater petrosal/pterygopalatine ganglion.", "", "These glands are supplied via chorda tympani/submandibular ganglion.", "Lacrimal gland is supplied via the greater petrosal/pterygopalatine ganglion."], "pearl": "Tympanic plexus (CN IX, Jacobson's nerve) → lesser petrosal → otic ganglion → parotid.", "set": "face"}, {"id": "G-73", "stem": "A 38-year-old woman has acute dental pain from penetrating caries in a mandibular molar. Which nerve would the dentist need to anesthetize to treat this tooth?", "opts": ["Lingual", "Inferior alveolar", "Buccal", "Mental", "Mylohyoid"], "ans": 1, "why": "The inferior alveolar nerve (V3) runs in the mandibular canal and supplies all mandibular teeth.", "wrong": ["Supplies the anterior tongue and lingual gingiva, not the teeth.", "", "Supplies cheek skin/mucosa and buccal gingiva.", "Terminal branch after the mental foramen; supplies chin/lip, not molars.", "Motor to mylohyoid and anterior digastric."], "pearl": "Inferior alveolar nerve block (at the mandibular foramen) numbs all lower teeth on that side plus lip and chin.", "set": "face"}, {"id": "G-74", "stem": "A 59-year-old man has acute pain in his mandible. MRI reveals acute arthritic inflammation of the temporomandibular joint. Which muscle will most likely be affected by the inflammatory process in this joint?", "opts": ["Temporalis", "Medial pterygoid", "Masseter", "Lateral pterygoid", "Buccinator"], "ans": 3, "why": "Part of the lateral pterygoid inserts into the TMJ capsule and articular disc, so joint inflammation directly involves it.", "wrong": ["Inserts on the coronoid process; elevates/retracts the jaw.", "Inserts on the medial angle of the mandible; elevates the jaw.", "Inserts on the lateral ramus/angle; elevates the jaw.", "", "Facial muscle of the cheek; unrelated to the TMJ."], "pearl": "Lateral pterygoid (superior head) attaches to the TMJ disc; it is the main protractor/depressor (opens mouth).", "set": "face"}, {"id": "G-75", "stem": "A 56-year-old woman complains of diplopia when walking down stairs. A lesion of which nerve is most likely responsible?", "opts": ["Optic", "Oculomotor", "Abducens", "Trochlear", "Frontal"], "ans": 3, "why": "CN IV supplies superior oblique, the main depressor of the adducted eye used when looking down at stairs; its paralysis causes vertical diplopia on downgaze.", "wrong": ["Lesion reduces vision rather than causing diplopia on downgaze.", "Causes 'down and out' eye with ptosis, not isolated downgaze diplopia.", "Causes horizontal diplopia with failed abduction.", "", "Sensory branch of V1 to the forehead."], "pearl": "Trouble reading or going down stairs + head tilt away from lesion = CN IV (superior oblique) palsy.", "set": "orbit"}, {"id": "G-76", "stem": "A 43-year-old man complains of diplopia when walking down stairs. When asked to turn his right eye inward toward his nose and look down, he can look inward but not down. Which nerve is most likely involved?", "opts": ["Abducens", "Nasociliary", "Oculomotor, inferior division", "Oculomotor, superior division", "Trochlear"], "ans": 4, "why": "With the eye adducted, the superior oblique is the depressor; failure of downgaze in adduction (with intact adduction) indicates a trochlear nerve lesion.", "wrong": ["Supplies lateral rectus (abduction).", "Purely sensory branch of V1.", "Its loss would also impair adduction (medial rectus) and elevation (inferior oblique).", "Supplies superior rectus and levator; elevation/ptosis, not downgaze.", ""], "pearl": "Test CN IV: adduct the eye, then look down (superior oblique depresses the adducted eye).", "set": "orbit"}, {"id": "G-77", "stem": "A 44-year-old woman being treated for Raynaud's disease receives a sympathetic blocking drug in high doses. Which adverse effect is most likely?", "opts": ["Exophthalmos and dilated pupil", "Enophthalmos and dry eye", "Dry eye and inability to accommodate for reading", "Wide open eyelids and loss of depth perception", "Ptosis and miosis"], "ans": 4, "why": "Blocking sympathetics paralyzes the superior tarsal (Müller) muscle, giving partial ptosis, and leaves the parasympathetic sphincter pupillae unopposed, giving miosis.", "wrong": ["Pupil dilation needs sympathetic dilator pupillae, which is blocked.", "Lacrimation is parasympathetic and would be preserved.", "Lacrimation and accommodation are both parasympathetic and unaffected.", "Eyelid elevation would be reduced, and depth perception is a visual pathway function.", ""], "pearl": "Sympathetic loss = Horner features: partial ptosis (Müller) + miosis ± anhidrosis; complete ptosis = CN III (levator).", "set": "orbit"}, {"id": "G-78", "stem": "A 47-year-old woman has signs of cavernous sinus thrombosis, and imaging shows a pituitary tumor invading the cavernous sinus. The physician suspects the tumor has damaged her right abducens nerve. In which direction would the physician most likely ask her to move her right eye to confirm the abducens injury, assuming she cannot do it?", "opts": ["Inward", "Outward", "Downward", "Down and out", "Down and in"], "ans": 1, "why": "CN VI supplies only the lateral rectus, the muscle that abducts (turns the eye outward). Failure to look outward is the direct test for abducens injury.", "wrong": ["Adduction is done by the medial rectus (CN III).", "", "Downward gaze uses inferior rectus (CN III) and superior oblique (CN IV).", "Down and out needs inferior rectus plus lateral rectus; not a pure CN VI test.", "Down and in is the superior oblique (CN IV) test."], "pearl": "CN VI = lateral rectus = abduction; it is the most vulnerable nerve in the cavernous sinus (runs free beside the ICA).", "set": "orbit"}, {"id": "G-79", "stem": "An 8-year-old boy has a drooping right eyelid (ptosis), and Horner syndrome is suspected. Which additional sign on the right side would confirm the diagnosis?", "opts": ["Constricted pupil", "Dry eye", "Exophthalmos", "Pale, blanched face", "Sweaty face"], "ans": 0, "why": "Horner syndrome is loss of sympathetic supply to the head: ptosis, miosis (small pupil) and anhidrosis. With the dilator pupillae unopposed, the pupil constricts.", "wrong": ["", "Tear secretion is parasympathetic (CN VII), so tearing is spared.", "Horner causes no protrusion (apparent enophthalmos, if anything); exophthalmos suggests hyperthyroidism.", "Loss of sympathetic vasoconstriction causes flushing, not pallor.", "Sympathetic loss causes anhidrosis, not sweating."], "pearl": "Horner triad: ptosis, miosis, anhidrosis (plus facial flushing).", "set": "orbit"}, {"id": "G-80", "stem": "A 32-year-old woman has headaches and dizziness. On examination she has partial ptosis (drooping eyelid). Which muscle is most likely paralyzed?", "opts": ["Orbicularis oculi, lacrimal part", "Orbicularis oculi, palpebral part", "Levator palpebrae superioris", "Superior oblique", "Superior tarsal (of Müller)"], "ans": 4, "why": "The superior tarsal muscle is sympathetically innervated smooth muscle that helps hold the lid up. Losing it causes only mild (partial) ptosis, whereas losing the levator (CN III) causes complete ptosis.", "wrong": ["The lacrimal part helps drain tears; it does not lift the lid.", "The palpebral part closes the lid gently; paralysis would not cause ptosis.", "Levator (CN III) paralysis causes complete ptosis, not partial.", "The superior oblique moves the globe; it does not lift the eyelid.", ""], "pearl": "Partial ptosis = superior tarsal (sympathetic, Horner); complete ptosis = levator palpebrae (CN III).", "set": "orbit"}, {"id": "G-81", "stem": "A 16-year-old boy with severe facial acne has fever, confusion and drowsiness. Imaging shows cavernous sinus thrombosis. Which route most likely carried the infection into the cavernous sinus?", "opts": ["Carotid artery", "Mastoid emissary vein", "Middle meningeal artery", "Ophthalmic vein", "Parietal emissary vein"], "ans": 3, "why": "Veins around the nose drain through the angular vein into the superior ophthalmic vein, which empties straight into the cavernous sinus. These veins have no valves, so infection can travel backward into the sinus.", "wrong": ["The ICA passes through the sinus but is not a route for infection from the face.", "The mastoid emissary vein links scalp veins with the sigmoid sinus, not the face with the cavernous sinus.", "The middle meningeal artery lies between dura and bone and does not drain the face.", "", "The parietal emissary vein connects scalp veins to the superior sagittal sinus."], "pearl": "Danger triangle of face -> angular v. -> superior ophthalmic v. -> cavernous sinus (valveless veins).", "set": "cranial"}, {"id": "G-84", "stem": "A 56-year-old man has an extradural tumor in the posterior cranial fossa. When he sticks out his tongue, it deviates to the right. Which muscle and nerve are most likely injured?", "opts": ["Right hypoglossal nerve and right genioglossus", "Left hypoglossal nerve and left genioglossus", "Right hyoglossus and left styloglossus", "Right geniohyoid and first cervical nerve", "Contralateral vagus and hypoglossal nerves"], "ans": 0, "why": "Each genioglossus pushes the tongue forward and toward the opposite side. If the right one is paralyzed (right CN XII), the working left genioglossus pushes the tip toward the right, the weak side.", "wrong": ["", "A left lesion would make the tongue deviate to the left.", "The hyoglossus and styloglossus retract the tongue; they do not cause deviation on protrusion.", "The geniohyoid (C1) moves the hyoid, not the tongue.", "The vagus does not supply the protruding muscles of the tongue."], "pearl": "Tongue 'licks the lesion': it deviates toward the side of a lower motor neuron CN XII injury.", "set": "cn"}, {"id": "G-86", "stem": "A 17-year-old girl has a tonsillectomy for tonsillitis and afterward complains of ear pain. Which nerve was most likely injured or irritated during the operation?", "opts": ["Auriculotemporal", "Lesser petrosal", "Vagus", "Glossopharyngeal", "Chorda tympani"], "ans": 3, "why": "CN IX carries sensation from the tonsillar bed and pharynx and also from the middle ear (tympanic branch). Irritating it in the tonsillar bed causes pain that is felt in the ear (referred pain).", "wrong": ["Supplies the auricle, external meatus and temple; it is not in the tonsillar bed.", "Carries parasympathetic fibers to the otic ganglion; it has no role in sensation.", "The vagus supplies the external meatus but does not lie in the tonsillar bed.", "", "Carries taste from the anterior 2/3 of the tongue; it is not in the tonsillar field."], "pearl": "Post-tonsillectomy ear pain = CN IX (it lies in the tonsillar bed and also supplies the middle ear).", "set": "nasal_oral"}, {"id": "G-87", "stem": "A 49-year-old woman has a tumor at the jugular foramen. When the right side of her pharyngeal wall is touched, the uvula deviates to the left and the left pharyngeal wall moves upward. Touching the left wall gives the same response. Which nerve has the tumor most likely injured?", "opts": ["Right glossopharyngeal", "Left glossopharyngeal", "Right mandibular", "Left hypoglossal", "Right vagus"], "ans": 4, "why": "The uvula is pulled toward the healthy side by the working levator veli palatini, so deviation to the left means the right palatal and pharyngeal muscles (CN X) are paralyzed. Sensation is intact on both sides, so CN IX is working.", "wrong": ["The reflex can still be triggered from the right side, so right CN IX sensation is intact.", "A left CN IX lesion would block the reflex from the left; the left side contracts normally.", "V3 supplies the chewing muscles and tensor veli palatini, not the pharyngeal constrictors.", "CN XII moves the tongue and has no effect on uvula position.", ""], "pearl": "Uvula deviates AWAY from the side of a CN X lesion.", "set": "cn"}, {"id": "G-88", "stem": "A 45-year-old man has severe difficulty breathing. His mouth floor and pharynx are swollen and his airway is almost completely blocked; his lower jaw and upper neck are also swollen. A lower molar was pulled a week ago, and he has felt worse each day since. What is the most likely diagnosis?", "opts": ["Quinsy", "Torus palatinus", "Ankyloglossia", "Ranula", "Ludwig's angina"], "ans": 4, "why": "Ludwig's angina is a spreading infection of the submandibular and sublingual spaces, usually from a lower molar. It raises the floor of the mouth and can block the airway.", "wrong": ["Quinsy is a peritonsillar abscess that complicates tonsillitis, not a tooth infection.", "A benign bony growth on the hard palate; it causes no swelling or airway blockage.", "Tongue-tie: a short lingual frenulum present from birth.", "A mucous cyst in the floor of the mouth that is usually painless.", ""], "pearl": "Lower molar infection -> submandibular space -> Ludwig's angina -> airway threat.", "set": "nasal_oral"}, {"id": "G-89", "stem": "A 5-year-old girl with an upper respiratory infection hears poorly and has a painful right ear, with golden-brown fluid behind the tympanic membrane. What is the most likely direct route for infection to spread from the upper airway to the middle ear?", "opts": ["Pharyngotympanic tube", "Choanae", "Nostrils", "Facial canal", "Internal acoustic meatus"], "ans": 0, "why": "The pharyngotympanic (auditory) tube runs directly from the nasopharynx to the middle ear, so throat infections can travel along it.", "wrong": ["", "The choanae connect the nasal cavity to the nasopharynx, not to the ear.", "The nostrils open the nose to the outside only.", "The facial canal carries CN VII through the temporal bone.", "The internal acoustic meatus carries CN VII and VIII, not infection from the pharynx."], "pearl": "The auditory tube opens in the nasopharynx at the torus tubarius; it is the path for otitis media.", "set": "nasal_oral"}, {"id": "G-90", "stem": "A 54-year-old man has a carcinoma in his nasal cavity. In which location would the tumor block the opening of the maxillary sinus?", "opts": ["Inferior meatus", "Middle meatus", "Superior meatus", "Nasopharynx", "Sphenoethmoidal recess"], "ans": 1, "why": "The maxillary sinus drains into the semilunar hiatus, which lies in the middle meatus under the middle concha.", "wrong": ["The inferior meatus receives the nasolacrimal duct.", "", "The superior meatus drains the posterior ethmoidal cells.", "The nasopharynx receives the auditory tube, not the sinuses.", "The sphenoethmoidal recess drains the sphenoid sinus."], "pearl": "Middle meatus (semilunar hiatus) drains the frontal, maxillary and anterior ethmoidal sinuses; the inferior meatus drains the nasolacrimal duct.", "set": "nasal_oral"}, {"id": "G-91", "stem": "A 54-year-old man needs surgery near the cavernous sinus, and the surgeon plans an approach to the sella turcica through the nasal cavity. Through which route would the surgeon most likely reach the cranial cavity?", "opts": ["Cribriform plate", "Cavernous sinus", "Frontal sinus", "Maxillary sinus", "Sphenoidal sinus"], "ans": 4, "why": "The sphenoid sinus lies directly below the sella turcica and pituitary, so the transsphenoidal approach is the most direct way in through the nose.", "wrong": ["Too far forward; entering here damages the olfactory nerves and causes CSF leak.", "The cavernous sinus is inside the skull beside the sella; it is not an entry route.", "The frontal sinus does not open toward the sella.", "The maxillary sinus does not open into the cranial cavity.", ""], "pearl": "Pituitary surgery is transsphenoidal: nose -> sphenoid sinus -> sella turcica.", "set": "nasal_oral"}, {"id": "G-92", "stem": "A 10-year-old girl has her tonsils removed. One week later, pressing on the back of her tongue on the left does not trigger a gag reflex. The sensory part of which nerve was most likely injured?", "opts": ["Facial", "Glossopharyngeal", "Mandibular", "Maxillary", "Hypoglossal"], "ans": 1, "why": "CN IX carries the sensory (afferent) signal for the gag reflex from the posterior tongue and oropharynx. It runs in the tonsillar bed, so tonsillectomy can injure it.", "wrong": ["CN VII carries taste from the anterior 2/3 of the tongue; it has no role in the gag reflex.", "", "V3 carries general sensation from the anterior 2/3 of the tongue, not the posterior third.", "V2 supplies the palate and nasal cavity, not the posterior tongue.", "CN XII is purely motor to the tongue."], "pearl": "Gag reflex: CN IX sensory (afferent), CN X motor (efferent).", "set": "nasal_oral"}, {"id": "G-93", "stem": "A 56-year-old woman has a complete thyroidectomy. After anesthesia her voice is hoarse for 3 weeks, and examination shows her right vocal fold is permanently adducted. Surgical injury to the nerve supply of which muscle most likely explains this vocal fold position?", "opts": ["Aryepiglottic", "Posterior cricoarytenoid", "Thyroarytenoid", "Transverse arytenoids", "Vocalis"], "ans": 1, "why": "The posterior cricoarytenoid is the only muscle that abducts the vocal fold, and it is supplied by the recurrent laryngeal nerve. If it is paralyzed, the adductors win and the fold stays near the midline.", "wrong": ["Narrows the laryngeal inlet; it does not abduct the vocal fold.", "", "Relaxes and shortens the vocal fold; losing it would not leave the fold adducted.", "Adducts the arytenoids; losing it would not cause fixed adduction.", "Adjusts vocal fold tension; it is not an abductor."], "pearl": "Posterior cricoarytenoid = the only abductor ('pull apart') and is supplied by the RLN.", "set": "larynx"}, {"id": "G-94", "stem": "A 45-year-old man has ear pain, hearing loss in one ear, nosebleeds and nasal obstruction, and is diagnosed with a nasopharyngeal carcinoma. There is fluid in his middle ear. Enlargement of which structure would most likely block drainage of the auditory tube?", "opts": ["Lingual tonsil", "Palatine tonsil", "Pharyngeal tonsil", "Superior constrictor muscle", "Uvula"], "ans": 2, "why": "The pharyngeal tonsil (adenoid) sits in the nasopharynx beside the auditory tube opening and pharyngeal recess, so when it enlarges it can block the tube.", "wrong": ["Lies on the posterior tongue in the oropharynx, far from the tube.", "Lies in the tonsillar fossa of the oropharynx, below the tube opening.", "", "Lies behind the pharyngeal mucosa and does not cover the tube opening.", "Rises to seal the nasopharynx when swallowing but does not block the tube."], "pearl": "Enlarged adenoids -> auditory tube blockage -> middle ear effusion.", "set": "nasal_oral"}, {"id": "G-96", "stem": "A 25-year-old medical student eats burnt toast in a hurry and scratches the roof of his mouth, leaving a stinging feeling on his hard palate. Which nerve carries this sensation from the hard palate?", "opts": ["Posterior superior alveolar nerve", "Inferior alveolar nerve", "Lingual nerve", "Greater palatine nerve", "Lesser palatine nerve"], "ans": 3, "why": "The greater palatine nerve (V2, through the pterygopalatine fossa) exits the greater palatine foramen and supplies most of the hard palate mucosa.", "wrong": ["Supplies the upper molars and nearby gums, not the palate.", "Supplies the lower teeth and chin (V3).", "Supplies the anterior 2/3 of the tongue and floor of the mouth.", "", "Supplies the soft palate, not the hard palate."], "pearl": "Hard palate = greater palatine n. (plus nasopalatine anteriorly); soft palate = lesser palatine n.", "set": "nasal_oral"}, {"id": "G-97", "stem": "Two months after a thyroidectomy, a 32-year-old woman cannot sense foreign objects in her laryngeal vestibule. Which nerve was most likely injured?", "opts": ["Internal laryngeal nerve", "External laryngeal nerve", "Glossopharyngeal nerve", "Hypoglossal nerve", "Recurrent laryngeal nerve"], "ans": 0, "why": "The internal branch of the superior laryngeal nerve pierces the thyrohyoid membrane and supplies the laryngeal mucosa above the vocal folds, including the vestibule.", "wrong": ["", "Motor to the cricothyroid; injury causes a weak voice, not sensory loss.", "Supplies the pharynx and posterior tongue, not the laryngeal vestibule.", "Motor to the tongue; injury does not affect laryngeal sensation.", "Supplies sensation below the vocal folds, plus most laryngeal muscles."], "pearl": "Above the vocal folds = internal laryngeal n.; below the folds = recurrent laryngeal n.", "set": "larynx"}, {"id": "G-98", "stem": "A 4-year-old boy with ankyloglossia is seen by a speech therapist and referred to a pediatric surgeon. Which operation is most appropriate for this condition?", "opts": ["Removal of pterygomandibular raphe", "Resection of the pterygoid hamulus bilaterally", "Cutting the lingual frenulum", "Repair of the palate", "Removal of the central segment of the hyoid bone"], "ans": 2, "why": "In ankyloglossia (tongue-tie), the lingual frenulum is abnormally short or reaches the tip of the tongue, which limits movement. Cutting it (frenotomy) is the treatment.", "wrong": ["The raphe anchors the buccinator and superior constrictor; it has nothing to do with tongue-tie.", "The hamulus is the pulley for the tensor veli palatini; it does not tether the tongue.", "", "Palate repair treats cleft palate, not tongue-tie.", "Removing part of the hyoid is used for thyroglossal duct cysts (Sistrunk), not tongue-tie."], "pearl": "Ankyloglossia = short lingual frenulum -> frenotomy.", "set": "nasal_oral"}, {"id": "G-99", "stem": "An 8-year-old boy has a radical mastoid operation for a middle ear infection that spread to the mastoid air cells. Afterward his mouth is pulled up toward the left, he cannot close his right eye, and saliva pools in his right cheek and dribbles from the corner of his mouth. Which structure was most likely damaged?", "opts": ["Mandibular nerve", "Parotid duct", "Vagus nerve", "Facial nerve", "Glossopharyngeal nerve"], "ans": 3, "why": "The facial nerve runs through the temporal bone next to the mastoid and exits at the stylomastoid foramen. Injury there paralyzes the facial muscles on that side, so the eye stays open, the cheek (buccinator) is slack and the mouth is pulled to the healthy side.", "wrong": ["V3 moves the jaw (chewing muscles), not the facial muscles.", "Injury would affect saliva flow, not the facial muscles.", "The vagus does not supply the facial muscles.", "", "CN IX does not supply the facial muscles."], "pearl": "Mastoid surgery puts CN VII at risk (stylomastoid foramen); a lower motor neuron lesion paralyzes the whole side of the face.", "set": "cn"}, {"id": "G-100", "stem": "After a mastoidectomy, an 8-year-old boy has facial paralysis (Bell palsy). Saliva collects in the vestibule of his mouth and dribbles from the corner of his mouth. Which muscle is most likely paralyzed?", "opts": ["Zygomaticus major", "Orbicularis oculi", "Buccinator", "Levator palpebrae superioris", "Orbicularis oris"], "ans": 2, "why": "The buccinator keeps the cheek pressed against the teeth, which stops food and saliva from collecting in the vestibule. When it is paralyzed, material pools in the cheek.", "wrong": ["Raises the corner of the mouth when smiling; it does not keep the vestibule clear.", "Closes the eyelids; it has no role in the cheek.", "", "Raises the eyelid and is supplied by CN III, not CN VII.", "Closes the lips, but the cheek muscle is what keeps the vestibule empty."], "pearl": "Buccinator (CN VII buccal branch) keeps food and saliva out of the vestibule.", "set": "face"}, {"id": "G-101", "stem": "A 32-year-old man has a tumor of the anterior pituitary gland. He has lost the outer (lateral) half of the visual field in both eyes (bitemporal hemianopia). Which structure is most likely compressed?", "opts": ["Optic nerve", "Optic chiasm", "Optic tract", "Oculomotor", "Abducens nerve"], "ans": 1, "why": "The optic chiasm lies just above the pituitary. Pressure on it damages the crossing fibers from both nasal retinas, which see the temporal visual fields.", "wrong": ["Compression would cause complete blindness in one eye.", "", "Compression would cause a homonymous hemianopia.", "Compression would cause a 'down and out' eye, ptosis and a dilated pupil.", "Compression would cause loss of abduction (the eye turns inward)."], "pearl": "Pituitary tumor -> chiasm -> bitemporal hemianopia.", "set": "cn"}, {"id": "G-102", "stem": "A 45-year-old woman has trouble seeing when walking down stairs. On examination she is weak at looking down and in. Imaging shows an arterial aneurysm pressing on a nerve just below the tentorium cerebelli. Which artery and nerve are most likely involved?", "opts": ["Internal carotid artery/abducens nerve", "Middle cerebral artery/oculomotor nerve", "Posterior cerebral artery/ophthalmic nerve", "Basilar artery/ophthalmic nerve", "Superior cerebellar artery/trochlear nerve"], "ans": 4, "why": "Weak down-and-in gaze (trouble with stairs) points to the superior oblique, supplied by CN IV. CN IV wraps around the midbrain beside the superior cerebellar artery, just below the tentorium.", "wrong": ["A CN VI lesion causes loss of abduction, not weak downward gaze.", "A CN III lesion would also cause ptosis, a dilated pupil and a 'down and out' eye.", "The ophthalmic nerve is sensory and cannot weaken eye movement.", "The ophthalmic nerve is sensory; it cannot cause gaze weakness.", ""], "pearl": "Trouble reading or going down stairs with head tilt = CN IV (superior oblique) lesion.", "set": "cn"}, {"id": "G-103", "stem": "A 72-year-old woman has painful tenderness in her upper right chest. On examination her right eyelid droops slightly and her right pupil is smaller than the left. What is the most likely diagnosis?", "opts": ["Raynaud disease", "Frey syndrome", "Bell palsy", "Quinsy", "Pancoast tumor"], "ans": 4, "why": "A Pancoast tumor at the lung apex can invade the cervical sympathetic chain and stellate ganglion, causing Horner syndrome (mild ptosis and miosis) on the same side.", "wrong": ["A vasospastic disorder of the fingers and toes; it does not cause Horner signs.", "Gustatory sweating after parotid surgery.", "A CN VII palsy causes facial muscle weakness, not miosis.", "A peritonsillar abscess.", ""], "pearl": "Apical lung tumor + ipsilateral Horner syndrome = Pancoast tumor.", "set": "orbit"}, {"id": "G-104", "stem": "The dilator pupillae, the smooth muscle of the superior tarsal muscle and the smooth muscle of the ciliary body blood vessels all receive efferent nerve fibers. Which structure contains the cell bodies of these fibers?", "opts": ["Pterygopalatine ganglion", "Intermediolateral nucleus (lateral horn) C1 to C4", "Geniculate ganglion", "Nucleus solitarius", "Superior cervical ganglion"], "ans": 4, "why": "All of these targets receive sympathetic supply. The postganglionic cell bodies for the head are in the superior cervical ganglion, and their fibers travel with the internal carotid and ophthalmic arteries.", "wrong": ["A parasympathetic ganglion (CN VII) for the lacrimal and nasal glands.", "The lateral horn exists only from T1 to L2, and it holds preganglionic neurons.", "A sensory ganglion of CN VII (taste); it has no efferent cell bodies.", "A sensory nucleus for taste and visceral input.", ""], "pearl": "Postganglionic sympathetics to the eye come from the superior cervical ganglion (preganglionic cells at T1).", "set": "orbit"}, {"id": "G-105", "stem": "A 22-year-old man is hit in the right eye by a frozen fish. His eyelids are swollen and bruised, and he cannot turn the eye outward from straight-ahead gaze, suggesting a trapped muscle. Which bone is most likely fractured?", "opts": ["Orbital plate of the frontal bone", "Lamina papyracea of the ethmoid bone", "Orbital plate of the maxilla", "Cribriform plate of the ethmoid bone", "Greater wing of the sphenoid bone"], "ans": 1, "why": "The paper-thin lamina papyracea forms the medial orbital wall. A blowout through it can trap the medial rectus, which then cannot relax, so the eye cannot turn outward.", "wrong": ["A roof fracture would rarely trap the superior muscles.", "", "A floor fracture traps the inferior rectus or oblique and limits upward gaze.", "Causes anosmia and CSF rhinorrhea, not muscle entrapment.", "The lateral wall is thick and does not typically trap muscles."], "pearl": "Medial wall (ethmoid) blowout traps the medial rectus; floor (maxilla) blowout traps the inferior rectus.", "set": "orbit"}, {"id": "G-106", "stem": "A 57-year-old man has a tumor in the superior orbital fissure. His eye is fixed looking outward and slightly down, the pupil is dilated and the upper lid droops. When asked to look toward his nose, the eye only rotates inward (intorsion). The consensual corneal reflexes are normal. Which nerve is most likely affected?", "opts": ["Trochlear nerve", "Oculomotor nerve", "Abducens nerve and sympathetic nerve plexus accompanying the ophthalmic artery", "Ophthalmic nerve and short ciliary nerve", "Superior division of oculomotor nerve and the nasociliary nerve"], "ans": 1, "why": "A CN III lesion leaves only the lateral rectus (CN VI) and superior oblique (CN IV) working, so the eye sits down and out. The lid droops (levator), the pupil is dilated (loss of parasympathetic supply), and trying to adduct shows only superior oblique intorsion.", "wrong": ["A CN IV lesion causes weak down-and-in gaze, not ptosis or a dilated pupil.", "", "A CN VI lesion causes inward deviation; sympathetic loss causes a small pupil, not a dilated one.", "Normal corneal reflexes argue against V1 injury, and ptosis is not explained.", "The superior division alone would spare the pupil and medial rectus."], "pearl": "CN III palsy: 'down and out', ptosis, dilated pupil; intorsion on attempted adduction shows CN IV is intact.", "set": "orbit"}, {"id": "G-107", "stem": "A 57-year-old man falls from a tree, and CT shows a fracture of the cribriform plate. Which finding is most likely on examination?", "opts": ["Entrapment of the eyeball", "Anosmia", "Hyperacusis", "Tinnitus", "Deafness"], "ans": 1, "why": "Olfactory nerve fibers pass through the foramina of the cribriform plate, so a fracture there can tear them and cause loss of smell.", "wrong": ["Muscle entrapment comes from orbital wall fractures, not the cribriform plate.", "", "Caused by stapedius paralysis (CN VII).", "Caused by inner ear or CN VIII problems.", "Caused by middle ear, inner ear or CN VIII problems."], "pearl": "Cribriform plate fracture: anosmia + CSF rhinorrhea.", "set": "cranial"}, {"id": "G-108", "stem": "A 45-year-old woman has a parotid tumor removed. Three months later, her face sweats heavily when she tastes or smells food, and Frey syndrome (gustatory sweating) is diagnosed. Which nerve was most likely injured during the operation?", "opts": ["Buccal", "Inferior alveolar", "Auriculotemporal", "Facial", "Lingual"], "ans": 2, "why": "The auriculotemporal nerve carries parasympathetic fibers from the otic ganglion to the parotid. After it is cut, these fibers can regrow into the skin's sweat glands, so eating triggers sweating instead of salivation.", "wrong": ["Sensory to the cheek; it carries no parotid secretomotor fibers.", "Supplies the lower teeth; it is not in the parotid.", "", "Injury to CN VII causes facial paralysis, not gustatory sweating.", "Carries fibers to the submandibular ganglion, not the parotid."], "pearl": "Frey syndrome = misdirected regrowth of the auriculotemporal nerve (CN IX fibers via the otic ganglion) after parotid surgery.", "set": "face"}, {"id": "G-109", "stem": "A 54-year-old man is having a bilateral thyroidectomy. If a certain nerve is injured on both sides, the muscles that open the airway could be paralyzed, and he could suffocate unless he is intubated or has a surgical airway. Which pair of muscles opens the airway?", "opts": ["Cricothyroids", "Posterior cricoarytenoids", "Arytenoids", "Thyroarytenoids", "Lateral cricoarytenoids"], "ans": 1, "why": "The posterior cricoarytenoids are the only muscles that abduct the vocal folds and widen the rima glottidis. Bilateral RLN injury paralyzes them and can cause airway obstruction.", "wrong": ["They tense the vocal folds (external laryngeal n.); they do not abduct.", "", "They adduct the arytenoids and close the posterior glottis.", "They relax and adduct the vocal folds.", "They adduct the vocal folds."], "pearl": "Bilateral RLN injury -> both folds sit near the midline -> stridor and airway emergency.", "set": "larynx"}, {"id": "G-110", "stem": "An 11-year-old boy has swollen palatine tonsils. Which artery supplies most of the blood to these tonsils?", "opts": ["Ascending pharyngeal", "Facial", "Lingual", "Descending palatine", "Superior thyroid"], "ans": 1, "why": "The tonsillar branch of the facial artery is the main blood supply to the palatine tonsil, so it must be controlled during tonsillectomy.", "wrong": ["A minor contributor to the tonsil.", "", "Contributes only small dorsal lingual branches.", "Contributes only via the lesser palatine branches, a minor supply.", "Supplies the thyroid and larynx, not the tonsil."], "pearl": "Main tonsillar artery = tonsillar branch of the facial artery.", "set": "nasal_oral"}, {"id": "G-112", "stem": "A 45-year-old man has trigeminal neuralgia so severe that he has thought of suicide. Even a light touch on the skin between the lower eyelid and upper lip sets off severe pain. The plan is to destroy the involved nerve branch by injecting alcohol into it. Through which opening will the needle most likely need to pass to reach the nerve?", "opts": ["Foramen ovale", "Foramen spinosum", "Infraorbital foramen", "Mandibular foramen", "Foramen magnum"], "ans": 2, "why": "The skin between the lower lid and upper lip is supplied by the infraorbital nerve (V2), which exits through the infraorbital foramen below the orbit.", "wrong": ["V3 exits here; it does not supply the skin between the lid and lip.", "Carries the middle meningeal artery.", "", "The inferior alveolar nerve (lower teeth) enters here.", "Carries the spinal cord, vertebral arteries and the spinal part of CN XI."], "pearl": "Lower lid, cheek and upper lip = V2 via the infraorbital foramen.", "set": "face"}, {"id": "G-113", "stem": "After a thyroidectomy, a 32-year-old woman has lost sensation inside the larynx from the vocal folds up to the laryngeal inlet, and liquids enter her airway. Which nerve is most likely injured?", "opts": ["Internal laryngeal nerve", "External laryngeal nerve", "Glossopharyngeal nerve", "Hypoglossal nerve", "Recurrent laryngeal nerve"], "ans": 0, "why": "The internal laryngeal nerve supplies the laryngeal mucosa above the vocal folds. Losing it removes the cough reflex that protects against aspiration.", "wrong": ["", "Motor to the cricothyroid; injury weakens the voice without sensory loss.", "Injury would cause wider pharyngeal and posterior tongue sensory loss.", "Motor to the tongue only.", "Supplies sensation below the vocal folds and most of the laryngeal muscles."], "pearl": "Internal laryngeal injury -> loss of supraglottic sensation -> aspiration.", "set": "larynx"}, {"id": "G-114", "stem": "A 55-year-old man slips and falls. He has a hematoma in the 'danger zone' of the scalp that spreads into his eyelids. Which layer is the 'danger zone'?", "opts": ["Loose, areolar layer", "Skin", "Galea aponeurotica", "Pericranium", "Subcutaneous layer"], "ans": 0, "why": "Blood and infection spread easily through the loose areolar layer, which also has emissary veins that connect to the dural sinuses. The frontalis has no bony attachment, so blood can track forward into the eyelids.", "wrong": ["", "The outer layer of the scalp; it does not allow spread.", "A tough aponeurosis; it is not a space.", "Firmly attached at the sutures, which limits the spread of blood.", "Dense connective tissue with many blood vessels; it limits spread and makes wounds gape."], "pearl": "SCALP: the Loose areolar layer is the danger zone (emissary veins lead into the dural sinuses).", "set": "face"}, {"id": "G-115", "stem": "A 45-year-old woman with hypertension and arrhythmias has a severe headache. To lower her blood pressure, massage is applied at a point deep to the anterior border of the sternocleidomastoid at the level of the upper border of the thyroid cartilage. W
