hich structure is being targeted?", "opts": ["Carotid sinus", "Carotid body", "Thyroid gland", "Parathyroid gland", "Inferior cervical ganglion"], "ans": 0, "why": "The carotid sinus, a widening at the carotid bifurcation (C4), is a baroreceptor. Pressing on it reflexively slows the heart and lowers blood pressure through CN IX and CN X.", "wrong": ["", "A chemoreceptor that senses O2 and CO2, not pressure.", "Plays no part in acute pressure reflexes.", "Controls calcium, not blood pressure reflexes.", "Part of the stellate ganglion, low in the neck; it is not a baroreceptor."], "pearl": "Carotid sinus = baroreceptor (CN IX); carotid body = chemoreceptor. Both are at the bifurcation, level of the upper border of the thyroid cartilage.", "set": "neck"}, {"id": "G-116", "stem": "A 59-year-old painter falls from scaffolding and arrives unconscious. During an emergency tracheostomy, brisk arterial bleeding suddenly comes from the midline incision over the trachea. Which vessel was most likely cut?", "opts": ["Inferior thyroid branch of thyrocervical trunk", "Cricothyroid branch of the superior thyroid artery", "Thyroidea ima artery", "Middle thyroid vein", "Jugular arch connecting the anterior jugular veins"], "ans": 2, "why": "The thyroidea ima artery, present in about 10% of people, rises in the midline on the front of the trachea, so a midline tracheostomy can cut it.", "wrong": ["Approaches the thyroid from the side, not in the midline in front of the trachea.", "Crosses the cricothyroid ligament, above a tracheostomy site.", "", "A vein, so bleeding would not be arterial.", "A vein, so bleeding would not be arterial."], "pearl": "Thyroidea ima (from the brachiocephalic trunk or aortic arch) is a midline trap during tracheostomy.", "set": "neck"}, {"id": "G-117", "stem": "A 21-year-old baseball player comes in with severe dizziness, poor balance and memory problems. He has a 3-cm scalp wound from an injury in a game several weeks earlier. A lumbar puncture shows no blood in the CSF. What is the most likely diagnosis?", "opts": ["The middle meningeal artery was torn, resulting in epidural hematoma", "There is a fracture in the pterion with injury to the adjacent vasculature", "The injury resulted in the bursting of a preexisting aneurysm of the anterior communicating artery of the cerebral circle", "A cerebral vein is torn", "The cavernous sinus has a thrombus"], "ans": 3, "why": "A torn bridging (cerebral) vein bleeds slowly into the subdural space, so symptoms build over weeks. The blood stays out of the subarachnoid space, so the CSF is clear.", "wrong": ["An epidural bleed is acute (lucid interval), not delayed by weeks.", "A pterion fracture tears the middle meningeal artery and causes an acute epidural bleed.", "An aneurysm rupture causes subarachnoid bleeding, which puts blood in the CSF.", "", "Would cause palsies of CN III, IV, V1/V2 and VI."], "pearl": "Slow, delayed symptoms with clear CSF = subdural hematoma (torn bridging veins).", "set": "cranial"}, {"id": "G-118", "stem": "A 63-year-old man had a prostate tumor removed 2 years ago and now has headaches and other neurologic problems. Imaging shows the cancer has spread to the posterior cranial fossa through the vertebral venous plexus. His right shoulder droops, he is weak at turning his head to the left, and his tongue points to the right when he sticks it out. There are no other significant findings. Which nerves are most likely affected?", "opts": ["Right vagus, right accessory, and right hypoglossal nerves", "Left accessory, right glossopharyngeal, right vagus, and left hypoglossal nerves", "Left hypoglossal, right trigeminal, and left glossopharyngeal nerves", "Right accessory and right hypoglossal nerves", "Left facial, left accessory, right accessory, and vagus nerves"], "ans": 3, "why": "The drooping right shoulder (trapezius) and weak head turn to the left (right SCM) point to the right CN XI. Tongue deviation to the right points to the right CN XII.", "wrong": ["There are no vagal signs (voice, uvula) to suggest CN X involvement.", "Left XI and left XII lesions would cause left-sided signs.", "None of these nerves explains the shoulder droop.", "", "A left XI lesion does not fit, and the tongue signs are not explained."], "pearl": "Right SCM turns the head to the LEFT; CN XI lesion = shoulder droop + weak turn to the opposite side.", "set": "cn"}, {"id": "G-120", "stem": "A 14-year-old girl has a right peritonsillar abscess (quinsy). Which artery is at greatest risk during removal or incision and drainage of the diseased tissue?", "opts": ["Lingual", "A branch of facial", "Superior laryngeal artery", "Ascending pharyngeal artery", "Descending palatine artery"], "ans": 1, "why": "The tonsillar branch of the facial artery is the main supply to the palatine tonsil and lies right in the surgical field.", "wrong": ["Runs below the oropharynx, deep to the hyoglossus.", "", "Lies lower, at the thyrohyoid membrane.", "Arises low in the carotid triangle and is a minor tonsillar supplier.", "Only its terminal branches reach the upper pole of the tonsil; the main vessel is not at risk."], "pearl": "Tonsillar surgery puts the tonsillar branch of the facial artery at risk.", "set": "nasal_oral"}, {"id": "G-121", "stem": "A 17-year-old girl with severe acne has a painful, inflamed lesion on the side of her nose. She is warned not to squeeze it, because infection between the eye and upper lip or beside the nose can spread to the cavernous sinus. Which route of spread is most typical?", "opts": ["Nasal venous tributary to angular vein, to superior ophthalmic vein, then to cavernous sinus", "Retromandibular vein to supraorbital vein, then to inferior ophthalmic vein, then to cavernous sinus", "Dorsal nasal vein to superior petrosal vein, then inferior ophthalmic vein to cavernous sinus", "Facial vein to maxillary vein, then middle meningeal vein to cavernous sinus", "Transverse facial vein to superficial temporal vein to emissary vein to cavernous sinus"], "ans": 0, "why": "Veins at the side of the nose drain into the angular vein, which joins the superior ophthalmic vein, which empties into the cavernous sinus. These veins have no valves, so infection can flow backward.", "wrong": ["", "The retromandibular vein does not drain into the supraorbital vein.", "The superior petrosal sinus drains out of the cavernous sinus, not from nasal veins.", "This is not the usual path from the nose; the maxillary vein joins the pterygoid plexus.", "The superficial temporal and emissary routes do not drain the nose area."], "pearl": "Danger triangle: angular v. -> superior ophthalmic v. -> cavernous sinus.", "set": "face"}, {"id": "G-125", "stem": "A 54-year-old man is hit by a car. Imaging shows a fracture through the crista galli with slow local bleeding. What is the most likely source of the bleeding?", "opts": ["Middle meningeal artery", "The great cerebral vein of Galen", "Superior sagittal sinus", "Straight sinus", "Superior ophthalmic vein"], "ans": 2, "why": "The falx cerebri, which carries the superior sagittal sinus, attaches in front to the crista galli. Venous bleeding from the sinus is slow.", "wrong": ["Lies near the pterion and would bleed briskly (arterial).", "Lies at the back, near the straight sinus.", "", "Lies at the back, where the falx meets the tentorium.", "Runs from the orbit to the cavernous sinus, not near the crista galli."], "pearl": "The falx cerebri (with the superior sagittal sinus) anchors to the crista galli in front.", "set": "cranial"}, {"id": "G-126", "stem": "During a routine eye exam, which nerves must work properly for a patient to turn the eye outward (abduction) smoothly, without drifting up or down?", "opts": ["Superior division of oculomotor, ophthalmic nerve, abducens nerve", "Trochlear nerve, abducens nerve, nasociliary nerve", "Inferior division of oculomotor, trochlear, abducens", "Oculomotor and ophthalmic nerves", "Superior division of oculomotor, trochlear, and abducens nerves"], "ans": 2, "why": "The lateral rectus (CN VI) does the main abduction, the superior oblique (CN IV) helps, and the inferior rectus (inferior division of CN III) balances the upward pull of the superior rectus so the eye stays level.", "wrong": ["The ophthalmic nerve is sensory and has no motor role.", "The nasociliary nerve is sensory.", "", "The ophthalmic nerve is sensory, and CN VI is missing.", "The superior division supplies the superior rectus and levator; it does not balance upward drift."], "pearl": "Only CN III, IV and VI move the eye; V1 branches are purely sensory.", "set": "orbit"}, {"id": "G-127", "stem": "A 34-year-old woman has had hoarseness for 3 months. Imaging shows a laryngeal cancer with no spread, in an area with very little lymphatic drainage. Where is the tumor most likely located?", "opts": ["Anterior commissure of the vocal ligaments", "Interarytenoid fold", "Laryngeal ventricle", "Cricothyroid ligament", "Middle segment of the vocal cord"], "ans": 4, "why": "The true vocal folds have almost no lymphatic vessels, so glottic cancers stay local for a long time and cause hoarseness early.", "wrong": ["Has more lymphatic drainage than the mid-fold.", "The supraglottic area drains well to the superior deep cervical nodes.", "The supraglottic ventricle has rich lymphatic drainage.", "The subglottic region drains to the pretracheal and inferior deep cervical nodes.", ""], "pearl": "Vocal fold = lymphatic watershed: supraglottic drains to superior deep cervical nodes, subglottic to pretracheal/inferior deep cervical nodes.", "set": "larynx"}, {"id": "G-128", "stem": "A 55-year-old man has severe headaches, and a lumbar puncture shows traces of blood in the CSF. What has most likely happened?", "opts": ["Fracture of the pterion with vascular injury", "A ruptured 'berry' aneurysm", "Leakage of branches of the middle meningeal vein within the temporal bone", "A tear of the cerebral vein at the entrance to the superior sagittal sinus", "Occlusion of the internal carotid artery by a clot generated in the left atrium"], "ans": 1, "why": "A ruptured berry aneurysm bleeds into the subarachnoid space, where CSF circulates, so blood shows up on lumbar puncture.", "wrong": ["Causes an epidural bleed, which stays out of the CSF.", "", "Bleeding inside the bone does not reach the CSF.", "Causes a subdural bleed, which stays out of the CSF.", "A clot causes ischemic stroke, not bleeding."], "pearl": "Blood in the CSF = subarachnoid hemorrhage (berry aneurysm, 'worst headache of life').", "set": "cranial"}, {"id": "G-130", "stem": "A 65-year-old man hits his head on the dashboard in a car crash. The inferior alveolar nerve is injured at its origin. Which muscle would most likely be paralyzed?", "opts": ["Geniohyoid", "Hyoglossus", "Mylohyoid", "Stylohyoid", "Palatoglossus"], "ans": 2, "why": "Before it enters the mandibular foramen, the inferior alveolar nerve gives off the nerve to mylohyoid, which supplies the mylohyoid and the anterior belly of the digastric.", "wrong": ["Supplied by C1 fibers that travel with CN XII.", "Supplied by CN XII.", "", "Supplied by CN VII.", "Supplied by CN X."], "pearl": "Nerve to mylohyoid (from the inferior alveolar n., V3) supplies the mylohyoid and anterior digastric.", "set": "face"}, {"id": "G-132", "stem": "A 65-year-old man bumped his head on a low branch while driving a tractor 3 weeks ago. He now has confusion and poor coordination, and imaging shows a clot from a leaking cerebral vein over the right hemisphere. What type of bleeding is he most likely having?", "opts": ["Subarachnoid bleeding", "Epidural bleeding", "Intracerebral bleeding into the brain parenchyma", "Subdural bleeding", "Bleeding into the cerebral ventricular system"], "ans": 3, "why": "Torn bridging veins that cross from the brain to the dural sinuses bleed slowly into the subdural space. This causes a gradual, delayed rise in pressure, which is typical in older adults after minor trauma.", "wrong": ["Usually arterial (aneurysm) and sudden, with blood in the CSF.", "Usually a middle meningeal artery tear with rapid decline.", "Usually due to high blood pressure, with sudden focal deficits.", "", "Comes from choroid plexus or deep bleeds, not a surface cerebral vein."], "pearl": "Elderly patient + minor trauma + weeks-long decline = subdural (bridging vein), crescent-shaped on CT.", "set": "cranial"}, {"id": "G-133", "stem": "After a boxing match, a 27-year-old man is tested for the strength and symmetry of jaw opening. Which muscle is most important for protruding the jaw and depressing the mandible?", "opts": ["Anterior portion of temporalis", "Lateral pterygoid", "Medial pterygoid", "Masseter", "Platysma"], "ans": 1, "why": "The lateral pterygoid pulls the condyle and articular disc forward, which protrudes the jaw and starts mouth opening.", "wrong": ["Elevates (closes) the jaw.", "", "Elevates the jaw and helps with side-to-side grinding.", "A strong jaw elevator.", "A facial muscle (CN VII) that only weakly depresses the jaw."], "pearl": "Lateral pterygoid = the only chewing muscle that opens the jaw and protrudes it.", "set": "face"}, {"id": "G-135", "stem": "A 56-year-old man has severe headaches and ear pain. Imaging shows a tumor in the middle ear eroding through its bony floor. Which structure will most likely be affected?", "opts": ["The cochlea and lateral semicircular canal", "The internal carotid artery", "The sigmoid venous sinus", "The internal jugular bulb", "The aditus ad antrum of the mastoid region and the facial nerve"], "ans": 3, "why": "The floor of the middle ear is a thin plate of bone lying directly over the superior bulb of the internal jugular vein.", "wrong": ["These are medial, in the inner ear, not below the floor.", "Related to the anterior (carotid) wall.", "Lies posteriorly and becomes the jugular bulb only at the jugular foramen.", "", "These are related to the posterior wall."], "pearl": "Middle ear walls: floor = jugular bulb; anterior = ICA; posterior = mastoid antrum; medial = inner ear.", "set": "cranial"}, {"id": "G-136", "stem": "A 52-year-old man has a gunshot wound in the infratemporal fossa. He has lost hot, cold, pain and pressure sensation on one side of the front of his tongue, but taste and salivary function are normal. What is the most likely explanation?", "opts": ["The facial nerve was transected distal to the origin of the chorda tympani", "Receptors for hot, cold, pain, and pressure are absent in the patient's tongue", "The glossopharyngeal nerve has been injured in the pharynx", "The superior laryngeal nerve was obviously severed by the bullet", "The lingual nerve was injured at its origin near the foramen ovale"], "ans": 4, "why": "The chorda tympani (taste and salivary fibers) joins the lingual nerve after the lingual nerve branches from V3. An injury high up, before that junction, removes only general sensation.", "wrong": ["Past the chorda tympani, CN VII supplies only the facial muscles; tongue sensation is unaffected.", "Not a real anatomical explanation for a sudden injury.", "CN IX supplies the posterior third of the tongue.", "The superior laryngeal nerve supplies the larynx, not the tongue.", ""], "pearl": "Lingual nerve injury above the chorda tympani junction = general sensory loss only; below the junction = loss of taste and salivation too.", "set": "nasal_oral"}, {"id": "G-138", "stem": "A 65-year-old woman has signs of cavernous sinus thrombosis, and imaging shows an internal carotid artery aneurysm inside the cavernous sinus. If a nerve is compressed within the sinus, which sign would appear first?", "opts": ["Inability to gaze downward and medially on the affected side", "Complete ptosis of the superior palpebra (upper eyelid)", "Bilateral loss of accommodation and loss of direct pupillary reflex", "Ipsilateral loss of the consensual corneal reflex", "Ipsilateral paralysis of abduction of the pupil"], "ans": 4, "why": "CN VI runs through the middle of the cavernous sinus right beside the ICA, rather than in the lateral wall, so it is the first nerve affected by an ICA aneurysm there.", "wrong": ["A trochlear sign; CN IV is protected in the lateral wall.", "Requires a complete CN III lesion, which is not the first to occur.", "A unilateral lesion would not cause bilateral loss.", "Would require loss of both V1 and VII.", ""], "pearl": "CN VI is the first nerve hit in the cavernous sinus because it runs free next to the ICA.", "set": "cranial"}, {"id": "G-139", "stem": "A 54-year-old man fractures his frontozygomatic suture in a car crash. His upper eyelid has several cuts and small fragments of his glasses are in the sclera. Where should the needle be placed to anesthetize the orbital contents and then the injured eyelid?", "opts": ["Into the sclera in the limbic region and also into the infraorbital foramen", "Into the lacrimal fossa and also beneath the lateral bulbar conjunctiva", "Into the supraorbital foramen and also into the lacrimal caruncle", "Through the upper eyelid deeply toward the orbital apex and also between the orbital septum and the palpebral musculature laterally", "Directly posteriorly through the anulus tendineus and superior orbital fissure"], "ans": 3, "why": "The needle aimed deep toward the orbital apex blocks the nasociliary nerve (V1), which supplies the globe. A second injection laterally, between the septum and the lid muscle, blocks the lacrimal nerve supply to the lid.", "wrong": ["Injecting into the sclera would injure the globe.", "The lacrimal fossa is too far medial and does not anesthetize the globe.", "The supraorbital nerve supplies the forehead, not the globe.", "", "Driving the needle through the common tendinous ring risks nerve and vessel injury."], "pearl": "Nasociliary n. (V1) supplies the cornea and globe (the afferent limb of the corneal reflex).", "set": "orbit"}, {"id": "G-140", "stem": "A 45-year-old construction worker falls onto a nail, which pierces the skin over the submental triangle just lateral to the midline. Which muscle would the nail pass through last?", "opts": ["Platysma", "Mylohyoid", "Anterior belly of the digastric", "Geniohyoid", "Genioglossus"], "ans": 4, "why": "Going upward from the skin, the layers are platysma, anterior digastric, mylohyoid, geniohyoid and then genioglossus, the deepest.", "wrong": ["The most superficial muscle, pierced first.", "The third layer, forming the floor of the mouth.", "The second layer, just deep to the platysma.", "The fourth layer, lying just above the mylohyoid.", ""], "pearl": "Submental layers from below: platysma -> anterior digastric -> mylohyoid -> geniohyoid -> genioglossus.", "set": "neck"}, {"id": "G-141", "stem": "A 55-year-old woman has a malignant parotid tumor removed. Afterward, the muscles of her lower lip are clearly weak. Which nerve was most likely injured?", "opts": ["Marginal mandibular branch of facial", "Zygomatic branch of facial", "Mandibular division of the trigeminal nerve", "Buccal branch of facial", "Buccal nerve"], "ans": 0, "why": "The marginal mandibular branch of CN VII leaves the parotid and runs along the mandible to supply the lower lip depressors.", "wrong": ["", "Supplies the orbicularis oculi (eye closure).", "V3 supplies the chewing muscles, not the lip muscles.", "Supplies the buccinator and upper lip muscles.", "The buccal nerve (V3) is sensory to the cheek."], "pearl": "Parotid surgery puts the CN VII branches at risk; the marginal mandibular branch controls the lower lip.", "set": "face"}, {"id": "G-153", "stem": "A 1-year-old boy has a fever after several falls at the playground the day before. Meningitis is suspected, and imaging shows a sinus infection. Which paranasal sinus is present at this age?", "opts": ["Frontal sinus", "Maxillary sinus", "Sphenoid sinus", "Middle ethmoidal air cells", "Posterior ethmoidal air cells"], "ans": 1, "why": "The maxillary sinus is the only sinus clearly present at birth, so it is the likely site of a sinus infection in a 1-year-old.", "wrong": ["Develops after about age 2, from the anterior ethmoidal cells.", "", "Develops after about age 2, from the posterior ethmoidal cells.", "Very small in infancy; the book keys the maxillary sinus as the only one present.", "Very small in infancy; the book keys the maxillary sinus."], "pearl": "Maxillary sinus is present at birth; frontal and sphenoid sinuses appear in childhood.", "set": "nasal_oral"}, {"id": "G-156", "stem": "A 24-year-old man is admitted to the hospital after a street fight. Radiographic examination reveals an inferior blow-out fracture of the orbit. Which of the following nerves is particularly vulnerable with this type of injury?", "opts": ["Infraorbital", "Supratrochlear", "Frontal", "Inferior alveolar", "Optic"], "ans": 0, "why": "The infraorbital nerve (V2) runs in the groove and canal of the orbital floor before exiting at the infraorbital foramen, so a floor (inferior wall) fracture readily injures it, causing numbness of the cheek, lateral nose, and upper lip.", "wrong": ["", "Branch of frontal nerve (V1) running along the superior orbit, away from the floor.", "Runs superiorly over levator palpebrae, beneath the orbital roof, not the floor.", "Lies in the mandible (mandibular canal), not related to the orbit.", "Lies posterior to the globe in the optic canal, away from the orbital floor."], "pearl": "Orbital floor blow-out: infraorbital nerve numbness (cheek/upper lip) + inferior rectus entrapment.", "set": "orbit"}, {"id": "G-158", "stem": "A 55-year-old man presents with pain when chewing over the previous 3 months. Physical examination reveals odynophagia and hoarseness. Radiographic examination reveals a tumor in the tracheoesophageal groove. Which of the following nerves is most likely affected by the tumor?", "opts": ["Recurrent laryngeal", "Internal laryngeal", "Vagus", "External laryngeal", "Phrenic"], "ans": 0, "why": "After looping around the subclavian artery (right) or aortic arch (left), the recurrent laryngeal nerve ascends in the tracheoesophageal groove. Compression there paralyzes most intrinsic laryngeal muscles, producing hoarseness.", "wrong": ["", "Sensory above the vocal folds; enters via the thyrohyoid membrane, not the tracheoesophageal groove.", "Lies in the carotid sheath; a lesion would cause many deficits beyond hoarseness.", "Motor to cricothyroid only; runs with the superior thyroid artery, not in the groove.", "Descends on anterior scalene; injury affects the diaphragm, not the voice."], "pearl": "Tracheoesophageal groove = recurrent laryngeal nerve -> hoarseness.", "set": "neck"}, {"id": "G-159", "stem": "A 34-year-old man sustains multiple lacerations of the scalp over the frontal bone after a motorcycle crash without a helmet. Which of the following veins could most likely provide a pathway for spread of infection from the scalp veins to the underlying dural venous sinuses?", "opts": ["Supratrochlear vein", "Diploic veins", "Anterior cerebral veins", "Superior sagittal sinus", "Supraorbital vein"], "ans": 1, "why": "Diploic veins run within the spongy bone between the skull tables and, together with emissary veins, link the scalp veins to the dural venous sinuses. This valveless route lets scalp infection reach the cranial cavity.", "wrong": ["Superficial scalp vein draining to the face; no direct sinus connection.", "", "An intracranial vein; it does not communicate with scalp veins.", "This is the destination sinus, not the connecting channel from the scalp.", "Superficial forehead vein; drains to the face/ophthalmic veins, not directly to the sinuses."], "pearl": "Scalp infection reaches dural sinuses via emissary + diploic veins (loose areolar 'danger zone').", "set": "cranial"}, {"id": "G-160", "stem": "A 65-year-old man is admitted after a transient ischemic attack. Imaging reveals an aneurysm in the region between the posterior cerebral artery and the superior cerebellar artery. Which of the following nerves will most likely be compressed by the aneurysm?", "opts": ["Trochlear", "Abducens", "Oculomotor", "Vagus", "Optic"], "ans": 2, "why": "The oculomotor nerve emerges from the midbrain and passes between the posterior cerebral and superior cerebellar arteries, so an aneurysm there compresses CN III (often first affecting the pupil).", "wrong": ["Winds around the midbrain; relates to the superior cerebellar artery but not between it and the PCA.", "Emerges at the pontomedullary junction, far from this arterial pair.", "", "Arises from the medulla (postolivary sulcus), too inferior.", "Lies anteriorly near the ICA/anterior circle, not the PCA-SCA region."], "pearl": "CN III passes between PCA and SCA -> aneurysm causes 'down and out' eye + dilated pupil.", "set": "cn"}, {"id": "G-161", "stem": "A 36-year-old female racquetball player is struck in the orbital region. Radiographs reveal a blow-out fracture of the medial wall of the orbit. The pupil of the affected eye cannot be turned laterally. Which of the following muscles is most likely injured or trapped?", "opts": ["Lateral rectus", "Medial and inferior recti", "Medial rectus", "Medial rectus and superior oblique", "Inferior rectus"], "ans": 2, "why": "In a medial wall fracture the medial rectus becomes caught between bone fragments. The trapped muscle tethers the globe, so the eye cannot be moved laterally (abducted), even though its nerve is intact.", "wrong": ["Abducts the eye but lies along the lateral wall, away from a medial fracture.", "Inferior rectus relates to the floor; the deficit here is only abduction.", "", "Superior oblique is superomedial and would not block abduction.", "Lies on the orbital floor; entrapment limits upgaze, not abduction."], "pearl": "Entrapped muscle limits movement OPPOSITE to its action: medial wall -> medial rectus -> can't abduct.", "set": "orbit"}, {"id": "G-162", "stem": "A 16-year-old female volleyball player is hit in the eye with a ball. Radiographs reveal a blow-out fracture of the inferior wall of the orbit. The pupil of her eye cannot be turned upward. Which of the following muscle(s) is (are) most likely injured?", "opts": ["Inferior rectus and inferior oblique", "Medial and inferior recti", "Inferior oblique", "Medial rectus, inferior rectus, and inferior oblique", "Inferior rectus"], "ans": 0, "why": "The fractured orbital floor can trap the inferior rectus and inferior oblique, which then anchor the globe and prevent upward gaze. The muscles and their nerves are not necessarily damaged.", "wrong": ["", "Medial rectus lies on the medial wall, not the floor.", "Only part of the floor-related tethering; the inferior rectus is the main entrapped muscle.", "Medial rectus is not involved in a floor fracture.", "Commonly entrapped, but the keyed answer includes the inferior oblique, which also lies near the floor."], "pearl": "Orbital floor fracture: entrapped inferior rectus -> impaired upgaze + diplopia; check infraorbital n.", "set": "orbit"}, {"id": "G-163", "stem": "A 36-year-old man presents with a painful rash on the dorsum of his nose. Examination reveals a herpetic lesion affecting the dorsum of the nose and the eyeball. Which of the following nerves is most likely responsible for transmission of the virus to the eye?", "opts": ["Nasociliary", "Supratrochlear", "Infraorbital", "Posterior ethmoidal", "Anterior ethmoidal"], "ans": 0, "why": "Vesicles on the tip/dorsum of the nose (Hutchinson sign) indicate V1 zoster in the nasociliary distribution. The nasociliary nerve also supplies the globe (long ciliary nerves), so nasal involvement predicts eye involvement.", "wrong": ["", "Frontal nerve branch supplying the forehead skin; no sensory branches to the globe.", "V2 branch supplying cheek and upper lip, not the eyeball.", "Nasociliary branch to sphenoid/posterior ethmoid cells; does not reach the nasal dorsum skin.", "Supplies the nasal tip via external nasal branch but not the eyeball itself."], "pearl": "Hutchinson sign: nasal tip zoster = nasociliary (V1) -> high risk of ocular involvement.", "set": "orbit"}, {"id": "G-164", "stem": "A 22-year-old man is injured in a street fight and suffers a forehead fracture, resulting in black, swollen eyes. Because he is in severe pain, an anesthetic solution is injected into his orbit toward the orbital apex. Which of the following nerves is most likely to be anesthetized?", "opts": ["Ophthalmic", "Infraorbital", "Anterior ethmoidal", "Frontal", "Optic"], "ans": 0, "why": "A needle passed through the upper eyelid near the orbital margin and directed toward the orbital apex bathes the branches of the ophthalmic division (V1), including the nasociliary, frontal, and lacrimal nerves, anesthetizing the orbit.", "wrong": ["", "V2 branch in the orbital floor canal; not the target of an orbital apex block.", "Only one small branch of the nasociliary; the block affects the whole V1 division.", "Only one V1 branch; the apex injection reaches the entire ophthalmic division.", "Special sensory nerve for vision, not the target for pain relief."], "pearl": "Retrobulbar/orbital apex block anesthetizes V1 branches (and nearby motor nerves).", "set": "orbit"}, {"id": "G-165", "stem": "A 34-year-old woman's right cheekbone and orbit hit the dashboard in a car crash. The affected eye cannot be directed downward when the pupil is adducted. MRI reveals a torn nerve. What is the most common location at which this nerve is injured?", "opts": ["As it pierces the dura of the tentorium cerebelli in the tentorial notch", "At the cavernous sinus", "At the sella turcica", "At the inferior orbital fissure", "At the superior orbital fissure"], "ans": 0, "why": "Inability to look down when adducted means superior oblique weakness from a trochlear nerve lesion. The long, thin CN IV is easily torn where it pierces the tentorial dura, as the brainstem moves during coup-contrecoup impact.", "wrong": ["", "CN IV travels in the lateral wall here but is protected and rarely torn.", "CN IV does not pass through the sella turcica.", "CN IV does not traverse the inferior orbital fissure (V2/infraorbital structures do).", "CN IV enters here, but trauma typically tears it at the tentorial edge."], "pearl": "CN IV: longest intracranial course, only dorsal exit; head trauma -> vertical diplopia, head tilt away.", "set": "cn"}, {"id": "G-166", "stem": "A 56-year-old woman presents with eye pain that is excruciating with any eye movement. MRI reveals that the optic nerve is inflamed. What is the most likely explanation?", "opts": ["The anular tendon (of Zinn) is inflamed", "The inflammation has affected the nerves innervating the eye muscles", "The muscles are contracting due to generalized inflammation", "The nasociliary nerve is affected", "The ophthalmic artery is constricted"], "ans": 0, "why": "The dural sheath of the optic nerve blends with the common tendinous (anular) ring from which the four recti arise. In optic neuritis, rectus contraction pulls on this inflamed ring and nerve sheath, causing pain with eye movement.", "wrong": ["", "Motor nerve involvement would cause weakness/diplopia, not movement-evoked pain.", "No generalized muscle inflammation is described.", "Nasociliary involvement would affect sensation, not explain pain triggered by movement.", "Vascular constriction would affect vision/ischemia, not pain on movement."], "pearl": "Optic neuritis hurts with eye movement because recti arise from the anular tendon fused to the optic sheath.", "set": "orbit"}, {"id": "G-168", "stem": "A 2-month-old male infant falls from his stroller. Examination shows signs of facial nerve injury. What is the most common place for facial nerve injury in an infant?", "opts": ["At the stylomastoid foramen", "Posterior to the parotid gland", "Anterior to the parotid gland", "Proximal to the stylomastoid foramen", "Within the parotid, involving the zygomatic and buccal branches"], "ans": 0, "why": "In infants the mastoid process is undeveloped, so the facial nerve emerging from the stylomastoid foramen lies unprotected just under the skin and is vulnerable to trauma or forceps.", "wrong": ["", "The nerve enters the parotid posteriorly but is most exposed right at its exit.", "Branches here are more protected by the gland and not the typical site.", "The intratemporal nerve (facial canal) is protected by bone unless there is a fracture.", "Isolated branch injury is not the most common infant site."], "pearl": "Infant: no mastoid process -> CN VII exposed at the stylomastoid foramen.", "set": "face"}, {"id": "G-169", "stem": "A 6-year-old boy has high fever and pain over the parotid gland. A diagnosis of parotitis (mumps) is established. Which of the following nerves is responsible for painful sensations from the region of the parotid gland?", "opts": ["Facial", "Auriculotemporal", "Lesser petrosal", "Lingual", "Chorda tympani"], "ans": 1, "why": "The auriculotemporal nerve (V3) supplies sensation to the parotid gland and its capsule. The tough, nondistensible parotid fascia makes swelling very painful, and the pain may be referred to the ear.", "wrong": ["Passes through the parotid but is motor to facial muscles, not sensory to the gland.", "", "Carries preganglionic parasympathetics (CN IX) to the otic ganglion, not pain.", "Supplies the anterior tongue and floor of mouth.", "Carries taste and submandibular/sublingual secretomotor fibers."], "pearl": "Parotid pain = auriculotemporal (V3); parotid secretomotor = CN IX via otic ganglion.", "set": "face"}, {"id": "G-171", "stem": "A 55-year-old woman presents with swelling in her neck. Ultrasound reveals a thyroid gland tumor. Three days after thyroidectomy, air bubbles are seen on CT of her brain. Which of the following is the most likely cause of the air bubbles?", "opts": ["Injury to inferior thyroid artery", "Injury to inferior and superior thyroid arteries", "Injury to superior thyroid artery and vein", "Injury to superior and middle thyroid veins", "Injury to superior, middle, and inferior thyroid veins"], "ans": 3, "why": "The superior and middle thyroid veins drain into the internal jugular vein. If torn, negative venous pressure can suck in air that then travels up the IJV into the skull (air embolism).", "wrong": ["Arterial injury causes bleeding, not venous air entry.", "Arteries have positive pressure and do not aspirate air.", "The superior thyroid artery would not admit air; only one vein involved.", "", "Inferior thyroid veins drain to the brachiocephalic veins, not the IJV route to the brain."], "pearl": "Superior + middle thyroid veins -> IJV; inferior thyroid veins -> brachiocephalic veins.", "set": "neck"}, {"id": "G-172", "stem": "A 32-year-old man is unconscious after a car crash. During an emergency cricothyroidotomy an artery is accidentally injured. Two days later he develops aspiration pneumonia. Which artery was most likely injured?", "opts": ["Superior thyroid", "Inferior thyroid", "Cricothyroid", "Superior laryngeal", "Suprahyoid"], "ans": 2, "why": "The cricothyroid artery (branch of the superior thyroid) crosses the upper part of the median cricothyroid ligament, the site of cricothyroidotomy. It can bleed into the airway unnoticed, leading to aspiration of blood.", "wrong": ["Its main trunk lies lateral to the incision; only its cricothyroid branch crosses the membrane.", "Supplies the lower thyroid from below; not at the cricothyroid membrane.", "", "Pierces the thyrohyoid membrane above the thyroid cartilage.", "A small branch of the lingual artery above the hyoid."], "pearl": "Cricothyroidotomy through the median cricothyroid ligament risks the cricothyroid artery.", "set": "larynx"}, {"id": "G-173", "stem": "A 22-year-old woman is unconscious after falling over her bicycle handlebars. An emergency tracheotomy is performed. At what tracheal cartilage level is a tracheotomy incision most commonly made?", "opts": ["First to second", "Second to third", "Third to fourth", "Fourth to fifth", "Fifth to sixth"], "ans": 2, "why": "The thyroid isthmus usually overlies the second (to third) tracheal rings, so incising at the third and fourth rings just below it minimizes bleeding and complications.", "wrong": ["Too high; near the cricoid, risking subglottic stenosis.", "Isthmus of the thyroid usually lies here, a vascular obstacle.", "", "Lower; approaching the jugular arch and inferior thyroid veins.", "Too low; nearer the brachiocephalic vessels and thyroidea ima."], "pearl": "Thyroid isthmus sits over tracheal rings 2-3; tracheostomy usually at rings 3-4.", "set": "neck"}, {"id": "G-174", "stem": "A 36-year-old woman has severe head injuries after a car crash. On neurologic examination her palate elevates asymmetrically, being pulled up toward the right. Which of the following muscles is paralyzed?", "opts": ["Left levator veli palatini", "Left tensor veli palatini", "Right levator veli palatini", "Right tensor veli palatini", "Right tensor veli palatini and left levator veli palatini"], "ans": 0, "why": "The levator veli palatini (CN X) elevates the soft palate. With the left one paralyzed, the intact right levator acts unopposed and pulls the palate and uvula toward the right (healthy) side.", "wrong": ["", "Tensor (V3) tenses the palate; its loss does not cause deviated elevation.", "The palate deviates TOWARD the intact side, so the right levator is working.", "Tensor (V3) loss does not produce the asymmetric elevation seen.", "Mixed option; a right-sided levator-intact pattern implicates only the left levator."], "pearl": "Uvula/palate deviates AWAY from the side of the CN X lesion (toward the intact side).", "set": "nasal_oral"}, {"id": "G-177", "stem": "A 32-year-old man presents with nausea, vomiting, and severe headache. MRI reveals an acoustic neuroma. Which of the following nerves is most likely compressed by the tumor?", "opts": ["Facial", "Oculomotor", "Vagus", "Hypoglossal", "Abducens"], "ans": 0, "why": "An acoustic neuroma (vestibular schwannoma) arises on CN VIII in the internal acoustic meatus/cerebellopontine angle, where CN VII runs alongside it, so the facial nerve is the neighboring nerve most often compressed.", "wrong": ["", "Emerges from the midbrain, far above the CPA.", "Exits the jugular foramen, below the CPA; only affected by very large tumors.", "Exits the hypoglossal canal, not near the internal acoustic meatus.", "Runs up the clivus; not typically compressed by a CPA tumor."], "pearl": "CN VII and VIII share the internal acoustic meatus -> acoustic neuroma affects both (then V with growth).", "set": "cn"}, {"id": "G-181", "stem": "A 34-year-old woman presents with a painful eye. Examination reveals a lump in the lower eyelid consisting of debris, and a chalazion is diagnosed. Which of the following structures is most likely blocked?", "opts": ["Lacrimal ducts", "Tarsal glands", "Sclera", "Pupil", "Nasolacrimal duct"], "ans": 1, "why": "A chalazion is a cyst from obstruction of a tarsal (meibomian) gland embedded in the tarsal plate of the eyelid.", "wrong": ["Lacrimal gland swelling presents in the upper lateral lid, not as a chalazion.", "", "Part of the globe wall; not a glandular structure that can be blocked.", "An opening in the iris, not related to eyelid glands.", "Drains the lacrimal sac to the inferior meatus; unrelated to a lid lump."], "pearl": "Chalazion = blocked tarsal (meibomian) gland; stye (hordeolum) = infected gland of eyelash follicle.", "set": "orbit"}, {"id": "G-183", "stem": "A 58-year-old man has progressive unilateral hearing loss and tinnitus for 4 months. MRI reveals a tumor at the cerebellopontine angle. Which of the following nerves is most likely affected?", "opts": ["Vagus", "Hypoglossal", "Vestibulocochlear", "Glossopharyngeal", "Trigeminal"], "ans": 2, "why": "A cerebellopontine angle tumor (usually a vestibular schwannoma) first affects CN VIII, producing hearing loss and tinnitus, and then the adjacent facial nerve.", "wrong": ["Lower cranial nerve at the jugular foramen; would cause dysphagia/hoarseness.", "Would cause tongue deviation, not hearing symptoms.", "", "Would affect gag and posterior tongue sensation.", "Can be affected by large tumors (facial numbness), but not first with hearing loss."], "pearl": "CPA tumor: CN VIII first (hearing loss, tinnitus), then VII, then V.", "set": "cn"}, {"id": "G-184", "stem": "A newborn is delivered with forceps after a difficult delivery. A cephalohematoma from rupture of small periosteal arteries is noted. Between which of the following layers does the blood accumulate?", "opts": ["Between skin and dense connective tissue layer", "Between loose connective tissue layer and galea aponeurotica", "Between galea aponeurotica and pericranium", "Between pericranium and calvaria", "In the subcutaneous layer"], "ans": 3, "why": "A cephalohematoma is bleeding beneath the periosteum, i.e., between the pericranium and the skull bone, so it is limited by suture lines where the pericranium attaches.", "wrong": ["Skin and dense connective tissue are firmly bound; blood doesn't collect here.", "The loose areolar layer lies deep to the galea, not superficial to it.", "This is the subgaleal (loose areolar) space; bleeding here crosses sutures.", "", "Subcutaneous swelling is caput succedaneum-type edema, not periosteal bleeding."], "pearl": "Cephalohematoma: subperiosteal, does not cross sutures; subgaleal bleed crosses sutures.", "set": "face"}, {"id": "G-186", "stem": "A 54-year-old man has severe headaches. CT reveals a tumor occupying a portion of the anterior cranial fossa. Which of the following is responsible for the sensation of headache pain in this case?", "opts": ["Meningeal branches of the maxillary nerve", "Meningeal branches of the mandibular nerve", "Meningeal branches of the ethmoidal nerve", "Tentorial nerve", "C2 and C3 fibers"], "ans": 2, "why": "The dura of the anterior cranial fossa is supplied by meningeal branches of the anterior and posterior ethmoidal nerves (from V1), which carry the pain from a tumor there.", "wrong": ["V2 meningeal branches supply dura of the middle cranial fossa.", "V3 (nervus spinosus) supplies middle fossa dura, not anterior fossa.", "", "V1 branch to the tentorium and posterior falx, not the anterior fossa floor.", "Upper cervical fibers supply posterior cranial fossa dura."], "pearl": "Dura: anterior fossa = V1 (ethmoidal), middle = V2/V3, posterior = C1-C3 & CN X.", "set": "cranial"}, {"id": "G-187", "stem": "A 55-year-old woman with an acute myocardial infarction is given sublingual nitroglycerin. Which of the following structures is most likely the route of absorption of this drug?", "opts": ["Deep lingual vein", "Submandibular duct", "Sublingual duct", "Lingual vein", "Sublingual vein"], "ans": 0, "why": "The deep lingual veins are visible through the thin mucosa on the underside of the tongue, making them the most direct route for rapid absorption of sublingual drugs.", "wrong": ["", "Carries saliva out of the gland; ducts do not absorb drugs.", "Excretory ducts; they secrete, not absorb.", "Lies deeper within the tongue/floor of mouth.", "Lies deeper in the floor of the mouth; less direct than the deep lingual vein."], "pearl": "Sublingual drugs absorb via the thin-walled deep lingual veins on the tongue's underside.", "set": "nasal_oral"}, {"id": "G-188", "stem": "A 35-year-old man with a tumor of the right submandibular gland undergoes removal of the gland and its duct. Which of the following nerves is most prone to injury in this procedure?", "opts": ["Buccal", "Lingual", "Inferior alveolar", "Nerve to mylohyoid", "Glossopharyngeal"], "ans": 1, "why": "The lingual nerve lies just under the floor-of-mouth mucosa and loops around the submandibular duct (lateral, then under, then medial), with the submandibular ganglion hanging from it, so it is at risk during gland/duct excision.", "wrong": ["Supplies cheek mucosa/skin, away from the gland and duct.", "", "Enters the mandibular foramen to supply lower teeth; not in the surgical field.", "Runs on the superficial surface of mylohyoid but is less closely related to the duct.", "Lies deep in the pharynx region, not near the submandibular duct."], "pearl": "Lingual nerve 'double-crosses' the submandibular duct -> at risk in gland/duct surgery.", "set": "nasal_oral"}, {"id": "G-189", "stem": "A 22-year-old man has a sinus infection involving the posterior ethmoidal cells and complains of progressive loss of vision. Which of the following structures is most likely affected?", "opts": ["Ophthalmic artery", "Nasociliary nerve", "Anterior ethmoidal nerve", "Trochlear nerve", "Abducens nerve"], "ans": 0, "why": "The ophthalmic artery gives rise to the central retinal artery, an end artery. Spread of posterior ethmoidal infection near the orbital apex compromising this blood supply leads to loss of vision.", "wrong": ["", "Sensory to the eye (corneal reflex afferent); no role in vision.", "Sensory to the anterior ethmoid cells and nose; no role in vision.", "Motor to superior oblique; affects movement, not vision.", "Motor to lateral rectus; affects abduction, not vision."], "pearl": "Ophthalmic a. -> central retinal a. (end artery): compromise = vision loss.", "set": "orbit"}, {"id": "G-190", "stem": "A 55-year-old farmer falls from a hayloft. Radiographs reveal a small depressed fracture of the skull vertex and thrombosis of the superior sagittal sinus. A day later he loses consciousness. What is the most likely cause?", "opts": ["Obstruction of CSF resorption", "Obstruction of the cerebral aqueduct (of Sylvius)", "Laceration of the middle meningeal artery", "Fracture of the cribriform plate with CSF rhinorrhea", "Aneurysm of the middle cerebral artery"], "ans": 0, "why": "CSF is returned to the venous blood through arachnoid granulations that project into the superior sagittal sinus. Sinus thrombosis blocks this resorption, raising intracranial pressure (communicating hydrocephalus).", "wrong": ["", "Not a relevant structure here; the vertex fracture affects the sinus, not ventricular channels.", "Middle meningeal artery runs at the pterion, not the vertex.", "Cribriform plate is in the anterior fossa floor, not the vertex.", "No evidence of aneurysm; the problem is sinus thrombosis."], "pearl": "Arachnoid granulations drain CSF into the superior sagittal sinus.", "set": "cranial"}, {"id": "G-191", "stem": "An 11-year-old boy has recurrent palatine tonsillitis. Which of the following lymph nodes is most likely to first become visibly enlarged?", "opts": ["Submandibular", "Parotid", "Jugulodigastric", "Submental", "Preauricular"], "ans": 2, "why": "The jugulodigastric (tonsillar) node of the superior deep cervical chain, located where the posterior digastric crosses the IJV, receives lymph from the palatine tonsil and enlarges in tonsillitis.", "wrong": ["Drains lateral face, lips, and anterior tongue.", "Drains the scalp, eyelids, and external ear region.", "", "Drains the tongue tip, chin, and central lower lip.", "Drains the lateral eyelids and anterior ear region."], "pearl": "Tonsil -> jugulodigastric node (below angle of mandible).", "set": "neck"}, {"id": "G-193", "stem": "A 45-year-old woman has dysphagia, nighttime coughing, repeated chest infections, and a palpable neck swelling. Imaging reveals a persistent pharyngeal pouch (diverticulum). Between which muscles is this pouch most likely located?", "opts": ["Between styloglossus and stylopharyngeus", "Between palatoglossal arch and median glossoepiglottic fold", "Between upper and middle pharyngeal constrictors", "Between the cricopharyngeal and thyropharyngeal portions of the inferior pharyngeal constrictor", "Between the middle and inferior pharyngeal constrictors"], "ans": 3, "why": "A Zenker diverticulum herniates through Killian's triangle, the weak area between the thyropharyngeus and cricopharyngeus parts of the inferior constrictor.", "wrong": ["Not a gap in the pharyngeal wall where diverticula form.", "These are oral/oropharyngeal landmarks, not a muscular weak area.", "This gap transmits stylopharyngeus/CN IX; not the Zenker site.", "", "This gap transmits the internal laryngeal nerve; not the usual pouch site."], "pearl": "Zenker = Killian's triangle between thyropharyngeus and cricopharyngeus -> halitosis, regurgitation.", "set": "nasal_oral"}, {"id": "G-194", "stem": "A 5-year-old boy falls from a tree and is unconscious. During an emergency tracheostomy, profuse dark venous bleeding suddenly occurs from the midline incision over the trachea. Which vessel was most likely cut?", "opts": ["Superior thyroid vein", "Inferior thyroid vein", "Left brachiocephalic vein", "Middle thyroid vein", "Jugular arch connecting the anterior jugular veins"], "ans": 2, "why": "The left brachiocephalic vein crosses anterior to the trachea from left to right to form the SVC; in children it can project above the manubrium into the low midline neck, so a low tracheostomy can tear it.", "wrong": ["Drains upward and laterally to the IJV, above and lateral to the incision.", "Descends on the trachea but is smaller; profuse bleeding favors the brachiocephalic vein.", "", "Runs laterally to the IJV, away from the midline incision.", "Superficial and small; not usually a source of major bleeding."], "pearl": "Children: left brachiocephalic vein may rise above the jugular notch -> risk in low tracheostomy.", "set": "neck"}, {"id": "G-195", "stem": "A 55-year-old woman has unilateral neck pain, sore throat, and ear pain. Imaging shows Eagle syndrome, with an elongated, calcified styloid process and stylohyoid ligament. Which nerve is most likely affected?", "opts": ["Vagus", "Facial", "Glossopharyngeal", "Hypoglossal", "Vestibulocochlear"], "ans": 2, "why": "CN IX winds around stylopharyngeus and passes near the stylohyoid ligament to enter the oropharynx, so an elongated calcified styloid/ligament irritates it, causing throat and referred ear pain.", "wrong": ["Lies within the carotid sheath, not directly against the stylohyoid ligament.", "Exits the stylomastoid foramen and enters the parotid, not the pharynx region.", "", "Passes lateral to the carotids lower in the neck; not the classic Eagle nerve.", "Confined to the internal acoustic meatus and inner ear."], "pearl": "Eagle syndrome: long styloid irritates CN IX -> throat pain, dysphagia, otalgia.", "set": "cn"}, {"id": "G-196", "stem": "A 62-year-old man complains of spontaneous lacrimation during eating (crocodile tears). Which of the following nerve lesions caused this condition?", "opts": ["Facial nerve proximal to the geniculate ganglion", "Greater petrosal nerve", "Lesser petrosal nerve", "Lacrimal nerve", "Chorda tympani"], "ans": 0, "why": "After a CN VII lesion proximal to the geniculate ganglion, regenerating salivary secretomotor fibers are misdirected into the greater petrosal nerve, so stimuli for salivation trigger tearing via the pterygopalatine ganglion.", "wrong": ["", "A lesion here would abolish lacrimation rather than cause gustatory tearing.", "Carries CN IX fibers to the parotid; misrouting causes Frey syndrome (sweating).", "Carries postganglionic fibers only; a lesion causes dry eye, not aberrant tearing.", "Arises distal to the geniculate ganglion; lesion affects taste and submandibular secretion."], "pearl": "Crocodile tears = aberrant regeneration of CN VII proximal to the geniculate ganglion.", "set": "cn"}, {"id": "G-198", "stem": "A 22-year-old woman has a 2-week sinus infection with focal inflammation and mucosal edema in the inferior nasal meatus. Drainage from which structure is most likely obstructed?", "opts": ["Anterior ethmoidal air cells", "Frontonasal duct", "Maxillary sinus", "Middle ethmoidal air cells", "Nasolacrimal duct"], "ans": 4, "why": "The nasolacrimal duct is the only structure that opens into the inferior meatus, so edema there blocks tear drainage.", "wrong": ["Open into the middle meatus (ethmoidal infundibulum).", "Opens into the middle meatus via the ethmoidal infundibulum.", "Opens into the middle meatus via the hiatus semilunaris.", "Open onto the ethmoidal bulla in the middle meatus.", ""], "pearl": "Inferior meatus receives ONLY the nasolacrimal duct.", "set": "nasal_oral"}, {"id": "G-199", "stem": "A 40-year-old woman sustains a temporal bone fracture causing a facial nerve lesion proximal to the origin of the chorda tympani in the posterior wall of the tympanic cavity. Which function would most likely remain intact?", "opts": ["Control of muscles in lower half of face", "Control of secretions by submandibular gland", "Taste sensation from anterior two thirds of tongue", "Tear production by the lacrimal gland", "Voluntary closure of the eyelid"], "ans": 3, "why": "The greater petrosal nerve (lacrimal secretomotor) leaves CN VII at the geniculate ganglion, proximal to this lesion, so tearing is spared; everything distal (facial muscles, chorda tympani functions) is lost.", "wrong": ["Motor branches exit the stylomastoid foramen distal to the lesion and are lost.", "Chorda tympani fibers are distal to the lesion and are lost.", "Chorda tympani taste fibers are distal to the lesion and are lost.", "", "Orbicularis oculi is supplied by motor branches distal to the lesion."], "pearl": "Localize CN VII lesions by branch order: greater petrosal -> stapedius -> chorda tympani -> motor branches.", "set": "cn"}, {"id": "G-200", "stem": "Cardiac pain is sometimes referred to the mandible and the region of the temporomandibular joint. Cutaneous sensation over the angle of the mandible is normally supplied by which nerve?", "opts": ["Cervical branch of facial", "Great auricular nerve", "Mandibular branch of trigeminal nerve", "Mandibular branch of facial nerve", "Transverse cervical nerve"], "ans": 1, "why": "The great auricular nerve (C2-C3, cervical plexus) supplies skin over the angle of the mandible, the parotid region, and the ear up toward the TMJ, an area not covered by V3.", "wrong": ["Motor to platysma; facial nerve branches carry no skin sensation.", "", "V3 supplies most of the lower face but spares the angle of the mandible.", "Motor to lower lip muscles; not cutaneous.", "Supplies skin of the anterior neck, below the mandible."], "pearl": "Angle of the mandible = great auricular nerve (C2-C3), not trigeminal.", "set": "neck"}, {"id": "G-201", "stem": "A 72-year-old man with a malignant tumor of the cecum has enlarged cervical lymph nodes. Which lymph node of the neck is most frequently associated with malignant tumors of the gastrointestinal tract?", "opts": ["Left inferior deep cervical", "Left supraclavicular", "Right inferior deep cervical", "Right supraclavicular", "Jugulodigastric"], "ans": 1, "why": "The thoracic duct drains the body below the diaphragm (including the GI tract) and ends near the left venous angle; metastases traveling in it enlarge the left supraclavicular (Virchow) node.", "wrong": ["Drains head and neck lymph; not the classic GI sentinel node.", "", "Right side drains to the right lymphatic duct, not the thoracic duct.", "Right supraclavicular nodes drain the right thorax, not the abdomen.", "Drains tonsils and pharynx."], "pearl": "Virchow node (left supraclavicular) = abdominal malignancy via thoracic duct.", "set": "neck"}, {"id": "G-202", "stem": "A 60-year-old man has a benign tumor in the piriform recess. The mucosa of the piriform recess must be anesthetized during removal. Which nerve supplies general sensation to the laryngeal vestibule and piriform recesses?", "opts": ["External laryngeal", "Glossopharyngeal", "Hypoglossal", "Inferior laryngeal", "Internal laryngeal"], "ans": 4, "why": "The internal branch of the superior laryngeal nerve pierces the thyrohyoid membrane and runs under the piriform recess mucosa, supplying the larynx above the vocal folds and the piriform recess.", "wrong": ["Motor to cricothyroid; not sensory to the mucosa.", "Supplies posterior tongue and oropharynx, not the piriform recess.", "Purely motor to tongue muscles.", "Sensory to mucosa below the vocal folds.", ""], "pearl": "Above vocal folds + piriform recess = internal laryngeal; below = recurrent/inferior laryngeal.", "set": "larynx"}, {"id": "G-203", "stem": "Hikers discover the body of a man in his 20s. Postmortem examination shows no penetrating wounds. A radiograph shows a fractured hyoid bone, with the calvaria and other bones intact. What is the most likely cause of death?", "opts": ["Myocardial infarction (heart attack)", "A fall from a height that resulted in fatal internal bleeding", "Subdural hematoma", "Strangulation", "Ingestion of a poisonous substance"], "ans": 3, "why": "The hyoid is protected and rarely broken except by direct compression of the neck; an isolated hyoid fracture strongly suggests strangulation.", "wrong": ["Would not fracture the hyoid.", "A fatal fall would usually fracture other bones as well.", "Usually from head trauma, often with skull fractures; doesn't explain hyoid fracture.", "", "Would not cause a hyoid fracture."], "pearl": "Fractured hyoid bone = strangulation until proven otherwise.", "set": "neck"}, {"id": "G-214", "stem": "A neonate has bilateral swellings on both sides of the head. The swellings do not cross suture lines, transillumination of the skull is normal, and the neurologic exam is normal. What is most likely responsible?", "opts": ["Intracranial bleeding", "Blockage of the interventricular foramen", "Failure of cleavage of the prosencephalon", "Collection of blood beneath the periosteum of the bone", "Collection of edema fluid above the periosteum of the bone"], "ans": 3, "why": "A cephalohematoma is subperiosteal bleeding; because the pericranium is anchored at the sutures, the swelling is confined to one bone and does not cross suture lines.", "wrong": ["Neurologic exam is normal and swelling is external.", "Would cause hydrocephalus, not scalp swelling.", "Holoprosencephaly; a brain malformation with neurologic findings.", "", "Caput succedaneum; edema crosses suture lines."], "pearl": "Cephalohematoma respects sutures; caput succedaneum and subgaleal hemorrhage cross them.", "set": "face"}, {"id": "G-222", "stem": "A severe mandibular fracture in a 22-year-old woman requires surgical reconstruction. Postoperatively she has numbness of the lower lip and chin. Which nerve was most likely injured?", "opts": ["Auriculotemporal", "Buccal", "Lesser petrosal", "Mental", "Infraorbital"], "ans": 3, "why": "The mental nerve, the terminal branch of the inferior alveolar nerve (V3), exits the mental foramen to supply the skin and mucosa of the lower lip and chin.", "wrong": ["Supplies skin of the temple, auricle, and TMJ/parotid.", "Supplies cheek skin and buccal mucosa.", "Carries CN IX parasympathetics to the otic ganglion; no skin sensation.", "", "V2 branch supplying the lower eyelid, cheek, and upper lip."], "pearl": "Lower lip + chin numbness = mental nerve (from inferior alveolar, V3).", "set": "face"}, {"id": "G-223", "stem": "A 22-year-old man undergoes surgery for multiple facial fractures and afterward cannot taste on the tip of his tongue. Which ganglion contains the neuron cell bodies of taste fibers from this part of the tongue?", "opts": ["Trigeminal", "Geniculate", "Inferior glossopharyngeal", "Submandibular ganglion", "Pterygopalatine"], "ans": 1, "why": "Taste from the anterior two-thirds of the tongue travels in the chorda tympani (CN VII), whose sensory cell bodies are in the geniculate ganglion.", "wrong": ["Holds cell bodies of general sensation (lingual nerve), not taste.", "", "Holds cell bodies for posterior-third taste (CN IX).", "Parasympathetic ganglion; contains postganglionic motor neurons, not sensory ones.", "Parasympathetic ganglion for lacrimal/nasal glands."], "pearl": "Anterior 2/3 taste: chorda tympani -> geniculate ganglion; general sensation: lingual -> trigeminal ganglion.", "set": "cn"}, {"id": "G-224", "stem": "A 21-year-old man has an intracranial abscess compressing the ophthalmic division of the trigeminal nerve. Which of the following would be a plausible complaint?", "opts": ["Pain in the hard palate", "Anesthesia of the upper lip", "Painful eyeball", "Pain over the lower eyelid", "Tingling sensation over the buccal region of the face"], "ans": 2, "why": "V1 carries sensation from the eyeball, conjunctiva, and orbital contents (via nasociliary/ciliary nerves), so irritation of V1 can produce eye pain.", "wrong": ["Hard palate is supplied by V2 (greater palatine/nasopalatine).", "Upper lip is V2 (infraorbital).", "", "Lower eyelid is V2 (infraorbital).", "Buccal skin is V3 (buccal nerve) and V2."], "pearl": "V1 = eyeball, upper lid, forehead, nasal dorsum; V2 = lower lid, cheek, upper lip, palate.", "set": "cn"}, {"id": "G-225", "stem": "A 72-year-old man has difficulty eating. MRI shows a brainstem tumor affecting the contents of the hypoglossal canal. Which muscle would be affected?", "opts": ["Geniohyoid", "Mylohyoid", "Palatoglossus", "Genioglossus", "Stylohyoid"], "ans": 3, "why": "CN XII passes through the hypoglossal canal and supplies all intrinsic and extrinsic tongue muscles except palatoglossus, including genioglossus.", "wrong": ["Supplied by C1 fibers that only travel with CN XII, not by CN XII itself.", "Supplied by the nerve to mylohyoid (V3).", "Supplied by the vagus (pharyngeal plexus).", "", "Supplied by the facial nerve."], "pearl": "CN XII lesion: tongue deviates TOWARD the lesion (unopposed contralateral genioglossus).", "set": "nasal_oral"}, {"id": "G-227", "stem": "A 23-year-old right-handed baseball pitcher has hypertrophied right scalene muscles on CT, and thoracic outlet syndrome is diagnosed. Which symptom is consistent with this diagnosis?", "opts": ["Problems with respiration because of pressure on the phrenic nerve", "Reduced blood flow to the thoracic wall", "Reduced venous return from the head and neck", "Numbness in the upper extremity", "Distension of the internal jugular vein"], "ans": 3, "why": "The brachial plexus trunks and subclavian artery pass through the interscalene gap between anterior and middle scalenes; hypertrophy compresses them, producing upper limb numbness, tingling, weakness, and coldness.", "wrong": ["The phrenic nerve lies on the anterior surface of anterior scalene, not in the gap.", "Thoracic wall supply is not the typical target of this compression.", "Head and neck veins do not pass through the scalene gap.", "", "The IJV is not compressed by scalene hypertrophy."], "pearl": "Scalene triangle transmits brachial plexus + subclavian artery (vein passes anterior to anterior scalene).", "set": "neck"}, {"id": "G-228", "stem": "After thyroidectomy, a 29-year-old woman develops a neck hematoma. Examination shows partial ptosis and pupillary constriction on the side of the hematoma. The hematoma is most likely compressing which ganglion?", "opts": ["Submandibular", "Trigeminal", "Superior cervical", "Geniculate", "Ciliary"], "ans": 2, "why": "The superior cervical ganglion, posterior to the carotid sheath, supplies sympathetics to the head, including the dilator pupillae and superior tarsal muscle; compression gives Horner syndrome (partial ptosis, miosis).", "wrong": ["Parasympathetic ganglion for the submandibular and sublingual glands.", "Sensory ganglion for the face; no pupil or lid effect.", "", "Sensory (taste) ganglion of CN VII.", "Parasympathetic; its loss would dilate, not constrict, the pupil."], "pearl": "Horner: partial ptosis (superior tarsal), miosis, anhidrosis -> sympathetic chain/superior cervical ganglion.", "set": "neck"}, {"id": "G-229", "stem": "A 26-year-old man suffers a midface injury. Examination reveals intact taste and salivation but no general sensation from his anterior tongue. Which nerve was probably injured?", "opts": ["Lingual proximal to its junction with the chorda tympani", "Chorda tympani", "Inferior alveolar", "Lingual distal to its junction with the chorda tympani", "Glossopharyngeal"], "ans": 0, "why": "Above its junction with the chorda tympani the lingual nerve carries only V3 general sensation. A lesion there removes touch sensation but spares taste and salivary fibers, which join below.", "wrong": ["", "Would lose taste and submandibular/sublingual secretion.", "Supplies the lower teeth and chin, not the tongue.", "Would lose taste and salivary fibers as well as sensation.", "Supplies the posterior third, not the anterior tongue."], "pearl": "Lingual nerve proximal to chorda junction = pure V3 sensation; distal = sensation + taste + secretomotor.", "set": "nasal_oral"}, {"id": "G-230", "stem": "An 82-year-old man with a posterior cranial fossa tumor shows perineural spread along nervous tissue at the jugular foramen. Which deficit would you expect?", "opts": ["Loss of tongue movements", "Loss of facial expression", "Loss of sensation from the face and the scalp", "Loss of hearing", "Loss of gag reflex"], "ans": 4, "why": "The jugular foramen transmits CN IX, X, and XI. The gag reflex uses CN IX (afferent) and CN X (efferent), so involvement there abolishes it.", "wrong": ["Tongue is CN XII, which exits the hypoglossal canal.", "Facial expression is CN VII (internal acoustic meatus/stylomastoid foramen).", "Face and scalp sensation is CN V (and cervical nerves).", "Hearing is CN VIII (internal acoustic meatus).", ""], "pearl": "Jugular foramen syndrome (Vernet): CN IX, X, XI deficits -> lost gag, hoarseness, weak SCM/trapezius.", "set": "cn"}, {"id": "G-231", "stem": "A soccer goalkeeper strikes his head on the goal post, is confused for several minutes, then resumes playing. Four hours later he is found unconscious. CT shows a hemorrhage consistent with an epidural hematoma. The ruptured vessel enters the skull through which opening?", "opts": ["Foramen spinosum", "Foramen ovale", "Jugular foramen", "Hypoglossal canal", "Foramen lacerum"], "ans": 0, "why": "A lucid interval after head trauma suggests an epidural hematoma from a torn middle meningeal artery, which enters the skull through the foramen spinosum and runs deep to the pterion.", "wrong": ["", "Transmits V3 and the lesser petrosal nerve (plus accessory meningeal artery).", "Transmits CN IX-XI and the IJV.", "Transmits CN XII.", "Filled with cartilage in life; the ICA passes across its upper aspect."], "pearl": "Epidural hematoma = middle meningeal artery (foramen spinosum), lucid interval, biconvex lens.", "set": "cranial"}, {"id": "G-232", "stem": "A 55-year-old woman is found unconscious and brought to the hospital with findings suggesting a ruptured aneurysm. Examination of the right eye shows ptosis, a dilated pupil, and the eye deviated inferolaterally. Angiography most likely shows a hematoma compressing which structure?", "opts": ["Oculomotor nerve", "Optic nerve", "Facial nerve", "Ciliary ganglion", "Superior cervical ganglion"], "ans": 0, "why": "CN III supplies levator palpebrae, most extraocular muscles, and parasympathetics to the sphincter pupillae. Its compression leaves the lateral rectus and superior oblique unopposed (down and out), removes lid elevation (ptosis), and leaves the dilator pupillae unopposed (mydriasis).", "wrong": ["", "CN II lesion causes visual loss, not ptosis or a down-and-out eye.", "CN VII paralyzes facial muscles; it would cause inability to close the eye, not ptosis.", "Ciliary ganglion lesion gives a dilated pupil but no ptosis or eye deviation.", "Sympathetic lesion gives mild ptosis with a constricted pupil (Horner)."], "pearl": "Down and out + ptosis + blown pupil = CN III compression (think PComm/aneurysm or uncal herniation).", "set": "cn"}, {"id": "G-233", "stem": "A 20-year-old construction worker has an occipital scalp laceration that is closed. Three days later he has a tender, red, infected wound that has spread anteriorly across the scalp. Between which layers of the scalp has the infection spread?", "opts": ["The periosteum and bone", "The aponeurosis and the periosteum", "The dense connective tissue and the aponeurosis", "The dense connective tissue and the skin", "The dermis and the epidermis"], "ans": 1, "why": "The loose areolar tissue (layer 4) lies between the epicranial aponeurosis and the pericranium; it lets pus and blood spread freely across the scalp. It is the 'danger layer' because emissary veins crossing it can carry infection intracranially.", "wrong": ["Pericranium is tightly bound to bone, especially at sutures; spread here is limited.", "", "Dense connective tissue is fused to the aponeurosis; no potential space.", "Skin and dense connective tissue are tightly bound as a unit.", "Epidermis and dermis are not a separable space for spreading infection."], "pearl": "SCALP: layer 4 (Loose areolar tissue) = danger layer; emissary veins link it to dural sinuses.", "set": "face"}, {"id": "G-234", "stem": "A 73-year-old patient has neck pain, hoarseness, and weight loss for 6 months. Laryngoscopy shows a large tumor on one of the true vocal folds, and the specialist cannot pass the scope through the opening between the folds. What is this opening called?", "opts": ["Piriform recess", "Vestibule", "Ventricle", "Vallecula", "Rima glottidis"], "ans": 4, "why": "The rima glottidis is the aperture between the two true vocal folds (and arytenoids). Its width is adjusted by intrinsic laryngeal muscles and it is the narrowest part of the adult laryngeal airway.", "wrong": ["Piriform recess is a pharyngeal gutter lateral to the aryepiglottic fold, outside the larynx.", "Laryngeal vestibule lies above the vestibular (false) folds, not between true folds.", "Laryngeal ventricle is the recess between the false and true folds.", "Vallecula is the depression between the tongue base and epiglottis.", ""], "pearl": "Rima glottidis = space between true vocal folds; rima vestibuli = between false folds.", "set": "larynx"}, {"id": "G-235", "stem": "An 82-year-old man has a neck mass. Flexible laryngoscopy shows a tumor in the piriform recess. When taking a biopsy, the physician must avoid injuring which nerve?", "opts": ["Mandibular", "Maxillary", "Glossopharyngeal", "Internal laryngeal", "Hypoglossal"], "ans": 3, "why": "The internal laryngeal nerve runs just beneath the mucosa of the piriform recess. It carries sensation from the larynx above the vocal folds, so injury abolishes that sensation and the protective cough reflex.", "wrong": ["V3 supplies the lower face and mastication muscles, not the piriform recess.", "V2 supplies the midface, palate, and nasal cavity, not the laryngopharynx.", "CN IX supplies the oropharynx and posterior tongue, not the piriform recess floor.", "", "CN XII is motor to the tongue and lies higher, not under piriform mucosa."], "pearl": "Fish bone in the piriform recess can injure the internal laryngeal n. -> loss of supraglottic sensation/cough reflex.", "set": "larynx"}, {"id": "G-237", "stem": "A comatose head-trauma patient is examined. A light shined into the right eye causes that pupil to constrict. This confirms that which two nerves are intact?", "opts": ["Optic and facial", "Optic and oculomotor", "Maxillary and facial", "Ophthalmic and oculomotor", "Ophthalmic and facial"], "ans": 1, "why": "In the pupillary light reflex, CN II carries the afferent light signal and CN III carries parasympathetic efferents (Edinger-Westphal -> ciliary ganglion -> short ciliary nerves) to the sphincter pupillae.", "wrong": ["Facial nerve is the efferent limb of the corneal (blink) reflex, not the pupillary reflex.", "", "Neither V2 nor VII participates in the light reflex.", "V1 is the corneal reflex afferent; light is sensed by CN II.", "V1 + VII is the corneal reflex pair."], "pearl": "Light reflex: II in, III out. Corneal reflex: V1 in, VII out.", "set": "orbit"}, {"id": "G-238", "stem": "A 27-year-old unconscious woman has a right pupil that is dilated and unresponsive to light. CT shows a large aneurysm of the superior cerebellar artery just after its origin from the basilar artery, compressing the nerve responsible. Which nerve is compressed?", "opts": ["Oculomotor", "Trigeminal", "Facial", "Vagus", "Abducens"], "ans": 0, "why": "CN III emerges between the posterior cerebral and superior cerebellar arteries, so an SCA aneurysm can compress it. Its superficial parasympathetic fibers are affected first, producing a fixed dilated pupil.", "wrong": ["", "CN V does not control the pupil.", "CN VII does not control the pupil.", "CN X has no role in the pupillary reflex.", "CN VI moves the eye laterally; it has no pupillary fibers."], "pearl": "CN III passes between PCA and SCA; compression -> fixed dilated pupil first (parasympathetics are peripheral).", "set": "cn"}, {"id": "G-239", "stem": "An 88-year-old man cannot abduct his right eye and has an absent corneal reflex on the same side. A growth at which skull opening could explain both findings?", "opts": ["Inferior orbital fissure", "Optic canal", "Superior orbital fissure", "Foramen rotundum", "Foramen ovale"], "ans": 2, "why": "The superior orbital fissure transmits CN VI (lateral rectus) and branches of V1, including the nasociliary nerve that carries corneal sensation (afferent limb of the corneal reflex). A lesion there explains both deficits.", "wrong": ["Transmits the zygomatic nerve (V2) and infraorbital vessels, not CN VI or V1.", "Carries CN II and the ophthalmic artery only.", "", "Carries V2, which does not supply the cornea or lateral rectus.", "Carries V3, unrelated to abduction or corneal sensation."], "pearl": "SOF: CN III, IV, V1 (lacrimal, frontal, nasociliary), VI, superior ophthalmic vein.", "set": "cranial"}, {"id": "G-240", "stem": "A 72-year-old woman has herpes zoster oticus. She says she must hold the phone away from her ear because sounds seem too loud. Which cranial nerve's involvement causes this hyperacusis?", "opts": ["Hypoglossal", "Facial", "Spinal accessory", "Vagus", "Glossopharyngeal"], "ans": 1, "why": "Reactivated varicella in the geniculate ganglion (Ramsay Hunt) affects CN VII, including the nerve to stapedius. Without stapedius damping of the stapes, sounds are perceived as abnormally loud.", "wrong": ["CN XII is motor to the tongue only.", "", "CN XI supplies SCM and trapezius.", "CN X supplies pharynx/larynx; no middle-ear muscle.", "CN IX supplies stylopharyngeus and tympanic plexus sensation, not stapedius."], "pearl": "Hyperacusis = CN VII lesion proximal to the nerve to stapedius (Bell palsy, Ramsay Hunt).", "set": "cn"}, {"id": "G-241", "stem": "A 70-year-old man has cerumen removed from his external auditory meatus. During the procedure he begins to cough. Stimulation of an area innervated by which nerve causes the cough?", "opts": ["Vestibulocochlear", "Vagus", "Trigeminal", "Facial", "Accessory"], "ans": 1, "why": "The auricular branch of the vagus (Arnold nerve) supplies part of the external acoustic meatus. Because CN X is also the afferent limb of the cough reflex, stimulating the canal can trigger coughing.", "wrong": ["CN VIII carries hearing and balance, not canal skin sensation.", "", "Auriculotemporal (V3) supplies the canal but does not trigger cough.", "CN VII contributes small canal sensation but plays no role in the cough reflex.", "CN XI is purely motor to SCM and trapezius."], "pearl": "Arnold nerve (auricular br. of X): ear canal stimulation -> cough or vasovagal syncope.", "set": "cn"}, {"id": "G-242", "stem": "A 30-year-old woman had a total thyroidectomy for a cancerous nodule. Three weeks later she has persistent hoarseness. Which nerve was most likely injured during surgery?", "opts": ["Internal laryngeal", "External laryngeal", "Recurrent laryngeal", "Superior laryngeal", "Glossopharyngeal"], "ans": 2, "why": "The recurrent laryngeal nerve ascends in the tracheoesophageal groove directly behind the thyroid and supplies all intrinsic laryngeal muscles except cricothyroid. Injury paralyzes the vocal fold, causing hoarseness.", "wrong": ["Internal laryngeal is sensory above the folds; injury causes numbness, not hoarseness.", "External laryngeal injury gives a weak, monotone voice with poor pitch, not true hoarseness.", "", "Superior laryngeal injury causes supraglottic anesthesia and loss of pitch control.", "CN IX is not at risk in thyroid surgery and does not supply laryngeal muscles."], "pearl": "RLN: tracheoesophageal groove, near inferior thyroid a.; injury -> hoarseness (bilateral -> stridor).", "set": "neck"}, {"id": "G-243", "stem": "An 82-year-old man is noted to have unequal pupils. Which test would help determine which eye is abnormal and whether the problem is a sympathetic or an oculomotor lesion?", "opts": ["Startle reflex", "Blink reflex", "Pupillary light reflex", "H-test", "Vision test (reading chart)"], "ans": 2, "why": "Testing direct and consensual responses to light shows which pupil fails to constrict (CN III efferent) versus a small pupil that reacts but fails to dilate (sympathetic lesion).", "wrong": ["Startle is an acoustic reflex, not a pupil test.", "Blink (corneal) reflex tests V1 and VII.", "", "H-test assesses extraocular muscles, not pupil size.", "Visual acuity tests the optic pathway, not pupillary innervation."], "pearl": "Anisocoria worse in light = parasympathetic (CN III) problem; worse in dark = sympathetic (Horner).", "set": "orbit"}, {"id": "G-244", "stem": "A 22-year-old baseball player is hit in the eye. He moves the eye normally and sees distant objects, but cannot focus on near objects. Injury to which nerve structures most likely explains this?", "opts": ["Trochlear nerve and abducens nerve", "Oculomotor nerve and abducens nerve", "Superior cervical ganglion and long ciliary nerves", "Short ciliary nerves and ciliary ganglion", "Infratrochlear nerve and ciliary ganglion"], "ans": 3, "why": "Accommodation needs parasympathetic input to the ciliary muscle and sphincter pupillae via the ciliary ganglion and short ciliary nerves. Since eye movements are normal, the lesion is in this parasympathetic pathway rather than the motor nerves.", "wrong": ["IV and VI injury would impair eye movement, which is normal here.", "Eye movements are intact, so CN III/VI trunks are not the issue.", "Sympathetic fibers dilate the pupil; they do not mediate accommodation.", "", "Infratrochlear is a sensory V1 branch with no role in accommodation."], "pearl": "Near focus = ciliary muscle contraction via CN III -> ciliary ganglion -> short ciliary nerves.", "set": "orbit"}, {"id": "G-245", "stem": "Herpetic lesions of the forehead need prompt treatment because infection can reach the cavernous sinus. Which venous structure is the most likely route of spread to the cavernous sinus?", "opts": ["Pterygoid venous plexus", "Ophthalmic vein", "Superior petrosal sinus", "Basilar venous plexus", "Parietal emissary vein"], "ans": 1, "why": "Forehead veins (supratrochlear and supraorbital) form the angular vein, which connects to the superior ophthalmic vein; this valveless vein drains directly into the cavernous sinus.", "wrong": ["The pterygoid plexus links the deep face to the sinus but does not drain the forehead.", "", "The superior petrosal sinus drains the cavernous sinus toward the transverse sinus.", "The basilar plexus lies over the clivus, joining the inferior petrosal sinuses.", "Parietal emissary veins connect scalp veins to the superior sagittal sinus."], "pearl": "Danger triangle: facial/angular v. -> superior ophthalmic v. -> cavernous sinus thrombosis.", "set": "cranial"}, {"id": "G-246", "stem": "An 87-year-old woman has a vestibular schwannoma removed from the internal acoustic meatus. Afterwards the right corner of her mouth droops, she cannot close her right eye, and food collects in her right oral vestibule. Which cranial nerve was injured?", "opts": ["IX", "X", "VII", "V2", "V3"], "ans": 2, "why": "CN VII travels with CN VIII through the internal acoustic meatus and supplies the muscles of facial expression, including orbicularis oculi (eye closure) and buccinator (keeps food out of the vestibule).",
