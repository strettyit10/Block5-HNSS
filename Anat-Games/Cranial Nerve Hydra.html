icial temporal artery", "Middle meningeal artery", "Superior cerebral veins", "Cerebral arterial circle (of Willis)", "Middle cerebral artery (MCA)"], "ans": 1, "why": "A blow to the side of the head at the pterion can tear the middle meningeal artery, producing an epidural hematoma that appears biconvex because it is limited by the sutures where dura is attached.", "wrong": ["Lies outside the skull in the scalp; causes a scalp hematoma, not intracranial bleeding", "", "Bridging-vein tears cause a crescent-shaped subdural hematoma", "Aneurysm rupture causes subarachnoid hemorrhage, not a biconvex collection", "Bleeding is intracerebral or subarachnoid, not extradural"], "pearl": "Epidural = middle meningeal a. at pterion, biconvex, lucid interval.", "set": "cranial"}, {"id": "LH-12", "stem": "A newborn exhibits labored, gasping breaths and unusual vocal tones when crying. Examination reveals malformed vocal folds due to displaced attachments of the vocal ligaments. Which of the following structures is most likely defective?", "opts": ["Arytenoid cartilages", "Cricoid cartilage", "Epiglottic cartilage", "Corniculate cartilages", "Cuneiform cartilages"], "ans": 0, "why": "Each vocal ligament runs from the inner surface of the thyroid cartilage anteriorly to the vocal process of the arytenoid cartilage posteriorly. Arytenoid movements set vocal fold position and tension, so malformed arytenoids displace the ligament attachments.", "wrong": ["", "Unpaired ring articulating with thyroid and arytenoids; vocal ligaments do not attach to it", "Leaf-shaped cartilage that covers the laryngeal inlet; no vocal ligament attachment", "Small cartilages on the arytenoid apices within the aryepiglottic folds", "Small cartilages within the aryepiglottic folds; not vocal ligament attachments"], "pearl": "Vocal ligament: thyroid cartilage (anterior) -> vocal process of arytenoid (posterior).", "set": "larynx"}, {"id": "LH-13", "stem": "A baby girl presents with a disproportionately wide skull with a short occipitofrontal (front-to-back) diameter. What cranial suture most likely closed prematurely to result in this deformity?", "opts": ["Sphenosquamous", "Sphenoparietal", "Lambdoid", "Coronal", "Sagittal"], "ans": 3, "why": "Premature fusion of the coronal suture blocks anteroposterior growth, so the skull expands sideways, giving a short, wide head (brachycephaly).", "wrong": ["Early closure would give a localized temporal deformity, not a short wide skull", "Part of the pterion region; not the cause of a globally short, wide skull", "Bilateral fusion flattens the back of the head, typically with posterior asymmetry", "", "Causes a long, narrow (boat-shaped) head, scaphocephaly"], "pearl": "Coronal synostosis -> brachycephaly; sagittal -> scaphocephaly.", "set": "cranial"}, {"id": "LH-14", "stem": "A 22-year-old man receives a 3-cm-deep stab wound in the left anterior cervical region at the C2 vertebral level, anterior to the sternocleidomastoid and superior to the greater horn of the hyoid bone. Postoperatively he has dysarthria (difficulty speaking). Which structure is most likely damaged?", "opts": ["Hypoglossal nerve", "Accessory nerve", "Mandibular division of trigeminal nerve", "Lingual branch of glossopharyngeal nerve", "Roots of the brachial plexus"], "ans": 0, "why": "CN XII crosses the carotid arteries just above the greater horn of the hyoid in the anterior triangle. It supplies all intrinsic and most extrinsic tongue muscles, so injury impairs articulation, and the tongue deviates toward the injured side on protrusion.", "wrong": ["", "Supplies only SCM and trapezius; lies posterior, deep to SCM", "Lies high in the infratemporal fossa, not the anterior neck at C2", "Sensory/taste to posterior tongue; no motor role in speech", "Lie between the scalenes low in the neck, far from this wound"], "pearl": "CN XII lesion: dysarthria + tongue deviates toward the lesion ('licks the wound').", "set": "cn"}, {"id": "LH-15", "stem": "A 60-year-old female yodeler with a 43-year smoking history has pain on swallowing and hoarseness. Fiberoptic endoscopy reveals a laryngeal squamous cell carcinoma. Given her hoarseness, what structure is most likely affected by this cancer?", "opts": ["Infraglottic cavity", "Vocal folds", "Vestibular folds", "Laryngeal vestibule", "Epiglottis"], "ans": 1, "why": "Hoarseness is the hallmark of glottic cancer, which arises on the true vocal folds, the most common site of laryngeal squamous cell carcinoma, especially in smokers.", "wrong": ["Subglottic tumors are rare and present later with airway obstruction", "", "False folds are protective and not the main phonatory structure", "Supraglottic tumors cause dysphagia/throat pain before hoarseness", "Supraglottic; typically causes dysphagia rather than early hoarseness"], "pearl": "Glottic (true vocal fold) SCC = early hoarseness, most common laryngeal cancer site.", "set": "larynx"}, {"id": "LH-16", "stem": "A 9-year-old girl with a history of strep throat has her palatine tonsils removed. She returns 3 days later with high fever and chest pain; CT shows infection in the superior mediastinum. What is the most likely route for this infection to descend through the neck to reach the superior mediastinum?", "opts": ["Parapharyngeal space", "Retropharyngeal space", "Buccal space", "Carotid sheath", "Suprasternal space"], "ans": 1, "why": "The retropharyngeal space lies between the buccopharyngeal (visceral) fascia and the prevertebral fascia and extends from the skull base into the superior mediastinum, making it the most common path for pharyngeal infection to spread into the chest.", "wrong": ["Lateral to the pharynx; reaches the mediastinum only by communicating with the retropharyngeal space", "", "Lies in the cheek; has no path to the mediastinum", "Can conduct infection, but it is not the most common route", "Small space above the manubrium within the investing fascia; closed inferiorly"], "pearl": "Retropharyngeal space: skull base -> superior mediastinum; 'danger' route for neck infections.", "set": "neck"}, {"id": "LH-17", "stem": "A 23-year-old man was punched in the left eye in a bar fight, resulting in periorbital edema and ecchymosis. When his eyelids are pried open he has vertical diplopia, especially when asked to look up. Coronal CT shows asymmetry of the left orbit with soft tissue in the superior part of the maxillary sinus. What is the most likely cause of the diplopia?", "opts": ["Paralysis of lateral rectus muscle", "Entrapment of inferior rectus muscle", "Detached retina", "Paralysis of superior oblique muscle", "Damage to infraorbital nerve"], "ans": 1, "why": "A blowout fracture of the thin orbital floor lets orbital fat and the inferior rectus herniate into the maxillary sinus. The trapped muscle cannot relax, so upward gaze is restricted and vertical diplopia results.", "wrong": ["Would cause horizontal diplopia; the muscle is lateral, away from the floor fracture", "", "Causes visual field loss, not gaze-dependent diplopia", "Gives vertical diplopia worst on looking down and in, not restricted upgaze", "Causes numbness of the cheek/upper lip, not diplopia"], "pearl": "Orbital floor blowout -> inferior rectus entrapment -> impaired upgaze + infraorbital numbness.", "set": "orbit"}, {"id": "LH-18", "stem": "A 23-year-old woman wakes up with a facial nerve (Bell) palsy. What muscle will continue to function despite this condition?", "opts": ["Zygomaticus major", "Levator labii superioris", "Buccinator", "Masseter", "Platysma"], "ans": 3, "why": "The masseter is a muscle of mastication supplied by CN V3, so it is unaffected by a CN VII palsy; all the other choices are muscles of facial expression innervated by the facial nerve.", "wrong": ["Muscle of facial expression (CN VII, zygomatic/buccal branches)", "Muscle of facial expression (CN VII)", "Cheek muscle of facial expression (CN VII buccal branch)", "", "Facial expression muscle supplied by the cervical branch of CN VII"], "pearl": "Bell palsy spares mastication (CN V3): masseter, temporalis, pterygoids still work.", "set": "face"}, {"id": "LH-19", "stem": "A newborn girl is unable to turn her head to the right, even with assistance. Her neck rotation and lateral bending are limited, and her head is tilted toward the right with the chin elevated and turned toward the left. What muscle is most likely responsible?", "opts": ["Platysma", "Trapezius", "Sternocleidomastoid", "Masseter", "Digastric"], "ans": 2, "why": "Congenital torticollis results from a shortened or fibrosed sternocleidomastoid. The right SCM tilts the head toward the right shoulder and turns the chin to the left, so a tight right SCM produces this posture and blocks turning to the right.", "wrong": ["Thin cutaneous muscle (CN VII) that only tenses neck skin", "Elevates/retracts the scapula and extends the neck; does not produce this tilt-rotation posture", "", "Muscle of mastication; does not move the neck", "Suprahyoid muscle that moves the hyoid/mandible, not the head"], "pearl": "Torticollis: head tilts toward the tight SCM, chin rotates to the opposite side.", "set": "neck"}, {"id": "LH-20", "stem": "A student learns she has a perfect score on the anatomy portion of her board examination and smiles. What muscle elevates her labial commissures bilaterally to produce the smile?", "opts": ["Zygomaticus major", "Zygomaticus minor", "Levator labii superioris", "Buccinator", "Orbicularis oris"], "ans": 0, "why": "The zygomaticus major runs from the zygomatic bone to the angle of the mouth and pulls the labial commissures up and laterally, producing a smile (CN VII).", "wrong": ["", "Elevates the upper lip rather than the corners of the mouth", "Elevates and everts the upper lip", "Compresses the cheek against the teeth", "Closes and protrudes the lips (sphincter)"], "pearl": "Smile = zygomaticus major (CN VII zygomatic/buccal branches).", "set": "face"}, {"id": "LH-24", "stem": "A 36-year-old woman has palpitations, weight loss, anxiety, insomnia, fatigue, and amenorrhea. The physician palpates a 1.5-cm neck mass that elevates on swallowing, located inferior to the cricoid cartilage and off the midline. What is the most likely structure involved?", "opts": ["Enlarged deep cervical lymph node", "Thyroid nodule", "Benign parathyroid adenoma", "Thyroglossal duct cyst", "Branchial cyst"], "ans": 1, "why": "The thyroid lobes lie lateral to the trachea below the cricoid and move with swallowing because they are enclosed in pretracheal fascia. A hyperfunctioning nodule explains the hyperthyroid symptoms.", "wrong": ["Lies along the IJV in the carotid sheath and would not cause hyperthyroidism", "", "Would cause hypercalcemia symptoms, not hyperthyroidism", "Midline, usually at the hyoid level, and moves with tongue protrusion", "Lateral neck mass at the anterior SCM border; does not cause hyperthyroidism"], "pearl": "Neck mass that moves with swallowing = thyroid (invested by pretracheal fascia).", "set": "neck"}, {"id": "LH-25", "stem": "A dentist performs a regional nerve block by passing the needle through the oral mucosa at the apex of the maxillary vestibule and beyond the roots of the teeth toward the right upper canine region. The patient then has numbness of the upper canine and neighboring teeth, as well as the skin of the right lower eyelid, cheek, lateral nose, and upper lip. What nerve was blocked?", "opts": ["Anterior superior alveolar", "External nasal", "Infratrochlear", "Infraorbital", "Nasopalatine"], "ans": 3, "why": "The infraorbital nerve (CN V2) gives off the anterior and middle superior alveolar nerves to the anterior upper teeth and then exits the infraorbital foramen to supply the lower eyelid, cheek, side of the nose, and upper lip. Only it explains both the dental and facial numbness.", "wrong": ["Supplies the anterior upper teeth only, not the eyelid or cheek skin", "Supplies skin of the nasal dorsum and tip only (V1)", "Supplies medial eyelids and side of the nose root (V1)", "", "Supplies the nasal septum and anterior hard palate"], "pearl": "Infraorbital n. (V2): lower eyelid, cheek, lateral nose, upper lip (+ upper anterior teeth via superior alveolar branches).", "set": "face"}, {"id": "LH-26", "stem": "A 36-year-old man flies over the handlebars of his motorcycle without a helmet and strikes his head. He is alert but has a clear nasal discharge that tests positive for glucose. The patient most likely has a fracture of which of the following bones?", "opts": ["Ethmoid", "Vomer", "Sphenoid", "Maxilla", "Frontal"], "ans": 0, "why": "Glucose-positive clear rhinorrhea is CSF. The cribriform plate of the ethmoid separates the anterior cranial fossa from the nasal cavity, so its fracture lets CSF leak from the nose.", "wrong": ["", "Forms the posteroinferior nasal septum; does not border the cranial cavity", "A sphenoid fracture would drain CSF via the sphenoid sinus but is less typical than cribriform injury", "Does not border the cranial cavity", "Frontal sinus injury can leak CSF, but the classic site of CSF rhinorrhea is the cribriform plate"], "pearl": "CSF rhinorrhea (+ anosmia) = cribriform plate of ethmoid fracture.", "set": "cranial"}, {"id": "LH-27", "stem": "A 42-year-old man has a lymph node biopsy in the left posterior triangle of the neck. After closure, the physician asks him to rotate his head to the right against resistance. What nerve is the doctor assessing with this test?", "opts": ["Hypoglossal", "Accessory", "Mandibular division of trigeminal", "Great auricular", "Upper trunk of the brachial plexus"], "ans": 1, "why": "CN XI runs superficially across the posterior triangle, where it is at risk during node biopsy. It supplies the SCM; the left SCM turns the chin to the right, so resisted right rotation tests the left accessory nerve.", "wrong": ["Supplies tongue muscles; not tested by head rotation", "", "Supplies muscles of mastication, not neck rotators", "Purely sensory (skin over parotid and ear)", "Supplies shoulder muscles; does not rotate the head"], "pearl": "Turn head to the RIGHT against resistance = LEFT SCM = left CN XI.", "set": "neck"}, {"id": "LH-28", "stem": "A 10-year-old boy has sore throat, earache, and high fever, with severely swollen palatine tonsils. What nerve carries the sensory input for most of his symptoms?", "opts": ["Greater palatine", "Lesser palatine", "Vagus", "Posterior superior alveolar", "Glossopharyngeal"], "ans": 4, "why": "CN IX supplies general sensation to the palatine tonsils, oropharynx, posterior tongue, and (via the tympanic nerve) the middle ear, so it carries both the throat pain and the referred earache.", "wrong": ["Supplies the hard palate mucosa and gingiva", "Supplies the soft palate; contributes little to tonsil or ear sensation", "Supplies laryngopharynx and larynx; not the main tonsillar nerve", "Supplies upper molar teeth and maxillary sinus", ""], "pearl": "Tonsillitis earache = referred pain via CN IX (tonsil + tympanic plexus).", "set": "nasal_oral"}, {"id": "LH-32", "stem": "A young child has a condition causing progressive degeneration of the motor axons that innervate the masseter muscle. Which of the following muscles is most likely to be similarly affected?", "opts": ["Genioglossus", "Tensor tympani", "Orbicularis oris", "Levator veli palatini", "Stylopharyngeus"], "ans": 1, "why": "The masseter is supplied by CN V3, which also innervates the other muscles of mastication plus mylohyoid, anterior digastric, tensor veli palatini, and tensor tympani. The tensor tympani therefore shares the same motor supply.", "wrong": ["Supplied by CN XII", "", "Muscle of facial expression supplied by CN VII", "Supplied by CN X (pharyngeal plexus)", "The only muscle supplied by CN IX"], "pearl": "CN V3 motor: 4 mastication muscles + 'MATT' (mylohyoid, anterior digastric, tensor tympani, tensor veli palatini).", "set": "cn"}, {"id": "LH-34", "stem": "A 78-year-old man has signs of reduced blood flow to the right side of his face. The physician wants to palpate the facial artery pulse on both sides. Where can the facial artery pulse be readily palpated?", "opts": ["Lateral side of the body of the hyoid bone", "Inferior edge of the zygomatic arch", "Apex of the zygomatic bone", "Lateral surface of the nasal bone", "Inferior margin of the body of the mandible"], "ans": 4, "why": "The facial artery hooks around the inferior border of the mandible just anterior to the masseter, where it is superficial and can be compressed against bone to feel a pulse.", "wrong": ["The lingual artery, not the facial, lies near the hyoid", "The transverse facial artery runs near here, not the facial artery", "The facial artery does not pass over the zygomatic bone", "Only the terminal angular/lateral nasal branches are here; not a pulse site", ""], "pearl": "Facial a. pulse: inferior border of mandible, anterior edge of masseter.", "set": "face"}, {"id": "LH-36", "stem": "Startled while shaving his head with a straight razor, a young man cuts his scalp, severing branches of the supraorbital and superficial temporal vessels. The wound is modest but bleeds profusely. In what layer of the scalp do the severed vessels reside?", "opts": ["Skin", "Dense connective tissue", "Epicranial aponeurosis", "Loose connective tissue", "Pericranium"], "ans": 1, "why": "The main scalp vessels and nerves run in the dense connective tissue (second) layer. Their walls are bound to this fibrous tissue, which holds cut ends open and prevents vasoconstriction, so scalp wounds bleed heavily.", "wrong": ["Outermost layer; contains hair follicles and glands, not the main vessels", "", "Tendinous sheet linking frontalis and occipitalis; not the vascular layer", "'Danger layer' with emissary veins; spreads infection but not the main arteries", "Periosteum of the skull; not the site of the scalp arteries"], "pearl": "SCALP: Skin, Connective tissue (vessels), Aponeurosis, Loose areolar (danger), Pericranium.", "set": "face"}, {"id": "LH-37", "stem": "A 9-year-old girl with mumps has painful unilateral inflammation of her right parotid gland due to the stretched capsule. Her physician is concerned about the structures contained within the gland. Which of the following may be directly compressed?", "opts": ["Buccal nerve of CN V3", "Auriculotemporal nerve", "Posterior belly of the digastric muscle", "External jugular vein", "Facial artery"], "ans": 1, "why": "The auriculotemporal nerve (CN V3) passes through the upper parotid gland and supplies its capsule, so it can be compressed by the swollen gland and carries much of the pain.", "wrong": ["Runs anteriorly on the buccinator, not within the parotid", "", "Lies deep to the parotid, not inside it", "Forms below the gland from the retromandibular and posterior auricular veins", "Runs in the submandibular region and face, not through the parotid"], "pearl": "Parotid contents: CN VII branches, retromandibular v., ECA (and its terminal branches), auriculotemporal n.", "set": "face"}, {"id": "LH-38", "stem": "After facial injuries in an automobile accident, a 17-year-old girl is unable to close her lips together tightly. Which of the following muscles is paralyzed?", "opts": ["Zygomaticus major", "Buccinator", "Levator labii superioris", "Orbicularis oris", "Mentalis"], "ans": 3, "why": "The orbicularis oris is the sphincter encircling the mouth; it closes and purses the lips. Its paralysis (CN VII buccal/mandibular branches) prevents tight lip closure.", "wrong": ["Elevates the corners of the mouth", "Compresses the cheek against the teeth", "Elevates the upper lip", "", "Elevates and protrudes the lower lip and wrinkles the chin"], "pearl": "Orbicularis oris = oral sphincter (CN VII).", "set": "face"}, {"id": "LH-39", "stem": "A 50-year-old man has recurrent dizziness, ataxia, vertigo, aphasia, and right upper limb weakness. MRA shows stenosis of the proximal right subclavian artery with poststenotic dilatation, consistent with subclavian steal syndrome, in which blood is shunted from the left-side arterial tree via collaterals into the right-side circulation. Through which ipsilateral vessel is blood entering the right subclavian artery distal to the stenosis?", "opts": ["Internal thoracic artery", "Common carotid artery", "Vertebral artery", "Superior thyroid artery", "Suprascapular artery"], "ans": 2, "why": "With proximal subclavian stenosis, pressure distal to the block falls, so blood from the basilar/circle of Willis flows backward down the ipsilateral vertebral artery into the subclavian. This 'steal' from the brain explains the vertebrobasilar symptoms.", "wrong": ["Subclavian branch to the anterior chest wall; not the reversed-flow vessel in steal", "Arises from the brachiocephalic trunk proximal to the stenosis; does not enter the subclavian", "", "Branch of the external carotid supplying thyroid/larynx", "Thyrocervical trunk branch to the scapular region; not the steal pathway"], "pearl": "Subclavian steal: retrograde flow in the ipsilateral vertebral a. -> vertebrobasilar symptoms with arm use.", "set": "neck"}, {"id": "LH-42", "stem": "A 43-year-old man has loss of facial expression across the entire right side; the right corner of his mouth droops, but he can clench his jaw and chew. He also has right-sided hearing loss and difficulty balancing on one foot. His right corneal (blink) reflex is absent, but cutaneous sensation of the whole face is normal. Imaging is ordered for a suspected tumor. What is the most likely location of the tumor?", "opts": ["Internal acoustic meatus", "Foramen ovale", "Foramen rotundum", "Geniculum of the facial canal", "Stylomastoid foramen"], "ans": 0, "why": "Combined CN VII (facial paralysis, lost efferent blink) and CN VIII (hearing and balance) deficits with intact CN V point to the internal acoustic meatus, where both nerves travel together, as with a vestibular schwannoma.", "wrong": ["", "Transmits CN V3; chewing and facial sensation are intact", "Transmits CN V2; facial sensation is intact", "Beyond this point CN VIII is no longer with CN VII, so hearing/balance would be spared", "Lesion here spares hearing and balance"], "pearl": "CN VII + CN VIII deficits together = internal acoustic meatus / cerebellopontine angle.", "set": "cn"}, {"id": "LH-44", "stem": "During a difficult delivery, obstetric forceps are misapplied at the infant's right stylomastoid foramen and crush its contents at the opening of the foramen. Which of the following ipsilateral deficits is the baby most likely to have?", "opts": ["Reduced blood flow to the inner ear", "No sensation in the external acoustic meatus", "Inability to close the eyelids", "Lack of taste on the body of the tongue", "Inability to tense the eardrum"], "ans": 2, "why": "The facial nerve leaves the skull at the stylomastoid foramen, which is superficial in newborns because the mastoid process is undeveloped. Injury there paralyzes the muscles of facial expression, including orbicularis oculi, so the eye cannot close.", "wrong": ["Inner ear is supplied by the labyrinthine artery via the internal acoustic meatus", "Meatal skin is supplied mainly by V3 and CN X; unaffected", "", "Chorda tympani leaves CN VII above the stylomastoid foramen, so taste is spared", "Tensor tympani is supplied by CN V3"], "pearl": "Stylomastoid foramen lesion = facial muscle paralysis only (taste, lacrimation, stapedius spared). Newborns lack a mastoid process to protect it.", "set": "cn"}, {"id": "LH-48", "stem": "During surgery, the anesthesiologist at the head of the table periodically checks the patient's pulse by palpating the artery located just anterior to the tragus of the ear. Which artery is being used?", "opts": ["Maxillary", "Posterior auricular", "Superficial temporal", "Facial", "Internal carotid"], "ans": 2, "why": "The superficial temporal artery, a terminal branch of the external carotid, ascends anterior to the tragus over the zygomatic root, where its pulse is easily felt.", "wrong": ["Runs deep to the mandibular neck in the infratemporal fossa; not palpable", "Runs behind the ear", "", "Palpated at the inferior border of the mandible", "Runs deep in the neck and skull base; not palpable anterior to the ear"], "pearl": "Pulse in front of the tragus = superficial temporal a.", "set": "face"}, {"id": "LH-49", "stem": "A 32-year-old woman has LASIK surgery. To treat dry eyes, her ophthalmologist inserts a small silicone plug to block drainage of tears from her left eye. Obstruction of what structure prevents tears from entering the lacrimal drainage apparatus?", "opts": ["Lacrimal punctum", "Lacrimal canaliculus", "Lacrimal sac", "Nasolacrimal duct", "Inferior nasal meatus"], "ans": 0, "why": "Tears enter the drainage system through the lacrimal puncta on the lacrimal papillae at the medial lid margins. A punctal plug blocks this entry point so tears stay on the eye.", "wrong": ["", "Lies downstream of the punctum; tears have already entered", "Downstream collecting chamber in the lacrimal fossa", "Carries tears from the sac to the nose; far downstream", "Final outlet of the nasolacrimal duct in the nasal cavity"], "pearl": "Tear drainage: punctum -> canaliculus -> lacrimal sac -> nasolacrimal duct -> inferior meatus.", "set": "orbit"}, {"id": "LH-50", "stem": "While removing cervical lymph nodes during a radical neck dissection, a surgeon mistakenly cuts the ansa cervicalis. Which of the following deficits may occur?", "opts": ["Decreased blood flow to the larynx", "Lymphedema in the carotid triangle of the neck", "Reduced sensation in the skin over the posterior triangle of the neck", "Paralysis of several infrahyoid (strap) muscles", "Paralysis of the intrinsic laryngeal muscles"], "ans": 3, "why": "The ansa cervicalis (C1-C3 loop) supplies motor fibers to the omohyoid, sternohyoid, and sternothyroid; cutting it paralyzes these strap muscles.", "wrong": ["Ansa is a nerve; larynx is supplied by the superior and inferior laryngeal arteries", "A nerve lesion does not cause lymphedema", "Skin here is supplied by cutaneous branches of the cervical plexus, not the ansa", "", "Intrinsic laryngeal muscles are supplied by CN X (recurrent and external laryngeal nerves)"], "pearl": "Ansa cervicalis = motor to infrahyoids except thyrohyoid (C1 via CN XII).", "set": "neck"}, {"id": "LH-52", "stem": "A paralyzed right true vocal fold is most likely associated with which of the following situations?", "opts": ["Repair of a patent ductus arteriosus", "Repair of an aortic aneurysm", "A gunshot wound below the second rib", "Surgical removal of the thyroid gland", "Obstruction of the thoracic duct"], "ans": 3, "why": "The right recurrent laryngeal nerve loops under the right subclavian artery and ascends in the tracheoesophageal groove next to the thyroid, where it is vulnerable during thyroidectomy.", "wrong": ["Endangers the LEFT recurrent laryngeal nerve, which hooks under the aortic arch", "Endangers the LEFT recurrent laryngeal nerve at the aortic arch", "The right recurrent nerve loops at the subclavian artery, above this level", "", "Lymphatic obstruction does not affect the laryngeal nerves"], "pearl": "Right RLN: loops under R subclavian; left RLN: under aortic arch. Thyroidectomy risks both.", "set": "larynx"}, {"id": "LH-54", "stem": "A 47-year-old man has diplopia after hitting his head on the steering wheel. His ophthalmologist asks him to look first inward (toward his nose) and then upward. The integrity of which extraocular muscle is being tested?", "opts": ["Superior oblique", "Inferior oblique", "Lateral rectus", "Inferior rectus", "Superior rectus"], "ans": 1, "why": "When the eye is adducted, the obliques become the main vertical movers; the inferior oblique elevates the adducted eye, so looking in and up isolates it.", "wrong": ["Tested by looking in and DOWN", "", "Tested by looking laterally (abduction)", "Tested by looking out and down", "Tested by looking out and up"], "pearl": "Clinical testing: IO = in & up; SO = in & down; SR = out & up; IR = out & down.", "set": "orbit"}, {"id": "LH-56", "stem": "During extraction of impacted wisdom teeth, a 22-year-old woman suffers damage to her right inferior alveolar nerve. Which of the following is most likely to result?", "opts": ["Inability to compress the cheek", "Paresthesia of the lower lip", "Weakness in closing the jaw", "Decreased salivary flow", "Reduced taste in the body of the tongue"], "ans": 1, "why": "The inferior alveolar nerve (CN V3) runs in the mandibular canal and ends as the mental nerve, which supplies the skin and mucosa of the lower lip and chin; injury causes lower lip numbness or paresthesia.", "wrong": ["Buccinator is supplied by CN VII", "", "Jaw closers are supplied by other V3 motor branches; the inferior alveolar gives motor only to mylohyoid/anterior digastric", "Salivary secretomotor fibers travel with the chorda tympani/lingual nerve", "Taste from the anterior tongue travels via the lingual nerve/chorda tympani"], "pearl": "Inferior alveolar -> mental n.: lower teeth, lower lip, chin. Lingual n. (nearby) -> tongue sensation/taste.", "set": "face"}, {"id": "LH-57", "stem": "A 17-year-old woman strikes the front of her head on the steering wheel in a head-on collision. CT shows a left crescent-shaped extra-axial hematoma compressing the brain. What blood vessel(s) is/are the most likely source of this hemorrhage?", "opts": ["Middle meningeal artery", "Superficial temporal artery", "Cerebral arterial circle", "Superior cerebral veins", "Occipital artery"], "ans": 3, "why": "A crescent-shaped collection that crosses suture lines is a subdural hematoma, caused by tearing of the superior cerebral (bridging) veins as they cross from the brain to the superior sagittal sinus during sudden head acceleration-deceleration.", "wrong": ["Causes a biconvex epidural hematoma", "Lies in the scalp; bleeds outside the skull", "Aneurysm rupture causes subarachnoid hemorrhage", "", "Supplies the posterior scalp; outside the skull"], "pearl": "Subdural = bridging (superior cerebral) veins, crescent-shaped, crosses sutures.", "set": "cranial"}, {"id": "LH-58", "stem": "A 35-year-old woman has tenderness in her cheek near the parotid gland, bad breath, and a foul taste at mealtimes. Sialography confirms a stone (sialolith) blocking the parotid duct. Through which muscle does the parotid duct pass, most likely creating the narrowing where the stone lodged?", "opts": ["Buccinator", "Mentalis", "Temporalis", "Orbicularis oris", "Masseter"], "ans": 0, "why": "The parotid duct crosses superficial to the masseter, then turns medially to pierce the buccinator before opening opposite the upper second molar. The passage through the buccinator narrows the duct and is a common site for a stone to lodge.", "wrong": ["", "In the chin; unrelated to the parotid duct", "Lies in the temporal fossa, above the duct", "Surrounds the mouth; the duct does not pass through it", "The duct crosses its surface but does not pierce it"], "pearl": "Parotid (Stensen) duct: over masseter -> pierces buccinator -> opens opposite upper 2nd molar.", "set": "face"}, {"id": "LH-62", "stem": "During a fight, one construction worker strikes the other with a hammer at the pterion of the skull. Which of the following bones may be fractured?", "opts": ["Zygomatic process of the temporal bone", "Greater wing of the sphenoid bone", "Mastoid process of the temporal bone", "Lateral pterygoid plate of the sphenoid bone", "Coronoid process of the mandible"], "ans": 1, "why": "The pterion is the H-shaped junction of the frontal, parietal, squamous temporal, and greater wing of the sphenoid bones. It is thin, and the anterior branch of the middle meningeal artery runs deep to it.", "wrong": ["Forms the zygomatic arch, inferior to the pterion", "", "Lies behind the ear, far from the pterion", "Lies deep in the infratemporal fossa", "Part of the mandible, below the zygomatic arch"], "pearl": "Pterion = frontal + parietal + temporal + greater wing of sphenoid; overlies the middle meningeal a.", "set": "cranial"}, {"id": "LH-63", "stem": "A baby boy has scaphocephaly (a long, narrow, boat-shaped head). Which suture closed prematurely?", "opts": ["Coronal", "Sagittal", "Lambdoid", "Metopic", "Squamous"], "ans": 1, "why": "Early fusion of the sagittal suture prevents side-to-side growth, so the skull lengthens anteroposteriorly into a long, narrow shape; it is the most common craniosynostosis.", "wrong": ["Causes a short, wide skull (brachycephaly)", "", "Causes flattening of the back of the head (plagiocephaly)", "Causes a triangular forehead (trigonocephaly)", "Rarely fuses early; does not cause scaphocephaly"], "pearl": "Sagittal synostosis -> scaphocephaly (most common); metopic -> trigonocephaly.", "set": "cranial"}, {"id": "LH-64", "stem": "A bony overgrowth narrows the pterygomaxillary fissure, compressing the third (pterygopalatine) part of the maxillary artery. Blood flow will be reduced in which of the following arteries?", "opts": ["Superficial temporal", "Sphenopalatine", "Inferior alveolar", "Middle meningeal", "Ophthalmic"], "ans": 1, "why": "The third part of the maxillary artery passes through the pterygomaxillary fissure into the pterygopalatine fossa and gives off the sphenopalatine, descending palatine, posterior superior alveolar, and infraorbital arteries.", "wrong": ["Terminal branch of the external carotid, separate from the maxillary artery", "", "Branch of the first (mandibular) part of the maxillary artery", "Branch of the first (mandibular) part of the maxillary artery", "Branch of the internal carotid artery"], "pearl": "Maxillary a.: 1st part (middle meningeal, inferior alveolar); 2nd (muscular); 3rd (sphenopalatine, infraorbital, PSA, descending palatine).", "set": "face"}, {"id": "LH-65", "stem": "A 17-year-old woman has an anterior dislocation of her temporomandibular joint, with her mandible stuck in the protruded position. Her dentist pulls the mandible inferiorly so that muscle tone can retract it. Which muscle returns the mandibular condyle to its normal position after it clears the articular eminence?", "opts": ["Lateral pterygoid", "Masseter", "Medial pterygoid", "Stylohyoid", "Temporalis"], "ans": 4, "why": "The horizontal posterior fibers of the temporalis retract (retrude) the mandible, pulling the condyle back into the mandibular fossa once it is past the articular eminence.", "wrong": ["Protrudes the mandible; its spasm helps cause the dislocation", "Mainly elevates the mandible; its spasm contributes to locking", "Elevates and protrudes the mandible", "Elevates and retracts the hyoid, not the mandible", ""], "pearl": "Retrusion of the mandible = posterior fibers of temporalis; protrusion = lateral pterygoid.", "set": "face"}, {"id": "LH-66", "stem": "During a mixed martial arts fight, a fighter is punched in the anterior neck, fracturing the hyoid bone. Which of the following muscles would be most directly affected?", "opts": ["Palatopharyngeus", "Stylopharyngeus", "Superior pharyngeal constrictor", "Middle pharyngeal constrictor", "Inferior pharyngeal constrictor"], "ans": 3, "why": "The middle pharyngeal constrictor arises from the greater and lesser horns of the hyoid and the stylohyoid ligament, so a hyoid fracture directly disrupts its attachment.", "wrong": ["Arises from the palate and inserts into the pharynx/thyroid cartilage", "Arises from the styloid process", "Arises from the pterygomandibular raphe, pterygoid hamulus, and mandible", "", "Arises from the thyroid and cricoid cartilages"], "pearl": "Constrictor origins: superior = pterygomandibular raphe; middle = hyoid; inferior = thyroid & cricoid.", "set": "nasal_oral"}, {"id": "LH-67", "stem": "A 40-year-old woman has headaches, nausea, vomiting, and multiple lower cranial nerve deficits. CT shows a tumor centered at the right jugular foramen that has destroyed the jugular foramen and hypoglossal canal and damaged the cranial nerves passing through them. Which of the following functions will remain intact?", "opts": ["Control of the true vocal fold", "Taste in the anterior two thirds of the tongue", "Symmetric protrusion of the tongue", "Sensation in the tympanic cavity", "Elevation of the shoulder"], "ans": 1, "why": "The jugular foramen transmits CN IX, X, and XI, and the hypoglossal canal transmits CN XII. Taste from the anterior two thirds of the tongue travels with the chorda tympani (CN VII), which uses the internal acoustic meatus, so it is spared.", "wrong": ["Intrinsic laryngeal muscles are supplied by CN X (jugular foramen)", "", "CN XII in the hypoglossal canal is damaged, so the tongue deviates", "Tympanic cavity sensation is via CN IX (jugular foramen)", "Trapezius is supplied by CN XI (jugular foramen)"], "pearl": "Jugular foramen: CN IX, X, XI (+ IJV); hypoglossal canal: CN XII.", "set": "cn"}, {"id": "LH-68", "stem": "The external laryngeal nerve of a 23-year-old man becomes compressed by a tortuous superior thyroid artery, which parallels the nerve's course. Which of the following functions is most likely to be affected?", "opts": ["Sensation above the true vocal fold", "Sensation below the true vocal fold", "Abduction of the vocal cord", "Tension of the vocal cord", "Depression of the hyoid bone"], "ans": 3, "why": "The external branch of the superior laryngeal nerve runs with the superior thyroid artery and supplies the cricothyroid muscle, which tilts the thyroid cartilage to tense the vocal cords (pitch).", "wrong": ["Carried by the internal laryngeal nerve", "Carried by the recurrent laryngeal nerve", "Posterior cricoarytenoid, supplied by the recurrent laryngeal nerve", "", "Infrahyoid muscles are supplied by the ansa cervicalis"], "pearl": "External laryngeal n. -> cricothyroid (tenses cords, high pitch); at risk when ligating the superior thyroid a.", "set": "larynx"}, {"id": "LH-69", "stem": "An 82-year-old woman develops a dural meningioma that compresses the confluence of the dural venous sinuses. Drainage from which of the following vessels would be impeded by the tumor?", "opts": ["Superior sagittal sinus", "Transverse sinus", "Cavernous sinus", "Superior petrosal sinus", "Inferior petrosal sinus"], "ans": 0, "why": "The superior sagittal sinus runs in the attached border of the falx cerebri and empties into the confluence of sinuses near the internal occipital protuberance. Blocking the confluence backs up flow in the superior sagittal sinus.", "wrong": ["", "Carries blood AWAY from the confluence, so it is downstream, not impeded", "Drains via the petrosal sinuses, not the confluence", "Drains the cavernous sinus into the transverse/sigmoid junction, bypassing the confluence", "Drains the cavernous sinus directly into the internal jugular vein"], "pearl": "Superior sagittal (+ straight, occipital) -> confluence -> transverse -> sigmoid -> IJV.", "set": "cranial"}, {"id": "LH-71", "stem": "A 21-year-old boxer takes punches to the side of his face that fracture the left mandible just above the mandibular angle. Muscle spasm makes his jaw close, so it is hard to remove his mouthpiece. Which muscle is acting to close the jaw?", "opts": ["Temporalis", "Lateral pterygoid", "Zygomaticus major", "Masseter", "Posterior digastric"], "ans": 3, "why": "The masseter inserts on the angle and lateral ramus of the mandible. A fracture in the middle of its insertion leaves much of the muscle attached to the fragment, and its spasm powerfully elevates the jaw (the medial pterygoid acts similarly on the deep side).", "wrong": ["Inserts on the coronoid process, away from the fracture near the angle", "Protrudes and helps depress the mandible, not close it", "Facial expression muscle; does not move the mandible", "", "Helps depress the mandible, not close it"], "pearl": "Masseter + medial pterygoid form a sling at the mandibular angle; both are powerful jaw closers.", "set": "face"}, {"id": "LH-72", "stem": "During an initial oral examination, a dental hygienist inspects the vestibule of the mouth. Which of the following structures is encountered in this area?", "opts": ["Lingual frenulum", "Opening of the parotid duct", "Opening of the submandibular duct", "Uvula", "Palatine tonsil"], "ans": 1, "why": "The oral vestibule is the space between the lips/cheeks and the teeth/gums. The parotid duct opens into it on a small papilla opposite the upper second molar.", "wrong": ["Lies in the oral cavity proper, under the tongue", "", "Opens on the floor of the oral cavity proper beside the frenulum", "Hangs from the soft palate at the back of the oral cavity", "Lies in the oropharynx between the palatine arches"], "pearl": "Vestibule = between cheeks and teeth; parotid duct opens here opposite upper 2nd molar.", "set": "nasal_oral"}, {"id": "LH-74", "stem": "In a bar fight, the orbit of a 25-year-old man is pierced by a broken pool cue that extends back to the superior orbital fissure. Which of the following nerves is most likely damaged?", "opts": ["Optic nerve", "Facial nerve", "Mandibular division of trigeminal", "Maxillary division of trigeminal", "Ophthalmic division of trigeminal"], "ans": 4, "why": "The branches of CN V1 (lacrimal, frontal, nasociliary) enter the orbit through the superior orbital fissure, along with CN III, IV, VI, and the superior ophthalmic vein.", "wrong": ["Enters the orbit through the optic canal", "Does not enter the orbit", "Exits the skull through the foramen ovale", "Exits through the foramen rotundum", ""], "pearl": "Superior orbital fissure: CN III, IV, V1, VI + superior ophthalmic v.", "set": "orbit"}];

 {key:'orbit',name:'The Six-Muscle Cyclops',title:'LR6 · SO4 · the rest are III',hue:'#B06CF0',eyes:1,horns:2,shape:'round'},
 {key:'cranial',name:'The Foramen Keeper',title:'Guards every hole in the skull base',hue:'#C9C2A8',eyes:4,horns:3,shape:'tall'},
 {key:'cn',name:'The Cranial Nerve Hydra',title:'Twelve heads. Olfactory to hypoglossal.',hue:'#FF4F8B',eyes:2,horns:0,shape:'hydra',final:true}
];
const BY_KEY=Object.fromEntries(BOSSES.map(b=>[b.key,b]));
const TOPIC_COUNT={};Q.forEach(q=>TOPIC_COUNT[q.set]=(TOPIC_COUNT[q.set]||0)+1);

function beastSVG(b,small){
  const c=b.hue, W=200,H=170;
  let g='';
  if(b.shape==='hydra'){
    // 12 heads on necks fanning from one body
    for(let i=0;i<12;i++){
      const a=(-150+i*(120/11))*Math.PI/180, r=i%2?78:92;
      const x=100+Math.cos(a)*r, y=128+Math.sin(a)*r;
      g+=`<path d="M100 130 Q${(100+x)/2+(i%2?8:-8)} ${(130+y)/2} ${x.toFixed(1)} ${y.toFixed(1)}" stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round" opacity=".9"/>`;
      g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9" fill="${c}"/><circle cx="${(x+2.5).toFixed(1)}" cy="${(y-2).toFixed(1)}" r="2.6" fill="#17142B"/>`;
    }
    g+=`<ellipse cx="100" cy="142" rx="54" ry="26" fill="${c}"/><ellipse cx="100" cy="146" rx="36" ry="12" fill="#17142B" opacity=".35"/>`;
    g+=`<text x="100" y="150" text-anchor="middle" font-family="Silkscreen,monospace" font-size="11" fill="#17142B">I–XII</text>`;
  }else{
    const rx=b.shape==='wide'?78:b.shape==='tall'?52:64, ry=b.shape==='tall'?70:b.shape==='wide'?52:60, cy=98;
    for(let i=0;i<b.horns;i++){
      const t=b.horns===1?0.5:i/(b.horns-1), hx=100-rx*0.8+t*rx*1.6, top=cy-ry-26+Math.abs(t-.5)*18;
      g+=`<polygon points="${hx-9},${cy-ry+14} ${hx+9},${cy-ry+14} ${hx+(t-.5)*14},${top}" fill="${c}" opacity=".85"/>`;
    }
    g+=`<ellipse cx="100" cy="${cy}" rx="${rx}" ry="${ry}" fill="${c}"/>`;
    g+=`<ellipse cx="100" cy="${cy+ry*0.45}" rx="${rx*0.62}" ry="${ry*0.3}" fill="#17142B" opacity=".18"/>`;
    const n=b.eyes, span=Math.min(rx*1.1,26*n);
    for(let i=0;i<n;i++){
      const ex=n===1?100:100-span/2+i*(span/(n-1)), er=n===1?22:n>2?9:13, ey=cy-ry*0.18;
      g+=`<circle cx="${ex}" cy="${ey}" r="${er}" fill="#F4F0FF"/><circle class="pupil" cx="${ex}" cy="${ey+1}" r="${er*0.45}" fill="#17142B"/>`;
    }
    // mouth with teeth
    const mw=rx*0.9, my=cy+ry*0.32;
    g+=`<path d="M${100-mw/2} ${my} Q100 ${my+22} ${100+mw/2} ${my} Z" fill="#17142B"/>`;
    for(let i=0;i<5;i++){const tx=100-mw/2+8+i*((mw-16)/4);g+=`<polygon points="${tx-4},${my+2} ${tx+4},${my+2} ${tx},${my+10}" fill="#F4F0FF"/>`;}
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(b.name)}">${g}</svg>`;
}

/* ---- state ---- */
let S, tick=null;
function fresh(){return{phase:'setup',names:['Player 1','Player 2'],mode:'campaign',pick:'cn',timer:60,diff:'normal'};}
const DIFF={normal:{bossHP:100,finalHP:140,dmg:20,rage:30,hit:15},hard:{bossHP:130,finalHP:180,dmg:20,rage:40,hit:22}};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function begin(){
  const order=S.mode==='campaign'?BOSSES.map(b=>b.key):[S.pick];
  Object.assign(S,{phase:'intro',order,stage:0,
    players:[0,1].map(()=>({hp:100,dmg:0,right:0,seen:0,assists:0,potion:1,missed:[]})),
    pools:{},used:{},turn:0,teamStreak:0,soloStreak:0,log:''});
  render();
}
function nextQ(topic){
  if(!S.pools[topic]||!S.pools[topic].length) S.pools[topic]=shuffle(Q.filter(q=>q.set===topic).map(q=>q.id));
  return S.pools[topic].pop();
}
function startBoss(){
  const b=BY_KEY[S.order[S.stage]], d=DIFF[S.diff];
  const max=b.final?d.finalHP:d.bossHP;
  S.boss={key:b.key,hp:max,max};
  S.players.forEach(p=>{p.hint=1; if(p.hp<=0)p.hp=30;});
  S.phase='fight'; S.log=`${b.name} appears.`;
  S.turn=S.players[S.turn].hp>0?S.turn:1-S.turn;
  newRound();
}
function alive(k){return S.players[k].hp>0}
function newRound(){
  const q=nextQ(S.boss.key);
  S.r={qid:q,sub:'answer',active:S.turn,origin:S.turn,out:[],wp:[],picked:null,hinted:false,
       deadline:S.timer?Date.now()+limit()*1000:0,total:limit()};
  render();startTimer();
}
function enraged(){return S.boss.hp<=S.boss.max/2}
function limit(){return S.timer?(enraged()?Math.max(20,Math.round(S.timer*0.75)):S.timer):0}

function startTimer(){stopTimer(); if(!S.timer)return; tick=setInterval(()=>{if(!S.r||S.r.sub==='reveal'){stopTimer();return;} paintTimer(); if(Date.now()>=S.r.deadline) answer(-1);},250);}
function stopTimer(){if(tick){clearInterval(tick);tick=null;}}
function paintTimer(){
  const t=document.querySelector('.timer'); if(!t||!S.timer||!S.r)return;
  const left=Math.max(0,S.r.deadline-Date.now());
  t.firstElementChild.style.transform=`scaleX(${left/(S.r.total*1000)})`;
  t.classList.toggle('warn',left<10000);
  const s=document.getElementById('secs'); if(s)s.textContent=Math.ceil(left/1000)+'s';
}

function answer(i){
  const r=S.r; if(!r||(r.sub!=='answer'&&r.sub!=='assist'))return;
  if(i>=0&&r.out.includes(i))return;
  const q=byId[r.qid], p=S.players[r.active], d=DIFF[S.diff], b=BY_KEY[S.boss.key];
  const ok=i===q.ans; r.picked=i; if(i>=0&&!ok)r.wp.push(i);
  if(r.sub==='answer'){
    p.seen++;
    if(ok){
      let dmg=d.dmg; const fast=S.timer&&(r.deadline-Date.now())>r.total*500;
      if(fast)dmg+=10; S.teamStreak++; if(S.teamStreak>=3)dmg+=5; if(r.hinted)dmg=Math.round(dmg/2);
      p.right++; p.dmg+=dmg; hurtBoss(dmg);
      S.log=`${S.names[r.active]} hits for ${dmg}${fast?' · swift strike':''}${S.teamStreak>=3?` · combo ×${S.teamStreak}`:''}${r.hinted?' · halved by hint':''}`;
      soloRevive(r.active);
      return reveal(true,dmg,'boss');
    }
    // miss → boss strikes, teammate may assist
    S.teamStreak=0; if(!p.missed.includes(q.id))p.missed.push(q.id);
    const hit=enraged()?d.rage:d.hit; hurtPlayer(r.active,hit);
    if(i>=0)r.out.push(i);
    const mate=1-r.active;
    S.log=`${i<0?'Time is up. ':''}${b.name} strikes ${S.names[r.active]} for ${hit}`;
    if(alive(mate)&&S.players.some((x,k)=>k===mate)){ r.sub='assist'; r.active=mate; r.first=i;
      r.deadline=S.timer?Date.now()+Math.max(15,Math.round(limit()/3))*1000:0; r.total=S.timer?Math.max(15,Math.round(limit()/3)):0;
      render(); anim('atk'); startTimer(); return; }
    return reveal(false,0,'player');
  }else{
    if(ok){ const dmg=10; p.dmg+=dmg; p.assists++; hurtBoss(dmg); S.log=`${S.names[r.active]} assists for ${dmg}`; return reveal(true,dmg,'boss'); }
    if(i>=0)r.out.push(i);
    S.log+=` · assist missed`;
    return reveal(false,0,null);
  }
}
function soloRevive(k){
  const mate=1-k;
  if(alive(mate)){S.soloStreak=0;return;}
  S.soloStreak=(S.soloStreak||0)+1;
  if(S.soloStreak>=3){S.players[mate].hp=30;S.soloStreak=0;S.log+=` · ${S.names[mate]} is revived at 30 HP`;}
}
function hurtBoss(n){S.boss.hp=Math.max(0,S.boss.hp-n);}
function hurtPlayer(k,n){S.players[k].hp=Math.max(0,S.players[k].hp-n);}
function reveal(ok,dmg,target){
  stopTimer(); S.r.sub='reveal'; S.r.ok=ok; render();
  if(target==='boss'){anim(S.boss.hp<=0?'dead':'hit'); pop('-'+dmg,'.beast','var(--p1)');}
  else if(target==='player'){anim('atk');}
}
function anim(cls){const e=document.querySelector('.beast'); if(!e)return; e.classList.remove('hit','atk'); void e.offsetWidth; e.classList.add(cls);}
function pop(txt,sel,color){const host=document.querySelector(sel); if(!host)return; const s=document.createElement('span'); s.className='dmg'; s.textContent=txt; s.style.color=color; host.style.position='relative'; s.style.left='50%'; s.style.top='20%'; host.appendChild(s); setTimeout(()=>s.remove(),1000);}

function cont(){
  if(S.boss.hp<=0){ S.stage++; S.players.forEach(p=>{if(p.hp>0)p.hp=Math.min(100,p.hp+40);});
    if(S.stage>=S.order.length){S.phase='end';S.won=true;} else S.phase='intro';
    render(); return; }
  if(!alive(0)&&!alive(1)){S.phase='end';S.won=false;render();return;}
  // alternate turns among the living
  let nt=1-S.r.origin; if(!alive(nt))nt=1-nt; S.turn=nt; newRound();
}
function usePotion(k){
  const p=S.players[k]; if(!p.potion||S.r.sub==='reveal')return;
  const target=[0,1].filter(i=>S.players[i].hp>0).sort((a,b)=>S.players[a].hp-S.players[b].hp)[0];
  if(target==null)return;
  // revive KO'd teammate first if possible
  const mate=1-k; const tgt=!alive(mate)?mate:target;
  S.players[tgt].hp=Math.min(100,(S.players[tgt].hp||0)+35); p.potion=0;
  S.log=`${S.names[k]} uses a potion on ${S.names[tgt]} (+35)`; render();
}
function useHint(k){
  const r=S.r, p=S.players[k], q=byId[r.qid];
  if(!p.hint||r.sub!=='answer'||r.active!==k||r.hinted)return;
  const wrongs=shuffle(q.opts.map((_,i)=>i).filter(i=>i!==q.ans&&!r.out.includes(i))).slice(0,2);
  r.out.push(...wrongs); r.hinted=true; p.hint=0;
  S.log=`${S.names[k]} uses a hint — two wrong answers vanish (damage halved)`; render();
}

      <ul class="rules">
        <li><b>Strike</b><span>Correct answer: 20 damage. +10 if answered in the first half of the timer. +5 once the team has 3 correct in a row.</span></li>
        <li><b>Take hits</b><span>A miss or timeout lets the boss hit you for 15 (22 on hard). Below half health it enrages: harder hits, shorter timer.</span></li>

      </ul>
    </div>
    <div class="form">
      <div class="fl"><span class="pix">Party</span>
        <div class="names"><input id="p1name" aria-label="Player 1 name" maxlength="16" value="${esc(S.names[0])}"><input id="p2name" aria-label="Player 2 name" maxlength="16" value="${esc(S.names[1])}"></div></div>
      <div class="fl"><span class="pix">Run</span>
        <div class="seg" id="mode"><button data-v="campaign" aria-pressed="${S.mode==='campaign'}">Full campaign · 7 bosses</button><button data-v="single" aria-pressed="${S.mode==='single'}">Single boss</button></div>
        ${S.mode==='single'?`<div class="picker">${BOSSES.map(b=>`<button data-k="${b.key}" aria-pressed="${S.pick===b.key}"><span>${esc(b.name)}</span><em>${TOPIC_COUNT[b.key]||0}</em></button>`).join('')}</div>`:`<p class="hint">Order: ${BOSSES.map(b=>esc(b.name.replace('The ',''))).join(' → ')}</p>`}
      </div>

        <p class="hint">${S.diff==='normal'?'Boss health 100 (Hydra 140). Hits 15, enraged 30.':'Boss health 130 (Hydra 180). Hits 22, enraged 40.'}</p></div>
      <div class="fl"><span class="pix">Timer per question</span>
        <div class="seg" id="timer">${[[0,'Off'],[45,'45 s'],[60,'60 s'],[90,'90 s']].map(([v,l])=>`<button data-v="${v}" aria-pressed="${S.timer===v}">${l}</button>`).join('')}</div>
        ${S.timer?'':'<p class="hint">With the timer off, there are no swift-strike bonuses.</p>'}</div>
      <button class="go" id="start">Enter the arena</button>
    </div></section>`;
  const save=()=>{S.names=[document.getElementById('p1name').value.trim()||'Player 1',document.getElementById('p2name').value.trim()||'Player 2'];};
  app.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{save();S.mode=b.dataset.v;render();});
  app.querySelectorAll('.picker button').forEach(b=>b.onclick=()=>{save();S.pick=b.dataset.k;render();});
  app.querySelectorAll('#diff button').forEach(b=>b.onclick=()=>{save();S.diff=b.dataset.v;render();});
  app.querySelectorAll('#timer button').forEach(b=>b.onclick=()=>{save();S.timer=+b.dataset.v;render();});
  document.getElementById('start').onclick=()=>{save();begin();};
}

function pathHTML(){return `<div class="path">${S.order.map((k,i)=>`<span class="${i<S.stage?'done':i===S.stage?'now':''}">${esc(BY_KEY[k].name.replace('The ',''))}</span>`).join('')}</div>`;}

function renderIntro(){
  stopTimer();
  const b=BY_KEY[S.order[S.stage]];
  const P=S.players;
  app.innerHTML=`<section class="interlude">
    ${beastSVG(b)}
    <div>
      ${S.order.length>1?pathHTML():''}

      <p>${esc(b.title)}. Questions come from the <b>${esc(SETS[b.key])}</b> pool (${TOPIC_COUNT[b.key]} questions).</p>

function heroHTML(k){
  const p=S.players[k], r=S.r, on=r&&r.sub!=='reveal'&&r.active===k;
  const canHint=p.hint&&r&&r.sub==='answer'&&r.active===k&&!r.hinted;
  const canPot=p.potion&&r&&r.sub!=='reveal'&&(alive(k))&&(S.players[1-k].hp<100||p.hp<100);
  return `<div class="hero-card p${k+1} ${on?'on':''} ${p.hp<=0?'ko':''}">

    </div></div>`;
}

function renderFight(){
  const r=S.r, q=byId[r.qid], b=BY_KEY[S.boss.key], rev=r.sub==='reveal';
  let chip='';
  if(r.sub==='answer') chip=`<span class="chip p${r.active+1}">${esc(S.names[r.active])} attacks</span>`;
  else if(r.sub==='assist') chip=`<span class="chip p${r.active+1}">${esc(S.names[r.active])} · assist for 10</span><span class="chip dash">${r.first>=0?`${LET[r.first]} was wrong`:'time ran out'}</span>`;
  const cls=i=>{ if(rev){ if(i===q.ans)return 'right'; if(r.wp.includes(i))return 'wrong'; if(r.out.includes(i))return 'out'; return '';} return r.out.includes(i)?'out':''; };
  const bossDown=S.boss.hp<=0, partyDown=!alive(0)&&!alive(1);
  let contLabel='Next question';
  if(bossDown) contLabel=S.stage+1>=S.order.length?'Claim victory':'Onward';
  else if(partyDown) contLabel='See results';
  const block=rev?`
    <div class="verdict ${r.ok?'good':'bad'}">
      <h3>${r.ok?'Hit':'Answer: '+LET[q.ans]}</h3>
      <p><b>${LET[q.ans]}. ${esc(q.opts[q.ans])}</b> — ${esc(q.why)}</p>
      <ul class="why">${q.wrong.map((w,i)=>w?`<li><b>${LET[i]}</b>${esc(w)}</li>`:'').join('')}</ul>
    </div>
    <div class="hy"><b>High-yield pearl</b>${esc(q.pearl)}</div>
    <div class="actions"><button class="btn" id="cont">${contLabel}</button><kbd>Enter</kbd><button class="btn ghost" id="quit">Leave the run</button></div>`
    :`<div class="actions"><span class="hint">Tap an answer or press <kbd>1</kbd>–<kbd>${q.opts.length}</kbd>. Items: <kbd>H</kbd> hint, <kbd>P</kbd> potion.</span></div>`;
  app.innerHTML=`<section style="display:flex;flex-direction:column;gap:12px">
    ${S.order.length>1?pathHTML():''}
    <div class="arena">
      ${heroHTML(0)}
      <div class="boss-card">
        <div class="pix">${esc(SETS[b.key])}${enraged()&&!bossDown?' · <span class="rage">enraged</span>':''}</div>
        <div class="bn">${esc(b.name)}</div>
        <div class="beast ${bossDown?'dead':''}">${beastSVG(b)}</div>
        <div class="bar boss"><i style="transform:scaleX(${S.boss.hp/S.boss.max})"></i></div>
        <div class="hpnum"><span>Boss HP</span><span>${S.boss.hp} / ${S.boss.max}</span></div>
        <div class="log">${esc(S.log)}</div>
      </div>
      ${heroHTML(1)}
    </div>
    ${S.timer&&!rev?`<div class="timer"><i></i></div>`:''}
    <div class="qpanel">
      <div class="qhead">${chip}${S.timer&&!rev?`<span class="pix" id="secs"></span>`:''}</div>
      <p class="stem">${esc(q.stem)}</p>
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt ${cls(i)}" data-i="${i}" ${rev||r.out.includes(i)?'disabled':''}><span class="lt"><span>${LET[i]}</span></span><span>${esc(o)}</span></button>`).join('')}</div>
      ${block}
    </div></section>`;
  app.querySelectorAll('.opt').forEach(e=>e.onclick=()=>answer(+e.dataset.i));
  app.querySelectorAll('[data-hint]').forEach(e=>e.onclick=()=>useHint(+e.dataset.hint));
  app.querySelectorAll('[data-pot]').forEach(e=>e.onclick=()=>usePotion(+e.dataset.pot));
  const c=document.getElementById('cont'); if(c){c.onclick=cont;c.focus({preventScroll:true});}
  const qt=document.getElementById('quit'); if(qt)qt.onclick=()=>{S.phase='end';S.won=false;S.fled=true;render();};
  paintTimer();
}

function renderEnd(){
  stopTimer();
  const P=S.players, beaten=S.stage;
  const head=S.won?'The arena is cleared':S.fled?'Retreat':'The party has fallen';
  const card=k=>{const p=P[k];return `<div class="card p${k+1}">
    <div class="pix">${esc(S.names[k])}</div>
    <div class="big">${p.dmg}</div><div class="pix">damage dealt</div>
    <div class="stats"><span>Correct <b>${p.right}/${p.seen}</b></span><span>Accuracy <b>${p.seen?Math.round(100*p.right/p.seen):0}%</b></span><span>Assists <b>${p.assists}</b></span></div>
    <div class="pix">Review list (${p.missed.length})</div>
    ${p.missed.length?`<ul class="missed">${p.missed.map(id=>{const q=byId[id];return `<li><span>${esc(SETS[q.set])}</span><b>${esc(q.opts[q.ans])}</b> — ${esc(q.pearl)}</li>`}).join('')}</ul>`:'<p class="hint">No misses.</p>'}
  </div>`};
  const mvp=P[0].dmg===P[1].dmg?'':` MVP: ${esc(S.names[P[0].dmg>P[1].dmg?0:1])}.`;
  app.innerHTML=`<section class="end">
    <div>${S.order.length>1?pathHTML():''}<div class="pix">${beaten} of ${S.order.length} boss${S.order.length>1?'es':''} defeated</div>
    <h2 class="${S.won?'win':'lose'}">${head}</h2><p class="hint">${S.won?'Every guardian is down.':'Study the review list and try again.'}${mvp}</p></div>
    <div class="cards">${card(0)}${card(1)}</div>
    <div class="actions"><button class="btn" id="again">Run it back</button><button class="btn ghost" id="setup">Change settings</button></div>
  </section>`;
  document.getElementById('again').onclick=begin;
  document.getElementById('setup').onclick=()=>{S.phase='setup';render();};
}

function render(){({setup:renderSetup,intro:renderIntro,fight:renderFight,end:renderEnd})[S.phase]();}

document.addEventListener('keydown',e=>{
  if(!S||e.target.tagName==='INPUT'||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(S.phase==='intro'&&k==='enter'&&document.activeElement.id!=='flee'){e.preventDefault();startBoss();return;}
  if(S.phase!=='fight'||!S.r)return;
  if(S.r.sub==='reveal'){ if(k==='enter'&&document.activeElement.id!=='quit'){e.preventDefault();cont();} return; }
  if(k==='h'){useHint(S.r.active);return;}
  if(k==='p'){usePotion(S.r.active);return;}
  const i='12345'.indexOf(k); if(i>=0&&i<byId[S.r.qid].opts.length){e.preventDefault();answer(i);}
});

function boot(data){
  S=(data&&data.S)||fresh();
  if(S.phase==='fight'&&S.r&&!byId[S.r.qid]){S=fresh();}
  if(S.phase==='fight'&&S.r&&S.r.sub!=='reveal'&&S.timer){S.r.deadline=Date.now()+S.r.total*1000;}
  render(); if(S.phase==='fight')startTimer();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
</body></html>
