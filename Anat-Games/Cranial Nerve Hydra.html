<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Cranial Nerve Hydra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=Silkscreen&display=swap">
<style>
/* Deliberately single-theme: a night-arena world. Every color is painted explicitly. */
:root{
  --ground:#17142B; --ground2:#120F22; --panel:#221D3F; --sunk:#1B1734; --line:#3A3366;
  --ink:#EEEAFB; --muted:#A39CC8;
  --p1:#FFB341; --p2:#3DD6C6; --boss:#FF4F8B; --heal:#6BD88E; --bad:#FF6B5B;
  --hy-bg:#3A3212; --hy-line:#D9AE2B; --hy-ink:#F7E6A6;
  --display:"Chakra Petch","Arial Narrow",sans-serif;
  --pix:"Silkscreen","Courier New",monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font:15px/1.55 var(--body);padding-inline:16px;padding-block:16px 40px;
  background-image:radial-gradient(ellipse 80% 50% at 50% 0%, #2A2352 0%, transparent 70%);background-attachment:fixed}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.pix{font-family:var(--pix);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.brand b{color:var(--boss)}

/* ---------- setup ---------- */
.setup{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:start}
.hero{display:flex;flex-direction:column;gap:14px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,6.4vw,74px);line-height:.92;margin:0;text-transform:uppercase;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--boss)}
.hero p{margin:0;color:var(--muted);max-width:54ch}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.foe{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:8px;display:flex;gap:8px;align-items:center}
.foe svg{width:44px;height:44px;flex:none}
.foe b{display:block;font-family:var(--display);font-size:13.5px;line-height:1.15}
.foe span{font-family:var(--pix);font-size:9.5px;color:var(--muted);text-transform:uppercase}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:6px;max-width:58ch}
.rules li{display:grid;grid-template-columns:92px 1fr;gap:10px;border-top:1px dashed var(--line);padding-top:6px;font-size:14px}
.rules b{font-family:var(--pix);font-size:11px;color:var(--p1);font-weight:400;padding-top:3px}
.form{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:16px}
.fl{display:flex;flex-direction:column;gap:6px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names input{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:9px 10px;border-left:5px solid var(--p1)}
.names input#p2name{border-left-color:var(--p2)}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{flex:1;min-width:72px;background:var(--sunk);border:0;border-right:1px solid var(--line);padding:9px 8px;font-size:14px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:600}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.picker button{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:7px 9px;text-align:left;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.picker button[aria-pressed="true"]{border-color:var(--boss);box-shadow:inset 3px 0 0 var(--boss)}
.picker em{font-style:normal;font-family:var(--pix);font-size:10px;color:var(--muted)}
.go{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase;background:var(--boss);color:#1a0610;border:0;border-radius:4px;padding:11px 16px}

/* ---------- arena ---------- */
.arena{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:12px;align-items:stretch}
.hero-card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;transition:box-shadow .2s,opacity .3s}
.hero-card.p1{--c:var(--p1)} .hero-card.p2{--c:var(--p2)}
.hero-card.on{box-shadow:0 0 0 2px var(--c),0 0 24px -4px var(--c)}
.hero-card.ko{opacity:.45}
.hero-card .nm{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.1;color:var(--c)}
.hero-card .role{font-family:var(--pix);font-size:10px;color:var(--muted);text-transform:uppercase}
.bar{height:14px;background:var(--ground2);border:1px solid var(--line);border-radius:3px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.bar.hp i{background:var(--heal)} .bar.hp.low i{background:var(--bad)}
.bar.boss{height:18px} .bar.boss i{background:linear-gradient(90deg,#B8265A,var(--boss))}
.hpnum{font-family:var(--pix);font-size:11px;display:flex;justify-content:space-between;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.abil{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.abil button{flex:1;min-width:90px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:6px 6px;font-size:12.5px;line-height:1.2}
.abil button small{display:block;font-family:var(--pix);font-size:9px;color:var(--muted)}
.abil button:disabled{opacity:.35;cursor:not-allowed}
.abil button:not(:disabled):hover{border-color:var(--c)}
.ko-tag{position:absolute;top:10px;right:10px;font-family:var(--pix);font-size:12px;color:var(--bad)}
.boss-card{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center}
.boss-card .bn{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;line-height:1;letter-spacing:.03em}
.boss-card .bt{font-size:12.5px;color:var(--muted)}
.beast{height:150px;display:grid;place-items:center}
.beast svg{display:block;height:150px;width:auto;max-width:100%;overflow:visible}
.beast.hit svg{animation:hit .45s}
.beast.atk svg{animation:atk .5s}
.beast.dead svg{animation:dead .9s forwards}
@keyframes hit{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px);filter:brightness(2.2)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
@keyframes atk{0%,100%{transform:scale(1)}40%{transform:scale(1.14) translateY(8px)}}
@keyframes dead{to{transform:translateY(20px) scale(.6);opacity:.1;filter:grayscale(1)}}
.rage{font-family:var(--pix);font-size:10.5px;color:var(--boss)}
.dmg{position:absolute;font-family:var(--display);font-weight:700;font-size:30px;pointer-events:none;animation:float 1s forwards;text-shadow:0 2px 0 #000}
@keyframes float{from{transform:translateY(0);opacity:1}to{transform:translateY(-44px);opacity:0}}
.timer{height:6px;background:var(--ground2);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--muted);transform-origin:left;transition:transform .25s linear}
.timer.warn i{background:var(--bad)}
.log{font-family:var(--pix);font-size:11px;color:var(--muted);min-height:16px;text-transform:uppercase;letter-spacing:.04em}
.log b{color:var(--ink);font-weight:400}

.qpanel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--pix);font-size:10.5px;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid var(--line)}
.chip.p1{background:var(--p1);color:#231500;border-color:var(--p1)}
.chip.p2{background:var(--p2);color:#032421;border-color:var(--p2)}
.chip.dash{border-style:dashed}
.stem{margin:0;font-size:16px;line-height:1.62;max-width:76ch}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:8px 12px}
.opt .lt{font-family:var(--display);font-weight:700;font-size:17px;width:28px;height:28px;border:1.5px solid var(--line);border-radius:3px;display:grid;place-items:center;transform:rotate(45deg)}
.opt .lt span{transform:rotate(-45deg)}
.opt:not(:disabled):hover{border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.out{opacity:.3;text-decoration:line-through}
.opt.right{border-color:var(--heal);background:#193326}
.opt.right .lt{background:var(--heal);border-color:var(--heal);color:#07210F}
.opt.wrong{border-color:var(--bad);background:#3A1A22}
.opt.wrong .lt{background:var(--bad);border-color:var(--bad);color:#2a0606}
.verdict{border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--sunk)}
.verdict h3{margin:0;font-family:var(--display);font-size:22px;text-transform:uppercase}
.verdict.good h3{color:var(--heal)} .verdict.bad h3{color:var(--bad)}
.verdict p{margin:0;max-width:76ch}
.why{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--muted)}
.why b{color:var(--ink);font-family:var(--pix);font-weight:400;margin-right:6px}
.hy{background:var(--hy-bg);border:1.5px solid var(--hy-line);color:var(--hy-ink);border-radius:4px;padding:9px 12px;font-size:14px}
.hy b{display:block;font-family:var(--pix);font-size:10px;font-weight:400;letter-spacing:.1em;text-transform:uppercase}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--ground);border:0;border-radius:4px;padding:10px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
kbd{font-family:var(--pix);font-size:10px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--muted)}

/* ---------- interlude / end ---------- */
.interlude{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px;display:grid;grid-template-columns:180px 1fr;gap:22px;align-items:center}
.interlude svg{width:100%;height:auto}
.interlude h2,.end h2{font-family:var(--display);font-weight:700;font-size:clamp(32px,5vw,54px);line-height:.95;margin:0 0 8px;text-transform:uppercase;text-wrap:balance}
.interlude p{margin:0 0 12px;color:var(--muted);max-width:60ch}
.path{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.path span{font-family:var(--pix);font-size:10px;padding:3px 7px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
.path span.done{color:var(--heal);border-color:var(--heal)}
.path span.now{color:var(--boss);border-color:var(--boss)}
.end{display:flex;flex-direction:column;gap:18px}
.end h2.win{color:var(--heal)} .end h2.lose{color:var(--bad)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card.p1{--c:var(--p1)} .card.p2{--c:var(--p2)}
.big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;color:var(--c)}
.missed{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.missed li{font-size:13.5px;border-left:3px solid var(--line);padding-left:9px}
.missed li span{display:block;font-family:var(--pix);font-size:9.5px;color:var(--muted);text-transform:uppercase}
.foot{font-family:var(--pix);font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px;text-transform:uppercase}
@media (max-width:860px){
  .setup,.cards,.interlude{grid-template-columns:1fr}
  .interlude svg{max-width:160px}
  .arena{grid-template-columns:1fr 1fr}
  .boss-card{grid-column:1 / -1;order:-1}
  .beast{height:110px}.beast svg{height:110px}
  .names,.picker{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
const SETS={"neck": "The Neck", "face": "Face, Scalp & ITF", "cranial": "Skull, Meninges & Foramina", "orbit": "Orbit & Eye Reflexes", "nasal_oral": "Nose, Pharynx, Palate & Oral Cavity", "larynx": "Larynx", "cn": "Cranial Nerve Lesions"};
const Q=[{"id": "BC-1", "stem": "A 27-year-old man presents with drooping of the upper eyelid (ptosis), a dilated pupil, and difficulty focusing on near objects. He also has an internal strabismus (medial deviation of the eye) and cannot look inferiorly when the eye is adducted. Which of the following is the most likely cause?", "opts": ["Lesion in the medulla", "Tumor in the optic canal", "Thrombosis in the cavernous sinus", "Lesion of the olfactory nerve", "Fracture of the foramen spinosum"], "ans": 2, "why": "The findings combine CN III (ptosis, mydriasis, lost accommodation), CN IV (can't look down in adduction), and CN VI (medial deviation) deficits. All three nerves travel through the cavernous sinus, so a single thrombosis there explains everything.", "wrong": ["The medulla houses nuclei for CN IX, X, and XII, not III, IV, VI.", "Optic canal tumor affects the optic nerve and ophthalmic artery.", "", "Olfactory nerve lesion causes anosmia only.", "Foramen spinosum fracture injures the middle meningeal artery."], "pearl": "Multiple ocular motor palsies (III, IV, VI) together = think cavernous sinus.", "set": "cranial"}, {"id": "BC-2", "stem": "A 16-year-old boy presents with double vision. Examination shows difficulty turning his eye inferolaterally and trouble going down stairs. Which of the following nerves is most likely damaged?", "opts": ["Oculomotor nerve", "Optic nerve", "Ophthalmic nerve", "Trochlear nerve", "Abducens nerve"], "ans": 3, "why": "The trochlear nerve supplies the superior oblique, which moves the eye down and out. Its paralysis causes vertical diplopia that is worst when looking down, such as descending stairs.", "wrong": ["CN III palsy gives ptosis, mydriasis, and a down-and-out eye.", "Optic nerve lesion causes blindness, not diplopia.", "V1 is sensory to the forehead/upper face; no eye movement.", "", "CN VI palsy causes medial deviation (internal strabismus)."], "pearl": "Trouble walking down stairs + vertical diplopia = CN IV (superior oblique).", "set": "orbit"}, {"id": "BC-3", "stem": "A 31-year-old man with a penetrating injury to the posterior triangle of the neck cannot shrug his shoulder or turn his head to the opposite side. Which of the following nerves is most likely damaged?", "opts": ["Trigeminal nerve", "Facial nerve", "Glossopharyngeal nerve", "Accessory nerve", "Hypoglossal nerve"], "ans": 3, "why": "The spinal accessory nerve crosses the posterior cervical triangle superficially and innervates the trapezius (shoulder shrug) and sternocleidomastoid (turns head to the opposite side).", "wrong": ["Trigeminal nerve supplies facial sensation and muscles of mastication.", "Facial nerve supplies muscles of facial expression.", "CN IX supplies stylopharyngeus and posterior-tongue taste.", "", "Hypoglossal nerve moves the tongue."], "pearl": "CN XI is superficial in the posterior triangle - easily injured (e.g., lymph node biopsy).", "set": "neck"}, {"id": "BC-4", "stem": "A 23-year-old woman sustains a fracture through the jugular foramen in a car accident. Which of the following nerves is/are most likely damaged?", "opts": ["Cranial nerve V2", "Cranial nerve VI", "Cranial nerves VII and VIII", "Cranial nerves IX, X, and XI", "Cranial nerve XII"], "ans": 3, "why": "CN IX, X, and XI leave the skull through the jugular foramen together with the internal jugular vein.", "wrong": ["V2 exits via foramen rotundum.", "CN VI enters the orbit via the superior orbital fissure.", "CN VII and VIII use the internal acoustic meatus.", "", "CN XII exits via the hypoglossal canal."], "pearl": "Jugular foramen = CN IX, X, XI + IJV (jugular foramen syndrome).", "set": "cranial"}, {"id": "BC-5", "stem": "A 17-year-old boy sustains a penetrating injury to the neck that damages the cervical sympathetic chain. Which of the following findings is most likely?", "opts": ["Internal strabismus", "Trouble going down stairs", "Constricted pupil", "Inability to close the eye", "Deviation of the tongue toward the side of the lesion"], "ans": 2, "why": "Cervical sympathetic fibers supply the dilator pupillae; interrupting them leaves the sphincter unopposed, producing miosis as part of Horner syndrome.", "wrong": ["Internal strabismus reflects an abducens (CN VI) lesion.", "Difficulty descending stairs reflects a trochlear (CN IV) lesion.", "", "Inability to close the eye reflects a facial nerve lesion.", "Tongue deviation toward the lesion reflects a hypoglossal lesion."], "pearl": "Cervical sympathetic injury = Horner: ptosis, miosis, anhidrosis.", "set": "neck"}, {"id": "BC-6", "stem": "A 28-year-old woman complains of difficulty swallowing. Examination reveals no taste sensation on the posterior one-third of her tongue and absent secretion from the parotid gland. Which of the following would most likely cause this condition?", "opts": ["Fracture of the mandibular canal", "Section of the zygomatic nerve", "Glossopharyngeal nerve injury", "Tumor in the pituitary gland", "Lesion of the hypoglossal nerve"], "ans": 2, "why": "CN IX supplies the stylopharyngeus (swallowing), general and taste sensation to the posterior third of the tongue, and parasympathetic fibers (via lesser petrosal/otic ganglion) to the parotid.", "wrong": ["Inferior alveolar injury causes numbness of lower teeth and chin.", "Zygomatic nerve section impairs lacrimal secretion.", "", "Pituitary tumor compresses the chiasm, causing bitemporal hemianopia.", "Hypoglossal lesion causes tongue deviation, not taste or parotid loss."], "pearl": "Posterior 1/3 taste + parotid secretion + stylopharyngeus = CN IX.", "set": "cn"}, {"id": "BC-7", "stem": "A 34-year-old man in a bar fight suffers a knife wound that severs the abducens nerve proximal to its entrance into the orbit. Which of the following conditions results from this injury?", "opts": ["Ptosis of the upper eyelid", "Loss of the ability to dilate the pupil", "External strabismus (lateral deviation)", "Loss of visual accommodation", "Internal strabismus (medial deviation)"], "ans": 4, "why": "CN VI innervates the lateral rectus. Without it, the medial rectus pulls the eye medially, causing internal strabismus and horizontal diplopia.", "wrong": ["Ptosis follows CN III or sympathetic lesions.", "Inability to dilate the pupil follows sympathetic injury.", "External strabismus follows medial rectus (CN III) paralysis.", "Accommodation loss follows parasympathetic (CN III/ciliary) injury.", ""], "pearl": "CN VI lesion = eye deviates medially (esotropia), can't abduct.", "set": "orbit"}, {"id": "BC-8", "stem": "After radical resection of a primary tongue tumor, a 72-year-old patient has lost general sensation on the anterior two-thirds of the tongue. This is most likely due to injury to branches of which of the following nerves?", "opts": ["Trigeminal nerve", "Facial nerve", "Glossopharyngeal nerve", "Vagus nerve", "Hypoglossal nerve"], "ans": 0, "why": "General sensation of the anterior two-thirds of the tongue travels in the lingual nerve, a branch of V3.", "wrong": ["", "Facial nerve (chorda tympani) carries only taste to the anterior 2/3.", "CN IX supplies the posterior 1/3 of the tongue.", "Vagus supplies the epiglottic region via the internal laryngeal nerve.", "Hypoglossal is purely motor to tongue muscles."], "pearl": "Anterior 2/3 tongue: general sensation = V3 (lingual); taste = VII (chorda tympani).", "set": "nasal_oral"}, {"id": "BC-10", "stem": "A patient can move his eyeballs normally and see distant objects clearly but cannot focus on near objects. This condition may indicate damage to which of the following structures?", "opts": ["Ciliary ganglion and oculomotor nerve", "Oculomotor nerve and long ciliary nerve", "Short ciliary nerves and ciliary ganglion", "Superior cervical ganglion and long ciliary nerve", "Oculomotor, trochlear, and abducens nerves"], "ans": 2, "why": "Accommodation depends on postganglionic parasympathetic fibers from the ciliary ganglion traveling in short ciliary nerves to the ciliary muscle. Normal eye movements show CN III itself is intact.", "wrong": ["Eye movements are normal, so the oculomotor nerve is intact.", "CN III is intact, and long ciliary nerves carry sympathetic fibers.", "", "Sympathetic pathway controls pupil dilation, not accommodation.", "Normal eye movements rule out lesions of III, IV, and VI."], "pearl": "Accommodation: CN III preganglionic -> ciliary ganglion -> short ciliary nn. -> ciliary muscle.", "set": "orbit"}, {"id": "BC-11", "stem": "A 32-year-old woman has a hoarse voice, and her uvula deviates to the left on phonation. Which of the following nerves is most likely damaged?", "opts": ["Right trigeminal nerve", "Left trigeminal nerve", "Right vagus nerve", "Left vagus nerve", "Left glossopharyngeal nerve"], "ans": 2, "why": "The vagus supplies the musculus uvulae and laryngeal muscles. With a vagal lesion, the uvula is pulled away from the lesion side, so leftward deviation means the right vagus is injured; hoarseness reflects laryngeal paralysis.", "wrong": ["Trigeminal nerve does not supply the uvula or larynx.", "Trigeminal nerve does not supply the uvula or larynx.", "", "A left vagal lesion would deviate the uvula to the right.", "CN IX does not supply uvular or laryngeal muscles."], "pearl": "Uvula deviates AWAY from the side of the vagal lesion (tongue deviates TOWARD a CN XII lesion).", "set": "cn"}, {"id": "BC-12", "stem": "After a penetrating injury in the submandibular triangle, the tongue of a 45-year-old patient deviates to the left on protrusion. Which of the following nerves is injured?", "opts": ["Right lingual nerve", "Left lingual nerve", "Right hypoglossal nerve", "Left hypoglossal nerve", "Left glossopharyngeal nerve"], "ans": 3, "why": "A hypoglossal lesion weakens the ipsilateral genioglossus, so the intact side pushes the tongue toward the injured side. Leftward deviation means the left CN XII is damaged.", "wrong": ["Lingual nerve is sensory; no tongue motor function.", "Lingual nerve is sensory; no tongue motor function.", "Right CN XII lesion would deviate the tongue to the right.", "", "CN IX does not supply tongue muscles."], "pearl": "Tongue 'licks the lesion' - deviates toward the injured CN XII.", "set": "nasal_oral"}, {"id": "BC-13", "stem": "A 47-year-old man cannot move his eyeball laterally. Which of the following conditions would cause this sign?", "opts": ["Tumor of the pituitary gland", "Occlusion of the posterior cerebral artery", "Infection in the maxillary sinus", "Infection in the cavernous sinus", "Tumor in the anterior cranial fossa"], "ans": 3, "why": "The abducens nerve runs through the middle of the cavernous sinus beside the internal carotid artery, making it the most vulnerable nerve to cavernous sinus infection or thrombosis.", "wrong": ["Pituitary tumors classically compress the chiasm (bitemporal hemianopia).", "PCA occlusion affects occipital cortex and midbrain, not CN VI in isolation.", "Maxillary sinus infection does not reach CN VI.", "", "Anterior cranial fossa tumors affect olfaction/frontal lobe, not CN VI."], "pearl": "CN VI lies free within the cavernous sinus - often the first nerve affected.", "set": "cranial"}, {"id": "BC-14", "stem": "A young boy with a long-standing tooth abscess suffers damage to the lingual nerve as it enters the oral cavity. Which of the following structures contain the cell bodies of the injured sensory nerve fibers?", "opts": ["Geniculate and otic ganglia", "Trigeminal and submandibular ganglia", "Trigeminal and dorsal root ganglia", "Geniculate and trigeminal ganglia", "Geniculate and pterygopalatine ganglia"], "ans": 3, "why": "Distal to its union with the chorda tympani, the lingual nerve carries general sensory fibers (cell bodies in the trigeminal ganglion) and taste fibers (cell bodies in the geniculate ganglion).", "wrong": ["Otic ganglion is parasympathetic to the parotid; no lingual fibers.", "Submandibular ganglion is autonomic, not a sensory cell-body site.", "Dorsal root ganglia belong to spinal nerves.", "", "Pterygopalatine ganglion serves lacrimal/nasal/palatal glands."], "pearl": "Lingual n. (after chorda joins): general sensation = trigeminal ganglion; taste = geniculate ganglion.", "set": "nasal_oral"}, {"id": "BC-16", "stem": "A 20-year-old guard blinks when a strong wind hits the cornea of his eye. The afferent fibers of the corneal reflex arc are carried by which of the following nerves?", "opts": ["Optic nerve", "Lacrimal nerve", "Nasociliary nerve", "Zygomatic nerve", "Oculomotor nerve"], "ans": 2, "why": "Corneal sensation travels in the long ciliary branches of the nasociliary nerve (V1), forming the afferent limb; the facial nerve closes the eye as the efferent limb.", "wrong": ["Optic nerve is the afferent limb of the pupillary light reflex.", "Lacrimal nerve supplies the lateral upper eyelid and gland, not the cornea.", "", "Zygomatic nerve (V2) supplies lateral face skin.", "CN III opens the eye; it is not part of the corneal reflex."], "pearl": "Corneal reflex: afferent V1 (nasociliary) -> efferent VII (orbicularis oculi).", "set": "orbit"}, {"id": "BC-17", "stem": "A 71-year-old man has a benign tumor in the pterygoid canal. Which of the following nerve fibers could be injured by this condition?", "opts": ["Preganglionic parasympathetic fibers", "Taste fibers from the epiglottis", "Somatic afferent (SA) fibers", "Preganglionic sympathetic fibers", "Branchiomeric muscle fibers"], "ans": 0, "why": "The nerve of the pterygoid canal (Vidian nerve) is formed by the greater petrosal nerve (preganglionic parasympathetic plus palatal taste) and the deep petrosal nerve (postganglionic sympathetic), heading to the pterygopalatine ganglion.", "wrong": ["", "Epiglottic taste travels with the internal laryngeal nerve (CN X).", "Vidian nerve carries visceral, not somatic, afferents.", "Its sympathetic fibers are postganglionic (deep petrosal), not preganglionic.", "It carries no branchial motor fibers."], "pearl": "Vidian nerve = greater petrosal (pre-parasympathetic) + deep petrosal (post-sympathetic).", "set": "nasal_oral"}, {"id": "BC-18", "stem": "A 22-year-old patient has dryness of the corneal surface of his eye because of a lack of tears. Which of the following nerves may be damaged?", "opts": ["Proximal portion of the lacrimal nerve", "Zygomatic branch of the facial nerve", "Lesser petrosal nerve", "Greater petrosal nerve", "Deep petrosal nerve"], "ans": 3, "why": "Lacrimal secretomotor fibers leave CN VII in the greater petrosal nerve, travel through the pterygoid canal to synapse in the pterygopalatine ganglion, then reach the gland via zygomatic and the terminal lacrimal nerve.", "wrong": ["Only the terminal portion of the lacrimal nerve carries the secretomotor fibers.", "Zygomatic branch of CN VII is motor to facial muscles.", "Lesser petrosal nerve serves the parotid gland.", "", "Deep petrosal nerve carries postganglionic sympathetic fibers."], "pearl": "Tears: CN VII -> greater petrosal -> pterygopalatine ganglion -> zygomatic -> lacrimal n.", "set": "orbit"}, {"id": "BC-19", "stem": "A 31-year-old hockey player is hit in the head by a puck. His radiograph shows a fracture involving the foramen rotundum. Which of the following nerves would be damaged?", "opts": ["Ophthalmic nerve", "Mandibular nerve", "Maxillary nerve", "Optic nerve", "Trochlear nerve"], "ans": 2, "why": "The maxillary division of the trigeminal nerve (V2) exits the middle cranial fossa through the foramen rotundum into the pterygopalatine fossa.", "wrong": ["V1 passes through the superior orbital fissure.", "V3 passes through the foramen ovale.", "", "Optic nerve passes through the optic canal.", "CN IV passes through the superior orbital fissure."], "pearl": "V1 = SOF, V2 = rotundum, V3 = ovale ('Standing Room Only').", "set": "cranial"}, {"id": "BC-21", "stem": "A 24-year-old man falls from his motorcycle and lands in a creek. Bilateral severance of which of the following nerves may result in death?", "opts": ["Trigeminal nerve", "Facial nerve", "Vagus nerve", "Spinal accessory nerve", "Hypoglossal nerve"], "ans": 2, "why": "Cutting both vagus nerves paralyzes laryngeal and pharyngeal muscles (airway compromise) and removes reflex cardiovascular and GI control, which can be fatal.", "wrong": ["Bilateral trigeminal loss impairs chewing/sensation but is not lethal.", "Bilateral facial palsy is disfiguring but not lethal.", "", "Bilateral CN XI loss weakens SCM/trapezius only.", "Bilateral CN XII loss impairs tongue movement but is not typically lethal."], "pearl": "Bilateral vagal injury -> bilateral vocal cord paralysis/airway obstruction - life-threatening.", "set": "cn"}, {"id": "BC-23", "stem": "The pharyngeal (gag) reflex is contraction of the pharyngeal constrictor muscles elicited by touching the back of the pharynx (e.g., with a tongue depressor). The afferent fibers that innervate the pharyngeal mucosa for this reflex are branches of which of the following nerves?", "opts": ["Trigeminal nerve", "Facial nerve", "Glossopharyngeal nerve", "Vagus nerve", "Hypoglossal nerve"], "ans": 2, "why": "Pharyngeal branches of CN IX carry sensation from the oropharyngeal mucosa and form the afferent limb of the gag reflex; CN X provides the motor (efferent) limb.", "wrong": ["Trigeminal nerve is not part of the gag reflex.", "Facial nerve is not part of the gag reflex.", "", "Vagus is the efferent limb, not the afferent.", "Hypoglossal nerve is not part of the gag reflex."], "pearl": "Gag reflex: afferent IX, efferent X.", "set": "nasal_oral"}, {"id": "BH-1", "stem": "A 38-year-old man undergoes thyroid surgery for papillary carcinoma. The external laryngeal nerve, which accompanies the superior thyroid artery, is damaged during the operation. This injury would most severely impair which of the following functions?", "opts": ["Relaxing the vocal cords", "Rotating the arytenoid cartilages", "Tensing the vocal cords", "Widening the rima glottidis", "Abducting the vocal cords"], "ans": 2, "why": "The external laryngeal nerve supplies the cricothyroid, the main tensor of the vocal cords; losing it produces a weak, monotone voice that cannot reach high pitch.", "wrong": ["Relaxation is mainly by thyroarytenoid/posterior vocalis (recurrent laryngeal n.).", "Arytenoid rotation is by the cricoarytenoid muscles (recurrent laryngeal n.).", "", "Rima widening is by posterior cricoarytenoid (recurrent laryngeal n.).", "Abduction is solely by posterior cricoarytenoid (recurrent laryngeal n.)."], "pearl": "External laryngeal n. (with superior thyroid a.) -> cricothyroid -> vocal cord tension/pitch.", "set": "larynx"}, {"id": "BH-2", "stem": "A 27-year-old woman with a goiter is scheduled for surgical resection. The surgeon must ligate the superior laryngeal artery before resecting the goiter, so care must be taken to avoid injury to which of the following nerves?", "opts": ["External laryngeal nerve", "Internal laryngeal nerve", "Superior laryngeal nerve", "Hypoglossal nerve", "Vagus nerve"], "ans": 1, "why": "The internal laryngeal nerve travels with the superior laryngeal artery as both pierce the thyrohyoid membrane.", "wrong": ["External laryngeal nerve travels with the superior thyroid artery.", "", "The parent superior laryngeal nerve divides before reaching this artery.", "Hypoglossal nerve runs higher, above the hyoid.", "Vagus lies in the carotid sheath, not with this artery."], "pearl": "Internal laryngeal n. + superior laryngeal a. pierce the thyrohyoid membrane together.", "set": "larynx"}, {"id": "BH-3", "stem": "A 19-year-old woman complains of numbness of the nasopharynx after surgical removal of the adenoids. A lesion of which of the following nerves would be expected?", "opts": ["Maxillary nerve", "Superior cervical ganglion", "External laryngeal nerve", "Glossopharyngeal nerve", "Vagus nerve"], "ans": 3, "why": "Sensory innervation of the upper pharyngeal mucosa is provided by CN IX via the pharyngeal plexus; the vagus covers the lower pharynx and larynx.", "wrong": ["V2 supplies nasal mucosa and palate, not the pharyngeal wall per the book.", "Superior cervical ganglion contributes sympathetics with no afferent fibers.", "External laryngeal nerve is motor to cricothyroid and inferior constrictor.", "", "Vagus supplies sensation to the lower pharynx and larynx."], "pearl": "Pharyngeal sensation = CN IX (upper) / CN X (lower); pharyngeal motor = CN X.", "set": "nasal_oral"}, {"id": "BH-4", "stem": "During neck surgery for squamous cell carcinoma in a 56-year-old man, the surgeon notices profuse bleeding from the deep cervical artery. Which of the following arteries should be ligated to stop the bleeding?", "opts": ["Inferior thyroid artery", "Transverse cervical artery", "Thyrocervical trunk", "Costocervical trunk", "Ascending cervical artery"], "ans": 3, "why": "The deep cervical artery is a branch of the costocervical trunk (along with the superior intercostal artery), so ligating the trunk controls it.", "wrong": ["Inferior thyroid artery comes from the thyrocervical trunk.", "Transverse cervical artery is a thyrocervical branch, not a source of deep cervical.", "Thyrocervical trunk gives inferior thyroid, transverse cervical, and suprascapular.", "", "Ascending cervical artery is a branch of the inferior thyroid artery."], "pearl": "Costocervical trunk -> deep cervical + superior intercostal arteries.", "set": "neck"}, {"id": "BH-5", "stem": "A 17-year-old boy injures his phrenic nerve in a knife wound to the neck. The damaged nerve has which of the following relationships in the neck?", "opts": ["Anterior to the subclavian vein", "Posterior to the subclavian artery", "Deep to the brachial plexus", "Medial to the common carotid artery", "Superficial to the anterior scalene muscle"], "ans": 4, "why": "The phrenic nerve (C3-C5) descends on the anterior surface of the anterior scalene, then enters the thorax between the subclavian vein (in front) and artery (behind).", "wrong": ["It passes posterior to the subclavian vein.", "It passes anterior to the subclavian artery.", "The brachial plexus lies deep (posterior) to the anterior scalene.", "It lies lateral to the common carotid artery.", ""], "pearl": "Phrenic n. rides on the anterior scalene; brachial plexus and subclavian a. pass behind it.", "set": "neck"}, {"id": "BH-6", "stem": "A 45-year-old woman has numbness over the tip of her nose. Which of the following nerves is most likely damaged?", "opts": ["Ophthalmic division of the trigeminal nerve", "Maxillary division of the trigeminal nerve", "Mandibular division of the trigeminal nerve", "Facial nerve", "Auriculotemporal nerve"], "ans": 0, "why": "The skin of the nasal tip is supplied by the external nasal branch of the anterior ethmoidal nerve, a branch of nasociliary from V1.", "wrong": ["", "V2 supplies skin between lower eyelid and upper lip, including the side of the nose.", "V3 supplies the lower face below the lower lip/jaw.", "Facial nerve is motor to facial muscles and gives no facial skin sensation.", "Auriculotemporal (V3) supplies the auricle and temporal scalp."], "pearl": "Nasal tip = V1 (external nasal n.) - Hutchinson sign in zoster.", "set": "face"}, {"id": "BH-7", "stem": "A 26-year-old singer sees an ENT surgeon for changes in her voice. Laryngoscopy shows a lesion of the superior laryngeal nerve. This causes weakness of which of the following muscles?", "opts": ["Inferior pharyngeal constrictor", "Middle pharyngeal constrictor", "Superior pharyngeal constrictor", "Thyroarytenoid", "Thyrohyoid"], "ans": 0, "why": "The external branch of the superior laryngeal nerve supplies both the cricothyroid and part of the inferior pharyngeal constrictor.", "wrong": ["", "Middle constrictor is supplied by the vagal pharyngeal plexus.", "Superior constrictor is supplied by the vagal pharyngeal plexus.", "Thyroarytenoid is supplied by the recurrent (inferior) laryngeal nerve.", "Thyrohyoid is supplied by C1 fibers carried with CN XII."], "pearl": "External laryngeal n. = cricothyroid + inferior pharyngeal constrictor.", "set": "larynx"}, {"id": "BH-8", "stem": "A 44-year-old man with 'crocodile tears syndrome' has spontaneous lacrimation during eating due to misdirection of regenerating autonomic nerve fibers. Which of the following nerves was injured?", "opts": ["Facial nerve proximal to the geniculate ganglion", "Auriculotemporal nerve", "Chorda tympani in the infratemporal fossa", "Facial nerve at the stylomastoid foramen", "Lacrimal nerve"], "ans": 0, "why": "After injury proximal to the geniculate ganglion, regrowing salivary parasympathetic fibers are misrouted into the greater petrosal pathway to the lacrimal gland, so eating triggers tearing.", "wrong": ["", "Auriculotemporal injury causes Frey syndrome (gustatory sweating).", "Chorda tympani distal injury would not reroute fibers to the lacrimal gland.", "At the stylomastoid foramen the nerve has already lost its parasympathetic fibers.", "Lacrimal nerve injury reduces tearing; it doesn't create gustatory lacrimation."], "pearl": "Crocodile tears = aberrant CN VII regeneration proximal to geniculate; Frey = auriculotemporal.", "set": "cn"}, {"id": "BH-9", "stem": "A young girl complains of dryness of the nose and palate. This would indicate a lesion of which of the following ganglia?", "opts": ["Nodose ganglion", "Otic ganglion", "Pterygopalatine ganglion", "Submandibular ganglion", "Ciliary ganglion"], "ans": 2, "why": "Postganglionic parasympathetic fibers from the pterygopalatine ganglion supply the mucous glands of the nasal cavity and palate (and the lacrimal gland).", "wrong": ["Nodose (inferior vagal) ganglion is sensory.", "Otic ganglion supplies the parotid gland.", "", "Submandibular ganglion supplies submandibular and sublingual glands.", "Ciliary ganglion supplies the ciliary muscle and sphincter pupillae."], "pearl": "Pterygopalatine ganglion = 'hay fever ganglion': lacrimal, nasal, palatal glands.", "set": "nasal_oral"}, {"id": "BH-10", "stem": "A 33-year-old woman develops Bell palsy and is warned that she may develop corneal inflammation and ulceration. This risk results from which of the following?", "opts": ["Sensory loss of the cornea and conjunctiva", "Lack of secretion of the parotid gland", "Absence of the corneal blink reflex", "Absence of sweating on the face", "Inability to constrict the pupil"], "ans": 2, "why": "Facial palsy paralyzes the orbicularis oculi, the efferent limb of the corneal blink reflex, so the eye cannot close to protect the cornea.", "wrong": ["Corneal sensation is V1, which is intact in Bell palsy.", "Parotid secretion depends on CN IX (lesser petrosal).", "", "Facial sweating is sympathetic.", "Pupillary constriction depends on CN III parasympathetics."], "pearl": "Bell palsy: can't close eye -> exposure keratitis; protect the cornea.", "set": "face"}, {"id": "BH-11", "stem": "A 39-year-old woman with headache and dizziness has an infection of a dural venous sinus. The infected sinus lies in the attached margin of the tentorium cerebelli and runs from the posterior end of the cavernous sinus to the transverse sinus. Which sinus is affected?", "opts": ["Straight sinus", "Inferior sagittal sinus", "Sphenoparietal sinus", "Superior petrosal sinus", "Cavernous sinus"], "ans": 3, "why": "The superior petrosal sinus runs along the petrous ridge in the attached edge of the tentorium, linking the cavernous sinus to the transverse sinus.", "wrong": ["Straight sinus lies at the junction of falx cerebri and tentorium.", "Inferior sagittal sinus lies in the free edge of the falx cerebri.", "Sphenoparietal sinus follows the lesser wing of the sphenoid.", "", "Cavernous sinus sits beside the sella turcica."], "pearl": "Superior petrosal sinus: cavernous -> transverse, along the petrous ridge.", "set": "cranial"}, {"id": "BH-12", "stem": "A 25-year-old man hits his head on a concrete bridge wall in a car accident. CT shows rupture of the middle meningeal artery with the meninges intact. Blood leaking from this artery enters which of the following spaces?", "opts": ["Subarachnoid space", "Subdural space", "Epidural space", "Subpial space", "Cranial dural sinuses"], "ans": 2, "why": "The middle meningeal artery runs between the skull and the periosteal dura, so its rupture strips the dura from bone to form an epidural hematoma.", "wrong": ["Subarachnoid bleeding comes from cerebral vessels/aneurysms.", "Subdural hematoma comes from torn bridging veins.", "", "Subpial bleeding comes from small pial/brain vessels.", "Dural sinuses carry venous blood, not arterial leakage."], "pearl": "Pterion fracture -> middle meningeal a. -> epidural hematoma (lucid interval, biconvex).", "set": "cranial"}, {"id": "BH-13", "stem": "A 67-year-old woman complains of visual loss. MRI shows an enlarged pituitary gland in the sella turcica. The sella lies immediately posterior and superior to which of the following structures?", "opts": ["Frontal sinus", "Maxillary sinus", "Ethmoid air cells", "Mastoid air cells", "Sphenoid sinus"], "ans": 4, "why": "The hypophyseal fossa sits on the body of the sphenoid, directly above and behind the sphenoid sinus - the basis for transsphenoidal pituitary surgery.", "wrong": ["Frontal sinus is in the frontal bone, far anterior.", "Maxillary sinus lies lateral to the nasal cavity, below the orbit.", "Ethmoid cells lie between the orbit and nasal cavity.", "Mastoid air cells are in the temporal bone.", ""], "pearl": "Sella turcica sits on top of the sphenoid sinus - transsphenoidal approach.", "set": "cranial"}, {"id": "BH-14", "stem": "After a tonsillectomy, a 57-year-old man with a long history of chewing tobacco cannot detect taste on the posterior one-third of his tongue. Which nerve was most likely injured?", "opts": ["Internal laryngeal nerve", "Lingual nerve", "Glossopharyngeal nerve", "Greater palatine nerve", "Chorda tympani"], "ans": 2, "why": "The lingual branch of CN IX, which runs in the tonsillar bed, carries both taste and general sensation from the posterior third of the tongue.", "wrong": ["Internal laryngeal nerve supplies the epiglottic region.", "Lingual nerve provides general sensation to the anterior 2/3.", "", "Greater palatine nerve supplies the hard palate.", "Chorda tympani carries taste from the anterior 2/3."], "pearl": "CN IX lies in the tonsillar bed - at risk in tonsillectomy.", "set": "nasal_oral"}, {"id": "BH-15", "stem": "A 14-year-old boy hits his head on the road after falling from his skateboard. Radiographs show damage to the sella turcica. Which bone is fractured?", "opts": ["Frontal bone", "Ethmoid bone", "Temporal bone", "Basioccipital bone", "Sphenoid bone"], "ans": 4, "why": "The sella turcica is part of the body of the sphenoid bone, sitting above the sphenoid sinus.", "wrong": ["Frontal bone forms the forehead and anterior fossa floor.", "Ethmoid forms the cribriform plate, not the sella.", "Temporal bone forms the lateral skull and petrous ridge.", "Basioccipital (clivus) lies posterior-inferior to the sella.", ""], "pearl": "Sella turcica = sphenoid body.", "set": "cranial"}, {"id": "BH-16", "stem": "The nerve accompanying the superior thyroid artery may be damaged during thyroid surgery. Which functional defect may result?", "opts": ["Loss of sensation above the vocal cord", "Loss of lateral rotation of the arytenoid cartilages", "Paralysis of the vocalis muscle", "Lack of abduction of the vocal cord", "Decreased tension of the vocal cord"], "ans": 4, "why": "The external laryngeal nerve travels with the superior thyroid artery and supplies the cricothyroid; its loss reduces vocal cord tension.", "wrong": ["Supraglottic sensation is the internal laryngeal nerve.", "Lateral rotation of the arytenoid is posterior cricoarytenoid (recurrent laryngeal).", "Vocalis is supplied by the recurrent laryngeal nerve.", "Abduction loss reflects posterior cricoarytenoid paralysis.", ""], "pearl": "Superior thyroid a. <-> external laryngeal n.; inferior thyroid a. <-> recurrent laryngeal n.", "set": "larynx"}, {"id": "BH-17", "stem": "A 37-year-old patient has an infection of the dural venous sinus closest to the pituitary gland with secondary thrombus formation. Which is the most likely site?", "opts": ["Straight sinus", "Cavernous sinus", "Superior petrosal sinus", "Sigmoid sinus", "Confluence of sinuses"], "ans": 1, "why": "The cavernous sinuses flank the sella turcica and pituitary; cavernous sinus thrombophlebitis can cause ophthalmoplegia, exophthalmos, and papilledema.", "wrong": ["Straight sinus lies at the falx-tentorium junction, far posterior.", "", "Superior petrosal sinus lies along the petrous ridge.", "Sigmoid sinus lies in the posterior cranial fossa.", "Confluence lies at the internal occipital protuberance."], "pearl": "Cavernous sinus = lateral to pituitary; danger-triangle infections spread here.", "set": "cranial"}, {"id": "BH-18", "stem": "A young singer complains of vocal difficulties. On examination, she cannot abduct her vocal cords during quiet breathing. Which muscle is most likely paralyzed?", "opts": ["Vocalis muscle", "Cricothyroid muscle", "Oblique arytenoid muscle", "Posterior cricoarytenoid muscle", "Thyroarytenoid muscle"], "ans": 3, "why": "The posterior cricoarytenoid is the only abductor of the vocal cords, rotating the vocal processes laterally to open the rima glottidis.", "wrong": ["Vocalis adjusts tension of the cord.", "Cricothyroid tenses the cords.", "Oblique arytenoid adducts/closes the inlet.", "", "Thyroarytenoid relaxes/shortens the cords."], "pearl": "Posterior cricoarytenoid: the ONLY abductor ('pull apart').", "set": "larynx"}, {"id": "BH-19", "stem": "A 71-year-old woman repeatedly chokes while eating due to swallowing difficulty. Which pair of muscles is most instrumental in preventing food from entering the larynx and trachea during swallowing?", "opts": ["Sternohyoid and sternothyroid muscles", "Oblique arytenoid and aryepiglottic muscles", "Inferior pharyngeal constrictor and thyrohyoid muscles", "Levator veli palatini and tensor veli palatini muscles", "Musculus uvulae and geniohyoid muscles"], "ans": 1, "why": "The oblique arytenoid and aryepiglottic muscles draw the arytenoids together and tighten the aryepiglottic folds, acting as a sphincter of the laryngeal inlet during swallowing.", "wrong": ["Infrahyoid strap muscles depress the larynx and hyoid.", "", "Cricopharyngeus prevents air entering the esophagus; thyrohyoid only elevates larynx.", "Palatal muscles seal the nasopharynx, not the larynx.", "These elevate the uvula and hyoid; they don't close the inlet."], "pearl": "Laryngeal inlet sphincter = oblique arytenoids + aryepiglottic muscles.", "set": "larynx"}, {"id": "BH-20", "stem": "A 31-year-old woman has headache and dizziness after hitting her head on a cabinet door. MRI venography shows a large clot in the great cerebral vein (of Galen). This vein is a direct tributary of which of the following?", "opts": ["Emissary veins", "Pterygoid venous plexus", "Diploic veins", "Dural venous sinuses", "Internal jugular vein"], "ans": 3, "why": "Veins of the brain drain directly into dural venous sinuses; the great cerebral vein joins the inferior sagittal sinus to form the straight sinus.", "wrong": ["Emissary veins connect dural sinuses with scalp veins.", "Pterygoid plexus connects to the cavernous sinus via emissary veins.", "Diploic veins run within the skull diploe.", "", "The IJV receives the sinuses' outflow, not brain veins directly."], "pearl": "Great cerebral vein + inferior sagittal sinus -> straight sinus.", "set": "cranial"}, {"id": "BH-21", "stem": "A 41-year-old woman overdoses on medications that stimulate autonomic nerves. Which of the following results from stimulation of the parasympathetic fibers to the eyeball?", "opts": ["Enhanced vision for distant objects", "Dilation of the pupil", "Contraction of capillaries in the iris", "Contraction of the ciliary muscle", "Flattening of the lens"], "ans": 3, "why": "Parasympathetic fibers (CN III -> ciliary ganglion -> short ciliary nerves) contract the ciliary muscle and sphincter pupillae, rounding the lens for near vision and constricting the pupil.", "wrong": ["Distant vision (lens flattening) occurs when the ciliary muscle relaxes.", "Pupil dilation is sympathetic (dilator pupillae).", "Iris vasoconstriction is sympathetic.", "", "Lens flattening follows ciliary relaxation, not parasympathetic stimulation."], "pearl": "Parasympathetic eye: miosis + ciliary contraction = near vision (accommodation).", "set": "orbit"}, {"id": "BH-24", "stem": "A 32-year-old house painter falls from a ladder and has intracranial bleeding. During intraoperative testing, the neurosurgeon notes loss of general sensation in the dura of the middle cranial fossa. Which nerve has been affected?", "opts": ["Vagus nerve", "Facial nerve", "Hypoglossal nerve", "Trigeminal nerve", "Glossopharyngeal nerve"], "ans": 3, "why": "Dura of the middle cranial fossa is supplied by meningeal branches of V2 and V3 (e.g., nervus spinosus); V1 covers the anterior fossa.", "wrong": ["Vagus supplies posterior cranial fossa dura.", "Facial nerve does not supply cranial dura.", "Hypoglossal (carrying C1-C2 fibers) supplies posterior fossa dura.", "", "CN IX does not supply cranial dura."], "pearl": "Supratentorial dura = CN V; posterior fossa dura = CN X and upper cervical nerves.", "set": "cranial"}, {"id": "BH-25", "stem": "During a carotid endarterectomy on a 57-year-old man, the carotid sinus is damaged. Which statement about this structure is correct?", "opts": ["It is located at the origin of the external carotid artery", "It is innervated by the facial nerve", "It functions as a chemoreceptor", "It is stimulated by changes in blood pressure", "It communicates freely with the cavernous sinus"], "ans": 3, "why": "The carotid sinus is a dilation at the origin of the internal carotid artery that acts as a baroreceptor, sensing arterial pressure.", "wrong": ["It sits at the origin of the internal, not external, carotid.", "It is innervated by CN IX (carotid sinus nerve), with some CN X input.", "The carotid body, not sinus, is the chemoreceptor.", "", "It is an arterial dilation, not a venous sinus."], "pearl": "Carotid sinus = baroreceptor (CN IX); carotid body = chemoreceptor.", "set": "neck"}, {"id": "BH-26", "stem": "A 26-year-old baseball player is struck in the head, fracturing the optic canal. Which pair of structures is most likely damaged?", "opts": ["Optic nerve and ophthalmic vein", "Ophthalmic vein and ophthalmic nerve", "Ophthalmic artery and optic nerve", "Ophthalmic nerve and optic nerve", "Ophthalmic artery and ophthalmic vein"], "ans": 2, "why": "Only the optic nerve and ophthalmic artery pass through the optic canal.", "wrong": ["Ophthalmic vein uses the superior orbital fissure.", "Both of these pass through the superior orbital fissure.", "", "Ophthalmic nerve (V1) uses the superior orbital fissure.", "Ophthalmic vein uses the superior orbital fissure."], "pearl": "Optic canal = CN II + ophthalmic artery.", "set": "orbit"}, {"id": "BH-27", "stem": "A 43-year-old man has new difficulty speaking. Examination shows trouble elevating the hyoid bone and floor of the mouth due to paralysis of the posterior belly of the digastric. Which nerve is most likely involved?", "opts": ["Accessory nerve", "Trigeminal nerve", "Ansa cervicalis", "Facial nerve", "Glossopharyngeal nerve"], "ans": 3, "why": "The posterior belly of the digastric (and stylohyoid) derive from the second arch and are supplied by the facial nerve; the anterior belly is supplied by V3 via the nerve to mylohyoid.", "wrong": ["Accessory nerve supplies SCM and trapezius.", "Trigeminal supplies the anterior belly, not the posterior.", "Ansa cervicalis supplies infrahyoid muscles.", "", "CN IX supplies only stylopharyngeus."], "pearl": "Digastric: anterior belly = V3; posterior belly = VII.", "set": "neck"}, {"id": "BH-29", "stem": "The pupil of a 43-year-old patient remains small even when room lighting is dim. Which of the following is injured?", "opts": ["Trochlear nerve", "Superior cervical ganglion", "Oculomotor nerve", "Ophthalmic nerve", "Abducens nerve"], "ans": 1, "why": "Failure to dilate in dim light indicates loss of the postganglionic sympathetic fibers from the superior cervical ganglion that supply the dilator pupillae.", "wrong": ["CN IV is purely motor to superior oblique.", "", "CN III injury causes a dilated, not small, pupil.", "V1 carries sensory fibers; it only conveys sympathetics passively.", "CN VI is purely motor to lateral rectus."], "pearl": "Persistent miosis = sympathetic (superior cervical ganglion) lesion - Horner.", "set": "orbit"}, {"id": "BH-30", "stem": "A benign orbital tumor in a 49-year-old man compresses a structure that passes through both the superior orbital fissure and the common tendinous ring. Which structure is most likely damaged?", "opts": ["Frontal nerve", "Lacrimal nerve", "Trochlear nerve", "Abducens nerve", "Ophthalmic vein"], "ans": 3, "why": "The abducens nerve (with CN III divisions and nasociliary) passes through the SOF within the common tendinous ring.", "wrong": ["Frontal nerve passes through the SOF outside the ring.", "Lacrimal nerve passes through the SOF outside the ring.", "Trochlear nerve passes through the SOF outside the ring.", "", "Superior ophthalmic vein passes above/outside the ring."], "pearl": "Inside the ring: CN III (sup & inf), nasociliary, CN VI. Outside: LFT (lacrimal, frontal, trochlear) + vein.", "set": "orbit"}, {"id": "BH-31", "stem": "A 37-year-old man has discomfort moving his tongue, pharynx, and larynx. Examination shows that the muscles attached to the styloid process are paralyzed. Which group of cranial nerves is damaged?", "opts": ["Facial, glossopharyngeal, and hypoglossal nerves", "Hypoglossal, vagus, and facial nerves", "Glossopharyngeal, trigeminal, and vagus nerves", "Vagus, spinal accessory, and hypoglossal nerves", "Facial, glossopharyngeal, and vagus nerves"], "ans": 0, "why": "Three muscles arise from the styloid process: stylohyoid (CN VII), stylopharyngeus (CN IX), and styloglossus (CN XII).", "wrong": ["", "Vagus supplies no styloid muscle; CN IX (stylopharyngeus) is missing.", "Neither CN V nor CN X supplies a styloid muscle.", "CN X and XI supply no styloid muscle.", "Vagus supplies no styloid muscle; CN XII (styloglossus) is missing."], "pearl": "Styloid muscles: stylohyoid (VII), stylopharyngeus (IX), styloglossus (XII).", "set": "cn"}, {"id": "BH-32", "stem": "A high school basketball player develops sudden difficulty breathing. When a low tracheotomy is performed below the isthmus of the thyroid, which vessels may be encountered?", "opts": ["Inferior thyroid artery", "Inferior thyroid vein", "Costocervical trunk", "Superior thyroid artery", "Right brachiocephalic vein"], "ans": 1, "why": "The inferior thyroid veins descend from the isthmus on the anterior trachea to the brachiocephalic veins, directly in the path of a low tracheotomy.", "wrong": ["Inferior thyroid artery approaches the gland laterally, behind the carotid sheath.", "", "Costocervical trunk lies deep, posterior in the root of the neck.", "Superior thyroid artery reaches the upper poles.", "The brachiocephalic veins lie lower and more lateral."], "pearl": "Low tracheotomy hazards: inferior thyroid veins (and a thyroid ima artery, if present).", "set": "neck"}, {"id": "BH-33", "stem": "A 59-year-old man complains of numbness of the skin over the anterior cervical triangle. Which nerve has been damaged?", "opts": ["Phrenic nerve", "Great auricular nerve", "Transverse cervical nerve", "Supraclavicular nerve", "Lesser occipital nerve"], "ans": 2, "why": "The transverse cervical nerve (C2-C3) curves around the posterior border of the SCM at Erb's point and supplies the skin of the anterior neck.", "wrong": ["Phrenic nerve has no cutaneous distribution.", "Great auricular nerve supplies skin over the parotid and behind the ear.", "", "Supraclavicular nerves supply skin over the clavicle and shoulder.", "Lesser occipital nerve supplies scalp behind the ear."], "pearl": "Cervical plexus cutaneous nn. emerge at Erb's point; transverse cervical = anterior neck skin.", "set": "neck"}, {"id": "BH-34", "stem": "A 53-year-old man has difficulty breathing through his nose. His physician finds swelling of the mucous membrane of the superior nasal meatus. Which paranasal sinus opening is most likely blocked?", "opts": ["Middle ethmoidal sinus", "Maxillary sinus", "Posterior ethmoidal sinus", "Anterior ethmoidal sinus", "Frontal sinus"], "ans": 2, "why": "Only the posterior ethmoidal cells drain into the superior meatus.", "wrong": ["Middle ethmoidal cells open on the ethmoidal bulla (middle meatus).", "Maxillary sinus drains into the hiatus semilunaris (middle meatus).", "", "Anterior ethmoidal cells drain into the middle meatus.", "Frontal sinus drains via the frontonasal duct into the middle meatus."], "pearl": "Superior meatus = posterior ethmoid; middle = frontal, maxillary, anterior/middle ethmoid; inferior = nasolacrimal duct.", "set": "nasal_oral"}, {"id": "BH-35", "stem": "A 61-year-old woman has ocular lymphoma invading her optic canal. Which structure is most likely damaged?", "opts": ["Ophthalmic vein", "Ophthalmic nerve", "Oculomotor nerve", "Trochlear nerve", "Ophthalmic artery"], "ans": 4, "why": "The optic canal transmits only the optic nerve and the ophthalmic artery.", "wrong": ["Ophthalmic vein passes through the superior orbital fissure.", "V1 passes through the superior orbital fissure.", "CN III passes through the superior orbital fissure.", "CN IV passes through the superior orbital fissure.", ""], "pearl": "Optic canal = CN II + ophthalmic artery; everything else to the orbit uses the SOF.", "set": "orbit"}, {"id": "BH-36", "stem": "A 76-year-old man with swallowing difficulty undergoes imaging. A CT image at the level of the cricothyroid ligament should show which of the following structures?", "opts": ["Inferior laryngeal nerves", "External carotid arteries", "Inferior thyroid veins", "Thyrocervical trunks", "Internal laryngeal nerves"], "ans": 0, "why": "The inferior laryngeal nerves, the terminal parts of the recurrent laryngeal nerves, ascend at the cricoid level and so lie at the level of the cricothyroid ligament.", "wrong": ["", "External carotids begin higher, at the upper thyroid cartilage border.", "Inferior thyroid veins lie below, anterior to the trachea.", "Thyrocervical trunks arise low, in the root of the neck.", "Internal laryngeal nerves pierce the thyrohyoid membrane, above this level."], "pearl": "Recurrent laryngeal n. becomes the inferior laryngeal n. as it enters the larynx near the cricothyroid joint.", "set": "larynx"}, {"id": "BH-37", "stem": "During surgery for a malignant parotid tumor in a 69-year-old woman, the main trunk of the facial nerve is lacerated. Which muscle is paralyzed?", "opts": ["Masseter muscle", "Stylopharyngeus muscle", "Anterior belly of the digastric muscle", "Buccinator muscle", "Tensor tympani"], "ans": 3, "why": "The buccinator is a muscle of facial expression supplied by the buccal branches of CN VII.", "wrong": ["Masseter is supplied by V3.", "Stylopharyngeus is supplied by CN IX.", "Anterior belly of digastric is supplied by V3 (nerve to mylohyoid).", "", "Tensor tympani is supplied by V3."], "pearl": "Buccinator: CN VII motor; buccal nerve of V3 is only sensory to the cheek.", "set": "face"}, {"id": "BH-38", "stem": "During a fight, a 17-year-old boy is punched and his nasal septum is broken. Which structures would be damaged?", "opts": ["Septal cartilage and nasal bone", "Inferior concha and vomer", "Vomer and perpendicular plate of the ethmoid", "Septal cartilage and middle concha", "Cribriform plate and frontal bone"], "ans": 2, "why": "The nasal septum is built from the perpendicular plate of the ethmoid, the vomer, and the septal cartilage.", "wrong": ["Nasal bones form the bridge/roof, not the septum.", "Inferior concha is part of the lateral wall.", "", "Middle concha is part of the lateral wall.", "Cribriform plate and frontal bone form the roof."], "pearl": "Septum = perpendicular plate of ethmoid + vomer + septal cartilage.", "set": "nasal_oral"}, {"id": "BH-39", "stem": "A 58-year-old woman has progressive loss of voice, numbness and loss of taste on the back of her tongue, and difficulty shrugging her shoulders. MRI shows a dural meningioma compressing the nerves as they leave the skull. Through which opening do these nerves exit?", "opts": ["Foramen spinosum", "Foramen rotundum", "Internal auditory meatus", "Jugular foramen", "Foramen lacerum"], "ans": 3, "why": "Voice loss (CN X), posterior-tongue taste/sensation loss (CN IX), and weak shoulder shrug (CN XI) localize to the jugular foramen, which transmits all three.", "wrong": ["Foramen spinosum transmits the middle meningeal artery.", "Foramen rotundum transmits V2.", "Internal auditory meatus transmits CN VII and VIII.", "", "Foramen lacerum transmits essentially nothing (ICA crosses its top)."], "pearl": "Jugular foramen syndrome = CN IX, X, XI deficits.", "set": "cranial"}, {"id": "BH-40", "stem": "A 21-year-old woman has an infection within the carotid sheath. Which structures would be damaged?", "opts": ["Vagus nerve and middle cervical ganglion", "Internal carotid artery and recurrent laryngeal nerve", "Internal jugular vein and vagus nerve", "Sympathetic trunk and common carotid artery", "External carotid artery and ansa cervicalis"], "ans": 2, "why": "The carotid sheath contains the common and internal carotid arteries, internal jugular vein, and vagus nerve.", "wrong": ["The cervical ganglia lie behind the sheath.", "Recurrent laryngeal nerve lies in the tracheoesophageal groove.", "", "Sympathetic trunk lies posterior to the sheath.", "External carotid is outside the sheath; ansa lies on/within its surface."], "pearl": "Carotid sheath: CCA/ICA (medial), IJV (lateral), CN X (posterior between them).", "set": "neck"}, {"id": "BH-41", "stem": "An angiogram of a 45-year-old man shows occlusion of the costocervical trunk. This would markedly decrease blood flow in which artery?", "opts": ["Superior thoracic artery", "Transverse cervical artery", "Ascending cervical artery", "Deep cervical artery", "Inferior thyroid artery"], "ans": 3, "why": "The costocervical trunk divides into the deep cervical and superior intercostal arteries.", "wrong": ["Superior thoracic artery is a branch of the axillary artery.", "Transverse cervical artery arises from the thyrocervical trunk.", "Ascending cervical artery arises from the inferior thyroid artery.", "", "Inferior thyroid artery arises from the thyrocervical trunk."], "pearl": "Subclavian branches: vertebral, internal thoracic, thyrocervical, costocervical (deep cervical + superior intercostal), dorsal scapular.", "set": "neck"}, {"id": "BH-42", "stem": "A 57-year-old man has fever, headache, nausea, and vomiting; imaging localizes an infection to the cavernous sinus. Which nerves would be unaffected by this condition?", "opts": ["Oculomotor nerves", "Abducens nerves", "Trochlear nerves", "Mandibular nerves", "Ophthalmic nerves"], "ans": 3, "why": "V3 leaves the trigeminal ganglion directly through the foramen ovale and does not travel in the cavernous sinus wall.", "wrong": ["CN III runs in the lateral wall of the sinus.", "CN VI runs through the middle of the sinus.", "CN IV runs in the lateral wall of the sinus.", "", "V1 runs in the lateral wall of the sinus."], "pearl": "Cavernous sinus: III, IV, V1, V2 (lateral wall) + VI and ICA (inside); NOT V3.", "set": "cranial"}, {"id": "BH-43", "stem": "A 7-year-old girl has difficulty breathing through her nose and is diagnosed with adenoids. Which tonsil is enlarged?", "opts": ["Palatine tonsil", "Pharyngeal tonsil", "Tubal tonsil", "Lingual tonsil", "Eustachian tonsil"], "ans": 1, "why": "Adenoids are an enlarged pharyngeal tonsil in the nasopharynx roof, blocking airflow from the choanae.", "wrong": ["Palatine (faucial) tonsil lies in the oropharynx tonsillar fossa.", "", "Tubal tonsil surrounds the auditory tube opening.", "Lingual tonsil lies on the posterior tongue.", "Eustachian tonsil is another name for the tubal tonsil."], "pearl": "Adenoids = pharyngeal tonsil -> mouth breathing, may block auditory tube (otitis media).", "set": "nasal_oral"}, {"id": "BH-44", "stem": "A 59-year-old woman with pain at the side of her skull has a large lesion in the internal auditory meatus on CT. This condition may progress to damage which pair of structures?", "opts": ["Vagus and glossopharyngeal nerves", "Internal carotid and vertebral arteries", "Internal jugular vein and trigeminal nerve", "Facial and vestibulocochlear nerves", "Hypoglossal and accessory nerves"], "ans": 3, "why": "The internal acoustic meatus transmits CN VII and CN VIII (with the labyrinthine artery).", "wrong": ["CN IX and X exit via the jugular foramen.", "ICA uses the carotid canal; vertebral uses the foramen magnum.", "IJV uses the jugular foramen; CN V divisions use SOF/rotundum/ovale.", "", "CN XII uses the hypoglossal canal; CN XI the jugular foramen."], "pearl": "Internal acoustic meatus = CN VII + VIII (vestibular schwannoma).", "set": "cranial"}, {"id": "BH-45", "stem": "After ingesting a toxic substance at a friend's home, a 12-year-old girl cannot close her lips. Which muscle may be paralyzed?", "opts": ["Levator labii superioris", "Zygomaticus minor", "Orbicularis oris", "Lateral pterygoid", "Depressor labii inferioris"], "ans": 2, "why": "The orbicularis oris is the sphincter of the mouth that closes the lips.", "wrong": ["Elevates the upper lip (opens).", "Elevates the upper lip.", "", "Depresses the mandible (opens the mouth), not the lips.", "Depresses the lower lip (opens)."], "pearl": "Orbicularis oris closes lips; orbicularis oculi closes eyelids - both CN VII.", "set": "face"}, {"id": "BH-46", "stem": "A 37-year-old man has a fracture of the floor of the middle cranial fossa that severs the greater petrosal nerve. Which condition could result?", "opts": ["Increased lacrimal gland secretion", "Loss of taste sensation in the epiglottis", "Dryness in the nose and palate", "Decreased parotid gland secretion", "Loss of sensation in the pharynx"], "ans": 2, "why": "The greater petrosal nerve carries preganglionic parasympathetic fibers to the pterygopalatine ganglion for lacrimal, nasal, and palatal glands, so its loss causes dry eye, nose, and palate.", "wrong": ["Lacrimal secretion would decrease, not increase.", "Epiglottic taste travels via the internal laryngeal nerve (CN X).", "", "Parotid secretion depends on the lesser petrosal nerve (CN IX).", "Pharyngeal sensation is carried by CN IX."], "pearl": "Greater petrosal (VII) = lacrimal/nasal/palatal glands; lesser petrosal (IX) = parotid.", "set": "nasal_oral"}, {"id": "BH-47", "stem": "A 65-year-old man with vision problems visits an eye clinic. The pupillary light reflex can be eliminated by cutting which of the following nerves?", "opts": ["Short ciliary, ophthalmic, and oculomotor nerves", "Long ciliary, optic, and short ciliary nerves", "Oculomotor, short ciliary, and optic nerves", "Optic and long ciliary nerves and ciliary ganglion", "Ophthalmic and optic nerves and ciliary ganglion"], "ans": 2, "why": "The reflex uses the optic nerve (afferent) and the oculomotor nerve -> ciliary ganglion -> short ciliary nerves (efferent) to the sphincter pupillae.", "wrong": ["Ophthalmic nerve (V1) carries only sensory fibers.", "Long ciliary nerves carry sympathetic fibers.", "", "Long ciliary nerves are not part of the reflex.", "Ophthalmic nerve is not part of the reflex."], "pearl": "Pupillary light reflex: afferent CN II, efferent CN III (via ciliary ganglion, short ciliary nn.).", "set": "orbit"}, {"id": "BH-48", "stem": "A 12-year-old boy is choking on food. After a failed attempt to dislodge it, the school nurse performs a needle cricothyrotomy. The needle enters which region?", "opts": ["Rima glottidis", "Laryngeal vestibule", "Laryngeal ventricle", "Infraglottic cavity", "Piriform recess"], "ans": 3, "why": "The cricothyroid membrane lies below the vocal folds, so a needle through it enters the infraglottic cavity, which extends from the rima glottidis to the lower cricoid border.", "wrong": ["Rima glottidis is the gap between the vocal folds, above this level.", "Vestibule lies above the vestibular folds.", "Ventricle lies between the vestibular and vocal folds.", "", "Piriform recess is part of the laryngopharynx, outside the larynx."], "pearl": "Cricothyrotomy -> infraglottic cavity (below the vocal cords).", "set": "larynx"}, {"id": "BH-49", "stem": "A 59-year-old stroke patient cannot swallow because of a nerve injury. Which of the following nerves is NOT involved in swallowing?", "opts": ["Hypoglossal nerve", "Spinal accessory nerve", "Vagus nerve", "Facial nerve", "Trigeminal nerve"], "ans": 1, "why": "The spinal accessory nerve supplies only the SCM and trapezius, which have no role in swallowing.", "wrong": ["CN XII moves the tongue to push the bolus back.", "", "CN X supplies palate, pharynx, and larynx muscles.", "CN VII supplies posterior digastric and stylohyoid, elevating the hyoid.", "V3 supplies mylohyoid and anterior digastric, elevating the hyoid."], "pearl": "CN XI = SCM + trapezius only.", "set": "cn"}, {"id": "BH-51", "stem": "A 64-year-old woman cannot open her mouth or jaw because of tetanus from a penetrating rusty-nail wound. Which muscle's function is most likely lost?", "opts": ["Masseter muscle", "Medial pterygoid muscle", "Lateral pterygoid muscle", "Buccinator muscle", "Temporalis muscle"], "ans": 2, "why": "The lateral pterygoid is the principal muscle of mastication that opens the jaw by protruding and depressing the mandible.", "wrong": ["Masseter elevates (closes) the jaw.", "Medial pterygoid elevates (closes) the jaw.", "", "Buccinator is a facial muscle of the cheek.", "Temporalis elevates and retracts the jaw."], "pearl": "Lateral pterygoid opens the jaw; masseter, temporalis, medial pterygoid close it.", "set": "face"}, {"id": "BH-52", "stem": "A 60-year-old man cannot open his eye because of a rare neuromuscular disease. Which muscle is most likely paralyzed?", "opts": ["Orbicularis oculi", "Orbicularis oris", "Frontalis", "Levator palpebrae superioris", "Superior rectus"], "ans": 3, "why": "The levator palpebrae superioris (CN III, with a sympathetic superior tarsal part) elevates the upper eyelid to open the eye.", "wrong": ["Orbicularis oculi closes the eye.", "Orbicularis oris closes the lips.", "Frontalis elevates the eyebrows.", "", "Superior rectus elevates the eyeball, not the lid."], "pearl": "Ptosis: levator palpebrae (CN III) or superior tarsal muscle (sympathetic); myasthenia classically.", "set": "orbit"}, {"id": "BH-53", "stem": "A 46-year-old man complains of dry mouth. A swallowing study shows absent salivary secretion from the submandibular gland. This indicates a lesion of which structure?", "opts": ["Lingual nerve at its origin", "Chorda tympani in the middle ear cavity", "Superior cervical ganglion", "Lesser petrosal nerve", "Auriculotemporal nerve"], "ans": 1, "why": "Preganglionic parasympathetic fibers for the submandibular gland run in the chorda tympani, then join the lingual nerve to reach the submandibular ganglion.", "wrong": ["At its origin the lingual nerve has not yet received the chorda tympani.", "", "Superior cervical ganglion supplies vasomotor sympathetics only.", "Lesser petrosal nerve serves the otic ganglion/parotid.", "Auriculotemporal nerve carries parotid secretomotor fibers."], "pearl": "Submandibular/sublingual secretion: CN VII -> chorda tympani -> lingual n. -> submandibular ganglion.", "set": "nasal_oral"}, {"id": "BH-54", "stem": "A 51-year-old woman can see the distant sky clearly but cannot focus on her face in a mirror. Her lack of accommodation results from paralysis of which muscle?", "opts": ["Tarsal muscle", "Sphincter pupillae", "Dilator pupillae", "Ciliary muscle", "Orbitalis muscle"], "ans": 3, "why": "Near focusing requires contraction of the ciliary muscle (parasympathetic via CN III and the ciliary ganglion), which lets the lens round up.", "wrong": ["Superior tarsal muscle helps elevate the eyelid.", "Sphincter pupillae constricts the pupil; not the focusing muscle.", "Dilator pupillae dilates the pupil.", "", "Orbitalis bridges the inferior orbital fissure."], "pearl": "Accommodation = ciliary muscle contraction (CN III parasympathetics).", "set": "orbit"}, {"id": "BH-56", "stem": "A 42-year-old patient has an aneurysm at the junction of the posterior cerebral and posterior communicating arteries that compresses a nerve. On the affected side, the patient is most likely to show:", "opts": ["Bitemporal hemianopsia", "A dilated pupil", "A medially deviated eye", "A constricted pupil", "Anosmia"], "ans": 1, "why": "CN III passes near the PCA-PComm junction; its superficially placed parasympathetic fibers are compressed first, giving an ipsilateral dilated pupil.", "wrong": ["Bitemporal hemianopsia comes from chiasmal compression (pituitary tumor).", "", "Medial deviation reflects CN VI palsy.", "Constricted pupil reflects sympathetic injury.", "Anosmia reflects olfactory nerve injury."], "pearl": "PComm aneurysm -> 'blown pupil' (compressive CN III palsy affects pupil first).", "set": "cn"}, {"id": "G-4", "stem": "Early closure of the fontanelles of the infant skull can compress the brain and restrict its growth. Which fontanelle lies at the junction of the sagittal and coronal sutures, and at about what age does it typically close?", "opts": ["Posterior fontanelle, which closes at about 2 years", "Mastoid fontanelle, which closes at about 16 months", "Lambdoid fontanelle, which closes at 8 months to 1 year", "Sphenoidal fontanelle, which closes at 3 years", "Anterior fontanelle, which closes at 18 months"], "ans": 4, "why": "The anterior fontanelle sits where the sagittal and coronal sutures meet (the future bregma) and is the last to close, at roughly 18 months.", "wrong": ["Posterior fontanelle is at sagittal–lambdoid junction (lambda) and closes by 2–3 months.", "Mastoid fontanelle is at squamous–lambdoid junction and closes near the end of year 1.", "There is a lambdoid suture but no 'lambdoid fontanelle'.", "Sphenoidal fontanelle is at squamous–coronal junction (pterion) and closes by 2–3 months.", ""], "pearl": "Anterior fontanelle = future bregma (sagittal + coronal), closes ~18 months; posterior = lambda, closes ~2–3 months.", "set": "cranial"}, {"id": "G-17", "stem": "A 50-year-old woman complains of pain over her chin and lower lip. A few days later, small vesicles appear over the same area and erupt. She is diagnosed with herpes zoster (shingles). Which nerve most likely contains the virus?", "opts": ["Auriculotemporal", "Buccal", "Lesser petrosal", "Mental", "Infraorbital"], "ans": 3, "why": "Skin of the chin and lower lip is supplied by the mental nerve, the terminal cutaneous branch of the inferior alveolar nerve (V3).", "wrong": ["Supplies temple, TMJ, parotid region and ear skin, not the chin.", "Supplies cheek skin and inner buccal mucosa.", "Carries preganglionic parasympathetics to the otic ganglion; not a cutaneous sensory nerve.", "", "Branch of V2 supplying the upper lip, lower eyelid and side of nose."], "pearl": "Chin + lower lip = mental nerve (V3, via inferior alveolar n. exiting the mental foramen).", "set": "face"}, {"id": "G-18", "stem": "A 68-year-old woman has excruciating, sudden bouts of pain over her midface and is diagnosed with tic douloureux (trigeminal neuralgia). In which ganglion are the cell bodies of the neurons mediating this pain located?", "opts": ["Geniculate", "Trigeminal (semilunar or Gasserian)", "Inferior glossopharyngeal", "Otic", "Pterygopalatine"], "ans": 1, "why": "Pseudounipolar sensory neurons of CN V, which carry the facial pain of trigeminal neuralgia, have their cell bodies in the trigeminal (semilunar) ganglion.", "wrong": ["Sensory ganglion of CN VII (taste from anterior tongue), not facial pain.", "", "Sensory ganglion of CN IX, not trigeminal territory.", "Parasympathetic ganglion for the parotid; no sensory cell bodies.", "Parasympathetic ganglion for lacrimal and nasal glands; no sensory cell bodies."], "pearl": "Sensory cell bodies of CN V = trigeminal ganglion in Meckel's cave; parasympathetic ganglia hanging off V branches contain no sensory somata.", "set": "cn"}, {"id": "G-19", "stem": "A 17-year-old girl has signs of cavernous sinus thrombosis. Thrombophlebitis in the 'danger area' of the face can spread to the cavernous sinus and involve the ophthalmic division of the trigeminal nerve. Which symptom is most likely present?", "opts": ["Pain in the hard palate", "Anesthesia of the upper lip", "Pain from the eyeball", "Pain over the lower eyelid", "Tingling sensation over the buccal region of the face"], "ans": 2, "why": "The ophthalmic division (V1) carries sensation from the eyeball (via nasociliary/long ciliary nerves), so V1 involvement produces eye pain.", "wrong": ["Hard palate sensation is V2 (greater palatine/nasopalatine).", "Upper lip is supplied by the infraorbital nerve (V2).", "", "Lower eyelid is supplied by the infraorbital nerve (V2).", "Cheek skin over the zygoma/buccal region is V2 (and V3 buccal), not V1."], "pearl": "V1 = eyeball, cornea, forehead, upper eyelid, dorsum of nose; V2 = lower lid, cheek, upper lip, palate.", "set": "cranial"}, {"id": "G-20", "stem": "A 34-year-old man has severe headaches, dizziness, and vomiting. Imaging reveals a tumor at the hypoglossal canal. Which muscle is most likely affected?", "opts": ["Geniohyoid", "Mylohyoid", "Palatoglossus", "Genioglossus", "Thyrohyoid"], "ans": 3, "why": "The hypoglossal canal transmits CN XII, which supplies the genioglossus (and other tongue muscles except palatoglossus).",
