 "wrong": ["CN IX supplies stylopharyngeus and posterior tongue sensation.", "CN X supplies palate, pharynx, and larynx.", "", "V2 is purely sensory to the midface.", "V3 moves the jaw; it does not close the eye or move the mouth corner."], "pearl": "Food pocketing in the cheek = buccinator weakness = CN VII (buccal branch).", "set": "cn"}, {"id": "G-247", "stem": "A 51-year-old man has left-sided hearing loss, poor balance, loss of taste, and drooling from the left side of his mouth. CT shows a tumor on the left side of the posterior cranial fossa. Where is the tumor located?", "opts": ["Foramen ovale", "Foramen rotundum", "Internal acoustic meatus", "Jugular foramen", "Superior orbital fissure"], "ans": 2, "why": "The internal acoustic meatus carries both CN VII (taste to the anterior tongue, facial muscles) and CN VIII (hearing and balance), so one lesion there explains all the findings.", "wrong": ["Foramen ovale carries V3, which gives jaw weakness and lower-face numbness.", "Foramen rotundum carries V2, which is sensory to the midface.", "", "Jugular foramen lesions affect IX, X, XI, not hearing or facial movement.", "The SOF lesion affects eye movement and V1 sensation."], "pearl": "Internal acoustic meatus = CN VII + VIII (+ labyrinthine artery).", "set": "cranial"}, {"id": "G-251", "stem": "After thyroidectomy, a 44-year-old soprano has persistent phonation problems. Laryngoscopy shows normal vocal folds that meet in the midline. Surgical injury to the left superior laryngeal nerve is diagnosed. Which additional abnormal finding is expected?", "opts": ["Decreased/absent sensation above the vocal folds", "Decreased/absent sensation below the vocal folds", "Poorly coordinated swallowing reflex", "Bilateral weakness/paralysis of the posterior cricoarytenoid muscles", "Weakness/paralysis of the left posterior cricoarytenoid muscle"], "ans": 0, "why": "The superior laryngeal nerve's internal branch supplies sensation to the laryngeal mucosa above the vocal folds, while its external branch supplies cricothyroid (pitch). Injury to the whole nerve adds supraglottic anesthesia to the pitch problem.", "wrong": ["", "Infraglottic sensation comes from the recurrent laryngeal nerve.", "Swallowing coordination depends on IX and X broadly, not just this branch.", "Posterior cricoarytenoids are supplied by the recurrent laryngeal nerves.", "Left PCA is supplied by the left recurrent laryngeal nerve, not the superior laryngeal."], "pearl": "SLN: internal = sensory above folds; external = cricothyroid (pitch). RLN = sensory below folds + all other intrinsics.", "set": "larynx"}, {"id": "G-254", "stem": "A 55-year-old man with a history of cocaine use has severe epistaxis from Kiesselbach's area. Anastomoses between which arteries are involved?", "opts": ["Descending palatine and ascending pharyngeal", "Posterior superior alveolar and accessory meningeal", "Lateral branches of posterior ethmoidal and middle meningeal", "Branches of sphenopalatine, superior labial, and anterior ethmoidal", "Descending palatine and tonsillar branches of the ascending pharyngeal"], "ans": 3, "why": "Kiesselbach's plexus on the anterior septum is formed by the sphenopalatine, superior labial (facial), anterior ethmoidal, and greater palatine arteries. It is the most common site of epistaxis.", "wrong": ["These vessels lie in the palate and pharynx, not the anterior septum.", "The PSA runs in the maxilla; the accessory meningeal serves the ITF/cranium.", "The middle meningeal artery is intracranial and does not reach the septum.", "", "These supply the palate and tonsil, not the anterior septum."], "pearl": "Kiesselbach (anterior septum) = most epistaxis; posterior bleeds = sphenopalatine a.", "set": "nasal_oral"}, {"id": "G-255", "stem": "A 49-year-old woman with swollen palatine tonsils undergoes tonsillectomy. Which nerve running along the tonsillar bed must be spared?", "opts": ["Vagus", "Hypoglossal", "Glossopharyngeal", "Internal laryngeal", "External laryngeal"], "ans": 2, "why": "CN IX runs with the stylopharyngeus through the tonsillar bed deep to the palatine tonsil. Injury can cause loss of sensation and taste on the posterior third of the tongue.", "wrong": ["CN X lies in the carotid sheath and pharyngeal plexus, not the tonsillar bed.", "CN XII runs below the tongue, not in the tonsillar fossa.", "", "Internal laryngeal is in the neck and piriform recess.", "External laryngeal runs with the superior thyroid artery in the neck."], "pearl": "Tonsillectomy risks CN IX (posterior 1/3 tongue sensation/taste) in the tonsillar bed.", "set": "nasal_oral"}, {"id": "G-256", "stem": "A 39-year-old man has hoarseness; laryngoscopy shows vocal cord nodules with normal movement. Which muscle opens the rima glottidis?", "opts": ["Posterior cricoarytenoids", "Lateral cricoarytenoids", "Thyroarytenoids", "Transverse arytenoids", "Cricothyroids"], "ans": 0, "why": "The posterior cricoarytenoid is the only muscle that abducts the vocal folds, rotating the arytenoids to widen the rima glottidis.", "wrong": ["", "Lateral cricoarytenoids adduct the vocal folds.", "Thyroarytenoids relax/shorten the vocal folds.", "Transverse arytenoids adduct by closing the posterior rima.", "Cricothyroids tense (lengthen) the vocal folds."], "pearl": "'Posterior cricoarytenoids pull the cords apart' - the only abductor.", "set": "larynx"}, {"id": "G-258", "stem": "After a small brainstem stroke, a 64-year-old diabetic woman has uncoordinated swallowing and difficulty with phonation. Dysfunction of the responsible cranial nerve will most likely also produce which symptom?", "opts": ["Weakness/paralysis of muscles of mastication on one side", "Weakness/paralysis of muscles of facial expression on one side", "Hearing loss and balance problems", "Decreased/absent sensation in the oropharynx", "Decreased/absent cough reflex"], "ans": 4, "why": "CN X supplies the pharyngeal and laryngeal muscles, so its lesion impairs swallowing and phonation. CN X is also both limbs of the cough reflex, so cough is reduced.", "wrong": ["Mastication is V3.", "Facial expression is CN VII.", "Hearing and balance are CN VIII.", "Oropharyngeal sensation is mainly CN IX.", ""], "pearl": "CN X: dysphagia, dysphonia, uvula deviation away from lesion, lost cough reflex.", "set": "cn"}, {"id": "G-259", "stem": "After thyroidectomy, a 44-year-old woman is diagnosed with injury to the left external laryngeal nerve. Which finding may result?", "opts": ["Inability to abduct the vocal fold", "Monotone, easily fatigued voice with poor pitch control", "Decreased/absent sensation above the vocal folds", "Decreased/absent sensation below the vocal folds", "Decreased/absent cough reflex"], "ans": 1, "why": "The external laryngeal nerve is motor to cricothyroid, which tilts the thyroid cartilage to tense the vocal folds. Loss produces a weak, monotonous voice with poor pitch control.", "wrong": ["Abduction depends on the posterior cricoarytenoid (RLN).", "", "Supraglottic sensation is from the internal laryngeal nerve.", "Infraglottic sensation is from the recurrent laryngeal nerve.", "The external branch is purely motor; the cough reflex is intact."], "pearl": "External laryngeal n. travels with superior thyroid a.; injury -> loss of high pitch (singers).", "set": "larynx"}, {"id": "G-260", "stem": "During a cranial nerve exam, a 49-year-old patient's uvula deviates to the right. The gag reflex is weaker when the left pharyngeal mucosa is touched than when the right is touched. Which nerve is most likely injured?", "opts": ["Left vagus", "Left glossopharyngeal", "Right vagus", "Left V3", "Right glossopharyngeal"], "ans": 0, "why": "A vagal lesion weakens the ipsilateral levator veli palatini, so the uvula is pulled toward the intact side (away from the lesion). The motor limb of the gag reflex is also weakened on the left.", "wrong": ["", "A CN IX lesion reduces gag sensation but does not deviate the uvula.", "Right vagus lesion would deviate the uvula to the left.", "V3 does not control the uvula or the gag reflex.", "Right CN IX would weaken the right-sided gag and not deviate the uvula."], "pearl": "Uvula deviates AWAY from the side of a CN X lesion.", "set": "cn"}, {"id": "G-261", "stem": "A 40-year-old singer who grinds her teeth has left jaw pain, left earache, and headache. Opening her mouth wide is painful and clicks, the jaw deviates slightly left on elevation, the area around the left condyle is tender, and there is spasm-like tightness only along the left mandibular ramus. Spasm of which muscle is most likely?", "opts": ["Buccinator", "Masseter", "Mylohyoid", "Posterior belly of the digastric", "Lateral pterygoid"], "ans": 1, "why": "The masseter runs from the zygomatic arch to the lateral ramus and is a strong jaw elevator. Bruxism can make it hypertrophied and spastic, which limits depression of the mandible and produces tightness along the ramus.", "wrong": ["Buccinator is a facial muscle of the cheek, not a jaw elevator.", "", "Mylohyoid lies in the floor of the mouth, not along the ramus.", "The digastric depresses the mandible and lies below it.", "The lateral pterygoid is deep in the ITF and cannot be felt along the ramus."], "pearl": "Tightness palpable over the ramus = masseter; bruxism -> masseter hypertrophy.", "set": "face"}, {"id": "G-262", "stem": "In a cough-reflex test, a 62-year-old woman inhales particles that stick to mucus mainly in the trachea. Blocking afferent neurons in which cranial nerve would most likely suppress her cough?", "opts": ["Glossopharyngeal", "Hypoglossal", "External laryngeal", "Trigeminal", "Vagus"], "ans": 4, "why": "The vagus nerve carries sensation from the tracheal and laryngeal mucosa and also drives the motor response, so it forms both limbs of the cough reflex.", "wrong": ["CN IX is the afferent limb of the gag reflex, not tracheal cough.", "CN XII is motor to the tongue.", "The external laryngeal is purely motor to cricothyroid.", "CN V is sensory to the face and nasal cavity (sneeze), not the trachea.", ""], "pearl": "Cough reflex: CN X afferent and efferent. Gag: IX afferent, X efferent.", "set": "cn"}, {"id": "G-263", "stem": "A neurologist strokes the patient's left cornea with cotton and gets no response. When the right cornea is touched, both eyes blink. Damage to which left cranial nerve best explains this?", "opts": ["Optic", "Oculomotor", "Trigeminal", "Abducens", "Facial"], "ans": 2, "why": "The corneal reflex uses V1 (nasociliary) as the afferent limb and CN VII as the bilateral efferent. Touching the right cornea produces a bilateral blink, so both facial nerves work; the left V1 afferent is the problem.", "wrong": ["CN II carries vision, not corneal touch.", "CN III elevates the lid; it does not close it.", "", "CN VI moves the eye laterally; not part of the reflex.", "A left CN VII lesion would stop the left eye blinking when the right cornea is touched."], "pearl": "No blink either eye from one side = afferent (V1) lesion; one eye never blinks = efferent (VII) lesion.", "set": "orbit"}, {"id": "G-264", "stem": "A 12-year-old girl has a tender swelling in the anterior neck just above the thyroid notch. The physician says there is a cyst in the tract along which the thyroid gland descended. All tract tissue between which two structures must be removed?", "opts": ["Left lobe of thyroid gland and tonsillar fossa", "Right lobe of thyroid gland and epiglottis", "Right lobe of thyroid gland and hyoid bone", "Thyroid isthmus and foramen cecum", "Thyroid isthmus and piriform recess"], "ans": 3, "why": "The thyroid descends from the foramen cecum at the tongue base, passing near the hyoid, to its final position at the isthmus. A thyroglossal duct cyst is treated by removing the whole tract between these two points (including part of the hyoid).", "wrong": ["The tonsillar fossa is unrelated to the midline thyroid tract.", "The epiglottis is not on the descent path.", "The tract is midline and ends at the isthmus, not a lateral lobe.", "", "The piriform recess is lateral and relates to branchial anomalies."], "pearl": "Midline neck mass that moves with swallowing/tongue protrusion = thyroglossal duct cyst (Sistrunk procedure).", "set": "neck"}, {"id": "G-267", "stem": "A 75-year-old woman has double vision and cannot abduct her right eye. An aneurysm of which artery would most likely compress the nerve responsible?", "opts": ["Posterior cerebral artery", "Internal carotid artery", "External carotid artery", "Anterior cerebral artery", "Posterior communicating artery"], "ans": 1, "why": "CN VI runs through the cavernous sinus right beside the internal carotid artery, free in the sinus rather than in its lateral wall. An ICA aneurysm there readily compresses CN VI, causing lateral rectus palsy.", "wrong": ["PCA aneurysms typically compress CN III.", "", "The ECA stays outside the cranium.", "ACA/AComm aneurysms affect the optic chiasm.", "PComm aneurysms classically compress CN III (ptosis, blown pupil)."], "pearl": "CN VI lies free in the cavernous sinus next to the ICA -> first nerve hit by cavernous ICA aneurysm.", "set": "cranial"}, {"id": "G-269", "stem": "A 16-year-old boy is struck in the left eye by a baseball bat and has pain and blurred vision. When asked to look upward, the left eye fails to elevate. Imaging shows a fracture of the orbital floor. Which muscle is most likely affected?", "opts": ["Levator palpebrae superioris", "Inferior oblique", "Inferior rectus", "Medial rectus", "Superior rectus"], "ans": 2, "why": "A blow-out fracture of the orbital floor can trap the inferior rectus in the fracture. The tethered muscle cannot relax, so the eye cannot look up and the patient has diplopia on upward gaze.", "wrong": ["Levator lies superiorly and elevates the lid, not the globe.", "Inferior oblique can be involved but the classic entrapped muscle is inferior rectus.", "", "Medial rectus is trapped with medial wall (ethmoid) fractures.", "Superior rectus lies superiorly, away from the floor."], "pearl": "Orbital floor blow-out -> inferior rectus entrapment -> impaired upgaze; also infraorbital n. numbness.", "set": "orbit"}, {"id": "G-270", "stem": "A 10-year-old child has severe ear pain, headache, and fever for 5 days. The tympanic membrane is red and bulging with purulent effusion, and there is tenderness over the mastoid process. If the mastoid air cells are now infected, which venous channel is most at risk of thrombosis due to its proximity to the infected bone?", "opts": ["Cavernous sinus", "Pterygoid venous plexus", "Sigmoid sinus", "Straight sinus", "Superior petrosal sinus"], "ans": 2, "why": "The sigmoid sinus grooves the inner surface of the mastoid part of the temporal bone and receives mastoid emissary veins, so mastoiditis can spread directly to it and cause thrombosis.", "wrong": ["The cavernous sinus is beside the sella, not the mastoid.", "The pterygoid plexus is in the infratemporal fossa.", "", "The straight sinus lies at the falx-tentorium junction in the midline.", "The superior petrosal sinus runs along the petrous ridge, not the mastoid."], "pearl": "Mastoiditis -> sigmoid sinus thrombosis (sigmoid sinus lies directly behind mastoid air cells).", "set": "cranial"}, {"id": "G-271", "stem": "A 12-year-old boy has symptoms of sinusitis. Tapping just above the middle of his eyebrows causes pain. Which area is being examined?", "opts": ["Maxillary sinus", "Temporal bone", "Frontal sinus", "Sphenoid sinus", "Ethmoid sinus"], "ans": 2, "why": "The frontal sinuses sit in the frontal bone just above the orbital margins, so tapping above the eyebrows tests them.", "wrong": ["The maxillary sinus is tapped over the cheek.", "The temporal bone is lateral, not above the eyebrows.", "", "The sphenoid sinus is deep and cannot be percussed.", "Ethmoid cells lie between the orbits beside the nasal bridge."], "pearl": "Frontal sinus drains to the middle meatus via the frontonasal duct/semilunar hiatus.", "set": "nasal_oral"}, {"id": "G-272", "stem": "A physician palpates the mastoid process of an adolescent with pain behind the ear. Which bone is being palpated?", "opts": ["Occipital", "Zygomatic", "Temporal", "Parietal", "Sphenoid"], "ans": 2, "why": "The mastoid process belongs to the mastoid part of the temporal bone (the others being squamous, petrous, and tympanic parts).", "wrong": ["The occipital bone is posterior but does not form the mastoid process.", "The zygomatic bone forms the cheek.", "", "The parietal bone forms the upper side of the vault.", "The sphenoid is central in the skull base."], "pearl": "Temporal bone parts: squamous, petrous, tympanic, mastoid (+ styloid and zygomatic processes).", "set": "cranial"}, {"id": "G-274", "stem": "A teenager's friend tries to pierce her left tragus but the needle punctures deeply just anterior to the tragus. The next morning the left temporal scalp up to the vertex is numb. Which nerve is most likely damaged?", "opts": ["Lesser occipital", "Greater occipital", "Auriculotemporal", "Zygomaticotemporal", "Great auricular"], "ans": 2, "why": "The auriculotemporal nerve (V3) emerges behind the TMJ and ascends just in front of the ear with the superficial temporal vessels, supplying the tragus, anterior auricle, and most of the temporal scalp.", "wrong": ["Lesser occipital supplies the scalp behind the ear.", "Greater occipital supplies the occipital scalp.", "", "Zygomaticotemporal supplies a small area over the anterior temple.", "Great auricular supplies skin over the angle of the mandible, parotid, and lower ear."], "pearl": "Auriculotemporal n.: pre-auricular, runs with superficial temporal a., carries otic parasympathetics to parotid.", "set": "face"}, {"id": "G-275", "stem": "A 27-year-old woman has unilateral facial paralysis. MRI shows a small tumor at the internal acoustic meatus. Which cranial nerve is most likely compressed?", "opts": ["V", "VI", "VII", "IX", "X"], "ans": 2, "why": "The internal acoustic meatus transmits CN VII and CN VIII; of these, only CN VII moves the facial muscles.", "wrong": ["CN V exits via SOF, rotundum, and ovale.", "CN VI enters the cavernous sinus and SOF.", "", "CN IX exits via the jugular foramen.", "CN X exits via the jugular foramen."], "pearl": "Facial palsy + hearing loss = internal acoustic meatus / CP angle lesion.", "set": "cn"}, {"id": "G-276", "stem": "A patient has a brain tumor near the crista galli and cribriform plate of the ethmoid bone. Which symptom is most likely?", "opts": ["Paralysis of facial muscles", "Loss of vision", "Difficulty swallowing", "Loss of smell", "Loss of hearing"], "ans": 3, "why": "Olfactory nerve fibers pass through the cribriform plate to the olfactory bulbs beside the crista galli, so a mass there causes anosmia.", "wrong": ["CN VII is in the posterior fossa and temporal bone.", "The optic nerve and chiasm lie further back, near the sella.", "Swallowing is IX and X in the posterior fossa.", "", "Hearing is CN VIII at the internal acoustic meatus."], "pearl": "Cribriform plate lesion/fracture -> anosmia +/- CSF rhinorrhea.", "set": "cranial"}, {"id": "G-277", "stem": "A 20-year-old man has a fracture of the sella turcica after a motorcycle crash. Which bone was most likely damaged?", "opts": ["Sphenoid", "Temporal", "Occipital", "Ethmoid", "Frontal"], "ans": 0, "why": "The sella turcica (hypophyseal fossa) is a saddle-shaped depression on the upper surface of the body of the sphenoid bone.", "wrong": ["", "The temporal bone forms the lateral middle fossa and petrous ridge.", "The occipital bone forms the posterior fossa and foramen magnum.", "The ethmoid is in the anterior fossa (cribriform plate).", "The frontal bone forms most of the anterior fossa floor."], "pearl": "Sella turcica = sphenoid body; houses the pituitary, flanked by cavernous sinuses.", "set": "cranial"}, {"id": "G-278", "stem": "A 21-year-old man cuts his scalp deeply while shaving his head; the wound becomes infected and then subsides. Three weeks later he has severe headache and nausea and is found to have an infection of the superior sagittal sinus. Which veins most likely carried the infection?", "opts": ["Intercavernous", "Inferior sagittal", "Diploic", "Basilar", "Emissary"], "ans": 4, "why": "Emissary veins pass through foramina in the calvaria and link scalp veins in the loose connective tissue layer with the dural venous sinuses, allowing scalp infections to reach the superior sagittal sinus.", "wrong": ["Intercavernous sinuses connect the two cavernous sinuses.", "The inferior sagittal sinus is in the free edge of the falx, not connected to scalp.", "Diploic veins drain the marrow space of the skull bones.", "The basilar plexus lies over the clivus.", ""], "pearl": "Scalp -> emissary veins -> dural sinuses (valveless route for infection).", "set": "cranial"}, {"id": "G-279", "stem": "A 20-year-old man has a deep 10-cm oblique laceration across his right cheek from a broken bottle. He cannot close his right eye or smile on the right side. Which additional structure was most likely damaged?", "opts": ["Vertebral artery", "Common carotid artery", "Parotid gland", "Lateral pterygoid muscle", "Temporalis muscle"], "ans": 2, "why": "CN VII branches radiate from within the parotid gland across the cheek. A wound deep enough to cut the zygomatic and buccal branches will likely also injure the parotid gland (and possibly its duct).", "wrong": ["The vertebral artery is deep in the neck, not the cheek.", "The common carotid artery is in the neck, below the face.", "", "Lateral pterygoid is a deep V3 muscle; injury would not cause facial palsy.", "Temporalis is in the temporal fossa and supplied by V3."], "pearl": "CN VII branches in parotid: To Zanzibar By Motor Car (temporal, zygomatic, buccal, marginal mandibular, cervical).", "set": "face"}, {"id": "G-280", "stem": "A 25-year-old man has an occipital bone fracture extending upward from the foramen magnum. Which structure passes through the foramen magnum?", "opts": ["Cranial nerve I", "Cranial nerve IX", "Cranial nerve X", "Cranial nerve XI", "Cranial nerve XII"], "ans": 3, "why": "The spinal roots of CN XI ascend through the foramen magnum (along with the medulla, vertebral arteries, and spinal arteries) before exiting via the jugular foramen.", "wrong": ["CN I passes through the cribriform plate.", "CN IX exits through the jugular foramen.", "CN X exits through the jugular foramen.", "", "CN XII exits through the hypoglossal canal."], "pearl": "Foramen magnum: medulla, vertebral aa., spinal aa., spinal roots of CN XI.", "set": "cranial"}, {"id": "G-281", "stem": "An 11-year-old girl undergoes tonsillectomy, and the surgeon damages the nerve lying in the tonsillar fossa deep to the palatine tonsil. Which deficit is most likely?", "opts": ["Loss of sensation on the posterior one third of the tongue", "Loss of taste on the anterior two thirds of the tongue", "Paralysis of the constrictor muscles of the pharynx", "Paralysis of the muscles of the soft palate", "Paralysis of the muscles of the tongue"], "ans": 0, "why": "The nerve in the tonsillar bed is CN IX, whose lingual branch carries general sensation and taste from the posterior third of the tongue.", "wrong": ["", "Anterior taste is carried by the chorda tympani (CN VII).", "Pharyngeal constrictors are supplied by CN X.", "Soft palate muscles are CN X (except tensor veli palatini, V3).", "Tongue muscles are CN XII (palatoglossus: CN X)."], "pearl": "CN IX: posterior 1/3 tongue (sensation + taste), stylopharyngeus, gag afferent, parotid secretomotor.", "set": "nasal_oral"}, {"id": "G-282", "stem": "A 70-year-old patient with sudden hoarseness has a small carcinoma in the mucosa over the right vocalis muscle. Which structure lies immediately lateral to the vocalis?", "opts": ["Lateral cricoarytenoid muscle", "Aryepiglottic muscle", "Posterior cricoarytenoid muscle", "Oblique arytenoid muscle", "Thyroarytenoid muscle"], "ans": 4, "why": "The vocalis is the medial slip of the thyroarytenoid, lying just lateral to the vocal ligament; the main thyroarytenoid lies directly lateral to it.", "wrong": ["Lateral cricoarytenoid runs from the cricoid arch to the arytenoid, further posterior-inferior.", "Aryepiglottic muscle lies in the aryepiglottic fold, superior.", "Posterior cricoarytenoid lies on the back of the cricoid lamina.", "Oblique arytenoids lie on the posterior arytenoids.", ""], "pearl": "Medial to lateral in the vocal fold: vocal ligament -> vocalis -> thyroarytenoid.", "set": "larynx"}, {"id": "G-283", "stem": "A 34-year-old woman with a swollen, protruding tongue and massive pharyngeal edema cannot be ventilated or orally intubated, and a cricothyrotomy is planned. Where should the incision be made?", "opts": ["The cricothyroid membrane, which is located at the junction of the clavicle and the sternum", "The cricothyroid membrane, which is located between the thyroid cartilage and the cricoid cartilage below", "The thyrohyoid membrane, which is located between the thyroid cartilage and the hyoid bone above", "The sternal notch, which is located at the junction of the clavicle and the sternum", "The trachea, which is located below the cricoid cartilage"], "ans": 1, "why": "Emergency cricothyrotomy is performed through the cricothyroid membrane, the palpable gap between the lower border of the thyroid cartilage and the cricoid arch.", "wrong": ["The cricothyroid membrane is not at the sternoclavicular junction.", "", "An incision here enters above the vocal folds and would not bypass obstruction.", "The sternal notch is far below the larynx.", "Tracheostomy below the cricoid is slower and more vascular; not the emergency route."], "pearl": "Cricothyrotomy: cricothyroid membrane, below the vocal folds - fastest surgical airway.", "set": "larynx"}, {"id": "G-284", "stem": "A patient is intubated without anesthesia, and the tube strikes the epiglottis, causing him to grimace. Which cranial nerve carries pain from this part of the larynx?", "opts": ["Vagus", "Glossopharyngeal", "Vestibulocochlear", "Hypoglossal", "Facial"], "ans": 0, "why": "The laryngeal inlet and epiglottis receive sensory supply from the internal laryngeal nerve, a branch of the vagus via the superior laryngeal nerve.", "wrong": ["", "CN IX supplies the oropharynx and posterior tongue, not the laryngeal epiglottis.", "CN VIII carries hearing and balance.", "CN XII is motor to the tongue.", "CN VII does not supply the epiglottis."], "pearl": "Larynx sensation: above folds = internal laryngeal (X); below folds = recurrent laryngeal (X).", "set": "larynx"}, {"id": "G-285", "stem": "A 55-year-old man has progressive right-sided hearing loss and tinnitus, an asymmetric smile, and a decreased right corneal reflex. CT shows a large intracranial tumor. Where is the tumor most likely located?", "opts": ["Between the medulla and the cerebellar hemisphere", "Above the diaphragma sellae", "Over the lateral hemispheric fissure", "Between the cerebellum and the lateral pons", "Between the cerebellar peduncles"], "ans": 3, "why": "An acoustic neuroma (vestibular schwannoma) grows in the cerebellopontine angle, where it compresses CN VIII and then the nearby CN VII and CN V.", "wrong": ["That region relates to the lower cranial nerves (IX-XII).", "Suprasellar masses compress the optic chiasm.", "A mass over the lateral fissure affects cortex, not cranial nerves.", "", "The region between the peduncles relates to the fourth ventricle, not CN V/VII/VIII."], "pearl": "CP angle tumor: VIII first (hearing loss, tinnitus), then VII (facial weakness) and V (lost corneal reflex).", "set": "cn"}, {"id": "G-286", "stem": "A 28-year-old woman has a painful outer-ear infection. When a speculum is pressed against the posterior wall of her external auditory meatus, she coughs and feels dizzy. Which nerve was most likely stimulated?", "opts": ["Vestibulocochlear", "Vagus", "Trigeminal", "Facial", "Accessory"], "ans": 1, "why": "The posterior canal wall is supplied by the auricular branch of the vagus. Stimulating it can trigger a cough or a vasovagal response (bradycardia, hypotension, lightheadedness).", "wrong": ["CN VIII serves hearing and balance, not canal skin.", "", "The auriculotemporal (V3) supplies most of the canal but does not provoke cough/syncope.", "CN VII's small sensory contribution does not trigger these reflexes.", "CN XI is motor only."], "pearl": "Posterior ear canal = auricular br. of X -> cough or vasovagal syncope.", "set": "cn"}, {"id": "G-287", "stem": "During thyroidectomy the superior thyroid artery is ligated, taking care to protect the nerve that runs next to it. Which muscle does this nerve supply?", "opts": ["Thyroarytenoid", "Lateral cricoarytenoid", "Posterior cricoarytenoid", "Cricothyroid", "Aryepiglotticus"], "ans": 3, "why": "The external branch of the superior laryngeal nerve accompanies the superior thyroid artery toward the upper pole of the thyroid and supplies the cricothyroid muscle.", "wrong": ["Supplied by the recurrent laryngeal nerve.", "Supplied by the recurrent laryngeal nerve.", "Supplied by the recurrent laryngeal nerve.", "", "Supplied by the recurrent laryngeal nerve."], "pearl": "Ligate superior thyroid a. close to the gland to spare the external laryngeal n. (cricothyroid).", "set": "neck"}, {"id": "G-288", "stem": "A 55-year-old woman has 2 weeks of severe headache. CT shows a dilated branch of the basilar artery at the junction of the pons and medulla on the right side. Which clinical feature might she have?", "opts": ["Weak abduction and depression of the right eye", "Weak adduction of the left eye", "Weak adduction and elevation of the right eye", "Weak abduction of the right eye", "Weak abduction of the left eye"], "ans": 3, "why": "CN VI emerges at the pontomedullary junction close to the AICA and labyrinthine arteries. A right-sided aneurysm there compresses the right abducens nerve, weakening the right lateral rectus.", "wrong": ["Adding weak depression implies CN IV, which exits the dorsal midbrain.", "Adduction is CN III; the lesion is right-sided and at the wrong level.", "Weak adduction/elevation implies CN III at the pons-midbrain junction.", "", "The lesion is on the right, so the left eye is unaffected."], "pearl": "Pontomedullary junction = CN VI (near AICA); pons-midbrain junction = CN III (between PCA and SCA).", "set": "cn"}, {"id": "G-289", "stem": "A 65-year-old woman has 2 weeks of severe headache. CT shows a dilated branch of the basilar artery at the junction of the pons and midbrain on the right side. Which clinical feature might she have?", "opts": ["Weak abduction of the right eye", "Blurred vision from the right eye and full ptosis of the right upper eyelid", "Loss of vision from lateral fields right eye and medial fields of left eye", "Inability to detect odors through the right nostril", "Loss of sensation of the skin over the right forehead, cheek, and mandible"], "ans": 1, "why": "CN III emerges at the pons-midbrain junction between the PCA and SCA. Compression causes full ptosis (levator) and blurred near vision from loss of parasympathetic input for accommodation.", "wrong": ["Abduction is CN VI at the pontomedullary junction.", "", "That field loss pattern arises from optic tract/radiation lesions, not CN III.", "Smell is CN I in the anterior cranial fossa.", "That is a CN V lesion, which emerges from the mid-lateral pons."], "pearl": "CN III palsy: complete ptosis, down-and-out eye, dilated pupil, loss of accommodation.", "set": "cn"}, {"id": "G-290", "stem": "A 60-year-old man has numbness of the right lower jaw and inner cheek, loss of sensation over the posterior temporal scalp and anterior auricle, and weak lateral deviation of the mandible. CT shows a mass in the infratemporal fossa. Which other function is most likely affected?", "opts": ["Weak elevation of the corner of the right side of the mouth", "Loss of sensation over the upper lip and to the upper teeth", "Inability to sense a foreign body in the right eye", "Decreased secretion from the parotid gland", "Inability to abduct the right eye"], "ans": 3, "why": "The findings point to V3 branches in the infratemporal fossa, including the auriculotemporal nerve. That nerve also carries postganglionic parasympathetic fibers from the otic ganglion to the parotid, so salivation from the parotid would drop.", "wrong": ["Mouth-corner elevation is CN VII (zygomatic/buccal branches).", "Upper lip and upper teeth are V2.", "Corneal sensation is V1.", "", "Abduction is CN VI in the orbit/cavernous sinus."], "pearl": "Otic ganglion (IX via lesser petrosal) -> auriculotemporal n. (V3) -> parotid.", "set": "face"}, {"id": "G-291", "stem": "A 40-year-old woman has painful, warm swelling over the left mandible in front of the ear. Ultrasound shows a stone in the parotid duct with the duct distended proximally. Which other clinical feature is most likely?", "opts": ["Weak deviation of the mandible to the right", "Complete ptosis of the left eyelid", "Numbness of the skin over the left lower mandible", "Excessive tearing", "Pain over the anterior auricle, tragus, and anterior helix"], "ans": 4, "why": "A swollen parotid can irritate the auriculotemporal nerve, which runs through/near the gland and supplies the anterior auricle, tragus, and helix, giving pain there.", "wrong": ["Lateral jaw movement is by the pterygoids (V3), not in the gland.", "Complete ptosis is CN III.", "Skin over the lower mandible is supplied by the mental nerve and great auricular nerve.", "Tearing is driven by CN VII via the pterygopalatine ganglion, not the parotid.", ""], "pearl": "Parotid swelling -> auriculotemporal pain (pre-auricular/temple); CN VII branches also run through gland.", "set": "face"}, {"id": "G-293", "stem": "A 30-year-old unrestrained driver has facial deformity with step-off defects over the nasal root and glabella and clear fluid draining from his nose. CT shows a fracture of the middle region of the anterior cranial fossa. What will he most likely complain of once conscious?", "opts": ["Blurred vision", "Diplopia", "Anosmia", "Blindness", "Dry left eye"], "ans": 2, "why": "The midline anterior cranial fossa contains the cribriform plate. Its fracture tears olfactory fibers (anosmia) and dura (CSF rhinorrhea).", "wrong": ["Blurred vision relates to CN III/lens or globe injury, not the cribriform plate.", "Diplopia implies orbital or extraocular nerve injury.", "", "Blindness implies optic canal injury, which is posterior-lateral.", "Dry eye implies injury to the lacrimal pathway (greater petrosal/pterygopalatine)."], "pearl": "CSF rhinorrhea + anosmia = cribriform plate fracture.", "set": "cranial"}, {"id": "G-295", "stem": "A 30-year-old unrestrained driver has a displaced transverse fracture of the right mandibular ramus just above the angle. Which function will most likely be affected?", "opts": ["Elevation of the jaw", "Lateral deviation of the jaw to the left side", "Salivation; sensation and taste from the anterior tongue", "Sensation from skin over anterior cheek and tongue", "Salivation; sensation from posterior temporal skin and tragus of the ear"], "ans": 2, "why": "The lingual nerve, carrying chorda tympani fibers, runs between the medial pterygoid and the ramus. A ramus fracture can injure it, reducing submandibular/sublingual salivation plus general sensation and taste from the anterior tongue.", "wrong": ["Elevation uses masseter, temporalis, and medial pterygoid, which are not denervated here.", "Lateral deviation depends on the pterygoids, which remain innervated.", "", "Anterior cheek skin is not supplied by the lingual nerve.", "That pattern is auriculotemporal (parotid, temple, tragus), which lies higher and posterior."], "pearl": "Lingual n. + chorda tympani: anterior 2/3 tongue sensation and taste; submandibular/sublingual secretion.", "set": "face"}, {"id": "G-296", "stem": "A 20-year-old motorcyclist has a minimally displaced fracture of the floor of the middle cranial fossa involving the pterygoid canal. Which fiber types are most likely affected?", "opts": ["Presynaptic parasympathetic", "Postsynaptic sympathetic; presynaptic parasympathetic", "Postsynaptic sympathetic; postsynaptic parasympathetic", "Special sensory; postsynaptic parasympathetic", "General sensory; postsynaptic parasympathetic"], "ans": 1, "why": "The nerve of the pterygoid canal forms from the greater petrosal nerve (preganglionic parasympathetic from CN VII) and the deep petrosal nerve (postganglionic sympathetic from the internal carotid plexus).", "wrong": ["Omits the postganglionic sympathetic fibers of the deep petrosal nerve.", "", "The parasympathetic fibers have not yet synapsed in the pterygopalatine ganglion.", "Taste and postganglionic fibers are not in the Vidian nerve.", "General sensory and postganglionic parasympathetic fibers travel with V2 branches, not the canal."], "pearl": "Vidian nerve = greater petrosal (pre-parasympathetic) + deep petrosal (post-sympathetic) -> pterygopalatine ganglion.", "set": "nasal_oral"}, {"id": "G-297", "stem": "A 20-year-old man with a recent open fracture of the right temporal bone develops fever and a tender temporal swelling. Examination suggests neuritis of the nerve in the distal part of the facial canal. Which function is likely spared?", "opts": ["Taste from the anterior two thirds of the tongue", "Movements of the right side of the face", "Secretions from the submandibular gland", "Secretions from the sublingual gland", "Secretions from the lacrimal gland"], "ans": 4, "why": "The greater petrosal nerve (lacrimal secretomotor) leaves CN VII at the geniculate ganglion, proximal to the distal facial canal. A distal lesion therefore spares tearing but affects the chorda tympani (taste, submandibular/sublingual secretion) and facial motor fibers.", "wrong": ["Chorda tympani leaves in the distal canal, so taste is affected.", "The motor fibers run through the entire canal and are affected.", "Submandibular secretion rides with the chorda tympani and is affected.", "Sublingual secretion rides with the chorda tympani and is affected.", ""], "pearl": "Level of CN VII lesion: geniculate (lacrimation) -> stapedius (hyperacusis) -> chorda tympani (taste/saliva) -> stylomastoid (face only).", "set": "cn"}, {"id": "G-299", "stem": "A 30-year-old man is struck just below the right eye by a cricket ball and has severe pain and double vision. CT shows a displaced fracture of the inferior orbital margin and floor along the zygomaticomaxillary suture. Which finding best explains his symptoms?", "opts": ["Partial ptosis of the upper eyelid", "Complete ptosis of the upper eyelid", "Inability to elevate the abducted eyeball", "Inability to depress the abducted eyeball", "Inability to produce tears"], "ans": 2, "why": "An orbital floor fracture can entrap the inferior muscles (inferior rectus/inferior oblique) and tether the globe, so the eye cannot be elevated and the patient has diplopia on upgaze.", "wrong": ["Ptosis requires levator or tarsal muscle injury in the upper orbit.", "Complete ptosis requires CN III or levator injury.", "", "Depression in abduction is inferior rectus action; the key issue is restricted elevation.", "Tear production depends on the lacrimal gland/parasympathetics, not the orbital floor."], "pearl": "Orbital floor fracture -> restricted upgaze, diplopia, infraorbital numbness.", "set": "orbit"}, {"id": "G-300", "stem": "A 40-year-old woman has 3 months of vertigo, nausea, and reduced hearing in the left ear, along with a dry mouth and dry left eye. CT shows thickening of the skull bones. Which area is most likely affected?", "opts": ["Petrous temporal bone", "Infratemporal fossa", "Facial canal", "Middle ear", "Inner ear"], "ans": 0, "why": "The petrous temporal bone contains the inner ear (CN VIII: hearing, balance) and the facial canal with CN VII (greater petrosal and chorda tympani carrying lacrimal and salivary secretomotor fibers), so one lesion there explains all findings.", "wrong": ["", "An ITF lesion would not cause hearing loss or vertigo.", "A facial canal lesion alone would not cause vertigo or hearing loss.", "Middle ear disease explains hearing loss but not dry eye/mouth.", "Inner ear disease explains vertigo and hearing loss but not dry eye/mouth."], "pearl": "Petrous temporal bone houses CN VII (facial canal) and CN VIII (inner ear).", "set": "cn"}, {"id": "G-303", "stem": "A 30-year-old woman has nasal congestion, headache, clear rhinorrhea, fever, and swollen conchae. There is tenderness over the forehead above the nasal root and on either side of the glabella. Which structure is the most likely passage for spread of infection?", "opts": ["Pharyngotympanic tube", "Ethmoidal infundibulum", "Nasolacrimal duct", "Spheno-ethmoidal recess", "Superior nasal meatus"], "ans": 1, "why": "The frontal sinus and anterior ethmoidal cells drain into the middle meatus through the ethmoidal infundibulum and semilunar hiatus, linking nasal infection to the tender sinuses near the glabella.", "wrong": ["The pharyngotympanic tube links the nasopharynx to the middle ear.", "", "The nasolacrimal duct drains tears to the inferior meatus.", "The sphenoethmoidal recess drains the sphenoid sinus.", "The superior meatus drains the posterior ethmoidal cells."], "pearl": "Middle meatus (semilunar hiatus/infundibulum): frontal, maxillary, anterior ethmoid sinuses.", "set": "nasal_oral"}, {"id": "G-308", "stem": "A 64-year-old man had a parotidectomy for a malignant tumor. About a year later, he sweats on that side of his face when he sees appetizing food. Where are the cell bodies of the nerve fibers now innervating his sweat glands?", "opts": ["Ciliary ganglion", "Pterygopalatine ganglion", "Otic ganglion", "Submandibular ganglion", "Superior salivatory nucleus"], "ans": 2, "why": "In Frey syndrome, cut postganglionic parasympathetic fibers from the otic ganglion regrow along the auriculotemporal nerve into facial sweat glands, so salivary stimuli now cause sweating.", "wrong": ["The ciliary ganglion supplies the sphincter pupillae and ciliary muscle.", "The pterygopalatine ganglion supplies lacrimal and nasal/palatal glands.", "", "The submandibular ganglion supplies the submandibular/sublingual glands.", "The superior salivatory nucleus holds preganglionic CN VII cell bodies, not postganglionic."], "pearl": "Frey syndrome: otic ganglion fibers via auriculotemporal n. aberrantly reinnervate sweat glands.", "set": "face"}, {"id": "LC-1", "stem": "After asking a 47-year-old woman to open her mouth wide and say \"Ah,\" the physician notes deviation of the uvula to the left side and asymmetric elevation of the soft palate, with the right side of the palate sagging. What specific nerve is most likely damaged?", "opts": ["Left glossopharyngeal nerve", "Left vagus nerve", "Right vagus nerve", "Left hypoglossal nerve", "Right hypoglossal nerve"], "ans": 2, "why": "The vagus (via pharyngeal plexus) supplies all palatal muscles except tensor veli palatini. With a right CN X lesion, the right palate droops and intact left muscles pull the uvula toward the left (away from the lesion).", "wrong": ["CN IX supplies only stylopharyngeus; no palatal muscle, so no uvular deviation.", "A left CN X lesion would make the uvula deviate to the right.", "", "CN XII moves the tongue, not the palate; left lesion deviates tongue left.", "CN XII moves the tongue, not the palate; right lesion deviates tongue right."], "pearl": "Uvula points AWAY from the damaged vagus nerve.", "set": "nasal_oral"}, {"id": "LC-2", "stem": "A 59-year-old man is unable to close his right eye. Examination also shows an asymmetric smile and an inability to wrinkle the right side of his forehead. What cranial nerve is affected?", "opts": ["Trigeminal nerve", "Facial nerve", "Glossopharyngeal nerve", "Vagus nerve", "Hypoglossal nerve"], "ans": 1, "why": "The facial nerve supplies all muscles of facial expression, including orbicularis oculi (eye closure) and frontalis (forehead wrinkling). A lesion of its trunk gives ipsilateral paralysis of the whole hemiface, as in Bell palsy.", "wrong": ["CN V3 supplies muscles of mastication, not muscles of facial expression.", "", "CN IX motor supply is only stylopharyngeus.", "CN X lesions cause dysphagia/dysphonia, not facial paralysis.", "CN XII supplies tongue muscles only."], "pearl": "Whole-hemiface paralysis incl. forehead = lower motor neuron CN VII lesion (Bell palsy).", "set": "face"}, {"id": "LC-3", "stem": "A 23-year-old man has shoulder weakness and instability; his left shoulder sits lower than the right. He cannot abduct his left arm above his head and cannot shrug his left shoulder against resistance. What nerve was most likely damaged?", "opts": ["Facial nerve", "Glossopharyngeal nerve", "Vagus nerve", "Accessory nerve", "Hypoglossal nerve"], "ans": 3, "why": "CN XI supplies trapezius (and SCM). Trapezius paralysis causes a drooping shoulder, weak shrug, and loss of the upward scapular rotation needed to abduct above 90 degrees.", "wrong": ["CN VII lesions cause facial paralysis, hyperacusis, taste loss; not shoulder weakness.", "CN IX lesions affect gag afferent, posterior tongue taste, parotid secretion.", "CN X lesions cause dysphagia and dysphonia, not trapezius weakness.", "", "CN XII supplies tongue muscles; would not affect trapezius."], "pearl": "Shoulder droop + weak shrug + can't abduct above 90 degrees = CN XI (trapezius).", "set": "neck"}, {"id": "LC-4", "stem": "A 10-year-old boy undergoes bilateral palatine tonsillectomy. Postoperatively he has no gag reflex when the right posterior tongue is stimulated and reports abnormal taste in the back of his mouth. The soft palate elevates symmetrically. No other deficits are noted. What cranial nerve was damaged?", "opts": ["Trigeminal nerve", "Facial nerve", "Glossopharyngeal nerve", "Vagus nerve", "Hypoglossal nerve"], "ans": 2, "why": "The tonsillar and lingual branches of CN IX lie in the tonsillar bed and are vulnerable during tonsillectomy. CN IX carries taste/general sensation from the posterior third of the tongue and forms the afferent limb of the gag reflex.", "wrong": ["CN V (lingual n.) gives general sensation to the anterior two thirds, not posterior tongue.", "CN VII (chorda tympani) carries anterior two-thirds taste; not part of gag reflex.", "", "CN X is the efferent gag limb; symmetric palate elevation shows it is intact.", "CN XII is purely motor to tongue; no taste or gag role."], "pearl": "Tonsillectomy + lost gag afferent + posterior tongue taste loss = CN IX.", "set": "nasal_oral"}, {"id": "LC-5", "stem": "A 23-year-old man has an impacted left third mandibular molar extracted. Afterward he reports numbness of the anterior part of his tongue. Which nerve is damaged?", "opts": ["Chorda tympani nerve", "Mylohyoid nerve", "Inferior alveolar nerve", "Lingual nerve", "Glossopharyngeal nerve"], "ans": 3, "why": "The lingual nerve (CN V3) gives general sensation to the anterior two thirds of the tongue and runs right next to the third molar, so it is at risk during extraction.", "wrong": ["Chorda tympani carries taste and secretomotor fibers, not general sensation (numbness).", "Mylohyoid n. is motor to mylohyoid and anterior digastric.", "IAN supplies lower teeth, gingiva, and (via mental n.) lower lip/chin, not tongue.", "", "CN IX supplies the posterior third of the tongue."], "pearl": "Numb anterior tongue after wisdom tooth extraction = lingual nerve.", "set": "nasal_oral"}, {"id": "LC-6", "stem": "A 47-year-old woman with multiple sclerosis has sudden paroxysms of pain in her right lower lip, mandibular teeth and gingivae, and cheek, triggered by eating, talking, or brushing her teeth. Which nerve is the source of her pain?", "opts": ["First division of trigeminal nerve", "Second division of trigeminal nerve", "Third division of trigeminal nerve", "Buccal branch of facial nerve", "Marginal mandibular branch of facial nerve"], "ans": 2, "why": "This is trigeminal neuralgia in the V3 territory: V3 supplies the lower lip, chin, cheek (buccal n.), and mandibular teeth/gums (inferior alveolar n.). Demyelinating disease such as MS is a known cause.", "wrong": ["V1 supplies forehead, upper eyelid, and dorsum of nose.", "V2 supplies lower eyelid, upper lip, cheek, and maxillary teeth.", "", "Facial nerve branches are motor only; no pain sensation.", "Facial nerve branches are motor only; supplies lower lip muscles."], "pearl": "Trigeminal neuralgia (tic douloureux): lancinating triggered facial pain; think MS in young patients.", "set": "face"}, {"id": "LC-7", "stem": "A 45-year-old man has dysarthria and fasciculations of his tongue muscles. When he protrudes his tongue, it deviates to the right. What nerve is most likely damaged?", "opts": ["Left hypoglossal nerve", "Right hypoglossal nerve", "Left glossopharyngeal nerve", "Left vagus nerve", "Right vagus nerve"], "ans": 1, "why": "CN XII supplies all tongue muscles except palatoglossus. With a right lesion, the intact left genioglossus pushes the tongue toward the weak right side.", "wrong": ["A left CN XII lesion would deviate the tongue to the left.", "", "CN IX supplies no tongue muscle, so it can't cause deviation.", "Left CN X lesion causes uvula deviation to the right, not tongue deviation.", "CN X supplies only palatoglossus in the tongue; no protrusion deficit."], "pearl": "Tongue \"licks the wound\": deviates TOWARD the damaged CN XII.", "set": "nasal_oral"}, {"id": "LC-8", "stem": "An 18-year-old skier strikes a tree with his forehead, sustaining multiple fractures. He has a clear nasal discharge that tests positive for glucose. Which cranial nerve was most likely damaged?", "opts": ["Olfactory nerve", "Optic nerve", "Abducent nerve", "Facial nerve", "Hypoglossal nerve"], "ans": 0, "why": "Glucose-positive rhinorrhea is CSF leaking through a fractured cribriform plate of the ethmoid. The olfactory nerve fibers pass through that plate and are torn, causing anosmia.", "wrong": ["", "CN II injury causes visual loss, not linked to CSF rhinorrhea.", "CN VI is classically hurt by raised ICP or cavernous sinus lesions.", "CN VII injury causes facial paralysis, hyperacusis, taste loss; none present.", "CN XII injury causes tongue deviation and dysarthria; none present."], "pearl": "CSF rhinorrhea = cribriform plate fracture = anosmia (CN I).", "set": "cranial"}, {"id": "LC-9", "stem": "A 54-year-old man cannot open his left eye. When he lifts the lid with his fingers, the left eye is directed inferiorly and laterally, causing diplopia, and the left pupil is dilated. What nerve is most likely affected?", "opts": ["Left oculomotor nerve", "Right oculomotor nerve", "Left abducent nerve", "Right abducent nerve", "Left trochlear nerve"], "ans": 0, "why": "CN III supplies levator palpebrae (ptosis when lost), four EOMs (unopposed lateral rectus and superior oblique leave the eye down and out), and parasympathetics to sphincter pupillae (mydriasis).", "wrong": ["", "Findings are in the left eye, so the right CN III is intact.", "Left CN VI palsy leaves the eye adducted, without ptosis or mydriasis.", "Right CN VI palsy would affect the right eye and cause esotropia.", "CN IV palsy causes vertical diplopia but no ptosis or dilated pupil."], "pearl": "\"Down and out\" eye + ptosis + blown pupil = CN III palsy.", "set": "orbit"}, {"id": "LC-10", "stem": "A 24-year-old man with chronic maxillary sinusitis has a soft-tissue mass in the roof of the right maxillary sinus, which is biopsied endoscopically. Postoperatively he has paresthesia and numbness of the right lower eyelid and upper lip. Which nerve was most likely damaged?", "opts": ["First division of trigeminal nerve", "Second division of trigeminal nerve", "Third division of trigeminal nerve", "Zygomatic branch of facial nerve", "Buccal branch of facial nerve"], "ans": 1, "why": "The infraorbital nerve, the continuation of V2, runs in the roof of the maxillary sinus (orbital floor) and supplies the lower eyelid, cheek, and upper lip.", "wrong": ["V1 supplies the forehead and upper eyelid and does not course through the maxillary sinus.", "", "V3 supplies the lower lip and chin; no branch runs in the sinus roof.", "Facial nerve branches are motor only and cause no numbness.", "Facial nerve branches are motor only and cause no numbness."], "pearl": "Maxillary sinus roof / orbital floor injury = infraorbital nerve (V2): numb lower lid, cheek, upper lip.", "set": "nasal_oral"}, {"id": "LC-11", "stem": "A 38-year-old woman reports tripping and double vision when descending stairs. On eye-movement testing she cannot move her left eye inferiorly when looking toward her right side. What specific nerve is most likely damaged?", "opts": ["Left oculomotor nerve", "Right oculomotor nerve", "Left abducent nerve", "Right abducent nerve", "Left trochlear nerve"], "ans": 4, "why": "Superior oblique (CN IV) is the main depressor of the adducted eye. Looking right adducts the left eye, so inability to look down there points to the left trochlear nerve, giving diplopia on stairs.", "wrong": ["Left CN III palsy gives ptosis and a down-and-out eye; not present.", "Right CN III would affect the right eye, with ptosis.", "Left CN VI palsy impairs abduction, causing esotropia.", "Right CN VI would affect the right eye's abduction.", ""], "pearl": "Trouble walking downstairs / reading = CN IV (superior oblique) palsy; test by looking down with eye adducted.", "set": "orbit"}, {"id": "LC-12", "stem": "A 68-year-old woman with thyroid cancer undergoes total thyroidectomy. Postoperatively she has hoarseness and dysphonia. What nerve was damaged?", "opts": ["Lingual branch of glossopharyngeal nerve", "Accessory nerve", "Superior laryngeal nerve", "Recurrent laryngeal nerve", "Hypoglossal nerve"], "ans": 3, "why": "The recurrent laryngeal nerve (CN X) ascends behind the thyroid and supplies all intrinsic laryngeal muscles except cricothyroid. Injury during thyroidectomy paralyzes the ipsilateral vocal fold, causing hoarseness.", "wrong": ["Supplies posterior tongue sensation/taste; no role in phonation.", "CN XI injury weakens shoulder shrug and head turning.", "External SLN injury alters pitch (cricothyroid) rather than causing hoarseness.", "", "CN XII injury causes tongue deviation and dysarthria, not hoarseness."], "pearl": "Hoarseness after thyroidectomy = RLN (runs with inferior thyroid artery).", "set": "neck"}, {"id": "LC-13", "stem": "A 67-year-old man presents with shingles on his left forehead, upper eyelid, and bridge of the nose. Shingles (herpes zoster) is caused by varicella zoster virus, which lies latent in sensory ganglia after chickenpox and can reactivate along one nerve's dermatome when the patient is immunocompromised. Which sensory ganglion is most likely affected in this patient?", "opts": ["Otic ganglion", "Trigeminal ganglion", "Superior cervical ganglion", "Ciliary ganglion", "Submandibular ganglion"], "ans": 1, "why": "The rash follows the V1 dermatome, so the virus is reactivating in the trigeminal (semilunar) ganglion. That sensory ganglion holds the pseudounipolar cell bodies of CN V.", "wrong": ["Otic ganglion is parasympathetic (to parotid), not a sensory ganglion.", "", "Superior cervical ganglion is sympathetic, not sensory.", "Ciliary ganglion is parasympathetic (CN III pathway).", "Submandibular ganglion is parasympathetic (CN VII pathway)."], "pearl": "Herpes zoster ophthalmicus = V1 dermatome; watch for nose-tip lesions (Hutchinson sign).", "set": "cn"}, {"id": "LC-14", "stem": "A 13-year-old girl has loss of sensation in her right lower eyelid, the skin below her right eye, and her upper lip and teeth. What is the most likely location of the nerve lesion?", "opts": ["Foramen rotundum", "Foramen spinosum", "Superior orbital fissure", "Foramen ovale", "Optic canal"], "ans": 0, "why": "All deficits fall in the V2 (maxillary) territory. V2 leaves the middle cranial fossa through the foramen rotundum in the greater wing of the sphenoid.", "wrong": ["", "Transmits middle meningeal artery and meningeal branch of V3.", "Transmits CN III, IV, V1, VI, and superior ophthalmic vein.", "Transmits V3, which supplies lower lip and chin.", "Transmits CN II and the ophthalmic artery."], "pearl": "V1 = superior orbital fissure, V2 = rotundum, V3 = ovale (\"Standing Room Only\").", "set": "cranial"}, {"id": "LC-15", "stem": "A 12-year-old boy fractures the floor of the right middle cranial fossa in a car accident. Examination shows loss of emotional tearing on the same side. Which nerve is most likely damaged?", "opts": ["Greater petrosal nerve", "Lesser petrosal nerve", "Deep petrosal nerve", "Lacrimal nerve", "Chorda tympani nerve"], "ans": 0, "why": "Tearing depends on preganglionic parasympathetic fibers of CN VII carried by the greater petrosal nerve. It leaves the geniculum and runs along the middle cranial fossa floor toward the pterygoid canal and pterygopalatine ganglion, so it is easily hurt in fractures there.", "wrong": ["", "Carries CN IX parasympathetics to the otic ganglion for the parotid.", "Sympathetic fibers; does not drive lacrimation.", "Lies in the orbit, not injured by a middle cranial fossa fracture.", "Supplies submandibular/sublingual glands and anterior tongue taste."], "pearl": "Lacrimation pathway: CN VII → greater petrosal → n. of pterygoid canal → pterygopalatine ganglion → lacrimal gland.", "set": "nasal_oral"}, {"id": "LC-16", "stem": "A 42-year-old woman has a drooping right upper eyelid and a constricted right pupil. Examination shows ptosis, miosis, anhidrosis, facial flushing, and a narrowed palpebral fissure on the right. Which structure is most likely damaged?", "opts": ["Superior division of the oculomotor nerve", "Superior cervical ganglion", "Nerve of the pterygoid canal", "Ciliary ganglion", "Ophthalmic division of trigeminal nerve"], "ans": 1, "why": "This is Horner syndrome, a loss of sympathetic supply to the head. All postganglionic sympathetic fibers to the head arise from the superior cervical ganglion, the only sympathetic option.", "wrong": ["Skeletal motor to superior rectus and levator; ptosis only, no miosis or anhidrosis.", "", "Loss would cause dry eye and nasal mucosa, not Horner signs.", "Damage would impair pupil/accommodation but not facial sweating or flushing.", "Sensory only; would cause numbness of upper face and cornea."], "pearl": "Horner = ptosis (superior tarsal), miosis, anhidrosis; sympathetic chain/SCG lesion.", "set": "orbit"}, {"id": "LC-17", "stem": "A 32-year-old man has paralysis of the muscles of mastication on the right side, causing facial asymmetry and difficulty chewing. His chief complaint is difficulty swallowing (dysphagia). Which muscle is most likely involved in his dysphagia?", "opts": ["Sternohyoid", "Stylohyoid", "Cricothyroid", "Stylopharyngeus", "Mylohyoid"], "ans": 4, "why": "Paralysis of mastication muscles points to a V3 lesion. V3 also supplies mylohyoid (and anterior digastric), which elevate the hyoid and floor of mouth during swallowing, so its loss causes dysphagia.", "wrong": ["Innervated by ansa cervicalis (C1-C3), not V3.", "Innervated by CN VII, not V3.", "Innervated by the external branch of the superior laryngeal nerve; affects pitch.", "Innervated by CN IX, not V3.", ""], "pearl": "V3 motor: 4 muscles of mastication + MATT (Mylohyoid, Anterior digastric, Tensor tympani, Tensor veli palatini).", "set": "face"}, {"id": "LC-18", "stem": "A 27-year-old woman has asymmetric pupils: her right pupil is abnormally dilated and responds slowly to light. Visual acuity is normal, and there are no other signs or symptoms. Which structure is most likely affected?", "opts": ["Superior cervical ganglion", "Optic nerve", "Oculomotor nerve", "Trochlear nerve", "Abducent nerve"], "ans": 2, "why": "Parasympathetic fibers ride on the outside of CN III, so compression affects them first. Loss of sphincter pupillae gives a dilated, sluggish pupil, an early sign of CN III compression (e.g., uncal herniation).", "wrong": ["SCG damage gives miosis (Horner), not a dilated pupil.", "Optic nerve damage would impair vision in that eye.", "", "CN IV palsy causes vertical diplopia, not pupil changes.", "CN VI palsy causes impaired abduction, not pupil changes."], "pearl": "Isolated blown/sluggish pupil = early CN III compression (parasympathetics are superficial).", "set": "orbit"}, {"id": "LC-19", "stem": "To distinguish idiopathic unilateral facial paralysis (Bell palsy) from herpes zoster infection of CN VII, the physician looks for small herpetic vesicles. Where are these lesions located in herpes zoster infection involving the facial nerve?", "opts": ["Mental region of the mandible", "Temporal and parietal region of the scalp", "Upper lip and cheek of the face", "Auricle of the external ear", "Bridge and tip of the external nose"], "ans": 3, "why": "CN VII's only cutaneous territory is a small part of the auricle/external ear. Reactivation in the geniculate ganglion (Ramsay Hunt syndrome) puts vesicles there along with facial paralysis.", "wrong": ["Supplied by the mental nerve (V3).", "Supplied by the auriculotemporal nerve (V3).", "Supplied by the infraorbital nerve (V2).", "", "Supplied by infratrochlear and external nasal nerves (V1)."], "pearl": "Ramsay Hunt: facial palsy + ear vesicles (geniculate ganglion), ± hearing loss/vertigo.", "set": "cn"}, {"id": "LC-20", "stem": "A 37-year-old man has decreased emotional tearing on the right and intermittent headaches. MRI shows a facial nerve schwannoma within the right pterygoid (vidian) canal. Which nerve fibers are most likely injured by this tumor?", "opts": ["Taste fibers to the anterior two thirds of the tongue", "Parasympathetic innervation to the submandibular and sublingual glands", "Presynaptic sympathetic fibers", "Presynaptic parasympathetic fibers", "Postsynaptic parasympathetic fibers"], "ans": 3, "why": "The vidian nerve combines preganglionic parasympathetic fibers (greater petrosal, CN VII) and postganglionic sympathetic fibers (deep petrosal). The parasympathetics synapse only later in the pterygopalatine ganglion, so in the canal they are still presynaptic.", "wrong": ["Carried by chorda tympani, which does not pass through the pterygoid canal.", "Carried by chorda tympani, not the pterygoid canal.", "Head sympathetics have already synapsed in the SCG, so they are postsynaptic.", "", "Parasympathetics synapse after the canal, in the pterygopalatine ganglion."], "pearl": "Vidian nerve = greater petrosal (preganglionic parasymp) + deep petrosal (postganglionic symp).", "set": "nasal_oral"}, {"id": "LC-21", "stem": "A 57-year-old woman has right facial paralysis, dizziness, and hearing loss on the right side. MRI shows a brain tumor. Based on her presentation, where is the tumor located?", "opts": ["Foramen rotundum", "Foramen ovale", "Internal acoustic meatus", "Facial canal", "Stylomastoid foramen"], "ans": 2, "why": "Combined CN VII (facial paralysis) and CN VIII (hearing loss, dizziness) deficits localize to where both nerves run together: the internal acoustic meatus, typical of a vestibular schwannoma at the cerebellopontine angle.", "wrong": ["Transmits V2; would cause midface numbness.", "Transmits V3; would cause mastication weakness and lower-face numbness.", "", "CN VIII is not in the facial canal, so hearing would be spared.", "Only CN VII exits here; hearing would be spared."], "pearl": "CN VII + VIII deficits = internal acoustic meatus / CPA (vestibular schwannoma).", "set": "cranial"}, {"id": "LC-25", "stem": "A 27-year-old man reports double vision. His left eye is turned inward (esotropia), giving a cross-eyed appearance. When asked to follow the examiner's finger, he cannot look laterally with that eye. No other visual deficits are noted. What specific nerve is most likely damaged?", "opts": ["Left oculomotor nerve", "Right oculomotor nerve", "Left abducent nerve", "Right abducent nerve", "Left trochlear nerve"], "ans": 2, "why": "The left abducens supplies only the left lateral rectus. Without it, the unopposed medial rectus pulls the eye inward (esotropia) and the eye cannot abduct.", "wrong": ["Left CN III palsy gives a down-and-out eye with ptosis, not esotropia.", "Right CN III would affect the right eye and cause ptosis.", "", "The left eye is the one affected, not the right.", "CN IV palsy impairs depression in adduction, not abduction."], "pearl": "Esotropia + failed abduction = ipsilateral CN VI palsy (lateral rectus).", "set": "orbit"}, {"id": "LC-26", "stem": "A 25-year-old boxer is knocked unconscious. After waking he has a severe headache, nausea, and vomiting. Concerned about intracranial trauma, which cranial nerve can the ringside physician observe, without imaging, for signs of increased intracranial pressure?", "opts": ["Optic nerve", "Oculomotor nerve", "Olfactory nerve", "Trigeminal nerve", "Trochlear nerve"], "ans": 0, "why": "The optic nerve is wrapped in meninges with CSF in its subarachnoid space, so raised ICP is transmitted to the optic disc. Fundoscopy shows papilledema (swollen disc with blurred margins).", "wrong": ["", "CN III palsy does not give a directly viewable measure of ICP.", "Anosmia would point to cribriform trauma, not raised ICP.", "CN V deficits give numbness/mastication weakness, not ICP information.", "CN IV palsy causes diplopia but gives no information on ICP."], "pearl": "Papilledema on fundoscopy = raised ICP transmitted along the optic nerve sheath.", "set": "cn"}, {"id": "LC-27", "stem": "A 14-year-old girl develops Horner syndrome after surgical removal of a posterior mediastinal mass. Which nerve would be affected by the loss of sympathetic innervation to the head?", "opts": ["Lesser petrosal", "Deep petrosal", "Greater petrosal", "Chorda tympani", "Optic"], "ans": 1, "why": "The deep petrosal nerve is made of postganglionic sympathetic fibers from the internal carotid plexus. It joins the greater petrosal to form the vidian nerve, so a sympathetic chain lesion removes its fibers.", "wrong": ["Carries CN IX preganglionic parasympathetics to the otic ganglion.", "", "Carries CN VII preganglionic parasympathetics for lacrimation.", "Carries CN VII taste and parasympathetic fibers.", "Pure special sensory; carries no autonomic fibers."], "pearl": "Deep petrosal = sympathetic; greater and lesser petrosal = parasympathetic.", "set": "nasal_oral"}, {"id": "LC-28", "stem": "While planning a dinner, a physician finds himself salivating at the thought of the meal. Which description accurately describes the secretomotor pathway to the submandibular gland?", "opts": ["Parasympathetic fibers via the inferior alveolar nerve", "Sympathetic fibers via the lingual nerve", "Parasympathetic fibers via the mandibular branch of the facial nerve", "Sympathetic fibers via the hypoglossal nerve", "Parasympathetic fibers via the chorda tympani nerve"], "ans": 4, "why": "Submandibular and sublingual secretion is driven by CN VII parasympathetics in the chorda tympani. These fibers hitch a ride on the lingual nerve and synapse in the submandibular ganglion.", "wrong": ["IAN is sensory to lower teeth/lip; no salivary secretomotor role.", "Secretomotor drive is parasympathetic; lingual n. carries chorda tympani fibers.", "The marginal mandibular branch is motor to facial muscles only.", "CN XII is motor to the tongue; not secretomotor.", ""], "pearl": "Submandibular/sublingual = CN VII (chorda tympani → submandibular ganglion); parotid = CN IX (lesser petrosal → otic ganglion).", "set": "nasal_oral"}, {"id": "LC-31", "stem": "A 46-year-old woman is cut on the right side of her face by shattered glass, with a laceration at the anterior border of the inferior part of the masseter. When her stitches are removed, her lower lip is asymmetric when she grimaces. Damage to which nerve would cause this asymmetry?", "opts": ["Zygomatic branch of facial nerve", "Temporal branch of facial nerve", "Cervical branch of facial nerve", "Buccal branch of facial nerve", "Marginal mandibular branch of facial nerve"], "ans": 4, "why": "The marginal mandibular branch runs along the lower border of the mandible near the masseter and supplies depressor anguli oris, depressor labii inferioris, and mentalis. Losing it causes lower-lip asymmetry.", "wrong": ["Supplies lower orbicularis oculi (eye closure).", "Supplies frontalis and upper orbicularis oculi.", "Supplies platysma.", "Supplies buccinator and upper-lip muscles.", ""], "pearl": "CN VII branches: Two Zebras Bit My Cheek; marginal mandibular = lower lip depressors.", "set": "face"}, {"id": "LC-32", "stem": "A first-year medical student accidentally walks into the wrong locker room, is shocked and embarrassed, and runs away with his heart pounding. In this agitated state, which ganglion is showing an extremely high rate of activity?", "opts": ["Ciliary ganglion", "Trigeminal ganglion", "Inferior (nodose) vagal ganglion", "Superior cervical ganglion", "Pterygopalatine ganglion"], "ans": 3, "why": "This is a sympathetic fight-or-flight response. The superior cervical ganglion (about C2, top of the sympathetic chain) holds the postganglionic sympathetic cell bodies for the head, so it is the sympathetic ganglion listed.", "wrong": ["Parasympathetic ganglion for the eye.", "Sensory ganglion of CN V.", "Visceral sensory ganglion of CN X.", "", "Parasympathetic ganglion for lacrimal and nasal glands."], "pearl": "SCG (≈C2) = all postganglionic sympathetics to the head.", "set": "neck"}, {"id": "LC-33", "stem": "A physician shines a light into only the left eye. The left pupil does not constrict, but the right pupil does. Which nerve is most likely damaged?", "opts": ["Right optic nerve", "Left optic nerve", "Right ophthalmic nerve", "Right oculomotor nerve", "Left oculomotor nerve"], "ans": 4, "why": "A consensual response in the right eye shows the left optic nerve (afferent limb) works. The absent direct response in the left eye means the left oculomotor nerve (efferent limb) is damaged.", "wrong": ["Not tested, because light was shone only into the left eye.", "Intact: the right pupil responded consensually.", "V1 carries corneal sensation; not part of the light reflex.", "Intact: the right pupil constricted.", ""], "pearl": "Light reflex: afferent CN II, efferent CN III; no direct but intact consensual = ipsilateral CN III.", "set": "orbit"}, {"id": "LC-34", "stem": "MRI shows atherosclerotic stenosis of the right internal carotid artery within the cavernous sinus, with increased pressure leading to an aneurysm there. Given its location, which cranial nerve would most likely be damaged?", "opts": ["Trochlear nerve", "Abducent nerve", "Maxillary nerve", "Ophthalmic nerve", "Oculomotor nerve"], "ans": 1, "why": "CN VI runs free within the cavernous sinus right beside the ICA, while CN III, IV, V1, and V2 lie in the lateral wall. An ICA aneurysm there therefore hits CN VI first.", "wrong": ["Lies in the lateral wall, farther from the ICA.", "", "Lies in the lateral wall, farther from the ICA.", "Lies in the lateral wall, farther from the ICA.", "Lies in the lateral wall, farther from the ICA."], "pearl": "Cavernous sinus: CN VI travels with the ICA in the sinus itself; it is the first nerve affected.", "set": "cranial"}, {"id": "LC-35", "stem": "A 68-year-old man reports hyperacusis, an increased sensitivity to loud, low-frequency sounds such as subwoofer bass. Audiometry shows normal hearing for his age. Which cranial nerve is most likely involved?", "opts": ["Facial nerve", "Vestibulocochlear nerve", "Glossopharyngeal nerve", "Vagus nerve", "Hypoglossal nerve"], "ans": 0, "why": "CN VII supplies the stapedius, which damps stapes movement in response to loud sounds. When stapedius is paralyzed, sounds feel abnormally loud (hyperacusis).", "wrong": ["", "Normal audiometry indicates CN VIII is intact.", "CN IX supplies only stylopharyngeus; no acoustic reflex role.", "CN X has no role in the acoustic reflex.", "CN XII palsy causes tongue deviation, not hyperacusis."], "pearl": "Hyperacusis with facial palsy = lesion proximal to the nerve to stapedius (CN VII).", "set": "cn"}, {"id": "LH-1", "stem": "A 59-year-old man with a herpes zoster infection within the mandibular division of the trigeminal nerve (CN V3) complains of weakness when opening his mouth. Evaluation reveals difficulty protruding the mandible, and when protrusion is accomplished the mandible deviates to the left side. What muscle is most likely weakened?", "opts": ["Anterior belly of digastric", "Lateral pterygoid", "Masseter", "Medial pterygoid", "Temporalis"], "ans": 1, "why": "The lateral pterygoid pulls the condyle forward onto the articular eminence, producing protrusion and helping open the mouth. With the left muscle weak, the intact right lateral pterygoid pushes the jaw toward the weak (left) side on protrusion.", "wrong": ["Suprahyoid muscle that elevates the hyoid; no role in jaw deviation on protrusion", "", "Elevates (closes) the mandible; not the main protruder", "Mainly elevates the mandible; only assists protrusion", "Elevates and retracts the mandible; does not protrude it"], "pearl": "Jaw deviates TOWARD the side of a weak lateral pterygoid (CN V3 lesion).", "set": "face"}, {"id": "LH-4", "stem": "A 15-year-old boy developed cavernous sinus thrombophlebitis after a 1-week history of a single acne-like lesion at the anterior tip of his nose. He presented with headache, periorbital edema, diplopia, and fever (103°F). What vein is the most likely route for spread of this infection to the cavernous sinus?", "opts": ["Ophthalmic", "Superior cerebral", "Great cerebral (of Galen)", "Maxillary", "Supraorbital"], "ans": 0, "why": "The facial vein communicates with the superior (and inferior) ophthalmic veins, which drain directly into the cavernous sinus. These valveless connections let infection from the 'danger triangle' of the face reach the cavernous sinus.", "wrong": ["", "Drain cerebral cortex into the superior sagittal sinus, not from the nose", "Drains deep brain into the straight sinus", "Drains the infratemporal region into the retromandibular vein; reaches the sinus only indirectly via the pterygoid plexus", "Drains forehead into the ophthalmic/facial veins; not the direct route from the nose tip"], "pearl": "Danger triangle: facial v. -> ophthalmic vv. -> cavernous sinus (valveless).", "set": "cranial"}, {"id": "LH-5", "stem": "A 27-year-old man has a painful, swollen floor of the mouth. Imaging shows an 8-mm stone (sialolith) in the right submandibular duct. If the duct is partially obstructed, where would the physician observe salivation in the oral cavity after applying pressure to the right submandibular gland?", "opts": ["Second maxillary molar tooth", "Oral vestibule", "Palatine mucosa", "Sublingual fold", "Lingual frenulum"], "ans": 4, "why": "The submandibular duct opens on the sublingual papilla (caruncle) on each side of the base of the lingual frenulum, so expressed saliva appears there.", "wrong": ["Site of the parotid duct opening, not the submandibular duct", "Receives parotid saliva, not submandibular saliva", "Contains minor palatine glands only", "Where multiple small sublingual gland ducts open, not the submandibular duct", ""], "pearl": "Submandibular (Wharton) duct opens at the sublingual caruncle beside the lingual frenulum.", "set": "nasal_oral"}, {"id": "LH-6", "stem": "A 65-year-old man has a persistent nosebleed. His physician uses a cotton swab to apply pressure at the source, the inferior and posterior aspects of the lateral nasal wall. Which artery is the most likely source of the bleeding?", "opts": ["Greater palatine", "Infraorbital", "Facial", "Anterior ethmoidal", "Sphenopalatine"], "ans": 4, "why": "The sphenopalatine artery, a terminal branch of the maxillary artery, enters the nasal cavity through the sphenopalatine foramen and supplies the posterior lateral wall and septum; it is the usual source of posterior epistaxis.", "wrong": ["Supplies the hard palate; only a small branch reaches the anterior septum via the incisive canal", "Supplies the lower eyelid, cheek and upper lip, not the nasal cavity", "Supplies the external nose and anterior septum via septal branches, not the posterior lateral wall", "Supplies the anterosuperior nasal cavity, not the posteroinferior wall", ""], "pearl": "Posterior epistaxis = sphenopalatine a.; anterior = Kiesselbach plexus.", "set": "nasal_oral"}, {"id": "LH-7", "stem": "A 16-year-old girl develops mild ptosis and miosis in her right eye following resection of a lymphangioma from the apex of her right lung. Vision in each eye is normal. These findings are most likely due to a lesion involving which structure on the right?", "opts": ["Cervical posterior roots", "Thoracic posterior roots", "Thoracic anterior roots", "Thoracic posterior primary rami", "Thoracic gray rami communicantes"], "ans": 2, "why": "Ptosis plus miosis indicates Horner syndrome, loss of sympathetic supply to the head. Preganglionic sympathetic fibers for the head leave the cord in the upper thoracic (T1-T3) anterior roots, reach the sympathetic chain via white rami and ascend to synapse in the superior cervical ganglion.", "wrong": ["Carry only sensory fibers; no sympathetic outflow", "Sensory (afferent) roots; carry no preganglionic sympathetics", "", "Supply deep back muscles and skin, not the head", "Carry postganglionic fibers back to spinal nerves, not up to the head"], "pearl": "Horner = ptosis + miosis + anhidrosis; lung apex (Pancoast) lesions interrupt the T1 sympathetic outflow.", "set": "orbit"}, {"id": "LH-8", "stem": "A 75-year-old man reports progressively more trouble opening his left eye because his upper eyelid tends to droop. Which of the following muscles is most likely weakened?", "opts": ["Orbicularis oculi", "Frontalis", "Levator palpebrae superioris", "Superior rectus", "Orbital muscle"], "ans": 2, "why": "The levator palpebrae superioris (CN III) is the main elevator of the upper eyelid; its weakness or aponeurotic dehiscence in the elderly causes ptosis.", "wrong": ["Closes the eyelids (CN VII); weakness causes inability to close, not ptosis", "Raises the eyebrows and wrinkles the forehead; does not lift the lid itself", "", "Elevates the eyeball, not the eyelid", "Smooth muscle bridging the inferior orbital fissure; not an eyelid elevator"], "pearl": "Ptosis: large = LPS/CN III; mild = superior tarsal (Müller) muscle/sympathetic loss.", "set": "orbit"}, {"id": "LH-10", "stem": "A 68-year-old man choking on a piece of steak cannot clear his airway despite abdominal thrusts. An EMT performs an emergency airway procedure to enable him to breathe. Which subcutaneous structure was most likely cut during this procedure?", "opts": ["Cricoid cartilage", "Thyrohyoid membrane", "Cricothyroid membrane", "Tracheal rings", "Isthmus of thyroid gland"], "ans": 2, "why": "In an emergency the airway is opened through the cricothyroid membrane (cricothyrotomy), which lies just beneath the skin between the thyroid and cricoid cartilages and is below the vocal folds.", "wrong": ["Complete cartilage ring; cutting it risks subglottic stenosis", "Lies above the vocal folds, so an opening here would not bypass a glottic obstruction", "", "Require a formal tracheotomy with deeper dissection; not a quick field procedure", "Overlies tracheal rings 2-4; cutting it causes bleeding and is avoided in emergencies"], "pearl": "Emergency airway = cricothyroid membrane (cricothyrotomy), between thyroid and cricoid cartilages.", "set": "larynx"}, {"id": "LH-11", "stem": "A 7-year-old boy was kicked in the right side of his head. He had no loss of consciousness but complains of severe headache and vomiting. CT reveals a biconvex (lens-shaped) hyperdense extra-axial collection of blood. What blood vessel is the most likely source of the bleed?", "opts": ["Superf
