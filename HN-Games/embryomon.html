<title>Embryomon HNSS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Press+Start+2P&display=swap">
<style>
/* Single deliberate look: a handheld console. Painted explicitly so it holds on light or dark hosts. */
:root{
  color-scheme: dark;
  --shell:#1E2440; --shell2:#262E52; --shell-line:#3A4470; --shell-ink:#E9ECF7; --shell-mute:#A3AACB;
  --screen:#F3F7EE; --ink:#1B2033; --mute:#5B6280; --line:#1B2033;
  --sky:#D6ECDF; --sky2:#BFE0CE; --grass:#8CC06A; --grass2:#6FA553; --pad:#B9D89A; --pad2:#9BC47C;
  --gold:#E3AE12; --gold-ink:#7A5B00;
  --good:#1E8A57; --good-soft:#DCF2E6; --bad:#C2412F; --bad-soft:#F8E1DC; --trap:#96313B; --trap-soft:#F8E8E9;
  --hp-hi:#38B26A; --hp-mid:#E3AE12; --hp-lo:#D9442F; --xp:#3E8FE0;
  --hy-bg:#FFF4C2; --hy-line:#D4A300; --hy-ink:#4A3A00;
  --pixel:"Press Start 2P","Courier New",monospace;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--shell);color:var(--shell-ink)}
body{font:15px/1.55 var(--body);margin:0;padding-inline:16px;padding-block:14px 40px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.px{font-family:var(--pixel);letter-spacing:.02em}
.mast{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--pixel);font-size:11px;color:var(--shell-mute);line-height:1.8}
.brand b{color:var(--gold)}
.brand a{color:var(--shell-mute)}
.hud{display:flex;gap:6px;flex-wrap:wrap}
.hbtn{background:var(--shell2);border:2px solid var(--shell-line);border-radius:6px;padding:7px 10px;font-family:var(--pixel);font-size:9px;color:var(--shell-ink);line-height:1.4}
.hbtn:hover{border-color:var(--gold)}
.hbtn b{color:var(--gold)}
.screen{background:var(--screen);color:var(--ink);border:4px solid #0F1326;border-radius:14px;box-shadow:0 0 0 4px var(--shell-line),0 16px 40px #0008;overflow:hidden}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--pixel);font-size:8.5px;color:var(--shell-mute);line-height:1.8}

/* ---------- generic in-screen UI ---------- */
.pane{padding:18px;display:flex;flex-direction:column;gap:14px}
.h1{font-family:var(--pixel);font-size:clamp(18px,4vw,28px);line-height:1.3;margin:0;text-wrap:balance}
.h2{font-family:var(--pixel);font-size:13px;line-height:1.5;margin:0}
.lede{margin:0;color:var(--mute);max-width:62ch}
.box{border:3px solid var(--line);border-radius:8px;background:#fff;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px #C9CFE0;padding:14px 16px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:11px 16px;font-family:var(--pixel);font-size:10px;line-height:1.4;box-shadow:0 3px 0 #000}
.btn:hover{background:#2E3659}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn.gold{background:var(--gold);color:#241A00}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink),0 3px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tchip{display:inline-block;font-family:var(--pixel);font-size:8px;line-height:1;padding:4px 6px;border-radius:3px;color:#fff;vertical-align:middle}
.small{font-size:13px;color:var(--mute)}
.hy{background:var(--hy-bg);border:2px solid var(--hy-line);border-radius:6px;padding:10px 12px;color:var(--hy-ink);font-size:14px}
.hy b{display:block;font-family:var(--pixel);font-size:8.5px;letter-spacing:.04em;margin-bottom:6px}
.trapbox{background:var(--trap-soft);border:2px solid var(--trap);border-radius:6px;padding:10px 12px;font-size:14px;color:#4A1419}
.trapbox b.lab{display:block;font-family:var(--pixel);font-size:8.5px;color:var(--trap);margin-bottom:6px}

/* ---------- title ---------- */
.title{background:linear-gradient(180deg,var(--sky) 0 58%,var(--grass) 58% 100%);position:relative}
.title .pane{gap:16px}
.logo{font-family:var(--pixel);font-size:clamp(26px,7vw,52px);line-height:1.05;color:var(--ink);text-shadow:3px 3px 0 var(--gold);margin:0}
.logo small{display:block;font-size:.3em;margin-top:10px;text-shadow:none;color:var(--mute)}
.starters{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.starter{background:#fff;border:3px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left}
.starter:hover,.starter[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}
.starter .spr{width:96px;height:108px;align-self:center}
.starter h3{font-family:var(--pixel);font-size:11px;margin:0}
.starter p{margin:0;font-size:13px;color:var(--mute)}
.namefield{display:flex;flex-direction:column;gap:6px;max-width:320px}
.namefield label{font-family:var(--pixel);font-size:9px}
.namefield input{font:inherit;border:3px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff;color:var(--ink)}

/* ---------- map ---------- */
.map{position:relative;aspect-ratio:100/62;max-width:100%;background:
  radial-gradient(circle at 20% 30%,#9ACB76 0 6%,transparent 6.5%),
  radial-gradient(circle at 70% 80%,#9ACB76 0 5%,transparent 5.5%),
  repeating-linear-gradient(0deg,transparent 0 11px,#0000000a 11px 12px),
  repeating-linear-gradient(90deg,transparent 0 11px,#0000000a 11px 12px),var(--grass);
  border-bottom:4px solid var(--line)}
.map svg.paths{position:absolute;inset:0;width:100%;height:100%}
.pond{position:absolute;left:66%;top:6%;width:14%;height:20%;background:#6FB6DC;border:3px solid #3E7FA6;border-radius:48% 52% 45% 55%}
.tree{position:absolute;width:3.2%;aspect-ratio:1;background:#3F7F3A;border:2px solid #1F4A22;border-radius:50% 50% 45% 45%}
.loc{position:absolute;transform:translate(-50%,-60%);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0}
.loc .ico{width:clamp(38px,8vw,64px);aspect-ratio:1}
.loc .lbl{font-family:var(--pixel);font-size:clamp(6.5px,1.4vw,9px);background:#fff;border:2px solid var(--line);border-radius:4px;padding:3px 5px;white-space:nowrap;line-height:1.3}
.loc .lbl em{display:block;font-style:normal;color:var(--mute);font-size:.85em}
.loc[disabled]{cursor:not-allowed;filter:grayscale(.9);opacity:.75}
.loc:hover .lbl{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.avatar{position:absolute;width:clamp(20px,4vw,34px);transform:translate(-50%,-100%);transition:left .55s steps(6),top .55s steps(6);pointer-events:none;z-index:3}
@media (max-width:600px){.map{aspect-ratio:100/100}}
.mapfoot{padding:14px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{border:2px solid var(--line);border-radius:6px;padding:8px 10px;background:#fff}
.stat .k{font-family:var(--pixel);font-size:8px;color:var(--mute)}
.stat .v{font-family:var(--mono);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.badges{display:flex;gap:6px;margin-top:4px}
.badge{width:22px;height:22px}

/* ---------- route ---------- */
.patches{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.patch{text-align:left;background:
  repeating-linear-gradient(135deg,var(--grass) 0 6px,var(--grass2) 6px 8px);border:3px solid var(--line);border-radius:10px;padding:0;overflow:hidden;display:flex;flex-direction:column}
.patch .in{background:#fff;margin-top:26px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--line);flex:1}
.patch h3{margin:0;font-size:15px;font-weight:600}
.patch:hover{box-shadow:0 0 0 3px var(--gold)}
.meter{height:8px;border:2px solid var(--line);border-radius:4px;background:#E8ECF4;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.gymcard{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border:3px solid var(--line);border-radius:10px;padding:14px;background:#fff}
.gymcard .trn{width:64px;height:88px}
@media (max-width:520px){.gymcard{grid-template-columns:1fr}.gymcard .trn{justify-self:center}}

/* ---------- battle ---------- */
.scene{position:relative;aspect-ratio:16/9;max-width:100%;background:linear-gradient(180deg,var(--sky) 0 52%,var(--sky2) 52% 60%,var(--grass) 60% 100%);overflow:hidden;border-bottom:4px solid var(--line)}
.scene.gym{background:linear-gradient(180deg,#E6E1F4 0 52%,#CFC6EA 52% 60%,#B7A9DE 60% 100%)}
.scene.cave{background:linear-gradient(180deg,#D9D2C6 0 52%,#C3B8A6 52% 60%,#A8987F 60% 100%)}
.plat{position:absolute;border-radius:50%;background:var(--pad);border:3px solid var(--pad2)}
.plat.e{right:6%;top:40%;width:34%;height:13%}
.plat.p{left:4%;bottom:4%;width:40%;height:15%}
.scene.gym .plat,.scene.cave .plat{background:#fff8;border-color:#0002}
.mon{position:absolute;image-rendering:pixelated}
.mon.e{right:12%;top:8%;width:22%;aspect-ratio:16/18}
.mon.p{left:9%;bottom:8%;width:28%;aspect-ratio:16/18}
.mon.e.enter{animation:slideE .7s steps(8) both}
.mon.p.enter{animation:slideP .6s steps(8) both}
@keyframes slideE{from{transform:translateX(160%)}to{transform:none}}
@keyframes slideP{from{transform:translateX(-160%)}to{transform:none}}
.mon.hit{animation:blink .5s steps(2) 2}
@keyframes blink{50%{opacity:.1}}
.mon.e.leave{animation:slideOut .5s steps(6) forwards}
.mon.faint{animation:faint .6s ease-in forwards}
@keyframes faint{to{transform:translateY(60%);opacity:0}}
.mon.lunge.p{animation:lungeP .35s ease-out}
.mon.lunge.e{animation:lungeE .35s ease-out}
@keyframes lungeP{50%{transform:translate(18%,-10%)}}
@keyframes lungeE{50%{transform:translate(-18%,10%)}}
.scene.shake{animation:shake .35s steps(4)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.orb{position:absolute;width:7%;aspect-ratio:1;left:30%;bottom:30%;z-index:4;animation:throw .7s ease-out forwards}
@keyframes throw{to{left:73%;bottom:62%}}
.orb.wobble{left:73%;bottom:62%;animation:wob .5s ease-in-out 3}
@keyframes wob{25%{transform:rotate(-20deg)}75%{transform:rotate(20deg)}}
.stbox{position:absolute;background:#fff;border:3px solid var(--line);border-radius:8px 8px 8px 0;padding:6px 9px;min-width:0;width:44%;box-shadow:4px 4px 0 #0002}
.stbox.e{left:3%;top:5%}
.stbox.p{right:3%;bottom:6%;border-radius:8px 0 8px 8px}
.stbox .nm{font-family:var(--pixel);font-size:clamp(7px,1.5vw,10px);line-height:1.35;display:flex;justify-content:space-between;gap:8px}
.stbox .nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stbox .nm span:last-child{flex:none}
.hpline{display:flex;align-items:center;gap:6px;margin-top:5px}
.hpline .lab{font-family:var(--pixel);font-size:7px;color:var(--gold-ink);background:#FFF1C4;padding:2px 3px;border-radius:2px}
.hpbar{flex:1;height:8px;border:2px solid var(--line);border-radius:4px;background:#E8ECF4;overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--hp-hi);transition:width .6s steps(12),background .3s}
.hpnum{font-family:var(--mono);font-size:clamp(10px,1.8vw,13px);text-align:right;font-variant-numeric:tabular-nums;margin-top:2px}
.xpbar{height:4px;background:#E8ECF4;margin-top:4px;border-radius:2px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--xp);transition:width .6s}
.tbadge{position:absolute;right:3%;top:5%;display:flex;gap:4px}
.tbadge i{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:#fff}
.tbadge i.dead{background:#9aa0b4}
.tbadge i.alive{background:var(--gold)}
.leader{position:absolute;right:4%;top:6%;width:13%;aspect-ratio:10/14}
.leader.leave{animation:slideOut .5s steps(6) forwards}
@keyframes slideOut{to{transform:translateX(200%)}}

.msg{margin:12px;border:4px double var(--line);border-radius:8px;background:#fff;padding:12px 40px 12px 14px;min-height:62px;font-family:var(--pixel);font-size:clamp(9px,1.8vw,12px);line-height:1.8;position:relative;cursor:pointer}
.msg .more{position:absolute;right:14px;bottom:10px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--ink);animation:bob .8s steps(2) infinite;opacity:0}
.msg.done .more{opacity:1}
@keyframes bob{50%{transform:translateY(3px)}}

.qpanel{padding:0 12px 14px;display:flex;flex-direction:column;gap:10px}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qhead .mv{font-family:var(--pixel);font-size:10px}
.qhead .hint{font-size:12.5px;color:var(--mute)}
.stem{margin:0;font-size:16px;max-width:70ch}
.chart{border:2px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.chart .ch{display:flex;justify-content:space-between;gap:10px;background:var(--ink);color:#fff;padding:5px 10px;font-family:var(--pixel);font-size:8px;line-height:1.6}
.chart .cr{display:grid;grid-template-columns:100px 1fr;border-top:1px solid #D7DCEA}
.chart .cr:first-of-type{border-top:0}
.chart .sys{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);padding:7px 10px;background:#F4F6FB}
.chart .fx{padding:7px 10px;font-size:14.5px}
.chart .cr.hid .fx{color:#A8AEC4;font-style:italic}
.chart .cr.new{animation:flash 1s}
@keyframes flash{from{background:#FFF1C4}}
.chart .cr.hist .sys{background:#FFF7DA}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:600px){.moves{grid-template-columns:1fr}}
.move{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;text-align:left;background:#fff;border:3px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14.5px;line-height:1.4;box-shadow:0 3px 0 var(--line)}
.move:hover{background:#FFF8DE}
.move:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.move .k{font-family:var(--pixel);font-size:9px;background:var(--ink);color:#fff;border-radius:4px;height:22px;display:grid;place-items:center}
.move.gone{opacity:.3;text-decoration:line-through;pointer-events:none}
.cmds{display:flex;gap:8px;flex-wrap:wrap}
.cmd{background:#fff;border:3px solid var(--line);border-radius:6px;padding:8px 12px;font-family:var(--pixel);font-size:9px;line-height:1.3}
.cmd:hover{background:#FFF8DE}
.cmd[disabled]{opacity:.4;pointer-events:none}
.cmd.examine{background:#EAF3FF}
.sub{border:2px dashed var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#fff}
.sub .opt{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.fb{display:flex;flex-direction:column;gap:10px}
.verdict{font-family:var(--pixel);font-size:11px;padding:9px 12px;border-radius:6px;border:3px solid}
.verdict.ok{background:var(--good-soft);border-color:var(--good);color:#0E4A2D}
.verdict.no{background:var(--bad-soft);border-color:var(--bad);color:#6B1B10}
.verdict.tr{background:var(--trap-soft);border-color:var(--trap);color:var(--trap)}
.ans{font-size:15px}
.ans b{font-weight:600}
.whys{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.whys small{display:block;color:var(--mute)}
.recall{font-size:15px}

/* ---------- lists / dex / party ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.sheet{background:#fff;color:var(--ink);border:3px solid var(--line);border-radius:8px;padding:14px;overflow-x:auto}
.sheet h2{font-family:var(--pixel);font-size:11px;line-height:1.5;margin:18px 0 8px}
.sheet table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
.sheet th,.sheet td{border-bottom:1px solid #D5D9E5;padding:7px 8px;text-align:left;vertical-align:top}
.sheet th{background:var(--ink);color:#fff;font-weight:600;position:sticky;top:0}
.sheet td,.sheet td b,.sheet p,.sheet h2{color:var(--ink)}
.sheet td small{display:block;color:var(--mute)}
.sheet .area{font-family:var(--mono);font-size:11.5px;color:var(--mute);white-space:nowrap}
.sheet .hy{margin:10px 0}
.atlas-sec{font-family:var(--pixel);font-size:10px;line-height:1.5;margin:20px 0 8px;padding-bottom:6px;border-bottom:3px solid var(--line);color:var(--ink)}
.srch{width:100%;padding:9px 11px;border:3px solid var(--line);border-radius:6px;font:15px var(--body);background:#fff;color:var(--ink);color-scheme:light}
.pdfcard{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
details.tog{margin:6px 0}
.atree{display:flex;flex-direction:column;gap:8px;margin-left:14px;padding-left:10px;border-left:3px solid #C9D0E0}
.atree.top{margin-left:0;padding-left:0;border-left:0}
details.grp>summary{font-family:var(--pixel);font-size:9px;line-height:1.6;color:var(--ink)}
details.nerve>summary{font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:6px;padding:6px 10px}
details.tog>summary{cursor:pointer;list-style:none;padding:6px 0}
details.tog>summary::before{content:'▸ ';color:var(--gold-ink);font-size:14px}
details.tog[open]>summary::before{content:'▾ '}
details.tog>summary::-webkit-details-marker{display:none}
.tab{background:#fff;border:3px solid var(--line);border-radius:6px;padding:7px 10px;font-family:var(--pixel);font-size:8.5px;line-height:1.3}
.tab[aria-pressed="true"]{background:var(--ink);color:#fff}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.dexe{background:#fff;border:2px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12px;line-height:1.25}
.dexe .spr{width:64px;height:72px}
.dexe .no{font-family:var(--mono);font-size:10px;color:var(--mute)}
.dexe.unseen{background:#EEF0F6;color:#8C93AE}
.dexe.caught{box-shadow:inset 0 0 0 2px var(--gold)}
.card{background:#fff;border:3px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:18px}
.lin{font-size:13px;color:var(--mute)}
.fx-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.fx-list li{display:grid;grid-template-columns:96px 1fr;gap:8px;font-size:14px;border-top:1px solid #E1E5EF;padding-top:6px}
.fx-list li span:first-child{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;color:var(--mute);letter-spacing:.04em}
.fx-list small{display:block;color:var(--mute)}
.party{display:flex;flex-direction:column;gap:8px}
.pm{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:10px;padding:8px 10px}
.pm .spr{width:56px;height:63px}
.pm.lead{box-shadow:0 0 0 3px var(--gold)}
.pm .nm{font-weight:600}
@media (max-width:480px){.pm{grid-template-columns:52px 1fr}.pm .act{grid-column:1/-1}}
.dexpatch{display:flex;flex-direction:column;gap:6px}
.dexhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:3px solid var(--line);padding-bottom:6px}
.dexlist{display:flex;flex-direction:column;gap:4px}
.dexsub{font-family:var(--pixel);font-size:8.5px;color:var(--mute);margin:6px 0 2px;letter-spacing:.03em}
.dexrow{margin-left:calc(var(--d,0)*22px);display:grid;grid-template-columns:auto 38px 44px 1fr auto;align-items:center;gap:8px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:6px;padding:4px 8px;font-size:14px;line-height:1.25;max-width:calc(100% - 0px)}
.dexrow .spr{width:32px;height:36px}
.dexrow .no{font-family:var(--mono);font-size:10px;color:var(--mute)}
.dexrow .dn small{display:block;color:var(--mute);font-size:11.5px}
.dexrow .twig{font-family:var(--mono);color:var(--mute)}

const BOSS={"03": {"key": "03", "title": "Pharyngeal Gauntlet", "lecture": "HNSS03 · Introduction / Pharyngeal Arches", "final": {"name": "The Branchial Leviathan", "epithet": "Coiled around all six arches", "n": 12}, "bosses": [{"lo": "03.1", "name": "The Week-Keeper", "epithet": "Warden of Weeks 3 to 10", "los": "Locate within a week the formation of the pharyngeal arches", "q": [["S1", "An embryo has three germ layers, a pericardial bulge, open cranial and caudal neuropores, and exactly two pharyngeal arches. No third arch is visible. What is the most likely embryonic age?", ["Week 2", "Weeks 3–3.5", "Week 5", "Weeks 5.5–6", "Week 8"], 1, "Arches 1 and 2 are present by weeks 3–3.5, together with the germ layers, pericardial bulge and neuropores. Arches 3, 4 and 6 appear at week 5."], ["2", "The cartilage that later gives rise to the malleus first populates the mandibular process. Which process is underway at about the same time?", ["Arches 1 and 2 are first appearing", "Neural crest cells are migrating into the arches", "The thymus is reaching the midline", "The tonsillar crypt is hollowing out", "The superior parathyroid is reaching the dorsal thyroid"], 1, "Meckel's cartilage populates the mandibular process by week 4.5; neural crest migration ensues at weeks 4.5–5. Thymus/parathyroid migration finishes at week 10; the tonsillar crypt forms at month 4."], ["2", "The arch whose nerve carries the afferent limb of the gag reflex first becomes visible at approximately which week?", ["Week 3", "Week 4", "Week 5", "Week 8", "Week 10"], 2, "Gag afferent = CN IX = arch 3. Arches 3, 4 and 6 become visible at week 5."], ["2", "A newborn has hypocalcemic seizures and no thymic shadow. The pouch whose derivatives are missing normally completes the caudal migration of its glands by which week?", ["Week 5", "Week 6", "Week 8", "Week 10", "Week 16"], 3, "Pouch 3 glands (thymus, inferior parathyroid) lose their pharyngeal connection and finish migrating by week 10."], ["2", "By which week does each pharyngeal arch first have its own nerve and its own arterial supply?", ["Weeks 3–3.5", "Week 4", "Weeks 4.5–5", "Weeks 5.5–6", "Week 8"], 3, "By weeks 5.5–6 all four cell types have formed arches, pouches and clefts; each arch becomes separately innervated and acquires its own artery."]]}, {"lo": "03.2", "name": "The Triblast Golem", "epithet": "Built of three germ layers", "los": "Cellular and anatomical components of the arches", "q": [["2", "Cells migrate into the arches from the hindbrain and midbrain at weeks 4.5–5. Which germ layer do they come from, and what do they build?", ["Mesoderm — muscles of the face", "Ectoderm — the skeleton of the face", "Endoderm — the pouch glands", "Ectoderm — the muscles of mastication", "Mesoderm — the laryngeal cartilages"], 1, "These are neural crest cells (derived from ectoderm), predetermined to form the skeletal component of the face."], ["S1", "A researcher labels the epithelium lining the indentations on the pharyngeal (inner) surface between the arches. Labeled cells will later be found in which structure?", ["External auditory meatus", "Thymic epithelium", "Masseter muscle", "Malleus", "Stapedius muscle"], 1, "Inner indentations are pouches, lined by endoderm → glands and linings such as the thymus (pouch 3). The meatus is cleft (ectoderm); muscles are mesoderm; ossicles are neural crest."], ["2", "The muscle that tenses the tympanic membrane arises from which component of its arch?", ["Neural crest", "Surface ectoderm", "Pharyngeal endoderm", "Core mesoderm (paraxial + lateral plate)", "Notochord"], 3, "Tensor tympani is an arch 1 muscle. Arch muscles come from the core mesenchyme of paraxial and lateral plate mesoderm; each arch has its own population."], ["2", "Which statement about the pharyngeal apparatus is correct?", ["Pouches are lined by ectoderm", "Clefts are lined by ectoderm and pouches by endoderm", "Arches contain no mesoderm", "Clefts give rise to most of the neck glands", "Adjacent arches share one cranial nerve"], 1, "CAP from outside in: Cleft (ectoderm) → Arch (mesoderm + neural crest) → Pouch (endoderm)."], ["2", "The cartilages of the larynx differ from the skeletal derivatives of arches 1–3 in what way?", ["They form by membrane ossification", "They come from lateral plate mesoderm, not neural crest", "They come from pouch endoderm", "They are innervated by CN IX", "They form after birth"], 1, "High yield: arch 4/6 cartilages derive from lateral plate mesoderm; neural crest is not involved."]]}, {"lo": "03.3", "name": "Meckel the Jawbreaker", "epithet": "Lord of cartilage, muscle and nerve", "los": "Muscular, skeletal and neural derivatives of each arch", "q": [["S1", "A 45-year-old man has weakness of chewing on the right, and his jaw deviates to the right on opening. Which other muscle is most likely affected by the same lesion?", ["Stapedius", "Tensor tympani", "Stylopharyngeus", "Posterior belly of digastric", "Levator veli palatini"], 1, "Right V3 lesion → pterygoids weak → jaw deviates toward the lesion. Tensor tympani is also arch 1 (V3). The other options are arches 2, 3, 2 and 4."], ["2", "One ossicle does not come from the same cartilage as the malleus. The muscle attached to that ossicle is supplied by which nerve?", ["CN V3", "CN VII", "CN IX", "CN X", "CN XII"], 1, "Malleus/incus come from Meckel's (arch 1). The stapes comes from Reichert's (arch 2); its muscle, stapedius, is CN VII."], ["S1", "After a thyroidectomy, a patient is hoarse and cannot abduct the left vocal fold. The injured nerve belongs to which arch, and which laryngeal muscle is spared?", ["Arch 4 — cricothyroid spared", "Arch 6 — cricothyroid spared", "Arch 6 — posterior cricoarytenoid spared", "Arch 3 — stylopharyngeus spared", "Arch 4 — thyroarytenoid spared"], 1, "Recurrent laryngeal = arch 6 and supplies all intrinsic laryngeal muscles except cricothyroid (arch 4, superior laryngeal)."], ["2", "A mutation disrupts Reichert's cartilage. Which structure would most likely be abnormal?", ["Greater horn of the hyoid", "Lesser horn of the hyoid", "Malleus", "Incus", "Thyroid cartilage"], 1, "Reichert's (arch 2) → stapes, styloid, stylohyoid ligament, lesser horn and upper body of hyoid."], ["2", "Which bone forms from arch 1 neural crest by membrane (intramembranous) ossification?", ["Malleus", "Incus", "Zygomatic", "Stapes", "Greater horn of hyoid"], 2, "Maxillary-process neural crest ossifies directly: premaxilla, maxilla, zygomatic, parts of temporal. Malleus and incus are endochondral from Meckel's."], ["S1", "A patient loses taste and sensation over the posterior third of the tongue and has an absent gag reflex on that side. The only muscle derived from the same arch as this nerve is:", ["Stylohyoid", "Stylopharyngeus", "Styloglossus", "Palatoglossus", "Cricothyroid"], 1, "CN IX = arch 3, whose only muscle is stylopharyngeus."]]}, {"lo": "03.4", "name": "The Pouchmother", "epithet": "Breeder of glands", "los": "Derivatives of each pharyngeal pouch", "q": [["S1", "A 3-year-old has recurrent otitis media. The epithelial lining of the canal connecting the middle ear to the nasopharynx develops from which structure?", ["First cleft ectoderm", "First pouch endoderm", "Second pouch endoderm", "First arch mesoderm", "Otic placode"], 1, "Pouch 1 → tubotympanic recess: distal = tympanic cavity, proximal = eustachian tube."], ["S1", "During a parathyroidectomy, the surgeon finds one parathyroid gland low in the neck, embedded in thymic tissue near the thoracic inlet. This gland most likely arose from which structure?", ["Pouch 2", "Dorsal wing of pouch 3", "Ventral wing of pouch 3", "Dorsal wing of pouch 4", "Ultimobranchial body"], 1, "The inferior parathyroid comes from the dorsal wing of pouch 3 and is dragged down by the thymus (ventral wing of pouch 3), so ectopic inferior glands often sit with thymic tissue."], ["2", "Cells derived from the ventral wing of pouch 4 (ultimobranchial body) secrete a hormone. What is its main action on bone?", ["Stimulates osteoblasts to make osteoid", "Inhibits osteoclast resorption", "Increases renal phosphate wasting", "Stimulates chief cells", "Stimulates follicular cells"], 1, "Ultimobranchial body → thyroid C cells → calcitonin, which prevents bone resorption."], ["S1", "A 40-year-old has a thyroid nodule and markedly elevated serum calcitonin. The tumor's cells arose embryologically from which structure?", ["Foramen cecum endoderm", "Ultimobranchial body", "Dorsal wing of pouch 3", "Pouch 2", "Thyroglossal duct"], 1, "Medullary thyroid carcinoma comes from parafollicular C cells, which enter the thyroid via the ultimobranchial body (pouch 5 / ventral pouch 4)."], ["2", "The palatine tonsil epithelium comes from the pouch lying between which two arches?", ["Arches 1 and 2", "Arches 2 and 3", "Arches 3 and 4", "Arches 4 and 6", "It is not a pouch derivative"], 1, "Pouch 2 sits between arches 2 and 3. Its buds become the palatine tonsil; the crypt forms at month 4."], ["2", "The inferior parathyroid comes from a more cranial pouch than the superior parathyroid. Why does it end up lower?", ["It forms after the superior gland", "The thymus drags it caudally", "The thyroid pushes it down", "It is attached to the aortic arch", "It never migrates"], 1, "Pouch 3 dorsal wing (inferior parathyroid) travels with the thymus (pouch 3 ventral wing) past the pouch 4 gland."]]}, {"lo": "03.5", "name": "The Cervical Sinus", "epithet": "The hollow that should have closed", "los": "Derivatives of each pharyngeal cleft", "q": [["S1", "An 8-year-old has a painless, fluctuant mass along the anterior border of the upper third of the sternocleidomastoid. It enlarged after a cold and does not move with swallowing. Failure of which process?", ["Obliteration of the thyroglossal duct", "Obliteration of the cervical sinus (cleft 2 overgrowth)", "Migration of pouch 3", "Formation of lymphatic sacs", "Closure of the foramen cecum"], 1, "Branchial cleft cyst: lateral, anterior to SCM, doesn't move with swallowing. Cleft 2 normally grows over clefts 3–5 and the enclosed cervical sinus disappears."], ["2", "Which pharyngeal cleft derivative is lined by the same germ layer as the lens of the eye?", ["Tympanic cavity", "External auditory meatus", "Eustachian tube", "Palatine tonsil", "Thymus"], 1, "Cleft 1 → external auditory meatus (ectoderm). The lens is surface ectoderm. The other options are endoderm (pouches)."], ["2", "A membrane formed by cleft 1 and pouch 1 transmits vibration to an ossicle attached at its center. That ossicle comes from which cartilage?", ["Reichert's cartilage", "Meckel's cartilage", "Thyroid cartilage", "Otic capsule", "Cricoid cartilage"], 1, "The tympanic membrane attaches to the handle of the malleus, a Meckel's (arch 1) derivative."], ["2", "Cleft 2 grows caudally over clefts 3–5 and fuses with which structure?", ["Hypobranchial eminence", "Epicardial ridge", "Foramen cecum", "Tuberculum impar", "Laryngotracheal groove"], 1, "Fusion with the epicardial ridge encloses the cervical sinus. This overgrowth figure was called a lecture favorite."], ["S1", "A newborn has a pinpoint opening on the lower neck anterior to the SCM that drains mucoid fluid. A probe tracks upward toward the tonsillar fossa. What is this?", ["Thyroglossal fistula", "Branchial fistula from a persistent cervical sinus", "Cystic hygroma", "Dermoid cyst", "Lingual thyroid"], 1, "A branchial fistula is an abnormal connection between the neck skin and the inside of the neck (here the pouch 2 region), from failure of cleft 2 to cover clefts 3–5."]]}, {"lo": "03.6", "name": "The Hoxlord", "epithet": "Writer of the Hox code", "los": "Hox proteins in arch development", "q": [["2", "Neural crest from rhombomere 4 fails to migrate. Which structure is most likely malformed?", ["Malleus", "Stapes", "Greater horn of hyoid", "Thyroid cartilage", "Zygomatic bone"], 1, "R4 → arch 2 → Reichert's cartilage → stapes (plus styloid, lesser horn)."], ["2", "The arch that forms the incus is patterned mainly by which transcription factor, expressed in neural crest from which region?", ["Hoxa-2 — hindbrain", "OTX2 — forebrain and midbrain", "PAX3 — spinal cord", "Hoxa-3 — rhombomere 6", "TTF-1 — pharyngeal floor"], 1, "Incus = arch 1. OTX2 is the key regulator of arch 1 and is expressed in forebrain- and midbrain-derived neural crest."], ["S1", "Hoxa-3 knockout mice lack a thymus and parathyroid glands. A human infant with the analogous defect would most likely show:", ["Hypercalcemia and B-cell deficiency", "Hypocalcemic tetany and T-cell deficiency", "Microtia with normal immunity", "Cleft lip and normal calcium", "Deafness and a white forelock"], 1, "Hoxa-3 knockout mimics DiGeorge (pouches 3/4): no parathyroids → hypocalcemia; no thymus → T-cell deficiency."], ["2", "How does excess retinoic acid change arch identity?", ["It degrades Hox mRNA", "It binds RAREs in Hox promoters and increases Hox transcription", "It blocks neural crest migration only", "It deletes the Hox cluster", "It inhibits SHH receptors"], 1, "Retinoids bind retinoic acid response elements in Hox promoters; excess hyperactivates them → too much Hox protein."], ["2", "How do the arches acquire distinct identities?", ["Each arch makes its own Hox genes independently of neural crest", "Neural crest carries Hox proteins expressed in a rostrocaudal sequence, setting up a pharyngeal Hox code", "Pouch endoderm secretes identical Hox proteins into every arch", "Hox genes are expressed only in arch 1", "Arteries deliver Hox proteins"], 1, "NC cells carry Hox proteins to each arch; rostrocaudal expression sets up the Hox code."], ["2", "SHH knockout mice are headless. Which statement best explains how SHH relates to arch patterning?", ["SHH is a Hox protein", "SHH regulates Hox genes", "SHH is only needed for limb buds", "SHH inhibits neural crest formation", "SHH binds RAREs"], 1, "SHH has been shown to regulate Hox genes — a master regulator upstream of the Hox code."]]}, {"lo": "03.7", "name": "The Oxidizer", "epithet": "Twin blades of alcohol and retinoid", "los": "Alcohol vs retinoic acid: mechanisms", "q": [["2", "Why are neural crest cells especially vulnerable to alcohol and retinoic acid?", ["They lack DNA mismatch repair", "They are deficient in superoxide dismutase and catalase", "They have no blood supply", "They divide too slowly to repair damage", "They express no Hox genes"], 1, "Low SOD/catalase means they can't scavenge free radicals."], ["S1", "A newborn has a smooth philtrum, thin upper lip, short palpebral fissures and microcephaly. By the mechanism taught in lecture, the causal agent damaged neural crest by:", ["Hyperactivating Hox genes", "Generating reactive oxygen species", "Antagonizing folate", "Deleting 22q11.2", "Mutating Tcof-1"], 1, "Fetal alcohol syndrome. Alcohol acts through ROS only."], ["S1", "A 19-year-old taking isotretinoin for acne becomes pregnant. Her infant has microtia, cleft palate and a conotruncal heart defect. Which mechanism(s) explain the craniofacial defects?", ["ROS only", "Hox hyperactivation only", "ROS and Hox hyperactivation", "Folate antagonism", "Androgen excess"], 2, "Retinoic acid does both: ROS damage to neural crest and hyperactivation of Hox genes via RAREs."], ["2", "Which feature distinguishes retinoic acid teratogenicity from alcohol teratogenicity?", ["Only retinoic acid produces reactive oxygen species", "Only retinoic acid hyperactivates Hox genes", "Only alcohol affects neural crest", "Only alcohol causes facial defects", "Neither affects neural crest"], 1, "Both make ROS; only RA also hyperactivates Hox (high yield)."], ["2", "A hypothetical antioxidant fully blocks free-radical damage in neural crest. What would it prevent?", ["Neither teratogen's effects", "All of alcohol's mechanism but only part of retinoic acid's", "All of retinoic acid's mechanism but none of alcohol's", "Both teratogens completely", "Only Hox hyperactivation"], 1, "Alcohol = ROS only (fully blocked). RA = ROS + Hox (Hox arm remains)."]]}, {"lo": "03.8", "name": "CATCH-22", "epithet": "The syndrome of missing pouches", "los": "Birth defects of arch formation", "q": [["S1", "A 3-day-old has tetany, truncus arteriosus and no thymic shadow on chest X-ray. Which structures failed to develop?", ["Pharyngeal clefts 2–4", "Pharyngeal pouches 3 and 4", "First arch neural crest", "Second arch mesoderm", "The thyroglossal duct"], 1, "DiGeorge (22q11.2): pouches 3 and 4 fail → no parathyroids or thymus; conotruncal defects from neural crest."], ["S1", "For the infant above, which laboratory pattern is expected?", ["↑ Calcium, ↑ PTH", "↓ Calcium, ↓ PTH", "↓ Calcium, ↑ PTH", "↑ Calcium, ↓ PTH", "Normal calcium, ↓ T cells only"], 1, "No parathyroid tissue → low PTH → hypocalcemia."], ["S1", "A child has zygomatic hypoplasia, a small mandible, notched lower eyelids, malformed external ears and conductive hearing loss. Intelligence is normal. The underlying problem is:", ["Failure of pouches 3 and 4", "Defective neural crest migration into arches 1 and 2", "Persistent cervical sinus", "Maternal folate deficiency", "PAX6 mutation"], 1, "Treacher Collins (Tcof-1): neural crest into arches 1–2. Conductive loss comes from malformed ossicles."], ["S1", "A child has a white forelock, hypertelorism and congenital deafness. Which gene is most likely mutated?", ["PAX6", "PAX3", "TCOF1", "TBX1", "SHH"], 1, "Waardenburg syndrome: PAX3, a neural crest defect (cleft palate, deafness, hypertelorism, white forelock)."], ["2", "A branchial fistula results from failure of which arch to grow caudally over the more caudal clefts?", ["Arch 1", "Arch 2", "Arch 3", "Arch 4", "Arch 6"], 1, "The second arch (cleft 2) normally overgrows clefts 3–5; failure leaves a sinus/fistula."]]}]}, "04": {"key": "04", "title": "The Fusion Wars", "lecture": "HNSS04 · Craniofacial Development", "final": {"name": "The Stomodeum", "epithet": "The mouth that all prominences surround", "n": 12}, "bosses": [{"lo": "04.1", "name": "Tuberculum Impar", "epithet": "The swelling that gets overgrown", "los": "Anatomical structures of the tongue", "q": [["2", "The swellings that form the anterior two-thirds of the tongue arise from the same arch as which muscle?", ["Stylopharyngeus", "Masseter", "Stapedius", "Cricothyroid", "Genioglossus"], 1, "Lateral lingual swellings + tuberculum impar come from arch 1, the arch of the muscles of mastication."], ["S1", "After a stroke, a patient's tongue deviates to the left on protrusion. The weakened muscles developed from which source?", ["First arch mesoderm", "Occipital somites", "Second arch neural crest", "Pharyngeal endoderm", "Lateral plate mesoderm of arch 4"], 1, "High yield: tongue muscles come from occipital somite (paraxial mesoderm) myoblasts — hence hypoglossal innervation."], ["2", "The lecture describes the tongue as which arrangement of tissues?", ["Endoderm surrounded by ectoderm", "Mesoderm surrounded by endoderm", "Neural crest surrounded by mesoderm", "Ectoderm surrounded by mesoderm", "Endoderm only"], 1, "High yield: somite mesoderm core, endodermal covering."], ["2", "The copula forms from mesoderm under arches 2–4. Which part of the tongue does this hypobranchial tissue build?", ["Anterior two-thirds", "Posterior one-third (root)", "Tip only", "Intrinsic muscles", "Lingual frenulum"], 1, "Anterior 2/3 = lateral swellings overgrowing the tuberculum impar; posterior 1/3 = copula/hypobranchial eminence."], ["2", "Which landmark lies between the tuberculum impar and the hypobranchial eminence?", ["Terminal sulcus only", "Foramen cecum", "Vallecula", "Incisive foramen", "Median glossoepiglottic fold"], 1, "The foramen cecum — the starting point of the thyroid."]]}, {"lo": "04.2", "name": "Noggin the Bud-Breaker", "epithet": "Silencer of BMP", "los": "Tongue development vs lung development", "q": [["2", "In both tongue and lung development, which tissue gives the signal that starts epithelial proliferation?", ["The overlying ectoderm", "The underlying mesoderm (± neural crest)", "The notochord", "The neural tube", "The endoderm itself, autonomously"], 1, "The shared theme: underlying mesenchyme signals the overlying endoderm to proliferate and bud."], ["2", "(Low yield.) If mesodermal Noggin were knocked out under the tongue primordium, what would be predicted?", ["Endoderm overgrowth", "BMP-7 unopposed → Patched stays inhibited → reduced endodermal proliferation", "Premature thyroid descent", "Increased Patched activity", "No change"], 1, "Noggin normally inhibits BMP-7, releasing Patched to drive proliferation."], ["2", "Which organ forms by the same endodermal budding mechanism as the lung but buds only once, into two lobes?", ["Tongue", "Thyroid", "Thymus", "Parathyroid", "Pituitary"], 1, "The thyroid descends as a bilobed diverticulum; lungs keep bifurcating."], ["2", "The lining epithelium of both the tongue and the lung bud comes from which germ layer?", ["Ectoderm", "Endoderm", "Mesoderm", "Neural crest", "Neuroectoderm"], 1, "Both are endoderm driven by the underlying mesenchyme."]]}, {"lo": "04.3", "name": "The Lingual Hydra", "epithet": "Four heads, four nerves", "los": "Cranial innervation of throat and tongue", "q": [["S1", "During a difficult third-molar extraction, the lingual nerve is cut just after the chorda tympani joins it. Which deficit results on that side?", ["Loss of taste only", "Loss of general sensation only", "Loss of both taste and general sensation, anterior two-thirds", "Tongue deviation", "Loss of gag reflex"], 2, "Distal to the junction, the lingual nerve carries both V3 general sensation and VII (chorda tympani) taste fibers."], ["S1", "A patient with Bell's palsy loses taste on the anterior two-thirds of the tongue, but touch is intact. The lost fibers travel in which nerve?", ["Lingual nerve proper (V3)", "Chorda tympani (VII)", "Glossopharyngeal nerve", "Superior laryngeal nerve", "Hypoglossal nerve"], 1, "Taste anterior 2/3 = chorda tympani; general sensation = V3, which is spared."], ["S1", "After tonsillectomy, a patient has lost taste and sensation on the posterior third of the tongue and has a diminished gag reflex. Which nerve, from which arch?", ["CN V3, arch 1", "CN VII, arch 2", "CN IX, arch 3", "CN X, arch 4", "CN XII, occipital somites"], 2, "Posterior 1/3 tongue and gag afferent = CN IX, arch 3. It runs near the tonsillar bed."], ["2", "Sensation from the extreme posterior tongue (near the epiglottis) travels with a nerve that also supplies which muscle?", ["Stylopharyngeus", "Cricothyroid", "Posterior cricoarytenoid", "Genioglossus", "Tensor veli palatini"], 1, "Extreme posterior tongue = superior laryngeal branch of X (arch 4), whose motor branch supplies cricothyroid."], ["S1", "When a patient says 'ah', the uvula deviates to the right. The gag reflex is absent when the left posterior pharynx is touched but present on the right. Which nerve is damaged?", ["Left CN IX", "Left CN X", "Right CN X", "Right CN IX", "Left CN XII"], 1, "The uvula deviates away from the weak side, so the left X (efferent) is damaged. IX is afferent; a lone IX lesion wouldn't deviate the uvula."]]}, {"lo": "04.4", "name": "The Thyroglossal Wraith", "epithet": "Haunter of the descent path", "los": "Steps of thyroid development", "q": [["S1", "A 12-year-old girl has a mass at the base of the tongue. Scintigraphy shows it is her only functioning thyroid tissue. What happened?", ["The thyroglossal duct failed to obliterate", "The thyroid primordium failed to descend from the foramen cecum", "The ultimobranchial body failed to fuse", "Pouch 4 failed to form", "Cleft 2 persisted"], 1, "Lingual thyroid = failure of descent. Don't excise without confirming other thyroid tissue."], ["2", "Where is the descending thyroid located at week 6?", ["At the foramen cecum", "In front of the hyoid and laryngeal cartilages", "Anterior to the trachea", "In the anterior mediastinum", "Inside the tongue muscle"], 1, "Week 6: in front of the hyoid and laryngeal cartilages. Week 7: final position anterior to the trachea."], ["2", "PAX genes are among the major genes involved in thyroid development. What does this imply?", ["The thyroid is purely ectodermal", "Neural crest cells are involved", "The thyroid comes from pouch 2", "Mesoderm isn't involved", "The thyroid develops after birth"], 1, "High yield: PAX involvement = neural crest involvement."], ["S1", "During thyroidectomy, a surgeon notices a thin extension rising from the isthmus toward the hyoid. This represents:", ["An accessory parathyroid", "A remnant of the thyroglossal duct (pyramidal lobe)", "Ectopic thymus", "Ultimobranchial body remnant", "Branchial cleft remnant"], 1, "The pyramidal lobe is a persistent part of the thyroglossal duct."], ["2", "Which is the correct order of thyroid development?", ["Trachea → hyoid → foramen cecum", "Foramen cecum → descends on thyroglossal duct → in front of hyoid (wk 6) → anterior to trachea (wk 7)", "Pouch 4 → foramen cecum → trachea", "Hyoid → foramen cecum → trachea", "Ultimobranchial body → trachea → hyoid"], 1, "Foramen cecum → bilobed descent on the duct → wk 6 hyoid/larynx → wk 7 trachea."]]}, {"lo": "04.5", "name": "The Calcitonin Sentinel", "epithet": "Guardian of fetal bone", "los": "Function of the fetal thyroid", "q": [["2", "Fetal cells derived from the ultimobranchial body secrete a hormone at 2–3× maternal levels. What does it do?", ["Raises blood calcium by activating osteoclasts", "Prevents bone resorption, supporting bone development", "Stimulates thyroid follicle growth", "Increases renal calcium loss", "Stimulates PTH release"], 1, "C cells → calcitonin → increased calcium uptake into bone, preventing resorption."], ["S1", "A newborn's screen shows high TSH and low T4. If untreated, which picture develops?", ["Tall stature and tachycardia", "Pot belly, puffy face, protruding tongue, umbilical hernia, intellectual disability", "Hypocalcemic tetany", "Exophthalmos", "Precocious puberty"], 1, "Congenital hypothyroidism (cretinism). Thyroid hormone controls metabolism and brain development; treat early with levothyroxine."], ["2", "According to lecture, at about which week does the fetal thyroid begin functioning?", ["Week 4", "Week 7", "Weeks 14–15", "Week 28", "At birth"], 2, "Weeks 14–15 per lecture (Step 1 sources often say ~10–12)."], ["2", "Follicular cells begin producing colloid. Colloid is the source of which hormones, with what function?", ["Calcitonin — calcium", "T4 and T3 — cellular metabolism", "PTH — calcium", "TSH — thyroid growth", "Cortisol — stress"], 1, "Colloid stores thyroglobulin → T4/T3, which control cellular metabolism."]]}, {"lo": "04.6", "name": "The Five-Faced Prominence", "epithet": "Frontonasal, maxillary ×2, mandibular ×2", "los": "Formation of the face (lips, nose, cheeks)", "q": [["S1", "An infant has a cleft exactly in the midline of the upper lip, through the philtrum. Which prominences failed to merge?", ["Maxillary and medial nasal", "The two medial nasal prominences", "Maxillary and lateral nasal", "The two mandibular prominences", "Palatine shelves"], 1, "Median cleft of the upper lip = incomplete merging of the two medial nasal prominences."], ["2", "The prominence that forms the cheeks also forms which part of the upper lip?", ["The philtrum", "The lateral parts", "None of it", "The whole lip", "The vermilion only"], 1, "Maxillary prominences → cheeks (wk 8–9) and the lateral upper lip; medial nasal → philtrum."], ["2", "Which structure does NOT come from the medial nasal prominences?", ["Philtrum", "Crest and tip of the nose", "Primary palate", "Alae (sides) of the nose", "Four upper incisors"], 3, "The alae come from the lateral nasal prominences, which don't form the lip."], ["2", "A Pax3-GFP reporter lights up neural crest. Which facial structures would NOT fluoresce?", ["Maxilla and zygomatic bone", "Mandible", "Thyroid and cricoid cartilages", "Nasal bones", "Frontal bone"], 2, "Neural crest forms virtually all facial bones; thyroid and cricoid cartilages are lateral plate mesoderm."], ["2", "The nasal placodes invaginate into nasal pits. The ridges around each pit become:", ["Maxillary prominences", "Medial and lateral nasal prominences", "Palatine shelves", "Mandibular prominences", "The frontonasal prominence"], 1, "Weeks 5–8: placodes → pits → medial and lateral nasal prominences; the maxillary prominences push them medially."]]}, {"lo": "04.7", "name": "The Shelf-Splitter", "epithet": "Keeper of the palate", "los": "Formation of the palates", "q": [["S1", "A newborn has a cleft of the hard and soft palate behind the incisive foramen; the lip and alveolar ridge are intact. Which process failed?", ["Fusion of maxillary and medial nasal prominences", "Fusion of the palatine shelves", "Formation of the intermaxillary segment", "Rupture of the oronasal membrane", "Descent of the thyroid"], 1, "Isolated secondary-palate cleft = palatine shelves failed to fuse."], ["2", "The palatine shelves are outgrowths of the prominence that also forms which structure?", ["Philtrum", "Cheeks", "Nasal alae", "Chin", "Nasal bridge"], 1, "Shelves come from the maxillary prominences, which also form the cheeks."], ["S1", "A newborn has a very small mandible, a tongue that falls back into the airway, and a U-shaped cleft of the secondary palate. How does the jaw problem explain the cleft?", ["The mandible forms the palate", "The tongue couldn't drop, blocking the shelves from meeting above it", "Neural crest never reached the palate", "The oronasal membrane never ruptured", "The thyroid failed to descend"], 1, "The shelves must grow toward each other dorsal to the tongue. A small jaw keeps the tongue high (Pierre Robin sequence, Step 1)."], ["2", "At mid-week 7 the nasal and oral cavities connect behind the primary palate. What forms this connection?", ["Incisive foramen", "Primitive choana, after the oronasal membrane ruptures", "Nasolacrimal duct", "Foramen cecum", "Eustachian tube"], 1, "Nasal pits deepen (wk 6), separated by the oronasal membrane (wk 7), which ruptures → primitive choana."], ["2", "Which component of the intermaxillary segment carries the four upper incisors?", ["Labial component", "Upper jaw component", "Palatal component", "Palatine shelves", "Lateral nasal component"], 1, "Labial → philtrum · upper jaw → four incisors · palatal → primary palate."]]}, {"lo": "04.8", "name": "Ossifex", "epithet": "Forger of the skull", "los": "Neurocranium and viscerocranium", "q": [["2", "The cartilaginous neurocranium (skull base) forms by which process, from which tissue?", ["Membrane ossification of neural crest", "Endochondral ossification of paraxial and prechordal mesoderm (+ some neural crest)", "Endochondral ossification of lateral plate mesoderm", "Membrane ossification of endoderm", "Direct ossification of surface ectoderm"], 1, "Skull base = cartilage model replaced by bone (endochondral)."], ["2", "Which pairing of bone and ossification type is correct?", ["Maxilla — endochondral", "Malleus — membranous", "Maxilla — membranous (neural crest)", "Skull base — membranous", "Incus — membranous"], 2, "Viscerocranium bones like the maxilla ossify directly from neural crest; the malleus and incus are endochondral."], ["S1", "A child with achondroplasia (defective endochondral ossification) has a disproportionately large calvaria with frontal bossing. Why is the calvaria spared?", ["It forms by membranous ossification", "It forms from endoderm", "It forms after birth only", "It has no bone", "It is cartilage in adults"], 0, "The skull vault (membranous neurocranium) doesn't depend on a cartilage model; the endochondral skull base is small."], ["2", "The malleus belongs to which division of the skull, and how does it ossify?", ["Membranous neurocranium — membrane", "Cartilaginous viscerocranium — endochondral", "Cartilaginous neurocranium — endochondral", "Membranous viscerocranium — membrane", "It is not part of the skull"], 1, "Arch cartilages (Meckel's) form the cartilaginous viscerocranium; the malleus is endochondral."], ["2", "More than 100 ossification centers form 45 bones. How many bones does the mature skull have?", ["8", "14", "22", "28", "45"], 2, "They fuse into the 22 bones of the mature skull."]]}, {"lo": "04.9", "name": "Cleftmaw", "epithet": "The failure to fuse", "los": "Clinical malformations (cleft lip and others)", "q": [["S1", "A newborn has a unilateral cleft through the upper lip and alveolar ridge. This is the most common congenital malformation of the head and neck. Which fusion failed?", ["Palatine shelves", "Maxillary and medial nasal prominences", "The two medial nasal prominences", "Maxillary and lateral nasal prominences", "The two mandibular prominences"], 1, "Cleft lip ± primary palate = maxillary + medial nasal (intermaxillary segment) failure."], ["S1", "A woman with epilepsy took an antiepileptic throughout pregnancy that was specifically linked in lecture to oral clefts (2.5 vs 0.37 per 1000). Which drug?", ["Levetiracetam", "Lamotrigine", "Ethosuximide", "Gabapentin", "Folic acid"], 1, "Lamotrigine; phenobarbital, valproic acid and lithium were also named."], ["S1", "A newborn has a cleft that runs from the upper lip along the side of the nose toward the medial canthus, exposing the nasolacrimal groove. Which prominences failed to merge?", ["Maxillary and medial nasal", "Maxillary and lateral nasal", "Two medial nasal", "Frontonasal and mandibular", "Palatine shelves"], 1, "High yield: oblique facial cleft = maxillary + lateral nasal prominence."], ["S1", "A 4-year-old has a painless midline neck mass just below the hyoid that rises when she sticks out her tongue. What is it?", ["Branchial cleft cyst", "Thyroglossal duct cyst", "Cystic hygroma", "Lingual thyroid", "Dermoid cyst"], 1, "Midline + moves with tongue protrusion = remnant of the thyroglossal duct."], ["2", "Lecture says all facial clefts can ultimately be caused by problems with which cell population?", ["Pharyngeal endoderm", "Neural crest (migration or function)", "Occipital somites", "Otic placode", "Notochord"], 1, "High yield."]]}, {"lo": "04.10", "name": "The Sonographer's Shade", "epithet": "Seen only on ultrasound", "los": "Craniofacial ultrasound", "q": [["S1", "A first-trimester ultrasound shows an absent nasal bone and increased nuchal translucency. Which other finding is this fetus at increased risk for?", ["Renal agenesis", "Duodenal atresia", "Spina bifida", "Gastroschisis", "Clubfoot only"], 1, "These are trisomy 21 markers; Down syndrome is associated with duodenal atresia and AV septal defects."], ["2", "Lecture said to check ear position on the fetal face. Low-set ears suggest an abnormality of which region?", ["The otic placode only", "The pharyngeal (arch 1–2) region", "The eye fields", "The neural tube", "The thyroid"], 1, "External ears form from arches 1–2 and move up with jaw growth; deformities point to the pharyngeal region."], ["2", "On a normal fetal face ultrasound from lecture, which structure should be identifiable?", ["The thymus", "The fused maxillary process", "The palatine tonsil", "The ultimobranchial body", "The foramen cecum"], 1, "Normal views: neurocranium, viscerocranium, frontal prominence, nose, fused maxillary process."]]}]}, "18": {"key": "18", "title": "The Sensory Citadel", "lecture": "HNSS18 · Embryology of the Eye & Ear", "final": {"name": "The Sensory Colossus", "epithet": "All-seeing, all-hearing", "n": 10}, "bosses": [{"lo": "18.1", "name": "The Optic Cup Oracle", "epithet": "Two layers, one fate each", "los": "Embryologic origins of eye structures", "q": [["S1", "A 2-year-old has leukocoria and an intraocular mass. The tumor arises from cells whose embryologic origin is:", ["Outer layer of the optic cup", "Inner layer of the optic cup (neuroectoderm)", "Surface ectoderm", "Neural crest", "Paraxial mesoderm"], 1, "Retinoblastoma arises from the neural retina, the inner layer of the optic cup. Only the neural layer contains sensory cells."], ["2", "The muscle that constricts the pupil during the light reflex has the same embryologic origin as which structure?", ["Corneal stroma", "Lens", "Neural retina", "Ciliary muscle", "Sclera"], 2, "Sphincter pupillae comes from the anterior optic cup (neuroectoderm), like the retina. Ciliary muscle and corneal stroma are neural crest."], ["S1", "A 60-year-old woman has worsening blurry morning vision from failure of the corneal endothelial pump (Fuchs dystrophy). This cell layer arose from:", ["Surface ectoderm", "Neural crest", "Optic cup", "Paraxial mesoderm", "Endoderm"], 1, "Corneal stroma and endothelium are neural crest; only the corneal epithelium is surface ectoderm."], ["2", "Which structure shares its germ-layer origin with the lens?", ["Corneal epithelium", "Neural retina", "Iris stroma", "Ciliary muscle", "Optic nerve"], 0, "Both the lens and corneal epithelium come from surface ectoderm."], ["2", "Aqueous humor is secreted by an epithelium derived from which tissue?", ["Neural crest", "Optic cup (neuroectoderm)", "Surface ectoderm", "Mesoderm", "Endoderm"], 1, "The ciliary epithelium forms from the two optic-cup layers folding at ~week 15."], ["S1", "A 58-year-old has a pigmented choroidal mass. The melanocytes it arose from originated in:", ["Optic cup", "Neural crest", "Surface ectoderm", "Mesoderm", "Otic placode"], 1, "Choroidal melanocytes are neural crest derived; the choroid is rich in melanocytes."]]}, {"lo": "18.1", "name": "The Otic Hydra", "epithet": "One ear, three origins", "los": "Embryologic origins of ear structures", "q": [["S1", "A pregnant woman develops conductive hearing loss from fixation of the ossicle attached to the oval window. That ossicle came from:", ["Meckel's cartilage (arch 1)", "Reichert's cartilage (arch 2)", "The otic capsule", "Pouch 1", "Cleft 1"], 1, "Otosclerosis fixes the stapes, a Reichert's (arch 2) derivative."], ["2", "The cochlear duct is derived from which germ layer?", ["Endoderm of pouch 1", "Ectoderm (otic placode)", "Mesoderm of arch 2", "Neural crest", "Endoderm of pouch 2"], 1, "BRS: the cochlear duct is ectoderm — otic placode → otic vesicle → saccular portion."], ["2", "Which ear structure is built from all three germ layers?", ["Cochlea", "Auricle", "Tympanic membrane", "Stapes", "Eustachian tube"], 2, "Ectoderm (cleft 1), mesoderm (between) and endoderm (pouch 1)."], ["2", "The bony labyrinth surrounding the membranous labyrinth develops from:", ["The otic vesicle", "Mesenchyme around the otic vesicle (cartilaginous capsule)", "Pouch 1", "Arch 2 cartilage", "Surface ectoderm"], 1, "The otic capsule ossifies into the bony labyrinth; the otic vesicle forms the membranous labyrinth."], ["2", "The tragus comes from auricular hillock 1, which belongs to which arch?", ["Arch 1", "Arch 2", "Arch 3", "Cleft 1", "Pouch 1"], 0, "Hillocks 1–3: arch 1; 4–6: arch 2. The lobule is not from hillocks."]]}, {"lo": "18.2", "name": "The Lens Inductor", "epithet": "Commander of reciprocal signals", "los": "Developmental steps of the eye", "q": [["2", "In an experiment, the optic vesicle is removed before it contacts the surface ectoderm. Which two structures fail to form, in order?", ["Retina, then optic nerve", "Lens placode, then cornea", "Iris, then ciliary body", "Choroid, then sclera", "Eyelids, then conjunctiva"], 1, "The optic vesicle induces the lens placode; the lens (vesicle) then induces the cornea (high yield)."], ["2", "The eye fields begin in the anterior neural plate in line with which brain division, and express which gene?", ["Rhombencephalon — PAX3", "Diencephalon — PAX6", "Mesencephalon — OTX2", "Telencephalon — SHH", "Myelencephalon — PAX6"], 1, "High yield: eye fields lie in the prosencephalon, in line with the diencephalon; PAX6-expressing."], ["2", "The artery that runs in the choroid fissure largely regresses. Which part persists into adulthood?", ["The ophthalmic artery", "The central retinal artery", "The posterior ciliary arteries", "The anterior choroidal artery", "None of it"], 1, "The proximal hyaloid artery persists as the central retinal artery; the rest leaves the hyaloid canal in the vitreous."], ["S1", "A 55-year-old has flashes, floaters and a curtain over his vision. Retinal detachment separates which layers, and what is their embryologic basis?", ["Choroid from sclera — two mesenchymal layers", "Neural retina from pigment epithelium — the two layers of the optic cup", "Lens from cornea — ectoderm from neural crest", "Ganglion cells from vitreous — never fused", "Bruch's membrane from choroid — neural crest layers"], 1, "BRS: detachment occurs between the neural retina and RPE, the old intraretinal space of the optic cup."], ["2", "How does the lens reach its final size?", ["Proliferation at the anterior pole", "Proliferation at the equator", "Fusion with the cornea", "Apoptosis of lens fibers", "Invasion by neural crest"], 1, "Primary fibers fill the cavity; secondary fibers from the equator set the final size (PAX6, SOX2, MAF)."]]}, {"lo": "18.2", "name": "The Labyrinth Weaver", "epithet": "Spinner of the otic vesicle", "los": "Developmental steps of the inner, middle and external ear", "q": [["2", "Which sequence of inner ear development is correct?", ["Otic pit → placode → vesicle → ganglion", "Otic placode → otic pit → otic vesicle → statoacoustic ganglion → utricular/saccular division", "Otic vesicle → placode → pit → cochlea", "Statoacoustic ganglion → placode → vesicle", "Utricle → saccule → placode"], 1, "~Day 22 placode → 26–28 pit → 29 vesicle → 30 ganglion → 36 division; cochlear duct ~wk 9."], ["2", "The saccular portion of the otic vesicle gives rise to which sensory organ?", ["Cristae ampullares", "Organ of Corti (via the cochlear duct)", "Maculae of the utricle", "Endolymphatic sac", "Semicircular ducts"], 1, "Saccular → saccule + cochlear duct, whose epithelium becomes the Organ of Corti."], ["2", "Neuroblasts that delaminate from the otic vesicle form ganglia whose axons make up which nerve?", ["CN VII", "CN VIII", "CN IX", "CN V3", "CN X"], 1, "Statoacoustic ganglion → vestibular + spiral ganglia → CN VIII."], ["S1", "A newborn has a normal-looking auricle but no visible ear canal and conductive hearing loss on that side. Which developmental step most likely failed?", ["Formation of the otic vesicle", "Breakdown of the meatal plug (~month 7)", "Division of the saccular portion", "Formation of the tubotympanic recess", "Closure of the choroid fissure"], 1, "The meatal plug normally breaks down around month 7 to open the canal to the eardrum."], ["2", "External ears begin caudal to the jaw. What moves them to their final position?", ["Descent of the thyroid", "Growth of the lower jaw", "Closure of cleft 2", "Expansion of the tympanic cavity", "Growth of the cochlea"], 1, "Mandible growth moves the ears up. Low-set ears suggest a pharyngeal-region defect."]]}, {"lo": "18.3", "name": "The Cyclops", "epithet": "Born of lost SHH", "los": "Developmental abnormalities of eye and ear", "q": [["S1", "A stillborn infant has a single midline eye and a proboscis above it. Loss of which signal best explains this?", ["PAX6 from the eye fields", "SHH from the ventral midline", "FGF from the lens", "BMP4 from the optic cup", "Retinoic acid from the lens"], 1, "SHH normally represses PAX6 in the midline and keeps the eye fields apart; without it they merge (cyclopia, holoprosencephaly spectrum)."], ["S1", "A child has a keyhole-shaped defect at the bottom of the iris. What failed during development?", ["Regression of the pupillary membrane", "Closure of the choroid fissure", "Induction of the lens placode", "Migration of neural crest to the iris", "Separation of the eye fields"], 1, "Coloboma = incomplete closure of the choroid fissure (inferior)."], ["S1", "A 2-year-old with absent irises also has an abdominal mass and genitourinary anomalies. Which gene is involved?", ["PAX3", "PAX6 (WAGR, 11p13)", "SHH", "TCOF1" (function(){
/* ================= utilities ================= */

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

const LET=['A','B','C','D','E'];

/* ================= species index ================= */
const SP={};SPECIES.forEach((s,i)=>{s.no=i+1;SP[s.id]=s;});
const STARTERS=[

/* ================= Leitner schedule (stage = box) ================= */
const BOX_IV=[0,1,3,6,10,16,25],BOX_MAX=6,LEECH_AT=3;

/* ================= sprites (reused from Neuromon) ================= */
/* ================= sprites (procedural, original) ================= */
const spriteCache={};
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  if(f<0){r*=1+f;g*=1+f;b*=1+f;}else{r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f;}
  return '#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');}
function genGrid(key,st){
  /* Stage keeps the SAME seed, so an evolution is recognisably the same creature
     grown up — bigger body, more dendrites — rather than a different species. */
  const stg=st||1;const ck=stg>1?key+'|'+stg:key;
  if(spriteCache[ck])return spriteCache[ck];
  const r=rng(hash(key));const W=16,H=18,half=8;const g=[...Array(H)].map(()=>Array(W).fill(0));
  const wide=(.75+r()*.5)*(1+(stg-1)*.15), tall=(.55+r()*.35)*(1+(stg-1)*.11);
  for(let y=3;y<H-1;y++)for(let x=1;x<half;x++){

    const p=1.05-dx*1.05/wide-dy*dy*tall*1.1+(r()-.5)*.45;
    if(r()<p){g[y][x]=1;g[y][W-1-x]=1;}
  }
  // keep component connected to center
  const seen=new Set();const stk=[[10,7]];
  if(!g[10][7]){g[10][7]=g[10][8]=1;}
  while(stk.length){const [y,x]=stk.pop();const k=y*W+x;if(seen.has(k)||y<0||y>=H||x<0||x>=W||!g[y][x])continue;seen.add(k);stk.push([y+1,x],[y-1,x],[y,x+1],[y,x-1]);}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(g[y][x]&&!seen.has(y*W+x))g[y][x]=0;
  // dendrites
  let top=H;for(let y=0;y<H;y++)if(g[y].some(v=>v)){top=y;break;}
  const nd=1+Math.floor(r()*2)+(stg-1);
  for(let i=0;i<nd;i++){let x=2+Math.floor(r()*5);let y=top;while(y<H-1&&!g[y][x])y++;
    for(let s=0;s<3+(stg-1)&&y>0;s++){y--;if(r()<.4)x=Math.max(1,Math.min(half-1,x+(r()<.5?-1:1)));g[y][x]=g[y][x]||3;g[y][W-1-x]=g[y][W-1-x]||3;}}
  // eyes
  let eye=null;
  for(let y=top+1;y<H-4&&!eye;y++){for(const ex of [5,4,6,3]){if(g[y][ex]===1&&g[y+1][ex]===1&&g[y][ex-1]&&g[y][ex+1]&&g[y+1][ex]){eye=[y,ex];break;}}}
  const out={g,W,H,eye,hue:r(),stg};
  return spriteCache[ck]=out;
}
function spriteSVG(key,opt={}){
  const sp=SP[key];const base=sp?TYPES[sp.t].c:'#888';
  const stg=opt.stage||monStage(key);           // every render site evolves without being told to
  const {g,W,H,eye,hue}=genGrid(key,stg);
  const body=shade(base,(hue-.5)*.35), hi=shade(body,.35), lo=shade(body,-.3), acc=shade(base,.55+(stg-1)*.14), ol='#1B2033';
  const sil=opt.sil;let rects='';
  const at=(y,x)=>y>=0&&y<H&&x>=0&&x<W?g[y][x]:0;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const v=g[y][x];
    if(!v){if(at(y-1,x)||at(y+1,x)||at(y,x-1)||at(y,x+1))rects+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${sil?'#1B203355':ol}"/>`;continue;}
    let c;
    if(sil)c='#1B203340';
    else if(v===3)c=acc;
    else if(opt.back)c=!at(y+1,x)?lo:(!at(y-1,x)?body:shade(body,-.12));
    else c=!at(y-1,x)?hi:(!at(y+1,x)?lo:((x>5&&x<10&&y>11&&y<15)?shade(body,.2):body));
    rects+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/>`;
  }
  if(eye&&!opt.back&&!sil){const [y,ex]=eye;[ex,W-1-ex].forEach(x=>{rects+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#fff"/><rect x="${x}" y="${y+1}" width="1" height="1" fill="${ol}"/>`;});}
  return `<svg class="${opt.cls||'spr'}" viewBox="0 0 ${W} ${H}" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
}
const TRAINER=["...HHHH...","..HHHHHH..",".HHHHHHHH.","..SSSSSS..","..SESSES..","..SSSSSS..","...SMMS...","..WCCCCW..",".WWCCCCWW.",".SWCCCCWS.",".SWWCCWWS.","..PPPPPP..","..PP..PP..","..BB..BB.."];

/* ================= question bank ================= */
const F={
 or:{mv:'ORIGIN',hint:'Where does it come from?',lab:'Origin',stem:S=>`What does <strong>${esc(S.n)}</strong> arise from?`,rev:v=>`Which structure arises from <strong>${esc(v)}</strong>?`,chain:'what does it arise from?',desc:'arises from'},

function sameAreaFirst(S,list){const a=shuffle(list.filter(x=>x.a===S.a)),b=shuffle(list.filter(x=>x.a!==S.a));return [...a,...b];}
function fieldQ(S,k){const v=S[k];if(!v)return null;
  const pool=[...new Set(sameAreaFirst(S,SPECIES.filter(x=>x.id!==S.id&&x[k]&&x[k]!==v)).map(x=>x[k]))].slice(0,3);if(pool.length<3)return null;
  const opts=shuffle([v,...pool]);
  return {sig:'f:'+k,mv:F[k].mv,hint:F[k].hint,stem:F[k].stem(S),opts,ans:opts.indexOf(v),explain:`<p class="ans"><b>${esc(v)}</b></p>`,kind:'recall'};}

    base.explain=`<p class="ans">That structure is <b>${esc(S.n)}</b>, which ${F[a].desc} <b>${esc(S[a])}</b>.</p>`;return base;}
  return null;}
function vignQ(S){const bank=BOSS[S.lo.split('.')[0]];if(!bank)return null;const qs=[];bank.bosses.forEach(b=>{if(b.lo===S.lo)b.q.forEach(q=>qs.push(q));});if(!qs.length)return null;
  const q=pick(qs);const ord=shuffle([0,1,2,3,4]);const opts=ord.map(i=>q[2][i]);
  return {sig:'v:'+hash(q[1]),mv:q[0]==='S1'?'STEP 1 STRIKE':'2ND ORDER',hint:q[0]==='S1'?'Clinical vignette':'Two-step reasoning',stem:esc(q[1]),opts,ans:ord.indexOf(q[3]),explain:`<p class="ans"><b>${esc(q[2][q[3]])}</b></p><p>${esc(q[4])}</p>`,kind:'vignette'};}
function identifyQ(S,E){const nw=S.n.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>=4&&!['cell','cells','face'].includes(w));
  const leak=t=>{const l=t.toLowerCase();return nw.some(w=>l.includes(w));};
  let rows=['or','wk','be','nv','fx','cl','ge','rl','fa','mu','fu'].filter(k=>S[k]).map(k=>[F[k].lab,S[k]]);
  const clean=rows.filter(r=>!leak(r[1]));if(clean.length>=2)rows=clean;
  const same=shuffle(SPECIES.filter(x=>x.id!==S.id&&x.t===S.t)),near=shuffle(SPECIES.filter(x=>x.id!==S.id&&x.t!==S.t&&x.a===S.a));
  const d=[...same,...near].map(x=>x.n).filter((v,i,a)=>a.indexOf(v)===i).slice(0,4);const opts=shuffle([S.n,...d]);
  return {sig:'id',mv:'IDENTIFY',hint:'Read its record, then name it',rows,shown:E.shown,stem:'A wild Embryomon is hiding its name. Which structure has this record?',opts,ans:opts.indexOf(S.n),kind:'identify',
    explain:`<ul class="whys">${rows.map(r=>`<li><b>${esc(r[0])}:</b> ${esc(r[1])}</li>`).join('')}</ul>`};}
function nextQ(E){const S=SP[E.sp];const st=Math.max(monStage(E.sp),E.minStage||1);let cands=[];
  const add=q=>{if(q&&!E.asked.has(q.sig))cands.push(q);};
  if(st===1){S1F.forEach(k=>add(fieldQ(S,k)));['be','or','nv','fa','fx','cl'].forEach(k=>add(revQ(S,k)));}
  else if(st===2){S2F.forEach(k=>add(fieldQ(S,k)));['fa','fx','cl','be'].forEach(k=>add(revQ(S,k)));add(chainQ(S));add(chainQ(S));}
  if(st===3||(st===2&&Math.random()<.35)){for(let i=0;i<3;i++)add(vignQ(S));add(chainQ(S));}
  if(!cands.length){S1F.concat(S2F).forEach(k=>add(fieldQ(S,k)));add(chainQ(S));add(vignQ(S));}
  if(!cands.length){E.asked.clear();return nextQ(E);}
  return pick(cands);}

/* ================= encounters ================= */
function enemyLevel(){return 3+Object.keys(G.badges).length*3+Math.floor(Math.random()*4);}
function mkEnemy(sp,o={}){return {sp,hp:100,max:100,lvl:o.lvl||enemyLevel(),hidden:true,shown:2,asked:new Set(),missed:0,minStage:o.minStage||1};}
function startWild(area,patch){const keys=patchKeys(area,patch);
  const w=keys.flatMap(k=>Array((G.dex[k]==='caught'?1:G.dex[k]?2:4)+(isDue(k)?3:0)).fill(k));
  battle({kind:'wild',area,patch,queue:[mkEnemy(pick(w))]});}
function startGym(id){if(id==='summit'&&Object.keys(G.badges).filter(k=>k!=='summit').length<CHAMP_NEED)return;
  const g=GYMS[id];const pool=id==='summit'?SPECIES.map(s=>s.id):areaKeys(id);
  const pri=shuffle(pool).sort((a,b)=>(isDue(b)-isDue(a)));const team=[];
  const types=new Set();pri.forEach(k=>{if(team.length<g.size&&!types.has(SP[k].p)){team.push(k);types.add(SP[k].p);}});pri.forEach(k=>{if(team.length<g.size&&!team.includes(k))team.push(k);});
  battle({kind:'gym',gym:id,queue:team.map(k=>mkEnemy(k,{lvl:g.lvl,minStage:id==='summit'?3:2}))});}
function startReview(){const due=dueKeys().slice(0,6);if(!due.length)return;battle({kind:'review',queue:due.map(k=>mkEnemy(k))});}

let B=null;
function battle(cfg){B=Object.assign({i:0,log:[]},cfg);B.E=B.queue[0];G.enc++;persist();renderBattle(true);turn();}

function renderBattle(enter){app.innerHTML=sceneHTML(enter)+`<div class="msg" id="msg"></div><div class="qpanel" id="qp"></div>`;}
function say(t){const m=document.getElementById('msg');if(m){m.innerHTML=t+'<span class="more"></span>';m.classList.add('done');}}

function answer(i){const q=B.q,E=B.E,S=SP[E.sp],P=lead(),PS=SP[P.sp];const ok=i===q.ans;G.tot++;
  document.querySelectorAll('.move').forEach((b,j)=>{b.disabled=true;if(j===q.ans)b.style.background='var(--good-soft)';else if(j===i)b.style.background='var(--bad-soft)';});

function leadDown(){const P=G.party.find(m=>m.hp<=0&&m===G.party[0])||G.party.find(m=>m.hp<=0);
